息之声`,en:`flatus vocis`,definition:`后世归给他的公式，意指共相接近发出的声音；是否准确概括其观点有争议。`},{zh:`三神论指控`,en:`charge of tritheism`,definition:`若三个‘位格’各是独立个体，共同神性是否只剩名称？安瑟伦据此攻击其立场。`}],lineage:{inherited:`承接波爱修斯传入的波菲利共相问题与十一世纪语法—逻辑教学。`,school:`早期唯名论的象征人物，但可重建教义远少于后来的奥卡姆。`,influenced:`刺激安瑟伦和阿伯拉尔澄清共相、部分整体与神学语言。`,parallel:`与奥卡姆都拒绝额外的普遍实体，但奥卡姆有完整心灵语言、指代理论与大量原作。`},comparisons:[{target:`波爱修斯`,relation:`承接前人`,shared:`种和属究竟怎样存在的共相问题。`,difference:`罗瑟林被理解为把存在优先权更激进地交给个体与名称。`},{target:`彼得·阿伯拉尔`,relation:`影响后继`,shared:`共相必须通过语言和个体关系解释。`,difference:`阿伯拉尔批评把共相缩成物理声音，改谈语词的意义功能和个体相似状态。`},{target:`奥卡姆的威廉`,relation:`影响后继`,shared:`不承认个体之外另有共同实体。`,difference:`两者相隔两百年且无简单直线师承；奥卡姆的理论资料和逻辑工具远为丰富。`}],stars:2,culturalNotes:[{kind:`生活印象`,title:`一个主要活在反驳中的哲学家`,text:`罗瑟林提醒我们：哲学史有时由对手保存。今天熟悉的几句观点，多半来自安瑟伦和阿伯拉尔想证明他错在哪里。`}],russellView:`罗素把罗瑟林作为中世纪唯名论争的开端，强调其‘共相只是声音’以及由此引出的三神论争议。`,modernCorrection:`现代研究对这一简明画像非常谨慎：敌对转述可能把技术立场漫画化，‘唯名论’也涵盖多种不相同理论。页面因此保留问题，不补造完整体系。`,sources:[A(`第二卷第十一章〈十二世纪〉`),{label:`Internet Encyclopedia of Philosophy · Medieval Theories of Universals`,kind:`补充`,url:`https://iep.utm.edu/universa/`}]},{id:`abelard`,order:45,nameZh:`彼得·阿伯拉尔`,nameEn:`Peter Abelard`,greekName:`Petrus Abaelardus`,dates:`1079—1142`,active:`12 世纪前半叶`,places:[`布列塔尼`,`巴黎`,`埃卢瓦尔修院`,`克吕尼`],school:`十二世纪辩证哲学`,figureId:`abelard`,chapterIds:[`b2-11`],thesis:`共相不是共同实体，也不只是声音，而是语词基于个体的共同状态所承担的谓述功能；伦理责任主要取决于意图与同意。`,evidenceCaution:`作品和书信丰富，但最著名爱情叙事同时来自自传性辩护与后世整理的书信集；哲学立场跨时期变化，不能只用‘概念论’一词概括。`,lifeSummary:`阿伯拉尔从布列塔尼到巴黎挑战名师，以逻辑讲授成名。他与爱洛依丝的关系、秘密婚姻和遭阉割把私人生活推入公共传奇，此后两人分别进入宗教生活。他的《是与否》并非制造怀疑，而是把权威文本的表面冲突变成需要辨义、语境和推理解决的课堂问题。`,timeline:[{date:`约 1100—1115`,place:`巴黎`,title:`以辩证教学成名`,detail:`先后与香波的威廉等教师论争。`,certainty:`较可靠`},{date:`约 1116—1118`,place:`巴黎`,title:`与爱洛依丝的关系及阉割事件`,detail:`基本事件较可信，动机和书信传承仍有争议。`,certainty:`较可靠`},{date:`1121／1140`,place:`苏瓦松／桑斯`,title:`两次受谴责`,detail:`神学命题先后遭会议处理，晚年赴克吕尼。`,certainty:`较可靠`}],inquiries:[{object:`共相与语言`,question:`同一个谓词如何真实地述说许多个体，而不假定一个共同物体？`,start:`一个实体不能完整地同时存在于多个彼此分离的个体中，纯声音本身又没有可共同理解的内容。`,steps:[`区分声音、语词意义与所指个体`,`拒绝共同实体`,`考察个体因某种状态而相似`,`把普遍性归于语词可谓述多个对象的功能`],conclusion:`共相主要是有意义语词的语义地位；共同述说有客观根据，却不要求额外普遍物。`},{object:`伦理意图`,question:`外在行为相同，为什么道德责任可能不同？`,start:`误行、强迫、欲望与有意同意不能得到同一评价。`,steps:[`区分倾向或诱惑与同意`,`把罪定位为明知违背所信的神圣要求`,`用意图解释行为的道德性质`,`保留无知本身可能有责的复杂情况`],conclusion:`伦理判断应穿过外在结果考察主体同意和意图，但这不等于现代主观主义。`}],concepts:[{zh:`是与否`,en:`Sic et Non`,definition:`并列教父权威的表面矛盾，训练学生通过词义、作者、语境和证据层级解决冲突。`},{zh:`状态`,en:`status`,definition:`个体得以被共同谓述的客观根据，不是一件可与个体分离的普遍实体。`},{zh:`意图伦理`,en:`ethics of intention`,definition:`罪与功德不能只按外在行为分类，关键在理性主体是否同意自己认为不应做之事。`}],lineage:{inherited:`从罗瑟林、香波的威廉和波爱修斯逻辑传统继承共相问题。`,school:`十二世纪巴黎辩证教学的标志人物，连接逻辑、神学方法与伦理。`,influenced:`推动经院争辩法、问题体裁和语义分析，也因与伯尔纳的冲突呈现修院神学与学校辩证法张力。`,parallel:`与奥卡姆都重视语言和个体，但阿伯拉尔的语义框架不是十四世纪心灵语言理论的缩小版。`},comparisons:[{target:`罗瑟林`,relation:`承接前人`,shared:`拒绝把共相当作独立共同实体。`,difference:`阿伯拉尔反对把普遍性归于物理声音，转向语词意义和谓述功能。`},{target:`克莱尔沃的伯尔纳`,relation:`批评关系`,shared:`都要维护基督教真理和灵魂转化。`,difference:`阿伯拉尔信任辩证分析澄清权威；伯尔纳担心技术好奇和自信破坏信仰谦卑。`},{target:`奥卡姆的威廉`,relation:`影响后继`,shared:`共相问题应通过语言、概念与个体说明。`,difference:`奥卡姆以心灵语言、指代和简约原则建立另一套成熟理论。`}],stars:4,culturalNotes:[{kind:`轶事`,title:`阿伯拉尔与爱洛依丝`,text:`两人的爱情、秘密婚姻、暴力报复与修院书信使阿伯拉尔成为少数具有大众辨识度的经院哲学家。爱洛依丝本人也是敏锐的伦理与制度思考者，不应只作爱情故事配角。`}],russellView:`罗素欣赏阿伯拉尔的聪明、独立和辩证精神，也用他与伯尔纳的冲突象征理性探究同教会权威之间的紧张。`,modernCorrection:`《是与否》不是反宗教怀疑主义宣言，而是学校训练工具；阿伯拉尔也不是简单‘以理性反信仰’。爱情书信的编辑历史和爱洛依丝的独立声音需单独尊重。`,sources:[A(`第二卷第十一章〈十二世纪〉`),j(`Peter Abelard`,`abelard`)]},{id:`bernard-clairvaux`,order:46,nameZh:`克莱尔沃的伯尔纳`,nameEn:`Bernard of Clairvaux`,greekName:`Bernardus Claraevallensis`,dates:`1090—1153`,active:`12 世纪前半叶`,places:[`勃艮第`,`克莱尔沃`,`法国与意大利教会会议`],school:`修院神学／神秘主义`,figureId:`bernard-clairvaux`,chapterIds:[`b2-11`],thesis:`知识的最高目标不是展示聪明，而是通过谦卑与爱使意志转化；当辩证法脱离灵性生活，它会把神圣奥秘变成自我夸耀的对象。`,evidenceCaution:`书信、讲道和政治活动材料丰富，但圣人传与后世虔敬传统强化了传奇色彩；他反对阿伯拉尔不等于反对所有理性或学习。`,lifeSummary:`伯尔纳加入改革中的熙笃会，在克莱尔沃建立修院后成为欧洲最有影响力的教会顾问之一。他介入教皇分裂、异端审判与第二次十字军，也写下关于爱、谦卑和《雅歌》的精细灵修文本。他的权威同时具有道德说服、网络政治和争议性的动员力量。`,timeline:[{date:`1112/1113`,place:`熙笃`,title:`加入修道团体`,detail:`带领亲友共同入院的细节带有传记塑造。`,certainty:`较可靠`},{date:`1115`,place:`克莱尔沃`,title:`建立修院`,detail:`成为院长并形成广泛书信与修院网络。`,certainty:`较可靠`},{date:`1140`,place:`桑斯`,title:`推动审查阿伯拉尔`,detail:`将若干神学命题提交谴责，双方程序与动机仍有争论。`,certainty:`较可靠`},{date:`1146—1149`,place:`法国／德意志`,title:`鼓动第二次十字军`,detail:`远征失败使其声誉与神学解释承受压力。`,certainty:`较可靠`}],inquiries:[{object:`知识与爱`,question:`知道上帝的命题，与真正认识上帝有什么差别？`,start:`技术论证可以增加信息和名声，却不必改变骄傲的欲望。`,steps:[`以自知和谦卑拆除自我夸耀`,`区分为好奇、功利、教导和爱而求知`,`让默想从自身贫乏转向神圣恩典`,`把爱理解为意志与最高善的日益一致`],conclusion:`完整认识包含爱与人格转化；理性有位置，但不能把奥秘只变成可操纵的论题。`}],concepts:[{zh:`爱的四阶段`,en:`four degrees of love`,definition:`由为自己爱自己、为自己爱上帝，走向为上帝爱上帝，并在罕见时刻为上帝而爱自己。`},{zh:`谦卑`,en:`humility`,definition:`如实认识自身有限与依赖，是默观和正确求知的条件，不只是降低自我评价。`},{zh:`修院神学`,en:`monastic theology`,definition:`以礼仪、经文默想、讲道和生活转化为知识环境，与学校问题辩论侧重不同。`}],lineage:{inherited:`继承奥古斯丁爱的秩序、本尼狄克规程与早期修院《雅歌》解释。`,school:`十二世纪修院神学和熙笃改革的代表。`,influenced:`影响中世纪神秘主义、虔敬传统和教会政治，也成为批评学校理性自负的经典声音。`,parallel:`与波那文图拉都把知识完成于爱与心灵上升，但后者更系统吸收大学经院论证。`},comparisons:[{target:`彼得·阿伯拉尔`,relation:`批评关系`,shared:`基督教真理应当被理解并塑造生活。`,difference:`伯尔纳以谦卑、传统和默观检验理性；阿伯拉尔更相信辩证冲突能澄清命题。`},{target:`奥古斯丁`,relation:`承接前人`,shared:`爱的秩序决定灵魂方向，知识不能脱离意志。`,difference:`伯尔纳以修院讲道和亲密灵修语言展开，较少构造历史与形而上学体系。`},{target:`波那文图拉`,relation:`影响后继`,shared:`由谦卑、爱和默观走向上帝。`,difference:`波那文图拉在十三世纪大学环境中把这一路径与经院分类结合。`}],stars:3,culturalNotes:[{kind:`轶事`,title:`一次声望巨大的失败动员`,text:`伯尔纳的讲道帮助点燃第二次十字军热情，但远征惨败。他后来把失败解释为基督徒的罪，这段经历也暴露精神权威介入大规模政治暴力的危险。`}],russellView:`罗素把伯尔纳写成十二世纪强大的修院神秘主义者和阿伯拉尔的敌手：圣洁、政治影响与反智倾向在他笔下同时存在。`,modernCorrection:`将伯尔纳称为简单反理性会遗漏其严密的欲望分析和修辞策略；但也不应因灵修著作而淡化他推动谴责、迫害与十字军动员的责任。`,sources:[A(`第二卷第十一章〈十二世纪〉`),{label:`Britannica · St. Bernard of Clairvaux`,kind:`补充`,url:`https://www.britannica.com/biography/Saint-Bernard-of-Clairvaux`}]},{id:`avicenna`,order:39,nameZh:`阿维森纳`,nameEn:`Avicenna (Ibn Sina)`,greekName:`ابن سينا`,dates:`约 980—1037`,active:`11 世纪前期`,places:[`布哈拉`,`古尔甘杰`,`雷伊`,`哈马丹`,`伊斯法罕`],school:`伊斯兰逍遥学派`,figureId:`avicenna`,chapterIds:[`b2-10`],thesis:`存在本身不包含在普通事物的本质中；一切自身可能的存在者需要原因，因果链最终依赖一个本质即存在的必然存在者。`,evidenceCaution:`著作与弟子传记较丰富，但作品卷帙大、版本和译名复杂；拉丁‘阿维森纳’的接受史与伊本·西那原本的阿拉伯语体系不能完全等同。`,lifeSummary:`伊本·西那成长于中亚萨曼王朝文化圈，少年时期已学习医学、逻辑与形而上学。此后在政权更替中担任医生、行政官和学者，频繁迁徙，仍完成《医典》《治愈之书》等百科体系。他把亚里士多德、新柏拉图主义与伊斯兰神学问题重组为高度原创的存在论和心灵哲学。`,timeline:[{date:`约 997`,place:`布哈拉`,title:`进入宫廷藏书与医疗实践`,detail:`据自传，他治愈统治者后获准使用王室图书馆。`,certainty:`传统记载`},{date:`约 1015—1024`,place:`哈马丹`,title:`任医师与维齐尔`,detail:`政治任职、监禁和写作交织。`,certainty:`较可靠`},{date:`1024—1037`,place:`伊斯法罕／哈马丹`,title:`完成晚期著作并去世`,detail:`在阿拉乌丁宫廷继续写作，行军途中病逝。`,certainty:`较可靠`}],inquiries:[{object:`本质与存在`,question:`理解一件事是什么，是否已说明它现实存在？`,start:`我们能理解马、三角形或凤凰的本质，却不能只凭定义知道它们是否存在。`,steps:[`在概念上区分本质与存在`,`把普通事物归为自身可能存在`,`要求其现实存在由原因说明`,`拒绝可能原因无限倒退，归结为必然存在者`],conclusion:`受造物的存在是被赋予的，必然存在者则不从别处取得存在；这一结构深刻改变拉丁经院形而上学。`},{object:`自我意识`,question:`不依赖身体感觉时，人是否仍直接把握自己的存在？`,start:`设想一个突然完整受造、悬浮空中且无任何感官接触的人。`,steps:[`移除对身体和外物的感觉`,`检验他是否仍肯定‘我存在’`,`区分自我觉知与身体表象`,`由此讨论灵魂的非物质性`],conclusion:`‘悬浮人’会意识到自身存在而不意识到身体；它是思想实验，不是经验实验或笛卡尔怀疑的原样前身。`}],concepts:[{zh:`本质与存在`,en:`essence and existence`,definition:`事物是什么与它是否现实存在在可能者中可概念区分。`},{zh:`必然存在者`,en:`Necessary Existent`,definition:`不可能不存在、且是其他一切可能存在者的最终原因。`},{zh:`悬浮人`,en:`Flying Man`,definition:`隔离所有感觉的自我意识思想实验，用于论证灵魂对自身的直接把握。`},{zh:`意向`,en:`intention / maʿnā`,definition:`感官不仅接收形式，也把握羊对狼的敌意等不直接等同于颜色形状的意义。`}],lineage:{inherited:`承接亚里士多德逻辑、自然哲学与形而上学，也吸收新柏拉图式因果层级和伊斯兰一神论问题。`,school:`伊斯兰东方逍遥学派的体系高峰。`,influenced:`影响安萨里、苏赫拉瓦迪、伊斯兰神学，也经拉丁译本深刻塑造大阿尔伯特和阿奎那。`,parallel:`与迈蒙尼德都在亚伯拉罕一神论中吸收亚里士多德，但阿维森纳的必然存在与宇宙因果结构更具体系自主性。`},comparisons:[{target:`亚里士多德`,relation:`后世重构`,shared:`以因、形式、灵魂能力和证明组织哲学。`,difference:`阿维森纳以本质—存在和必然存在重写形而上学，并融合新柏拉图因果论。`},{target:`安萨里`,relation:`影响后继`,shared:`哲学论证必须回应创造、神知和灵魂命运。`,difference:`安萨里系统批评哲学家的永恒世界、因果必然等主张。`},{target:`托马斯·阿奎那`,relation:`影响后继`,shared:`本质—存在、可能—必然和理性灵魂是核心问题。`,difference:`阿奎那吸收这些区分，却拒绝某些流溢结构与灵魂认知理论。`}],stars:5,culturalNotes:[{kind:`例子`,title:`“悬浮人”思想实验`,text:`想象一个人出生即悬浮空中，四肢互不接触，也没有任何感官输入。阿维森纳问：他仍会不会肯定自己存在？这是中世纪最有辨识度的思想实验之一。`}],russellView:`罗素把阿维森纳与阿威罗伊列为伊斯兰哲学中必须特别说明的两人，强调其亚里士多德主义、医学声望与经拉丁翻译进入西欧的影响。`,modernCorrection:`阿维森纳不是亚里士多德的阿拉伯语注释员，而是建立了独立、长期主导的阿维森纳主义。其伊斯兰语境和波斯—中亚政治生活也不应只作为把希腊思想‘送回欧洲’的中转站。`,sources:[A(`第二卷第十章〈伊斯兰文化与哲学〉`),j(`Ibn Sina [Avicenna]`,`ibn-sina`)]},{id:`al-ghazali`,order:40,nameZh:`安萨里`,nameEn:`al-Ghazali`,greekName:`أبو حامد الغزالي`,dates:`约 1058—1111`,active:`11 世纪末至 12 世纪初`,places:[`图斯`,`巴格达`,`大马士革`,`耶路撒冷`],school:`伊斯兰神学／苏非思想`,figureId:`al-ghazali`,chapterIds:[`b2-10`],thesis:`哲学家的证明必须逐项接受检验；自然规律描述稳定次序，却不能把受造事件变成脱离上帝意志的必然联系。`,evidenceCaution:`自传与大量著作传世，但精神危机叙述具有教导目的；他批评特定形而上学结论，并不拒绝逻辑、数学、医学或全部哲学。`,lifeSummary:`安萨里在内沙布尔学习，后任巴格达尼扎米亚学院教授。1095 年经历信仰与动机危机，离开显赫职位游历并过苏非生活，晚年回到图斯。他在《哲学家的宗旨》中准确陈述哲学，在《哲学家的不一致》中批评二十项命题，再以《宗教学科的复兴》重建知识、实践和内在德性。`,timeline:[{date:`1091`,place:`巴格达`,title:`任尼扎米亚学院教授`,detail:`成为塞尔柱世界最显赫的教法与神学教师之一。`,certainty:`较可靠`},{date:`1095`,place:`巴格达`,title:`精神危机并离职`,detail:`自述失语、无法进食，最终放弃职位；动机兼有宗教与政治环境。`,certainty:`较可靠`},{date:`约 1106`,place:`内沙布尔／图斯`,title:`短暂复教并退居`,detail:`完成自传与晚期教学，1111 年去世。`,certainty:`较可靠`}],inquiries:[{object:`因果性`,question:`火接触棉花后燃烧，是逻辑必然，还是上帝通常创造的稳定并行？`,start:`经验显示火与燃烧恒常相随，却没有直接观察到一个不可分离的必然纽带。`,steps:[`区分事件相继与逻辑必然`,`保留上帝在每一事件中的自由创造`,`承认稳定习惯使科学预测可能`,`用可能例外为奇迹留下空间`],conclusion:`自然因果不拥有独立强制上帝的必然性；但安萨里是否完全否认受造因，现代解释仍有分歧。`}],concepts:[{zh:`哲学家的不一致`,en:`Incoherence of the Philosophers`,definition:`针对法拉比—阿维森纳传统二十项形而上学主张的技术批评，不是反对一切理性学科。`},{zh:`偶因论问题`,en:`occasionalism`,definition:`事件联系是否完全由上帝每次直接创造；安萨里文本也容纳二级因解释，标签需谨慎。`},{zh:`确定性危机`,en:`crisis of certainty`,definition:`自传中对感官、理性、权威和内在动机的层层审查，最终把知识与灵性实践联系。`}],lineage:{inherited:`受艾什尔里神学、伊斯兰法学、阿维森纳哲学与苏非实践共同塑造。`,school:`逊尼派神学与苏非伦理综合的核心人物。`,influenced:`改变伊斯兰哲学的论题和证明标准，并促使阿威罗伊写《不一致的不一致》回应。`,parallel:`常与休谟比较因果批判，但安萨里以神圣全能、创造和奇迹为中心，休谟则分析经验推断习惯。`},comparisons:[{target:`阿维森纳`,relation:`批评关系`,shared:`逻辑证明可以检验形而上学主张。`,difference:`安萨里拒绝世界永恒、神只知普遍者等结论，并削弱自然因果的独立必然性。`},{target:`阿威罗伊`,relation:`批评关系`,shared:`哲学与启示的关系需要精确论证。`,difference:`阿威罗伊反驳安萨里，维护亚里士多德因果与哲学证明的合法性。`},{target:`大卫·休谟`,relation:`同题比较`,shared:`从经验相继本身不能读出必然联系。`,difference:`安萨里诉诸上帝自由和习惯秩序；休谟诉诸人的心理习惯并悬置神学解释。`}],stars:4,culturalNotes:[{kind:`例子`,title:`火真的“必须”烧棉花吗？`,text:`安萨里用火与棉花追问：我们看到的是接触后燃烧，还是看到火自身具有不可违背的力量？这个普通场景成为哲学史最著名的因果例子之一。`}],russellView:`罗素称安萨里为敌视哲学的神学家，并以他攻击自然必然性说明伊斯兰正统对哲学的反击。`,modernCorrection:`‘反哲学’过于简单。安萨里熟练使用逻辑，准确重述哲学家体系，只判定其中少数命题触犯信仰；其批评本身是高水平哲学论证，也没有让伊斯兰哲学就此终止。`,sources:[A(`第二卷第十章〈伊斯兰文化与哲学〉`),j(`al-Ghazali`,`al-ghazali`)]},{id:`averroes`,order:41,nameZh:`阿威罗伊`,nameEn:`Averroes (Ibn Rushd)`,greekName:`ابن رشد`,dates:`1126—1198`,active:`12 世纪后半叶`,places:[`科尔多瓦`,`塞维利亚`,`马拉喀什`],school:`安达卢西亚亚里士多德主义`,figureId:`averroes`,chapterIds:[`b2-10`],thesis:`示范性证明与经文真理不可能真正冲突；合格者在字面产生矛盾时应作解释，而不同认识能力的人需要不同论证方式。`,evidenceCaution:`阿拉伯原作部分失传，许多只存希伯来文或拉丁文；拉丁‘阿威罗伊主义’的单一理智、双重真理论未必准确代表伊本·鲁世德本人。`,lifeSummary:`伊本·鲁世德出生于科尔多瓦法官家庭，兼任法官、宫廷医师和哲学家。他为亚里士多德写短、中、长三类注释，回应安萨里，并在《决定性论述》中论证哲学研究对有能力者是宗教法要求。晚年一度失宠、著作受限，随后部分复职。`,timeline:[{date:`1169`,place:`塞维利亚`,title:`任法官并开始系统注释`,detail:`受伊本·图斐利引荐进入穆瓦希德宫廷学术圈。`,certainty:`较可靠`},{date:`1182`,place:`马拉喀什`,title:`任宫廷医师`,detail:`继承伊本·图斐利职位，并继续司法任职。`,certainty:`较可靠`},{date:`1195—1198`,place:`卢塞纳／马拉喀什`,title:`失宠、复职与去世`,detail:`政治与宗教原因交织，不能只解释为单纯‘哲学受迫害’。`,certainty:`较可靠`}],inquiries:[{object:`哲学与经文`,question:`严格证明若与经文字面意义不同，信徒必须放弃哪一方？`,start:`真理不可能反对真理，但经文面向不同理解能力的共同体。`,steps:[`由经文要求思考受造物推出哲学研究的合法性`,`区分示范、辩证和修辞论证`,`仅在证明成立时解释表面冲突的经文`,`限制高难解释向不具训练者传播`],conclusion:`哲学和启示在真理上统一，在表达与受众上分层；这不是两个互相矛盾的真理。`},{object:`理智`,question:`抽象普遍知识如何既具有共同有效性，又被具体个人思考？`,start:`若理智完全是个体身体形式，普遍对象似乎随个体化；若完全共同，个人认识又难解释。`,steps:[`区分质料理智、能动理智与想象表象`,`把可理解形式从个体表象中抽象`,`让共同理智保证知识普遍性`,`以个人想象和认知活动解释‘我的思考’`],conclusion:`理智统一论试图兼顾普遍知识与个人活动，却引发拉丁世界关于个人不朽和责任的巨大争论。`}],concepts:[{zh:`决定性论述`,en:`Decisive Treatise`,definition:`以伊斯兰法学方式论证哲学研究的宗教合法性及解释经文的条件。`},{zh:`注释者`,en:`the Commentator`,definition:`拉丁中世纪对阿威罗伊的称号，反映其亚里士多德长篇注释的权威。`},{zh:`理智统一`,en:`unity of the intellect`,definition:`人类共享分离的质料理智的解释；其确切版本及个人认识机制仍有争议。`}],lineage:{inherited:`继承亚里士多德、亚历山大注释传统和安达卢西亚哲学，也直接回应安萨里。`,school:`安达卢西亚伊斯兰逍遥学派及拉丁阿威罗伊主义的源头。`,influenced:`经希伯来文、拉丁文译本影响大阿尔伯特、阿奎那、拉丁激进亚里士多德主义和文艺复兴。`,parallel:`与迈蒙尼德同在科尔多瓦文化背景并处理哲学—律法，但各自在伊斯兰与犹太法传统内工作。`},comparisons:[{target:`安萨里`,relation:`批评关系`,shared:`哲学命题必须接受严密证明和神学检验。`,difference:`阿威罗伊捍卫自然因果和哲学证明，写《不一致的不一致》逐项回应。`},{target:`托马斯·阿奎那`,relation:`影响后继`,shared:`亚里士多德是自然与形而上学的核心资源。`,difference:`阿奎那大量吸收注释，却反驳人类只有一个理智。`},{target:`迈蒙尼德`,relation:`同题比较`,shared:`哲学真理与宗教律法不能最终冲突，困难文本需要解释。`,difference:`阿威罗伊更明确捍卫亚里士多德证明；迈蒙尼德以写作隐微性与负神学处理共同体风险。`}],stars:5,culturalNotes:[{kind:`生活印象`,title:`欧洲人眼中的“注释者”`,text:`中世纪拉丁作者常只写“哲学家”指亚里士多德，写“注释者”便指阿威罗伊。一个十二世纪科尔多瓦人的阅读，长期决定欧洲大学怎样理解希腊哲学。`}],russellView:`罗素把阿威罗伊视为比阿维森纳更严格的亚里士多德主义者，强调理智统一、哲学解释经文与其在基督教欧洲远大于伊斯兰世界的后续影响。`,modernCorrection:`‘双重真理’通常是拉丁对手给激进亚里士多德主义者的标签，不是阿威罗伊本人主张两套矛盾真理。其法官、医师与穆瓦希德政治语境也应进入解释。`,sources:[A(`第二卷第十章〈伊斯兰文化与哲学〉`),j(`Ibn Rushd [Averroes]`,`ibn-rushd`)]},{id:`maimonides`,order:42,nameZh:`迈蒙尼德`,nameEn:`Maimonides`,greekName:`משה בן מימון`,dates:`1138—1204`,active:`12 世纪后半叶`,places:[`科尔多瓦`,`非斯`,`福斯塔特`,`开罗`],school:`犹太亚里士多德主义`,figureId:`maimonides`,chapterIds:[`b2-01`,`b2-10`],thesis:`上帝不属于受造物的分类，肯定属性容易把神变成复合对象；人更可靠地知道上帝不是什么，并以律法、哲学与审慎解释引导不同能力的读者。`,evidenceCaution:`法律、哲学、医学著作和书信丰富，但《迷途指津》有意采用隐微写法；不能假定每一处表面矛盾都只是疏忽，也不能自信破解唯一秘密教义。`,lifeSummary:`迈蒙尼德出生于安达卢西亚犹太家庭，因穆瓦希德统治迁往北非和埃及，最终在福斯塔特担任社群领袖与宫廷医师。他以《密西拿托拉》系统整理犹太律法，以阿拉伯语《迷途指津》帮助受哲学教育却受经文字面困扰的读者。`,timeline:[{date:`1148 以后`,place:`安达卢西亚—北非`,title:`家族迁徙`,detail:`穆瓦希德扩张迫使家庭离开科尔多瓦，具体宗教处境仍有争论。`,certainty:`较可靠`},{date:`1168`,place:`福斯塔特`,title:`完成《密西拿托拉》前期工作`,detail:`逐渐成为埃及犹太社群的法律权威。`,certainty:`较可靠`},{date:`约 1190`,place:`福斯塔特`,title:`完成《迷途指津》`,detail:`以阿拉伯语写给受哲学困惑的学生约瑟夫。`,certainty:`较可靠`}],inquiries:[{object:`神圣属性`,question:`说上帝‘智慧、强大、良善’，会不会把多个性质加到绝对统一者身上？`,start:`普通肯定谓词把主词归入共同类别，似乎令上帝与受造物共享性质。`,steps:[`拒绝把属性当作上帝内部附加成分`,`把部分肯定语句解释为行动属性`,`以否定逐步排除身体、有限和缺陷`,`承认认识增长常表现为知道哪些说法不适用`],conclusion:`关于神本质，否定语言比同义肯定更安全；人的最高知识包含对自身认识限度的认识。`}],concepts:[{zh:`否定属性`,en:`negative attributes`,definition:`通过否认缺陷和受造分类谈论上帝，避免把共同谓词当作神人同义。`},{zh:`迷途者`,en:`the perplexed`,definition:`既忠于律法又接受哲学证明，因二者表面冲突而困惑的受教育读者。`},{zh:`隐微写作`,en:`esoteric writing`,definition:`按读者能力控制困难真理的表达，以矛盾、暗示和章节次序保护共同体与学习过程。`}],lineage:{inherited:`继承犹太经文、拉比法学、阿拉伯语哲学和亚里士多德传统。`,school:`中世纪犹太哲学与法律思想的核心人物。`,influenced:`影响犹太哲学、基督教经院哲学和后世负神学，也引发长期反迈蒙尼德争论。`,parallel:`与阿威罗伊同样生活在安达卢西亚哲学世界，但迈蒙尼德的社群法律工程和写作策略更突出。`},comparisons:[{target:`亚历山大的斐洛`,relation:`后世重构`,shared:`调和犹太经文与希腊哲学，反对粗糙神人同形论。`,difference:`迈蒙尼德以亚里士多德和阿拉伯哲学为框架，法律系统化的地位也更核心。`},{target:`阿威罗伊`,relation:`同题比较`,shared:`律法面向共同体，哲学证明面向受训练者，真理不应最终冲突。`,difference:`迈蒙尼德对创世证明保持审慎，并以负神学和隐微写作处理不确定性。`},{target:`托马斯·阿奎那`,relation:`影响后继`,shared:`神圣单纯性、属性类比和理性讨论律法。`,difference:`阿奎那发展肯定性的类比语言；迈蒙尼德对本质属性的否定更严格。`}],stars:5,culturalNotes:[{kind:`生活印象`,title:`白天行医，夜晚回信`,text:`迈蒙尼德在书信中描述自己白天为宫廷和病人诊疗，回家后仍被求医者包围，常到夜间才有时间处理社群与学术事务。哲学、法律和照护在他身上不是分开的职业。`}],russellView:`罗素把迈蒙尼德列为犹太哲学中最重要的人物，强调其亚里士多德主义、负神学、创世问题和《迷途指津》对阿奎那的影响。`,modernCorrection:`不能只把迈蒙尼德当作希腊哲学传向基督教欧洲的桥。他首先在犹太法律、社群治理和阿拉伯语思想世界中工作；其哲学立场也因隐微写法存在多种竞争解释。`,sources:[A(`第二卷第一、十章`),j(`Maimonides`,`maimonides`)]},{id:`albert-great`,order:47,nameZh:`大阿尔伯特`,nameEn:`Albert the Great`,greekName:`Albertus Magnus`,dates:`约 1200—1280`,active:`13 世纪中叶`,places:[`帕多瓦`,`巴黎`,`科隆`,`雷根斯堡`],school:`多明我会经院哲学`,figureId:`albert-great`,chapterIds:[`b2-12`,`b2-13`],thesis:`新进入拉丁世界的亚里士多德自然与形而上学必须被完整理解、分类和检验，而不能仅凭权威接受或因异教来源拒绝。`,evidenceCaution:`著作很多且归属复杂，科学观察与传说常被混合；‘发明机器人’和魔法师形象是后世传奇。`,lifeSummary:`阿尔伯特加入多明我会，在巴黎和科隆教学，托马斯·阿奎那是其学生。他撰写覆盖逻辑、自然学、生物学、心理学、伦理与神学的释义，帮助拉丁学界第一次系统消化完整亚里士多德及阿拉伯注释传统，并保持对植物、动物和矿物的经验兴趣。`,timeline:[{date:`约 1245`,place:`巴黎`,title:`任神学硕士`,detail:`在大学环境中讲授并开始大规模亚里士多德释义。`,certainty:`较可靠`},{date:`1248`,place:`科隆`,title:`建立多明我会学术中心`,detail:`阿奎那随行学习。`,certainty:`较可靠`},{date:`1260—1262`,place:`雷根斯堡`,title:`任主教后辞职`,detail:`短期承担教区治理，之后重返教学与调解。`,certainty:`较可靠`}],inquiries:[{object:`自然哲学的自主性`,question:`基督教学者应怎样面对来自异教和伊斯兰传统、却带有强大解释力的自然知识？`,start:`简单禁止会失去论证工具，照单全收又可能与创造和灵魂教义冲突。`,steps:[`先按学科完整陈述亚里士多德`,`区分哲学证明与神学启示的方法`,`比较阿维森纳、阿威罗伊等注释`,`以观察和论证修正具体自然主张`],conclusion:`哲学各学科有相对自主的方法，神学仍提供更高目的与不能由自然理性独立获得的真理。`}],concepts:[{zh:`亚里士多德释义`,en:`Aristotelian paraphrase`,definition:`不只逐句注释，而是按拉丁读者需要重述学科整体并加入阿拉伯材料与本人判断。`},{zh:`学科区分`,en:`distinction of sciences`,definition:`自然学、形而上学与神学按对象和证明原则区分，避免每个问题直接诉诸经文。`},{zh:`经验自然研究`,en:`empirical natural inquiry`,definition:`在植物、动物与矿物著作中重视亲见和报告，但仍处在亚里士多德框架内。`}],lineage:{inherited:`通过拉丁译本承接亚里士多德、阿维森纳、阿威罗伊，也受多明我会神学训练。`,school:`十三世纪多明我会亚里士多德主义的开拓者。`,influenced:`直接培养阿奎那，并为大学接受自然哲学与形而上学建立百科基础。`,parallel:`与罗杰·培根都重视自然和语言知识；阿尔伯特偏百科释义，培根更强调实验、数学与改革计划。`},comparisons:[{target:`阿维森纳`,relation:`承接前人`,shared:`自然、灵魂与形而上学形成系统科学。`,difference:`阿尔伯特在拉丁基督教大学中评估并重组阿维森纳体系。`},{target:`阿威罗伊`,relation:`承接前人`,shared:`亚里士多德注释是哲学研究核心。`,difference:`阿尔伯特拒绝某些理智统一和宇宙永恒解释。`},{target:`托马斯·阿奎那`,relation:`影响后继`,shared:`区分哲学与神学方法并广泛吸收亚里士多德。`,difference:`阿奎那把材料压缩成更统一的存在、因果和自然法体系。`}],stars:3,culturalNotes:[{kind:`轶事`,title:`会说话的铜头传说`,text:`后世传说阿尔伯特制造了会回答问题的机械铜头，甚至被阿奎那砸毁。这更像大众对其百科知识和‘自然魔法’想象的投影。`,caveat:`没有可靠同期证据。`}],russellView:`罗素把大阿尔伯特与阿奎那并列为把亚里士多德完整纳入天主教思想的关键人物，但认为学生的体系与历史影响更大。`,modernCorrection:`阿尔伯特不是阿奎那的预备草稿。他有独立的自然哲学、神秘主义和学科观；‘经验科学先驱’也不应直接等同于近代实验科学。`,sources:[A(`第二卷第十二至十三章`),j(`Albert the Great`,`albert-great`)]},{id:`aquinas`,order:48,nameZh:`托马斯·阿奎那`,nameEn:`Thomas Aquinas`,greekName:`Thomas Aquinas`,dates:`约 1225—1274`,active:`13 世纪中叶`,places:[`罗卡塞卡`,`巴黎`,`科隆`,`那不勒斯`,`奥尔维耶托`],school:`多明我会经院哲学`,figureId:`aquinas`,chapterIds:[`b2-12`,`b2-13`],thesis:`恩典不摧毁自然而使其完成；理性可从受造效果认识上帝存在与部分属性，启示则给予超出自然证明的三位一体与救赎真理。`,evidenceCaution:`作品、审判材料和早期传记丰富，但‘一次神秘体验后认为作品如稻草’的含义不可确定；托马斯主义也有多个后世版本。`,lifeSummary:`阿奎那出身意大利贵族家庭，不顾家族反对加入新兴多明我会，师从大阿尔伯特，在巴黎和意大利教学。他以问题、反对、回应和答辩的格式处理神学全体，在《反异教大全》《神学大全》中把亚里士多德哲学、教父传统与基督教教义组织成影响最持久的经院体系。`,timeline:[{date:`约 1244`,place:`那不勒斯／罗马`,title:`加入多明我会`,detail:`家族曾将他扣留，希望阻止选择托钵修会。`,certainty:`较可靠`},{date:`1252—1259`,place:`巴黎`,title:`首度执教`,detail:`卷入托钵修会在大学的地位争论。`,certainty:`较可靠`},{date:`1265—1273`,place:`罗马／巴黎／那不勒斯`,title:`写作《神学大全》`,detail:`作品未完成，于 1273 年底停止写作。`,certainty:`较可靠`},{date:`1274`,place:`福萨诺瓦`,title:`赴里昂会议途中去世`,detail:`享年约四十九岁。`,certainty:`较可靠`}],inquiries:[{object:`从运动到第一原因`,question:`世界中的变化是否要求一个不以同样方式被推动的第一根源？`,start:`变化是潜能在已实现者作用下成为现实，同一事物不能在同一方面同时以同一方式既潜在又现实。`,steps:[`从实际变化而非抽象定义出发`,`分析推动者与被推动者的依赖`,`拒绝此刻依赖的本质序列无限后退`,`指向不受推动的第一推动者`],conclusion:`五路不是五种竞争神话，而是由不同依赖结构指向第一原因；从第一原因到基督教上帝仍需后续论证。`},{object:`自然法`,question:`普遍善怎样进入具体人的实践判断？`,start:`人具有共同倾向，却在可变情境中行动。`,steps:[`以‘行善避恶’为实践理性的首要原则`,`从生命、家庭、真理与社会倾向展开一般规范`,`用审慎把一般原则应用于个别处境`,`承认人为法需服务共同善并受更高法衡量`],conclusion:`自然法是理性受造者参与永恒法，不是一张无需判断即可机械执行的规则表。`}],concepts:[{zh:`五路`,en:`Five Ways`,definition:`从运动、有效因、可能与必然、程度和目的秩序出发的五种后验论证。`},{zh:`存在之实现`,en:`act of being / esse`,definition:`事物不仅有本质形式，还实际存在；阿奎那用存在活动说明受造参与和神圣根源。`},{zh:`类比语言`,en:`analogical predication`,definition:`‘善、智慧、存在’用于神和受造物时既非完全同义也非毫无关系。`},{zh:`自然法`,en:`natural law`,definition:`实践理性对共同善秩序的参与，需要德性和审慎完成具体判断。`}],lineage:{inherited:`承接亚里士多德、大阿尔伯特、奥古斯丁、阿维森纳、阿威罗伊与迈蒙尼德。`,school:`十三世纪多明我会经院哲学和托马斯主义的中心。`,influenced:`影响天主教神学、自然法、德性伦理与当代分析托马斯主义，也长期受到方济各会和唯名论批评。`,parallel:`与波那文图拉都在巴黎处理信仰和理性，但阿奎那更信任亚里士多德自然知识的稳定自主性。`},comparisons:[{target:`大阿尔伯特`,relation:`承接前人`,shared:`完整吸收亚里士多德和阿拉伯注释传统。`,difference:`阿奎那建立更紧密的存在论、自然法与神学综合。`},{target:`阿威罗伊`,relation:`批评关系`,shared:`亚里士多德理智论需要与知识普遍性协调。`,difference:`阿奎那坚持每个人有自己的理智灵魂，反驳单一共同理智。`},{target:`邓斯·司各脱`,relation:`影响后继`,shared:`经院问题体系、创造论和德性伦理。`,difference:`司各脱批评存在类比与个体化解释，强调存在单义和意志自由。`}],stars:5,culturalNotes:[{kind:`轶事`,title:`“沉默的牛”`,text:`同学因托马斯身材魁梧而沉默，称他“西西里的哑牛”。传说大阿尔伯特预言，这头牛的吼声终将传遍世界。`,caveat:`来自早期传记传统，适合表现后世形象，不是课堂录音式史实。`}],russellView:`罗素称阿奎那为最伟大的经院哲学家，承认其体系清晰、完整且成功调和亚里士多德与天主教，却批评其结论预先由正统规定，因而不具完全自由的哲学冒险。`,modernCorrection:`罗素的‘先有答案再找论据’低估了阿奎那对权威冲突、自然知识和反对意见的真实开放，也容易忽略其存在论原创性；但制度正统确实规定了不可放弃的教义边界。`,sources:[A(`第二卷第十三章〈圣托马斯·阿奎那〉`),j(`Saint Thomas Aquinas`,`aquinas`)]},{id:`roger-bacon`,order:49,nameZh:`罗杰·培根`,nameEn:`Roger Bacon`,greekName:`Rogerus Bacon`,dates:`约 1214—约 1292`,active:`13 世纪中后期`,places:[`牛津`,`巴黎`],school:`方济各会自然哲学`,figureId:`roger-bacon`,chapterIds:[`b2-14`],thesis:`权威、习惯与译本错误会累积知识障碍；数学、语言和实验经验应共同校正哲学、神学与实际技术。`,evidenceCaution:`生平、监禁时间与原因并不完全确定；他并未发明现代实验方法，也不能把火药、望远镜等所有预言都当作亲自制造。`,lifeSummary:`罗杰·培根在牛津、巴黎学习并教授亚里士多德自然哲学，后来加入方济各会。应教皇克莱孟四世要求，他秘密而迅速地写成《大著作》《小著作》《第三著作》，提出语言、数学、光学、实验科学和道德哲学协同改革知识与教会。`,timeline:[{date:`1240 年代`,place:`巴黎／牛津`,title:`学习与讲授自然哲学`,detail:`接触新译亚里士多德、阿拉伯光学与数学材料。`,certainty:`较可靠`},{date:`1266—1268`,place:`巴黎`,title:`为教皇写三部改革著作`,detail:`在修会限制下完成庞大知识计划。`,certainty:`较可靠`},{date:`1270—1280 年代`,place:`方济各会机构`,title:`争议与可能监禁`,detail:`确有纪律处分线索，但‘因科学被囚十年’过于简化。`,certainty:`推定`}],inquiries:[{object:`知识纠错`,question:`学术传统为何会在人人引用权威时持续积累错误？`,start:`劣质翻译、盲从习惯、公众偏见和假装知道会彼此强化。`,steps:[`识别权威、习惯、偏见、伪知识四类障碍`,`学习希伯来语、希腊语和阿拉伯语核对文本`,`以数学保证数量和光学推理`,`以经验确认、制造和纠正论证`],conclusion:`知识改革不是一句‘做实验’，而是语言、数学、仪器、观察与道德目的协同。`}],concepts:[{zh:`经验科学`,en:`scientia experimentalis`,definition:`验证其他科学结论、发现仅凭推理未知之事并制造实际效果的知识。`},{zh:`知识四障碍`,en:`four causes of error`,definition:`脆弱权威、长期习惯、无知大众意见与用智慧外表掩盖无知。`},{zh:`语言改革`,en:`linguistic reform`,definition:`直接学习原文语言，以减少圣经、哲学和科学翻译链造成的系统错误。`}],lineage:{inherited:`承接格罗斯泰斯特的光学与数学传统、阿拉伯光学、亚里士多德自然哲学和方济各会改革关怀。`,school:`十三世纪方济各会自然哲学与知识改革计划。`,influenced:`后世常把他塑造成现代科学先驱；更准确的影响在光学、语言学习和中世纪科学史自我反思。`,parallel:`与大阿尔伯特都扩大自然研究，罗杰更集中批评翻译、数学不足和缺乏经验验证。`},comparisons:[{target:`大阿尔伯特`,relation:`同题比较`,shared:`自然知识需要广泛吸收亚里士多德与阿拉伯材料。`,difference:`阿尔伯特以百科释义和观察见长；罗杰把语言、数学和实验编成改革方案。`},{target:`哲罗姆`,relation:`后世重构`,shared:`原文语言是校正传统错误的必要条件。`,difference:`罗杰将其扩展到大学课程、科学、传教和教会改革。`},{target:`奥卡姆的威廉`,relation:`同题比较`,shared:`同属方济各会并批评知识体系中的多余假设。`,difference:`罗杰重实验、数学与语言；奥卡姆重逻辑语义、认识限度和政治权威。`}],stars:4,culturalNotes:[{kind:`轶事`,title:`“罗杰修士的铜头”`,text:`英国传说把罗杰·培根写成制造会说话铜头的魔法师。真实的培根确实讨论光学、火药和机械可能性，但传奇把知识改革者改造成巫师。`,caveat:`铜头故事没有可靠历史证据。`}],russellView:`罗素把罗杰·培根写成少见重实验、数学和原文语言的中世纪思想家，赞赏其科学精神，也突出他因独立和神秘声誉与修会冲突。`,modernCorrection:`把他称为孤独的现代科学家穿越到中世纪会误读其目标：实验服务于神学、历法、传教和教会改革。他依赖权威传统，只是要求更好地校验权威。`,sources:[A(`第二卷第十四章〈方济各会经院哲学家〉`),j(`Roger Bacon`,`roger-bacon`)]},{id:`bonaventure`,order:50,nameZh:`波那文图拉`,nameEn:`Bonaventure`,greekName:`Bonaventura`,dates:`约 1217—1274`,active:`13 世纪中叶`,places:[`巴尼奥雷焦`,`巴黎`,`里昂`],school:`方济各会奥古斯丁主义`,figureId:`bonaventure`,chapterIds:[`b2-14`],thesis:`世界、心灵与经文都是通向上帝的痕迹；哲学知识必须在照明、爱和心灵超越自身的旅程中完成，而不是封闭为自足体系。`,evidenceCaution:`著作与行政记录较丰富；‘反亚里士多德’标签过强，他广泛使用亚里士多德逻辑与自然概念，主要拒绝哲学的自足和世界永恒。`,lifeSummary:`波那文图拉加入方济各会，在巴黎与阿奎那大致同时教学，后来任修会总会长，调和内部贫穷实践争论。他的《心灵通向上帝的旅程》以感官世界、内在心灵和超越观照构成六阶段上升，把经院分类与方济各灵性生活结合。`,timeline:[{date:`约 1243`,place:`巴黎`,title:`加入方济各会并学习神学`,detail:`师从哈勒斯的亚历山大传统。`,certainty:`较可靠`},{date:`1257`,place:`巴黎`,title:`获神学教席并任总会长`,detail:`与阿奎那一同得到大学承认。`,certainty:`较可靠`},{date:`1274`,place:`里昂`,title:`参加大公会议并去世`,detail:`此前被任命为枢机。`,certainty:`较可靠`}],inquiries:[{object:`心灵上升`,question:`有限心灵如何由世界中的多样事物走向不可把握的上帝？`,start:`受造物既不是上帝，又在秩序、美和能力中留下源头痕迹。`,steps:[`在外部世界阅读神的痕迹`,`进入感官与心灵能力的映像`,`在记忆、理解、意志中辨认三一结构`,`超越概念，在爱与黑暗中安息`],conclusion:`哲学知识是旅程中的必要阶段，却只有在爱和自我超越中完成。`}],concepts:[{zh:`痕迹与形象`,en:`vestige and image`,definition:`万物以因果秩序留下上帝痕迹，理性心灵则以记忆、理解、意志更直接地成为形象。`},{zh:`神圣照明`,en:`divine illumination`,definition:`确定真理依赖心灵参与不变的神圣规则，不只是自然抽象。`},{zh:`心灵旅程`,en:`journey of the mind`,definition:`由世界、内在心灵到超越上帝的认识—爱之路径。`}],lineage:{inherited:`继承奥古斯丁照明论、伪狄奥尼修上升结构、伯尔纳修院灵修和方济各贫穷理想。`,school:`十三世纪方济各会经院哲学的系统代表。`,influenced:`影响方济各会神学、神秘主义与后来关于知识照明和创造范型的争论。`,parallel:`与阿奎那同时把大学哲学纳入神学，但对亚里士多德自足性与照明需要评价不同。`},comparisons:[{target:`奥古斯丁`,relation:`承接前人`,shared:`从受造痕迹和心灵内在结构上升，以照明确保真理。`,difference:`波那文图拉把路径编成方济各式六阶段旅程。`},{target:`克莱尔沃的伯尔纳`,relation:`承接前人`,shared:`知识完成于爱、谦卑和默观。`,difference:`波那文图拉在巴黎大学语境中给予逻辑和学科分类更明确位置。`},{target:`托马斯·阿奎那`,relation:`同题比较`,shared:`哲学与神学可协同，但启示超越自然理性。`,difference:`波那文图拉更强调照明、范型和历史回归，警惕永恒世界的亚里士多德主义。`}],stars:4,culturalNotes:[{kind:`生活印象`,title:`把世界当成一本可阅读的书`,text:`在波那文图拉那里，石头、光、记忆和欲望都不只是对象，也像指向作者的字迹。‘阅读世界’因此同时是一种知识方法和精神练习。`}],russellView:`罗素把波那文图拉归为方济各会较保守、较奥古斯丁主义的一翼，强调其神秘倾向及对亚里士多德世界永恒论的敌意。`,modernCorrection:`他不是以神秘主义替代论证，而是把逻辑、自然知识和形而上学安放在一条有终点的道路上。与阿奎那的差别也不能简化为柏拉图对亚里士多德。`,sources:[A(`第二卷第十四章〈方济各会经院哲学家〉`),j(`Saint Bonaventure`,`bonaventure`)]},{id:`duns-scotus`,order:51,nameZh:`邓斯·司各脱`,nameEn:`John Duns Scotus`,greekName:`Ioannes Duns Scotus`,dates:`约 1265/66—1308`,active:`13 世纪末至 14 世纪初`,places:[`苏格兰`,`牛津`,`巴黎`,`科隆`],school:`方济各会经院哲学`,figureId:`duns-scotus`,chapterIds:[`b2-14`],thesis:`形而上学若要证明关于上帝的结论，‘存在’必须以某种单义核心适用于有限者与无限者；个体之所以是这个个体，还需不可还原的此性。`,evidenceCaution:`著作文本史复杂，许多讲义由学生整理，旧版还混入伪作；其精微论证常被‘意志主义者’‘反托马斯’等标签压扁。`,lifeSummary:`司各脱是方济各会神学家，在牛津、巴黎和科隆短暂而高强度地教学。1303 年因拒绝支持法王反对教皇而离开巴黎，后复返取得教席，1308 年在科隆早逝。他围绕存在、个体化、认识、自由和圣母始胎无染原罪提出精密区分。`,timeline:[{date:`约 1290 年代`,place:`牛津`,title:`讲授《命题集》`,detail:`形成《牛津著作》的多层修订文本。`,certainty:`较可靠`},{date:`1303`,place:`巴黎`,title:`因政治忠诚离开`,detail:`拒绝签署支持腓力四世反教皇立场，后获准返回。`,certainty:`较可靠`},{date:`1307—1308`,place:`科隆`,title:`教学并去世`,detail:`死因不明，活埋传说没有可靠依据。`,certainty:`较可靠`}],inquiries:[{object:`个体化`,question:`两个同属一种的人为何不只是同一形式的可互换副本？`,start:`共同人性说明相似，却不说明这个苏格拉底为何就是不可重复的这个人。`,steps:[`拒绝以共同本性自身说明个体`,`承认共同本性在自身不普遍也不个别`,`加入收缩本性的最终个体差异`,`把它称为此性而非可分离的另一物`],conclusion:`此性使共同本性成为这个不可重复个体；个体性具有正面形而上学地位。`},{object:`自由意志`,question:`自由是否只是在已判断为最好的选项面前自动行动？`,start:`若理智判断必然决定选择，意志就只是认知结果的执行器。`,steps:[`区分自然倾向与意志能力`,`主张意志可对相反方案保持同步可能`,`让理智提供对象而不完全决定选择`,`以自我决定解释责任和偶然性`],conclusion:`自由包含当下选择相反项的真实能力，意志不是理智判断的被动终点。`}],concepts:[{zh:`存在的单义性`,en:`univocity of being`,definition:`至少一个共同概念核心可同样用于神与受造物，使形而上学推理不在中途换义。`},{zh:`此性`,en:`haecceity`,definition:`使共同本性收缩为这个不可重复个体的最终个体差异。`},{zh:`形式区别`,en:`formal distinction`,definition:`同一实体内不同形式内容的区别，强于纯概念区分、弱于两个可分离事物。`},{zh:`同步偶然性`,en:`synchronic contingency`,definition:`行动发生的同一时刻，意志仍具有选择相反项的能力。`}],lineage:{inherited:`承接方济各会奥古斯丁主义、阿维森纳本质论和阿奎那经院问题体系。`,school:`晚期十三世纪方济各会经院哲学与司各脱主义的源头。`,influenced:`影响奥卡姆、苏亚雷斯、近代模态与个体性讨论，也形成长期司各脱主义学派。`,parallel:`与阿奎那在许多问题共享框架，差异集中于存在语言、个体化、神知与意志自由。`},comparisons:[{target:`托马斯·阿奎那`,relation:`批评关系`,shared:`存在、个体、自由与神学语言需要统一形而上学。`,difference:`司各脱以存在单义、此性和更强意志偶然性修正托马斯式类比与个体化。`},{target:`阿维森纳`,relation:`承接前人`,shared:`共同本性在自身不因概念定义而现实存在。`,difference:`司各脱以形式区别和此性重构本性怎样成为具体个体。`},{target:`奥卡姆的威廉`,relation:`影响后继`,shared:`重视个体、意志自由与逻辑精确。`,difference:`奥卡姆拒绝司各脱许多形式区别和共同本性装置，采取更激进的本体简约。`}],stars:4,culturalNotes:[{kind:`生活印象`,title:`“笨蛋帽”原本来自一位“精微博士”`,text:`司各脱的追随者因维护繁复经院论证，在近代人文主义者笔下变成 dunce（笨蛋）的词源；讽刺的是，他本人在中世纪称号正是“精微博士”。`}],russellView:`罗素强调司各脱是方济各会中反托马斯的一方，重视意志优先、个体化和关于上帝存在的论证，也把他的精微视为经院哲学晚期特征。`,modernCorrection:`司各脱不是走向衰败的繁琐过渡。他关于单义、模态、此性和同步自由的论证在当代形而上学中仍具可讨论性；‘意志主义’也不能意味着任性。`,sources:[A(`第二卷第十四章〈方济各会经院哲学家〉`),j(`John Duns Scotus`,`duns-scotus`)]},{id:`ockham`,order:52,nameZh:`奥卡姆的威廉`,nameEn:`William of Ockham`,greekName:`Guillelmus de Ockham`,dates:`约 1287—1347`,active:`14 世纪前半叶`,places:[`牛津`,`阿维尼翁`,`比萨`,`慕尼黑`],school:`唯名论／方济各会经院哲学`,figureId:`ockham`,chapterIds:[`b2-14`,`b2-15`],thesis:`解释不应无必要地增加实体；只有个体在世界中存在，共相是心灵符号的自然指称功能，而非个体之外的共同物。`,evidenceCaution:`‘如无必要，勿增实体’不是其作品中固定出现的原句；剃刀是多种中世纪简约原则的后世名称。其被逐出教会的确切法律状态也有技术争议。`,lifeSummary:`奥卡姆是英国方济各会士，在牛津讲授但未完成神学硕士程序。被召到阿维尼翁审查神学观点时，他卷入方济各会绝对贫穷与教皇权力争论，1328 年逃离并投靠皇帝路易四世，在慕尼黑写作政治论著。其逻辑、认识论和政治思想共同限制不必要权威。`,timeline:[{date:`约 1317—1324`,place:`牛津／伦敦`,title:`讲授与写作逻辑神学`,detail:`形成《逻辑大全》和《命题集注释》等核心材料。`,certainty:`较可靠`},{date:`1324`,place:`阿维尼翁`,title:`接受教义审查`,detail:`多个命题被委员会调查，程序持续多年。`,certainty:`较可靠`},{date:`1328`,place:`阿维尼翁—比萨`,title:`逃离教廷`,detail:`与方济各会总会长同行，转而寻求皇帝保护。`,certainty:`较可靠`},{date:`约 1347`,place:`慕尼黑`,title:`去世`,detail:`可能死于黑死病前后，年份仍有小幅争议。`,certainty:`推定`}],inquiries:[{object:`共相与符号`,question:`一个概念怎样代表许多个体，却不需要共同实体？`,start:`若假设现实共相，会增加难以说明的实体和个体化问题。`,steps:[`只承认苏格拉底等个体在世界中存在`,`把概念理解为心灵语言中的自然符号`,`用指代理论说明同一概念可站在多个对象位置`,`按解释需要拒绝多余的种属实体`],conclusion:`普遍性属于符号的可指称方式，而不属于一个额外的普遍物；逻辑分析替代本体增殖。`},{object:`政治权威`,question:`教皇是否拥有不受限制的属灵与世俗权力？`,start:`绝对权力会威胁福音自由、财产权争论中的良心和世俗共同体秩序。`,steps:[`区分正常管辖与紧急权力主张`,`允许教皇可能陷入异端和错误`,`让教会共同体、会议或世俗权威在危机中纠正`,`以信徒自由限制纯粹专断`],conclusion:`教皇权威不是无限的；异端与暴政情况下存在纠正和抵抗空间。`}],concepts:[{zh:`奥卡姆剃刀`,en:`Ockham's razor`,definition:`在解释充分时不无必要增加实体或假设；是方法约束，不保证最简单理论必真。`},{zh:`心灵语言`,en:`mental language`,definition:`先于约定口语的概念符号系统，其项自然指称世界中的个体。`},{zh:`直观认识`,en:`intuitive cognition`,definition:`使主体能判断对象是否存在及其偶然事实的认识方式，与抽象认识相区分。`},{zh:`唯名论`,en:`nominalism`,definition:`拒绝现实共相并用符号功能说明普遍谓述；不等于认为分类全是任意名字。`}],lineage:{inherited:`承接阿伯拉尔以来语言分析、司各脱的个体与自由问题以及方济各会贫穷争论。`,school:`十四世纪唯名论、逻辑与方济各会政治思想的中心人物。`,influenced:`影响晚期中世纪逻辑、自然哲学、教会政治和后世简约方法论，但近代科学并非由一把剃刀直接产生。`,parallel:`与马西略都限制教皇权力；奥卡姆从信徒权利和异端纠正出发，马西略从政治共同体和立法权出发。`},comparisons:[{target:`邓斯·司各脱`,relation:`承接前人`,shared:`个体优先、意志自由和精密模态分析。`,difference:`奥卡姆拒绝共同本性、此性与形式区别等实体性装置。`},{target:`彼得·阿伯拉尔`,relation:`后世重构`,shared:`用语言与概念功能解决共相问题。`,difference:`奥卡姆拥有成熟的心灵语言、指代和推论理论。`},{target:`帕多瓦的马西略`,relation:`同题比较`,shared:`教皇不拥有无限世俗强制权。`,difference:`奥卡姆保留较强教会制度并强调权利与纠错；马西略把强制立法权归于公民整体。`}],stars:5,culturalNotes:[{kind:`名言`,title:`“如无必要，勿增实体”`,text:`这句常用来解释奥卡姆剃刀：能用较少假设说明时，不要平白增加看不见的东西。`,caveat:`流行拉丁公式不是奥卡姆作品中的固定原句，也不是‘最简单答案必然正确’。`}],russellView:`罗素把奥卡姆视为经院综合解体和近代精神出现的标志：唯名论削弱神学证明，政治著作反对教皇绝对权力，哲学重新获得相对独立。`,modernCorrection:`‘最后的经院哲学家／第一个现代人’是有力但线性的叙事。奥卡姆仍深处方济各神学与中世纪逻辑，其简约原则也不是经验科学的万能口号。`,sources:[A(`第二卷第十四至十五章`),j(`William of Ockham`,`ockham`)]},{id:`marsilius-padua`,order:53,nameZh:`帕多瓦的马西略`,nameEn:`Marsilius of Padua`,greekName:`Marsilius Patavinus`,dates:`约 1275/80—约 1342`,active:`14 世纪前半叶`,places:[`帕多瓦`,`巴黎`,`纽伦堡`,`慕尼黑`],school:`中世纪政治哲学`,figureId:`marsilius-padua`,chapterIds:[`b2-14`,`b2-15`],thesis:`政治法律的有效强制权来自公民整体或其较有分量部分；教士可教导与施行圣礼，却不因神职自动拥有独立强制管辖。`,evidenceCaution:`《和平保卫者》文本明确，但‘人民主权’‘民主主义’都是现代近似词；其公民整体、较有分量部分与皇帝角色不等同于普选民主。`,lifeSummary:`马西略受过医学训练，曾任巴黎大学校长。他与让丹的约翰合写或合作形成《和平保卫者》，在教皇约翰二十二世与皇帝路易四世冲突中逃往帝国宫廷。著作把教会权力争论转成法律来源、共同善与社会和平的制度分析。`,timeline:[{date:`1313`,place:`巴黎`,title:`任巴黎大学校长`,detail:`显示其位于医学、自然哲学与政治网络交点。`,certainty:`较可靠`},{date:`1324`,place:`巴黎`,title:`完成《和平保卫者》`,detail:`著作匿名流传，很快被认定具有激进反教皇含义。`,certainty:`较可靠`},{date:`1326`,place:`巴黎—纽伦堡`,title:`逃往路易四世宫廷`,detail:`与让丹的约翰一同遭教皇谴责。`,certainty:`较可靠`},{date:`1328`,place:`罗马`,title:`参与皇帝意大利行动`,detail:`在废立教皇的政治实验中承担宣传与教会安排角色。`,certainty:`较可靠`}],inquiries:[{object:`法律与和平`,question:`谁有权制定可强制执行的政治法律，才能避免相互竞争的最高权威破坏和平？`,start:`教皇若主张独立且最高的强制权，便与城市、王国和帝国法律产生双重主权冲突。`,steps:[`把共同体自足生活与和平设为政治目的`,`将立法者定义为公民整体或其较有分量部分`,`让政府执行由立法者授权的法律`,`把教士职能限制为教导、圣礼和无强制裁判`],conclusion:`世俗政治共同体是强制法的来源；教会争议应由代表信徒的普遍会议处理。`}],concepts:[{zh:`人类立法者`,en:`human legislator`,definition:`公民整体或其较有分量部分，是政治强制法的直接有效原因。`},{zh:`和平`,en:`peace / tranquillity`,definition:`各社会部分按其职能协调运作的秩序，是政治共同体充分生活的条件。`},{zh:`教会无强制权`,en:`non-coercive priesthood`,definition:`教士以教导和圣礼服务灵魂，今世强制惩罚需由政治立法者授权。`},{zh:`大公会议主义`,en:`conciliarism`,definition:`普遍会议代表信徒共同体，可在教义和治理危机中高于单个教皇。`}],lineage:{inherited:`继承亚里士多德政治共同体分析、巴黎自然哲学与帝国—教皇冲突经验。`,school:`十四世纪世俗与会议主义政治哲学。`,influenced:`影响后期会议主义、反教皇论争与近代国家思想的某些资源，但不存在直线通往民主国家。`,parallel:`与奥卡姆共同投靠路易四世并反对教皇绝对权力，论证基础和教会观却不相同。`},comparisons:[{target:`亚里士多德`,relation:`后世重构`,shared:`城邦是为充分生活形成的部分秩序，共同善需要法律。`,difference:`马西略在拉丁基督教双重权威冲突中重写立法者与强制权。`},{target:`奥卡姆的威廉`,relation:`同题比较`,shared:`教皇权力可犯错且不应吞并世俗政治。`,difference:`马西略更彻底取消教士独立强制权，强调公民立法者和会议。`},{target:`米兰的安布罗斯`,relation:`同题比较`,shared:`教会与政治权力的边界决定公共秩序。`,difference:`安布罗斯以主教纪律约束皇帝；马西略反向限制教士强制权。`}],stars:4,culturalNotes:[{kind:`生活印象`,title:`一位从大学校长变成政治流亡者的医生`,text:`马西略受医学训练、做过巴黎大学校长，最终因一本政治书逃到皇帝宫廷。他把社会失调写得像身体各部分争夺功能造成的疾病。`}],russellView:`罗素把马西略视为远超时代的政治思想家，赞赏其人民立法、会议高于教皇和教会不应有强制权等主张，并把他纳入教皇制衰落叙事。`,modernCorrection:`‘民主先驱’需要限制：其公民共同体排除范围很大，‘较有分量部分’可能容纳精英结构，对路易四世的支持也不是现代世俗共和国方案。`,sources:[A(`第二卷第十四至十五章`),j(`Marsilius of Padua`,`marsilius-padua`)]}],M=e=>({label:`罗素《西方哲学史》${e}`,kind:`原书`,url:`https://www.russell-j.com/cool/HWP_1945.pdf`}),de=[{id:`thales`,order:1,nameZh:`泰勒斯`,nameEn:`Thales of Miletus`,greekName:`Θαλῆς`,dates:`约前 625—前 546`,active:`约前 585 年前后`,places:[`米利都`,`爱奥尼亚`,`埃及（传统记载）`],school:`米利都学派`,figureId:`thales`,chapterIds:[`b1-02`],thesis:`用一种自然本原解释多样世界：重要的不只是“水”这个答案，而是世界可以从世界内部得到说明。`,evidenceCaution:`没有可确认的著作传世。我们主要通过希罗多德、亚里士多德及更晚作者认识他；具体事迹常带有“七贤”式传奇色彩。`,lifeSummary:`泰勒斯生活在小亚细亚西岸的商业城邦米利都。这里连接爱琴海、吕底亚、埃及和巴比伦知识网络，同时经历贵族、商人和僭主之间的政治变动。古代传统把他列为“希腊七贤”之一，并赋予他天文、几何、工程和政治建议等多重身份。罗素把这种跨文化、商业性的城市环境视为米利都自然研究得以出现的重要条件。与后世留下完整著作的哲学家不同，泰勒斯更像一个由少数命题和大量见证拼成的历史起点。`,timeline:[{date:`约前 625`,place:`米利都`,title:`出生与成长`,detail:`年代由后世编年推定；身处海上贸易与多文明知识交汇的爱奥尼亚。`,certainty:`推定`},{date:`前 585`,place:`吕底亚—米底战场`,title:`日食预言传统`,detail:`希罗多德说他预告了发生在战争中的日食；现代研究通常怀疑他是否可能精确预报地点和日期。`,certainty:`传统记载`},{date:`6 世纪前期`,place:`米利都／埃及`,title:`几何与测量活动`,detail:`传说他由埃及引入几何，并用影长测量金字塔、以三角测量估算海上船距；具体归属并不确定。`,certainty:`传统记载`},{date:`前 546 前后`,place:`爱奥尼亚`,title:`生命末期`,detail:`吕底亚被波斯征服，米利都进入新的政治环境；传统编年常把他的去世置于这一时期。`,certainty:`推定`}],inquiries:[{object:`自然本原`,question:`纷繁事物是否能由一种共同东西说明？`,start:`生命、营养、种子和湿润之间似乎存在稳定联系；水又能呈现多种状态。`,steps:[`从多样事物中寻找共同成分`,`把生成理解为自然材料的变化`,`不再用神祇的临时干预填补每个现象`],conclusion:`水被视为万物的本原。即使答案粗糙，这种解释形式已经把宇宙当作一个内在、自行运作的系统。`},{object:`运动与生命`,question:`无生命的东西为什么能够产生运动？`,start:`磁石能在没有可见推动者的情况下吸引铁。`,steps:[`把自发运动与灵魂联系`,`由磁石推测自然物具有内在动力`,`将神性理解为遍布自然，而非只从外部介入`],conclusion:`亚里士多德转述他认为磁石有灵魂、万物充满神。这不是成熟论证，却保存了“自然自身含有运动原则”的直觉。`}],concepts:[{zh:`本原`,en:`archē`,definition:`事物从何而来、由何构成并凭什么持续的第一原则。“本原”这一术语主要是亚里士多德用来整理早期思想的框架。`},{zh:`水`,en:`water as primary stuff`,definition:`既是可观察的物质，又承担统一解释的角色；重点是用较少的自然假设解释较多现象。`},{zh:`有灵的自然`,en:`ensouled nature`,definition:`自然物的运动不必总由外在人格神推动；动力可能属于事物自身。这个解释仍混合着早期神性语言。`}],lineage:{inherited:`继承的是爱奥尼亚的航海测量、巴比伦天文周期与埃及实用几何，而不是一套已经成形的哲学体系。`,school:`后世把泰勒斯、阿那克西曼德和阿那克西美尼归为米利都学派：共享自然本原、宇宙生成和非人格化解释，但未必存在严格的学校组织。`,influenced:`阿那克西曼德延续“单一本原”的问题，却反对以已知元素作最终基础；阿那克西美尼又返回具体元素，并补上变化机制。`,parallel:`与赫西俄德同样解释宇宙起源，却由神族谱系转向自然材料；与后来的唯物论都追问物质基础，但不能因此说近代唯物论直接源于泰勒斯。`},comparisons:[{target:`赫西俄德`,relation:`同题比较`,shared:`都试图给宇宙一个起源秩序。`,difference:`赫西俄德以神的出生和冲突叙述起源；泰勒斯把解释压缩为自然材料及其变化。`},{target:`阿那克西曼德`,relation:`影响后继`,shared:`世界需要一个统一的生成原则。`,difference:`泰勒斯选择可见的水；阿那克西曼德认为任何已知元素都会偏向自身，故改用无规定的“无限者”。`},{target:`毕达哥拉斯`,relation:`同题比较`,shared:`都寻找多样现象背后的统一秩序。`,difference:`泰勒斯从物质与观察出发；毕达哥拉斯传统更重数、比例、灵魂与净化生活。`}],russellView:`罗素说泰勒斯更值得作为科学家而非现代意义的哲学家受到尊重。他把“万物由水构成”当作大胆但并非愚蠢的科学假说，也反复提醒可确知材料太少。对罗素而言，真正的历史价值不在答案正确，而在这种粗糙假说能够刺激观察、争论和后续修正。`,modernCorrection:`现代研究比罗素更谨慎地处理日食预言：前 585 年确有适合的日食，古代也确有预言记载，但泰勒斯掌握何种方法无法确定。“万物是水”同样主要经亚里士多德重构，不能当作泰勒斯留下的完整原文体系。`,sources:[M(`第一卷第二章〈米利都学派〉`),{label:`Stanford Encyclopedia · Presocratic Philosophy`,kind:`补充`,url:`https://plato.stanford.edu/entries/presocratics/`},{label:`Internet Encyclopedia of Philosophy · Thales`,kind:`补充`,url:`https://iep.utm.edu/thales/`}]},{id:`anaximander`,order:2,nameZh:`阿那克西曼德`,nameEn:`Anaximander`,greekName:`Ἀναξίμανδρος`,dates:`约前 610—前 546`,active:`6 世纪中叶`,places:[`米利都`,`黑海殖民网络`,`斯巴达（传统记载）`],school:`米利都学派`,figureId:`anaximander`,chapterIds:[`b1-02`],thesis:`已知元素彼此对立，不能有任何一种无限支配其他元素；万物应从更抽象、无规定的“无限者”生成。`,evidenceCaution:`据说写过散文著作《论自然》，现仅有一小段可能接近原文的残句。其地图、日晷和殖民活动都来自后世见证，细节不可完全确认。`,lifeSummary:`阿那克西曼德是米利都公民，传统上被称为泰勒斯的学生或同伴。他处在吕底亚与波斯势力扩张、爱奥尼亚城邦持续殖民和航海的时期。后世称他率领过前往黑海沿岸阿波罗尼亚的殖民行动，制作过已知世界地图，并把圭表带入希腊；这些记载共同显示他的知识与实际定向、时间测量及城邦空间有关。他可能是最早用散文系统书写自然研究的希腊思想家之一，但著作本身几乎全部失传。`,timeline:[{date:`约前 610`,place:`米利都`,title:`出生`,detail:`后世编年据其前 546 年约六十四岁反推；确切年份未知。`,certainty:`推定`},{date:`6 世纪中叶`,place:`黑海沿岸`,title:`殖民与地理活动`,detail:`传说他领导米利都殖民者建立阿波罗尼亚，并绘制有人居住世界的地图。`,certainty:`传统记载`},{date:`6 世纪中叶`,place:`米利都／斯巴达`,title:`天文测量`,detail:`据说设置圭表，用影子判断时刻与季节；工具来自更早的巴比伦传统，贡献更可能是引入和应用。`,certainty:`传统记载`},{date:`约前 546`,place:`米利都`,title:`《论自然》与生命末期`,detail:`据推定曾以散文讨论宇宙、地理和生命起源；只有经辛普里丘转述的一段残句留存。`,certainty:`推定`}],inquiries:[{object:`第一原则`,question:`如果元素相互对立，哪一种能够成为共同本原？`,start:`水、火、气、土具有互相排斥的性质；若其中一种无限强大，其余早已被消灭。`,steps:[`接受泰勒斯的单一本原问题`,`比较已知元素之间的对立`,`排除任何带有确定性质的元素`,`把本原提升为无边界、无规定且不衰老的来源`],conclusion:`本原是“无限者”：它不是简单的无限空间，而是无法由现成元素限定、又能持续产生世界的根源。`},{object:`宇宙秩序与变化`,question:`对立元素不断争胜，为什么世界没有崩溃？`,start:`冷热、干湿等力量会扩张并侵占彼此，但季节和生成毁灭呈现循环。`,steps:[`无限者内部具有永恒运动`,`冷热等对立力量分离`,`对立物在时间中轮流占优`,`越界者通过反向变化向另一方作出补偿`],conclusion:`变化受时间与比例约束；“正义”不是人格神判决，而是自然系统恢复平衡的秩序。`},{object:`地球与生命`,question:`地球为何不坠落，人类又怎样进入自然史？`,start:`若地球必须由别物支撑，就会产生新的支撑问题；人类幼年期过长，似乎无法以现状独立起源。`,steps:[`地球与各方向等距，因此无理由向一边移动`,`天体环绕地球形成完整路径`,`生命由受太阳作用的湿润环境产生`,`早期人类曾寄生于鱼形动物，成熟后才登上陆地`],conclusion:`宇宙与生命都通过自然生成解释，而不是一次性的创造事件；具体模型虽错误，解释目标却高度统一。`}],concepts:[{zh:`无限者`,en:`apeiron`,definition:`没有边界或确定性质、不会衰老耗尽的本原。它既避免某一元素垄断，又为无数生成过程保留来源。`},{zh:`对立者`,en:`opposites`,definition:`热与冷、干与湿等具有作用力的性质；可见世界由它们的分离、侵占与转化构成。`},{zh:`宇宙正义`,en:`cosmic justice`,definition:`对立力量依时间秩序为越界付出补偿。它把政治—伦理词汇转化为非人格化的自然规律。`},{zh:`无支撑地球`,en:`unsupported earth`,definition:`地球因与各方向等距而保持原位，不再需要海、柱或巨兽支撑；这是用对称性终止解释倒退。`}],lineage:{inherited:`从泰勒斯继承“以一个自然原则解释整个宇宙”的问题，也继承米利都航海、测量与跨文化观察的实践背景。`,school:`属于米利都自然哲学，但把具体物质假说推进到抽象原则，并第一次留下可辨认的宇宙秩序论证。`,influenced:`阿那克西美尼保留单一本原，却认为“无限者”缺少变化机制；赫拉克利特继续使用对立与正义语言，但把冲突本身视为秩序。后来的宇宙模型也继承其无外部支撑的解释方向。`,parallel:`与现代演化论共享“生命有自然生成史”这一问题形式，却没有遗传、选择等机制，不能把他称为现代进化论者。`},comparisons:[{target:`泰勒斯`,relation:`承接前人`,shared:`用单一本原统一解释生成世界。`,difference:`泰勒斯选取水；阿那克西曼德用元素冲突论证，本原必须不等同于任何已知元素。`},{target:`阿那克西美尼`,relation:`影响后继`,shared:`宇宙从一个持续存在的来源演化。`,difference:`阿那克西曼德的来源抽象但机制含混；阿那克西美尼以气的凝聚和稀释提供可观察的变化机制。`},{target:`赫拉克利特`,relation:`同题比较`,shared:`都用对立、时间和正义解释世界秩序。`,difference:`阿那克西曼德把越界后的补偿视为平衡；赫拉克利特则认为张力和争斗本身就是生成秩序。`}],russellView:`罗素明确说阿那克西曼德比泰勒斯“更有趣”。他着重重建了一个排除论证：若水、火等任何已知元素是无限的，它就会征服其他元素，因此本原必须在宇宙冲突中保持中性。罗素也赞赏其无创造论的宇宙演化、动物起源假说、地图和科学好奇心，评价他“原创处都是科学而理性的”。`,modernCorrection:`“无限者”究竟指空间无限、时间不尽、性质未定还是不可经验，仍有争议。现存残句的边界也不确定。地图、圭表和殖民领导等事迹应写作古代传统，而不应像完整履历一样陈述；但这些传统可靠地反映了后人眼中他兼具宇宙论与测量实践的形象。`,sources:[M(`第一卷第二章〈米利都学派〉`),{label:`Stanford Encyclopedia · Presocratic Philosophy`,kind:`补充`,url:`https://plato.stanford.edu/entries/presocratics/`},{label:`Internet Encyclopedia of Philosophy · Anaximander`,kind:`补充`,url:`https://iep.utm.edu/anaximander/`}]},{id:`anaximenes`,order:3,nameZh:`阿那克西美尼`,nameEn:`Anaximenes of Miletus`,greekName:`Ἀναξιμένης`,dates:`约前 586—前 528`,active:`6 世纪中叶`,places:[`米利都`,`爱奥尼亚`],school:`米利都学派`,figureId:`anaximenes`,chapterIds:[`b1-02`],thesis:`以气为统一材料，以稀释和凝聚为变化机制：性质差异可以由连续、定量的过程产生。`,evidenceCaution:`生平几乎空白，年代也来自后世推定。著作没有保存，哲学主要经泰奥弗拉斯托斯传统和晚期摘述重建。`,lifeSummary:`阿那克西美尼是米利都三人组中最晚的一位，通常被说成阿那克西曼德的同伴或学生。他活动时的爱奥尼亚正承受吕底亚覆灭、波斯统治和城邦紧张；罗素只敢断言他晚于阿那克西曼德，并早于前 494 年波斯镇压爱奥尼亚起义时米利都被毁。关于旅行、政治活动和私人交往，没有足够材料可写。其历史位置主要由理论显示：他既不满足于泰勒斯只有“材料答案”，也不满足于阿那克西曼德过于抽象的来源，而要说明同一种材料怎样连续变成可见世界。`,timeline:[{date:`约前 586`,place:`米利都`,title:`出生`,detail:`传统年代差异较大；较稳妥的说法只是他活跃于前六世纪中叶。`,certainty:`推定`},{date:`前 550 前后`,place:`米利都`,title:`与阿那克西曼德的学术关系`,detail:`泰奥弗拉斯托斯传统称他是阿那克西曼德的同伴或学生；严格师承无法证实。`,certainty:`传统记载`},{date:`6 世纪中叶`,place:`米利都`,title:`自然论写作`,detail:`据说用朴素爱奥尼亚散文写作，集中讨论气、物质变化、气象和宇宙形成；文本已失。`,certainty:`传统记载`},{date:`前 528 前后`,place:`米利都`,title:`去世`,detail:`常见年代来自后世编年；可以确认的相对关系是其活动早于前 494 年米利都毁灭。`,certainty:`推定`}],inquiries:[{object:`本原与生命`,question:`哪种本原既无处不在，又能解释生命和宇宙的统一？`,start:`气通常不可见、范围难定，却以呼吸维持生命；它比水更普遍，又比“无限者”更可经验。`,steps:[`选取遍布环境的气作为材料`,`以呼吸—灵魂维持身体作类比`,`把同一关系扩大到气包围并维持整个宇宙`],conclusion:`气既是万物材料，也是世界保持整体的生命性原则；自然与生命仍处于同一解释层。`},{object:`物质变化`,question:`同一种材料怎样产生火、水、土和石等相反性质？`,start:`空气受压、吹拂、蒸发和结露会呈现冷热、疏密变化；毛毡制作也展示压缩产生新性质。`,steps:[`稀释使气变为火`,`逐步凝聚使气成为风、云、水`,`继续凝聚成为土与石`,`用疏密程度把多种物质排入连续序列`],conclusion:`可见的性质差异来自稀释和凝聚的数量差异。这是米利都学派第一次较明确地给出变化机制。`},{object:`宇宙与气象`,question:`天地和常见气象能否使用同一机制解释？`,start:`若气的疏密过程普遍有效，就不应只解释少数物质。`,steps:[`凝聚的气形成扁平大地`,`大地像叶片一样由气托住`,`太阳、月亮和星体由稀薄或燃烧物形成`,`云、雨、雹、雪同样按凝聚程度说明`],conclusion:`一个低成本机制跨越物质、气象和宇宙领域；模型错误，但解释具有可重复性和统一性。`}],concepts:[{zh:`气`,en:`aēr`,definition:`无处不在、通常不可见又能成为呼吸的基本材料；兼有可观察性与近似无限的范围。`},{zh:`稀释`,en:`rarefaction`,definition:`气变得更疏、更热并趋向火的过程；把质的变化解释为密度下降。`},{zh:`凝聚`,en:`condensation`,definition:`气依次成为风、云、水、土、石的连续压缩过程；把多种材料排列在同一尺度上。`},{zh:`呼吸类比`,en:`breath analogy`,definition:`人的灵魂作为气维持身体，宇宙之气也包围并维持世界。它连接个体生命经验与整体宇宙论。`}],lineage:{inherited:`接受泰勒斯的物质一元论和阿那克西曼德的宇宙生成问题；其气同时吸收了“具体元素”与“范围无定”两种要求。`,school:`作为米利都学派第三人，他最突出的贡献不是换了一个本原名称，而是提供稀释—凝聚这一可复用机制。`,influenced:`其连续物质转化影响后来的赫拉克利特、阿那克萨哥拉、阿波罗尼亚的第欧根尼及古代医学气论。罗素还说他影响了毕达哥拉斯，并指出原子论者沿用其圆盘形地球。`,parallel:`与近代以压力、密度解释相变的科学共享“用定量变化说明性质差异”的结构，但他没有实验测量、微观理论或守恒定律。`},comparisons:[{target:`泰勒斯`,relation:`承接前人`,shared:`以一种可经验材料统一自然。`,difference:`泰勒斯主要给出水这一答案；阿那克西美尼进一步说明材料如何沿连续过程发生转化。`},{target:`阿那克西曼德`,relation:`承接前人`,shared:`世界从单一、持续的来源自然演化。`,difference:`阿那克西曼德用无规定来源避免元素偏向；阿那克西美尼用气兼顾中性、可见证据和变化机制。`},{target:`赫拉克利特`,relation:`同题比较`,shared:`都把世界看成一种材料的持续转化。`,difference:`阿那克西美尼以疏密序列解释物质；赫拉克利特以火、交换、对立张力解释更普遍的过程秩序。`}],russellView:`罗素认为阿那克西美尼不如阿那克西曼德有趣，却承认他取得了重要进展：火是稀释的气，气凝聚后依次成为水、土、石，因此物质之间的差异被处理为凝聚程度的数量差异。罗素同时提醒，古代人对他的评价反而高于阿那克西曼德，说明哲学史中的重要性排序本身会变化。`,modernCorrection:`罗素把理论概括为“差异完全是数量的”，便于理解但略显现代化。更稳妥的说法是：阿那克西美尼首次留下了以疏密过程统一解释质变的清晰见证。吹气冷热的观察是否真是他的论证，以及具体宇宙模型的归属，仍需保留证据等级。`,sources:[M(`第一卷第二章〈米利都学派〉`),{label:`Stanford Encyclopedia · Presocratic Philosophy`,kind:`补充`,url:`https://plato.stanford.edu/entries/presocratics/`},{label:`Internet Encyclopedia of Philosophy · Anaximenes`,kind:`补充`,url:`https://iep.utm.edu/anaximenes/`}]},{id:`pythagoras`,order:4,nameZh:`毕达哥拉斯`,nameEn:`Pythagoras`,greekName:`Πυθαγόρας`,dates:`约前 570—前 490`,active:`约前 530—前 500`,places:[`萨摩斯`,`克罗顿`,`梅塔蓬图姆`],school:`毕达哥拉斯传统`,figureId:`pythagoras`,chapterIds:[`b1-03`],thesis:`哲学不只是解释世界，也是一种净化灵魂的共同生活；数与和谐后来成为这条传统理解宇宙秩序的核心语言。`,evidenceCaution:`毕达哥拉斯本人没有留下著作，早期见证稀少，完整传记晚出数百年。灵魂轮回与生活规则较可能属于本人；“万物是数”、定理和完整宇宙论多半属于后来的学派。`,lifeSummary:`毕达哥拉斯出生于爱琴海的萨摩斯岛，约四十岁时迁往南意大利的克罗顿。罗素把迁徙放在僭主波利克拉底统治和萨摩斯—米利都商业竞争中理解；现代研究可以确认迁居克罗顿，却不能确认所有政治动机与埃及旅行。他在那里建立以饮食禁忌、仪式、自律和共同生活为特点的团体，吸引男女追随者，并可能卷入南意大利城邦政治。反毕达哥拉斯运动后来攻击这些团体；传统称他最终逃往梅塔蓬图姆并在那里去世。`,timeline:[{date:`约前 570`,place:`萨摩斯`,title:`出生`,detail:`出生于富裕而航海活跃的岛屿城邦；父亲与早年经历的记载互相冲突。`,certainty:`推定`},{date:`约前 530`,place:`萨摩斯 → 克罗顿`,title:`迁往南意大利`,detail:`约四十岁移居克罗顿并开始主要活动；罗素认为他厌恶波利克拉底的僭政。`,certainty:`较可靠`},{date:`前 530—500`,place:`克罗顿`,title:`建立共同体`,detail:`团体以灵魂命运、宗教仪式、饮食纪律和共同生活闻名，并对当地政治产生影响。`,certainty:`较可靠`},{date:`约前 500—490`,place:`克罗顿／梅塔蓬图姆`,title:`政治反扑与去世`,detail:`南意大利发生反毕达哥拉斯运动；个人逃亡与死亡细节来自较晚传统。`,certainty:`传统记载`}],inquiries:[{object:`灵魂与生活方式`,question:`人的灵魂如何摆脱死亡与反复投生的循环？`,start:`灵魂并不随身体死亡，而会进入其他人或动物；所有有生命者因此具有亲缘关系。`,steps:[`承认灵魂不朽与轮回`,`把日常饮食、仪式和欲望纳入灵魂后果`,`以记忆、自律和群体规则净化生活`,`把哲学变成持续操练而非单次知识`],conclusion:`好生活的目标是改善灵魂命运。哲学首次鲜明地成为一种可加入、可实践、可传承的生活制度。`},{object:`数、音乐与秩序`,question:`为什么感性和谐能够由精确关系表达？`,start:`音乐协和与简单整数比之间存在稳定联系；几何证明又呈现不依赖个别观察的确定性。`,steps:[`从和弦与比例发现可重复关系`,`把数视为结构而非只用于计数`,`由局部比例推想宇宙也有和谐秩序`,`把数学沉思解释为灵魂净化的最高活动`],conclusion:`在毕达哥拉斯传统中，真实秩序更接近数、比例和形式。必须注意：这一完整推导主要属于后世学派，不能全部归给本人。`},{object:`知识与人生等级`,question:`求知是控制世界的工具，还是一种独立的生活价值？`,start:`观看竞技者既不交易也不争胜，只为理解发生了什么。`,steps:[`区分逐利者、竞争者和观看者`,`把无利害的观看提升为沉思`,`把沉思与数学的确定、和谐相连`,`让理论生活获得高于政治行动的地位`],conclusion:`罗素据此解释西方传统中“理论高于实践、理性高于感官”的长久倾向，并同时批评它带来的形而上学偏见。`}],concepts:[{zh:`灵魂轮回`,en:`metempsychosis`,definition:`灵魂在不同生命形态中迁移；生命共同亲缘、饮食禁忌与净化实践由此获得统一理由。`},{zh:`毕达哥拉斯式生活`,en:`Pythagorean way of life`,definition:`由共同体、仪式、饮食、自律和学习构成的生活方案；比任何单条数学命题更可靠地属于早期传统。`},{zh:`和谐`,en:`harmonia`,definition:`不同部分依比例结合形成秩序。音乐中的整数关系使“可听见的美”与“可理解的数”发生连接。`},{zh:`理论／沉思`,en:`theōria`,definition:`以理解而非利益或竞争为目的的观看生活。罗素把它视为数学、哲学和后来神学共同抬高的理想。`},{zh:`数与比例`,en:`number and ratio`,definition:`用离散数及其比例理解音程、形状与宇宙秩序；可靠证据更多属于早期毕达哥拉斯传统，而非都能归给本人。`},{zh:`净化`,en:`katharsis / purification`,definition:`通过节制、音乐、仪式与学习整顿灵魂，使知识活动同时成为生活和宗教实践。`}],lineage:{inherited:`罗素强调俄耳甫斯宗教的净化、轮回和共同体传统；也提到南意大利与爱奥尼亚知识交流。现代研究对具体借用关系更谨慎。`,school:`“毕达哥拉斯主义”跨越多个世纪。早期宗教生活、五世纪菲洛劳斯的宇宙论、阿尔库塔斯的数学不能无差别地写回创始人。`,influenced:`菲洛劳斯与阿尔库塔斯把传统发展为数学宇宙论；柏拉图吸收数、形式、灵魂与沉思理想，经他影响新柏拉图主义和基督教哲学。`,parallel:`与米利都学派同样追求宇宙统一，却把稳定性放在形式关系而非物质本原；与后世宗教修会共享生活纪律，但不存在简单直接的组织继承。`},comparisons:[{target:`米利都学派`,relation:`同题比较`,shared:`都寻找现象背后的统一秩序。`,difference:`米利都从可观察物质与生成机制出发；毕达哥拉斯传统把数、灵魂和净化生活放到中心。`},{target:`赫拉克利特`,relation:`批评关系`,shared:`都认为零散见闻不足以构成智慧。`,difference:`赫拉克利特点名批评毕达哥拉斯“多闻而无理解”；他以逻各斯和对立秩序取代知识收藏与宗教权威。`},{target:`柏拉图`,relation:`影响后继`,shared:`数学训练、灵魂不朽和超越感官的秩序。`,difference:`柏拉图用理念论、辩证法和政治哲学重组这些资源，不能把成熟柏拉图体系倒推给毕达哥拉斯。`}],russellView:`罗素把毕达哥拉斯称为思想史上影响最巨大的人之一：演绎数学、神秘主义与沉思伦理在他身上结合，使数学确定性成为哲学的理想。罗素一方面赞赏纯数学和无利害求知，另一方面认为由此产生了“思想高于感官”的错误形而上学倾向。他的叙述极有结构力量，但把很多后世学派成就集中到个人名下。`,modernCorrection:`现代研究把“毕达哥拉斯问题”放在首位：较早证据能支持灵魂轮回、仪式专家和严格生活方式，却没有证据证明本人提出勾股定理、建立成熟数学证明体系或完整宣称“万物是数”。页面因此保留罗素的影响史判断，同时把个人、早期共同体和后世学派分层。`,sources:[M(`第一卷第三章〈毕达哥拉斯〉`),{label:`Stanford Encyclopedia · Pythagoras`,kind:`补充`,url:`https://plato.stanford.edu/entries/pythagoras/`},{label:`Internet Encyclopedia · Presocratics / Pythagoras`,kind:`补充`,url:`https://iep.utm.edu/presocra/`}]},{id:`heraclitus`,order:5,nameZh:`赫拉克利特`,nameEn:`Heraclitus of Ephesus`,greekName:`Ἡράκλειτος`,dates:`约前 540—前 480`,active:`约前 500 年前后`,places:[`以弗所`,`爱奥尼亚`],school:`爱奥尼亚哲学／独立思想家`,figureId:`heraclitus`,chapterIds:[`b1-04`],thesis:`世界的稳定不是排除变化，而是由受逻各斯约束的转化和对立张力维持；有些事物正因为持续更新才能保持同一。`,evidenceCaution:`生平轶事大多是后人从格言反推的传说。作品只以约百余条残篇保存，语句刻意含混；“万物流变”等著名标签也主要经过柏拉图和后世解释。`,lifeSummary:`赫拉克利特生活在爱奥尼亚城邦以弗所，约于前 500 年前后活跃。该城位于波斯帝国西缘，拥有古老贵族、公共祭祀和商业网络。罗素只较有把握地说他是以弗所的贵族公民；关于他让出世袭职位、隐居山中和特殊死法的故事都很晚。他的残篇提到城邦放逐赫尔摩多罗斯，并表现出对群众政治、诗人和前辈知识权威的强烈蔑视。作品可能曾作为一部散文书流传，但我们只能通过其他作者的引用重建其排列和论证。`,timeline:[{date:`约前 540`,place:`以弗所`,title:`出生于贵族家庭`,detail:`家世与具体年份来自后世传统；贵族背景与其残篇中的政治语气相符，但不可写成完整履历。`,certainty:`推定`},{date:`6 世纪末`,place:`以弗所`,title:`城邦政治冲突`,detail:`残篇谴责公民放逐赫尔摩多罗斯，显示他与民主多数及地方政治发生尖锐冲突。`,certainty:`较可靠`},{date:`约前 500`,place:`以弗所`,title:`著作与思想活动`,detail:`写作涉及宇宙、知识、伦理和政治，以格言、悖论、双关和意象迫使读者主动理解。`,certainty:`较可靠`},{date:`5 世纪初`,place:`以弗所 → 雅典（思想传播）`,title:`克拉底鲁传播其思想`,detail:`克拉底鲁把极端流变解释带到雅典，影响青年柏拉图；这已是接受史而非赫拉克利特本人生平。`,certainty:`传统记载`}],inquiries:[{object:`变化与同一`,question:`如果组成材料不断替换，一个事物为何仍能保持自身？`,start:`河流、火焰和生命都持续更换材料，却能维持可识别的结构。`,steps:[`观察材料的连续流入与流出`,`区分低层材料与高层关系结构`,`把变化理解为维持结构的必要条件`,`以尺度和交换说明过程不会任意失控`],conclusion:`同一与变化并非简单互斥：河流之所以仍是那条河，恰因为新水持续流入。赫拉克利特不必被理解为“一切都乱变”。`},{object:`对立与秩序`,question:`冲突为什么不只破坏秩序，反而能够构成秩序？`,start:`弓与琴依靠反向拉力保持功能；昼夜、醒睡、冷热也通过互换被理解。`,steps:[`对立项互相规定意义`,`它们在不同时间、对象或角度出现`,`张力产生运动、功能与和谐`,`没有对立，世界只剩无差别的静止`],conclusion:`对立者不是逻辑上同时同义，而是在一个转换系统中相互依赖。“争斗”是结构关系，不只是政治暴力的赞美。`},{object:`知识与逻各斯`,question:`人怎样从零散经验进入对整体秩序的理解？`,start:`多数人拥有见闻、诗歌和仪式，却像睡着一样只生活在私人世界。`,steps:[`感官提供材料但不自动给出理解`,`寻找在众多变化中共同有效的说明`,`按每一事物的本性区分并连接`,`让个人判断服从共同的逻各斯`],conclusion:`智慧不是知道很多，而是把经验组织成一个共同、可说明的秩序。其格言写法本身就是让读者完成连接的训练。`}],concepts:[{zh:`逻各斯`,en:`logos`,definition:`兼有言说、说明、比例和共同秩序之意。它不是赫拉克利特私人意见，而是人可能理解却经常忽略的世界结构。`},{zh:`流变`,en:`flux`,definition:`事物材料与状态持续转化。现代解释强调：变化并非摧毁一切稳定，有些稳定正由规律更新维持。`},{zh:`对立统一`,en:`unity of opposites`,definition:`对立状态在时间、关系和功能系统中互相依存，不等于同一事物在同一方面同时具有矛盾性质。`},{zh:`火与交换`,en:`fire and exchange`,definition:`火既是元素意象，也是转化过程的模型；万物按尺度交换，整体数量和秩序在变化中保持。`},{zh:`争斗`,en:`strife`,definition:`差异力量的张力与轮替，是生成多样性和功能秩序的条件。罗素把它连接到黑格尔辩证法的远源。`}],lineage:{inherited:`延续米利都学派对自然内部秩序的追问，也继承阿那克西曼德的对立与宇宙正义语言；但他把讨论扩展到知识、伦理和政治。`,school:`没有证据表明他建立了制度化学派。后来的“赫拉克利特派”主要由接受者构成，克拉底鲁的极端流变也不能自动等同于本人。`,influenced:`克拉底鲁把其思想带给柏拉图；柏拉图用流变解释感性世界，斯多葛派吸收火、逻各斯和宇宙秩序。黑格尔及现代过程哲学又把他重构为变化与对立的先驱。`,parallel:`巴门尼德同样追问变化、存在和可靠知识，却从“不可思者不可存在”走向不变存在；两人常被并列为同一问题的极端答案，直接互相影响并无定论。`},comparisons:[{target:`阿那克西曼德`,relation:`同题比较`,shared:`对立力量和尺度共同形成宇宙秩序。`,difference:`阿那克西曼德把越界视为需补偿的不正义；赫拉克利特更激进地说争斗本身就是正义与生成条件。`},{target:`巴门尼德`,relation:`同题比较`,shared:`都不满足于感官表面，要求理性说明变化与存在。`,difference:`赫拉克利特在转换关系中寻找稳定；巴门尼德以存在的可思性排除真正的生成和消灭。`},{target:`克拉底鲁／柏拉图`,relation:`后世重构`,shared:`感性事物处于变化之中。`,difference:`克拉底鲁把流变推向无法稳定命名；柏拉图再以不变理念补足知识对象，这未必是赫拉克利特本人的结论。`},{target:`黑格尔`,relation:`后世重构`,shared:`对立不是外部事故，而参与构成发展。`,difference:`黑格尔建立概念辩证体系与历史逻辑；赫拉克利特留下的是格言式的宇宙、伦理和认识论联系。`}],russellView:`罗素把赫拉克利特描述为贵族式、骄傲而带有神秘主义色彩的思想家。他依次突出火、流变、对立融合和宇宙正义，并认为其中含有黑格尔哲学的萌芽。罗素尤其关心变化为什么令人寻求永恒，由此把赫拉克利特放进西方哲学“时间世界与永恒世界”的长期张力中。`,modernCorrection:`罗素沿用柏拉图以来“普遍流变”的强解释，也倾向把火当作与泰勒斯之水相似的基本物质。现代研究提出更细的读法：河流通过材料更新保持结构；对立项在不同关系和时间中相连，并非违反不矛盾律；火可能更重要地表示受尺度约束的交换过程。`,sources:[M(`第一卷第四章〈赫拉克利特〉`),{label:`Stanford Encyclopedia · Heraclitus`,kind:`补充`,url:`https://plato.stanford.edu/entries/heraclitus/`},{label:`Internet Encyclopedia of Philosophy · Heraclitus`,kind:`补充`,url:`https://iep.utm.edu/heraclit/`}]},{id:`parmenides`,order:6,nameZh:`巴门尼德`,nameEn:`Parmenides of Elea`,greekName:`Παρμενίδης`,dates:`约前 515—前 450`,active:`前 5 世纪前期`,places:[`埃利亚`,`大希腊`],school:`埃利亚学派`,figureId:`parmenides`,chapterIds:[`b1-05`],thesis:`思想和言说若要有所指，就不能以“非存在”为对象；由此，真正的存在不能生成、消灭、分割或移动。哲学第一次以论证条件强力约束宇宙论。`,evidenceCaution:`一首六步格哲学诗约保存一百六十行，生平则几乎只有后世记载。柏拉图笔下他在雅典与苏格拉底相见的时间线可能是文学设计；“完全否认经验世界”也只是众多解释之一。`,lifeSummary:`巴门尼德出生于南意大利的希腊殖民城埃利亚。该城由躲避波斯扩张的福凯亚人建立，处在爱奥尼亚知识传统与大希腊宗教—政治网络的交汇处。后世说他为城邦制定法律，也把他与色诺芬尼或毕达哥拉斯传统相连，但直接师承难以确认。他写过一首后来通称《论自然》的哲学诗：叙述者乘车抵达女神之门，先学习“真理之路”，再听取凡人的宇宙解释。罗素把他视为形而上学与逻辑论证的重大起点；现代研究则更重视诗中并未被简单抛弃的自然研究。`,timeline:[{date:`约前 515`,place:`埃利亚`,title:`出生`,detail:`年代主要由柏拉图对话中的戏剧日期反推；对话本身并非可靠编年记录。`,certainty:`推定`},{date:`前 5 世纪前期`,place:`埃利亚`,title:`写作哲学诗`,detail:`作品以神圣启示的旅程开场，却在核心部分使用连续推理考察“存在”必须具有什么属性。`,certainty:`较可靠`},{date:`前 5 世纪`,place:`埃利亚`,title:`立法者传统`,detail:`斯彪西波等后世作者称他为埃利亚制定法律；当地每年要求官员遵守“巴门尼德法律”的说法无法独立核验。`,certainty:`传统记载`},{date:`约前 450`,place:`雅典（柏拉图叙事）`,title:`与青年苏格拉底论辩`,detail:`柏拉图让年老的巴门尼德与芝诺访问雅典；这一场景首先服务于理念论批判，不宜直接当作旅行事实。`,certainty:`传统记载`}],inquiries:[{object:`思想、言说与存在`,question:`一条可被认识的探究道路，最低限度必须满足什么条件？`,start:`人可以思考和说出“是”；但若声称研究“不是”，研究对象就在被指认时取消了自身。`,steps:[`区分‘是’与‘不是’两条道路`,`指出非存在不可被认识或说出`,`禁止用非存在说明存在`,`把可思性当作宇宙论必须遵守的逻辑门槛`],conclusion:`可靠探究只能沿着“存在”展开。这里的关键不是先观察世界，再列材料，而是先检查一个解释是否自相矛盾。`},{object:`生成、消灭与运动`,question:`若存在不能来自非存在，它还能真正生成或改变吗？`,start:`生成意味着先前不存在；消灭意味着后来不再存在。二者都要求把非存在写进解释。`,steps:[`排除从无到有与从有到无`,`排除存在内部的空缺和断裂`,`由连续性推出不可分`,`由完整性推出不动、均一和无始无终`],conclusion:`“真正存在者”是不生不灭、完整连续、同质而不动的。经验变化若仍要被说明，就必须重新定义而不能诉诸无中生有。`},{object:`凡人意见与宇宙论`,question:`严格的存在论之后，为什么诗还要详细说明光、夜、天体和生命？`,start:`女神在真理之后转述凡人以光和夜组织世界的解释，并建立相当完整的宇宙生成图景。`,steps:[`承认人类经验以相反性质分类`,`用光与夜的混合排列现象`,`说明天体、性别与生命生成`,`把可接受的经验模型置于更高逻辑约束之下`],conclusion:`“意见”不必等于毫无价值的谬误；它可能是无法达到存在论确定性、却仍有系统性的自然解释。其地位是现代研究的核心争议。`}],concepts:[{zh:`存在者`,en:`what-is / to eon`,definition:`能够被思想和言说的对象；在真理之路上表现为不生不灭、连续、均一、完整而不动。`},{zh:`非存在`,en:`what-is-not`,definition:`不能被认识、陈述或充当生成来源的“不是”。巴门尼德用它检验解释是否偷偷依赖虚无。`},{zh:`真理之路`,en:`Way of Truth`,definition:`从“存在必定是，非存在不是”出发，以必要推论限定真实结构的探究道路。`},{zh:`凡人意见`,en:`Opinions of Mortals / doxa`,definition:`以光与夜等对立原则解释经验宇宙的部分；它与真理的关系可能是错误、次级模型或对现象的最佳说明。`},{zh:`思想与存在`,en:`thinking and being`,definition:`能被思想的对象不能彻底落入非存在；这条约束把认识条件转化为对真实结构的限制，也引出长期解释争论。`},{zh:`生成不可能`,en:`impossibility of coming-to-be`,definition:`若事物从非存在生成，便把不可思的‘无’当作来源；若从存在生成，则它早已存在，因此真正生成被排除。`}],lineage:{inherited:`继承爱奥尼亚自然哲学的宇宙整体问题，也可能接触毕达哥拉斯式宗教语言；但他的决定性变化是让解释先接受可思与可说条件的审查。`,school:`后世把巴门尼德、芝诺和麦里梭归为埃利亚学派。共同点是捍卫存在的统一与不变，并用论证揭露运动、多与分割的困难。`,influenced:`恩培多克勒、阿那克萨哥拉和原子论者都保留“不真正生成或毁灭”的约束，再以混合、分离或重排挽救经验变化；柏拉图和亚里士多德则把存在问题发展为体系性的本体论。`,parallel:`赫拉克利特同样寻找变化背后的可靠秩序；两人常被塑造成流变与静止的对立面，但是否直接互相批评并无定论。`},comparisons:[{target:`赫拉克利特`,relation:`同题比较`,shared:`都认为感官表象不足，世界必须有可理解的统一结构。`,difference:`赫拉克利特在有尺度的转换中保存同一；巴门尼德从可思性出发排除真实存在的生成和运动。`},{target:`芝诺`,relation:`影响后继`,shared:`以推论保护不变、统一的存在。`,difference:`巴门尼德正面说明存在的属性；芝诺多以反证展示承认运动与多会遭遇的悖论。`},{target:`恩培多克勒`,relation:`批评关系`,shared:`不允许存在真正产生或消失。`,difference:`恩培多克勒把不变性分配给四根，再用组合与分离解释可见变化。`},{target:`留基伯／德谟克利特`,relation:`批评关系`,shared:`保存基本存在者的不生不灭。`,difference:`原子论承认多个不可变原子，并把虚空作为运动条件，正面修正巴门尼德对非存在的禁令。`}],russellView:`罗素把巴门尼德与赫拉克利特并置为“万物变化”与“没有变化”两极。他尤其重建语言论证：凡能被思想或说出的东西必定存在，因此生成、消灭、运动和多样都不可能。罗素认为后来“实体”概念的历史任务，正是既向巴门尼德承认某种不变，又给经验变化留下空间。`,modernCorrection:`现代研究不再轻易把整首诗压缩成“现实只是一个静止球体”。作品保存了相当完整的宇宙论，并可能区分必要真理与现象模型，而非简单宣布自然研究无意义。“存在”究竟指唯一实体、必然存在方式，还是任何成功探究的对象，也仍存在严格一元论、模态解释等竞争读法。`,sources:[M(`第一卷第五章〈巴门尼德〉`),{label:`Stanford Encyclopedia · Parmenides`,kind:`补充`,url:`https://plato.stanford.edu/entries/parmenides/`},{label:`Internet Encyclopedia of Philosophy · Parmenides`,kind:`补充`,url:`https://iep.utm.edu/parmenid/`}]},{id:`empedocles`,order:7,nameZh:`恩培多克勒`,nameEn:`Empedocles of Acragas`,greekName:`Ἐμπεδοκλῆς`,dates:`约前 494—前 434`,active:`前 5 世纪中叶`,places:[`阿克拉加斯`,`西西里`,`大希腊`],school:`多元论自然哲学`,figureId:`empedocles`,chapterIds:[`b1-06`],thesis:`没有东西真正生成或消灭；四种永久的“根”在爱与争的作用下混合、分离，生命、感知和宇宙历史都是同一组关系的不同尺度。`,evidenceCaution:`作品以残篇和斯特拉斯堡纸草保存，传统上分为《论自然》与《净化》，但究竟是一部还是两部作品仍有争议。民主政治、治病神迹和跳入埃特纳火山等故事多来自晚期传记。`,lifeSummary:`恩培多克勒来自西西里富裕强盛的希腊城邦阿克拉加斯，生活在僭主政治瓦解、民主制度竞争及希腊人与迦太基势力长期对峙的环境中。古代传统称其家族有政治地位，他反对僭主或寡头、拒绝王位，也以医生、诗人、宗教教师和演说家著称；这些形象彼此交叠，却不能都当作可靠事件。他用诗歌同时讨论宇宙、生命、知觉、轮回和净化。比起把“科学”和“神秘”看成两个人格，更有效的理解是：同一个混合—分离宇宙论，也被用来说明身体和灵魂的命运。`,timeline:[{date:`约前 494`,place:`阿克拉加斯`,title:`出生`,detail:`出生于有影响力的家族是古代传统；具体年份由后世编年推定。`,certainty:`推定`},{date:`前 5 世纪中叶`,place:`阿克拉加斯`,title:`政治活动`,detail:`被描述为民主派、反僭主并曾解散寡头组织；故事可能保存历史记忆，也可能用来塑造哲人形象。`,certainty:`传统记载`},{date:`约前 450—前 430`,place:`西西里／大希腊`,title:`诗歌、医学与教学`,detail:`残篇把四根、爱与争、身体构造、知觉、轮回和净化放入相连的思想工程。`,certainty:`较可靠`},{date:`约前 434`,place:`地点不详`,title:`死亡与火山传奇`,detail:`亚里士多德传统说他约六十岁去世；跳入埃特纳火山以证明神性的故事是著名却不可靠的后世传奇。`,certainty:`推定`}],inquiries:[{object:`变化与基本成分`,question:`接受巴门尼德“不生不灭”的约束后，日常生成与毁灭怎样可能？`,start:`若从无到有不可能，就不能说木头、身体或世界被真正创造；但经验又显示事物不断出现和消失。`,steps:[`把生成改写为成分结合`,`把毁灭改写为成分分离`,`设定火、气、水、土四根永久平等`,`以比例差异解释不同物体与组织`],conclusion:`变化发生在关系与配比层，不发生在基本成分自身。四根像有限字母，能写出多种但并非任意的自然结构。`},{object:`宇宙运动与历史`,question:`不变成分为什么会组合和分开，并形成有方向的宇宙阶段？`,start:`只列四种材料仍不能解释它们为何运动、何时混合、何时分离。`,steps:[`以爱推动相异成分结合`,`以争推动成分分离`,`二力的相对优势周期变化`,`由完全融合的圆球到分离世界，再向相反方向循环`],conclusion:`爱与争是跨尺度的动力关系：它们不是简单的道德善恶，而使宇宙、身体和政治联结成周期性的结构。`},{object:`生命、感知与净化`,question:`同一套物理原则能否解释器官、认识与人的生活规范？`,start:`身体由四根混合，感觉器官与对象必须通过孔隙和流出物发生匹配；生命又被描述为流亡神灵的轮回。`,steps:[`让器官比例决定其功能`,`以流出物进入相合孔隙解释感觉`,`以‘同类认识同类’连接身体与对象`,`把杀生、饮食和轮回放进共同生命的宇宙亲缘`],conclusion:`自然论与净化论都反对绝对断裂：身体、动物、植物和宇宙共享材料与循环；伦理要求因而获得宇宙论背景。`}],concepts:[{zh:`四根`,en:`four roots`,definition:`火、气、水、土四种平等、不生不灭的基本成分。后世称“四元素”，但“根”更能显示其生成多样结构的功能。`},{zh:`爱`,en:`Love / Philotēs`,definition:`使不同成分结合、趋向统一的宇宙力量；不等于日常情感，也不在所有阶段都只产生良好结果。`},{zh:`争`,en:`Strife / Neikos`,definition:`使混合物分解、相同成分聚集的力量；与爱相互消长，不能简单归结为纯粹邪恶。`},{zh:`宇宙循环`,en:`cosmic cycle`,definition:`爱与争轮流占优，使世界在融合、分离及重新结合之间演化；循环究竟包含一个还是两个完整宇宙生成过程仍有争论。`},{zh:`流出物与孔隙`,en:`effluences and pores`,definition:`对象发出的微粒进入器官中相合的孔隙，由此解释感知、吸引与部分身体过程。`}],lineage:{inherited:`接受巴门尼德关于真正存在者不生不灭的限制，也继承毕达哥拉斯—俄耳甫斯传统的轮回与净化问题，并吸收西西里医学和自然观察。`,school:`通常与阿那克萨哥拉并列为前苏格拉底多元论者：不再寻找单一变化材料，而以多个永久成分的重排保存经验世界。`,influenced:`四元素框架经柏拉图、亚里士多德和希波克拉底医学长期延续；爱与争、孔隙感知和生物组合也成为后世自然哲学的反复参照。`,parallel:`阿那克萨哥拉同样把生成改为混合和分离，却拒绝只有四种基本材料；原子论则把成分简化为形状不同但无性质差异的原子。`},comparisons:[{target:`巴门尼德`,relation:`批评关系`,shared:`基本存在者不能从无生成或彻底消灭。`,difference:`巴门尼德将真实存在推向一与不动；恩培多克勒承认四种不变成分及其空间重组。`},{target:`阿那克萨哥拉`,relation:`同题比较`,shared:`以永久成分的混合和分离解释可见生成。`,difference:`恩培多克勒用四根及爱、争；阿那克萨哥拉主张无限多种成分，并以努斯启动旋转。`},{target:`德谟克利特`,relation:`同题比较`,shared:`宏观性质由更基本单位的组合方式产生。`,difference:`四根本身带有火水等性质，且受两种宇宙力支配；原子只以形状、次序和位置区别，在虚空中机械运动。`},{target:`达尔文`,relation:`后世重构`,shared:`不合适的生物组合消失、较能生存的结构留下。`,difference:`恩培多克勒没有遗传、种群与累积选择理论；其怪异肢体组合只是宇宙阶段中的自然生成模型。`}],russellView:`罗素把恩培多克勒写成哲学家、先知、科学家与“江湖术士”的奇特混合，既赞赏水钟实验、空气压力、离心力及植物性别等观察，也详细转述神性宣称和火山传奇。理论上，他突出四元素、爱与争以及循环宇宙，认为恩培多克勒在保存巴门尼德不变性的同时重新允许变化。`,modernCorrection:`“科学家与骗子并存”的肖像过度依赖晚期传记，也把现代学科边界投射到诗人身上。新纸草材料显示物理宇宙论与宗教净化可能比罗素设想得更紧密。四根不是现代化学元素，爱与争也兼具物理、心理和伦理语义；关于一个或两个宇宙生成过程尚无定论。`,sources:[M(`第一卷第六章〈恩培多克勒〉`),{label:`Stanford Encyclopedia · Empedocles`,kind:`补充`,url:`https://plato.stanford.edu/entries/empedocles/`},{label:`Internet Encyclopedia of Philosophy · Empedocles`,kind:`补充`,url:`https://iep.utm.edu/empedocl/`}]},{id:`anaxagoras`,order:8,nameZh:`阿那克萨哥拉`,nameEn:`Anaxagoras of Clazomenae`,greekName:`Ἀναξαγόρας`,dates:`约前 500—前 428`,active:`约前 462—前 432 在雅典`,places:[`克拉佐梅奈`,`雅典`,`兰普萨库斯`],school:`多元论自然哲学`,figureId:`anaxagoras`,chapterIds:[`b1-08`],thesis:`一切可见事物都由无限多种成分混合而成，并以某类成分占优势获得名称；独立而未混合的努斯启动旋转，使原始混合物逐渐分离成有序宇宙。`,evidenceCaution:`生平主要来自数百年后的传记，入雅典、审判与流亡的日期互有冲突。“种子”和“同质部分”常由后世术语反向概括；努斯究竟是目的因还是卓越的运动起点也长期有争议。`,lifeSummary:`阿那克萨哥拉出生于爱奥尼亚城邦克拉佐梅奈，成年后长期居住雅典，通常被视为把爱奥尼亚自然研究带入古典雅典的关键人物。他与伯里克利政治圈关系密切，古代传统还把欧里庇得斯列为学生。其自然解释把太阳说成炽热石块、月亮说成土质天体，并说明日月食；这些观点后来被联系到“不敬神”指控。审判究竟发生于何时、是否具有打击伯里克利的政治动机并不确定。他离开雅典后在小亚细亚的兰普萨库斯教学并去世，当地据说长期纪念他。`,timeline:[{date:`约前 500`,place:`克拉佐梅奈`,title:`出生`,detail:`来自富裕家庭、放弃产业求知的故事带有哲人传记模式；出生地较为确定。`,certainty:`推定`},{date:`约前 462`,place:`雅典`,title:`进入雅典知识与政治圈`,detail:`传统称他在雅典活动约三十年，并与伯里克利交往；准确起止日期有争议。`,certainty:`传统记载`},{date:`前 5 世纪中叶`,place:`雅典`,title:`自然论写作与教学`,detail:`以原始混合、无限可分、努斯旋转及天体自然解释建立一个从宇宙到感觉的系统。`,certainty:`较可靠`},{date:`约前 432—前 428`,place:`雅典 → 兰普萨库斯`,title:`受审、离开雅典并去世`,detail:`因太阳和月亮理论被控不敬神、后获伯里克利营救的叙事广为流传，但时间与细节无法确证。`,certainty:`传统记载`}],inquiries:[{object:`生成、混合与性质`,question:`若没有真正生成，一种食物为什么能长成血、骨、毛发等不同组织？`,start:`从面包和水中不可能凭空产生原先完全不存在的性质，因此成品的成分必须已经以微量存在。`,steps:[`否定绝对生成和消灭`,`设定原始状态中万物混在一起`,`主张任何混合物都含有各种成分`,`用占优势的成分说明事物为何被命名为金、肉或骨`],conclusion:`“一切在一切之中”不是说每物外观相同，而是没有纯粹隔绝的材料；可见性质来自混合比例和优势。`},{object:`努斯与宇宙秩序`,question:`若最初一切混合且静止，分离和秩序从何开始？`,start:`混合物自身没有明显理由打破均衡，也不能解释宇宙旋转为何具有可辨方向和层次。`,steps:[`把努斯规定为最精纯且不与他物混合`,`赋予它对万物的知识和支配力`,`由努斯启动局部旋转`,`旋转扩大并使稀密、冷热、明暗逐步分离`],conclusion:`努斯为秩序提供独立起点，但作品后续主要依靠碰撞、旋转和分离说明细节；它是否始终按目的安排宇宙仍有争议。`},{object:`天体、感觉与不可见结构`,question:`人怎样从有限感官推知巨大天体和微小成分？`,start:`太阳看似神圣圆盘、食物看似单一，感官却只呈现尺度有限的表面。`,steps:[`把太阳解释为炽热石块、月亮解释为土质天体`,`用遮蔽说明日月食`,`以相反性质的刺激解释感觉`,`由可见现象推断其中隐藏的成分和过程`],conclusion:`现象既会限制认识，也能成为通往不可见结构的线索；自然解释因此不必服从传统神话分类。`}],concepts:[{zh:`努斯`,en:`Nous / Mind`,definition:`唯一不与其他成分混合、具有知识与力量并启动宇宙旋转的原则；可译“心灵”或“理智”。`},{zh:`万物混合`,en:`everything in everything`,definition:`每个可分混合物中都含有各种类型的成分，没有绝对纯物；差异来自比例而非某种性质凭空出现。`},{zh:`优势原则`,en:`predominance`,definition:`一个对象按其中占优势的成分被感知和命名，因此少量其他成分可以存在而不改变其日常分类。`},{zh:`无限可分`,en:`infinite divisibility`,definition:`没有最小部分；无论取多小的量仍含有多种成分。这与原子论的不可分单位形成直接对照。`},{zh:`旋转`,en:`cosmic rotation`,definition:`由努斯启动、范围不断扩大的涡旋运动，使冷热、稀密等成分分离并形成天体和世界。`}],lineage:{inherited:`接受巴门尼德关于无中生有不可能的限制，也延续爱奥尼亚气象和天体研究；其长期雅典生活把两地的知识网络连接起来。`,school:`属于多元论者，但不把基本成分限制为四种，也不承认物质最小单位；其系统由无限混合物与独立努斯共同构成。`,influenced:`苏格拉底—柏拉图传统从努斯中期待目的论，却批评他实际多用机械原因；亚里士多德赞赏他把心灵与混合物分开，同时认为其使用不充分。`,parallel:`恩培多克勒用四根和两力解决同一变化难题；原子论同样依靠重排，却用不可分原子和虚空取代无限可分、万物互含的混合物。`},comparisons:[{target:`恩培多克勒`,relation:`同题比较`,shared:`不存在真正生成或毁灭，只有永久成分的混合与分离。`,difference:`恩培多克勒只有四根并由爱、争推动；阿那克萨哥拉承认无限多种成分，由努斯开启旋转。`},{target:`留基伯／德谟克利特`,relation:`同题比较`,shared:`物体性质取决于微观组成和排列过程。`,difference:`阿那克萨哥拉无限可分且一切互含；原子论设不可分原子，并允许真正空无的虚空。`},{target:`苏格拉底／柏拉图`,relation:`批评关系`,shared:`心灵应当与宇宙秩序有关。`,difference:`柏拉图笔下苏格拉底期待努斯说明何者最好，却发现阿那克萨哥拉主要诉诸空气、以太和机械运动。`},{target:`亚里士多德`,relation:`影响后继`,shared:`不能只列物质，还需说明运动和秩序来源。`,difference:`亚里士多德把目的、形式、动力和材料系统区分；阿那克萨哥拉的努斯更多承担最初运动与分离功能。`}],russellView:`罗素认为阿那克萨哥拉的原创性不及毕达哥拉斯、赫拉克利特或巴门尼德，但历史位置重要：他把哲学带到雅典，并首次明确提出心灵是主要原因。罗素同时沿用柏拉图和亚里士多德的批评——努斯启动旋转后很少出场，具体解释仍主要是物质和机械的。`,modernCorrection:`审判与流亡叙事受后期政治传记影响，不宜写成确定事实。“种子”和亚里士多德的“同质部分”也不能无条件当作本人技术词。现代解释更注意其彻底的无限主义：没有最小量，也没有纯物质；努斯虽启动秩序，却未必是按照人类价值选择“最好世界”的人格设计者。`,sources:[M(`第一卷第八章〈阿那克萨哥拉〉`),{label:`Stanford Encyclopedia · Anaxagoras`,kind:`补充`,url:`https://plato.stanford.edu/entries/anaxagoras/`},{label:`Internet Encyclopedia of Philosophy · Anaxagoras`,kind:`补充`,url:`https://iep.utm.edu/anaxag/`}]},{id:`leucippus`,order:9,nameZh:`留基伯`,nameEn:`Leucippus`,greekName:`Λεύκιππος`,dates:`约前 5 世纪`,active:`约前 440 年前后`,places:[`阿布德拉（传统归属）`,`米利都／埃利亚（不同传统）`],school:`古代原子论`,figureId:`leucippus`,chapterIds:[`b1-09`],thesis:`把巴门尼德式的不变存在拆分为无数不可分实体，并承认真正的虚空，从而让运动、分离和重组在不依赖生成毁灭的条件下成为可能。`,evidenceCaution:`留基伯是本批材料最薄弱的人物：出生地、生卒年、师承和著作归属都不确定，伊壁鸠鲁甚至否认其存在。多数古代证言仍把他列为德谟克利特老师及原子论创始者，但两人的学说通常无法逐条拆分。`,lifeSummary:`留基伯大概活动于前五世纪，传统分别把他的故乡说成米利都、埃利亚或阿布德拉。他常被安排在芝诺之后、德谟克利特之前：先理解埃利亚学派对运动与非存在的挑战，再提出原子和虚空作为回应。亚里士多德和泰奥弗拉斯托斯明确把原子论开端归给他，并说德谟克利特是其同伴或学生；但没有独立传记可重建旅行、政治交往或确切年代。题为《大宇宙系统》和《论心灵》的作品曾归于他，现仅存一句著名残言，且著作归属同样可能在原子论共同传统中移动。`,timeline:[{date:`前 5 世纪前半`,place:`米利都／埃利亚／阿布德拉`,title:`出身与活动地`,detail:`三个地点分别见于不同古代传统，无法据此选择一条确定迁移路线。`,certainty:`传统记载`},{date:`约前 440`,place:`阿布德拉`,title:`原子论形成`,detail:`相对年代来自他先于德谟克利特、又回应巴门尼德与芝诺问题的思想位置。`,certainty:`推定`},{date:`前 5 世纪`,place:`阿布德拉（传统归属）`,title:`与德谟克利特合作或师承`,detail:`后世通常称德谟克利特为学生，但两人可能代表一个难以拆分的研究传统。`,certainty:`传统记载`}],inquiries:[{object:`运动与虚空`,question:`若非存在不能存在、存在内部没有空缺，运动如何可能？`,start:`巴门尼德排除非存在，芝诺展示连续分割中的运动困难；经验却迫使解释保留运动与多。`,steps:[`接受基本存在者不生成、不毁灭`,`把存在者改为无数不可分实体`,`承认虚空以提供间隔和移动空间`,`用位置重排代替性质生成`],conclusion:`原子是“有”，虚空在某种意义上是“无”，但无也必须作为空间条件存在。原子论由此对埃利亚禁令作出最直接修正。`},{object:`因果与宇宙形成`,question:`没有设计者，原子运动怎样形成世界？`,start:`若原子和虚空足以解释变化，就不应在每个结果处再加入目的或神意。`,steps:[`设定原子在无限虚空中持续运动`,`不同形状与运动形成涡旋`,`碰撞、缠结与筛分产生复合体`,`让世界形成服从必然性而非预设目的`],conclusion:`现存残言称没有事物无缘无故发生，一切出于理由与必然；但具体机械模型多由留基伯—德谟克利特共同证言保存。`}],concepts:[{zh:`原子`,en:`atomon / indivisible`,definition:`不可切分、内部无空隙且本身不改变的微小实体；古代“不可分”是理论属性，不等于现代物理学原子。`},{zh:`虚空`,en:`void`,definition:`原子之间的空无间隔，使多、运动和重组成为可能；它是原子论对“非存在不能存在”的关键修正。`},{zh:`必然`,en:`necessity / anankē`,definition:`现象由原子先前的运动、碰撞和结构关系产生，而非为某种目的临时安排。`}],lineage:{inherited:`主要思想背景是巴门尼德和芝诺对非存在、分割与运动的限制；出生地传统又可能把他连接到米利都自然哲学。`,school:`古代原子论的创始层。留基伯与德谟克利特的文本、命题和声誉高度重叠，因此页面只把古代证言较一致的“创始角色”谨慎归给他。`,influenced:`德谟克利特把原子论扩展为宇宙、知觉、生命、文化与伦理的广泛系统；伊壁鸠鲁和卢克莱修后来调整原子运动并赋予其伦理目标。`,parallel:`恩培多克勒和阿那克萨哥拉都以不变成分重排回答巴门尼德，但只有原子论明确设定不可分单位和虚空。`},comparisons:[{target:`巴门尼德／芝诺`,relation:`批评关系`,shared:`基本存在者不生成、不消灭，并认真接受关于运动的逻辑困难。`,difference:`留基伯允许多个存在者和作为间隔的虚空，从而恢复运动；这正是埃利亚学派拒绝的条件。`},{target:`德谟克利特`,relation:`影响后继`,shared:`原子、虚空、机械运动与必然性构成共同理论。`,difference:`古代传统通常把发明归给留基伯、系统发展归给德谟克利特，但具体命题往往无法可靠分配。`},{target:`阿那克萨哥拉`,relation:`同题比较`,shared:`用微观重排而非真实生成解释宏观变化。`,difference:`阿那克萨哥拉坚持无限可分和万物互含；留基伯以不可分原子和空无间隔终止分割。`}],russellView:`罗素在“原子论者”一章把留基伯和德谟克利特合并处理，因为二人的思想很难分开。他把原子论视为前苏格拉底自然研究的高潮：既接受巴门尼德关于基本存在不变的洞见，又通过多个原子和虚空给经验变化以清晰机械解释。`,modernCorrection:`不能把共同原子论系统中的每一条命题都写成留基伯个人发现，也不能由伊壁鸠鲁的否认直接断言他是虚构人物。最稳妥的层级是：历史存在有较强古代见证；创始作用很可能真实；具体生平、书目以及与德谟克利特的分工则高度不确定。页面采用的版画是十八世纪后世想象，不是肖像记录。`,sources:[M(`第一卷第九章〈原子论者〉`),{label:`Stanford Encyclopedia · Ancient Atomism`,kind:`补充`,url:`https://plato.stanford.edu/entries/atomism-ancient/`},{label:`Internet Encyclopedia of Philosophy · Leucippus`,kind:`补充`,url:`https://iep.utm.edu/leucipp/`}]},{id:`democritus`,order:10,nameZh:`德谟克利特`,nameEn:`Democritus of Abdera`,greekName:`Δημόκριτος`,dates:`约前 460—前 370`,active:`前 5 世纪后半`,places:[`阿布德拉`,`雅典（传统记载）`,`埃及与东方（旅行传统）`],school:`古代原子论`,figureId:`democritus`,chapterIds:[`b1-09`],thesis:`真实层只有形状各异的原子与虚空；感官性质、生命和世界由原子的数量、排列与运动关系生成，而伦理上的安宁则来自调节欲望、判断与生活尺度。`,evidenceCaution:`著作目录庞大却几乎全失，现存残篇和后世摘要的真伪、分类常有争议。旅行范围与“笑的哲学家”形象高度传奇化；许多物理命题也只能归给留基伯—德谟克利特共同体系。`,lifeSummary:`德谟克利特出生于色雷斯海岸的希腊城邦阿布德拉，与苏格拉底大致同时，却因理论延续早期自然哲学而被罗素放在苏格拉底之前讨论。传统说他继承财产后广泛旅行至埃及、波斯甚至更远地区，又曾到雅典而无人认识；可靠程度不一，却反映其后来“博学研究者”的名声。他写作范围据说覆盖宇宙、数学、感觉、医学、语言、技术和伦理。雅典哲学传统很少直接保存其作品，亚里士多德却持续认真讨论他的理论。后世称他为“笑的哲学家”，把节制、愉悦与看透人事结合成一种人物图像。`,timeline:[{date:`约前 460`,place:`阿布德拉`,title:`出生`,detail:`古代编年分歧很大；可以较稳妥地把他视为苏格拉底的同时代人。`,certainty:`推定`},{date:`前 5 世纪后半`,place:`地中海东部（旅行传统）`,title:`旅行与学习`,detail:`埃及、巴比伦、波斯乃至印度的行程多由晚期材料扩大，不宜画成确定路线。`,certainty:`传统记载`},{date:`约前 430 后`,place:`阿布德拉`,title:`扩展原子论体系`,detail:`将原子和虚空应用于宇宙、感觉、心灵、生命与文化解释，并形成大量著作传统。`,certainty:`较可靠`},{date:`约前 370`,place:`阿布德拉`,title:`去世与接受史`,detail:`长寿、公众尊崇及“笑的哲学家”故事主要塑造后世形象；确切卒年未知。`,certainty:`推定`}],inquiries:[{object:`原子结构与宏观变化`,question:`只有不变原子和虚空，如何产生不同物体、性质与世界？`,start:`若原子内部没有差异性质，就必须让差异来自它们之间的可重复关系。`,steps:[`让原子只在形状、大小上不同`,`用次序和位置区分结构`,`以碰撞、缠结、排列形成复合体`,`以分散解释复合物消灭，并允许无限虚空中形成无数世界`],conclusion:`宏观生成是结构涌现：基本单位保持不变，关系却能产生密度、质地、天体和生命等多层现象。`},{object:`感觉与知识`,question:`若颜色、甜苦只由原子互动产生，感官还能提供真实吗？`,start:`同一食物对不同身体可能呈现不同味道，说明性质不只属于对象本身；但理性又必须从感觉获得材料。`,steps:[`让对象释放原子薄膜作用于器官`,`用原子形状与器官状态解释感觉差异`,`区分约定性的感官性质与原子、虚空的真实结构`,`承认理性若否定全部感官，也会摧毁自身证据`],conclusion:`知识具有层级而非简单二分：感官给出现象，理性推断其微观原因；两者相互依赖且都可能受身体条件限制。`},{object:`人的生活、文化与安宁`,question:`一个机械自然世界中，怎样形成可实践的好生活？`,start:`幸福若依赖财富、名声或无限欲望，就持续受外界偶然运动支配。`,steps:[`把愉悦与痛苦视为行动信号而非最高放纵`,`用衡量和节制限制欲望`,`让判断、习惯与教育重塑人的原子状态`,`以社会合作、技艺和语言解释人类从匮乏走向文化`],conclusion:`目标是“心灵安宁”或“愉悦的平衡”：不是逃离物质世界，而是在因果世界中通过理解与训练获得较稳定的生活结构。`}],concepts:[{zh:`原子`,en:`atoms`,definition:`实在、坚实、不可切分且不生不灭的单位；彼此主要以形状、大小、次序和位置区分。`},{zh:`虚空`,en:`void`,definition:`原子运动和彼此分离所需的空无空间；与原子共同构成现实的两个基本方面。`},{zh:`约定性质`,en:`qualities by convention`,definition:`颜色、声音、冷热、甜苦不是孤立原子自带的性质，而在原子结构与感知者身体互动时出现。`},{zh:`必然性`,en:`necessity`,definition:`自然事件由原子运动及先行条件产生，无须诉诸为人安排的目的；它不是宿命预言，而是因果连续性。`},{zh:`心灵安宁`,en:`euthymia / cheerfulness`,definition:`通过节制、衡量、知识和稳定判断获得的平衡愉悦；与后来伊壁鸠鲁的宁静相近但不能完全等同。`},{zh:`物象`,en:`eidōla / images`,definition:`物体发出的细微原子结构作用于感官，用以说明视觉、梦与表象如何从外物到达身体。`},{zh:`尺度与节制`,en:`measure and moderation`,definition:`通过比较欲望、能力与后果维持心灵平衡；显示德谟克利特伦理并非由机械原子论简单自动推出。`}],lineage:{inherited:`直接发展留基伯的原子与虚空，并通过这一框架回答巴门尼德和芝诺；同时延续爱奥尼亚传统以自然过程统一解释天体、生命与人。`,school:`古代原子论的第一位大型系统化者。其机械自然论与伦理残篇共同属于德谟克利特传统，但二者是否组成一个严格演绎体系尚不确定。`,influenced:`伊壁鸠鲁继承原子、虚空和感觉论，却修改原子运动并建立以解除恐惧为目的的共同体伦理；卢克莱修将其转化为拉丁哲学诗。近代机械哲学又把德谟克利特视为古代先驱。`,parallel:`阿那克萨哥拉以无限混合和努斯解释同一组变化问题；柏拉图、亚里士多德也讨论感知和物质结构，却反对把形式、目的与价值完全还原为碰撞。`},comparisons:[{target:`留基伯`,relation:`承接前人`,shared:`原子、虚空、涡旋和非目的性的自然解释。`,difference:`传统把基本创意归给留基伯，把广泛系统化归给德谟克利特；具体边界大多无法确定。`},{target:`阿那克萨哥拉`,relation:`同题比较`,shared:`宏观对象由不可见成分及其关系解释。`,difference:`阿那克萨哥拉的成分无限可分、每物含一切，并由努斯启动；德谟克利特的原子不可分，在虚空中按机械必然运动。`},{target:`柏拉图／亚里士多德`,relation:`批评关系`,shared:`自然应当具有可说明的结构，感觉不能直接等同于真实。`,difference:`二人要求形式、目的或善在解释中发挥作用；德谟克利特优先用原子位置、碰撞和身体状态说明现象。`},{target:`伊壁鸠鲁`,relation:`影响后继`,shared:`以原子论消除神意对自然事件的任意干预，并把认识连接到生活安宁。`,difference:`伊壁鸠鲁加入原子偏斜、强调自由和无恐惧，把物理学更明确地服务于治疗性伦理。`}],russellView:`罗素把德谟克利特视为前苏格拉底科学精神的顶峰，也是后来哲学开始退让给伦理与宗教之前的最后一位纯粹自然解释者。他赞赏原子论用坚实不可变的单位、虚空和机械碰撞统一解释变化，也指出其因果决定论、感觉理论和无穷世界设想具有惊人的现代感。`,modernCorrection:`把德谟克利特称为“现代科学家”会掩盖古代论证背景：原子首先回应存在、分割和运动问题，而非实验检测到的粒子；古代原子也不是今天可分的化学原子。其伦理学并非附带格言，而可能通过身体—心灵连续性与自然论相连，但现存文本不足以证明一套从物理必然推出伦理规范的完整体系。现用雕像亦为身份不明的希腊头像，只作视觉识别。`,sources:[M(`第一卷第九章〈原子论者〉`),{label:`Stanford Encyclopedia · Ancient Atomism`,kind:`补充`,url:`https://plato.stanford.edu/entries/atomism-ancient/`},{label:`Internet Encyclopedia of Philosophy · Democritus`,kind:`补充`,url:`https://iep.utm.edu/democrit/`}]},{id:`protagoras`,order:11,nameZh:`普罗泰戈拉`,nameEn:`Protagoras of Abdera`,greekName:`Πρωταγόρας`,dates:`约前 490—前 420`,active:`前 5 世纪中后期`,places:[`阿布德拉`,`雅典`,`图里`],school:`智者运动`,figureId:`protagoras`,chapterIds:[`b1-10`],thesis:`人的具体经验是判断事物如何呈现的尺度；既然公共事务没有超人的直接真理入口，哲学就必须训练比较相反论证、改善判断并形成可共同生活的制度。`,evidenceCaution:`真实残篇不足十条，大部分材料来自柏拉图、亚里士多德等论敌。审判、焚书和海难故事互相冲突；“人是万物的尺度”究竟是感觉相对主义、实践判断论还是更广泛的人文立场，仍有争议。`,lifeSummary:`普罗泰戈拉出生于色雷斯海岸的阿布德拉，是最早公开以“智者”身份巡回收费教学的人之一。他至少两次到雅典，与伯里克利关系密切，并在前 444／443 年受托为南意大利泛希腊殖民城图里拟定政制。民主法庭、议会和城邦竞争使演说、概念区分与预判后果成为可出售的公共能力。后世说他因《论诸神》的不可知论被控不敬神、离城后遇海难；柏拉图却把他描述为享有声望并活到高龄，故这些结局无法确证。其著作几乎全失，题名显示兴趣横跨论辩、语言、政治与教育。`,timeline:[{date:`约前 490`,place:`阿布德拉`,title:`出生`,detail:`柏拉图称他比对话中的成年智者年长一代，由此通常推至前 490 年代；家庭出身传说彼此矛盾。`,certainty:`推定`},{date:`前 5 世纪中叶`,place:`希腊城邦网络`,title:`以智者身份巡回教学`,detail:`教授家庭和城邦事务中的“善于谋划”，并训练语言、诗歌解释和相反论证；收费使教育成为公开职业。`,certainty:`较可靠`},{date:`前 444／443`,place:`图里`,title:`参与制定殖民城政制`,detail:`伯里克利委托他为新城图里拟定法律或政制，显示其政治思想与民主实践并非纯粹修辞游戏。`,certainty:`较可靠`},{date:`约前 420`,place:`雅典／爱琴海`,title:`生命末期`,detail:`受审、焚书、逃亡和海难的故事可能把不可知论塑造成受神罚的传记；确切死因不明。`,certainty:`推定`}],inquiries:[{object:`知识与人的尺度`,question:`同一阵风对一人冷、对另一人不冷时，谁掌握事物的真实样貌？`,start:`人只能在自己的身体、历史经验和处境中接触事物，无法跳到一个无人称的神圣观察点。`,steps:[`从感觉差异扩展到意见和价值判断`,`把‘事物’理解为事物与人的关系`,`拒绝以单一表象取消另一表象`,`区分判断是否更好与是否更真`],conclusion:`每个人是事物向其呈现方式的尺度。命题不必否定外部世界；它限制的是脱离经验而宣称唯一尺度的资格。`},{object:`论辩、教育与改进`,question:`若相反意见各有处境基础，教师还能做什么？`,start:`相对性若只等于‘人人都对’，收费教学将失去理由，公共选择也无法区分优劣。`,steps:[`为每件事辨认相反论证`,`分析词义、语法与听众处境`,`预判意见在个人和城邦中的后果`,`用教育把较差状态转为较好状态`],conclusion:`智者不垄断绝对真理，而改善谋划和表达。较好的判断能带来健康、秩序或共同利益，即使不能被宣布为超历史真理。`},{object:`政治共同体与德性`,question:`民主为何可以让普通公民共同判断正义，而不只交给少数专家？`,start:`造船需要专业知识，但所有公民都被允许参与正义和政治问题；这种差别需要解释。`,steps:[`区分维持生存的专门技艺与共同生活能力`,`以神话说明正义感和羞耻感被普遍分配`,`承认习俗塑造判断`,`用教育、法律和讨论持续改善公民能力`],conclusion:`政治德性不是少数天才的秘密技术，而是人人必须具有、程度又可训练的共同能力；这为民主论辩提供了认识论基础。`}],concepts:[{zh:`人是尺度`,en:`man-measure thesis`,definition:`人是事物如何对其显现和被评价的尺度；“人”可指具体个人，也可能包含共享经验形成的共同体。`},{zh:`相反论证`,en:`antilogiai / opposing arguments`,definition:`同一问题可以形成彼此对立的论证。训练目标不只是获胜，也包括暴露判断对前提和处境的依赖。`},{zh:`善于谋划`,en:`euboulia / good deliberation`,definition:`在家庭和城邦事务中判断行动、语言及其后果的实践能力，是普罗泰戈拉自述的教学目标。`},{zh:`诸神不可知`,en:`agnosticism about the gods`,definition:`由于问题晦暗且人生短暂，无法确定诸神存在、不存在或形貌；这是知识限度声明，不等于证明无神。`},{zh:`政治德性`,en:`political virtue`,definition:`参与共同生活所需的正义感、羞耻感和判断能力；它被广泛分配，却仍须通过法律、教育与讨论训练。`},{zh:`使弱论证变强`,en:`making the weaker argument stronger`,definition:`古代争议性标签，可指训练从不利立场提出更有效论证；它既可能服务审辨，也可能被批评为修辞胜过真理。`}],lineage:{inherited:`继承前苏格拉底关于真理、感觉和世界的争论，却把问题从宇宙结构转到人的经验、语言和政治判断；阿布德拉背景不证明他师从较年轻的德谟克利特。`,school:`智者不是共享教义的严密学派，而是收费巡回教学、公共演说和政治教育的职业网络。普罗泰戈拉是其中最早且最具理论深度的代表。`,influenced:`欧里庇得斯等雅典文化人物受到智者论辩氛围影响；柏拉图以《普罗泰戈拉》《泰阿泰德》系统回应其相对主义，亚里士多德又用不矛盾律批评它。`,parallel:`现代实用主义同样区分抽象真理与判断后果，但不能把普罗泰戈拉直接写成现代实用主义者；民主教育与价值相对主义之间也不是必然等号。`},comparisons:[{target:`巴门尼德`,relation:`批评关系`,shared:`都从‘何者可被说真’重组哲学问题。`,difference:`巴门尼德排除凡人意见以维护唯一可靠道路；普罗泰戈拉把具体人的经验重新确立为不可越过的判断条件。`},{target:`苏格拉底`,relation:`同题比较`,shared:`都在公共对话中检验德性、教育和城邦判断。`,difference:`普罗泰戈拉教授可改善的谋划与表达；苏格拉底更执着于追问跨处境的定义，并拒绝以收费宣称传授德性。`},{target:`柏拉图`,relation:`批评关系`,shared:`都承认教育会改变灵魂和政治判断。`,difference:`柏拉图要求理念与善提供超越意见的标准；普罗泰戈拉从人的经验与共同后果内部比较判断。`},{target:`实用主义`,relation:`后世重构`,shared:`可以说一种判断比另一种带来更好的实践结果。`,difference:`现代实用主义发展了探究共同体、可错论和真理理论；现存材料不足以把这些完整框架归给普罗泰戈拉。`}],russellView:`罗素把智者置于雅典民主法庭、财富和文化冲突中，反对照搬柏拉图的贬低。他把“人是尺度”解释为没有客观真理，却特别注意到柏拉图替普罗泰戈拉提出的修正：意见未必有真假高下，却可能有好坏后果。罗素因此把他连接到实用主义，并认为收费教学本身不比现代教授领薪更可耻。`,modernCorrection:`现代研究比罗素更谨慎：尺度命题不必宣称外部世界不存在，也不必等于所有命题都真；它可能主要说明性质和价值如何在具体经验关系中呈现。普罗泰戈拉对民主的支持不能只由柏拉图对话中的神话直接推定，但图里政制、善于谋划和普遍政治能力共同构成了较强线索。`,sources:[M(`第一卷第十章〈普罗泰戈拉〉`),{label:`Stanford Encyclopedia · Protagoras`,kind:`补充`,url:`https://plato.stanford.edu/entries/protagoras/`},{label:`Internet Encyclopedia of Philosophy · Protagoras`,kind:`补充`,url:`https://iep.utm.edu/protagor/`}]},{id:`socrates`,order:12,nameZh:`苏格拉底`,nameEn:`Socrates`,greekName:`Σωκράτης`,dates:`前 469／468—前 399`,active:`前 5 世纪后半`,places:[`雅典`,`波提狄亚`,`德利翁`],school:`苏格拉底式探问`,figureId:`socrates`,chapterIds:[`b1-11`],thesis:`哲学不是占有一套答案，而是让每个关于善、勇敢和正义的主张经受公开反诘；未经检验的信念不能可靠指导生活，承认无知则是继续探究的起点。`,evidenceCaution:`本人没有著作。阿里斯托芬、色诺芬和柏拉图提供互相冲突的形象，亚里士多德又属后见者；很难把柏拉图对话中的理念论、灵魂不朽论与历史苏格拉底逐项分开，这就是“苏格拉底问题”。`,lifeSummary:`苏格拉底是雅典公民，父亲传统上被称为石匠索弗洛尼斯科斯，母亲为助产妇斐纳瑞特。他生活在雅典帝国扩张、伯罗奔尼撒战争、寡头政变与民主复辟的连续危机中，作为重装步兵参加波提狄亚、德利翁等战役。与巡回智者不同，他长期在市场、体育场和私人场合免费交谈。前 406 年任五百人会议主席团成员时反对违法集体审判将领；前 404 年又拒绝三十僭主逮捕莱昂的命令。前 399 年被控不敬城邦诸神、引入新神灵并败坏青年，判死后拒绝逃亡，饮毒芹而死。`,timeline:[{date:`前 469／468`,place:`雅典`,title:`出生`,detail:`属于有资格服重装步兵役但并不富裕的公民家庭；具体职业与家庭细节多来自较晚传统。`,certainty:`较可靠`},{date:`前 432—前 422`,place:`波提狄亚／德利翁等地`,title:`参加伯罗奔尼撒战争`,detail:`柏拉图和色诺芬都保存其服役、耐苦与救助同伴的记载，细节带有典范化色彩。`,certainty:`较可靠`},{date:`前 406`,place:`雅典`,title:`反对违法集体审判将领`,detail:`抽签任主席团成员期间，坚持应分别审判阿吉纽西海战将领，显示其守法并不等于服从多数压力。`,certainty:`较可靠`},{date:`前 404`,place:`雅典`,title:`拒绝三十僭主命令`,detail:`寡头政府命他参与逮捕萨拉米斯的莱昂，他拒绝执行；政权很快倒台，因而未及惩罚。`,certainty:`较可靠`},{date:`前 399`,place:`雅典`,title:`受审并饮毒芹`,detail:`被判有罪后拒绝以逃亡取消自身的公共实践，在宗教节期延迟执行后于狱中死亡。`,certainty:`较可靠`}],inquiries:[{object:`德性概念与反诘`,question:`一个人自称知道勇敢、虔敬或正义时，他真的能给出不矛盾的说明吗？`,start:`公共生活充满自信判断，但举例、传统和权威并不自动构成对概念本身的认识。`,steps:[`请对话者提出一般定义`,`从其承认的案例和前提追问后果`,`暴露定义遗漏或相互矛盾`,`回到困惑而不以假答案填补`],conclusion:`反诘的直接成果常是“尚不知道”，但它清除了错误自信，并把德性从习俗口号变成必须持续论证的生活问题。`},{object:`知识、行动与灵魂照料`,question:`为什么人明知善却仍作恶；德性是否是一种知识？`,start:`人总在自己看来较好的方向行动；若选择了坏结果，可能是误判真正利益，而非清楚知道善仍纯粹选择恶。`,steps:[`把行动连接到行动者对善的判断`,`把错误行为追溯为无知或衡量失败`,`以论辩重排财富、名誉和灵魂的优先级`,`让自我检验成为持续实践`],conclusion:`照料灵魂首先是改善判断。‘无人自愿作恶’不是否认欲望冲突，而是把伦理失败的根部置于对何者真正有益的误认。`},{object:`个人良知、法律与死亡`,question:`当多数、政府命令和个人判断冲突时，哲学家应服从什么？`,start:`苏格拉底先后面对民主集会、三十僭主和陪审团；任何一方都可能作出不义决定。`,steps:[`不因多数威胁参与违法审判`,`不因寡头命令伤害无辜`,`在合法审判中公开坚持使命`,`拒绝以逃亡回报城邦的不义`],conclusion:`不能主动行不义，也不能以不义报不义；服从法律与批判公民不是简单二选一，而是要让行动能经受理性和公共责任检验。`}],concepts:[{zh:`反诘`,en:`elenchus`,definition:`从对话者自己的主张出发，通过问题检验其一致性；目标首先是揭露错误自信，不必每次给出正面学说。`},{zh:`承认无知`,en:`Socratic ignorance`,definition:`知道自己不具有所声称的智慧。它不是全面怀疑，而是区分可继续探究的问题与未经证明的自信。`},{zh:`灵魂照料`,en:`care of the soul`,definition:`使人的判断、欲望与行动趋向正义和善，优先于财富、名望及身体利益。`},{zh:`助产术`,en:`maieutic method`,definition:`柏拉图以其母亲职业作比喻：教师不把答案灌入学生，而协助其产出、检验并淘汰思想。`},{zh:`神灵征兆`,en:`daimonion`,definition:`苏格拉底自称从童年起出现、通常阻止某些行动的内在神圣信号；它不是一套可供他人服从的新宗教。`},{zh:`德性即知识`,en:`virtue is knowledge`,definition:`把正确行动连接到对善与真正利益的认识；它强调伦理可受理性检验，却可能低估欲望冲突与意志软弱。`},{zh:`无人自愿作恶`,en:`no one errs willingly`,definition:`作恶者是在善与利益上发生误认，而非清楚把坏当坏仍纯粹选择它；其准确范围取决于我们怎样区分苏格拉底与柏拉图。`},{zh:`未经审视的生活`,en:`the unexamined life`,definition:`生活若不持续检查自身理由、价值排序和公共责任，便不能仅凭生存、财富或名声证明其值得。`}],lineage:{inherited:`继承智者把语言、教育和城邦放到哲学中心的转向，也吸收自然哲学知识；但拒绝把论辩缩成可出售的成功工具。`,school:`没有制度化‘苏格拉底学院’。柏拉图、色诺芬、安提斯泰尼、阿里斯提卜等形成不同苏格拉底传统，分别发展理念论、犬儒主义和昔兰尼快乐论。`,influenced:`柏拉图让他成为大多数对话的主角；亚里士多德把归纳论证和一般定义追求归给他。犬儒、斯多葛和学院怀疑主义都从不同侧面认领苏格拉底。`,parallel:`孔子同样通过对话、人格示范和公共伦理影响学生，但两者的城邦制度、文本传统与对礼法的理解不同，只适合方法层比较。`},comparisons:[{target:`普罗泰戈拉`,relation:`同题比较`,shared:`哲学围绕教育、德性和公共言说展开。`,difference:`普罗泰戈拉承诺改善公民谋划；苏格拉底以反诘拒绝在未定义德性前宣称能直接传授它。`},{target:`柏拉图`,relation:`影响后继`,shared:`对话、灵魂照料及知识与善的连接。`,difference:`柏拉图发展理念、灵魂结构和理想政体；这些体系不能无条件写回没有著作的历史苏格拉底。`},{target:`第欧根尼`,relation:`后世重构`,shared:`用个人生活公开检验财富、权力和习俗。`,difference:`苏格拉底仍深度参与雅典公民秩序；犬儒派把自足和反习俗推进为身体化、跨城邦的激进实践。`},{target:`阿尔克西劳`,relation:`后世重构`,shared:`以问答清除自负，不把正面教条当作哲学终点。`,difference:`苏格拉底是否全面悬置判断并不确定；阿尔克西劳则针对斯多葛知识标准系统发展学院怀疑主义。`}],russellView:`罗素把“我们究竟知道历史苏格拉底多少”置于章节中心，比较色诺芬的保守道德家、柏拉图的哲学主角与阿里斯托芬的滑稽自然研究者。他认为相对可信的核心包括反诘、神灵征兆、德性即知识和无人自愿作恶，并赞赏其在审判中的独立，但也质疑把一切道德错误还原为知识错误。`,modernCorrection:`不能用简单的‘早期对话等于历史苏格拉底、晚期等于柏拉图’彻底解决来源问题；对话有文学目的，色诺芬和阿里斯托芬也各有体裁偏向。审判既不能只说成保守民主对自由思想的迫害，也不能只归咎于他与寡头学生的关系：宗教指控、战争创伤、公共形象和法庭策略共同作用。`,sources:[M(`第一卷第十一章〈苏格拉底〉`),{label:`Stanford Encyclopedia · Socrates`,kind:`补充`,url:`https://plato.stanford.edu/entries/socrates/`},{label:`Internet Encyclopedia of Philosophy · Socrates`,kind:`补充`,url:`https://iep.utm.edu/socrates/`}]},{id:`plato`,order:13,nameZh:`柏拉图`,nameEn:`Plato`,greekName:`Πλάτων`,dates:`前 428／427—前 348／347`,active:`前 4 世纪前半`,places:[`雅典`,`叙拉古`,`大希腊`],school:`柏拉图哲学／学院`,figureId:`plato`,chapterIds:[`b1-13`,`b1-14`,`b1-15`,`b1-16`,`b1-17`,`b1-18`],thesis:`可见世界不断变化，意见又受处境摆动；哲学必须寻找使多种事物可被共同理解和评价的稳定形式，并以灵魂教育把对善的认识连接到个人秩序与城邦秩序。`,evidenceCaution:`作品几乎全以对话写成，作者本人很少直接发言；不同对话会修正甚至批评理念、政治和知识方案。第七封信的真伪仍有争议，叙拉古政治经历的细节不能全部据此坐实。`,lifeSummary:`柏拉图出生于雅典显贵家庭，青年经历伯罗奔尼撒战争失败、三十僭主暴政、民主复辟和苏格拉底之死。传统说他原有政治抱负，却因不同政体的实际表现转向哲学。苏格拉底死后，他可能游历南意大利和西西里，接触毕达哥拉斯传统；三次叙拉古之行试图通过狄翁和狄奥尼修斯二世推进哲学教育与政治改革，结果均不理想。约前 387 年，他在雅典创办学院，形成长期研究共同体。留下的对话横跨伦理、语言、数学、知识、政治、灵魂和宇宙论，其戏剧结构本身要求读者比较立场而非只背结论。`,timeline:[{date:`前 428／427`,place:`雅典`,title:`出生于贵族家庭`,detail:`家族与雅典政治精英关系密切；“柏拉图”可能是昵称，但具体来源并不可靠。`,certainty:`较可靠`},{date:`约前 407—前 399`,place:`雅典`,title:`进入苏格拉底交往圈`,detail:`苏格拉底成为其对话写作和哲学生活的核心形象；具体相识年份由晚期传统推定。`,certainty:`推定`},{date:`前 399 后`,place:`雅典 → 大希腊／西西里`,title:`旅行与思想重组`,detail:`苏格拉底死后离开雅典，接触南意大利毕达哥拉斯传统的说法可信度较高，完整路线则难确定。`,certainty:`传统记载`},{date:`约前 387`,place:`雅典`,title:`创办学院`,detail:`学院不是近代大学式校园，而是围绕研究、讨论和长期师生关系形成的共同体，持续约九百年并多次转型。`,certainty:`较可靠`},{date:`前 367／366、前 361`,place:`叙拉古`,title:`参与叙拉古政治教育`,detail:`试图影响年轻统治者狄奥尼修斯二世并支持狄翁改革；行程较可靠，动机和责任主要依赖有争议的书信材料。`,certainty:`传统记载`}],inquiries:[{object:`知识、意见与理念`,question:`许多事物都被称为美或正义时，知识把握的是哪些个例，还是使其成为同类的共同标准？`,start:`感官对象会变化、彼此混杂，同一事物在不同关系中既美又不美；稳定定义不能只复制个例。`,steps:[`从多种个例追问共同的‘是什么’`,`区分可见的生成世界与可理解的形式`,`把理念设为定义、解释和评价的对象`,`再检验个别事物如何参与或模仿理念`],conclusion:`知识指向较稳定、可说明的形式，而意见面对可变现象；但“参与”如何成立以及理念是否无限增生，在《巴门尼德篇》等作品中被主动反思。`},{object:`灵魂、教育与正义`,question:`个人欲望、勇气与理性冲突时，怎样形成不靠偶然强制的正义？`,start:`城邦和个人都由功能不同的部分组成；若任何部分都夺取整体支配权，就产生内战式失序。`,steps:[`把城邦放大为可观察的灵魂结构`,`区分理性、意气和欲望`,`用音乐、体育、数学与辩证法重塑欲望`,`让认识善的部分统摄整体`],conclusion:`正义是各部分完成合适功能并形成秩序。哲学王方案由此把知识资格转成统治资格，也留下谁监督知识者的政治难题。`},{object:`宇宙、形式与原因`,question:`可变物质怎样呈现数学秩序和相对稳定的自然结构？`,start:`完全无序的材料不能解释几何比例、天体周期和生命结构；纯粹理念又不能单独说明生成世界。`,steps:[`以永恒模型作为秩序尺度`,`让工匠神说服必然性并安排混沌`,`用数、比例和几何体组织元素`,`把宇宙理解为具有灵魂的可见整体`],conclusion:`《蒂迈欧篇》以目的和数学形式组织自然，但明确把许多说明称为“可能的故事”；它不是现代意义的字面创世科学。`},{object:`对话、辩证法与未完成知识`,question:`如果哲学不能只靠权威传递，写作怎样让读者真正参与推理？`,start:`直接宣告结论容易产生记忆，却不能保证读者理解前提、反例和适用范围。`,steps:[`把观点分配给具有处境的角色`,`让问答暴露语言与心理阻力`,`用神话和比喻连接难以直接证明的层级`,`以无结论或内部批评把任务交还读者`],conclusion:`柏拉图并非只留下封闭体系；对话体把哲学保存为持续检验理念、生活和政治的活动。`}],concepts:[{zh:`理念`,en:`Forms / Ideas`,definition:`使多个个例可被共同定义和评价的稳定、可理解对象，如美本身、正义本身；不同对话对其地位与范围并不完全一致。`},{zh:`善的理念`,en:`Form of the Good`,definition:`知识、价值和可理解秩序的最高条件；《理想国》以太阳比喻它，却没有给出一套简单定义。`},{zh:`辩证法`,en:`dialectic`,definition:`通过问答、假设上升与概念区分寻找第一原则的活动；不是后世黑格尔式历史辩证法。`},{zh:`灵魂三分`,en:`tripartite soul`,definition:`理性、意气、欲望三种动力的结构模型，用以连接个人冲突、教育和城邦阶层。`},{zh:`哲学王`,en:`philosopher-ruler`,definition:`掌握善与整体秩序、因而被要求统治的哲学家；它把认识论与政治权威相连，也承受罗素最强烈的批评。`},{zh:`分有`,en:`participation / methexis`,definition:`个别事物以某种方式具有或呈现理念，由此成为可定义和评价的对象；这种关系如何成立正是理念论的内部难题。`},{zh:`回忆说`,en:`recollection / anamnēsis`,definition:`学习被描述为灵魂在提问引导下重新把握先前可知结构，用以说明感官经验为何能引出普遍知识。`},{zh:`线喻与洞穴`,en:`divided line and cave`,definition:`把影像、可见物、数学对象与理念排列为认识层级，同时展示教育是灵魂整体转向，而非简单灌输信息。`},{zh:`模仿`,en:`mimēsis / imitation`,definition:`艺术、语言或可见事物对对象和形式的再现关系；柏拉图既警惕其远离真理，也在对话和神话中主动使用它。`}],lineage:{inherited:`从苏格拉底继承概念探问与灵魂照料，从巴门尼德继承稳定可知对象，从赫拉克利特吸收感性流变，从毕达哥拉斯传统吸收数学、轮回和共同体生活。`,school:`学院持续近九百年，却经历早期柏拉图主义、学院怀疑主义和后期综合等变化；“柏拉图主义”不能被缩成一份固定教义清单。`,influenced:`亚里士多德在学院学习约二十年，既继承又批评理念分离；中期柏拉图主义、新柏拉图主义、奥古斯丁和近代数学理性主义都重新组织其资源。`,parallel:`儒家同样把教育、人格秩序和政治关联，但柏拉图依靠理念、灵魂结构和哲学知识资格，不能用“哲学王等于圣王”消除制度差异。`},comparisons:[{target:`苏格拉底`,relation:`承接前人`,shared:`对话、定义探问与灵魂优先。`,difference:`苏格拉底形象多停在反诘和无知；柏拉图发展理念、宇宙论、灵魂不朽与完整政治教育。`},{target:`普罗泰戈拉`,relation:`批评关系`,shared:`知识与教育都必须解释判断怎样被改变。`,difference:`普罗泰戈拉从具体经验和后果内部比较意见；柏拉图要求不随意见变化的理念与善作为尺度。`},{target:`亚里士多德`,relation:`影响后继`,shared:`形式、目的和理性秩序解释自然与善。`,difference:`柏拉图常把形式置于可感个体之外；亚里士多德把形式作为具体实体的结构和活动原则。`},{target:`阿尔克西劳`,relation:`后世重构`,shared:`对话经常以困惑结束，并要求检验自信。`,difference:`学院怀疑主义把这一苏格拉底面向用于全面挑战确定印象；柏拉图也提出大量正面形而上与政治方案。`}],russellView:`罗素认为柏拉图在古今哲学家中影响最大，按毕达哥拉斯、巴门尼德、赫拉克利特和苏格拉底四个来源压缩其结构。他赞赏理念论首次系统处理共相、数学与知识，却猛烈批评《理想国》把善的垄断、严格教育、审查和阶层固定结合为极权式政治。对《蒂迈欧篇》，他强调其对古代和中世纪的巨大影响，也区分严肃结构与想象细节。`,modernCorrection:`罗素把柏拉图压缩成一套稳定体系，并以二十世纪政治概念读取《理想国》，有很强启发性却会遮蔽对话的探索性、反讽和内部修正。现代研究不把所有角色发言等同于作者立场，也不默认理念论在全部作品中形式一致；叙拉古经历则说明政治兴趣真实存在，但不能反过来证明《理想国》是一份可直接执行的政纲。`,sources:[M(`第一卷第十三至十八章〈柏拉图〉`),{label:`Stanford Encyclopedia · Plato`,kind:`补充`,url:`https://plato.stanford.edu/entries/plato/`},{label:`Internet Encyclopedia of Philosophy · Plato`,kind:`补充`,url:`https://iep.utm.edu/plato/`}]},{id:`aristotle`,order:14,nameZh:`亚里士多德`,nameEn:`Aristotle of Stagira`,greekName:`Ἀριστοτέλης`,dates:`前 384—前 322`,active:`前 4 世纪中后期`,places:[`斯塔吉拉`,`雅典`,`阿索斯`,`莱斯沃斯`,`佩拉／马其顿`,`卡尔基斯`],school:`逍遥学派`,figureId:`aristotle`,chapterIds:[`b1-19`,`b1-20`,`b1-21`,`b1-22`,`b1-23`],thesis:`知识应从现象和公认意见出发，区分事物是什么、由何构成、怎样产生及为何如此；形式不必脱离个体存在，解释也不能只剩材料和碰撞。`,evidenceCaution:`现存文本多像讲义、研究记录或后期编订，不是本人准备出版的完整著作；书名、次序和部分归属由后世编辑形成。与亚历山大的教学关系确实存在，但具体内容和政治影响几乎未知。`,lifeSummary:`亚里士多德出生于马其顿边缘城邦斯塔吉拉，父亲尼各马可与马其顿王室医学传统有关。约十七岁到雅典，在柏拉图学院活动近二十年；柏拉图死后前往小亚细亚阿索斯，后与泰奥弗拉斯托在莱斯沃斯从事生物研究。前 343 年应腓力二世邀请教育少年亚历山大，影响程度难以确认。前 335 年返回雅典，在吕克昂建立研究共同体，系统收集政制、动物、诗歌和论证材料。亚历山大死后反马其顿情绪上升，他离开雅典赴卡尔基斯，次年去世。其学科划分和术语统治欧洲、伊斯兰世界与大学教育数世纪。`,timeline:[{date:`前 384`,place:`斯塔吉拉`,title:`出生`,detail:`父亲尼各马可是医生并与马其顿宫廷有关，这一背景可能促进其生物兴趣，但不能据此推出完整医学师承。`,certainty:`较可靠`},{date:`约前 367—前 347`,place:`雅典`,title:`在柏拉图学院学习研究`,detail:`约二十年持续参与学院活动，既吸收形式和目的问题，也逐渐反对把理念与个体完全分离。`,certainty:`较可靠`},{date:`前 347—前 343`,place:`阿索斯／莱斯沃斯`,title:`旅行、婚姻与生物研究`,detail:`在赫尔米阿斯政治网络中生活，迎娶皮提亚斯；与泰奥弗拉斯托研究海洋生物。`,certainty:`较可靠`},{date:`前 343 后`,place:`佩拉／马其顿`,title:`教育亚历山大`,detail:`确有受聘关系，直接授课可能只有两三年；后世关于其塑造帝国政策的说法缺少证据。`,certainty:`较可靠`},{date:`前 335—前 323`,place:`雅典`,title:`建立吕克昂研究共同体`,detail:`组织跨学科搜集、讲授和协作，后世因园中回廊称其传统为逍遥学派。`,certainty:`较可靠`},{date:`前 322`,place:`卡尔基斯`,title:`离开雅典并去世`,detail:`亚历山大死后反马其顿情绪激化，他因宗教指控风险离城，在优卑亚岛自然死亡。`,certainty:`较可靠`}],inquiries:[{object:`实体、质料与形式`,question:`具体事物既会变化又保持种类同一，解释应把何者视为基本存在？`,start:`若理念完全分离，它难以说明这匹马为何是马、怎样生长；若只剩材料，又解释不了结构和功能。`,steps:[`从具体个体而非分离理念开始`,`区分承受变化的质料与使其成为某物的形式`,`把生成理解为潜能实现`,`以实体统一属性、变化和定义`],conclusion:`首要实体是由质料与形式组成的具体个体；形式是其可说明结构和活动原则，而非另一个与个体平行的复制物。`},{object:`解释充分性与四因`,question:`说一座雕像由青铜构成，是否已经解释了它？`,start:`材料回答‘由什么’，却没有回答形状、制作者、形成过程和用途；不同研究问题需要不同原因。`,steps:[`材料因说明构成`,`形式因说明结构与定义`,`动力因说明变化来源`,`目的因说明过程趋向的完成状态`],conclusion:`充分解释要按对象组合四种原因。目的因并不总是有意识设计，而可指器官或生物发展所实现的功能。`},{object:`知识、逻辑与科学`,question:`怎样从观察和公认意见达到可证明的普遍知识？`,start:`经验给出个别事实，辩论给出共享起点；科学却要求说明为何必然如此。`,steps:[`收集现象和可信意见`,`通过分类与辩证法发现困难`,`以三段论检查推论形式`,`由真实、首要的原理演绎属性并解释原因`],conclusion:`逻辑是组织知识的工具，不替代观察；科学证明把事实置入原因结构。第一原理本身不能由无限证明链获得。`},{object:`幸福、德性与城邦`,question:`人的好生活是感受、财富，还是一种持续活动？`,start:`短暂快乐和外部财富会变化；人的独特能力是以理性组织欲望、选择和共同生活。`,steps:[`由人的功能寻找好生活标准`,`把幸福定义为合德性的活动`,`以习惯在过度与不足之间形成中道`,`让法律和城邦教育提供实践条件`],conclusion:`幸福是一生中理性能力的卓越活动，需要德性、友谊和一定外部条件；人作为政治动物，不能脱离共同体独自完成。`}],concepts:[{zh:`质料与形式`,en:`matter and form / hylomorphism`,definition:`具体实体的两个解释面向：质料提供可被组织的材料，形式使其成为这一种事物并具有相应活动能力。`},{zh:`潜能与现实`,en:`potentiality and actuality`,definition:`变化不是无中生有，而是某种能力在合适条件下实现；现实在解释上通常优先于潜能。`},{zh:`四因`,en:`four causes`,definition:`材料、形式、动力和目的四类“为什么”。它们不是互相竞争的四个事件，而是不同层次的解释问题。`},{zh:`实体`,en:`substance / ousia`,definition:`首要存在者和属性承担者。亚里士多德不同著作在具体个体、形式与本质之间调整重心。`},{zh:`中道`,en:`doctrine of the mean`,definition:`实践德性在相对于行动者和情境的过度与不足之间作合理由选择，不是机械平均或永远温和。`},{zh:`三段论`,en:`syllogism`,definition:`若干前提按一定形式推出结论的论证结构；科学三段论还要求前提真实、首要并说明对象的原因。`},{zh:`幸福`,en:`eudaimonia / flourishing`,definition:`一生中依德性实现人的理性能力的活动，不是瞬间感受；友谊、政治共同体与一定外部条件也不可完全缺少。`},{zh:`实践智慧`,en:`phronēsis / practical wisdom`,definition:`在具体处境中看出何者重要、怎样选择合宜手段的判断能力；它连接一般德性与不可重复的行动情境。`},{zh:`政治动物`,en:`political animal`,definition:`人的语言和正义判断在共同体中展开，城邦因此不只是安全契约，也是实践好生活的制度条件。`}],lineage:{inherited:`在柏拉图学院中形成问题框架，同时吸收前苏格拉底材料论、希波克拉底医学观察和城邦政制经验；其哲学常以整理并修正前人开始。`,school:`吕克昂／逍遥学派是协作研究共同体。泰奥弗拉斯托继承自然研究；后世亚里士多德主义经过希腊注释家、伊斯兰哲学家和拉丁经院多次重构。`,influenced:`其逻辑、形而上学、伦理、政治与自然分类构成中世纪大学课程；阿维森纳、阿威罗伊、阿奎那等以不同方式结合或批评其体系。`,parallel:`现代科学继承分类、因果与系统观察，却拒绝许多目的论物理和权威化结论；不能把亚里士多德简单称为现代经验科学家或其反面。`},comparisons:[{target:`柏拉图`,relation:`承接前人`,shared:`形式、目的、德性和知识必须
