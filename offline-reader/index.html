的影响`,`Locke's Influence`,637,[`自由主义`,`影响`]],[`b3-16`,`modern`,`从文艺复兴到休谟`,`XVI`,`贝克莱`,`Berkeley`,643,[`观念论`,`知觉`]],[`b3-17`,`modern`,`从文艺复兴到休谟`,`XVII`,`休谟`,`Hume`,655,[`怀疑`,`因果`]],[`b3-18`,`modern`,`从卢梭到现代`,`XVIII`,`浪漫主义运动`,`The Romantic Movement`,670,[`浪漫主义`,`个人`]],[`b3-19`,`modern`,`从卢梭到现代`,`XIX`,`卢梭`,`Rousseau`,679,[`自由`,`政治`]],[`b3-20`,`modern`,`从卢梭到现代`,`XX`,`康德`,`Kant`,696,[`知识`,`先验`]],[`b3-21`,`modern`,`从卢梭到现代`,`XXI`,`十九世纪的思想潮流`,`Currents of Thought in the Nineteenth Century`,712,[`历史`,`思想`]],[`b3-22`,`modern`,`从卢梭到现代`,`XXII`,`黑格尔`,`Hegel`,722,[`辩证法`,`国家`]],[`b3-23`,`modern`,`从卢梭到现代`,`XXIII`,`拜伦`,`Byron`,738,[`浪漫主义`,`个人`]],[`b3-24`,`modern`,`从卢梭到现代`,`XXIV`,`叔本华`,`Schopenhauer`,745,[`意志`,`悲观主义`]],[`b3-25`,`modern`,`从卢梭到现代`,`XXV`,`尼采`,`Nietzsche`,751,[`价值`,`权力`]],[`b3-26`,`modern`,`从卢梭到现代`,`XXVI`,`功利主义者`,`The Utilitarians`,764,[`功利`,`伦理`]],[`b3-27`,`modern`,`从卢梭到现代`,`XXVII`,`卡尔·马克思`,`Karl Marx`,773,[`历史`,`阶级`]],[`b3-28`,`modern`,`从卢梭到现代`,`XXVIII`,`柏格森`,`Bergson`,782,[`时间`,`直觉`]],[`b3-29`,`modern`,`从卢梭到现代`,`XXIX`,`威廉·詹姆斯`,`William James`,801,[`实用主义`,`经验`]],[`b3-30`,`modern`,`从卢梭到现代`,`XXX`,`约翰·杜威`,`John Dewey`,809,[`实用主义`,`教育`]],[`b3-31`,`modern`,`从卢梭到现代`,`XXXI`,`逻辑分析哲学`,`The Philosophy of Logical Analysis`,818,[`分析`,`逻辑`]]].map(([e,t,n,r,i,a,o,s])=>({id:e,book:t,part:n,roman:r,title:i,english:a,pdfPage:o,themes:s})),p={"b1-04":{context:`爱奥尼亚自然哲学之后，思想开始把‘变化本身’当作世界的基本事实。`,summary:`赫拉克利特把世界理解为持续生成的秩序。对立并非秩序的失败，而是维持秩序的张力；火与逻各斯分别呈现变化的形象和变化中的尺度。`,keyPoints:[`万物处于流变，稳定更像关系而非静止实体。`,`对立面彼此依存，冲突能够构成和谐。`,`逻各斯意味着变化仍可被理性把握。`],russell:`罗素欣赏其历史影响，但警惕把冲突神秘化。他把赫拉克利特视作后来辩证思维的重要源头。`,questions:[`如果一切都变，知识如何可能？`,`‘对立统一’是解释，还是一种描述方式？`],axis:[`变化`,`恒常`]},"b1-11":{context:`雅典民主、战争与智者运动共同构成苏格拉底活动的公共空间。`,summary:`苏格拉底把哲学的中心从自然转向‘应当怎样生活’。他的问答法并不直接交付结论，而是通过暴露概念矛盾，要求人对自己的信念负责。`,keyPoints:[`德性与知识存在紧密联系。`,`自知首先意味着承认无知。`,`审问概念也是一种公共伦理实践。`],russell:`罗素区分历史上的苏格拉底与柏拉图笔下的形象，并强调资料互相冲突带来的困难。`,questions:[`知道善是否足以使人行善？`,`苏格拉底的守法与独立批判是否矛盾？`],axis:[`个人良知`,`城邦法律`]},"b1-14":{context:`伯罗奔尼撒战争后的政治失序，使柏拉图将正义问题与理想政体连在一起。`,summary:`《理想国》把城邦看成放大的灵魂：理性、意气与欲望各安其位，正义便是整体秩序。哲学王方案把知识资格转化为统治资格。`,keyPoints:[`正义被界定为各部分履行适当功能。`,`教育制度比个别法律更根本。`,`哲学王将真理与政治权威结合。`],russell:`罗素认为这套秩序牺牲了个人自由，并把它视作后来极权式政治理想的一条思想先声。`,questions:[`掌握真理能否自动带来统治正当性？`,`共同体秩序可以在多大程度上塑造个人生活？`],axis:[`社会秩序`,`个人自由`]},"b1-19":{context:`亚里士多德在批评柏拉图理念论的同时，试图保留形式与可理解秩序。`,summary:`具体事物是质料与形式的结合；变化可借潜能到现实的展开来说明。实体、四因与不动的推动者共同构成一套层级化世界图景。`,keyPoints:[`形式不在事物之外，而在具体实体之中。`,`四因同时回答材料、结构、动力与目的。`,`潜能与现实解释变化而不放弃同一性。`],russell:`罗素肯定其概念影响，也批评目的论和传统权威后来阻碍经验科学。`,questions:[`目的因是自然解释的一部分吗？`,`形式与质料能否真正避免柏拉图式二分？`],axis:[`经验事物`,`形式秩序`]},"b1-28":{context:`城邦独立衰落后，哲学的重心从公共政治转向个人如何承受不确定世界。`,summary:`斯多葛主义区分可控制与不可控制之物，把德性视为唯一真正的善。个人通过服从普遍理性获得内在自由，并由此发展出世界公民观。`,keyPoints:[`自由主要是对自身判断与欲望的治理。`,`自然法把所有理性存在者联系起来。`,`情绪困扰源于对事件所作的判断。`],russell:`罗素强调它在帝国时代与基督教形成之间的桥梁作用，也指出其伦理容易滑向消极忍受。`,questions:[`内在自由会不会削弱改变制度的动力？`,`顺应自然与宿命论如何区分？`],axis:[`内在自由`,`外在命运`]},"b2-04":{context:`古典世界向基督教世界过渡，个人灵魂、救赎与教会权威成为哲学核心。`,summary:`奥古斯丁把柏拉图主义资源纳入基督教：恶不是实体而是善的缺失，时间属于被创造的心灵经验，人的意志又因原罪需要恩典。`,keyPoints:[`确定性可从怀疑者自身的存在切入。`,`时间通过记忆、注意与期待呈现。`,`自由意志与神圣预知形成持续张力。`],russell:`罗素认为奥古斯丁塑造了中世纪思想的心理深度，同时也强化了罪与惩罚的神学框架。`,questions:[`恶若只是缺失，苦难是否被解释充分？`,`恩典优先时，道德责任如何成立？`],axis:[`自由意志`,`神圣恩典`]},"b2-13":{context:`亚里士多德著作经伊斯兰与拉丁学术网络重新进入西欧，信仰与理性的边界需被重画。`,summary:`阿奎那用亚里士多德哲学系统化基督教神学：某些关于世界的真理可由自然理性抵达，启示则补足理性无法独立达到的内容。`,keyPoints:[`信仰与理性来源不同，却不应真正冲突。`,`由运动、因果等经验事实通向第一原因。`,`自然法把伦理规范建立在人性目的上。`],russell:`罗素赞赏体系的严密，却认为结论预先服从教义，削弱了开放探究。`,questions:[`预设信仰结论的论证还能否称为哲学？`,`从因果链能否推出具有宗教属性的上帝？`],axis:[`自然理性`,`神圣启示`]},"b3-08":{context:`宗教战争与国家权力重组，使政治哲学转向秩序如何在冲突个体之间建立。`,summary:`霍布斯从欲望、恐惧与自我保存出发构造自然状态。为摆脱不安全，人们相互订约并授权主权者，政治权威因而来自人为建构而非神授。`,keyPoints:[`自然平等也意味着相互伤害能力的接近。`,`契约发生在个体之间，主权者是被授权者。`,`和平与安全构成服从权威的核心理由。`],russell:`罗素重视其清晰的世俗推理，但拒绝几乎不受限制的主权结论。`,questions:[`安全是否足以压倒自由？`,`主权者破坏保护承诺时，服从义务还存在吗？`],axis:[`社会秩序`,`个人权利`]},"b3-09":{context:`新科学要求摆脱经院权威，为知识寻找可重复、可演绎的确定起点。`,summary:`笛卡尔以方法性怀疑清除可疑信念，在‘我思’中找到不可否认的自我存在，再尝试重建上帝、外部世界以及心物二元论。`,keyPoints:[`怀疑被用作建立确定性的工具。`,`思维实体与广延实体性质不同。`,`清楚分明观念承担真理标准的角色。`],russell:`罗素把主体作为起点视为现代哲学的转折，也认为从我思通向外部世界的重建并不成功。`,questions:[`‘我思’证明的是一个实体自我，还是仅有思维事件？`,`心物二元论如何解释两者互动？`],axis:[`主观确定性`,`外部世界`]},"b3-10":{context:`理性主义继续追求统一体系，但拒绝把自然与上帝看成彼此外在。`,summary:`斯宾诺莎主张只有一个无限实体——上帝即自然；心与物是同一实体的不同属性。自由不是摆脱因果，而是理解必然性并由理性行动。`,keyPoints:[`实体自因且唯一，个别事物是其样态。`,`心物平行避免两种实体的相互作用难题。`,`理解情感的原因能够增加主动性。`],russell:`罗素对斯宾诺莎的伦理人格评价极高，并特别欣赏其从理解必然性中获得平静的理想。`,questions:[`如果一切必然，道德责任意味着什么？`,`‘上帝即自然’保留了多少宗教含义？`],axis:[`必然性`,`自由`]},"b3-13":{context:`英国经验主义与政治自由主义共同反对天赋观念和绝对权威。`,summary:`洛克把心灵比作尚未书写的纸张，观念来自感觉与反省。知识是观念之间关系的把握，但对实体、外部对象和他人心灵的确定性有限。`,keyPoints:[`拒绝作为既成内容的天赋观念。`,`区分第一性质与第二性质。`,`个人同一性更多依赖意识连续，而非同一物质。`],russell:`罗素赞赏洛克的温和与反独断精神，同时指出其认识论仍保留难以证明的实体假设。`,questions:[`经验能否提供普遍必然知识？`,`记忆标准会不会让个人同一性陷入循环？`],axis:[`经验`,`理性结构`]},"b3-17":{context:`经验主义推进到极限后，实体、自我和因果关系都面临证据不足的问题。`,summary:`休谟区分印象与观念，并追问每个观念来自何种经验。因果必然性不是被感知的连接，而是重复经验形成的心理习惯；自我也只是知觉束。`,keyPoints:[`事实推理依赖因果，却无法由纯理性证明。`,`归纳预设未来类似过去，但此预设不能循环证明。`,`怀疑在生活实践中会被自然习惯缓和。`],russell:`罗素认为休谟把经验主义推向逻辑终点，并留下现代哲学必须回应的归纳难题。`,questions:[`没有理性证明，科学归纳凭什么可靠？`,`知觉束能否解释统一的行动主体？`],axis:[`理性证明`,`自然习惯`]},"b3-20":{context:`理性主义与经验主义的冲突，以及休谟的怀疑，促使康德重问经验何以可能。`,summary:`康德认为认识并非被动复制世界：感性以空间和时间组织材料，知性以范畴统一经验。我们认识现象，却不能用同样方式认识物自身。`,keyPoints:[`先天综合判断试图解释数学与自然科学的必然性。`,`主体的认识结构规定了可能经验的形式。`,`理性越出经验会产生无法解决的二律背反。`],russell:`罗素承认康德问题的重要性，但反对把空间、时间及范畴过多地归于主体构造。`,questions:[`物自身若不可知，为何仍需设定？`,`先验条件是普遍结构，还是人类认知的历史事实？`],axis:[`主体形式`,`客观世界`]},"b3-22":{context:`德国观念论试图跨越康德留下的现象与物自身二分，并把历史纳入理性体系。`,summary:`黑格尔把实在理解为整体性的精神发展，矛盾推动概念和历史达到更高综合。个别事物只有在关系网络与整体进程中才获得充分真理。`,keyPoints:[`真理不是孤立命题，而是展开的整体。`,`否定性推动概念超越自身局限。`,`自由通过历史制度获得具体形式。`],russell:`罗素严厉反对从逻辑结构推出政治整体主义，认为黑格尔把国家权威置于个人之上。`,questions:[`矛盾如何成为真实的发展动力？`,`整体视角是否必然削弱个人的独立价值？`],axis:[`历史整体`,`具体个人`]},"b3-25":{context:`十九世纪欧洲的宗教衰退、民族主义与浪漫主义，使价值来源成为尖锐问题。`,summary:`尼采以谱系方式追问价值如何产生，批判把软弱与怨恨包装成普遍道德。他要求在旧价值失效后重新创造价值，并以生命肯定抵抗虚无主义。`,keyPoints:[`道德概念有权力关系与历史来源。`,`主人道德与奴隶道德呈现不同价值姿态。`,`超人象征自我超越，而非生物学类别。`],russell:`罗素欣赏其洞察力和文体，却强烈反对英雄崇拜、残酷审美与反平等倾向。`,questions:[`揭示价值来源是否等于反驳价值？`,`自我创造怎样避免变成强者任性？`],axis:[`价值创造`,`普遍道德`]},"b3-27":{context:`工业资本主义与工人阶级形成，使哲学重新把物质生产和社会冲突置于历史中心。`,summary:`马克思把黑格尔的历史运动转向物质生活：生产关系与阶级冲突塑造制度和观念。哲学的任务不仅是解释世界，也要介入改变世界的实践。`,keyPoints:[`社会存在深刻制约意识形态。`,`阶级斗争推动历史结构变化。`,`异化描述劳动者与产品、活动和自身能力的分离。`],russell:`罗素承认经济结构的解释力，但批评历史必然论以及由此支持的政治专断。`,questions:[`经济因素在多大程度上决定观念？`,`历史趋势能否为具体政治手段提供正当性？`],axis:[`结构条件`,`人的能动性`]},"b3-31":{context:`数学基础危机与语言转向，使哲学从建造宏大体系转向澄清命题结构。`,summary:`逻辑分析通过拆解语法表面形式，揭示命题的逻辑结构。它试图减少虚假问题，并让哲学与科学共享清晰、可检验的论证标准。`,keyPoints:[`语法形式可能掩盖真正的逻辑形式。`,`分析把复杂命题还原为更基本关系。`,`哲学更像澄清活动，而非关于世界的竞争性学说。`],russell:`这是全书最接近作者自身立场的一章：反体系、重分析，同时保留对科学尚不能回答之问题的哲学敏感。`,questions:[`分析能消除哲学问题，还是只改变表达方式？`,`价值与人生问题能否接受同样的逻辑处理？`],axis:[`逻辑清晰`,`形而上体系`]}},m={generatedAt:`2026-08-14T15:41:27.620Z`,policy:`Representative images resolved from encyclopedia records to Wikimedia Commons; every downloaded image retains its source and license metadata.`,count:64,ready:55,needsReview:9,figures:[{id:`thales`,zh:`泰勒斯`,en:`Thales`,wikipediaTitle:`Thales of Miletus`,wikipediaUrl:`https://en.wikipedia.org/wiki/Thales_of_Miletus`,wikidataId:`Q36303`,wikidataUrl:`https://www.wikidata.org/wiki/Q36303`,description:`Ancient Greek philosopher (c. 626 – c. 545 BC)`,status:`ready`,representationCaution:`古代与中世纪人物的雕像、手稿插图或后世画像通常不是写实肖像，应作为视觉识别符号使用。`,image:{localPath:`/visual-archive/figures/thales.jpg`,commonsFile:`Illustrerad Verldshistoria band I Ill 107.jpg`,commonsPage:`https://commons.wikimedia.org/wiki/File:Illustrerad_Verldshistoria_band_I_Ill_107.jpg`,originalUrl:`https://upload.wikimedia.org/wikipedia/commons/c/c6/Illustrerad_Verldshistoria_band_I_Ill_107.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=original`,thumbnailUrl:`https://upload.wikimedia.org/wikipedia/commons/thumb/c/c6/Illustrerad_Verldshistoria_band_I_Ill_107.jpg/960px-Illustrerad_Verldshistoria_band_I_Ill_107.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail`,mime:`image/jpeg`,license:`Public domain`,licenseUrl:null,artist:`Wilhelm Meyer`,credit:`own scan`}},{id:`anaxima 可以理解为对统一权威结构的拆解？`,coverage:`book`},{id:`early-modern`,years:`1650—1750`,title:`理性、经验与现代秩序`,subtitle:`从霍布斯到休谟`,transition:`失去共同权威 → 从主体、经验和契约重新奠基`,world:[`宗教战争强化对政治和平的需求`,`新科学成为可靠知识的模型`,`商业社会与英国革命推动自由主义`],carrier:`共和国、王权国家、科学院、沙龙与出版市场`,commonQuestion:`知识如何获得确定性？相互冲突的个人如何建立稳定政治？`,chain:[{label:`共同危机`,text:`权威不再自动可信`,kind:`condition`},{label:`知识路线`,text:`理性主义 ↔ 经验主义`,kind:`oppose`},{label:`政治路线`,text:`绝对主权 ↔ 自由主义`,kind:`oppose`},{label:`终点危机`,text:`休谟把经验主义推向怀疑`,kind:`inherit`}],responses:[{id:`hobbes`,title:`从恐惧和契约建立主权`,figures:`霍布斯`,region:`英格兰`,answer:`自然平等导致不安全，个人为和平授权一个不可分割的公共权力。`,method:`机械论、思想实验与演绎构造`,difference:`以个人为起点，却推出强大的国家。`,chapterIds:[`b3-08`]},{id:`rationalists`,title:`从清楚原则演绎世界`,figures:`笛卡尔、斯宾诺莎、莱布尼茨`,region:`法国、荷兰、德意志`,answer:`理性可以从确定起点建立关于心灵、自然和上帝的系统知识。`,method:`怀疑、定义、公理与演绎`,difference:`共享数学理想，却对实体、自由和心物关系给出不同体系。`,chapterIds:[`b3-09`,`b3-10`,`b3-11`]},{id:`locke`,title:`从经验与权利限制权威`,figures:`洛克`,region:`英格兰`,answer:`观念来自经验，政治权力来自保护自然权利的有限委托。`,method:`心理发生分析与契约论`,difference:`在知识和政治两方面都反对天赋内容与绝对权威。`,chapterIds:[`b3-12`,`b3-13`,`b3-14`,`b3-15`]},{id:`hume`,title:`揭示经验基础的限度`,figures:`贝克莱、休谟`,region:`不列颠与爱尔兰`,answer:`实体、因果和自我都不能按传统方式从经验中得到必然证明。`,method:`观念来源追踪与怀疑分析`,difference:`经验主义成功拆除旧形而上学，也动摇了科学归纳的理性基础。`,chapterIds:[`b3-16`,`b3-17`]}],legacy:[`现代主体`,`社会契约`,`自由主义`,`理性主义—经验主义框架`,`康德问题的起点`],review:`为什么同样受新科学影响，笛卡尔从理性确定性出发，洛克从经验出发，霍布斯却把方法用于国家建构？`,coverage:`book`},{id:`revolution-idealism`,years:`1750—1850`,title:`革命、浪漫主义与历史理性`,subtitle:`卢梭、康德与德国观念论`,transition:`普遍理性与个人权利 → 自由、历史和民族共同体`,world:[`启蒙思想进入美国与法国革命`,`浪漫主义反抗机械理性和商业文明`,`拿破仑战争与民族国家改变欧洲`],carrier:`公共舆论、大学、文学运动、革命国家与民族文化`,commonQuestion:`自由是个人不受干涉，还是个人通过共同体和历史实现自身？`,chain:[{label:`政治爆发`,text:`启蒙原则 → 革命实践`,kind:`condition`},{label:`情感反动`,text:`理性秩序 → 浪漫个性`,kind:`oppose`},{label:`哲学重建`,text:`主体条件 → 历史精神`,kind:`response`},{label:`新危险`,text:`自由可能被整体国家吸收`,kind:`exception`}],responses:[{id:`rousseau`,title:`从自然自由到公意`,figures:`卢梭`,region:`日内瓦 / 法国`,answer:`文明制造依赖与不平等，正当共同体必须使服从法律等于服从共同意志。`,method:`起源叙事、社会批判与契约
