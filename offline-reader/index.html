`,zh:`邓斯·司各脱`,en:`Duns Scotus`,category:`人物`,note:`强调个体性、意志和存在概念，是晚期经院哲学的重要转折。`},{id:`ockham`,zh:`奥卡姆`,en:`William of Ockham`,category:`人物`,note:`以唯名论和简约原则限制经院体系的实体与证明负担。`},{id:`machiavelli`,zh:`马基雅维利`,en:`Machiavelli`,category:`人物`,note:`把政治权力、稳定与行动后果从完整神学伦理中相对分离。`},{id:`luther`,zh:`路德`,en:`Martin Luther`,category:`人物`,note:`宗教改革核心人物，强调信仰、经文和个人良心。`},{id:`copernicus`,zh:`哥白尼`,en:`Copernicus`,category:`人物`,note:`以日心模型重组天文学，动摇传统宇宙秩序。`},{id:`kepler`,zh:`开普勒`,en:`Kepler`,category:`人物`,note:`以行星椭圆轨道和数学定律推进新天文学。`},{id:`galileo`,zh:`伽利略`,en:`Galileo`,category:`人物`,note:`结合数学、实验和望远镜观察，改变自然研究的证据标准。`},{id:`francis-bacon`,zh:`弗朗西斯·培根`,en:`Francis Bacon`,category:`人物`,note:`倡导系统观察、归纳和协作研究；不要与罗吉尔·培根混淆。`},{id:`hobbes`,zh:`霍布斯`,en:`Thomas Hobbes`,category:`人物`,note:`从恐惧、契约和机械论出发论证不可分割的主权。`},{id:`descartes`,zh:`笛卡尔`,en:`René Descartes`,category:`人物`,note:`以方法性怀疑和“我思”重建现代知识的主体起点。`},{id:`spinoza`,zh:`斯宾诺莎`,en:`Baruch Spinoza`,category:`人物`,note:`以单一实体和必然性体系重新理解自然、上帝与自由。`},{id:`leibniz`,zh:`莱布尼茨`,en:`Gottfried Wilhelm Leibniz`,category:`人物`,note:`以单子、充足理由和预定和谐构造理性主义体系。`},{id:`locke`,zh:`洛克`,en:`John Locke`,category:`人物`,note:`经验主义和自由主义的重要奠基者，反对天赋观念与绝对权力。`},{id:`berkeley`,zh:`贝克莱`,en:`George Berkeley`,category:`人物`,note:`以“存在就是被感知”批评物质实体观念。`},{id:`hume`,zh:`休谟`,en:`David Hume`,category:`人物`,note:`把经验主义推向怀疑结论，重构因果、自我和归纳问题。`},{id:`rousseau`,zh:`卢梭`,en:`Jean-Jacques Rousseau`,category:`人物`,note:`以文明批判、社会契约和公意重塑现代自由问题。`},{id:`kant`,zh:`康德`,en:`Immanuel Kant`,category:`人物`,note:`研究经验何以可能，并区分现象知识与实践自由。`},{id:`hegel`,zh:`黑格尔`,en:`G. W. F. Hegel`,category:`人物`,note:`以辩证法和历史整体解释理性与自由的制度展开。`},{id:`schopenhauer`,zh:`叔本华`,en:`Arthur Schopenhauer`,category:`人物`,note:`把世界理解为表象与盲目意志，形成悲观主义体系。`},{id:`byron`,zh:`拜伦`,en:`Lord Byron`,category:`人物`,note:`浪漫主义诗人；罗素用他呈现反习俗、英雄化个人主义的文化类型。`},{id:`nietzsche`,zh:`尼采`,en:`Friedrich Nietzsche`,category:`人物`,note:`以谱系和心理分析追问价值来源，并诊断现代虚无主义。`},{id:`bentham`,zh:`边沁`,en:`Jeremy Bentham`,category:`人物`,note:`以最大幸福原则系统化功利主义，并推动法律与制度改革。`},{id:`mill`,zh:`约翰·斯图亚特·密尔`,en:`John Stuart Mill`,category:`人物`,alternatives:[`穆勒`],note:`发展功利主义、自由论与代议政治，同时强调个性和思想实验。`},{id:`marx`,zh:`马克思`,en:`Karl Marx`,category:`人物`,note:`从生产关系、阶级与实践解释历史结构及其改变。`},{id:`william-james`,zh:`威廉·詹姆斯`,en:`William James`,category:`人物`,note:`实用主义代表，以经验与实践后果讨论真理和信念。`},{id:`dewey`,zh:`约翰·杜威`,en:`John Dewey`,category:`人物`,note:`把认识理解为环境中的探究与调整，并应用于民主教育。`},{id:`frege`,zh:`弗雷格`,en:`Gottlob Frege`,category:`人物`,note:`现代逻辑奠基者之一，对语言、数学基础和分析哲学影响深远。`},{id:`russell`,zh:`罗素`,en:`Bertrand Russell`,category:`人物`,note:`本书作者，也是现代逻辑分析哲学的重要代表。`},{id:`miletus`,zh:`米利都`,en:`Miletus`,category:`地名`,note:`小亚细亚爱奥尼亚商业城邦，米利都学派的思想中心。`},{id:`ionia`,zh:`爱奥尼亚`,en:`Ionia`,category:`地名`,note:`小亚细亚西岸希腊地区，连接爱琴海与近东知识网络。`},{id:`athens-place`,zh:`雅典`,en:`Athens`,category:`地名`,note:`古典时期民主、修辞、戏剧和哲学学园的主要中心。`},{id:`alexandria`,zh:`亚历山大里亚`,en:`Alexandria`,category:`地名`,alternatives:[`亚历山大城`],note:`希腊化与罗马时期重要的图书、科学和多宗教思想中心。`},{id:`rome`,zh:`罗马`,en:`Rome`,category:`地名`,note:`既指城市，也常指共和国或帝国制度；语境需分别判断。`},{id:`milesian`,zh:`米利都学派`,en:`Milesian School`,category:`学派`,note:`用自然本原而非神话谱系解释世界的早期哲学传统。`},{id:`cynicism`,zh:`犬儒派`,en:`Cynics / Cynicism`,category:`学派`,note:`以减少需要和反习俗生活追求不受外物支配的自由。`},{id:`scepticism`,zh:`怀疑派`,en:`Sceptics / Scepticism`,category:`学派`,alternatives:[`怀疑主义`],note:`通过为相反判断提供理由并悬置断言，降低精神扰动。`},{id:`epicureanism`,zh:`伊壁鸠鲁派`,en:`Epicureans / Epicureanism`,category:`学派`,alternatives:[`伊壁鸠鲁主义`],note:`把快乐理解为无痛与宁静，以自然知识解除恐惧。`},{id:`stoicism`,zh:`斯多葛主义`,en:`Stoicism`,category:`学派`,alternatives:[`斯多葛派`],note:`强调德性、自然秩序、判断训练和内在自由。`},{id:`neoplatonism`,zh:`新柏拉图主义`,en:`Neoplatonism`,category:`学派`,note:`以太一、精神和灵魂的层级重新解释柏拉图传统。`},{id:`scholasticism`,zh:`经院哲学`,en:`Scholasticism`,category:`学派`,note:`中世纪大学中以问题、反对、回答和反驳组织知识的专业传统。`},{id:`rationalism`,zh:`理性主义`,en:`Rationalism`,category:`学派`,note:`以理性原则和演绎体系作为知识的重要基础。`},{id:`empiricism`,zh:`经验主义`,en:`Empiricism`,category:`学派`,note:`要求观念和知识最终说明其经验来源与证据。`},{id:`romanticism`,zh:`浪漫主义`,en:`Romanticism`,category:`学派`,note:`强调个性、情感、创造和自然，反抗机械理性与抽象秩序。`},{id:`utilitarianism`,zh:`功利主义`,en:`Utilitarianism`,category:`学派`,note:`按行动或制度对总体幸福的后果进行伦理评价。`},{id:`pragmatism`,zh:`实用主义`,en:`Pragmatism`,category:`学派`,note:`通过观念在经验、行动和共同探究中的作用理解意义与真理。`},{id:`analytic`,zh:`分析哲学`,en:`Analytic Philosophy`,category:`学派`,note:`重视逻辑、语言和概念澄清，反对含混的宏大体系。`},{id:`arche`,zh:`本原`,en:`archē / first principle`,category:`概念`,alternatives:[`始基`],note:`早期希腊哲学中万物由之生成或得到统一解释的根本原则。`},{id:`logos`,zh:`逻各斯`,en:`logos`,category:`概念`,alternatives:[`理则`,`道`],note:`可指言说、理由或秩序；在赫拉克利特和基督教语境中含义不同。`},{id:`non-being`,zh:`非存在`,en:`what-is-not / non-being`,category:`概念`,note:`巴门尼德认为它不能被认识或充当生成来源；原子论则以虚空重新处理“无”的地位。`},{id:`four-roots`,zh:`四根`,en:`four roots`,category:`概念`,note:`恩培多克勒所说火、气、水、土四种不生不灭的基本成分；后世常称四元素。`},{id:`nous`,zh:`努斯`,en:`Nous / Mind`,category:`概念`,note:`阿那克萨哥拉体系中不与其他成分混合、具有知识并启动宇宙旋转的原则。`},{id:`atom`,zh:`原子`,en:`atomon / atom`,category:`概念`,note:`古代原子论中不可切分、不生不灭的基本实体；不能与现代物理学原子直接等同。`},{id:`void`,zh:`虚空`,en:`void`,category:`概念`,note:`原子之间允许分离和运动的空无间隔，是原子论对埃利亚存在论的关键修正。`},{id:`euthymia`,zh:`心灵安宁`,en:`euthymia / cheerfulness`,category:`概念`,note:`德谟克利特所重视的稳定愉悦状态，通过衡量、节制与判断训练获得。`},{id:`virtue`,zh:`德性`,en:`virtue / aretē`,category:`概念`,alternatives:[`美德`],note:`不仅是道德善，也可指一种事物或人的卓越能力。`},{id:`man-measure`,zh:`人是尺度`,en:`man-measure thesis`,category:`概念`,note:`普罗泰戈拉命题的简写；既可讨论感知相对性，也可能扩展到价值判断和公共论辩。`},{id:`elenchus`,zh:`反诘`,en:`elenchus / refutation`,category:`概念`,note:`苏格拉底式问答中通过追问一个人的承诺，显露其信念之间矛盾的方法。`},{id:`maieutic`,zh:`助产术`,en:`maieutic method`,category:`概念`,note:`柏拉图作品用助产比喻描述苏格拉底帮助对话者检验并产生思想；不等于直接传授结论。`},{id:`ideas-forms`,zh:`理念`,en:`Ideas / Forms`,category:`概念`,alternatives:[`形式`,`理型`],note:`柏拉图语境中可知、稳定且作为具体事物标准的存在；英译常用 Forms。`},{id:`philosopher-ruler`,zh:`哲学王`,en:`philosopher-ruler`,category:`概念`,note:`《理想国》中把关于善的知识与统治责任结合的政治角色，并非现代意义上由学者直接执政。`},{id:`matter-form`,zh:`质料与形式`,en:`matter and form / hylomorphism`,category:`概念`,note:`亚里士多德用以分析具体实体的成分与组织原则；两者通常不能作为独立物简单拼接。`},{id:`potential-actual`,zh:`潜能与现实`,en:`potentiality and actuality`,category:`概念`,note:`说明一个能力或可能结构如何在适当条件下实现，也是亚里士多德解释变化的核心区分。`},{id:`four-causes`,zh:`四因`,en:`four causes`,category:`概念`,note:`质料、形式、动力和目的四种‘为何如此’的回答维度，不只是四个相互竞争的事件原因。`},{id:`doctrine-mean`,zh:`中道`,en:`doctrine of the mean`,category:`概念`,note:`亚里士多德把许多德性理解为相对于行动者和处境、经实践理性确定的适度，而非算术平均。`},{id:`autarkeia`,zh:`自足`,en:`autarkeia / self-sufficiency`,category:`概念`,note:`减少对财富、名望和外在条件的依赖；犬儒派把它推进为可见的生活实践。`},{id:`parrhesia`,zh:`直言`,en:`parrhēsia / frank speech`,category:`概念`,note:`冒着社会代价公开说真话的实践，在犬儒派那里与反习俗生活相互支持。`},{id:`epoche`,zh:`悬置判断`,en:`epochē / suspension of judgment`,category:`概念`,note:`在理由势均力敌或标准不足时不作断言；古代不同怀疑主义传统对其范围与理由并不完全相同。`},{id:`ataraxia`,zh:`不动心`,en:`ataraxia / tranquility`,category:`概念`,alternatives:[`心灵宁静`],note:`免于精神扰动的稳定状态；怀疑派与伊壁鸠鲁派都重视它，但达到路径不同。`},{id:`kataleptic-impression`,zh:`认知印象`,en:`kataleptic impression`,category:`概念`,note:`斯多葛派设想能以自身特征保证真确来源的印象；阿尔克西劳以不可区分的误印象攻击这一标准。`},{id:`persuasive-impression`,zh:`可信印象`,en:`persuasive impression / pithanē phantasia`,category:`概念`,note:`卡尔内阿德为行动提出的可接受表象，可进一步检查是否稳定且与相关表象协调，但不升级为确定知识。`},{id:`aponia`,zh:`无痛`,en:`aponia / absence of bodily pain`,category:`概念`,note:`伊壁鸠鲁所谓身体快乐的稳定界限，与心灵的不动心共同构成不受扰动的生活。`},{id:`atomic-swerve`,zh:`原子偏斜`,en:`clinamen / atomic swerve`,category:`概念`,note:`伊壁鸠鲁传统中原子运动的微小无定时偏离，用来解释碰撞及行动不被严格机械必然性穷尽。`},{id:`substance`,zh:`实体`,en:`substance`,category:`概念`,note:`能独立存在或作为属性承担者的东西；亚里士多德、笛卡尔和斯宾诺莎定义不同。`},{id:`soul`,zh:`灵魂`,en:`soul / psychē`,category:`概念`,note:`古希腊可指生命原则，基督教和近代语境则更强调人格与不朽。`},{id:`the-one`,zh:`太一`,en:`the One`,category:`概念`,alternatives:[`一者`],note:`普罗提诺体系中超越存在与思想、万物由之流出的最高原则。`},{id:`natural-law`,zh:`自然法`,en:`natural law`,category:`概念`,note:`依据共同理性或人性而成立、并非只由地方成文法创造的规范。`},{id:`free-will`,zh:`自由意志`,en:`free will`,category:`概念`,note:`人是否能成为行动来源；在奥古斯丁那里与罪、预知和恩典相连。`},{id:`grace`,zh:`恩典`,en:`grace`,category:`概念`,alternatives:[`恩宠`],note:`来自上帝、使堕落者能够得救或行善的非应得帮助。`},{id:`salvation`,zh:`救赎`,en:`salvation / redemption`,category:`概念`,note:`从罪、死亡或与上帝分离状态中被拯救；两个英文词侧重点可能不同。`},{id:`universals`,zh:`共相`,en:`universals`,category:`概念`,alternatives:[`普遍概念`]
