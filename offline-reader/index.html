哲学变成精确的澄清活动。`,chapterIds:[`b3-31`]}],legacy:[`价值谱系`,`社会结构批判`,`实用主义`,`分析哲学`,`现代哲学的多中心格局`],review:`为什么工业社会没有产生一个统一哲学，而同时产生了尼采、马克思、实用主义和逻辑分析？`,coverage:`book`}],ie={origins:{events:[{id:`ionian-network`,marker:`前 8—6 世纪`,title:`殖民、贸易与爱奥尼亚知识网络`,detail:`希腊人在地中海和黑海沿岸建立殖民城邦。米利都等商业城市同时接触埃及测量、巴比伦天文和多地宗教观念。知识开始脱离单一祭司传统，在旅行者与城邦精英之间比较、修正。`},{id:`polis-rise`,marker:`前 7—6 世纪`,title:`城邦政治与成文法兴起`,detail:`贵族、僭主和平民围绕土地、债务和公民资格反复冲突。成文法与公共议事让秩序显得并非只能由神授，也能由人说明和改变；论证由此成为公共生活的一种力量。`},{id:`persian-wars`,marker:`前 499—449`,title:`希波战争与希腊世界重组`,detail:`爱奥尼亚起义和希波战争摧毁、迁移了一些早期思想中心，同时提升雅典的军事与文化地位。哲学活动逐渐由小亚细亚向南意大利和雅典转移。`}],problems:[{id:`arche`,marker:`自然`,title:`多样世界是否有共同本原？`,detail:`跨文明观察带来大量不同解释。早期哲学家尝试用水、无限者、气、数或原子等较少的自然原则说明较多现象，使世界成为可以争论的对象。`},{id:`change-being`,marker:`存在`,title:`变化与恒常如何同时成立？`,detail:`经验呈现生成与毁灭，理性却要求同一和不矛盾。赫拉克利特、巴门尼德及后来的多元论者，正是在回应感官变化与理性恒常之间的冲突。`},{id:`reason-sense`,marker:`知识`,title:`感官和推理，何者更可靠？`,detail:`数学证明显示推理可以达到不依赖眼前经验的确定性；但自然研究又从观察起步。这个张力后来成为柏拉图主义、经验研究和科学方法长期分化的起点。`}]},athens:{events:[{id:`athenian-democracy`,marker:`前 508—431`,title:`民主、帝国与公共辩论扩张`,detail:`克利斯提尼改革后，公民大会、法庭和演说成为雅典政治核心。海上同盟又带来财富与帝国权力。能否说服公众、界定正义，成为真实的政治能力。`},{id:`peloponnesian-war`,marker:`前 431—404`,title:`伯罗奔尼撒战争与政体反复`,detail:`长期战争、瘟疫、远征失败以及民主和寡头政变交替，削弱了雅典对自身制度的信心。苏格拉底之死与柏拉图的政治不信任，都处在这一创伤背景中。`},{id:`macedonian-rise`,marker:`前 387—322`,title:`学园建立与马其顿接管希腊`,detail:`柏拉图学院和亚里士多德吕克昂把哲学变成持续教学与研究制度；与此同时，马其顿击败希腊城邦，传统公民政治的自主空间迅速缩小。`}],problems:[{id:`knowledge-opinion`,marker:`知识`,title:`公共意见之外，是否有可靠知识？`,detail:`民主法庭依赖多数判断，智者展示同一案件可以有相反论证。苏格拉底与柏拉图因此追问：若没有稳定定义和真理，政治判断如何避免只剩说服与权势？`},{id:`virtue-education`,marker:`伦理`,title:`德性能够通过教育获得吗？`,detail:`新兴政治生活让修辞教师成为职业，但“会成功”是否等于“是善的”并不清楚。苏格拉底把教育从技能训练转成对灵魂、知识和行动一致性的审问。`},{id:`best-polis`,marker:`政治`,title:`失序之后，怎样组织好城邦？`,detail:`雅典的战争失败使哲学家不得不比较民主、寡头、君主和混合政体。柏拉图从知识资格设计理想国，亚里士多德则从现实宪制与公民生活寻找可行秩序。`}]},hellenistic:{events:[{id:`alexander`,marker:`前 334—323`,title:`亚历山大征服波斯帝国`,detail:`马其顿军队把希腊势力推进到埃及、中亚和印度河流域。征服制造了跨地域的政治与文化空间，也终结了希腊城邦作为最高政治单位的稳定地位。`},{id:`successor-kingdoms`,marker:`前 323—168`,title:`继业者王国与希腊化城市形成`,detail:`帝国分裂为托勒密、塞琉古等君主国。亚历山大里亚等城市汇聚希腊、埃及、波斯和犹太传统，学派与图书馆取代城邦公民共同体，成为知识的重要载体。`},{id:`roman-expansion`,marker:`前 168—30`,title:`罗马接管地中海世界`,detail:`罗马先后控制马其顿、希腊和埃及。政治中心继续远离传统希腊城邦，哲学则被带入罗马精英教育和更广泛的帝国生活。`}],problems:[{id:`inner-freedom`,marker:`生活`,title:`无法控制政治时，个人怎样自由？`,detail:`个人从城邦决策者变为大王国的臣民，外部地位更不稳定。犬儒、伊壁鸠鲁和斯多葛学派都把自由重新安放在需要、欲望或判断的管理上。`},{id:`cosmopolis`,marker:`共同体`,title:`跨地域世界需要怎样的共同身份？`,detail:`人口迁移和文化混合削弱了单一城邦身份。斯多葛主义用共同理性和自然法构造“世界公民”，其他学派则用友谊小共同体或退出公共规范回应。`},{id:`tranquility-certainty`,marker:`知识`,title:`确定知识是否是安宁的必要条件？`,detail:`怀疑派认为减少知识承诺本身能够消除扰动；伊壁鸠鲁派却认为必须理解自然，才能解除神罚和死亡恐惧。两者共享宁静目标，却对知识的作用判断相反。`}]},roman:{events:[{id:`augustan-order`,marker:`前 27—180`,title:`元首制与帝国和平`,detail:`奥古斯都以后，军队、税制、道路和行政把广大地区纳入较稳定的秩序。希腊哲学被罗马精英吸收，但哲学家很少再把参与独立城邦当作生活前提。`},{id:`citizenship-law`,marker:`1—3 世纪`,title:`罗马法与公民身份扩张`,detail:`城市网络、法律程序和二一二年的公民权敕令扩大了共同制度。不同民族在同一帝国中生活，使普遍法、角色义务和人类共同性的观念更有现实基础。`},{id:`third-century-crisis`,marker:`235—284`,title:`三世纪危机与宗教需求上升`,detail:`皇位频繁更替、内战、边境压力、瘟疫和经济混乱削弱帝国安全感。传统公共宗教难以解释个人苦难，神秘宗教和更强的来世救赎需求因而扩张。`}],problems:[{id:`role-duty`,marker:`伦理`,title:`庞大制度中的人应怎样履行角色？`,detail:`帝国把皇帝、奴隶、士兵和官员置于不同位置。罗马斯多葛主义试图说明：外在角色有别，但每个人都能通过理性判断和恰当行动保有德性。`},{id:`fate-freedom`,marker:`自由`,title:`必然命运中还能有什么自由？`,detail:`个人难以影响帝国政治，战争与疾病也不可预测。哲学于是区分事件本身与人的判断，把自由缩小却加固为无法被外力直接夺走的内在能力。`},{id:`higher-reality`,marker:`形而上学`,title:`外部秩序之外，更高真实在哪里？`,detail:`帝国制度能提供法律，却不能提供终极意义。普罗提诺把真实组织成太一、精神与灵魂的层级，并要求灵魂由感性多样返回统一根源。`}]},patristic:{events:[{id:`constantine`,marker:`313—325`,title:`君士坦丁改宗与尼西亚会议`,detail:`基督教获得合法地位后，教义分歧不再只是宗派内部问题。皇帝召集会议处理基督性质等争论，神学语言与帝国统一第一次被制度性地连接。`},{id:`state-religion`,marker:`380—395`,title:`基督教成为帝国主导宗教`,detail:`狄奥多西时期，尼西亚基督教获得国家支持，异教祭祀受到限制。教会吸收行政资源，也必须处理权力、强制与正统边界的问题。`},{id:`western-collapse`,marker:`410—529`,title:`西罗马瓦解与修道制度成长`,detail:`罗马遭劫和西部皇权消失，使城市教育与行政网络衰退。主教和修道院逐渐承担救济、识字教育与典籍保存，教会成为少数跨地域连续组织。`}],problems:[{id:`greek-language`,marker:`神学`,title:`如何用希腊概念表达启示？`,detail:`圣经叙事谈创造与救赎，希腊哲学谈实体、形式和永恒。教父必须借用后者澄清三位一体与基督论，同时避免让基督教被完全改写成柏拉图主义。`},{id:`evil-grace`,marker:`人性`,title:`恶、自由意志与恩典怎样相容？`,detail:`基督教既坚持上帝全善全能，又必须解释罪与苦难。奥古斯丁把恶理解为善的缺失，把犯罪归于意志，却又强调堕落者离不开神圣恩典。`},{id:`sacred-history`,marker:`历史`,title:`帝国崩溃意味着宗教失败吗？`,detail:`罗马被劫后，异教作者把灾难归咎于基督教。奥古斯丁以“上帝之城”和“世俗之城”区分政治命运与救赎史，使历史获得一个超越帝国兴亡的方向。`}]},"early-medieval":{events:[{id:`islamic-expansion`,marker:`7—10 世纪`,title:`伊斯兰扩张与翻译运动`,detail:`阿拉伯帝国连接叙利亚、波斯、埃及与西班牙。巴格达等中心把希腊哲学、印度数学和医学译成阿拉伯语，并在注释、计算与科学实践中继续发展。`},{id:`carolingian`,marker:`800—843`,title:`查理曼帝国与拉丁教育重建`,detail:`查理曼加冕象征西部帝国观念复兴。宫廷和修道院推动文字规范、学校与抄本复制，但统一很快瓦解，教育仍主要依附少数宗教机构。`},{id:`investiture`,marker:`1075—1122`,title:`教会改革与叙任权斗争`,detail:`改革教皇反对世俗君主任命主教，皇帝则坚持传统控制。冲突把精神权威与世俗权力明确区分，也推动教会法和制度论证发展。`}],problems:[{id:`preservation-authority`,marker:`知识`,title:`文明断裂后，谁有权保存和筛选知识？`,detail:`不同地区保存了不同古典资源：西欧修道院偏重拉丁宗教文本，拜占庭保留希腊传统，伊斯兰城市则广泛翻译和扩展。保存从来同时意味着选择。`},{id:`reason-revelation`,marker:`方法`,title:`跨语言知识怎样进入信仰体系？`,detail:`翻译不只是换语言，也会改变概念。约翰·司各脱、阿维森纳和阿威罗伊都必须判断：哲学推理与启示冲突时，是重新解释经文、限制理性，还是区分真理层次。`},{id:`two-powers`,marker:`政治`,title:`教皇与皇帝，谁代表普遍秩序？`,detail:`西欧没有单一帝国，却同时继承罗马皇权和普世教会理想。主教任命、财产和法律管辖的争执，使政治思想长期围绕两种普遍权威的边界展开。`}]},scholastic:{events:[{id:`translations-crusades`,marker:`1095—1250`,title:`十字军、城市贸易与翻译回流`,detail:`军事接触并非知识传播的唯一渠道，但地中海联系扩大，使托莱多、西西里等地的阿拉伯语和希腊语著作进入拉丁世界，完整亚里士多德尤其改变大学课程。`},{id:`universities`,marker:`12—13 世纪`,title:`大学与托钵修会兴起`,detail:`巴黎、牛津等大学形成教师、课程与学位制度；方济各会和多明我会进入城市教育。哲学问题被固定成可反驳、可答辩、可积累的专业论证格式。`},{id:`papal-decline`,marker:`1302—1378`,title:`教皇高峰后的政治裂缝`,detail:`教皇与法国王权冲突、阿维尼翁时期及教会分裂削弱普世权威。民族王权、城市和新法律实践上升，使经院综合失去原有的统一制度基础。`}],problems:[{id:`faith-reason`,marker:`体系`,title:`理性与启示能组成完整世界吗？`,detail:`亚里士多德提供自然、逻辑和伦理的系统解释，却包含与基督教不完全相容的前提。阿奎那试图划分自然理性能及之处，以及必须依赖启示的领域。`},{id:`universal-individual`,marker:`本体论`,title:`普遍概念和个体事物谁更根本？`,detail:`大学辩论需要精确定义“人性”“种类”等共相的地位。实在论、概念论和唯名论的差异，又影响上帝知识、个体责任和经验对象应如何被理解。`},{id:`limits-system`,marker:`方法`,title:`一个体系应当在哪里停止解释？`,detail:`经院方法追求兼容全部权威，但奥卡姆等人强调简约、个体和上帝意志，缩小理性证明范围。体系内部由此产生限制体系自身的工具。`}]},"renaissance-science":{events:[{id:`print-fall`,marker:`1450—1453`,title:`印刷术传播与君士坦丁堡陷落`,detail:`活字印刷显著降低文本复制成本，希腊学者和手稿又更多进入意大利。古典材料不再只由大学经院传统解释，人文主义者开始校勘原文和比较版本。`},{id:`oceanic-expansion`,marker:`1492—1522`,title:`远洋航行扩大已知世界`,detail:`跨大西洋航行和环球航行暴露了古典地理知识的限度，也带来殖民、财富与暴力。经验事实能够公开修正权威文本，欧洲人的人类与自然观被迫扩展。`},{id:`reformation-science`,marker:`1517—1633`,title:`宗教改革与日心说冲突`,detail:`宗教改革打破西欧教会统一；哥白尼、开普勒和伽利略又以数学和观察改变宇宙结构。经文、古代权威与可检验自然知识之间出现多重竞争。`}],problems:[{id:`political-reality`,marker:`政治`,title:`政治能否脱离统一神学伦理研究？`,detail:`意大利城邦的战争与外交显示，统治者常按权力后果而非传统德性行动。马基雅维利由此把政治稳定、能力和时机当作相对独立的研究对象。`},{id:`interpretation-authority`,marker:`权威`,title:`个人、经文与教会，谁解释真理？`,detail:`印刷让经文和论战迅速传播，宗教改革削弱教会作为唯一中介的地位。个人良心上升，却也产生宗派国家、教义冲突和新的强制。`},{id:`new-method`,marker:`科学`,title:`什么方法能让自然知识可信？`,detail:`旧体系依赖经典注释和目的因，新天文学则依赖测量、数学预测与仪器观察。争论的核心不只是地球是否运动，而是什么证据足以推翻权威。`}]},"early-modern":{events:[{id:`religious-wars`,marker:`1618—1648`,title:`三十年战争与威斯特伐利亚和约`,detail:`宗教、王朝和领土冲突造成中欧巨大破坏。和约强化领土国家秩序，也使政治和平越来越难以依赖全欧洲共享的宗教真理。`},{id:`english-revolutions`,marker:`1642—1689`,title:`英国内战与光荣革命`,detail:`王权、议会、宗教和财产权的冲突经历内战、共和国、复辟与权利法案。霍布斯和洛克由同一政治危机出发，却分别强调不可分主权与有限政府。`},{id:`newtonian-science`,marker:`1660—1687`,title:`科学共同体与牛顿综合`,detail:`皇家学会等机构推动公开实验和通信，牛顿以数学定律统一地上与天体运动。科学成为哲学家想要模仿、解释或限制的可靠知识模型。`}],problems:[{id:`certainty-foundation`,marker:`认识论`,title:`失去共同权威后，确定性从哪里开始？`,detail:`笛卡尔从不可怀疑的主体出发，理性主义者追求数学式体系；洛克和休谟则追踪观念的经验来源。现代哲学由此把“认识者”放到知识结构中心。`},{id:`sovereignty-rights`,marker:`政治`,title:`安全、主权与个人权利怎样排序？`,detail:`宗教战争显示分裂权威可能导致暴力，英国内战又显示绝对权力本身也危险。社会契约论用个人同意重建国家，却对权力边界给出不同答案。`},{id:`causation-induction`,marker:`科学`,title:`经验为何能支持普遍科学定律？`,detail:`科学不断成功，但经验只呈现有限事件。休谟指出，我们看见的是连续发生，而非必然联系；归纳依赖习惯，却无法用不循环的经验论证自身。`}]},"revolution-idealism":{events:[{id:`atlantic-revolutions`,marker:`1776—1799`,title:`美国革命与法国革命`,detail:`自然权利、人民主权和公民平等进入制度实践；法国革命同时经历共和、恐怖与政变。自由不再只是理论原则，也暴露出共同意志与政治暴力的紧张。`},{id:`napoleonic`,marker:`1799—1815`,title:`拿破仑战争重绘欧洲`,detail:`法国制度和民族动员席卷欧洲，随后又由王朝复辟收束。战争促进民族意识，也让哲学家把国家、法律和历史变化理解为自由展开的现实场所。`},{id:`industrial-1848`,marker:`1815—1848`,title:`工业化、民族主义与革命浪潮`,detail:`工厂城市、阶级分化和市场关系改变日常生活，民族独立与宪政运动扩张。浪漫主义反对把人缩减为计算与生产单位，一八四八年革命则集中暴露社会矛盾。`}],problems:[{id:`freedom-general-will`,marker:`政治`,title:`个人自由如何进入共同意志？`,detail:`革命需要以人民名义行动，却可能压制具体个人。卢梭的公意、康德的自律和黑格尔的制度自由，都试图说明服从共同规则何时不是失去自由。`},{id:`subject-world`,marker:`认识论`,title:`主体是在发现世界，还是构成经验？`,detail:`休谟的怀疑使理性主义和经验主义都难以保证科学必然性。康德转而研究经验得以可能的主体条件，并由此开启德国观念论。`},{id:`history-freedom`,marker:`历史`,title:`历史变化是否具有理性方向？`,detail:`革命和战争让制度在一代人内剧烈改变。黑格尔把冲突解释为自由意识的发展，浪漫主义者则担心抽象历史整体吞没个性、情感与不可替代的生命。`}]},"industrial-modern":{events:[{id:`industrial-capital`,marker:`1848—1871`,title:`工业资本主义与工人运动成长`,detail:`铁路、工厂和城市化扩大生产，也加深劳动分工、周期危机与阶级冲突。工会、社会主义和大众政治兴起，社会结构本身成为哲学解释与改造对象。`},{id:`darwin-secular`,marker:`1859 以后`,title:`进化论与传统世界观动摇`,detail:`达尔文以自然选择解释物种形成，人类不再天然处于独立创造的位置。历史发展、生命竞争和宗教权威的衰退，共同迫使哲学重估价值来源。`},{id:`mass-war-analysis`,marker:`1879—1918`,title:`专业大学、逻辑革命与世界大战`,detail:`哲学和科学在大学中专业化，现代逻辑改变了分析工具；民族国家和工业技术又在第一次世界大战中显示巨大破坏力。统一进步叙事因此失去可信度。`}],problems:[{id:`value-after-god`,marker:`价值`,title:`传统宗教衰退后，价值从哪里来？`,detail:`科学解释减少了诉诸神意的空间，社会规范又显出历史性。尼采用谱系追问价值由何种生命与权力关系产生，并把虚无主义视为现代核心危机。`},{id:`structure-agency`,marker:`社会`,title:`人的生活由结构决定到什么程度？`,detail:`马克思强调生产关系与阶级，功利主义从行动后果评价制度，实用主义则把观念放回环境中的调整活动。它们都反对孤立主体，却给人的能动性留下不同空间。`},{id:`philosophy-task`,marker:`方法`,title:`哲学应建体系、改社会，还是澄清语言？`,detail:`现代知识专业化后，哲学失去单一中心。谱系、政治经济学、实用实验和逻辑分析并存，分歧已不只是答案不同，而是对哲学任务本身的判断不同。`}]}},ae=[{id:`natural`,title:`自然假说`,rule:`用更少的自然本原解释更多现象`,uses:[`米利都学派`,`原子论`,`新科学`],stages:[`origins`,`renaissance-science`]},{id:`deduction`,title:`演绎与体系`,rule:`从少数被认为可靠的起点推出整体结构`,uses:[`巴门尼德`,`柏拉图`,`笛卡尔`,`斯宾诺莎`],stages:[`origins`,`athens`,`early-modern`]},{id:`dialectic`,title:`问答与辩证`,rule:`通过矛盾、反方和概念区分推进认识`,uses:[`苏格拉底`,`经院哲学`,`黑格尔`],stages:[`athens`,`scholastic`,`revolution-idealism`]},{id:`classification`,title:`分类与功能`,rule:`先区分事物类型，再解释各自原因和适当活动`,uses:[`亚里士多德`,`经院体系`],stages:[`athens`,`scholastic`]},{id:`therapy`,title:`哲学治疗`,rule:`改变欲望与判断，使人能够承受不可控制的世界`,uses:[`犬儒派`,`伊壁鸠鲁派`,`斯多葛派`,`怀疑派`],stages:[`hellenistic`,`roman`]},{id:`interpretation`,title:`解释与综合`,rule:`把既有经典放入新的宗教或概念体系`,uses:[`奥古斯丁`,`阿奎那`,`伊斯兰哲学`],stages:[`patristic`,`early-medieval`,`scholastic`]},{id:`empirical`,title:`经验与实验`,rule:`追踪观念来源，并让主张接受观察或实践检验`,uses:[`培根`,`洛克`,`休谟`,`实用主义`],stages:[`renaissance-science`,`early-modern`,`industrial-modern`]},{id:`critique`,title:`条件分析`,rule:`不直接回答对象是什么，而先问认识它何以可能`,uses:[`康德`,`语言分析`],stages:[`revolution-idealism`,`industrial-modern`]},{id:`genealogy`,title:`历史与谱系`,rule:`通过生成过程解释观念、制度和价值的权力来源`,uses:[`黑格尔`,`马克思`,`尼采`],stages:[`revolution-idealism`,`industrial-modern`]}],oe=[{from:`毕达哥拉斯的数学—宗教秩序`,to:`柏拉图的理念论`,label:`改造`,weight:3},{from:`柏拉图与新柏拉图主义`,to:`奥古斯丁神学`,label:`吸收`,weight:3},{from:`斯多葛自然法与普世人性`,to:`基督教伦理与近代自然权利`,label:`远程传递`,weight:3},{from:`亚里士多德著作`,to:`伊斯兰哲学 → 拉丁经院哲学`,label:`跨文明传播`,weight:3},{from:`古代怀疑主义`,to:`休谟的经验主义怀疑`,label:`问题复活`,weight:2},{from:`苏格拉底的概念追问`,to:`现代逻辑与语言分析`,label:`方法回声`,weight:2},{from:`柏拉图式整体政治`,to:`卢梭、黑格尔与国家哲学`,label:`结构回声`,weight:2},{from:`赫拉克利特的变化与冲突`,to:`黑格尔、马克思与尼采`,label:`高权重例外`,weight:1}],T=e=>({label:`罗素《西方哲学史》${e}`,kind:`原书`,url:`https://www.russell-j.com/cool/HWP_1945.pdf`}),se=[{id:`thales`,order:1,nameZh:`泰勒斯`,nameEn:`Thales of Miletus`,greekName:`Θαλῆς`,dates:`约前 625—前 546`,active:`约前 585 年前后`,places:[`米利都`,`爱奥尼亚`,`埃及（传统记载）`],school:`米利都学派`,figureId:`thales`,chapterIds:[`b1-02`],thesis:`用一种自然本原解释多样世界：重要的不只是“水”这个答案，而是世界可以从世界内部得到说明。`,evidenceCaution:`没有可确认的著作传世。我们主要通过希罗多德、亚里士多德及更晚作者认识他；具体事迹常带有“七贤”式传奇色彩。`,lifeSummary:`泰勒斯生活在小亚细亚西岸的商业城邦米利都。这里连接爱琴海、吕底亚、埃及和巴比伦知识网络，同时经历贵族、商人和僭主之间的政治变动。古代传统把他列为“希腊七贤”之一，并赋予他天文、几何、工程和政治建议等多重身份。罗素把这种跨文化、商业性的城市环境视为米利都自然研究得以出现的重要条件。与后世留下完整著作的哲学家不同，泰勒斯更像一个由少数命题和大量见证拼成的历史起点。`,timeline:[{date:`约前 625`,place:`米利都`,title:`出生与成长`,detail:`年代由后世编年推定；身处海上贸易与多文明知识交汇的爱奥尼亚。`,certainty:`推定`},{date:`前 585`,place:`吕底亚—米底战场`,title:`日食预言传统`,detail:`希罗多德说他预告了发生在战争中的日食；现代研究通常怀疑他是否可能精确预报地点和日期。`,certainty:`传统记载`},{date:`6 世纪前期`,place:`米利都／埃及`,title:`几何与测量活动`,detail:`传说他由埃及引入几何，并用影长测量金字塔、以三角测量估算海上船距；具体归属并不确定。`,certainty:`传统记载`},{date:`前 546 前后`,place:`爱奥尼亚`,title:`生命末期`,detail:`吕底亚被波斯征服，米利都进入新的政治环境；传统编年常把他的去世置于这一时期。`,certainty:`推定`}],inquiries:[{object:`自然本原`,question:`纷繁事物是否能由一种共同东西说明？`,start:`生命、营养、种子和湿润之间似乎存在稳定联系；水又能呈现多种状态。`,steps:[`从多样事物中寻找共同成分`,`把生成理解为自然材料的变化`,`不再用神祇的临时干预填补每个现象`],conclusion:`水被视为万物的本原。即使答案粗糙，这种解释形式已经把宇宙当作一个内在、自行运作的系统。`},{object:`运动与生命`,question:`无生命的东西为什么能够产生运动？`,start:`磁石能在没有可见推动者的情况下吸引铁。`,steps:[`把自发运动与灵魂联系`,`由磁石推测自然物具有内在动力`,`将神性理解为遍布自然，而非只从外部介入`],conclusion:`亚里士多德转述他认为磁石有灵魂、万物充满神。这不是成熟论证，却保存了“自然自身含有运动原则”的直觉。`}],concepts:[{zh:`本原`,en:`archē`,definition:`事物从何而来、由何构成并凭什么持续的第一原则。“本原”这一术语主要是亚里士多德用来整理早期思想的框架。`},{zh:`水`,en:`water as primary stuff`,definition:`既是可观察的物质，又承担统一解释的角色；重点是用较少的自然假设解释较多现象。`},{zh:`有灵的自然`,en:`ensouled nature`,definition:`自然物的运动不必总由外在人格神推动；动力可能属于事物自身。这个解释仍混合着早期神性语言。`}],lineage:{inherited:`继承的是爱奥尼亚的航海测量、巴比伦天文周期与埃及实用几何，而不是一套已经成形的哲学体系。`,school:`后世把泰勒斯、阿那克西曼德和阿那克西美尼归为米利都学派：共享自然本原、宇宙生成和非人格化解释，但未必存在严格的学校组织。`,influenced:`阿那克西曼德延续“单一本原”的问题，却反对以已知元素作最终基础；阿那克西美尼又返回具体元素，并补上变化机制。`,parallel:`与赫西俄德同样解释宇宙起源，却由神族谱系转向自然材料；与后来的唯物论都追问物质基础，但不能因此说近代唯物论直接源于泰勒斯。`},comparisons:[{target:`赫西俄德`,relation:`同题比较`,shared:`都试图给宇宙一个起源秩序。`,difference:`赫西俄德以神的出生和冲突叙述起源；泰勒斯把解释压缩为自然材料及其变化。`},{target:`阿那克西曼德`,relation:`直接传承`,shared:`世界需要一个统一的生成原则。`,difference:`泰勒斯选择可见的水；阿那克西曼德认为任何已知元素都会偏向自身，故改用无规定的“无限者”。`},{target:`毕达哥拉斯`,relation:`同题比较`,shared:`都寻找多样现象背后的统一秩序。`,difference:`泰勒斯从物质与观察出发；毕达哥拉斯传统更重数、比例、灵魂与净化生活。`}],russellView:`罗素说泰勒斯更值得作为科学家而非现代意义的哲学家受到尊重。他把“万物由水构成”当作大胆但并非愚蠢的科学假说，也反复提醒可确知材料太少。对罗素而言，真正的历史价值不在答案正确，而在这种粗糙假说能够刺激观察、争论和后续修正。`,modernCorrection:`现代研究比罗素更谨慎地处理日食预言：前 585 年确有适合的日食，古代也确有预言记载，但泰勒斯掌握何种方法无法确定。“万物是水”同样主要经亚里士多德重构，不能当作泰勒斯留下的完整原文体系。`,sources:[T(`第一卷第二章〈米利都学派〉`),{label:`Stanford Encyclopedia · Presocratic Philosophy`,kind:`补充`,url:`https://plato.stanford.edu/entries/presocratics/`},{label:`Internet Encyclopedia of Philosophy · Thales`,kind:`补充`,url:`https://iep.utm.edu/thales/`}]},{id:`anaximander`,order:2,nameZh:`阿那克西曼德`,nameEn:`Anaximander`,greekName:`Ἀναξίμανδρος`,dates:`约前 610—前 546`,active:`6 世纪中叶`,places:[`米利都`,`黑海殖民网络`,`斯巴达（传统记载）`],school:`米利都学派`,figureId:`anaximander`,chapterIds:[`b1-02`],thesis:`已知元素彼此对立，不能有任何一种无限支配其他元素；万物应从更抽象、无规定的“无限者”生成。`,evidenceCaution:`据说写过散文著作《论自然》，现仅有一小段可能接近原文的残句。其地图、日晷和殖民活动都来自后世见证，细节不可完全确认。`,lifeSummary:`阿那克西曼德是米利都公民，传统上被称为泰勒斯的学生或同伴。他处在吕底亚与波斯势力扩张、爱奥尼亚城邦持续殖民和航海的时期。后世称他率领过前往黑海沿岸阿波罗尼亚的殖民行动，制作过已知世界地图，并把圭表带入希腊；这些记载共同显示他的知识与实际定向、时间测量及城邦空间有关。他可能是最早用散文系统书写自然研究的希腊思想家之一，但著作本身几乎全部失传。`,timeline:[{date:`约前 610`,place:`米利都`,title:`出生`,detail:`后世编年据其前 546 年约六十四岁反推；确切年份未知。`,certainty:`推定`},{date:`6 世纪中叶`,place:`黑海沿岸`,title:`殖民与地理活动`,detail:`传说他领导米利都殖民者建立阿波罗尼亚，并绘制有人居住世界的地图。`,certainty:`传统记载`},{date:`6 世纪中叶`,place:`米利都／斯巴达`,title:`天文测量`,detail:`据说设置圭表，用影子判断时刻与季节；工具来自更早的巴比伦传统，贡献更可能是引入和应用。`,certainty:`传统记载`},{date:`约前 546`,place:`米利都`,title:`《论自然》与生命末期`,detail:`据推定曾以散文讨论宇宙、地理和生命起源；只有经辛普里丘转述的一段残句留存。`,certainty:`推定`}],inquiries:[{object:`第一原则`,question:`如果元素相互对立，哪一种能够成为共同本原？`,start:`水、火、气、土具有互相排斥的性质；若其中一种无限强大，其余早已被消灭。`,steps:[`接受泰勒斯的单一本原问题`,`比较已知元素之间的对立`,`排除任何带有确定性质的元素`,`把本原提升为无边界、无规定且不衰老的来源`],conclusion:`本原是“无限者”：它不是简单的无限空间，而是无法由现成元素限定、又能持续产生世界的根源。`},{object:`宇宙秩序与变化`,question:`对立元素不断争胜，为什么世界没有崩溃？`,start:`冷热、干湿等力量会扩张并侵占彼此，但季节和生成毁灭呈现循环。`,steps:[`无限者内部具有永恒运动`,`冷热等对立力量分离`,`对立物在时间中轮流占优`,`越界者通过反向变化向另一方作出补偿`],conclusion:`变化受时间与比例约束；“正义”不是人格神判决，而是自然系统恢复平衡的秩序。`},{object:`地球与生命`,question:`地球为何不坠落，人类又怎样进入自然史？`,start:`若地球必须由别物支撑，就会产生新的支撑问题；人类幼年期过长，似乎无法以现状独立起源。`,steps:[`地球与各方向等距，因此无理由向一边移动`,`天体环绕地球形成完整路径`,`生命由受太阳作用的湿润环境产生`,`早期人类曾寄生于鱼形动物，成熟后才登上陆地`],conclusion:`宇宙与生命都通过自然生成解释，而不是一次性的创造事件；具体模型虽错误，解释目标却高度统一。`}],concepts:[{zh:`无限者`,en:`apeiron`,definition:`没有边界或确定性质、不会衰老耗尽的本原。它既避免某一元素垄断，又为无数生成过程保留来源。`},{zh:`对立者`,en:`opposites`,definition:`热与冷、干与湿等具有作用力的性质；可见世界由它们的分离、侵占与转化构成。`},{zh:`宇宙正义`,en:`cosmic justice`,definition:`对立力量依时间秩序为越界付出补偿。它把政治—伦理词汇转化为非人格化的自然规律。`},{zh:`无支撑地球`,en:`unsupported earth`,definition:`地球因与各方向等距而保持原位，不再需要海、柱或巨兽支撑；这是用对称性终止解释倒退。`}],lineage:{inherited:`从泰勒斯继承“以一个自然原则解释整个宇宙”的问题，也继承米利都航海、测量与跨文化观察的实践背景。`,school:`属于米利都自然哲学，但把具体物质假说推进到抽象原则，并第一次留下可辨认的宇宙秩序论证。`,influenced:`阿那克西美尼保留单一本原，却认为“无限者”缺少变化机制；赫拉克利特继续使用对立与正义语言，但把冲突本身视为秩序。后来的宇宙模型也继承其无外部支撑的解释方向。`,parallel:`与现代演化论共享“生命有自然生成史”这一问题形式，却没有遗传、选择等机制，不能把他称为现代进化论者。`},comparisons:[{target:`泰勒斯`,relation:`直接传承`,shared:`用单一本原统一解释生成世界。`,difference:`泰勒斯选取水；阿那克西曼德用元素冲突论证，本原必须不等同于任何已知元素。`},{target:`阿那克西美尼`,relation:`直接传承`,shared:`宇宙从一个持续存在的来源演化。`,difference:`阿那克西曼德的来源抽象但机制含混；阿那克西美尼以气的凝聚和稀释提供可观察的变化机制。`},{target:`赫拉克利特`,relation:`同题比较`,shared:`都用对立、时间和正义解释世界秩序。`,difference:`阿那克西曼德把越界后的补偿视为平衡；赫拉克利特则认为张力和争斗本身就是生成秩序。`}],russellView:`罗素明确说阿那克西曼德比泰勒斯“更有趣”。他着重重建了一个排除论证：若水、火等任何已知元素是无限的，它就会征服其他元素，因此本原必须在宇宙冲突中保持中性。罗素也赞赏其无创造论的宇宙演化、动物起源假说、地图和科学好奇心，评价他“原创处都是科学而理性的”。`,modernCorrection:`“无限者”究竟指空间无限、时间不尽、性质未定还是不可经验，仍有争议。现存残句的边界也不确定。地图、圭表和殖民领导等事迹应写作古代传统，而不应像完整履历一样陈述；但这些传统可靠地反映了后人眼中他兼具宇宙论与测量实践的形象。`,sources:[T(`第一卷第二章〈米利都学派〉`),{label:`Stanford Encyclopedia · Presocratic Philosophy`,kind:`补充`,url:`https://plato.stanford.edu/entries/presocratics/`},{label:`Internet Encyclopedia of Philosophy · Anaximander`,kind:`补充`,url:`https://iep.utm.edu/anaximander/`}]},{id:`anaximenes`,order:3,nameZh:`阿那克西美尼`,nameEn:`Anaximenes of Miletus`,greekName:`Ἀναξιμένης`,dates:`约前 586—前 528`,active:`6 世纪中叶`,places:[`米利都`,`爱奥尼亚`],school:`米利都学派`,figureId:`anaximenes`,chapterIds:[`b1-02`],thesis:`以气为统一材料，以稀释和凝聚为变化机制：性质差异可以由连续、定量的过程产生。`,evidenceCaution:`生平几乎空白，年代也来自后世推定。著作没有保存，哲学主要经泰奥弗拉斯托斯传统和晚期摘述重建。`,lifeSummary:`阿那克西美尼是米利都三人组中最晚的一位，通常被说成阿那克西曼德的同伴或学生。他活动时的爱奥尼亚正承受吕底亚覆灭、波斯统治和城邦紧张；罗素只敢断言他晚于阿那克西曼德，并早于前 494 年波斯镇压爱奥尼亚起义时米利都被毁。关于旅行、政治活动和私人交往，没有足够材料可写。其历史位置主要由理论显示：他既不满足于泰勒斯只有“材料答案”，也不满足于阿那克西曼德过于抽象的来源，而要说明同一种材料怎样连续变成可见世界。`,timeline:[{date:`约前 586`,place:`米利都`,title:`出生`,detail:`传统年代差异较大；较稳妥的说法只是他活跃于前六世纪中叶。`,certainty:`推定`},{date:`前 550 前后`,place:`米利都`,title:`与阿那克西曼德的学术关系`,detail:`泰奥弗拉斯托斯传统称他是阿那克西曼德的同伴或学生；严格师承无法证实。`,certainty:`传统记载`},{date:`6 世纪中叶`,place:`米利都`,title:`自然论写作`,detail:`据说用朴素爱奥尼亚散文写作，集中讨论气、物质变化、气象和宇宙形成；文本已失。`,certainty:`传统记载`},{date:`前 528 前后`,place:`米利都`,title:`去世`,detail:`常见年代来自后世编年；可以确认的相对关系是其活动早于前 494 年米利都毁灭。`,certainty:`推定`}],inquiries:[{object:`本原与生命`,question:`哪种本原既无处不在，又能解释生命和宇宙的统一？`,start:`气通常不可见、范围难定，却以呼吸维持生命；它比水更普遍，又比“无限者”更可经验。`,steps:[`选取遍布环境的气作为材料`,`以呼吸—灵魂维持身体作类比`,`把同一关系扩大到气包围并维持整个宇宙`],conclusion:`气既是万物材料，也是世界保持整体的生命性原则；自然与生命仍处于同一解释层。`},{object:`物质变化`,question:`同一种材料怎样产生火、水、土和石等相反性质？`,start:`空气受压、吹拂、蒸发和结露会呈现冷热、疏密变化；毛毡制作也展示压缩产生新性质。`,steps:[`稀释使气变为火`,`逐步凝聚使气成为风、云、水`,`继续凝聚成为土与石`,`用疏密程度把多种物质排入连续序列`],conclusion:`可见的性质差异来自稀释和凝聚的数量差异。这是米利都学派第一次较明确地给出变化机制。`},{object:`宇宙与气象`,question:`天地和常见气象能否使用同一机制解释？`,start:`若气的疏密过程普遍有效，就不应只解释少数物质。`,steps:[`凝聚的气形成扁平大地`,`大地像叶片一样由气托住`,`太阳、月亮和星体由稀薄或燃烧物形成`,`云、雨、雹、雪同样按凝聚程度说明`],conclusion:`一个低成本机制跨越物质、气象和宇宙领域；模型错误，但解释具有可重复性和统一性。`}],concepts:[{zh:`气`,en:`aēr`,definition:`无处不在、通常不可见又能成为呼吸的基本材料；兼有可观察性与近似无限的范围。`},{zh:`稀释`,en:`rarefaction`,definition:`气变得更疏、更热并趋向火的过程；把质的变化解释为密度下降。`},{zh:`凝聚`,en:`condensation`,definition:`气依次成为风、云、水、土、石的连续压缩过程；把多种材料排列在同一尺度上。`},{zh:`呼吸类比`,en:`breath analogy`,definition:`人的灵魂作为气维持身体，宇宙之气也包围并维持世界。它连接个体生命经验与整体宇宙论。`}],lineage:{inherited:`接受泰勒斯的物质一元论和阿那克西曼德的宇宙生成问题；其气同时吸收了“具体元素”与“范围无定”两种要求。`,school:`作为米利都学派第三人，他最突出的贡献不是换了一个本原名称，而是提供稀释—凝聚这一可复用机制。`,influenced:`其连续物质转化影响后来的赫拉克利特、阿那克萨哥拉、阿波罗尼亚的第欧根尼及古代医学气论。罗素还说他影响了毕达哥拉斯，并指出原子论者沿用其圆盘形地球。`,parallel:`与近代以压力、密度解释相变的科学共享“用定量变化说明性质差异”的结构，但他没有实验测量、微观理论或守恒定律。`},comparisons:[{target:`泰勒斯`,relation:`直接传承`,shared:`以一种可经验材料统一自然。`,difference:`泰勒斯主要给出水这一答案；阿那克西美尼进一步说明材料如何沿连续过程发生转化。`},{target:`阿那克西曼德`,relation:`直接传承`,shared:`世界从单一、持续的来源自然演化。`,difference:`阿那克西曼德用无规定来源避免元素偏向；阿那克西美尼用气兼顾中性、可见证据和变化机制。`},{target:`赫拉克利特`,relation:`同题比较`,shared:`都把世界看成一种材料的持续转化。`,difference:`阿那克西美尼以疏密序列解释物质；赫拉克利特以火、交换、对立张力解释更普遍的过程秩序。`}],russellView:`罗素认为阿那克西美尼不如阿那克西曼德有趣，却承认他取得了重要进展：火是稀释的气，气凝聚后依次成为水、土、石，因此物质之间的差异被处理为凝聚程度的数量差异。罗素同时提醒，古代人对他的评价反而高于阿那克西曼德，说明哲学史中的重要性排序本身会变化。`,modernCorrection:`罗素把理论概括为“差异完全是数量的”，便于理解但略显现代化。更稳妥的说法是：阿那克西美尼首次留下了以疏密过程统一解释质变的清晰见证。吹气冷热的观察是否真是他的论证，以及具体宇宙模型的归属，仍需保留证据等级。`,sources:[T(`第一卷第二章〈米利都学派〉`),{label:`Stanford Encyclopedia · Presocratic Philosophy`,kind:`补充`,url:`https://plato.stanford.edu/entries/presocratics/`},{label:`Internet Encyclopedia of Philosophy · Anaximenes`,kind:`补充`,url:`https://iep.utm.edu/anaximenes/`}]},{id:`pythagoras`,order:4,nameZh:`毕达哥拉斯`,nameEn:`Pythagoras`,greekName:`Πυθαγόρας`,dates:`约前 570—前 490`,active:`约前 530—前 500`,places:[`萨摩斯`,`克罗顿`,`梅塔蓬图姆`],school:`毕达哥拉斯传统`,figureId:`pythagoras`,chapterIds:[`b1-03`],thesis:`哲学不只是解释世界，也是一种净化灵魂的共同生活；数与和谐后来成为这条传统理解宇宙秩序的核心语言。`,evidenceCaution:`毕达哥拉斯本人没有留下著作，早期见证稀少，完整传记晚出数百年。灵魂轮回与生活规则较可能属于本人；“万物是数”、定理和完整宇宙论多半属于后来的学派。`,lifeSummary:`毕达哥拉斯出生于爱琴海的萨摩斯岛，约四十岁时迁往南意大利的克罗顿。罗素把迁徙放在僭主波利克拉底统治和萨摩斯—米利都商业竞争中理解；现代研究可以确认迁居克罗顿，却不能确认所有政治动机与埃及旅行。他在那里建立以饮食禁忌、仪式、自律和共同生活为特点的团体，吸引男女追随者，并可能卷入南意大利城邦政治。反毕达哥拉斯运动后来攻击这些团体；传统称他最终逃往梅塔蓬图姆并在那里去世。`,timeline:[{date:`约前 570`,place:`萨摩斯`,title:`出生`,detail:`出生于富裕而航海活跃的岛屿城邦；父亲与早年经历的记载互相冲突。`,certainty:`推定`},{date:`约前 530`,place:`萨摩斯 → 克罗顿`,title:`迁往南意大利`,detail:`约四十岁移居克罗顿并开始主要活动；罗素认为他厌恶波利克拉底的僭政。`,certainty:`较可靠`},{date:`前 530—500`,place:`克罗顿`,title:`建立共同体`,detail:`团体以灵魂命运、宗教仪式、饮食纪律和共同生活闻名，并对当地政治产生影响。`,certainty:`较可靠`},{date:`约前 500—490`,place:`克罗顿／梅塔蓬图姆`,title:`政治反扑与去世`,detail:`南意大利发生反毕达哥拉斯运动；个人逃亡与死亡细节来自较晚传统。`,certainty:`传统记载`}],inquiries:[{object:`灵魂与生活方式`,question:`人的灵魂如何摆脱死亡与反复投生的循环？`,start:`灵魂并不随身体死亡，而会进入其他人或动物；所有有生命者因此具有亲缘关系。`,steps:[`承认灵魂不朽与轮回`,`把日常饮食、仪式和欲望纳入灵魂后果`,`以记忆、自律和群体规则净化生活`,`把哲学变成持续操练而非单次知识`],conclusion:`好生活的目标是改善灵魂命运。哲学首次鲜明地成为一种可加入、可实践、可传承的生活制度。`},{object:`数、音乐与秩序`,question:`为什么感性和谐能够由精确关系表达？`,start:`音乐协和与简单整数比之间存在稳定联系；几何证明又呈现不依赖个别观察的确定性。`,steps:[`从和弦与比例发现可重复关系`,`把数视为结构而非只用于计数`,`由局部比例推想宇宙也有和谐秩序`,`把数学沉思解释为灵魂净化的最高活动`],conclusion:`在毕达哥拉斯传统中，真实秩序更接近数、比例和形式。必须注意：这一完整推导主要属于后世学派，不能全部归给本人。`},{object:`知识与人生等级`,question:`求知是控制世界的工具，还是一种独立的生活价值？`,start:`观看竞技者既不交易也不争胜，只为理解发生了什么。`,steps:[`区分逐利者、竞争者和观看者`,`把无利害的观看提升为沉思`,`把沉思与数学的确定、和谐相连`,`让理论生活获得高于政治行动的地位`],conclusion:`罗素据此解释西方传统中“理论高于实践、理性高于感官”的长久倾向，并同时批评它带来的形而上学偏见。`}],concepts:[{zh:`灵魂轮回`,en:`metempsychosis`,definition:`灵魂在不同生命形态中迁移；生命共同亲缘、饮食禁忌与净化实践由此获得统一理由。`},{zh:`毕达哥拉斯式生活`,en:`Pythagorean way of life`,definition:`由共同体、仪式、饮食、自律和学习构成的生活方案；比任何单条数学命题更可靠地属于早期传统。`},{zh:`和谐`,en:`harmonia`,definition:`不同部分依比例结合形成秩序。音乐中的整数关系使“可听见的美”与“可理解的数”发生连接。`},{zh:`理论／沉思`,en:`theōria`,definition:`以理解而非利益或竞争为目的的观看生活。罗素把它视为数学、哲学和后来神学共同抬高的理想。`}],lineage:{inherited:`罗素强调俄耳甫斯宗教的净化、轮回和共同体传统；也提到南意大利与爱奥尼亚知识交流。现代研究对具体借用关系更谨慎。`,school:`“毕达哥拉斯主义”跨越多个世纪。早期宗教生活、五世纪菲洛劳斯的宇宙论、阿尔库塔斯的数学不能无差别地写回创始人。`,influenced:`菲洛劳斯与阿尔库塔斯把传统发展为数学宇宙论；柏拉图吸收数、形式、灵魂与沉思理想，经他影响新柏拉图主义和基督教哲学。`,parallel:`与米利都学派同样追求宇宙统一，却把稳定性放在形式关系而非物质本原；与后世宗教修会共享生活纪律，但不存在简单直接的组织继承。`},comparisons:[{target:`米利都学派`,relation:`同题比较`,shared:`都寻找现象背后的统一秩序。`,difference:`米利都从可观察物质与生成机制出发；毕达哥拉斯传统把数、灵魂和净化生活放到中心。`},{target:`赫拉克利特`,relation:`批评关系`,shared:`都认为零散见闻不足以构成智慧。`,difference:`赫拉克利特点名批评毕达哥拉斯“多闻而无理解”；他以逻各斯和对立秩序取代知识收藏与宗教权威。`},{target:`柏拉图`,relation:`直接传承`,shared:`数学训练、灵魂不朽和超越感官的秩序。`,difference:`柏拉图用理念论、辩证法和政治哲学重组这些资源，不能把成熟柏拉图体系倒推给毕达哥拉斯。`}],russellView:`罗素把毕达哥拉斯称为思想史上影响最巨大的人之一：演绎数学、神秘主义与沉思伦理在他身上结合，使数学确定性成为哲学的理想。罗素一方面赞赏纯数学和无利害求知，另一方面认为由此产生了“思想高于感官”的错误形而上学倾向。他的叙述极有结构力量，但把很多后世学派成就集中到个人名下。`,modernCorrection:`现代研究把“毕达哥拉斯问题”放在首位：较早证据能支持灵魂轮回、仪式专家和严格生活方式，却没有证据证明本人提出勾股定理、建立成熟数学证明体系或完整宣称“万物是数”。页面因此保留罗素的影响史判断，同时把个人、早期共同体和后世学派分层。`,sources:[T(`第一卷第三章〈毕达哥拉斯〉`),{label:`Stanford Encyclopedia · Pythagoras`,kind:`补充`,url:`https://plato.stanford.edu/entries/pythagoras/`},{label:`Internet Encyclopedia · Presocratics / Pythagoras`,kind:`补充`,url:`https://iep.utm.edu/presocra/`}]},{id:`heraclitus`,order:5,nameZh:`赫拉克利特`,nameEn:`Heraclitus of Ephesus`,greekName:`Ἡράκλειτος`,dates:`约前 540—前 480`,active:`约前 500 年前后`,places:[`以弗所`,`爱奥尼亚`],school:`爱奥尼亚哲学／独立思想家`,figureId:`heraclitus`,chapterIds:[`b1-04`],thesis:`世界的稳定不是排除变化，而是由受逻各斯约束的转化和对立张力维持；有些事物正因为持续更新才能保持同一。`,evidenceCaution:`生平轶事大多是后人从格言反推的传说。作品只以约百余条残篇保存，语句刻意含混；“万物流变”等著名标签也主要经过柏拉图和后世解释。`,lifeSummary:`赫拉克利特生活在爱奥尼亚城邦以弗所，约于前 500 年前后活跃。该城位于波斯帝国西缘，拥有古老贵族、公共祭祀和商业网络。罗素只较有把握地说他是以弗所的贵族公民；关于他让出世袭职位、隐居山中和特殊死法的故事都很晚。他的残篇提到城邦放逐赫尔摩多罗斯，并表现出对群众政治、诗人和前辈知识权威的强烈蔑视。作品可能曾作为一部散文书流传，但我们只能通过其他作者的引用重建其排列和论证。`,timeline:[{date:`约前 540`,place:`以弗所`,title:`出生于贵族家庭`,detail:`家世与具体年份来自后世传统；贵族背景与其残篇中的政治语气相符，但不可写成完整履历。`,certainty:`推定`},{date:`6 世纪末`,place:`以弗所`,title:`城邦政治冲突`,detail:`残篇谴责公民放逐赫尔摩多罗斯，显示他与民主多数及地方政治发生尖锐冲突。`,certainty:`较可靠`},{date:`约前 500`,place:`以弗所`,title:`著作与思想活动`,detail:`写作涉及宇宙、知识、伦理和政治，以格言、悖论、双关和意象迫使读者主动理解。`,certainty:`较可靠`},{date:`5 世纪初`,place:`以弗所 → 雅典（思想传播）`,title:`克拉底鲁传播其思想`,detail:`克拉底鲁把极端流变解释带到雅典，影响青年柏拉图；这已是接受史而非赫拉克利特本人生平。`,certainty:`传统记载`}],inquiries:[{object:`变化与同一`,question:`如果组成材料不断替换，一个事物为何仍能保持自身？`,start:`河流、火焰和生命都持续更换材料，却能维持可识别的结构。`,steps:[`观察材料的连续流入与流出`,`区分低层材料与高层关系结构`,`把变化理解为维持结构的必要条件`,`以尺度和交换说明过程不会任意失控`],conclusion:`同一与变化并非简单互斥：河流之所以仍是那条河，恰因为新水持续流入。赫拉克利特不必被理解为“一切都乱变”。`},{object:`对立与秩序`,question:`冲突为什么不只破坏秩序，反而能够构成秩序？`,start:`弓与琴依靠反向拉力保持功能；昼夜、醒睡、冷热也通过互换被理解。`,steps:[`对立项互相规定意义`,`它们在不同时间、对象或角度出现`,`张力产生运动、功能与和谐`,`没有对立，世界只剩无差别的静止`],conclusion:`对立者不是逻辑上同时同义，而是在一个转换系统中相互依赖。“争斗”是结构关系，不只是政治暴力的赞美。`},{object:`知识与逻各斯`,question:`人怎样从零散经验进入对整体秩序的理解？`,start:`多数人拥有见闻、诗歌和仪式，却像睡着一样只生活在私人世界。`,steps:[`感官提供材料但不自动给出理解`,`寻找在众多变化中共同有效的说明`,`按每一事物的本性区分并连接`,`让个人判断服从共同的逻各斯`],conclusion:`智慧不是知道很多，而是把经验组织成一个共同、可说明的秩序。其格言写法本身就是让读者完成连接的训练。`}],concepts:[{zh:`逻各斯`,en:`logos`,definition:`兼有言说、说明、比例和共同秩序之意。它不是赫拉克利特私人意见，而是人可能理解却经常忽略的世界结构。`},{zh:`流变`,en:`flux`,definition:`事物材料与状态持续转化。现代解释强调：变化并非摧毁一切稳定，有些稳定正由规律更新维持。`},{zh:`对立统一`,en:`unity of opposites`,definition:`对立状态在时间、关系和功能系统中互相依存，不等于同一事物在同一方面同时具有矛盾性质。`},{zh:`火与交换`,en:`fire and exchange`,definition:`火既是元素意象，也是转化过程的模型；万物按尺度交换，整体数量和秩序在变化中保持。`},{zh:`争斗`,en:`strife`,definition:`差异力量的张力与轮替，是生成多样性和功能秩序的条件。罗素把它连接到黑格尔辩证法的远源。`}],lineage:{inherited:`延续米利都学派对自然内部秩序的追问，也继承阿那克西曼德的对立与宇宙正义语言；但他把讨论扩展到知识、伦理和政治。`,school:`没有证据表明他建立了制度化学派。后来的“赫拉克利特派”主要由接受者构成，克拉底鲁的极端流变也不能自动等同于本人。`,influenced:`克拉底鲁把其思想带给柏拉图；柏拉图用流变解释感性世界，斯多葛派吸收火、逻各斯和宇宙秩序。黑格尔及现代过程哲学又把他重构为变化与对立的先驱。`,parallel:`巴门尼德同样追问变化、存在和可靠知识，却从“不可思者不可存在”走向不变存在；两人常被并列为同一问题的极端答案，直接互相影响并无定论。`},comparisons:[{target:`阿那克西曼德`,relation:`同题比较`,shared:`对立力量和尺度共同形成宇宙秩序。`,difference:`阿那克西曼德把越界视为需补偿的不正义；赫拉克利特更激进地说争斗本身就是正义与生成条件。`},{target:`巴门尼德`,relation:`同题比较`,shared:`都不满足于感官表面，要求理性说明变化与存在。`,difference:`赫拉克利特在转换关系中寻找稳定；巴门尼德以存在的可思性排除真正的生成和消灭。`},{target:`克拉底鲁／柏拉图`,relation:`后世重构`,shared:`感性事物处于变化之中。`,difference:`克拉底鲁把流变推向无法稳定命名；柏拉图再以不变理念补足知识对象，这未必是赫拉克利特本人的结论。`},{target:`黑格尔`,relation:`后世重构`,shared:`对立不是外部事故，而参与构成发展。`,difference:`黑格尔建立概念辩证体系与历史逻辑；赫拉克利特留下的是格言式的宇宙、伦理和认识论联系。`}],russellView:`罗素把赫拉克利特描述为贵族式、骄傲而带有神秘主义色彩的思想家。他依次突出火、流变、对立融合和宇宙正义，并认为其中含有黑格尔哲学的萌芽。罗素尤其关心变化为什么令人寻求永恒，由此把赫拉克利特放进西方哲学“时间世界与永恒世界”的长期张力中。`,modernCorrection:`罗素沿用柏拉图以来“普遍流变”的强解释，也倾向把火当作与泰勒斯之水相似的基本物质。现代研究提出更细的读法：河流通过材料更新保持结构；对立项在不同关系和时间中相连，并非违反不矛盾律；火可能更重要地表示受尺度约束的交换过程。`,sources:[T(`第一卷第四章〈赫拉克利特〉`),{label:`Stanford Encyclopedia · Heraclitus`,kind:`补充`,url:`https://plato.stanford.edu/entries/heraclitus/`},{label:`Internet Encyclopedia of Philosophy · Heraclitus`,kind:`补充`,url:`https://iep.utm.edu/heraclit/`}]},{id:`parmenides`,order:6,nameZh:`巴门尼德`,nameEn:`Parmenides of Elea`,greekName:`Παρμενίδης`,dates:`约前 515—前 450`,active:`前 5 世纪前期`,places:[`埃利亚`,`大希腊`],school:`埃利亚学派`,figureId:`parmenides`,chapterIds:[`b1-05`],thesis:`思想和言说若要有所指，就不能以“非存在”为对象；由此，真正的存在不能生成、消灭、分割或移动。哲学第一次以论证条件强力约束宇宙论。`,evidenceCaution:`一首六步格哲学诗约保存一百六十行，生平则几乎只有后世记载。柏拉图笔下他在雅典与苏格拉底相见的时间线可能是文学设计；“完全否认经验世界”也只是众多解释之一。`,lifeSummary:`巴门尼德出生于南意大利的希腊殖民城埃利亚。该城由躲避波斯扩张的福凯亚人建立，处在爱奥尼亚知识传统与大希腊宗教—政治网络的交汇处。后世说他为城邦制定法律，也把他与色诺芬尼或毕达哥拉斯传统相连，但直接师承难以确认。他写过一首后来通称《论自然》的哲学诗：叙述者乘车抵达女神之门，先学习“真理之路”，再听取凡人的宇宙解释。罗素把他视为形而上学与逻辑论证的重大起点；现代研究则更重视诗中并未被简单抛弃的自然研究。`,timeline:[{date:`约前 515`,place:`埃利亚`,title:`出生`,detail:`年代主要由柏拉图对话中的戏剧日期反推；对话本身并非可靠编年记录。`,certainty:`推定`},{date:`前 5 世纪前期`,place:`埃利亚`,title:`写作哲学诗`,detail:`作品以神圣启示的旅程开场，却在核心部分使用连续推理考察“存在”必须具有什么属性。`,certainty:`较可靠`},{date:`前 5 世纪`,place:`埃利亚`,title:`立法者传统`,detail:`斯彪西波等后世作者称他为埃利亚制定法律；当地每年要求官员遵守“巴门尼德法律”的说法无法独立核验。`,certainty:`传统记载`},{date:`约前 450`,place:`雅典（柏拉图叙事）`,title:`与青年苏格拉底论辩`,detail:`柏拉图让年老的巴门尼德与芝诺访问雅典；这一场景首先服务于理念论批判，不宜直接当作旅行事实。`,certainty:`传统记载`}],inquiries:[{object:`思想、言说与存在`,question:`一条可被认识的探究道路，最低限度必须满足什么条件？`,start:`人可以思考和说出“是”；但若声称研究“不是”，研究对象就在被指认时取消了自身。`,steps:[`区分‘是’与‘不是’两条道路`,`指出非存在不可被认识或说出`,`禁止用非存在说明存在`,`把可思性当作宇宙论必须遵守的逻辑门槛`],conclusion:`可靠探究只能沿着“存在”展开。这里的关键不是先观察世界，再列材料，而是先检查一个解释是否自相矛盾。`},{object:`生成、消灭与运动`,question:`若存在不能来自非存在，它还能真正生成或改变吗？`,start:`生成意味着先前不存在；消灭意味着后来不再存在。二者都要求把非存在写进解释。`,steps:[`排除从无到有与从有到无`,`排除存在内部的空缺和断裂`,`由连续性推出不可分`,`由完整性推出不动、均一和无始无终`],conclusion:`“真正存在者”是不生不灭、完整连续、同质而不动的。经验变化若仍要被说明，就必须重新定义而不能诉诸无中生有。`},{object:`凡人意见与宇宙论`,question:`严格的存在论之后，为什么诗还要详细说明光、夜、天体和生命？`,start:`女神在真理之后转述凡人以光和夜组织世界的解释，并建立相当完整的宇宙生成图景。`,steps:[`承认人类经验以相反性质分类`,`用光与夜的混合排列现象`,`说明天体、性别与生命生成`,`把可接受的经验模型置于更高逻辑约束之下`],conclusion:`“意见”不必等于毫无价值的谬误；它可能是无法达到存在论确定性、却仍有系统性的自然解释。其地位是现代研究的核心争议。`}],concepts:[{zh:`存在者`,en:`what-is / to eon`,definition:`能够被思想和言说的对象；在真理之路上表现为不生不灭、连续、均一、完整而不动。`},{zh:`非存在`,en:`what-is-not`,definition:`不能被认识、陈述或充当生成来源的“不是”。巴门尼德用它检验解释是否偷偷依赖虚无。`},{zh:`真理之路`,en:`Way of Truth`,definition:`从“存在必定是，非存在不是”出发，以必要推论限定真实结构的探究道路。`},{zh:`凡人意见`,en:`Opinions of Mortals / doxa`,definition:`以光与夜等对立原则解释经验宇宙的部分；它与真理的关系可能是错误、次级模型或对现象的最佳说明。`}],lineage:{inherited:`继承爱奥尼亚自然哲学的宇宙整体问题，也可能接触毕达哥拉斯式宗教语言；但他的决定性变化是让解释先接受可思与可说条件的审查。`,school:`后世把巴门尼德、芝诺和麦里梭归为埃利亚学派。共同点是捍卫存在的统一与不变，并用论证揭露运动、多与分割的困难。`,influenced:`恩培多克勒、阿那克萨哥拉和原子论者都保留“不真正生成或毁灭”的约束，再以混合、分离或重排挽救经验变化；柏拉图和亚里士多德则把存在问题发展为体系性的本体论。`,parallel:`赫拉克利特同样寻找变化背后的可靠秩序；两人常被塑造成流变与静止的对立面，但是否直接互相批评并无定论。`},comparisons:[{target:`赫拉克利特`,relation:`同题比较`,shared:`都认为感官表象不足，世界必须有可理解的统一结构。`,difference:`赫拉克利特在有尺度的转换中保存同一；巴门尼德从可思性出发排除真实存在的生成和运动。`},{target:`芝诺`,relation:`直接传承`,shared:`以推论保护不变、统一的存在。`,difference:`巴门尼德正面说明存在的属性；芝诺多以反证展示承认运动与多会遭遇的悖论。`},{target:`恩培多克勒`,relation:`批评关系`,shared:`不允许存在真正产生或消失。`,difference:`恩培多克勒把不变性分配给四根，再用组合与分离解释可见变化。`},{target:`留基伯／德谟克利特`,relation:`批评关系`,shared:`保存基本存在者的不生不灭。`,difference:`原子论承认多个不可变原子，并把虚空作为运动条件，正面修正巴门尼德对非存在的禁令。`}],russellView:`罗素把巴门尼德与赫拉克利特并置为“万物变化”与“没有变化”两极。他尤其重建语言论证：凡能被思想或说出的东西必定存在，因此生成、消灭、运动和多样都不可能。罗素认为后来“实体”概念的历史任务，正是既向巴门尼德承认某种不变，又给经验变化留下空间。`,modernCorrection:`现代研究不再轻易把整首诗压缩成“现实只是一个静止球体”。作品保存了相当完整的宇宙论，并可能区分必要真理与现象模型，而非简单宣布自然研究无意义。“存在”究竟指唯一实体、必然存在方式，还是任何成功探究的对象，也仍存在严格一元论、模态解释等竞争读法。`,sources:[T(`第一卷第五章〈巴门尼德〉`),{label:`Stanford Encyclopedia · Parmenides`,kind:`补充`,url:`https://plato.stanford.edu/entries/parmenides/`},{label:`Internet Encyclopedia of Philosophy · Parmenides`,kind:`补充`,url:`https://iep.utm.edu/parmenid/`}]},{id:`empedocles`,order:7,nameZh:`恩培多克勒`,nameEn:`Empedocles of Acragas`,greekName:`Ἐμπεδοκλῆς`,dates:`约前 494—前 434`,active:`前 5 世纪中叶`,places:[`阿克拉加斯`,`西西里`,`大希腊`],school:`多元论自然哲学`,figureId:`empedocles`,chapterIds:[`b1-06`],thesis:`没有东西真正生成或消灭；四种永久的“根”在爱与争的作用下混合、分离，生命、感知和宇宙历史都是同一组关系的不同尺度。`,evidenceCaution:`作品以残篇和斯特拉斯堡纸草保存，传统上分为《论自然》与《净化》，但究竟是一部还是两部作品仍有争议。民主政治、治病神迹和跳入埃特纳火山等故事多来自晚期传记。`,lifeSummary:`恩培多克勒来自西西里富裕强盛的希腊城邦阿克拉加斯，生活在僭主政治瓦解、民主制度竞争及希腊人与迦太基势力长期对峙的环境中。古代传统称其家族有政治地位，他反对僭主或寡头、拒绝王位，也以医生、诗人、宗教教师和演说家著称；这些形象彼此交叠，却不能都当作可靠事件。他用诗歌同时讨论宇宙、生命、知觉、轮回和净化。比起把“科学”和“神秘”看成两个人格，更有效的理解是：同一个混合—分离宇宙论，也被用来说明身体和灵魂的命运。`,timeline:[{date:`约前 494`,place:`阿克拉加斯`,title:`出生`,detail:`出生于有影响力的家族是古代传统；具体年份由后世编年推定。`,certainty:`推定`},{date:`前 5 世纪中叶`,place:`阿克拉加斯`,title:`政治活动`,detail:`被描述为民主派、反僭主并曾解散寡头组织；故事可能保存历史记忆，也可能用来塑造哲人形象。`,certainty:`传统记载`},{date:`约前 450—前 430`,place:`西西里／大希腊`,title:`诗歌、医学与教学`,detail:`残篇把四根、爱与争、身体构造、知觉、轮回和净化放入相连的思想工程。`,certainty:`较可靠`},{date:`约前 434`,place:`地点不详`,title:`死亡与火山传奇`,detail:`亚里士多德传统说他约六十岁去世；跳入埃特纳火山以证明神性的故事是著名却不可靠的后世传奇。`,certainty:`推定`}],inquiries:[{object:`变化与基本成分`,question:`接受巴门尼德“不生不灭”的约束后，日常生成与毁灭怎样可能？`,start:`若从无到有不可能，就不能说木头、身体或世界被真正创造；但经验又显示事物不断出现和消失。`,steps:[`把生成改写为成分结合`,`把毁灭改写为成分分离`,`设定火、气、水、土四根永久平等`,`以比例差异解释不同物体与组织`],conclusion:`变化发生在关系与配比层，不发生在基本成分自身。四根像有限字母，能写出多种但并非任意的自然结构。`},{object:`宇宙运动与历史`,question:`不变成分为什么会组合和分开，并形成有方向的宇宙阶段？`,start:`只列四种材料仍不能解释它们为何运动、何时混合、何时分离。`,steps:[`以爱推动相异成分结合`,`以争推动成分分离`,`二力的相对优势周期变化`,`由完全融合的圆球到分离世界，再向相反方向循环`],conclusion:`爱与争是跨尺度的动力关系：它们不是简单的道德善恶，而使宇宙、身体和政治联结成周期性的结构。`},{object:`生命、感知与净化`,question:`同一套物理原则能否解释器官、认识与人的生活规范？`,start:`身体由四根混合，感觉器官与对象必须通过孔隙和流出物发生匹配；生命又被描述为流亡神灵的轮回。`,steps:[`让器官比例决定其功能`,`以流出物进入相合孔隙解释感觉`,`以‘同类认识同类’连接身体与对象`,`把杀生、饮食和轮回放进共同生命的宇宙亲缘`],conclusion:`自然论与净化论都反对绝对断裂：身体、动物、植物和宇宙共享材料与循环；伦理要求因而获得宇宙论背景。`}],concepts:[{zh:`四根`,en:`four roots`,definition:`火、气、水、土四种平等、不生不灭的基本成分。后世称“四元素”，但“根”更能显示其生成多样结构的功能。`},{zh:`爱`,en:`Love / Philotēs`,definition:`使不同成分结合、趋向统一的宇宙力量；不等于日常情感，也不在所有阶段都只产生良好结果。`},{zh:`争`,en:`Strife / Neikos`,definition:`使混合物分解、相同成分聚集的力量；与爱相互消长，不能简单归结为纯粹邪恶。`},{zh:`宇宙循环`,en:`cosmic cycle`,definition:`爱与争轮流占优，使世界在融合、分离及重新结合之间演化；循环究竟包含一个还是两个完整宇宙生成过程仍有争论。`},{zh:`流出物与孔隙`,en:`effluences and pores`,definition:`对象发出的微粒进入器官中相合的孔隙，由此解释感知、吸引与部分身体过程。`}],lineage:{inherited:`接受巴门尼德关于真正存在者不生不灭的限制，也继承毕达哥拉斯—俄耳甫斯传统的轮回与净化问题，并吸收西西里医学和自然观察。`,school:`通常与阿那克萨哥拉并列为前苏格拉底多元论者：不再寻找单一变化材料，而以多个永久成分的重排保存经验世界。`,influenced:`四元素框架经柏拉图、亚里士多德和希波克拉底医学长期延续；爱与争、孔隙感知和生物组合也成为后世自然哲学的反复参照。`,parallel:`阿那克萨哥拉同样把生成改为混合和分离，却拒绝只有四种基本材料；原子论则把成分简化为形状不同但无性质差异的原子。`},comparisons:[{target:`巴门尼德`,relation:`批评关系`,shared:`基本存在者不能从无生成或彻底消灭。`,difference:`巴门尼德将真实存在推向一与不动；恩培多克勒承认四种不变成分及其空间重组。`},{target:`阿那克萨哥拉`,relation:`同题比较`,shared:`以永久成分的混合和分离解释可见生成。`,difference:`恩培多克勒用四根及爱、争；阿那克萨哥拉主张无限多种成分，并以努斯启动旋转。`},{target:`德谟克利特`,relation:`同题比较`,shared:`宏观性质由更基本单位的组合方式产生。`,difference:`四根本身带有火水等性质，且受两种宇宙力支配；原子只以形状、次序和位置区别，在虚空中机械运动。`},{target:`达尔文`,relation:`后世重构`,shared:`不合适的生物组合消失、较能生存的结构留下。`,difference:`恩培多克勒没有遗传、种群与累积选择理论；其怪异肢体组合只是宇宙阶段中的自然生成模型。`}],russellView:`罗素把恩培多克勒写成哲学家、先知、科学家与“江湖术士”的奇特混合，既赞赏水钟实验、空气压力、离心力及植物性别等观察，也详细转述神性宣称和火山传奇。理论上，他突出四元素、爱与争以及循环宇宙，认为恩培多克勒在保存巴门尼德不变性的同时重新允许变化。`,modernCorrection:`“科学家与骗子并存”的肖像过度依赖晚期传记，也把现代学科边界投射到诗人身上。新纸草材料显示物理宇宙论与宗教净化可能比罗素设想得更紧密。四根不是现代化学元素，爱与争也兼具物理、心理和伦理语义；关于一个或两个宇宙生成过程尚无定论。`,sources:[T(`第一卷第六章〈恩培多克勒〉`),{label:`Stanford Encyclopedia · Empedocles`,kind:`补充`,url:`https://plato.stanford.edu/entries/empedocles/`},{label:`Internet Encyclopedia of Philosophy · Empedocles`,kind:`补充`,url:`https://iep.utm.edu/empedocl/`}]},{id:`anaxagoras`,order:8,nameZh:`阿那克萨哥拉`,nameEn:`Anaxagoras of Clazomenae`,greekName:`Ἀναξαγόρας`,dates:`约前 500—前 428`,active:`约前 462—前 432 在雅典`,places:[`克拉佐梅奈`,`雅典`,`兰普萨库斯`],school:`多元论自然哲学`,figureId:`anaxagoras`,chapterIds:[`b1-08`],thesis:`一切可见事物都由无限多种成分混合而成，并以某类成分占优势获得名称；独立而未混合的努斯启动旋转，使原始混合物逐渐分离成有序宇宙。`,evidenceCaution:`生平主要来自数百年后的传记，入雅典、审判与流亡的日期互有冲突。“种子”和“同质部分”常由后世术语反向概括；努斯究竟是目的因还是卓越的运动起点也长期有争议。`,lifeSummary:`阿那克萨哥拉出生于爱奥尼亚城邦克拉佐梅奈，成年后长期居住雅典，通常被视为把爱奥尼亚自然研究带入古典雅典的关键人物。他与伯里克利政治圈关系密切，古代传统还把欧里庇得斯列为学生。其自然解释把太阳说成炽热石块、月亮说成土质天体，并说明日月食；这些观点后来被联系到“不敬神”指控。审判究竟发生于何时、是否具有打击伯里克利的政治动机并不确定。他离开雅典后在小亚细亚的兰普萨库斯教学并去世，当地据说长期纪念他。`,timeline:[{date:`约前 500`,place:`克拉佐梅奈`,title:`出生`,detail:`来自富裕家庭、放弃产业求知的故事带有哲人传记模式；出生地较为确定。`,certainty:`推定`},{date:`约前 462`,place:`雅典`,title:`进入雅典知识与政治圈`,detail:`传统称他在雅典活动约三十年，并与伯里克利交往；准确起止日期有争议。`,certainty:`传统记载`},{date:`前 5 世纪中叶`,place:`雅典`,title:`自然论写作与教学`,detail:`以原始混合、无限可分、努斯旋转及天体自然解释建立一个从宇宙到感觉的系统。`,certainty:`较可靠`},{date:`约前 432—前 428`,place:`雅典 → 兰普萨库斯`,title:`受审、离开雅典并去世`,detail:`因太阳和月亮理论被控不敬神、后获伯里克利营救的叙事广为流传，但时间与细节无法确证。`,certainty:`传统记载`}],inquiries:[{object:`生成、混合与性质`,question:`若没有真正生成，一种食物为什么能长成血、骨、毛发等不同组织？`,start:`从面包和水中不可能凭空产生原先完全不存在的性质，因此成品的成分必须已经以微量存在。`,steps:[`否定绝对生成和消灭`,`设定原始状态中万物混在一起`,`主张任何混合物都含有各种成分`,`用占优势的成分说明事物为何被命名为金、肉或骨`],conclusion:`“一切在一切之中”不是说每物外观相同，而是没有纯粹隔绝的材料；可见性质来自混合比例和优势。`},{object:`努斯与宇宙秩序`,question:`若最初一切混合且静止，分离和秩序从何开始？`,start:`混合物自身没有明显理由打破均衡，也不能解释宇宙旋转为何具有可辨方向和层次。`,steps:[`把努斯规定为最精纯且不与他物混合`,`赋予它对万物的知识和支配力`,`由努斯启动局部旋转`,`旋转扩大并使稀密、冷热、明暗逐步分离`],conclusion:`努斯为秩序提供独立起点，但作品后续主要依靠碰撞、旋转和分离说明细节；它是否始终按目的安排宇宙仍有争议。`},{object:`天体、感觉与不可见结构`,question:`人怎样从有限感官推知巨大天体和微小成分？`,start:`太阳看似神圣圆盘、食物看似单一，感官却只呈现尺度有限的表面。`,steps:[`把太阳解释为炽热石块、月亮解释为土质天体`,`用遮蔽说明日月食`,`以相反性质的刺激解释感觉`,`由可见现象推断其中隐藏的成分和过程`],conclusion:`现象既会限制认识，也能成为通往不可见结构的线索；自然解释因此不必服从传统神话分类。`}],concepts:[{zh:`努斯`,en:`Nous / Mind`,definition:`唯一不与其他成分混合、具有知识与力量并启动宇宙旋转的原则；可译“心灵”或“理智”。`},{zh:`万物混合`,en:`everything in everything`,definition:`每个可分混合物中都含有各种类型的成分，没有绝对纯物；差异来自比例而非某种性质凭空出现。`},{zh:`优势原则`,en:`predominance`,definition:`一个对象按其中占优势的成分被感知和命名，因此少量其他成分可以存在而不改变其日常分类。`},{zh:`无限可分`,en:`infinite divisibility`,definition:`没有最小部分；无论取多小的量仍含有多种成分。这与原子论的不可分单位形成直接对照。`},{zh:`旋转`,en:`cosmic rotation`,definition:`由努斯启动、范围不断扩大的涡旋运动，使冷热、稀密等成分分离并形成天体和世界。`}],lineage:{inherited:`接受巴门尼德关于无中生有不可能的限制，也延续爱奥尼亚气象和天体研究；其长期雅典生活把两地的知识网络连接起来。`,school:`属于多元论者，但不把基本成分限制为四种，也不承认物质最小单位；其系统由无限混合物与独立努斯共同构成。`,influenced:`苏格拉底—柏拉图传统从努斯中期待目的论，却批评他实际多用机械原因；亚里士多德赞赏他把心灵与混合物分开，同时认为其使用不充分。`,parallel:`恩培多克勒用四根和两力解决同一变化难题；原子论同样依靠重排，却用不可分原子和虚空取代无限可分、万物互含的混合物。`},comparisons:[{target:`恩培多克勒`,relation:`同题比较`,shared:`不存在真正生成或毁灭，只有永久成分的混合与分离。`,difference:`恩培多克勒只有四根并由爱、争推动；阿那克萨哥拉承认无限多种成分，由努斯开启旋转。`},{target:`留基伯／德谟克利特`,relation:`同题比较`,shared:`物体性质取决于微观组成和排列过程。`,difference:`阿那克萨哥拉无限可分且一切互含；原子论设不可分原子，并允许真正空无的虚空。`},{target:`苏格拉底／柏拉图`,relation:`批评关系`,shared:`心灵应当与宇宙秩序有关。`,difference:`柏拉图笔下苏格拉底期待努斯说明何者最好，却发现阿那克萨哥拉主要诉诸空气、以太和机械运动。`},{target:`亚里士多德`,relation:`直接传承`,shared:`不能只列物质，还需说明运动和秩序来源。`,difference:`亚里士多德把目的、形式、动力和材料系统区分；阿那克萨哥拉的努斯更多承担最初运动与分离功能。`}],russellView:`罗素认为阿那克萨哥拉的原创性不及毕达哥拉斯、赫拉克利特或巴门尼德，但历史位置重要：他把哲学带到雅典，并首次明确提出心灵是主要原因。罗素同时沿用柏拉图和亚里士多德的批评——努斯启动旋转后很少出场，具体解释仍主要是物质和机械的。`,modernCorrection:`审判与流亡叙事受后期政治传记影响，不宜写成确定事实。“种子”和亚里士多德的“同质部分”也不能无条件当作本人技术词。现代解释更注意其彻底的无限主义：没有最小量，也没有纯物质；努斯虽启动秩序，却未必是按照人类价值选择“最好世界”的人格设计者。`,sources:[T(`第一卷第八章〈阿那克萨哥拉〉`),{label:`Stanford Encyclopedia · Anaxagoras`,kind:`补充`,url:`https://plato.stanford.edu/entries/anaxagoras/`},{label:`Internet Encyclopedia of Philosophy · Anaxagoras`,kind:`补充`,url:`https://iep.utm.edu/anaxag/`}]},{id:`leucippus`,order:9,nameZh:`留基伯`,nameEn:`Leucippus`,greekName:`Λεύκιππος`,dates:`约前 5 世纪`,active:`约前 440 年前后`,places:[`阿布德拉（传统归属）`,`米利都／埃利亚（不同传统）`],school:`古代原子论`,figureId:`leucippus`,chapterIds:[`b1-09`],thesis:`把巴门尼德式的不变存在拆分为无数不可分实体，并承认真正的虚空，从而让运动、分离和重组在不依赖生成毁灭的条件下成为可能。`,evidenceCaution:`留基伯是本批材料最薄弱的人物：出生地、生卒年、师承和著作归属都不确定，伊壁鸠鲁甚至否认其存在。多数古代证言仍把他列为德谟克利特老师及原子论创始者，但两人的学说通常无法逐条拆分。`,lifeSummary:`留基伯大概活动于前五世纪，传统分别把他的故乡说成米利都、埃利亚或阿布德拉。他常被安排在芝诺之后、德谟克利特之前：先理解埃利亚学派对运动与非存在的挑战，再提出原子和虚空作为回应。亚里士多德和泰奥弗拉斯托斯明确把原子论开端归给他，并说德谟克利特是其同伴或学生；但没有独立传记可重建旅行、政治交往或确切年代。题为《大宇宙系统》和《论心灵》的作品曾归于他，现仅存一句著名残言，且著作归属同样可能在原子论共同传统中移动。`,timeline:[{date:`前 5 世纪前半`,place:`米利都／埃利亚／阿布德拉`,title:`出身与活动地`,detail:`三个地点分别见于不同古代传统，无法据此选择一条确定迁移路线。`,certainty:`传统记载`},{date:`约前 440`,place:`阿布德拉`,title:`原子论形成`,detail:`相对年代来自他先于德谟克利特、又回应巴门尼德与芝诺问题的思想位置。`,certainty:`推定`},{date:`前 5 世纪`,place:`阿布德拉（传统归属）`,title:`与德谟克利特合作或师承`,detail:`后世通常称德谟克利特为学生，但两人可能代表一个难以拆分的研究传统。`,certainty:`传统记载`}],inquiries:[{object:`运动与虚空`,question:`若非存在不能存在、存在内部没有空缺，运动如何可能？`,start:`巴门尼德排除非存在，芝诺展示连续分割中的运动困难；经验却迫使解释保留运动与多。`,steps:[`接受基本存在者不生成、不毁灭`,`把存在者改为无数不可分实体`,`承认虚空以提供间隔和移动空间`,`用位置重排代替性质生成`],conclusion:`原子是“有”，虚空在某种意义上是“无”，但无也必须作为空间条件存在。原子论由此对埃利亚禁令作出最直接修正。`},{object:`因果与宇宙形成`,question:`没有设计者，原子运动怎样形成世界？`,start:`若原子和虚空足以解释变化，就不应在每个结果处再加入目的或神意。`,steps:[`设定原子在无限虚空中持续运动`,`不同形状与运动形成涡旋`,`碰撞、缠结与筛分产生复合体`,`让世界形成服从必然性而非预设目的`],conclusion:`现存残言称没有事物无缘无故发生，一切出于理由与必然；但具体机械模型多由留基伯—德谟克利特共同证言保存。`}],concepts:[{zh:`原子`,en:`atomon / indivisible`,definition:`不可切分、内部无空隙且本身不改变的微小实体；古代“不可分”是理论属性，不等于现代物理学原子。`},{zh:`虚空`,en:`void`,definition:`原子之间的空无间隔，使多、运动和重组成为可能；它是原子论对“非存在不能存在”的关键修正。`},{zh:`必然`,en:`necessity / anankē`,definition:`现象由原子先前的运动、碰撞和结构关系产生，而非为某种目的临时安排。`}],lineage:{inherited:`主要思想背景是巴门尼德和芝诺对非存在、分割与运动的限制；出生地传统又可能把他连接到米利都自然哲学。`,school:`古代原子论的创始层。留基伯与德谟克利特的文本、命题和声誉高度重叠，因此页面只把古代证言较一致的“创始角色”谨慎归给他。`,influenced:`德谟克利特把原子论扩展为宇宙、知觉、生命、文化与伦理的广泛系统；伊壁鸠鲁和卢克莱修后来调整原子运动并赋予其伦理目标。`,parallel:`恩培多克勒和阿那克萨哥拉都以不变成分重排回答巴门尼德，但只有原子论明确设定不可分单位和虚空。`},comparisons:[{target:`巴门尼德／芝诺`,relation:`批评关系`,shared:`基本存在者不生成、不消灭，并认真接受关于运动的逻辑困难。`,difference:`留基伯允许多个存在者和作为间隔的虚空，从而恢复运动；这正是埃利亚学派拒绝的条件。`},{target:`德谟克利特`,relation:`直接传承`,shared:`原子、虚空、机械运动与必然性构成共同理论。`,difference:`古代传统通常把发明归给留基伯、系统发展归给德谟克利特，但具体命题往往无法可靠分配。`},{target:`阿那克萨哥拉`,relation:`同题比较`,shared:`用微观重排而非真实生成解释宏观变化。`,difference:`阿那克萨哥拉坚持无限可分和万物互含；留基伯以不可分原子和空无间隔终止分割。`}],russellView:`罗素在“原子论者”一章把留基伯和德谟克利特合并处理，因为二人的思想很难分开。他把原子论视为前苏格拉底自然研究的高潮：既接受巴门尼德关于基本存在不变的洞见，又通过多个原子和虚空给经验变化以清晰机械解释。`,modernCorrection:`不能把共同原子论系统中的每一条命题都写成留基伯个人发现，也不能由伊壁鸠鲁的否认直接断言他是虚构人物。最稳妥的层级是：历史存在有较强古代见证；创始作用很可能真实；具体生平、书目以及与德谟克利特的分工则高度不确定。页面采用的版画是十八世纪后世想象，不是肖像记录。`,sources:[T(`第一卷第九章〈原子论者〉`),{label:`Stanford Encyclopedia · Ancient Atomism`,kind:`补充`,url:`https://plato.stanford.edu/entries/atomism-ancient/`},{label:`Internet Encyclopedia of Philosophy · Leucippus`,kind:`补充`,url:`https://iep.utm.edu/leucipp/`}]},{id:`democritus`,order:10,nameZh:`德谟克利特`,nameEn:`Democritus of Abdera`,greekName:`Δημόκριτος`,dates:`约前 460—前 370`,active:`前 5 世纪后半`,places:[`阿布德拉`,`雅典（传统记载）`,`埃及与东方（旅行传统）`],school:`古代原子论`,figureId:`democritus`,chapterIds:[`b1-09`],thesis:`真实层只有形状各异的原子与虚空；感官性质、生命和世界由原子的数量、排列与运动关系生成，而伦理上的安宁则来自调节欲望、判断与生活尺度。`,evidenceCaution:`著作目录庞大却几乎全失，现存残篇和后世摘要的真伪、分类常有争议。旅行范围与“笑的哲学家”形象高度传奇化；许多物理命题也只能归给留基伯—德谟克利特共同体系。`,lifeSummary:`德谟克利特出生于色雷斯海岸的希腊城邦阿布德拉，与苏格拉底大致同时，却因理论延续早期自然哲学而被罗素放在苏格拉底之前讨论。传统说他继承财产后广泛旅行至埃及、波斯甚至更远地区，又曾到雅典而无人认识；可靠程度不一，却反映其后来“博学研究者”的名声。他写作范围据说覆盖宇宙、数学、感觉、医学、语言、技术和伦理。雅典哲学传统很少直接保存其作品，亚里士多德却持续认真讨论他的理论。后世称他为“笑的哲学家”，把节制、愉悦与看透人事结合成一种人物图像。`,timeline:[{date:`约前 460`,place:`阿布德拉`,title:`出生`,detail:`古代编年分歧很大；可以较稳妥地把他视为苏格拉底的同时代人。`,certainty:`推定`},{date:`前 5 世纪后半`,place:`地中海东部（旅行传统）`,title:`旅行与学习`,detail:`埃及、巴比伦、波斯乃至印度的行程多由晚期材料扩大，不宜画成确定路线。`,certainty:`传统记载`},{date:`约前 430 后`,place:`阿布德拉`,title:`扩展原子论体系`,detail:`将原子和虚空应用于宇宙、感觉、心灵、生命与文化解释，并形成大量著作传统。`,certainty:`较可靠`},{date:`约前 370`,place:`阿布德拉`,title:`去世与接受史`,detail:`长寿、公众尊崇及“笑的哲学家”故事主要塑造后世形象；确切卒年未知。`,certainty:`推定`}],inquiries:[{object:`原子结构与宏观变化`,question:`只有不变原子和虚空，如何产生不同物体、性质与世界？`,start:`若原子内部没有差异性质，就必须让差异来自它们之间的可重复关系。`,steps:[`让原子只在形状、大小上不同`,`用次序和位置区分结构`,`以碰撞、缠结、排列形成复合体`,`以分散解释复合物消灭，并允许无限虚空中形成无数世界`],conclusion:`宏观生成是结构涌现：基本单位保持不变，关系却能产生密度、质地、天体和生命等多层现象。`},{object:`感觉与知识`,question:`若颜色、甜苦只由原子互动产生，感官还能提供真实吗？`,start:`同一食物对不同身体可能呈现不同味道，说明性质不只属于对象本身；但理性又必须从感觉获得材料。`,steps:[`让对象释放原子薄膜作用于器官`,`用原子形状与器官状态解释感觉差异`,`区分约定性的感官性质与原子、虚空的真实结构`,`承认理性若否定全部感官，也会摧毁自身证据`],conclusion:`知识具有层级而非简单二分：感官给出现象，理性推断其微观原因；两者相互依赖且都可能受身体条件限制。`},{object:`人的生活、文化与安宁`,question:`一个机械自然世界中，怎样形成可实践的好生活？`,start:`幸福若依赖财富、名声或无限欲望，就持续受外界偶然运动支配。`,steps:[`把愉悦与痛苦视为行动信号而非最高放纵`,`用衡量和节制限制欲望`,`让判断、习惯与教育重塑人的原子状态`,`以社会合作、技艺和语言解释人类从匮乏走向文化`],conclusion:`目标是“心灵安宁”或“愉悦的平衡”：不是逃离物质世界，而是在因果世界中通过理解与训练获得较稳定的生活结构。`}],concepts:[{zh:`原子`,en:`atoms`,definition:`实在、坚实、不可切分且不生不灭的单位；彼此主要以形状、大小、次序和位置区分。`},{zh:`虚空`,en:`void`,definition:`原子运动和彼此分离所需的空无空间；与原子共同构成现实的两个基本方面。`},{zh:`约定性质`,en:`qualities by convention`,definition:`颜色、声音、冷热、甜苦不是孤立原子自带的性质，而在原子结构与感知者身体互动时出现。`},{zh:`必然性`,en:`necessity`,definition:`自然事件由原子运动及先行条件产生，无须诉诸为人安排的目的；它不是宿命预言，而是因果连续性。`},{zh:`心灵安宁`,en:`euthymia / cheerfulness`,definition:`通过节制、衡量、知识和稳定判断获得的平衡愉悦；与后来伊壁鸠鲁的宁静相近但不能完全等同。`}],lineage:{inherited:`直接发展留基伯的原子与虚空，并通过这一框架回答巴门尼德和芝诺；同时延续爱奥尼亚传统以自然过程统一解释天体、生命与人。`,school:`古代原子论的第一位大型系统化者。其机械自然论与伦理残篇共同属于德谟克利特传统，但二者是否组成一个严格演绎体系尚不确定。`,influenced:`伊壁鸠鲁继承原子、虚空和感觉论，却修改原子运动并建立以解除恐惧为目的的共同体伦理；卢克莱修将其转化为拉丁哲学诗。近代机械哲学又把德谟克利特视为古代先驱。`,parallel:`阿那克萨哥拉以无限混合和努斯解释同一组变化问题；柏拉图、亚里士多德也讨论感知和物质结构，却反对把形式、目的与价值完全还原为碰撞。`},comparisons:[{target:`留基伯`,relation:`直接传承`,shared:`原子、虚空、涡旋和非目的性的自然解释。`,difference:`传统把基本创意归给留基伯，把广泛系统化归给德谟克利特；具体边界大多无法确定。`},{target:`阿那克萨哥拉`,relation:`同题比较`,shared:`宏观对象由不可见成分及其关系解释。`,difference:`阿那克萨哥拉的成分无限可分、每物含一切，并由努斯启动；德谟克利特的原子不可分，在虚空中按机械必然运动。`},{target:`柏拉图／亚里士多德`,relation:`批评关系`,shared:`自然应当具有可说明的结构，感觉不能直接等同于真实。`,difference:`二人要求形式、目的或善在解释中发挥作用；德谟克利特优先用原子位置、碰撞和身体状态说明现象。`},{target:`伊壁鸠鲁`,relation:`直接传承`,shared:`以原子论消除神意对自然事件的任意干预，并把认识连接到生活安宁。`,difference:`伊壁鸠鲁加入原子偏斜、强调自由和无恐惧，把物理学更明确地服务于治疗性伦理。`}],russellView:`罗素把德谟克利特视为前苏格拉底科学精神的顶峰，也是后来哲学开始退让给伦理与宗教之前的最后一位纯粹自然解释者。他赞赏原子论用坚实不可变的单位、虚空和机械碰撞统一解释变化，也指出其因果决定论、感觉理论和无穷世界设想具有惊人的现代感。`,modernCorrection:`把德谟克利特称为“现代科学家”会掩盖古代论证背景：原子首先回应存在、分割和运动问题，而非实验检测到的粒子；古代原子也不是今天可分的化学原子。其伦理学并非附带格言，而可能通过身体—心灵连续性与自然论相连，但现存文本不足以证明一套从物理必然推出伦理规范的完整体系。现用雕像亦为身份不明的希腊头像，只作视觉识别。`,sources:[T(`第一卷第九章〈原子论者〉`),{label:`Stanford Encyclopedia · Ancient Atomism`,kind:`补充`,url:`https://plato.stanford.edu/entries/atomism-ancient/`},{label:`Internet Encyclopedia of Philosophy · Democritus`,kind:`补充`,url:`https://iep.utm.edu/democrit/`}]},{id:`protagoras`,order:11,nameZh:`普罗泰戈拉`,nameEn:`Protagoras of Abdera`,greekName:`Πρωταγόρας`,dates:`约前 490—前 420`,active:`前 5 世纪中后期`,places:[`阿布德拉`,`雅典`,`图里`],school:`智者运动`,figureId:`protagoras`,chapterIds:[`b1-10`],thesis:`人的具体经验是判断事物如何呈现的尺度；既然公共事务没有超人的直接真理入口，哲学就必须训练比较相反论证、改善判断并形成可共同生活的制度。`,evidenceCaution:`真实残篇不足十条，大部分材料来自柏拉图、亚里士多德等论敌。审判、焚书和海难故事互相冲突；“人是万物的尺度”究竟是感觉相对主义、实践判断论还是更广泛的人文立场，仍有争议。`,lifeSummary:`普罗泰戈拉出生于色雷斯海岸的阿布德拉，是最早公开以“智者”身份巡回收费教学的人之一。他至少两次到雅典，与伯里克利关系密切，并在前 444／443 年受托为南意大利泛希腊殖民城图里拟定政制。民主法庭、议会和城邦竞争使演说、概念区分与预判后果成为可出售的公共能力。后世说他因《论诸神》的不可知论被控不敬神、离城后遇海难；柏拉图却把他描述为享有声望并活到高龄，故这些结局无法确证。其著作几乎全失，题名显示兴趣横跨论辩、语言、政治与教育。`,timeline:[{date:`约前 490`,place:`阿布德拉`,title:`出生`,detail:`柏拉图称他比对话中的成年智者年长一代，由此通常推至前 490 年代；家庭出身传说彼此矛盾。`,certainty:`推定`},{date:`前 5 世纪中叶`,place:`希腊城邦网络`,title:`以智者身份巡回教学`,detail:`教授家庭和城邦事务中的“善于谋划”，并训练语言、诗歌解释和相反论证；收费使教育成为公开职业。`,certainty:`较可靠`},{date:`前 444／443`,place:`图里`,title:`参与制定殖民城政制`,detail:`伯里克利委托他为新城图里拟定法律或政制，显示其政治思想与民主实践并非纯粹修辞游戏。`,certainty:`较可靠`},{date:`约前 420`,place:`雅典／爱琴海`,title:`生命末期`,detail:`受审、焚书、逃亡和海难的故事可能把不可知论塑造成受神罚的传记；确切死因不明。`,certainty:`推定`}],inquiries:[{object:`知识与人的尺度`,question:`同一阵风对一人冷、对另一人不冷时，谁掌握事物的真实样貌？`,start:`人只能在自己的身体、历史经验和处境中接触事物，无法跳到一个无人称的神圣观察点。`,steps:[`从感觉差异扩展到意见和价值判断`,`把‘事物’理解为事物与人的关系`,`拒绝以单一表象取消另一表象`,`区分判断是否更好与是否更真`],conclusion:`每个人是事物向其呈现方式的尺度。命题不必否定外部世界；它限制的是脱离经验而宣称唯一尺度的资格。`},{object:`论辩、教育与改进`,question:`若相反意见各有处境基础，教师还能做什么？`,start:`相对性若只等于‘人人都对’，收费教学将失去理由，公共选择也无法区分优劣。`,steps:[`为每件事辨认相反论证`,`分析词义、语法与听众处境`,`预判意见在个人和城邦中的后果`,`用教育把较差状态转为较好状态`],conclusion:`智者不垄断绝对真理，而改善谋划和表达。较好的判断能带来健康、秩序或共同利益，即使不能被宣布为超历史真理。`},{object:`政治共同体与德性`,question:`民主为何可以让普通公民共同判断正义，而不只交给少数专家？`,start:`造船需要专业知识，但所有公民都被允许参与正义和政治问题；这种差别需要解释。`,steps:[`区分维持生存的专门技艺与共同生活能力`,`以神话说明正义感和羞耻感被普遍分配`,`承认习俗塑造判断`,`用教育、法律和讨论持续改善公民能力`],conclusion:`政治德性不是少数天才的秘密技术，而是人人必须具有、程度又可训练的共同能力；这为民主论辩提供了认识论基础。`}],concepts:[{zh:`人是尺度`,en:`man-measure thesis`,definition:`人是事物如何对其显现和被评价的尺度；“人”可指具体个人，也可能包含共享经验形成的共同体。`},{zh:`相反论证`,en:`antilogiai / opposing arguments`,definition:`同一问题可以形成彼此对立的论证。训练目标不只是获胜，也包括暴露判断对前提和处境的依赖。`},{zh:`善于谋划`,en:`euboulia / good deliberation`,definition:`在家庭和城邦事务中判断行动、语言及其后果的实践能力，是普罗泰戈拉自述的教学目标。`},{zh:`诸神不可知`,en:`agnosticism about the gods`,definition:`由于问题晦暗且人生短暂，无法确定诸神存在、不存在或形貌；这是知识限度声明，不等于证明无神。`}],lineage:{inherited:`继承前苏格拉底关于真理、感觉和世界的争论，却把问题从宇宙结构转到人的经验、语言和政治判断；阿布德拉背景不证明他师从较年轻的德谟克利特。`,school:`智者不是共享教义的严密学派，而是收费巡回教学、公共演说和政治教育的职业网络。普罗泰戈拉是其中最早且最具理论深度的代表。`,influenced:`欧里庇得斯等雅典文化人物受到智者论辩氛围影响；柏拉图以《普罗泰戈拉》《泰阿泰德》系统回应其相对主义，亚里士多德又用不矛盾律批评它。`,parallel:`现代实用主义同样区分抽象真理与判断后果，但不能把普罗泰戈拉直接写成现代实用主义者；民主教育与价值相对主义之间也不是必然等号。`},comparisons:[{target:`巴门尼德`,relation:`批评关系`,shared:`都从‘何者可被说真’重组哲学问题。`,difference:`巴门尼德排除凡人意见以维护唯一可靠道路；普罗泰戈拉把具体人的经验重新确立为不可越过的判断条件。`},{target:`苏格拉底`,relation:`同题比较`,shared:`都在公共对话中检验德性、教育和城邦判断。`,difference:`普罗泰戈拉教授可改善的谋划与表达；苏格拉底更执着于追问跨处境的定义，并拒绝以收费宣称传授德性。`},{target:`柏拉图`,relation:`批评关系`,shared:`都承认教育会改变灵魂和政治判断。`,difference:`柏拉图要求理念与善提供超越意见的标准；普罗泰戈拉从人的经验与共同后果内部比较判断。`},{target:`实用主义`,relation:`后世重构`,shared:`可以说一种判断比另一种带来更好的实践结果。`,difference:`现代实用主义发展了探究共同体、可错论和真理理论；现存材料不足以把这些完整框架归给普罗泰戈拉。`}],russellView:`罗素把智者置于雅典民主法庭、财富和文化冲突中，反对照搬柏拉图的贬低。他把“人是尺度”解释为没有客观真理，却特别注意到柏拉图替普罗泰戈拉提出的修正：意见未必有真假高下，却可能有好坏后果。罗素因此把他连接到实用主义，并认为收费教学本身不比现代教授领薪更可耻。`,modernCorrection:`现代研究比罗素更谨慎：尺度命题不必宣称外部世界不存在，也不必等于所有命题都真；它可能主要说明性质和价值如何在具体经验关系中呈现。普罗泰戈拉对民主的支持不能只由柏拉图对话中的神话直接推定，但图里政制、善于谋划和普遍政治能力共同构成了较强线索。`,sources:[T(`第一卷第十章〈普罗泰戈拉〉`),{label:`Stanford Encyclopedia · Protagoras`,kind:`补充`,url:`https://plato.stanford.edu/entries/protagoras/`},{label:`Internet Encyclopedia of Philosophy · Protagoras`,kind:`补充`,url:`https://iep.utm.edu/protagor/`}]},{id:`socrates`,order:12,nameZh:`苏格拉底`,nameEn:`Socrates`,greekName:`Σωκράτης`,dates:`前 469／468—前 399`,active:`前 5 世纪后半`,places:[`雅典`,`波提狄亚`,`德利翁`],school:`苏格拉底式探问`,figureId:`socrates`,chapterIds:[`b1-11`],thesis:`哲学不是占有一套答案，而是让每个关于善、勇敢和正义的主张经受公开反诘；未经检验的信念不能可靠指导生活，承认无知则是继续探究的起点。`,evidenceCaution:`本人没有著作。阿里斯托芬、色诺芬和柏拉图提供互相冲突的形象，亚里士多德又属后见者；很难把柏拉图对话中的理念论、灵魂不朽论与历史苏格拉底逐项分开，这就是“苏格拉底问题”。`,lifeSummary:`苏格拉底是雅典公民，父亲传统上被称为石匠索弗洛尼斯科斯，母亲为助产妇斐纳瑞特。他生活在雅典帝国扩张、伯罗奔尼撒战争、寡头政变与民主复辟的连续危机中，作为重装步兵参加波提狄亚、德利翁等战役。与巡回智者不同，他长期在市场、体育场和私人场合免费交谈。前 406 年任五百人会议主席团成员时反对违法集体审判将领；前 404 年又拒绝三十僭主逮捕莱昂的命令。前 399 年被控不敬城邦诸神、引入新神灵并败坏青年，判死后拒绝逃亡，饮毒芹而死。`,timeline:[{date:`前 469／468`,place:`雅典`,title:`出生`,detail:`属于有资格服重装步兵役但并不富裕的公民家庭；具体职业与家庭细节多来自较晚传统。`,certainty:`较可靠`},{date:`前 432—前 422`,place:`波提狄亚／德利翁等地`,title:`参加伯罗奔尼撒战争`,detail:`柏拉图和色诺芬都保存其服役、耐苦与救助同伴的记载，细节带有典范化色彩。`,certainty:`较可靠`},{date:`前 406`,place:`雅典`,title:`反对违法集体审判将领`,detail:`抽签任主席团成员期间，坚持应分别审判阿吉纽西海战将领，显示其守法并不等于服从多数压力。`,certainty:`较可靠`},{date:`前 404`,place:`雅典`,title:`拒绝三十僭主命令`,detail:`寡头政府命他参与逮捕萨拉米斯的莱昂，他拒绝执行；政权很快倒台，因而未及惩罚。`,certainty:`较可靠`},{date:`前 399`,place:`雅典`,title:`受审并饮毒芹`,detail:`被判有罪后拒绝以逃亡取消自身的公共实践，在宗教节期延迟执行后于狱中死亡。`,certainty:`较可靠`}],inquiries:[{object:`德性概念与反诘`,question:`一个人自称知道勇敢、虔敬或正义时，他真的能给出不矛盾的说明吗？`,start:`公共生活充满自信判断，但举例、传统和权威并不自动构成对概念本身的认识。`,steps:[`请对话者提出一般定义`,`从其承认的案例和前提追问后果`,`暴露定义遗漏或相互矛盾`,`回到困惑而不以假答案填补`],conclusion:`反诘的直接成果常是“尚不知道”，但它清除了错误自信，并把德性从习俗口号变成必须持续论证的生活问题。`},{object:`知识、行动与灵魂照料`,question:`为什么人明知善却仍作恶；德性是否是一种知识？`,start:`人总在自己看来较好的方向行动；若选择了坏结果，可能是误判真正利益，而非清楚知道善仍纯粹选择恶。`,steps:[`把行动连接到行动者对善的判断`,`把错误行为追溯为无知或衡量失败`,`以论辩重排财富、名誉和灵魂的优先级`,`让自我检验成为持续实践`],conclusion:`照料灵魂首先是改善判断。‘无人自愿作恶’不是否认欲望冲突，而是把伦理失败的根部置于对何者真正有益的误认。`},{object:`个人良知、法律与死亡`,question:`当多数、政府命令和个人判断冲突时，哲学家应服从什么？`,start:`苏格拉底先后面对民主集会、三十僭主和陪审团；任何一方都可能作出不义决定。`,steps:[`不因多数威胁参与违法审判`,`不因寡头命令伤害无辜`,`在合法审判中公开坚持使命`,`拒绝以逃亡回报城邦的不义`],conclusion:`不能主动行不义，也不能以不义报不义；服从法律与批判公民不是简单二选一，而是要让行动能经受理性和公共责任检验。`}],concepts:[{zh:`反诘`,en:`elenchus`,definition:`从对话者自己的主张出发，通过问题检验其一致性；目标首先是揭露错误自信，不必每次给出正面学说。`},{zh:`承认无知`,en:`Socratic ignorance`,definition:`知道自己不具有所声称的智慧。它不是全面怀疑，而是区分可继续探究的问题与未经证明的自信。`},{zh:`灵魂照料`,en:`care of the soul`,definition:`使人的判断、欲望与行动趋向正义和善，优先于财富、名望及身体利益。`},{zh:`助产术`,en:`maieutic method`,definition:`柏拉图以其母亲职业作比喻：教师不把答案灌入学生，而协助其产出、检验并淘汰思想。`},{zh:`神灵征兆`,en:`daimonion`,definition:`苏格拉底自称从童年起出现、通常阻止某些行动的内在神圣信号；它不是一套可供他人服从的新宗教。`}],lineage:{inherited:`继承智者把语言、教育和城邦放到哲学中心的转向，也吸收自然哲学知识；但拒绝把论辩缩成可出售的成功工具。`,school:`没有制度化‘苏格拉底学院’。柏拉图、色诺芬、安提斯泰尼、阿里斯提卜等形成不同苏格拉底传统，分别发展理念论、犬儒主义和昔兰尼快乐论。`,influenced:`柏拉图让他成为大多数对话的主角；亚里士多德把归纳论证和一般定义追求归给他。犬儒、斯多葛和学院怀疑主义都从不同侧面认领苏格拉底。`,parallel:`孔子同样通过对话、人格示范和公共伦理影响学生，但两者的城邦制度、文本传统与对礼法的理解不同，只适合方法层比较。`},comparisons:[{target:`普罗泰戈拉`,relation:`同题比较`,shared:`哲学围绕教育、德性和公共言说展开。`,difference:`普罗泰戈拉承诺改善公民谋划；苏格拉底以反诘拒绝在未定义德性前宣称能直接传授它。`},{target:`柏拉图`,relation:`直接传承`,shared:`对话、灵魂照料及知识与善的连接。`,difference:`柏拉图发展理念、灵魂结构和理想政体；这些体系不能无条件写回没有著作的历史苏格拉底。`},{target:`第欧根尼`,relation:`后世重构`,shared:`用个人生活公开检验财富、权力和习俗。`,difference:`苏格拉底仍深度参与雅典公民秩序；犬儒派把自足和反习俗推进为身体化、跨城邦的激进实践。`},{target:`阿尔克西劳`,relation:`后世重构`,shared:`以问答清除自负，不把正面教条当作哲学终点。`,difference:`苏格拉底是否全面悬置判断并不确定；阿尔克西劳则针对斯多葛知识标准系统发展学院怀疑主义。`}],russellView:`罗素把“我们究竟知道历史苏格拉底多少”置于章节中心，比较色诺芬的保守道德家、柏拉图的哲学主角与阿里斯托芬的滑稽自然研究者。他认为相对可信的核心包括反诘、神灵征兆、德性即知识和无人自愿作恶，并赞赏其在审判中的独立，但也质疑把一切道德错误还原为知识错误。`,modernCorrection:`不能用简单的‘早期对话等于历史苏格拉底、晚期等于柏拉图’彻底解决来源问题；对话有文学目的，色诺芬和阿里斯托芬也各有体裁偏向。审判既不能只说成保守民主对自由思想的迫害，也不能只归咎于他与寡头学生的关系：宗教指控、战争创伤、公共形象和法庭策略共同作用。`,sources:[T(`第一卷第十一章〈苏格拉底〉`),{label:`Stanford Encyclopedia · Socrates`,kind:`补充`,url:`https://plato.stanford.edu/entries/socrates/`},{label:`Internet Encyclopedia of Philosophy · Socrates`,kind:`补充`,url:`https://iep.utm.edu/socrates/`}]},{id:`plato`,order:13,nameZh:`柏拉图`,nameEn:`Plato`,greekName:`Πλάτων`,dates:`前 428／427—前 348／347`,active:`前 4 世纪前半`,places:[`雅典`,`叙拉古`,`大希腊`],school:`柏拉图哲学／学院`,figureId:`plato`,chapterIds:[`b1-13`,`b1-14`,`b1-15`,`b1-16`,`b1-17`,`b1-18`],thesis:`可见世界不断变化，意见又受处境摆动；哲学必须寻找使多种事物可被共同理解和评价的稳定形式，并以灵魂教育把对善的认识连接到个人秩序与城邦秩序。`,evidenceCaution:`作品几乎全以对话写成，作者本人很少直接发言；不同对话会修正甚至批评理念、政治和知识方案。第七封信的真伪仍有争议，叙拉古政治经历的细节不能全部据此坐实。`,lifeSummary:`柏拉图出生于雅典显贵家庭，青年经历伯罗奔尼撒战争失败、三十僭主暴政、民主复辟和苏格拉底之死。传统说他原有政治抱负，却因不同政体的实际表现转向哲学。苏格拉底死后，他可能游历南意大利和西西里，接触毕达哥拉斯传统；三次叙拉古之行试图通过狄翁和狄奥尼修斯二世推进哲学教育与政治改革，结果均不理想。约前 387 年，他在雅典创办学院，形成长期研究共同体。留下的对话横跨伦理、语言、数学、知识、政治、灵魂和宇宙论，其戏剧结构本身要求读者比较立场而非只背结论。`,timeline:[{date:`前 428／427`,place:`雅典`,title:`出生于贵族家庭`,detail:`家族与雅典政治精英关系密切；“柏拉图”可能是昵称，但具体来源并不可靠。`,certainty:`较可靠`},{date:`约前 407—前 399`,place:`雅典`,title:`进入苏格拉底交往圈`,detail:`苏格拉底成为其对话写作和哲学生活的核心形象；具体相识年份由晚期传统推定。`,certainty:`推定`},{date:`前 399 后`,place:`雅典 → 大希腊／西西里`,title:`旅行与思想重组`,detail:`苏格拉底死后离开雅典，接触南意大利毕达哥拉斯传统的说法可信度较高，完整路线则难确定。`,certainty:`传统记载`},{date:`约前 387`,place:`雅典`,title:`创办学院`,detail:`学院不是近代大学式校园，而是围绕研究、讨论和长期师生关系形成的共同体，持续约九百年并多次转型。`,certainty:`较可靠`},{date:`前 367／366、前 361`,place:`叙拉古`,title:`参与叙拉古政治教育`,detail:`试图影响年轻统治者狄奥尼修斯二世并支持狄翁改革；行程较可靠，动机和责任主要依赖有争议的书信材料。`,certainty:`传统记载`}],inquiries:[{object:`知识、意见与理念`,question:`许多事物都被称为美或正义时，知识把握的是哪些个例，还是使其成为同类的共同标准？`,start:`感官对象会变化、彼此混杂，同一事物在不同关系中既美又不美；稳定定义不能只复制个例。`,steps:[`从多种个例追问共同的‘是什么’`,`区分可见的生成世界与可理解的形式`,`把理念设为定义、解释和评价的对象`,`再检验个别事物如何参与或模仿理念`],conclusion:`知识指向较稳定、可说明的形式，而意见面对可变现象；但“参与”如何成立以及理念是否无限增生，在《巴门尼德篇》等作品中被主动反思。`},{object:`灵魂、教育与正义`,question:`个人欲望、勇气与理性冲突时，怎样形成不靠偶然强制的正义？`,start:`城邦和个人都由功能不同的部分组成；若任何部分都夺取整体支配权，就产生内战式失序。`,steps:[`把城邦放大为可观察的灵魂结构`,`区分理性、意气和欲望`,`用音乐、体育、数学与辩证法重塑欲望`,`让认识善的部分统摄整体`],conclusion:`正义是各部分完成合适功能并形成秩序。哲学王方案由此把知识资格转成统治资格，也留下谁监督知识者的政治难题。`},{object:`宇宙、形式与原因`,question:`可变物质怎样呈现数学秩序和相对稳定的自然结构？`,start:`完全无序的材料不能解释几何比例、天体周期和生命结构；纯粹理念又不能单独说明生成世界。`,steps:[`以永恒模型作为秩序尺度`,`让工匠神说服必然性并安排混沌`,`用数、比例和几何体组织元素`,`把宇宙理解为具有灵魂的可见整体`],conclusion:`《蒂迈欧篇》以目的和数学形式组织自然，但明确把许多说明称为“可能的故事”；它不是现代意义的字面创世科学。`},{object:`对话、辩证法与未完成知识`,question:`如果哲学不能只靠权威传递，写作怎样让读者真正参与推理？`,start:`直接宣告结论容易产生记忆，却不能保证读者理解前提、反例和适用范围。`,steps:[`把观点分配给具有处境的角色`,`让问答暴露语言与心理阻力`,`用神话和比喻连接难以直接证明的层级`,`以无结论或内部批评把任务交还读者`],conclusion:`柏拉图并非只留下封闭体系；对话体把哲学保存为持续检验理念、生活和政治的活动。`}],concepts:[{zh:`理念`,en:`Forms / Ideas`,definition:`使多个个例可被共同定义和评价的稳定、可理解对象，如美本身、正义本身；不同对话对其地位与范围并不完全一致。`},{zh:`善的理念`,en:`Form of the Good`,definition:`知识、价值和可理解秩序的最高条件；《理想国》以太阳比喻它，却没有给出一套简单定义。`},{zh:`辩证法`,en:`dialectic`,definition:`通过问答、假设上升与概念区分寻找第一原则的活动；不是后世黑格尔式历史辩证法。`},{zh:`灵魂三分`,en:`tripartite soul`,definition:`理性、意气、欲望三种动力的结构模型，用以连接个人冲突、教育和城邦阶层。`},{zh:`哲学王`,en:`philosopher-ruler`,definition:`掌握善与整体秩序、因而被要求统治的哲学家；它把认识论与政治权威相连，也承受罗素最强烈的批评。`}],lineage:{inherited:`从苏格拉底继承概念探问与灵魂照料，从巴门尼德继承稳定可知对象，从赫拉克利特吸收感性流变，从毕达哥拉斯传统吸收数学、轮回和共同体生活。`,school:`学院持续近九百年，却经历早期柏拉图主义、学院怀疑主义和后期综合等变化；“柏拉图主义”不能被缩成一份固定教义清单。`,influenced:`亚里士多德在学院学习约二十年，既继承又批评理念分离；中期柏拉图主义、新柏拉图主义、奥古斯丁和近代数学理性主义都重新组织其资源。`,parallel:`儒家同样把教育、人格秩序和政治关联，但柏拉图依靠理念、灵魂结构和哲学知识资格，不能用“哲学王等于圣王”消除制度差异。`},comparisons:[{target:`苏格拉底`,relation:`直接传承`,shared:`对话、定义探问与灵魂优先。`,difference:`苏格拉底形象多停在反诘和无知；柏拉图发展理念、宇宙论、灵魂不朽与完整政治教育。`},{target:`普罗泰戈拉`,relation:`批评关系`,shared:`知识与教育都必须解释判断怎样被改变。`,difference:`普罗泰戈拉从具体经验和后果内部比较意见；柏拉图要求不随意见变化的理念与善作为尺度。`},{target:`亚里士多德`,relation:`直接传承`,shared:`形式、目的和理性秩序解释自然与善。`,difference:`柏拉图常把形式置于可感个体之外；亚里士多德把形式作为具体实体的结构和活动原则。`},{target:`阿尔克西劳`,relation:`后世重构`,shared:`对话经常以困惑结束，并要求检验自信。`,difference:`学院怀疑主义把这一苏格拉底面向用于全面挑战确定印象；柏拉图也提出大量正面形而上与政治方案。`}],russellView:`罗素认为柏拉图在古今哲学家中影响最大，按毕达哥拉斯、巴门尼德、赫拉克利特和苏格拉底四个来源压缩其结构。他赞赏理念论首次系统处理共相、数学与知识，却猛烈批评《理想国》把善的垄断、严格教育、审查和阶层固定结合为极权式政治。对《蒂迈欧篇》，他强调其对古代和中世纪的巨大影响，也区分严肃结构与想象细节。`,modernCorrection:`罗素把柏拉图压缩成一套稳定体系，并以二十世纪政治概念读取《理想国》，有很强启发性却会遮蔽对话的探索性、反讽和内部修正。现代研究不把所有角色发言等同于作者立场，也不默认理念论在全部作品中形式一致；叙拉古经历则说明政治兴趣真实存在，但不能反过来证明《理想国》是一份可直接执行的政纲。`,sources:[T(`第一卷第十三至十八章〈柏拉图〉`),{label:`Stanford Encyclopedia · Plato`,kind:`补充`,url:`https://plato.stanford.edu/entries/plato/`},{label:`Internet Encyclopedia of Philosophy · Plato`,kind:`补充`,url:`https://iep.utm.edu/plato/`}]},{id:`aristotle`,order:14,nameZh:`亚里士多德`,nameEn:`Aristotle of Stagira`,greekName:`Ἀριστοτέλης`,dates:`前 384—前 322`,active:`前 4 世纪中后期`,places:[`斯塔吉拉`,`雅典`,`阿索斯`,`莱斯沃斯`,`佩拉／马其顿`,`卡尔基斯`],school:`逍遥学派`,figureId:`aristotle`,chapterIds:[`b1-19`,`b1-20`,`b1-21`,`b1-22`,`b1-23`],thesis:`知识应从现象和公认意见出发，区分事物是什么、由何构成、怎样产生及为何如此；形式不必脱离个体存在，解释也不能只剩材料和碰撞。`,evidenceCaution:`现存文本多像讲义、研究记录或后期编订，不是本人准备出版的完整著作；书名、次序和部分归属由后世编辑形成。与亚历山大的教学关系确实存在，但具体内容和政治影响几乎未知。`,lifeSummary:`亚里士多德出生于马其顿边缘城邦斯塔吉拉，父亲尼各马可与马其顿王室医学传统有关。约十七岁到雅典，在柏拉图学院活动近二十年；柏拉图死后前往小亚细亚阿索斯，后与泰奥弗拉斯托在莱斯沃斯从事生物研究。前 343 年应腓力二世邀请教育少年亚历山大，影响程度难以确认。前 335 年返回雅典，在吕克昂建立研究共同体，系统收集政制、动物、诗歌和论证材料。亚历山大死后反马其顿情绪上升，他离开雅典赴卡尔基斯，次年去世。其学科划分和术语统治欧洲、伊斯兰世界与大学教育数世纪。`,timeline:[{date:`前 384`,place:`斯塔吉拉`,title:`出生`,detail:`父亲尼各马可是医生并与马其顿宫廷有关，这一背景可能促进其生物兴趣，但不能据此推出完整医学师承。`,certainty:`较可靠`},{date:`约前 367—前 347`,place:`雅典`,title:`在柏拉图学院学习研究`,detail:`约二十年持续参与学院活动，既吸收形式和目的问题，也逐渐反对把理念与个体完全分离。`,certainty:`较可靠`},{date:`前 347—前 343`,place:`阿索斯／莱斯沃斯`,title:`旅行、婚姻与生物研究`,detail:`在赫尔米阿斯政治网络中生活，迎娶皮提亚斯；与泰奥弗拉斯托研究海洋生物。`,certainty:`较可靠`},{date:`前 343 后`,place:`佩拉／马其顿`,title:`教育亚历山大`,detail:`确有受聘关系，直接授课可能只有两三年；后世关于其塑造帝国政策的说法缺少证据。`,certainty:`较可靠`},{date:`前 335—前 323`,place:`雅典`,title:`建立吕克昂研究共同体`,detail:`组织跨学科搜集、讲授和协作，后世因园中回廊称其传统为逍遥学派。`,certainty:`较可靠`},{date:`前 322`,place:`卡尔基斯`,title:`离开雅典并去世`,detail:`亚历山大死后反马其顿情绪激化，他因宗教指控风险离城，在优卑亚岛自然死亡。`,certainty:`较可靠`}],inquiries:[{object:`实体、质料与形式`,question:`具体事物既会变化又保持种类同一，解释应把何者视为基本存在？`,start:`若理念完全分离，它难以说明这匹马为何是马、怎样生长；若只剩材料，又解释不了结构和功能。`,steps:[`从具体个体而非分离理念开始`,`区分承受变化的质料与使其成为某物的形式`,`把生成理解为潜能实现`,`以实体统一属性、变化和定义`],conclusion:`首要实体是由质料与形式组成的具体个体；形式是其可说明结构和活动原则，而非另一个与个体平行的复制物。`},{object:`解释充分性与四因`,question:`说一座雕像由青铜构成，是否已经解释了它？`,start:`材料回答‘由什么’，却没有回答形状、制作者、形成过程和用途；不同研究问题需要不同原因。`,steps:[`材料因说明构成`,`形式因说明结构与定义`,`动力因说明变化来源`,`目的因说明过程趋向的完成状态`],conclusion:`充分解释要按对象组合四种原因。目的因并不总是有意识设计，而可指器官或生物发展所实现的功能。`},{object:`知识、逻辑与科学`,question:`怎样从观察和公认意见达到可证明的普遍知识？`,start:`经验给出个别事实，辩论给出共享起点；科学却要求说明为何必然如此。`,steps:[`收集现象和可信意见`,`通过分类与辩证法发现困难`,`以三段论检查推论形式`,`由真实、首要的原理演绎属性并解释原因`],conclusion:`逻辑是组织知识的工具，不替代观察；科学证明把事实置入原因结构。第一原理本身不能由无限证明链获得。`},{object:`幸福、德性与城邦`,question:`人的好生活是感受、财富，还是一种持续活动？`,start:`短暂快乐和外部财富会变化；人的独特能力是以理性组织欲望、选择和共同生活。`,steps:[`由人的功能寻找好生活标准`,`把幸福定义为合德性的活动`,`以习惯在过度与不足之间形成中道`,`让法律和城邦教育提供实践条件`],conclusion:`幸福是一生中理性能力的卓越活动，需要德性、友谊和一定外部条件；人作为政治动物，不能脱离共同体独自完成。`}],concepts:[{zh:`质料与形式`,en:`matter and form / hylomorphism`,definition:`具体实体的两个解释面向：质料提供可被组织的材料，形式使其成为这一种事物并具有相应活动能力。`},{zh:`潜能与现实`,en:`potentiality and actuality`,definition:`变化不是无中生有，而是某种能力在合适条件下实现；现实在解释上通常优先于潜能。`},{zh:`四因`,en:`four causes`,definition:`材料、形式、动力和目的四类“为什么”。它们不是互相竞争的四个事件，而是不同层次的解释问题。`},{zh:`实体`,en:`substance / ousia`,definition:`首要存在者和属性承担者。亚里士多德不同著作在具体个体、形式与本质之间调整重心。`},{zh:`中道`,en:`doctrine of the mean`,definition:`实践德性在相对于行动者和情境的过度与不足之间作合理由选择，不是机械平均或永远温和。`}],lineage:{inherited:`在柏拉图学院中形成问题框架，同时吸收前苏格拉底材料论、希波克拉底医学观察和城邦政制经验；其哲学常以整理并修正前人开始。`,school:`吕克昂／逍遥学派是协作研究共同体。泰奥弗拉斯托继承自然研究；后世亚里士多德主义经过希腊注释家、伊斯兰哲学家和拉丁经院多次重构。`,influenced:`其逻辑、形而上学、伦理、政治与自然分类构成中世纪大学课程；阿维森纳、阿威罗伊、阿奎那等以不同方式结合或批评其体系。`,parallel:`现代科学继承分类、因果与系统观察，却拒绝许多目的论物理和权威化结论；不能把亚里士多德简单称为现代经验科学家或其反面。`},comparisons:[{target:`柏拉图`,relation:`直接传承`,shared:`形式、目的、德性和知识必须构成整体解释。`,difference:`柏拉图常以分离理念提供尺度；亚里士多德让形式内在于具体实体，并从现象和分类开始。`},{target:`德谟克利特`,relation:`批评关系`,shared:`自然现象应由稳定结构和因果说明。`,difference:`德谟克利特优先用原子、虚空和碰撞；亚里士多德认为材料与动力不足以解释形式、功能和目的。`},{target:`伊壁鸠鲁`,relation:`批评关系`,shared:`伦理围绕幸福、友谊和欲望管理。`,difference:`亚里士多德把幸福理解为德性活动并需要城邦参与；伊壁鸠鲁以无痛、宁静和退出权力竞争压缩需要。`},{target:`近代科学`,relation:`后世重构`,shared:`重视观察、分类、论证和原因。`,difference:`近代科学以数学实验和可修正模型替代其许多定性目的论；阻碍常来自后世权威化，不等于本人反对观察。`}],russellView:`罗素要求从前人与后人两面看亚里士多德：相对前人，他的分类、常识和系统建设功绩巨大；相对两千年权威化的后果，他的错误又成为进步障碍。罗素赞赏其中道伦理的成熟，却批评它偏向舒适的希腊绅士；也批判奴隶制辩护、目的论物理及主谓逻辑对实体观的长期束缚。`,modernCorrection:`把亚里士多德当作一部封闭‘体系大全’会掩盖现存文本的讲义性质、内部发展和合作研究背景。罗素有时把后世经院化责任过多归给本人，也用现代形式逻辑标准低估其逻辑问题的历史广度。另一方面，生物学中的目的说明不等于每个器官由人格设计者预先制造，须与神学设计论区分。`,sources:[T(`第一卷第十九至二十三章〈亚里士多德〉`),{label:`Stanford Encyclopedia · Aristotle`,kind:`补充`,url:`https://plato.stanford.edu/entries/aristotle/`},{label:`Internet Encyclopedia of Philosophy · Aristotle`,kind:`补充`,url:`https://iep.utm.edu/aristotle/`}]},{id:`diogenes`,order:15,nameZh:`第欧根尼`,nameEn:`Diogenes of Sinope`,greekName:`Διογένης ὁ Σινωπεύς`,dates:`约前 412／404—前 323`,active:`前 4 世纪中叶`,places:[`锡诺普`,`雅典`,`科林斯`],school:`犬儒主义`,figureId:`diogenes`,chapterIds:[`b1-26`],thesis:`自由不先来自拥有更多选择，而来自减少被财富、名望、礼俗和统治者控制的需要；哲学必须通过身体训练、公开直言和可见生活证明这一点。`,evidenceCaution:`没有可靠著作传世，材料主要来自数百年后的轶事集。住桶、白日提灯、与亚历山大会面及伪造钱币等故事具有强烈象征结构；它们适合说明犬儒理想，不等于可按日期还原的履历。`,lifeSummary:`第欧根尼来自黑海南岸希腊城锡诺普，因“毁坏／重铸货币”被放逐的传统可能同时象征他重估社会价值。到雅典后据说追随苏格拉底学生安提斯泰尼，但严格师承并不确定。他把街道、市场和公共建筑变成哲学场所，以极少财物、乞食、公开身体行为和尖锐答问挑战财富、体面与城邦身份。后期与科林斯关系密切，又有被海盗卖作奴隶后教育主人子女的故事。传说亚历山大许诺满足愿望时，他只要求对方不要挡住阳光；历史真实性有限，却准确压缩了权力与自足的关系。`,timeline:[{date:`约前 412／404`,place:`锡诺普`,title:`出生`,detail:`两个常见年代均来自后世编年；父亲从事钱币或银行事务的说法与放逐故事紧密相连。`,certainty:`推定`},{date:`前 4 世纪前期`,place:`锡诺普 → 雅典`,title:`因钱币事件流亡`,detail:`‘毁坏货币’可能是真实刑事背景，也可能是犬儒派‘重估习俗价值’的传记化寓言。`,certainty:`传统记载`},{date:`前 4 世纪中叶`,place:`雅典`,title:`把公共生活变成哲学训练`,detail:`以最少用品、直言和反羞耻表演暴露礼俗如何制造依赖；具体轶事多不可独立核验。`,certainty:`传统记载`},{date:`前 323`,place:`科林斯`,title:`去世`,detail:`与亚历山大同日去世是典型的象征性编排；地点和大致时代较可能，死因众说纷纭。`,certainty:`推定`}],inquiries:[{object:`需要、习俗与自由`,question:`如果幸福依赖财富、身份和他人认可，一个人还能真正自主吗？`,start:`社会不断把非必要欲望包装成生活条件，获得越多反而需要更多保护、迎合和服从。`,steps:[`区分自然必需与习俗制造的欲望`,`通过贫困和耐苦训练减少需要`,`公开打破无害却束缚人的羞耻规则`,`以自足换取对权势直言的能力`],conclusion:`犬儒自由是低依赖结构：需要越少，外部权力可用来交换服从的筹码越少。贫困在此是主动训练，不是赞美被迫匮乏。`},{object:`哲学表达与公开生活`,question:`理论若不改变日常动作，是否真的被理解？`,start:`学院论证可能在生活方式中不留下痕迹，甚至为奢侈和权力提供更精致的辩护。`,steps:[`让身体成为最直接的反例`,`以笑话、羞辱和悖论打断习惯`,`在市场而非封闭学校教学`,`把每次与权力相遇变成自足测试`],conclusion:`第欧根尼的‘论证’常是一次可见行动：它不证明完整形而上学，却迫使旁观者比较所宣称的善与实际依赖。`}],concepts:[{zh:`自足`,en:`autarkeia / self-sufficiency`,definition:`通过压缩欲望和训练身体降低对财富、社会地位及统治者的依赖，是犬儒自由的物质基础。`},{zh:`直言`,en:`parrhēsia / frank speech`,definition:`承担风险公开说真话；不是无代价的冒犯，而是只有不依附权势者较能实践的自由。`},{zh:`训练`,en:`askēsis`,definition:`以耐寒、简食、公开羞耻测试等反复练习重塑欲望，使哲学成为身体和习惯的能力。`},{zh:`世界公民`,en:`kosmopolitēs / citizen of the world`,definition:`拒绝把价值和归属完全锁定在出生城邦；它首先是对排他身份的否定，还不是现代国际法意义的公民权。`}],lineage:{inherited:`犬儒派自称继承苏格拉底的简朴、公开审问与灵魂优先，经安提斯泰尼传统进一步把德性从理论转成生活训练。`,school:`犬儒主义没有固定校园、课程或统一教义。第欧根尼、克拉特斯等以可复制的生活姿态构成松散传统，‘犬’既是侮辱也被重新占用。`,influenced:`克拉特斯影响斯多葛创始人芝诺；自足、顺应自然、直言和世界公民观念进入斯多葛主义，也在后世修道、政治批判中被反复重构。`,parallel:`庄子式逍遥与犬儒自足都批判社会价值倒置，但犬儒更依赖公共挑衅、身体训练和希腊城邦的直言政治。`},comparisons:[{target:`苏格拉底`,relation:`后世重构`,shared:`以生活和问答揭露财富、名望与自负。`,difference:`苏格拉底仍履行公民与家庭角色；第欧根尼把无家、贫困和反礼俗推进为公开训练。`},{target:`柏拉图`,relation:`批评关系`,shared:`都认为欲望和教育决定灵魂秩序。`,difference:`柏拉图设计长期制度和知识等级；第欧根尼以最低制度依赖和当场行动检验善。`},{target:`伊壁鸠鲁`,relation:`同题比较`,shared:`减少非自然欲望以获得独立和安宁。`,difference:`伊壁鸠鲁经营稳定友谊共同体并避开公共冲突；第欧根尼主动在公共空间制造冲突以揭露习俗。`},{target:`斯多葛主义`,relation:`直接传承`,shared:`自足、顺应自然、德性足以构成自由。`,difference:`斯多葛派建立逻辑、物理和角色义务体系；犬儒派轻视体系并以激进生活作为‘通往德性的捷径’。`}],russellView:`罗素把第欧根尼写成决定像狗一样生活、拒绝习俗并以最少需要获得自由的人。他欣赏犬儒主义在亚历山大时代提供的个人独立，却也区分早期严肃训练与后来‘犬儒’一词所含的消极不信和无所作为。其叙述大量借助住桶、提灯和亚历山大轶事。`,modernCorrection:`这些轶事应作为压缩理念的表演文本，而非可逐项验证的史实。犬儒主义也不等于现代所说“认为人人自私”的犬儒心态；它有明确的德性、自然与训练标准。公开身体行为并非简单反社会，而是在重新划分什么真正可耻：欲望奴役和灵魂失调比违反礼仪更可耻。`,sources:[T(`第一卷第二十六章〈犬儒派与怀疑派〉`),{label:`Internet Encyclopedia of Philosophy · Cynics`,kind:`补充`,url:`https://iep.utm.edu/cynics/`},{label:`Diogenes Laertius · Lives, Book VI`,kind:`补充`,url:`https://en.wikisource.org/wiki/Lives_of_the_Eminent_Philosophers/Book_VI`}]},{id:`pyrrho`,order:16,nameZh:`皮浪`,nameEn:`Pyrrho of Elis`,greekName:`Πύρρων`,dates:`约前 360—前 270`,active:`前 4 世纪末至前 3 世纪初`,places:[`埃利斯`,`亚洲远征路线（传统记载）`],school:`早期皮浪主义`,figureId:`pyrrho`,chapterIds:[`b1-26`],thesis:`事物本性无法由人的判断稳定把握，因此不应匆忙断言‘它本来就是如此’；不在相反判断之间强行选边，心灵便较少被得失和恐惧扰动。`,evidenceCaution:`皮浪本人没有著作，主要经学生蒂蒙和更晚作者认识。随亚历山大到印度、遇见裸身哲人以及车来不避等故事难以核验；后期塞克斯都的皮浪主义也不能完整倒推给早期皮浪。`,lifeSummary:`皮浪来自伯罗奔尼撒西部城邦埃利斯，可能早年从事绘画。传统说他随亚历山大远征东方，接触波斯贤者与印度裸身哲人后形成不执著判断的生活方式；是否实际发生及思想影响程度都有争议。返回埃利斯后，他通过生活示范而非写作教学，学生蒂蒙以诗和散文传播其形象。城邦据说授予他祭司身份并因他免除哲学家税赋，这些荣誉传统反映其并非彻底脱离日常共同体。晚期轶事把他写成连车辆和悬崖也不躲避的人，却与“依表象生活”的怀疑实践相矛盾。`,timeline:[{date:`约前 360`,place:`埃利斯`,title:`出生`,detail:`年代由后世编年推定；早年画家身份只有晚期材料支持。`,certainty:`推定`},{date:`前 334—前 324`,place:`亚历山大远征路线`,title:`东方旅行传统`,detail:`据说随远征接触波斯和印度思想者；旅行可能有历史核心，思想借用的具体内容无法确认。`,certainty:`传统记载`},{date:`前 4 世纪末`,place:`埃利斯`,title:`以生活示范教学`,detail:`本人不写作，蒂蒙等学生用格言和诗歌保存其关于事物、态度和安宁的三问结构。`,certainty:`较可靠`},{date:`约前 270`,place:`埃利斯`,title:`去世与地方荣誉`,detail:`长寿和祭司荣誉来自传记传统；可以较稳妥确认他在故乡形成持续声望。`,certainty:`推定`}],inquiries:[{object:`事物本性与判断`,question:`相反理由势均力敌时，人凭什么断言事物自身必定如此？`,start:`感觉、习俗和哲学论证不断冲突，我们获得的是事物如何显现，而不是不带关系的本性印章。`,steps:[`比较相反表象和理由`,`不把任何一方提升为无条件本性`,`保持判断不定或不加断言`,`仍按眼前表象与生活需要行动`],conclusion:`对超出表象的本性不作确定断言。早期皮浪究竟主张‘事物本性不确定’，还是只说我们无法确定，是重要解释争议。`},{object:`悬置与安宁`,question:`为什么减少断言会减少焦虑，而不是让人无法生活？`,start:`人不只受到疼痛和损失扰动，也因坚持某物绝对善恶而增加追逐、恐惧和失望。`,steps:[`识别价值判断中的过度确信`,`让相反理由形成平衡`,`停止强迫思想作最终裁决`,`依表象、习惯和即时能力处理生活`],conclusion:`悬置判断之后可能意外出现不动心。安宁不是先被证明的宇宙真理，而是放松教条执着后的实践结果。`}],concepts:[{zh:`悬置判断`,en:`epochē / suspension of judgment`,definition:`在理由无法决定时不肯定也不否定事物本性；它不是停止感知、说话或采取日常行动。`},{zh:`不动心`,en:`ataraxia / tranquility`,definition:`不被相反判断和对绝对得失的执着持续扰动；后期皮浪主义把它描述为悬置之后如影随形的结果。`},{zh:`表象`,en:`phainomena / appearances`,definition:`事物当下如何呈现。怀疑者可以承认‘蜂蜜显得甜’，而不进一步断言蜂蜜本性绝对甜。`},{zh:`无定性`,en:`indeterminacy`,definition:`早期证言中事物被说成无差别、不稳定或不可判定；究竟是世界属性还是人的认识处境仍有争议。`}],lineage:{inherited:`可能受德谟克利特关于安宁、智者与苏格拉底对判断限度的讨论影响；东方旅行提供比较背景，但不能凭相似性直接证明佛教来源。`,school:`皮浪没有建立正式学校。蒂蒙保存其形象；后来的埃奈西德穆和塞克斯都在数世纪后系统化论证模式，形成我们更熟悉的皮浪主义。`,influenced:`塞克斯都著作经文艺复兴重见后影响蒙田、笛卡尔、休谟等近代认识论；这种影响更多来自后期皮浪主义而非皮浪本人残篇。`,parallel:`学院怀疑主义同样悬置判断，却主要在柏拉图学院内部批判斯多葛知识标准；早期皮浪更突出生活姿态和安宁。`},comparisons:[{target:`阿尔克西劳`,relation:`同题比较`,shared:`拒绝在缺乏决定性标准时给表象完全同意。`,difference:`皮浪传统以安宁和依表象生活为核心；阿尔克西劳以苏格拉底辩证法专门挑战斯多葛认知印象。`},{target:`卡尔内阿德`,relation:`同题比较`,shared:`悬置确定断言仍须说明行动如何可能。`,difference:`卡尔内阿德发展有层级的可信印象供实践审查；早期皮浪材料更强调不执著及生活结果。`},{target:`伊壁鸠鲁`,relation:`同题比较`,shared:`哲学以解除恐惧、取得宁静为生活目标。`,difference:`伊壁鸠鲁以原子论和感觉标准建立正面教义；皮浪不以另一套自然学填补不确定性。`},{target:`佛教哲学`,relation:`后世重构`,shared:`旅行传统与不执著、安宁之间存在可比较线索。`,difference:`直接传播证据不足，佛教的缘起、无我和解脱体系也不能压缩为希腊式悬置判断。`}],russellView:`罗素沿袭传统叙事，称皮浪随亚历山大到东方并在埃利斯建立怀疑传统。他把核心写成：没有充分理由偏好一种判断，聪明人因此避免信念、依习俗生活，并从无信念中获得安宁。罗素把这种方案视作希腊化不安全时代的‘抗焦虑药’，同时质疑彻底怀疑能否一贯表达。`,modernCorrection:`“朋友必须把他从马车前拖走”与依表象生活明显冲突，更像哲人传奇。现代研究还区分早期皮浪与后期皮浪主义：皮浪可能提出了关于事物无定性的正面看法，未必已经采用塞克斯都式不对任何本性作断言的纯探究立场。东方影响值得比较，但不能由一次旅行故事直接坐实。`,sources:[T(`第一卷第二十六章〈犬儒派与怀疑派〉`),{label:`Stanford Encyclopedia · Ancient Skepticism`,kind:`补充`,url:`https://plato.stanford.edu/entries/skepticism-ancient/`},{label:`Internet Encyclopedia of Philosophy · Pyrrho`,kind:`补充`,url:`https://iep.utm.edu/pyrrho/`}]},{id:`arcesilaus`,order:17,nameZh:`阿尔克西劳`,nameEn:`Arcesilaus`,greekName:`Ἀρκεσίλαος`,dates:`前 316／315—前 241／240`,active:`约前 268—前 241 领导学院`,places:[`皮塔内`,`雅典`],school:`学院怀疑主义`,figureId:`arcesilaus`,chapterIds:[`b1-26`],thesis:`没有任何印象能仅凭自身保证它不可能来自虚假对象；理性因而要求停止把表象批准为确定真理，但行动仍可依据在处境中显得合理的方案进行。`,evidenceCaution:`本人没有著作，观点主要从西塞罗、塞克斯都和普鲁塔克等后世材料重建。许多论证可能是针对斯多葛前提的辩证反驳，而非阿尔克西劳自己肯定的教义。`,lifeSummary:`阿尔克西劳出生于小亚细亚爱奥利斯的皮塔内，青年到雅典，先后接触数学家奥托吕科斯、吕克昂和柏拉图学院传统。约前 268／266 年成为学院主持者，使学院从正面形而上教学转向以苏格拉底式问答检验同时代学派。主要对手是芝诺及早期斯多葛派：他们认为某些“认知印象”以自身清晰结构保证真实，智者可以据此获得知识。阿尔克西劳通过梦、疯狂、相似对象等案例指出真印象可能有不可区分的假对应物。他不写书，使教学保持为现场辩论，也让后世难以区分其真实立场和策略性反驳。`,timeline:[{date:`前 316／315`,place:`皮塔内`,title:`出生`,detail:`来自较富裕家庭的传统较可信；早年学画或诗歌等细节属于后世传记。`,certainty:`较可靠`},{date:`前 3 世纪初`,place:`雅典`,title:`进入学院知识网络`,detail:`先在吕克昂及其他教师处学习，后转入学院，形成以柏拉图对话中的苏格拉底为核心的方法。`,certainty:`传统记载`},{date:`约前 268／266`,place:`雅典`,title:`主持柏拉图学院`,detail:`学院由此进入所谓中期学院或怀疑时期，持续与斯多葛、伊壁鸠鲁认识论辩论。`,certainty:`较可靠`},{date:`前 241／240`,place:`雅典`,title:`去世`,detail:`关于酗酒致死的传闻带有敌对学派诋毁色彩；卒年较确定，死因不明。`,certainty:`较可靠`}],inquiries:[{object:`真理标准与认知印象`,question:`一种印象能否仅凭自身，让人确定它绝不可能由假对象造成？`,start:`斯多葛派要求只同意具有真理保证的认知印象，以此区分知识与意见。`,steps:[`寻找与真印象现象上相同的假印象`,`使用梦、幻觉和相似对象检验标准`,`指出当事人无法从印象内部辨别来源`,`拒绝给予任何印象不可撤回的同意`],conclusion:`若没有无假对应物的印象，斯多葛标准无法完成认证；悬置判断是遵守严格理性标准的结果，而非讨厌知识。`},{object:`无信念行动`,question:`如果不肯定任何印象为真，为什么还能出门、选择和承担责任？`,start:`对手认为行动需要先同意‘这件事应当做’，全面悬置会让人像植物一样不动。`,steps:[`区分出现印象与批准其为真`,`承认多个行动方案会呈现于理性思考`,`依‘合理者’比较处境和后果`,`行动而不把选择升级为不可错知识`],conclusion:`怀疑者可按合理表象行动。可行动性不要求形而上确定性，只要求保留感知、思考和比较能力。`}],concepts:[{zh:`认知印象`,en:`kataleptic impression`,definition:`斯多葛派设想的真理印象：源自真实对象，并具有不可能来自虚假对象的呈现方式；阿尔克西劳攻击其可识别性。`},{zh:`全面悬置`,en:`universal epochē`,definition:`不对任何印象作确定真理的同意；它是否为阿尔克西劳的正面主张，还是辩证结果，仍有争议。`},{zh:`合理者`,en:`eulogon / the reasonable`,definition:`在没有确定知识时指导行动的可辩护表象或方案，不等于已被断言为真实。`},{zh:`辩证反驳`,en:`dialectical argument`,definition:`暂取对手前提，展示其导致矛盾或无法达到目标；论证结论不必是怀疑者自己的教义。`}],lineage:{inherited:`重新突出柏拉图对话中的苏格拉底审问者，而非理念体系建构者；也继承学院内部对知识、意见和假设的长期区分。`,school:`他开启学院怀疑主义。其方法被卡尔内阿德发展，后由克利托马科、西塞罗等以不同程度的可错论解释传播。`,influenced:`迫使斯多葛派反复修订认知印象和同意理论；通过西塞罗《学园派论》影响奥古斯丁及近代怀疑论语汇。`,parallel:`皮浪主义同样悬置，却不依附学院—斯多葛争论，并更明确把宁静列为实践结果。`},comparisons:[{target:`苏格拉底`,relation:`后世重构`,shared:`通过问答检验他人自信，拒绝假装拥有智慧。`,difference:`阿尔克西劳把方法用于系统攻击希腊化知识标准，并提出悬置后的行动问题。`},{target:`斯多葛芝诺`,relation:`批评关系`,shared:`同意应受理性控制，未经认证的意见会导致错误。`,difference:`芝诺认为某些印象可自证真实；阿尔克西劳认为真假印象可能不可区分，因而应悬置。`},{target:`皮浪`,relation:`同题比较`,shared:`不把出现于心的表象直接升级为事物本性。`,difference:`皮浪传统以宁静和生活示范为中心；阿尔克西劳以学院辩证法和认识标准之争为中心。`},{target:`卡尔内阿德`,relation:`直接传承`,shared:`反对斯多葛确定印象，并须回应不行动反驳。`,difference:`阿尔克西劳用‘合理者’保持行动；卡尔内阿德细化为可说服、无冲突并经检查的层级标准。`}],russellView:`罗素把阿尔克西劳视为学院转向怀疑主义的关键人物，强调他复活苏格拉底式无知，以相反论证破坏斯多葛关于确定知识的自信。罗素的整体叙述把学院怀疑看作不安全时代中哲学由世界体系退向心理防御的一部分。`,modernCorrection:`不能简单说他‘知道一切不可知’，因为许多否定句可能只是从对手前提推出。现代研究尤其重视行动论：阿尔克西劳并非让人自动响应刺激，而是保留理性比较，只拒绝把选择当成已认证真理。其方法是一种严格探究伦理，而不仅是消极怀疑。`,sources:[T(`第一卷第二十六章〈犬儒派与怀疑派〉`),{label:`Stanford Encyclopedia · Ancient Skepticism`,kind:`补充`,url:`https://plato.stanford.edu/entries/skepticism-ancient/`},{label:`Internet Encyclopedia of Philosophy · Academic Skepticism`,kind:`补充`,url:`https://iep.utm.edu/ancient-greek-skepticism/`}]},{id:`carneades`,order:18,nameZh:`卡尔内阿德`,nameEn:`Carneades of Cyrene`,greekName:`Καρνεάδης`,dates:`前 214／213—前 129／128`,active:`前 2 世纪中叶`,places:[`昔兰尼`,`雅典`,`罗马`],school:`学院怀疑主义`,figureId:`carneades`,chapterIds:[`b1-26`],thesis:`确定无误的认知标记不可获得，但实践不必因此停摆；印象可以按说服力、与其他印象的一致及经受检查的程度分层，重要行动应接受更严格审查。`,evidenceCaution:`本人没有写作，主要通过学生克利托马科、西塞罗和塞克斯都重建。我们不确定“可信印象”只是辩证回应，还是他自己的可错认识论；在罗马连续为正义正反演说的具体内容也经后世塑形。`,lifeSummary:`卡尔内阿德出生于北非希腊城市昔兰尼，后在雅典学习并成为学院主持者。他延续阿尔克西劳对斯多葛知识标准的批评，却更细致地说明无确定知识时怎样合理行动。前 155 年，他与斯多葛派第欧根尼、逍遥派克里托劳斯组成雅典使团前往罗马，处理罚款争议。传统说他第一天赞美正义、第二天用同样力量反驳，震动罗马青年并促使老加图要求使团尽快离开。故事即使经过修饰，也显示希腊辩证训练进入罗马政治文化的历史节点。`,timeline:[{date:`前 214／213`,place:`昔兰尼`,title:`出生`,detail:`北非希腊城市拥有数学、修辞和哲学传统；早年学习路线主要来自晚期传记。`,certainty:`较可靠`},{date:`前 2 世纪中叶`,place:`雅典`,title:`主持学院并发展或然标准`,detail:`持续攻击斯多葛认知印象，使用相似物、疯狂和梦等案例，并把实践依据细分为三个审查层级。`,certainty:`较可靠`},{date:`前 155`,place:`罗马`,title:`参加哲学家使团`,detail:`使团本身可靠；连续为正义正反演说及加图反应的细节可能经道德化叙述。`,certainty:`较可靠`},{date:`前 129／128`,place:`雅典`,title:`去世`,detail:`晚年失明等记载有一定传统支持；思想主要由从未完全确定老师立场的克利托马科保存。`,certainty:`较可靠`}],inquiries:[{object:`相似表象与确定知识`,question:`如果两个鸡蛋、两粒沙甚至真幻觉看起来完全相同，表象能自带真理保证吗？`,start:`斯多葛派要求认知印象具有无法由假对象产生的特征；现实中极近相似物却可能给任何观察者同样呈现。`,steps:[`寻找不可区分的相似对象`,`比较正常、梦境和疯狂状态下的行动`,`切断清晰感与真实来源的必然联系`,`要求知识标准承担无法完成的自我认证`],conclusion:`表象的鲜明或驱动力不足以保证真实。人仍可判断其可信程度，但不应把心理确信等同于不可错知识。`},{object:`可信印象与实践审查`,question:`没有确定知识，重要行动怎样避免任意和瘫痪？`,start:`日常选择不可能等到绝对证明；但风险越高，单一第一印象越不够。`,steps:[`普通事务依有说服力的印象`,`重要事务检查周围印象是否冲突`,`关乎幸福时进行全面反复审查`,`只给予暂时认可，不声称把握本性`],conclusion:`可信度是分层程序而非真理印章。像暗处辨认绳与蛇，应靠光线、触探和关系检查提高可行动的可靠性。`},{object:`正义、政治与相反论证`,question:`一个国家称为正义的规则，是普遍原则还是自身利益的合理化？`,start:`帝国、城邦和个人常在利益变化时改变正义语言，却宣称遵守同一普遍标准。`,steps:[`先重建支持自然正义的最强论证`,`再以国家利益和历史实践提出反例`,`展示权威理论未完成证明`,`将结论保持为对确信的检验而非赞美不义`],conclusion:`正反演说的目的不是自动证明正义不存在，而是迫使政治主张暴露前提、代价和自利结构。`}],concepts:[{zh:`可信印象`,en:`pithanē phantasia / persuasive impression`,definition:`足以在实践中说服人的表象；它提供可行动理由，但不保证对象在本性上确实如此。`},{zh:`无冲突印象`,en:`undiverted impression`,definition:`与周围相关表象没有张力的可信印象，是比单一第一印象更高的审查层级。`},{zh:`充分检查`,en:`thoroughly explored impression`,definition:`在重要问题中逐项核验相关条件、替代解释和反例后仍保持说服力的印象。`},{zh:`暂时认可`,en:`approval`,definition:`按可信印象行动，但不作斯多葛式‘实际为真’的完全同意；是否构成较弱信念，古今均有争议。`}],lineage:{inherited:`继承阿尔克西劳的学院辩证法和对斯多葛认知印象的攻击，也回到柏拉图对知识与意见、假设与证明的区分。`,school:`属于学院怀疑主义成熟期。克利托马科把他解释为仍全面悬置，斐洛则允许暂时信念，显示其遗产内部已经分裂。`,influenced:`西塞罗用拉丁语把可信性转译为 probabile 与 veri simile，成为古代怀疑主义进入罗马和近代可错论的重要桥梁。`,parallel:`现代概率判断同样按证据更新可信度，但卡尔内阿德没有数学概率模型；他的‘或然’首先是实践审查和反教条工具。`},comparisons:[{target:`阿尔克西劳`,relation:`直接传承`,shared:`反对可自证的认知印象，并以合理实践回答不行动指控。`,difference:`卡尔内阿德把实践标准细分为说服力、一致性和充分检查，较接近可错认识论。`},{target:`皮浪`,relation:`同题比较`,shared:`不把表象直接断言为事物本性。`,difference:`皮浪传统突出悬置后的宁静；卡尔内阿德服务于学院内部认识论与公共论证，安宁不是核心目标。`},{target:`斯多葛主义`,relation:`批评关系`,shared:`行动要区分未经检验的冲动与理性认可。`,difference:`斯多葛派追求保证真实的认知印象；卡尔内阿德只允许经层级检查后仍可错的实践依据。`},{target:`现代可错论`,relation:`后世重构`,shared:`合理相信不要求不可错，重要结论需要更强证据。`,difference:`现代可错论通常仍肯定知识和信念；卡尔内阿德是否允许真正信念，取决于对其学生证言的解释。`}],russellView:`罗素最突出卡尔内阿德前 155 年在罗马的使团和正反两场正义演说，把它视为希腊怀疑论冲击罗马传统道德的戏剧性时刻。他也注意到学院派以或然性指导生活，但更倾向把整个怀疑传统解释为宏大公共信念衰落后的个人安稳方案。`,modernCorrection:`正反演说不能直接证明卡尔内阿德反对正义；更可能是展示柏拉图和亚里士多德式自然正义尚未获得决定性论证。其可信标准不是‘哪边票多就信哪边’，而是随风险增加审查强度。把它叫概率论会过度现代化，把它叫全面无信念又会忽略暂时认可的复杂性。`,sources:[T(`第一卷第二十六章〈犬儒派与怀疑派〉`),{label:`Stanford Encyclopedia · Ancient Skepticism`,kind:`补充`,url:`https://plato.stanford.edu/entries/skepticism-ancient/`},{label:`Internet Encyclopedia of Philosophy · Academic Skepticism`,kind:`补充`,url:`https://iep.utm.edu/ancient-greek-skepticism/`}]},{id:`epicurus`,order:19,nameZh:`伊壁鸠鲁`,nameEn:`Epicurus`,greekName:`Ἐπίκουρος`,dates:`前 341—前 270`,active:`前 4 世纪末至前 3 世纪前期`,places:[`萨摩斯`,`米蒂利尼`,`兰普萨库斯`,`雅典`],school:`伊壁鸠鲁主义`,figureId:`epicurus`,chapterIds:[`b1-27`],thesis:`幸福不是不断增加强烈刺激，而是消除身体疼痛和心灵扰动；原子论、死亡分析、欲望分类、友谊与正义契约共同把恐惧降到最低。`,evidenceCaution:`据说写作三百余卷，大部分失传；主要依靠第欧根尼·拉尔修保存的书信和格言、赫库兰尼姆纸草及卢克莱修。原子偏斜在存世本人文本中未直接出现，其具体功能与归属仍有争议。`,lifeSummary:`伊壁鸠鲁生于萨摩斯岛的雅典移民家庭，十八岁到雅典履行公民兵役。家庭被逐出萨摩斯后，他在小亚细亚多地生活，约前 311 年在米蒂利尼开始教学，后在兰普萨库斯形成稳定朋友圈。前 306 年回雅典购置“花园”，建立接纳妇女和奴隶的共同体，以简朴饮食、友谊、写作和共同学习实践哲学。他并非纵欲享乐者，而把最高快乐定义为身体无痛与心灵宁静。前 270 年因长期结石或泌尿疾病去世，临终书信称身体剧痛仍被回忆哲学交谈的快乐抵消。`,timeline:[{date:`前 341`,place:`萨摩斯`,title:`出生于雅典移民家庭`,detail:`父母是雅典公民，定居萨摩斯；后世关于贫困和母亲巫术活动的说法常带有敌对宣传。`,certainty:`较可靠`},{date:`前 323—前 321`,place:`雅典／小亚细亚`,title:`服役与家庭迁移`,detail:`十八岁赴雅典履行兵役；雅典移民随后被马其顿方面逐出萨摩斯，家庭转居科洛封。`,certainty:`较可靠`},{date:`约前 311—前 307`,place:`米蒂利尼／兰普萨库斯`,title:`教学并形成朋友圈`,detail:`米蒂利尼教学受挫后转往兰普萨库斯，结识赫尔马科斯、梅特罗多罗斯等终身伙伴。`,certainty:`较可靠`},{date:`前 306`,place:`雅典`,title:`建立花园学派`,detail:`购买城内住宅与花园，形成以友谊、共同学习和低欲望生活为核心的长期共同体。`,certainty:`较可靠`},{date:`前 270`,place:`雅典`,title:`在长期病痛中去世`,detail:`临终书信与遗嘱保存较好，安排共同体延续、朋友家属和奴隶解放，体现哲学与制度生活结合。`,certainty:`较可靠`}],inquiries:[{object:`自然、神与恐惧`,question:`雷电、疾病和天象若被解释为神罚，人怎样获得稳定生活？`,start:`未知自然过程被人格化后，每个偶然事件都可能成为神意警告，制造无法证伪的焦虑。`,steps:[`以原子和虚空解释自然`,`允许同一遥远天象有多个不违经验的自然说明`,`肯定神若完满便不忙于惩罚人`,`把自然研究服务于消除迷信恐惧`],conclusion:`神可以存在，但不管理世界；自然事件不含针对个人的惩罚意图。物理学的治疗目标比争夺唯一遥远天象模型更重要。`},{object:`死亡、灵魂与感觉`,question:`死亡为什么不应被当作人生中最大的恶？`,start:`一切善恶经验都以感觉为条件；灵魂同样由细微原子组成，随身体解散。`,steps:[`说明灵魂是身体性的复合物`,`死亡使感觉能力终止`,`活着时死亡尚未来，死亡到来时主体已不在`,`排除死后惩罚与永恒缺失体验`],conclusion:`死亡对我们不是可被感受的恶。应处理的是当下对死亡的想象性恐惧，而非追求不可能的个人永存。`},{object:`快乐、欲望与选择`,question:`若快乐是善，为什么不应追逐每一种强烈快乐？`,start:`某些快乐带来更大后痛，某些暂时痛苦换来长期健康；单次强度不是可靠尺度。`,steps:[`把快乐理解为痛苦和扰动的消除`,`区分自然且必要、自然不必要与空洞欲望`,`比较选择的长期后果`,`让审慎统摄饮食、名望、权力和情欲`],conclusion:`最高快乐是无痛和宁静的稳定状态。面包、水和可靠朋友常比奢侈更有效，因为它们满足需要而不制造新的依赖。`},{object:`友谊、正义与共同生活`,question:`以个人快乐为目标，为什么还要忠诚、正义并为朋友承担痛苦？`,start:`孤立个体持续担心伤害、背叛和权力变化；安全感本身依赖可信关系。`,steps:[`以互不伤害契约界定正义`,`让法律有效性随共同利益条件变化`,`通过长期忠诚把朋友变成安全世界`,`在花园制度中实践照顾、记忆与教育`],conclusion:`审慎、正义和友谊不是牺牲快乐的外在义务，而是稳定快乐的构成条件；贤者甚至可为朋友承受风险。`}],concepts:[{zh:`无痛`,en:`aponia`,definition:`身体没有疼痛的稳定状态，是快乐的极限之一；它不同于持续寻求强烈感官刺激。`},{zh:`心灵宁静`,en:`ataraxia`,definition:`摆脱对神、死亡、未来和无限欲望的扰动；通过自然知识、欲望管理和友谊共同获得。`},{zh:`欲望分类`,en:`classification of desires`,definition:`自然且必要、自然但非必要、空洞欲望三类；分类帮助把有限需要与名望权力等无终点追逐分开。`},{zh:`原子偏斜`,en:`atomic swerve / clinamen`,definition:`原子在无固定时地发生的最小偏移，用于解释碰撞并可能为自主行动留出空间；本人现存文本未直接保存。`},{zh:`互不伤害契约`,en:`compact neither to harm nor be harmed`,definition:`正义不是脱离共同体的永恒实体，而是在具体条件下保障相互安全的协议和制度。`}],lineage:{inherited:`采用德谟克利特原子论，却让自然研究明确服务于解除恐惧；也在希腊伦理关于快乐、审慎和友谊的争论中形成独立方案。`,school:`花园既是学派也是生活共同体，保存创始人文本和纪念实践，教义稳定性较强。成员包括妇女、奴隶和外来者，虽不能等同现代平等制度，却突破学院常规。`,influenced:`卢克莱修用拉丁诗系统传播其自然和治疗方案；赫库兰尼姆的菲洛德穆发展修辞、音乐与情绪治疗。近代唯物论和世俗伦理多次重读他。`,parallel:`斯多葛主义同样治疗恐惧并重视判断，却以宇宙理性和德性为唯一善；伊壁鸠鲁则以快乐、原子偶然性和低政治参与建立安宁。`},comparisons:[{target:`德谟克利特`,relation:`直接传承`,shared:`原子、虚空、灵魂身体性和非神意自然。`,difference:`伊壁鸠鲁加入偏斜传统，更强调感觉标准，并把物理学系统服务于无恐惧生活。`},{target:`亚里士多德`,relation:`批评关系`,shared:`幸福需要审慎、友谊和长期活动，不等于瞬间快感。`,difference:`亚里士多德以德性活动和城邦参与为核心；伊壁鸠鲁以无痛宁静和退出权力竞争降低风险。`},{target:`皮浪`,relation:`同题比较`,shared:`最终目标包含心灵宁静。`,difference:`皮浪传统通过悬置教条达到宁静；伊壁鸠鲁肯定原子论、感觉标准和欲望分类等明确教义。`},{target:`卢克莱修`,relation:`直接传承`,shared:`原子自然学、灵魂有死、神不干预和消除死亡恐惧。`,difference:`卢克莱修用拉丁史诗、罗马政治危机和强烈意象重新组织学说，诗歌形式本身成为治疗工具。`}],russellView:`罗素纠正了把伊壁鸠鲁误解为纵欲者的常见看法，突出无痛、宁静、简食和友谊。他认为伊壁鸠鲁只因自然解释能消除迷信才关心科学，甚至允许对遥远天象并列多种说明；又认为死亡论虽有逻辑力量，却难完全战胜本能恐惧。整体评价夹杂尊重与对其退避公共世界的保留。`,modernCorrection:`物理学并非随意编造：多重解释仍必须与感觉和基本原理相容。‘退出政治’也不是完全隔绝社会，花园本身具有制度、书信网络、正义契约和照顾实践。把快乐只译成消极无痛会低估记忆、交谈和友谊的积极愉悦；把偏斜直接等同现代自由意志或量子随机同样过度。`,sources:[T(`第一卷第二十七章〈伊壁鸠鲁派〉`),{label:`Stanford Encyclopedia · Epicurus`,kind:`补充`,url:`https://plato.stanford.edu/entries/epicurus/`},{label:`Internet Encyclopedia of Philosophy · Epicurus`,kind:`补充`,url:`https://iep.utm.edu/epicur/`}]},{id:`lucretius`,order:20,nameZh:`卢克莱修`,nameEn:`Titus Lucretius Carus`,greekName:`Titus Lucretius Carus`,dates:`约前 99／94—前 55／54`,active:`前 1 世纪中叶`,places:[`罗马共和国（具体出生地不明）`],school:`罗马伊壁鸠鲁主义`,figureId:`lucretius`,chapterIds:[`b1-27`],thesis:`诗歌以感性图像把不可见的原子世界变成可理解经验：理解身体、灵魂、宇宙和文明的自然原因，能够拆除宗教恐惧、死亡恐惧与无止境欲望。`,evidenceCaution:`生平几乎空白，唯一同期外部材料是西塞罗前 54 年书信对诗作的简评。爱情药致疯、自杀和西塞罗整理遗稿的故事来自数百年后的哲罗姆，可信度很低；《物性论》似未完成最终修订。`,lifeSummary:`卢克莱修生活在罗马共和国晚期内战和政治失序的前一世纪中叶，具体出生地、阶层与社交圈都不确定。他把六卷拉丁长诗《物性论》献给罗马贵族盖乌斯·孟米乌斯，以伊壁鸠鲁自然学治疗宗教与死亡恐惧。西塞罗前 54 年致弟昆图斯的信称该诗兼具才华与技艺，这是唯一接近同时代的外部见证。诗中前后提纲重复、卷次调整痕迹和未兑现承诺显示作者可能未及最后修订。维吉尔、贺拉斯和奥维德很快吸收其语言；中世纪传抄稀少但未完全失传，十五世纪手稿发现使其成为近代原子论的重要古代资源。`,timeline:[{date:`约前 99／94`,place:`罗马共和国`,title:`出生`,detail:`哲罗姆提供的两个年龄方案与卒年互有冲突；姓名显示罗马公民身份，其他家庭信息未知。`,certainty:`推定`},{date:`前 60—前 55 前后`,place:`罗马共和国`,title:`写作《物性论》`,detail:`六卷诗从原子虚空推进到灵魂、感觉、宇宙与文明，写作背景是共和国政治动荡。`,certainty:`较可靠`},{date:`前 54`,place:`罗马`,title:`西塞罗书信提及诗作`,detail:`西塞罗同意弟弟对卢克莱修诗才与技艺的赞赏，证明作品当时已在精英圈阅读。`,certainty:`较可靠`},{date:`约前 55／54`,place:`地点不明`,title:`去世与未完成修订`,detail:`早逝可解释文本修订痕迹，但疯癫、自杀和爱情药故事与早期接受不符。`,certainty:`推定`},{date:`1417`,place:`德意志修道院网络`,title:`手稿重新进入人文主义传播`,detail:`波焦发现一份手稿并非作品从零‘复活’，而是使此前稀少的传本快速进入印刷和近代思想网络。`,certainty:`较可靠`}],inquiries:[{object:`不可见自然与可见证据`,question:`原子和虚空看不见，为什么仍可成为合理解释？`,start:`风和气也不可被眼睛直接看见，却以树木弯折、触感和运动显现效果；不可见不等于无证据。`,steps:[`从无中不能生有、存在不能归无开始`,`由运动需要间隔推出虚空`,`由复合物可毁而自然不耗尽推出不灭原子`,`用宏观规律反推微观结构`],conclusion:`原子理论通过可见后果、解释统一性和对竞争材料论的反驳获得支持；诗的比喻承担从经验到不可见结构的桥梁。`},{object:`灵魂、死亡与治疗`,question:`怎样让‘死亡没有感觉’不只是一句抽象安慰？`,start:`人把自己想象成死后仍在场的旁观者，因而哀悼永远失去未来或担心地下惩罚。`,steps:[`证明灵魂与身体相互依赖且同为原子复合物`,`列举灵魂不能独立存活的论证`,`用出生前的无感与死后对称`,`把地狱刑罚解释为今生欲望和恐惧的投射`],conclusion:`主体随复合体解散，不会经验自身缺席。自然知识借诗歌反复练习，才可能把逻辑结论转化为情绪习惯。`},{object:`原子偏斜、因果与行动`,question:`若原子只平行下落或一切都由先前运动锁定，碰撞和自主行动如何开始？`,start:`完全相同速度的直线下落不能相遇；无穷因果链又似乎不给行动者留下发起运动的空间。`,steps:[`设定无固定时间地点的最小偏斜`,`让原子产生碰撞和复合`,`把动物意愿作为独立行动事实`,`拒绝把偏斜直接当成随机决定每个选择`],conclusion:`偏斜为自然形成与能动性提供非严格决定的余地，但它怎样与成熟心理选择连接，文本没有给出完整机制。`},{object:`文明、宗教与自然史`,question:`语言、法律和宗教是否必须来自神授或一次设计？`,start:`世界并不特别适合人类，新生儿脆弱，农业艰难；这与为人类预制的完美设计不符。`,steps:[`从早期人类适应环境和共同防御开始`,`让语言由反应和使用逐渐形成`,`以互不伤害需要产生法律`,`把天象恐惧与权力经验投射为神罚`],conclusion:`文明是无预定蓝图的累积过程，既带来技艺与合作，也不断制造战争、奢侈和新的恐惧。`}],concepts:[{zh:`《物性论》`,en:`De rerum natura / On the Nature of Things`,definition:`六卷拉丁哲学史诗，以原子自然学完成从宇宙、灵魂到文明和疾病的治疗性课程。`},{zh:`物象薄膜`,en:`simulacra`,definition:`物体不断发出的极薄原子膜，保留外形并作用于眼睛或心灵，用于解释视觉、梦和想象。`},{zh:`原子偏斜`,en:`clinamen / atomic swerve`,definition:`原子运动中的最小无定时偏移，使碰撞可能并为能动性讨论留下空间。`},{zh:`死亡对称论证`,en:`symmetry argument`,definition:`出生前的无感觉并不使我们痛苦，死亡后的无感觉也不应被想象成主体持续承受的损失。`},{zh:`蜜糖与苦艾`,en:`honeyed cup`,definition:`诗歌如杯缘的蜜，使读者愿意服下起初苦涩的自然哲学；形式不是装饰，而是情绪治疗的技术。`}],lineage:{inherited:`公开把伊壁鸠鲁称为解放人类的导师，并通过其传统继承德谟克利特原子论；拉丁史诗形式又与恩尼乌斯等罗马诗歌传统对话。`,school:`属于罗马伊壁鸠鲁主义，却不是简单翻译。诗的结构、共和国处境、拉丁术语创新和宏大自然意象构成独立哲学表达。`,influenced:`维吉尔、贺拉斯、奥维德及后世拉丁诗吸收其语言；文艺复兴后影响伽桑狄、近代原子论、宗教批判和自然主义文学。`,parallel:`现代科普同样用可视比喻连接不可见模型和公众理解，但卢克莱修的目标还包括灵魂训练与生活解放，不只传播事实。`},comparisons:[{target:`伊壁鸠鲁`,relation:`直接传承`,shared:`原子、虚空、感觉标准、神不干预和死亡不应恐惧。`,difference:`伊壁鸠鲁以书信、格言和共同体教学；卢克莱修以拉丁史诗、强烈意象和罗马历史经验完成传播。`},{target:`德谟克利特`,relation:`后世重构`,shared:`复合物由不灭原子在虚空中形成，感觉性质属于结构互动。`,difference:`卢克莱修继承伊壁鸠鲁的偏斜和治疗伦理，不再以纯粹必然性描述全部运动。`},{target:`柏拉图`,relation:`批评关系`,shared:`哲学必须改变灵魂对死亡和善的理解。`,difference:`柏拉图以灵魂不朽和理念提升生命；卢克莱修以灵魂有死和自然原因消除超自然恐惧。`},{target:`现代自然主义`,relation:`后世重构`,shared:`用非神意因果解释宇宙、心灵和文明。`,difference:`其原子、感觉薄膜和宇宙模型不是现代实验科学，近代接受也常选择性改造而非直接延续。`}],russellView:`罗素主要借卢克莱修让伊壁鸠鲁主义获得最有力的声音，大段引用其赞颂理性突破宗教壁垒、证明灵魂有死和描写原子世界的诗句。他认为卢克莱修的热情、想象和道德严肃超过学派创始人，也把他视作古代少数彻底反迷信的伟大诗人。`,modernCorrection:`爱情药、间歇疯癫和自杀不能当作解释作品强度的心理事实，西塞罗‘编辑遗稿’也未获同期证据。《物性论》并非把科学包上甜美外衣：比喻、重复、恐怖和崇高场景直接参与认知与情绪训练。手稿在 1417 年前并未完全消失，‘一书开启现代性’的流行叙事同样过度简化传播网络。`,sources:[T(`第一卷第二十七章〈伊壁鸠鲁派〉`),{label:`Stanford Encyclopedia · Lucretius`,kind:`补充`,url:`https://plato.stanford.edu/entries/lucretius/`},{label:`Internet Encyclopedia of Philosophy · Lucretius`,kind:`补充`,url:`https://iep.utm.edu/lucretius/`}]}];Object.fromEntries(se.map(e=>[e.id,e]));var E=(e,t,n,r,i,a=e)=>({id:e,nameZh:t,nameEn:n,figureId:a,chapterIds:r,relation:i}),ce=[{id:`greek-origins`,title:`希腊哲学的形成`,years:
