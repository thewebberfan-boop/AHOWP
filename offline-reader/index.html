的影响`,`Locke's Influence`,637,[`自由主义`,`影响`]],[`b3-16`,`modern`,`从文艺复兴到休谟`,`XVI`,`贝克莱`,`Berkeley`,643,[`观念论`,`知觉`]],[`b3-17`,`modern`,`从文艺复兴到休谟`,`XVII`,`休谟`,`Hume`,655,[`怀疑`,`因果`]],[`b3-18`,`modern`,`从卢梭到现代`,`XVIII`,`浪漫主义运动`,`The Romantic Movement`,670,[`浪漫主义`,`个人`]],[`b3-19`,`modern`,`从卢梭到现代`,`XIX`,`卢梭`,`Rousseau`,679,[`自由`,`政治`]],[`b3-20`,`modern`,`从卢梭到现代`,`XX`,`康德`,`Kant`,696,[`知识`,`先验`]],[`b3-21`,`modern`,`从卢梭到现代`,`XXI`,`十九世纪的思想潮流`,`Currents of Thought in the Nineteenth Century`,712,[`历史`,`思想`]],[`b3-22`,`modern`,`从卢梭到现代`,`XXII`,`黑格尔`,`Hegel`,722,[`辩证法`,`国家`]],[`b3-23`,`modern`,`从卢梭到现代`,`XXIII`,`拜伦`,`Byron`,738,[`浪漫主义`,`个人`]],[`b3-24`,`modern`,`从卢梭到现代`,`XXIV`,`叔本华`,`Schopenhauer`,745,[`意志`,`悲观主义`]],[`b3-25`,`modern`,`从卢梭到现代`,`XXV`,`尼采`,`Nietzsche`,751,[`价值`,`权力`]],[`b3-26`,`modern`,`从卢梭到现代`,`XXVI`,`功利主义者`,`The Utilitarians`,764,[`功利`,`伦理`]],[`b3-27`,`modern`,`从卢梭到现代`,`XXVII`,`卡尔·马克思`,`Karl Marx`,773,[`历史`,`阶级`]],[`b3-28`,`modern`,`从卢梭到现代`,`XXVIII`,`柏格森`,`Bergson`,782,[`时间`,`直觉`]],[`b3-29`,`modern`,`从卢梭到现代`,`XXIX`,`威廉·詹姆斯`,`William James`,801,[`实用主义`,`经验`]],[`b3-30`,`modern`,`从卢梭到现代`,`XXX`,`约翰·杜威`,`John Dewey`,809,[`实用主义`,`教育`]],[`b3-31`,`modern`,`从卢梭到现代`,`XXXI`,`逻辑分析哲学`,`The Philosophy of Logical Analysis`,818,[`分析`,`逻辑`]]].map(([e,t,n,r,i,a,o,s])=>({id:e,book:t,part:n,roman:r,title:i,english:a,pdfPage:o,themes:s})),p={"b1-04":{context:`爱奥尼亚自然哲学之后，思想开始把‘变化本身’当作世界的基本事实。`,summary:`赫拉克利特把世界理解为持续生成的秩序。对立并非秩序的失败，而是维持秩序的张力；火与逻各斯分别呈现变化的形象和变化中的尺度。`,keyPoints:[`万物处于流变，稳定更像关系而非静止实体。`,`对立面彼此依存，冲突能够构成和谐。`,`逻各斯意味着变化仍可被理性把握。`],russell:`罗素欣赏其历史影响，但警惕把冲突神秘化。他把赫拉克利特视作后来辩证思维的重要源头。`,questions:[`如果一切都变，知识如何可能？`,`‘对立统一’是解释，还是一种描述方式？`],axis:[`变化`,`恒常`]},"b1-11":{context:`雅典民主、战争与智者运动共同构成苏格拉底活动的公共空间。`,summary:`苏格拉底把哲学的中心从自然转向‘应当怎样生活’。他的问答法并不直接交付结论，而是通过暴露概念矛盾，要求人对自己的信念负责。`,keyPoints:[`德性与知识存在紧密联系。`,`自知首先意味着承认无知。`,`审问概念也是一种公共伦理实践。`],russell:`罗素区分历史上的苏格拉底与柏拉图笔下的形象，并强调资料互相冲突带来的困难。`,questions:[`知道善是否足以使人行善？`,`苏格拉底的守法与独立批判是否矛盾？`],axis:[`个人良知`,`城邦法律`]},"b1-14":{context:`伯罗奔尼撒战争后的政治失序，使柏拉图将正义问题与理想政体连在一起。`,summary:`《理想国》把城邦看成放大的灵魂：理性、意气与欲望各安其位，正义便是整体秩序。哲学王方案把知识资格转化为统治资格。`,keyPoints:[`正义被界定为各部分履行适当功能。`,`教育制度比个别法律更根本。`,`哲学王将真理与政治权威结合。`],russell:`罗素认为这套秩序牺牲了个人自由，并把它视作后来极权式政治理想的一条思想先声。`,questions:[`掌握真理能否自动带来统治正当性？`,`共同体秩序可以在多大程度上塑造个人生活？`],axis:[`社会秩序`,`个人自由`]},"b1-19":{context:`亚里士多德在批评柏拉图理念论的同时，试图保留形式与可理解秩序。`,summary:`具体事物是质料与形式的结合；变化可借潜能到现实的展开来说明。实体、四因与不动的推动者共同构成一套层级化世界图景。`,keyPoints:[`形式不在事物之外，而在具体实体之中。`,`四因同时回答材料、结构、动力与目的。`,`潜能与现实解释变化而不放弃同一性。`],russell:`罗素肯定其概念影响，也批评目的论和传统权威后来阻碍经验科学。`,questions:[`目的因是自然解释的一部分吗？`,`形式与质料能否真正避免柏拉图式二分？`],axis:[`经验事物`,`形式秩序`]},"b1-28":{context:`城邦独立衰落后，哲学的重心从公共政治转向个人如何承受不确定世界。`,summary:`斯多葛主义区分可控制与不可控制之物，把德性视为唯一真正的善。个人通过服从普遍理性获得内在自由，并由此发展出世界公民观。`,keyPoints:[`自由主要是对自身判断与欲望的治理。`,`自然法把所有理性存在者联系起来。`,`情绪困扰源于对事件所作的判断。`],russell:`罗素强调它在帝国时代与基督教形成之间的桥梁作用，也指出其伦理容易滑向消极忍受。`,questions:[`内在自由会不会削弱改变制度的动力？`,`顺应自然与宿命论如何区分？`],axis:[`内在自由`,`外在命运`]},"b2-04":{context:`古典世界向基督教世界过渡，个人灵魂、救赎与教会权威成为哲学核心。`,summary:`奥古斯丁把柏拉图主义资源纳入基督教：恶不是实体而是善的缺失，时间属于被创造的心灵经验，人的意志又因原罪需要恩典。`,keyPoints:[`确定性可从怀疑者自身的存在切入。`,`时间通过记忆、注意与期待呈现。`,`自由意志与神圣预知形成持续张力。`],russell:`罗素认为奥古斯丁塑造了中世纪思想的心理深度，同时也强化了罪与惩罚的神学框架。`,questions:[`恶若只是缺失，苦难是否被解释充分？`,`恩典优先时，道德责任如何成立？`],axis:[`自由意志`,`神圣恩典`]},"b2-13":{context:`亚里士多德著作经伊斯兰与拉丁学术网络重新进入西欧，信仰与理性的边界需被重画。`,summary:`阿奎那用亚里士多德哲学系统化基督教神学：某些关于世界的真理可由自然理性抵达，启示则补足理性无法独立达到的内容。`,keyPoints:[`信仰与理性来源不同，却不应真正冲突。`,`由运动、因果等经验事实通向第一原因。`,`自然法把伦理规范建立在人性目的上。`],russell:`罗素赞赏体系的严密，却认为结论预先服从教义，削弱了开放探究。`,questions:[`预设信仰结论的论证还能否称为哲学？`,`从因果链能否推出具有宗教属性的上帝？`],axis:[`自然理性`,`神圣启示`]},"b3-08":{context:`宗教战争与国家权力重组，使政治哲学转向秩序如何在冲突个体之间建立。`,summary:`霍布斯从欲望、恐惧与自我保存出发构造自然状态。为摆脱不安全，人们相互订约并授权主权者，政治权威因而来自人为建构而非神授。`,keyPoints:[`自然平等也意味着相互伤害能力的接近。`,`契约发生在个体之间，主权者是被授权者。`,`和平与安全构成服从权威的核心理由。`],russell:`罗素重视其清晰的世俗推理，但拒绝几乎不受限制的主权结论。`,questions:[`安全是否足以压倒自由？`,`主权者破坏保护承诺时，服从义务还存在吗？`],axis:[`社会秩序`,`个人权利`]},"b3-09":{context:`新科学要求摆脱经院权威，为知识寻找可重复、可演绎的确定起点。`,summary:`笛卡尔以方法性怀疑清除可疑信念，在‘我思’中找到不可否认的自我存在，再尝试重建上帝、外部世界以及心物二元论。`,keyPoints:[`怀疑被用作建立确定性的工具。`,`思维实体与广延实体性质不同。`,`清楚分明观念承担真理标准的角色。`],russell:`罗素把主体作为起点视为现代哲学的转折，也认为从我思通向外部世界的重建并不成功。`,questions:[`‘我思’证明的是一个实体自我，还是仅有思维事件？`,`心物二元论如何解释两者互动？`],axis:[`主观确定性`,`外部世界`]},"b3-10":{context:`理性主义继续追求统一体系，但拒绝把自然与上帝看成彼此外在。`,summary:`斯宾诺莎主张只有一个无限实体——上帝即自然；心与物是同一实体的不同属性。自由不是摆脱因果，而是理解必然性并由理性行动。`,keyPoints:[`实体自因且唯一，个别事物是其样态。`,`心物平行避免两种实体的相互作用难题。`,`理解情感的原因能够增加主动性。`],russell:`罗素对斯宾诺莎的伦理人格评价极高，并特别欣赏其从理解必然性中获得平静的理想。`,questions:[`如果一切必然，道德责任意味着什么？`,`‘上帝即自然’保留了多少宗教含义？`],axis:[`必然性`,`自由`]},"b3-13":{context:`英国经验主义与政治自由主义共同反对天赋观念和绝对权威。`,summary:`洛克把心灵比作尚未书写的纸张，观念来自感觉与反省。知识是观念之间关系的把握，但对实体、外部对象和他人心灵的确定性有限。`,keyPoints:[`拒绝作为既成内容的天赋观念。`,`区分第一性质与第二性质。`,`个人同一性更多依赖意识连续，而非同一物质。`],russell:`罗素赞赏洛克的温和与反独断精神，同时指出其认识论仍保留难以证明的实体假设。`,questions:[`经验能否提供普遍必然知识？`,`记忆标准会不会让个人同一性陷入循环？`],axis:[`经验`,`理性结构`]},"b3-17":{context:`经验主义推进到极限后，实体、自我和因果关系都面临证据不足的问题。`,summary:`休谟区分印象与观念，并追问每个观念来自何种经验。因果必然性不是被感知的连接，而是重复经验形成的心理习惯；自我也只是知觉束。`,keyPoints:[`事实推理依赖因果，却无法由纯理性证明。`,`归纳预设未来类似过去，但此预设不能循环证明。`,`怀疑在生活实践中会被自然习惯缓和。`],russell:`罗素认为休谟把经验主义推向逻辑终点，并留下现代哲学必须回应的归纳难题。`,questions:[`没有理性证明，科学归纳凭什么可靠？`,`知觉束能否解释统一的行动主体？`],axis:[`理性证明`,`自然习惯`]},"b3-20":{context:`理性主义与经验主义的冲突，以及休谟的怀疑，促使康德重问经验何以可能。`,summary:`康德认为认识并非被动复制世界：感性以空间和时间组织材料，知性以范畴统一经验。我们认识现象，却不能用同样方式认识物自身。`,keyPoints:[`先天综合判断试图解释数学与自然科学的必然性。`,`主体的认识结构规定了可能经验的形式。`,`理性越出经验会产生无法解决的二律背反。`],russell:`罗素承认康德问题的重要性，但反对把空间、时间及范畴过多地归于主体构造。`,questions:[`物自身若不可知，为何仍需设定？`,`先验条件是普遍结构，还是人类认知的历史事实？`],axis:[`主体形式`,`客观世界`]},"b3-22":{context:`德国观念论试图跨越康德留下的现象与物自身二分，并把历史纳入理性体系。`,summary:`黑格尔把实在理解为整体性的精神发展，矛盾推动概念和历史达到更高综合。个别事物只有在关系网络与整体进程中才获得充分真理。`,keyPoints:[`真理不是孤立命题，而是展开的整体。`,`否定性推动概念超越自身局限。`,`自由通过历史制度获得具体形式。`],russell:`罗素严厉反对从逻辑结构推出政治整体主义，认为黑格尔把国家权威置于个人之上。`,questions:[`矛盾如何成为真实的发展动力？`,`整体视角是否必然削弱个人的独立价值？`],axis:[`历史整体`,`具体个人`]},"b3-25":{context:`十九世纪欧洲的宗教衰退、民族主义与浪漫主义，使价值来源成为尖锐问题。`,summary:`尼采以谱系方式追问价值如何产生，批判把软弱与怨恨包装成普遍道德。他要求在旧价值失效后重新创造价值，并以生命肯定抵抗虚无主义。`,keyPoints:[`道德概念有权力关系与历史来源。`,`主人道德与奴隶道德呈现不同价值姿态。`,`超人象征自我超越，而非生物学类别。`],russell:`罗素欣赏其洞察力和文体，却强烈反对英雄崇拜、残酷审美与反平等倾向。`,questions:[`揭示价值来源是否等于反驳价值？`,`自我创造怎样避免变成强者任性？`],axis:[`价值创造`,`普遍道德`]},"b3-27":{context:`工业资本主义与工人阶级形成，使哲学重新把物质生产和社会冲突置于历史中心。`,summary:`马克思把黑格尔的历史运动转向物质生活：生产关系与阶级冲突塑造制度和观念。哲学的任务不仅是解释世界，也要介入改变世界的实践。`,keyPoints:[`社会存在深刻制约意识形态。`,`阶级斗争推动历史结构变化。`,`异化描述劳动者与产品、活动和自身能力的分离。`],russell:`罗素承认经济结构的解释力，但批评历史必然论以及由此支持的政治专断。`,questions:[`经济因素在多大程度上决定观念？`,`历史趋势能否为具体政治手段提供正当性？`],axis:[`结构条件`,`人的能动性`]},"b3-31":{context:`数学基础危机与语言转向，使哲学从建造宏大体系转向澄清命题结构。`,summary:`逻辑分析通过拆解语法表面形式，揭示命题的逻辑结构。它试图减少虚假问题，并让哲学与科学共享清晰、可检验的论证标准。`,keyPoints:[`语法形式可能掩盖真正的逻辑形式。`,`分析把复杂命题还原为更基本关系。`,`哲学更像澄清活动，而非关于世界的竞争性学说。`],russell:`这是全书最接近作者自身立场的一章：反体系、重分析，同时保留对科学尚不能回答之问题的哲学敏感。`,questions:[`分析能消除哲学问题，还是只改变表达方式？`,`价值与人生问题能否接受同样的逻辑处理？`],axis:[`逻辑清晰`,`形而上体系`]}},m={generatedAt:`2026-08-14T15:41:27.620Z`,policy:`Representative images resolved from encyclopedia records to Wikimedia Commons; every downloaded image retains its source and license metadata.`,count:64,ready:55,needsReview:9,figures:[{id:`thales`,zh:`泰勒斯`,en:`Thales`,wikipediaTitle:`Thales of Miletus`,wikipediaUrl:`https://en.wikipedia.org/wiki/Thales_of_Miletus`,wikidataId:`Q36303`,wikidataUrl:`https://www.wikidata.org/wiki/Q36303`,description:`Ancient Greek philosopher (c. 626 – c. 545 BC)`,status:`ready`,representationCaution:`古代与中世纪人物的雕像、手稿插图或后世画像通常不是写实肖像，应作为视觉识别符号使用。`,image:{localPath:`/visual-archive/figures/thales.jpg`,commonsFile:`Illustrerad Verldshistoria band I Ill 107.jpg`,commonsPage:`https://commons.wikimedia.org/wiki/File:Illustrerad_Verldshistoria_band_I_Ill_107.jpg`,originalUrl:`https://upload.wikimedia.org/wikipedia/commons/c/c6/Illustrerad_Verldshistoria_band_I_Ill_107.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=original`,thumbnailUrl:`https://upload.wikimedia.org/wikipedia/commons/thumb/c/c6/Illustrerad_Verldshistoria_band_I_Ill_107.jpg/960px-Illustrerad_Verldshistoria_band_I_Ill_107.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail`,mime:`image/jpeg`,license:`Public domain`,licenseUrl:null,artist:`Wilhelm Meyer`,credit:`own scan`}},{id:`anaxima 会`,figures:`功利主义者、马克思`,region:`英国 / 欧洲工人运动`,answer:`制度可按总体幸福评价，或按生产关系与阶级支配解释并改变。`,method:`后果计算、政治经济学与历史唯物解释`,difference:`都把哲学拉向社会改革，却对个人利益和历史结构权重不同。`,chapterIds:[`b3-26`,`b3-27`]},{id:`pragmatists`,title:`以实践后果理解真理`,figures:`威廉·詹姆斯、约翰·杜威`,region:`美国`,answer:`观念的意义和真理应联系其在经验、行动和共同探究中的作用。`,method:`经验实验、功能分析与教育实践`,difference:`拒绝脱离生活的二元体系，把认识放回持续调整的环境。`,chapterIds:[`b3-29`,`b3-30`]},{id:`analysis`,title:`以逻辑分析澄清问题`,figures:`弗雷格传统、罗素与分析哲学`,region:`英国及欧洲逻辑传统`,answer:`许多哲学困难来自语法表面，揭示逻辑形式可以重构或消除问题。`,method:`逻辑形式、定义与语言分析`,difference:`不再建立历史整体，而把哲学变成精确的澄清活动。`,chapterIds:[`b3-31`]}],legacy:[`价值谱系`,`社会结构批判`,`实用主义`,`分析哲学`,`现代哲学的多中心格局`],review:`为什么工业社会没有产生一个统一哲学，而同时产生了尼采、马克思、实用主义和逻辑分析？`,coverage:`book`}],ie={origins:{events:[{id:`ionian-network`,marker:`前 8—6 世纪`,title:`殖民、贸易与爱奥尼亚知识网络`,detail:`希腊人在地中海和黑海沿岸建立殖民城邦。米利都等商业城市同时接触埃及测量、巴比伦天文和多地宗教观念。知识开始脱离单一祭司传统，在旅行者与城邦精英之间比较、修正。`},{id:`polis-rise`,marker:`前 7—6 世纪`,title:`城邦政治与成文法兴起`,detail:`贵族、僭主和平民围绕土地、债务和公民资格反复冲突。成文法与公共议事让秩序显得并非只能由神授，也能由人说明和改变；论证由此成为公共生活的一种力量。`},{id:`persian-wars`,marker:`前 499—449`,title:`希波战争与希腊世界重组`,detail:`爱奥尼亚起义和希波战争摧毁、迁移了一些早期思想中心，同时提升雅典的军事与文化地位。哲学活动逐渐由小亚细亚向南意大利和雅典转移。`}],problems:[{id:`arche`,marker:`自然`,title:`多样世界是否有共同本原？`,detail:`跨文明观察带来大量不同解释。早期哲学家尝试用水、无限者、气、数或原子等较少的自然原则说明较多现象，使世界成为可以争论的对象。`},{id:`change-being`,marker:`存在`,title:`变化与恒常如何同时成立？`,detail:`经验呈现生成与毁灭，理性却要求同一和不矛盾。赫拉克利特、巴门尼德及后来的多元论者，正是在回应感官变化与理性恒常之间的冲突。`},{id:`reason-sense`,marker:`知识`,title:`感官和推理，何者更可靠？`,detail:`数学证明显示推理可以达到不依赖眼前经验的确定性；但自然研究又从观察起步。这个张力后来成为柏拉图主义、经验研究和科学方法长期分化的起点。`}]},athens:{events:[{id:`athenian-democracy`,marker:`前 508—431`,title:`民主、帝国与公共辩论扩张`,detail:`克利斯提尼改革后，公民大会、法庭和演说成为雅典政治核心。海上同盟又带来财富与帝国权力。能否说服公众、界定正义，成为真实的政治能力。`},{id:`peloponnesian-war`,marker:`前 431—404`,title:`伯罗奔尼撒战争与政体反复`,detail:`长期战争、瘟疫、远征失败以及民主和寡头政变交替，削弱了雅典对自身制度的信心。苏格拉底之死与柏拉图的政治不信任，都处在这一创伤背景中。`},{id:`macedonian-rise`,marker:`前 387—322`,title:`学园建立与马其顿接管希腊`,detail:`柏拉图学院和亚里士多德吕克昂把哲学变成持续教学与研究制度；与此同时，马其顿击败希腊城邦，传统公民政治的自主空间迅速缩小。`}],problems:[{id:`knowledge-opinion`,marker:`知识`,title:`公共意见之外，是否有可靠知识？`,detail:`民主法庭依赖多数判断，智者展示同一案件可以有相反论证。苏格拉底与柏拉图因此追问：若没有稳定定义和真理，政治判断如何避免只剩说服与权势？`},{id:`virtue-education`,marker:`伦理`,title:`德性能够通过教育获得吗？`,detail:`新兴政治生活让修辞教师成为职业，但“会成功”是否等于“是善的”并不清楚。苏格拉底把教育从技能训练转成对灵魂、知识和行动一致性的审问。`},{id:`best-polis`,marker:`政治`,title:`失序之后，怎样组织好城邦？`,detail:`雅典的战争失败使哲学家不得不比较民主、寡头、君主和混合政体。柏拉图从知识资格设计理想国，亚里士多德则从现实宪制与公民生活寻找可行秩序。`}]},hellenistic:{events:[{id:`alexander`,marker:`前 334—323`,title:`亚历山大征服波斯帝国`,detail:`马其顿军队把希腊势力推进到埃及、中亚和印度河流域。征服制造了跨地域的政治与文化空间，也终结了希腊城邦作为最高政治单位的稳定地位。`},{id:`successor-kingdoms`,marker:`前 323—168`,title:`继业者王国与希腊化城市形成`,detail:`帝国分裂为托勒密、塞琉古等君主国。亚历山大里亚等城市汇聚希腊、埃及、波斯和犹太传统，学派与图书馆取代城邦公民共同体，成为知识的重要载体。`},{id:`roman-expansion`,marker:`前 168—30`,title:`罗马接管地中海世界`,detail:`罗马先后控制马其顿、希腊和埃及。政治中心继续远离传统希腊城邦，哲学则被带入罗马精英教育和更广泛的帝国生活。`}],problems:[{id:`inner-freedom`,marker:`生活`,title:`无法控制政治时，个人怎样自由？`,detail:`个人从城邦决策者变为大王国的臣民，外部地位更不稳定。犬儒、伊壁鸠鲁和斯多葛学派都把自由重新安放在需要、欲望或判断的管理上。`},{id:`cosmopolis`,marker:`共同体`,title:`跨地域世界需要怎样的共同身份？`,detail:`人口迁移和文化混合削弱了单一城邦身份。斯多葛主义用共同理性和自然法构造“世界公民”，其他学派则用友谊小共同体或退出公共规范回应。`},{id:`tranquility-certainty`,marker:`知识`,title:`确定知识是否是安宁的必要条件？`,detail:`怀疑派认为减少知识承诺本身能够消除扰动；伊壁鸠鲁派却认为必须理解自然，才能解除神罚和死亡恐惧。两者共享宁静目标，却对知识的作用判断相反。`}]},roman:{events:[{id:`augustan-order`,marker:`前 27—180`,title:`元首制与帝国和平`,detail:`奥古斯都以后，军队、税制、道路和行政把广大地区纳入较稳定的秩序。希腊哲学被罗马精英吸收，但哲学家很少再把参与独立城邦当作生活前提。`},{id:`citizenship-law`,marker:`1—3 世纪`,title:`罗马法与公民身份扩张`,detail:`城市网络、法律程序和二一二年的公民权敕令扩大了共同制度。不同民族在同一帝国中生活，使普遍法、角色义务和人类共同性的观念更有现实基础。`},{id:`third-century-crisis`,marker:`235—284`,title:`三世纪危机与宗教需求上升`,detail:`皇位频繁更替、内战、边境压力、瘟疫和经济混乱削弱帝国安全感。传统公共宗教难以解释个人苦难，神秘宗教和更强的来世救赎需求因而扩张。`}],problems:[{id:`role-duty`,marker:`伦理`,title:`庞大制度中的人应怎样履行角色？`,detail:`帝国把皇帝、奴隶、士兵和官员置于不同位置。罗马斯多葛主义试图说明：外在角色有别，但每个人都能通过理性判断和恰当行动保有德性。`},{id:`fate-freedom`,marker:`自由`,title:`必然命运中还能有什么自由？`,detail:`个人难以影响帝国政治，战争与疾病也不可预测。哲学于是区分事件本身与人的判断，把自由缩小却加固为无法被外力直接夺走的内在能力。`},{id:`higher-reality`,marker:`形而上学`,title:`外部秩序之外，更高真实在哪里？`,detail:`帝国制度能提供法律，却不能提供终极意义。普罗提诺把真实组织成太一、精神与灵魂的层级，并要求灵魂由感性多样返回统一根源。`}]},patristic:{events:[{id:`constantine`,marker:`313—325`,title:`君士坦丁改宗与尼西亚会议`,detail:`基督教获得合法地位后，教义分歧不再只是宗派内部问题。皇帝召集会议处理基督性质等争论，神学语言与帝国统一第一次被制度性地连接。`},{id:`state-religion`,marker:`380—395`,title:`基督教成为帝国主导宗教`,detail:`狄奥多西时期，尼西亚基督教获得国家支持，异教祭祀受到限制。教会吸收行政资源，也必须处理权力、强制与正统边界的问题。`},{id:`western-collapse`,marker:`410—529`,title:`西罗马瓦解与修道制度成长`,detail:`罗马遭劫和西部皇权消失，使城市教育与行政网络衰退。主教和修道院逐渐承担救济、识字教育与典籍保存，教会成为少数跨地域连续组织。`}],problems:[{id:`greek-language`,marker:`神学`,title:`如何用希腊概念表达启示？`,detail:`圣经叙事谈创造与救赎，希腊哲学谈实体、形式和永恒。教父必须借用后者澄清三位一体与基督论，同时避免让基督教被完全改写成柏拉图主义。`},{id:`evil-grace`,marker:`人性`,title:`恶、自由意志与恩典怎样相容？`,detail:`基督教既坚持上帝全善全能，又必须解释罪与苦难。奥古斯丁把恶理解为善的缺失，把犯罪归于意志，却又强调堕落者离不开神圣恩典。`},{id:`sacred-history`,marker:`历史`,title:`帝国崩溃意味着宗教失败吗？`,detail:`罗马被劫后，异教作者把灾难归咎于基督教。奥古斯丁以“上帝之城”和“世俗之城”区分政治命运与救赎史，使历史获得一个超越帝国兴亡的方向。`}]},"early-medieval":{events:[{id:`islamic-expansion`,marker:`7—10 世纪`,title:`伊斯兰扩张与翻译运动`,detail:`阿拉伯帝国连接叙利亚、波斯、埃及与西班牙。巴格达等中心把希腊哲学、印度数学和医学译成阿拉伯语，并在注释、计算与科学实践中继续发展。`},{id:`carolingian`,marker:`800—843`,title:`查理曼帝国与拉丁教育重建`,detail:`查理曼加冕象征西部帝国观念复兴。宫廷和修道院推动文字规范、学校与抄本复制，但统一很快瓦解，教育仍主要依附少数宗教机构。`},{id:`investiture`,marker:`1075—1122`,title:`教会改革与叙任权斗争`,detail:`改革教皇反对世俗君主任命主教，皇帝则坚持传统控制。冲突把精神权威与世俗权力明确区分，也推动教会法和制度论证发展。`}],problems:[{id:`preservation-authority`,marker:`知识`,title:`文明断裂后，谁有权保存和筛选知识？`,detail:`不同地区保存了不同古典资源：西欧修道院偏重拉丁宗教文本，拜占庭保留希腊传统，伊斯兰城市则广泛翻译和扩展。保存从来同时意味着选择。`},{id:`reason-revelation`,marker:`方法`,title:`跨语言知识怎样进入信仰体系？`,detail:`翻译不只是换语言，也会改变概念。约翰·司各脱、阿维森纳和阿威罗伊都必须判断：哲学推理与启示冲突时，是重新解释经文、限制理性，还是区分真理层次。`},{id:`two-powers`,marker:`政治`,title:`教皇与皇帝，谁代表普遍秩序？`,detail:`西欧没有单一帝国，却同时继承罗马皇权和普世教会理想。主教任命、财产和法律管辖的争执，使政治思想长期围绕两种普遍权威的边界展开。`}]},scholastic:{events:[{id:`translations-crusades`,marker:`1095—1250`,title:`十字军、城市贸易与翻译回流`,detail:`军事接触并非知识传播的唯一渠道，但地中海联系扩大，使托莱多、西西里等地的阿拉伯语和希腊语著作进入拉丁世界，完整亚里士多德尤其改变大学课程。`},{id:`universities`,marker:`12—13 世纪`,title:`大学与托钵修会兴起`,detail:`巴黎、牛津等大学形成教师、课程与学位制度；方济各会和多明我会进入城市教育。哲学问题被固定成可反驳、可答辩、可积累的专业论证格式。`},{id:`papal-decline`,marker:`1302—1378`,title:`教皇高峰后的政治裂缝`,detail:`教皇与法国王权冲突、阿维尼翁时期及教会分裂削弱普世权威。民族王权、城市和新法律实践上升，使经院综合失去原有的统一制度基础。`}],problems:[{id:`faith-reason`,marker:`体系`,title:`理性与启示能组成完整世界吗？`,detail:`亚里士多德提供自然、逻辑和伦理的系统解释，却包含与基督教不完全相容的前提。阿奎那试图划分自然理性能及之处，以及必须依赖启示的领域。`},{id:`universal-individual`,marker:`本体论`,title:`普遍概念和个体事物谁更根本？`,detail:`大学辩论需要精确定义“人性”“种类”等共相的地位。实在论、概念论和唯名论的差异，又影响上帝知识、个体责任和经验对象应如何被理解。`},{id:`limits-system`,marker:`方法`,title:`一个体系应当在哪里停止解释？`,detail:`经院方法追求兼容全部权威，但奥卡姆等人强调简约、个体和上帝意志，缩小理性证明范围。体系内部由此产生限制体系自身的工具。`}]},"renaissance-science":{events:[{id:`print-fall`,marker:`1450—1453`,title:`印刷术传播与君士坦丁堡陷落`,detail:`活字印刷显著降低文本复制成本，希腊学者和手稿又更多进入意大利。古典材料不再只由大学经院传统解释，人文主义者开始校勘原文和比较版本。`},{id:`oceanic-expansion`,marker:`1492—1522`,title:`远洋航行扩大已知世界`,detail:`跨大西洋航行和环球航行暴露了古典地理知识的限度，也带来殖民、财富与暴力。经验事实能够公开修正权威文本，欧洲人的人类与自然观被迫扩展。`},{id:`reformation-science`,marker:`1517—1633`,title:`宗教改革与日心说冲突`,detail:`宗教改革打破西欧教会统一；哥白尼、开普勒和伽利略又以数学和观察改变宇宙结构。经文、古代权威与可检验自然知识之间出现多重竞争。`}],problems:[{id:`political-reality`,marker:`政治`,title:`政治能否脱离统一神学伦理研究？`,detail:`意大利城邦的战争与外交显示，统治者常按权力后果而非传统德性行动。马基雅维利由此把政治稳定、能力和时机当作相对独立的研究对象。`},{id:`interpretation-authority`,marker:`权威`,title:`个人、经文与教会，谁解释真理？`,detail:`印刷让经文和论战迅速传播，宗教改革削弱教会作为唯一中介的地位。个人良心上升，却也产生宗派国家、教义冲突和新的强制。`},{id:`new-method`,marker:`科学`,title:`什么方法能让自然知识可信？`,detail:`旧体系依赖经典注释和目的因，新天文学则依赖测量、数学预测与仪器观察。争论的核心不只是地球是否运动，而是什么证据足以推翻权威。`}]},"early-modern":{events:[{id:`religious-wars`,marker:`1618—1648`,title:`三十年战争与威斯特伐利亚和约`,detail:`宗教、王朝和领土冲突造成中欧巨大破坏。和约强化领土国家秩序，也使政治和平越来越难以依赖全欧洲共享的宗教真理。`},{id:`english-revolutions`,marker:`1642—1689`,title:`英国内战与光荣革命`,detail:`王权、议会、宗教和财产权的冲突经历内战、共和国、复辟与权利法案。霍布斯和洛克由同一政治危机出发，却分别强调不可分主权与有限政府。`},{id:`newtonian-science`,marker:`1660—1687`,title:`科学共同体与牛顿综合`,detail:`皇家学会等机构推动公开实验和通信，牛顿以数学定律统一地上与天体运动。科学成为哲学家想要模仿、解释或限制的可靠知识模型。`}],problems:[{id:`certainty-foundation`,marker:`认识论`,title:`失去共同权威后，确定性从哪里开始？`,detail:`笛卡尔从不可怀疑的主体出发，理性主义者追求数学式体系；洛克和休谟则追踪观念的经验来源。现代哲学由此把“认识者”放到知识结构中心。`},{id:`sovereignty-rights`,marker:`政治`,title:`安全、主权与个人权利怎样排序？`,detail:`宗教战争显示分裂权威可能导致暴力，英国内战又显示绝对权力本身也危险。社会契约论用个人同意重建国家，却对权力边界给出不同答案。`},{id:`causation-induction`,marker:`科学`,title:`经验为何能支持普遍科学定律？`,detail:`科学不断成功，但经验只呈现有限事件。休谟指出，我们看见的是连续发生，而非必然联系；归纳依赖习惯，却无法用不循环的经验论证自身。`}]},"revolution-idealism":{events:[{id:`atlantic-revolutions`,marker:`1776—1799`,title:`美国革命与法国革命`,detail:`自然权利、人民主权和公民平等进入制度实践；法国革命同时经历共和、恐怖与政变。自由不再只是理论原则，也暴露出共同意志与政治暴力的紧张。`},{id:`napoleonic`,marker:`1799—1815`,title:`拿破仑战争重绘欧洲`,detail:`法国制度和民族动员席卷欧洲，随后又由王朝复辟收束。战争促进民族意识，也让哲学家把国家、法律和历史变化理解为自由展开的现实场所。`},{id:`industrial-1848`,marker:`1815—1848`,title:`工业化、民族主义与革命浪潮`,detail:`工厂城市、阶级分化和市场关系改变日常生活，民族独立与宪政运动扩张。浪漫主义反对把人缩减为计算与生产单位，一八四八年革命则集中暴露社会矛盾。`}],problems:[{id:`freedom-general-will`,marker:`政治`,title:`个人自由如何进入共同意志？`,detail:`革命需要以人民名义行动，却可能压制具体个人。卢梭的公意、康德的自律和黑格尔的制度自由，都试图说明服从共同规则何时不是失去自由。`},{id:`subject-world`,marker:`认识论`,title:`主体是在发现世界，还是构成经验？`,detail:`休谟的怀疑使理性主义和经验主义都难以保证科学必然性。康德转而研究经验得以可能的主体条件，并由此开启德国观念论。`},{id:`history-freedom`,marker:`历史`,title:`历史变化是否具有理性方向？`,detail:`革命和战争让制度在一代人内剧烈改变。黑格尔把冲突解释为自由意识的发展，浪漫主义者则担心抽象历史整体吞没个性、情感与不可替代的生命。`}]},"industrial-modern":{events:[{id:`industrial-capital`,marker:`1848—1871`,title:`工业资本主义与工人运动成长`,detail:`铁路、工厂和城市化扩大生产，也加深劳动分工、周期危机与阶级冲突。工会、社会主义和大众政治兴起，社会结构本身成为哲学解释与改造对象。`},{id:`darwin-secular`,marker:`1859 以后`,title:`进化论与传统世界观动摇`,detail:`达尔文以自然选择解释物种形成，人类不再天然处于独立创造的位置。历史发展、生命竞争和宗教权威的衰退，共同迫使哲学重估价值来源。`},{id:`mass-war-analysis`,marker:`1879—1918`,title:`专业大学、逻辑革命与世界大战`,detail:`哲学和科学在大学中专业化，现代逻辑改变了分析工具；民族国家和工业技术又在第一次世界大战中显示巨大破坏力。统一进步叙事因此失去可信度。`}],problems:[{id:`value-after-god`,marker:`价值`,title:`传统宗教衰退后，价值从哪里来？`,detail:`科学解释减少了诉诸神意的空间，社会规范又显出历史性。尼采用谱系追问价值由何种生命与权力关系产生，并把虚无主义视为现代核心危机。`},{id:`structure-agency`,marker:`社会`,title:`人的生活由结构决定到什么程度？`,detail:`马克思强调生产关系与阶级，功利主义从行动后果评价制度，实用主义则把观念放回环境中的调整活动。它们都反对孤立主体，却给人的能动性留下不同空间。`},{id:`philosophy-task`,marker:`方法`,title:`哲学应建体系、改社会，还是澄清语言？`,detail:`现代知识专业化后，哲学失去单一中心。谱系、政治经济学、实用实验和逻辑分析并存，分歧已不只是答案不同，而是对哲学任务本身的判断不同。`}]}},ae=[{id:`natural`,title:`自然假说`,rule:`用更少的自然本原解释更多现象`,uses:[`米利都学派`,`原子论`,`新科学`],stages:[`origins`,`renaissance-science`]},{id:`deduction`,title:`演绎与体系`,rule:`从少数被认为可靠的起点推出整体结构`,uses:[`巴门尼德`,`柏拉图`,`笛卡尔`,`斯宾诺莎`],stages:[`origins`,`athens`,`early-modern`]},{id:`dialectic`,title:`问答与辩证`,rule:`通过矛盾、反方和概念区分推进认识`,uses:[`苏格拉底`,`经院哲学`,`黑格尔`],stages:[`athens`,`scholastic`,`revolution-idealism`]},{id:`classification`,title:`分类与功能`,rule:`先区分事物类型，再解释各自原因和适当活动`,uses:[`亚里士多德`,`经院体系`],stages:[`athens`,`scholastic`]},{id:`therapy`,title:`哲学治疗`,rule:`改变欲望与判断，使人能够承受不可控制的世界`,uses:[`犬儒派`,`伊壁鸠鲁派`,`斯多葛派`,`怀疑派`],stages:[`hellenistic`,`roman`]},{id:`interpretation`,title:`解释与综合`,rule:`把既有经典放入新的宗教或概念体系`,uses:[`奥古斯丁`,`阿奎那`,`伊斯兰哲学`],stages:[`patristic`,`early-medieval`,`scholastic`]},{id:`empirical`,title:`经验与实验`,rule:`追踪观念来源，并让主张接受观察或实践检验`,uses:[`培根`,`洛克`,`休谟`,`实用主义`],stages:[`renaissance-science`,`early-modern`,`industrial-modern`]},{id:`critique`,title:`条件分析`,rule:`不直接回答对象是什么，而先问认识它何以可能`,uses:[`康德`,`语言分析`],stages:[`revolution-idealism`,`industrial-modern`]},{id:`genealogy`,title:`历史与谱系`,rule:`通过生成过程解释观念、制度和价值的权力来源`,uses:[`黑格尔`,`马克思`,`尼采`],stages:[`revolution-idealism`,`industrial-modern`]}],oe=[{from:`毕达哥拉斯的数学—宗教秩序`,to:`柏拉图的理念论`,label:`改造`,weight:3},{from:`柏拉图与新柏拉图主义`,to:`奥古斯丁神学`,label:`吸收`,weight:3},{from:`斯多葛自然法与普世人性`,to:`基督教伦理与近代自然权利`,label:`远程传递`,weight:3},{from:`亚里士多德著作`,to:`伊斯兰哲学 → 拉丁经院哲学`,label:`跨文明传播`,weight:3},{from:`古代怀疑主义`,to:`休谟的经验主义怀疑`,label:`问题复活`,weight:2},{from:`苏格拉底的概念追问`,to:`现代逻辑与语言分析`,label:`方法回声`,weight:2},{from:`柏拉图式整体政治`,to:`卢梭、黑格尔与国家哲学`,label:`结构回声`,weight:2},{from:`赫拉克利特的变化与冲突`,to:`黑格尔、马克思与尼采`,label:`高权重例外`,weight:1}],se=e=>({label:`罗素《西方哲学史》${e}`,kind:`原书`,url:`https://www.russell-j.com/cool/HWP_1945.pdf`}),ce=[{id:`thales`,order:1,nameZh:`泰勒斯`,nameEn:`Thales of Miletus`,greekName:`Θαλῆς`,dates:`约前 625—前 546`,active:`约前 585 年前后`,places:[`米利都`,`爱奥尼亚`,`埃及（传统记载）`],school:`米利都学派`,figureId:`thales`,chapterIds:[`b1-02`],thesis:`用一种自然本原解释多样世界：重要的不只是“水”这个答案，而是世界可以从世界内部得到说明。`,evidenceCaution:`没有可确认的著作传世。我们主要通过希罗多德、亚里士多德及更晚作者认识他；具体事迹常带有“七贤”式传奇色彩。`,lifeSummary:`泰勒斯生活在小亚细亚西岸的商业城邦米利都。这里连接爱琴海、吕底亚、埃及和巴比伦知识网络，同时经历贵族、商人和僭主之间的政治变动。古代传统把他列为“希腊七贤”之一，并赋予他天文、几何、工程和政治建议等多重身份。罗素把这种跨文化、商业性的城市环境视为米利都自然研究得以出现的重要条件。与后世留下完整著作的哲学家不同，泰勒斯更像一个由少数命题和大量见证拼成的历史起点。`,timeline:[{date:`约前 625`,place:`米利都`,title:`出生与成长`,detail:`年代由后世编年推定；身处海上贸易与多文明知识交汇的爱奥尼亚。`,certainty:`推定`},{date:`前 585`,place:`吕底亚—米底战场`,title:`日食预言传统`,detail:`希罗多德说他预告了发生在战争中的日食；现代研究通常怀疑他是否可能精确预报地点和日期。`,certainty:`传统记载`},{date:`6 世纪前期`,place:`米利都／埃及`,title:`几何与测量活动`,detail:`传说他由埃及引入几何，并用影长测量金字塔、以三角测量估算海上船距；具体归属并不确定。`,certainty:`传统记载`},{date:`前 546 前后`,place:`爱奥尼亚`,title:`生命末期`,detail:`吕底亚被波斯征服，米利都进入新的政治环境；传统编年常把他的去世置于这一时期。`,certainty:`推定`}],inquiries:[{object:`自然本原`,question:`纷繁事物是否能由一种共同东西说明？`,start:`生命、营养、种子和湿润之间似乎存在稳定联系；水又能呈现多种状态。`,steps:[`从多样事物中寻找共同成分`,`把生成理解为自然材料的变化`,`不再用神祇的临时干预填补每个现象`],conclusion:`水被视为万物的本原。即使答案粗糙，这种解释形式已经把宇宙当作一个内在、自行运作的系统。`},{object:`运动与生命`,question:`无生命的东西为什么能够产生运动？`,start:`磁石能在没有可见推动者的情况下吸引铁。`,steps:[`把自发运动与灵魂联系`,`由磁石推测自然物具有内在动力`,`将神性理解为遍布自然，而非只从外部介入`],conclusion:`亚里士多德转述他认为磁石有灵魂、万物充满神。这不是成熟论证，却保存了“自然自身含有运动原则”的直觉。`}],concepts:[{zh:`本原`,en:`archē`,definition:`事物从何而来、由何构成并凭什么持续的第一原则。“本原”这一术语主要是亚里士多德用来整理早期思想的框架。`},{zh:`水`,en:`water as primary stuff`,definition:`既是可观察的物质，又承担统一解释的角色；重点是用较少的自然假设解释较多现象。`},{zh:`有灵的自然`,en:`ensouled nature`,definition:`自然物的运动不必总由外在人格神推动；动力可能属于事物自身。这个解释仍混合着早期神性语言。`}],lineage:{inherited:`继承的是爱奥尼亚的航海测量、巴比伦天文周期与埃及实用几何，而不是一套已经成形的哲学体系。`,school:`后世把泰勒斯、阿那克西曼德和阿那克西美尼归为米利都学派：共享自然本原、宇宙生成和非人格化解释，但未必存在严格的学校组织。`,influenced:`阿那克西曼德延续“单一本原”的问题，却反对以已知元素作最终基础；阿那克西美尼又返回具体元素，并补上变化机制。`,parallel:`与赫西俄德同样解释宇宙起源，却由神族谱系转向自然材料；与后来的唯物论都追问物质基础，但不能因此说近代唯物论直接源于泰勒斯。`},comparisons:[{target:`赫西俄德`,relation:`同题比较`,shared:`都试图给宇宙一个起源秩序。`,difference:`赫西俄德以神的出生和冲突叙述起源；泰勒斯把解释压缩为自然材料及其变化。`},{target:`阿那克西曼德`,relation:`直接传承`,shared:`世界需要一个统一的生成原则。`,difference:`泰勒斯选择可见的水；阿那克西曼德认为任何已知元素都会偏向自身，故改用无规定的“无限者”。`},{target:`毕达哥拉斯`,relation:`同题比较`,shared:`都寻找多样现象背后的统一秩序。`,difference:`泰勒斯从物质与观察出发；毕达哥拉斯传统更重数、比例、灵魂与净化生活。`}],russellView:`罗素说泰勒斯更值得作为科学家而非现代意义的哲学家受到尊重。他把“万物由水构成”当作大胆但并非愚蠢的科学假说，也反复提醒可确知材料太少。对罗素而言，真正的历史价值不在答案正确，而在这种粗糙假说能够刺激观察、争论和后续修正。`,modernCorrection:`现代研究比罗素更谨慎地处理日食预言：前 585 年确有适合的日食，古代也确有预言记载，但泰勒斯掌握何种方法无法确定。“万物是水”同样主要经亚里士多德重构，不能当作泰勒斯留下的完整原文体系。`,sources:[se(`第一卷第二章〈米利都学派〉`),{label:`Stanford Encyclopedia · Presocratic Philosophy`,kind:`补充`,url:`https://plato.stanford.edu/entries/presocratics/`},{label:`Internet Encyclopedia of Philosophy · Thales`,kind:`补充`,url:`https://iep.utm.edu/thales/`}]},{id:`anaximander`,order:2,nameZh:`阿那克西曼德`,nameEn:`Anaximander`,greekName:`Ἀναξίμανδρος`,dates:`约前 610—前 546`,active:`6 世纪中叶`,places:[`米利都`,`黑海殖民网络`,`斯巴达（传统记载）`],school:`米利都学派`,figureId:`anaximander`,chapterIds:[`b1-02`],thesis:`已知元素彼此对立，不能有任何一种无限支配其他元素；万物应从更抽象、无规定的“无限者”生成。`,evidenceCaution:`据说写过散文著作《论自然》，现仅有一小段可能接近原文的残句。其地图、日晷和殖民活动都来自后世见证，细节不可完全确认。`,lifeSummary:`阿那克西曼德是米利都公民，传统上被称为泰勒斯的学生或同伴。他处在吕底亚与波斯势力扩张、爱奥尼亚城邦持续殖民和航海的时期。后世称他率领过前往黑海沿岸阿波罗尼亚的殖民行动，制作过已知世界地图，并把圭表带入希腊；这些记载共同显示他的知识与实际定向、时间测量及城邦空间有关。他可能是最早用散文系统书写自然研究的希腊思想家之一，但著作本身几乎全部失传。`,timeline:[{date:`约前 610`,place:`米利都`,title:`出生`,detail:`后世编年据其前 546 年约六十四岁反推；确切年份未知。`,certainty:`推定`},{date:`6 世纪中叶`,place:`黑海沿岸`,title:`殖民与地理活动`,detail:`传说他领导米利都殖民者建立阿波罗尼亚，并绘制有人居住世界的地图。`,certainty:`传统记载`},{date:`6 世纪中叶`,place:`米利都／斯巴达`,title:`天文测量`,detail:`据说设置圭表，用影子判断时刻与季节；工具来自更早的巴比伦传统，贡献更可能是引入和应用。`,certainty:`传统记载`},{date:`约前 546`,place:`米利都`,title:`《论自然》与生命末期`,detail:`据推定曾以散文讨论宇宙、地理和生命起源；只有经辛普里丘转述的一段残句留存。`,certainty:`推定`}],inquiries:[{object:`第一原则`,question:`如果元素相互对立，哪一种能够成为共同本原？`,start:`水、火、气、土具有互相排斥的性质；若其中一种无限强大，其余早已被消灭。`,steps:[`接受泰勒斯的单一本原问题`,`比较已知元素之间的对立`,`排除任何带有确定性质的元素`,`把本原提升为无边界、无规定且不衰老的来源`],conclusion:`本原是“无限者”：它不是简单的无限空间，而是无法由现成元素限定、又能持续产生世界的根源。`},{object:`宇宙秩序与变化`,question:`对立元素不断争胜，为什么世界没有崩溃？`,start:`冷热、干湿等力量会扩张并侵占彼此，但季节和生成毁灭呈现循环。`,steps:[`无限者内部具有永恒运动`,`冷热等对立力量分离`,`对立物在时间中轮流占优`,`越界者通过反向变化向另一方作出补偿`],conclusion:`变化受时间与比例约束；“正义”不是人格神判决，而是自然系统恢复平衡的秩序。`},{object:`地球与生命`,question:`地球为何不坠落，人类又怎样进入自然史？`,start:`若地球必须由别物支撑，就会产生新的支撑问题；人类幼年期过长，似乎无法以现状独立起源。`,steps:[`地球与各方向等距，因此无理由向一边移动`,`天体环绕地球形成完整路径`,`生命由受太阳作用的湿润环境产生`,`早期人类曾寄生于鱼形动物，成熟后才登上陆地`],conclusion:`宇宙与生命都通过自然生成解释，而不是一次性的创造事件；具体模型虽错误，解释目标却高度统一。`}],concepts:[{zh:`无限者`,en:`apeiron`,definition:`没有边界或确定性质、不会衰老耗尽的本原。它既避免某一元素垄断，又为无数生成过程保留来源。`},{zh:`对立者`,en:`opposites`,definition:`热与冷、干与湿等具有作用力的性质；可见世界由它们的分离、侵占与转化构成。`},{zh:`宇宙正义`,en:`cosmic justice`,definition:`对立力量依时间秩序为越界付出补偿。它把政治—伦理词汇转化为非人格化的自然规律。`},{zh:`无支撑地球`,en:`unsupported earth`,definition:`地球因与各方向等距而保持原位，不再需要海、柱或巨兽支撑；这是用对称性终止解释倒退。`}],lineage:{inherited:`从泰勒斯继承“以一个自然原则解释整个宇宙”的问题，也继承米利都航海、测量与跨文化观察的实践背景。`,school:`属于米利都自然哲学，但把具体物质假说推进到抽象原则，并第一次留下可辨认的宇宙秩序论证。`,influenced:`阿那克西美尼保留单一本原，却认为“无限者”缺少变化机制；赫拉克利特继续使用对立与正义语言，但把冲突本身视为秩序。后来的宇宙模型也继承其无外部支撑的解释方向。`,parallel:`与现代演化论共享“生命有自然生成史”这一问题形式，却没有遗传、选择等机制，不能把他称为现代进化论者。`},comparisons:[{target:`泰勒斯`,relation:`直接传承`,shared:`用单一本原统一解释生成世界。`,difference:`泰勒斯选取水；阿那克西曼德用元素冲突论证，本原必须不等同于任何已知元素。`},{target:`阿那克西美尼`,relation:`直接传承`,shared:`宇宙从一个持续存在的来源演化。`,difference:`阿那克西曼德的来源抽象但机制含混；阿那克西美尼以气的凝聚和稀释提供可观察的变化机制。`},{target:`赫拉克利特`,relation:`同题比较`,shared:`都用对立、时间和正义解释世界秩序。`,difference:`阿那克西曼德把越界后的补偿视为平衡；赫拉克利特则认为张力和争斗本身就是生成秩序。`}],russellView:`罗素明确说阿那克西曼德比泰勒斯“更有趣”。他着重重建了一个排除论证：若水、火等任何已知元素是无限的，它就会征服其他元素，因此本原必须在宇宙冲突中保持中性。罗素也赞赏其无创造论的宇宙演化、动物起源假说、地图和科学好奇心，评价他“原创处都是科学而理性的”。`,modernCorrection:`“无限者”究竟指空间无限、时间不尽、性质未定还是不可经验，仍有争议。现存残句的边界也不确定。地图、圭表和殖民领导等事迹应写作古代传统，而不应像完整履历一样陈述；但这些传统可靠地反映了后人眼中他兼具宇宙论与测量实践的形象。`,sources:[se(`第一卷第二章〈米利都学派〉`),{label:`Stanford Encyclopedia · Presocratic Philosophy`,kind:`补充`,url:`https://plato.stanford.edu/entries/presocratics/`},{label:`Internet Encyclopedia of Philosophy · Anaximander`,kind:`补充`,url:`https://iep.utm.edu/anaximander/`}]},{id:`anaximenes`,order:3,nameZh:`阿那克西美尼`,nameEn:`Anaximenes of Miletus`,greekName:`Ἀναξιμένης`,dates:`约前 586—前 528`,active:`6 世纪中叶`,places:[`米利都`,`爱奥尼亚`],school:`米利都学派`,figureId:`anaximenes`,chapterIds:[`b1-02`],thesis:`以气为统一材料，以稀释和凝聚为变化机制：性质差异可以由连续、定量的过程产生。`,evidenceCaution:`生平几乎空白，年代也来自后世推定。著作没有保存，哲学主要经泰奥弗拉斯托斯传统和晚期摘述重建。`,lifeSummary:`阿那克西美尼是米利都三人组中最晚的一位，通常被说成阿那克西曼德的同伴或学生。他活动时的爱奥尼亚正承受吕底亚覆灭、波斯统治和城邦紧张；罗素只敢断言他晚于阿那克西曼德，并早于前 494 年波斯镇压爱奥尼亚起义时米利都被毁。关于旅行、政治活动和私人交往，没有足够材料可写。其历史位置主要由理论显示：他既不满足于泰勒斯只有“材料答案”，也不满足于阿那克西曼德过于抽象的来源，而要说明同一种材料怎样连续变成可见世界。`,timeline:[{date:`约前 586`,place:`米利都`,title:`出生`,detail:`传统年代差异较大；较稳妥的说法只是他活跃于前六世纪中叶。`,certainty:`推定`},{date:`前 550 前后`,place:`米利都`,title:`与阿那克西曼德的学术关系`,detail:`泰奥弗拉斯托斯传统称他是阿那克西曼德的同伴或学生；严格师承无法证实。`,certainty:`传统记载`},{date:`6 世纪中叶`,place:`米利都`,title:`自然论写作`,detail:`据说用朴素爱奥尼亚散文写作，集中讨论气、物质变化、气象和宇宙形成；文本已失。`,certainty:`传统记载`},{date:`前 528 前后`,place:`米利都`,title:`去世`,detail:`常见年代来自后世编年；可以确认的相对关系是其活动早于前 494 年米利都毁灭。`,certainty:`推定`}],inquiries:[{object:`本原与生命`,question:`哪种本原既无处不在，又能解释生命和宇宙的统一？`,start:`气通常不可见、范围难定，却以呼吸维持生命；它比水更普遍，又比“无限者”更可经验。`,steps:[`选取遍布环境的气作为材料`,`以呼吸—灵魂维持身体作类比`,`把同一关系扩大到气包围并维持整个宇宙`],conclusion:`气既是万物材料，也是世界保持整体的生命性原则；自然与生命仍处于同一解释层。`},{object:`物质变化`,question:`同一种材料怎样产生火、水、土和石等相反性质？`,start:`空气受压、吹拂、蒸发和结露会呈现冷热、疏密变化；毛毡制作也展示压缩产生新性质。`,steps:[`稀释使气变为火`,`逐步凝聚使气成为风、云、水`,`继续凝聚成为土与石`,`用疏密程度把多种物质排入连续序列`],conclusion:`可见的性质差异来自稀释和凝聚的数量差异。这是米利都学派第一次较明确地给出变化机制。`},{object:`宇宙与气象`,question:`天地和常见气象能否使用同一机制解释？`,start:`若气的疏密过程普遍有效，就不应只解释少数物质。`,steps:[`凝聚的气形成扁平大地`,`大地像叶片一样由气托住`,`太阳、月亮和星体由稀薄或燃烧物形成`,`云、雨、雹、雪同样按凝聚程度说明`],conclusion:`一个低成本机制跨越物质、气象和宇宙领域；模型错误，但解释具有可重复性和统一性。`}],concepts:[{zh:`气`,en:`aēr`,definition:`无处不在、通常不可见又能成为呼吸的基本材料；兼有可观察性与近似无限的范围。`},{zh:`稀释`,en:`rarefaction`,definition:`气变得更疏、更热并趋向火的过程；把质的变化解释为密度下降。`},{zh:`凝聚`,en:`condensation`,definition:`气依次成为风、云、水、土、石的连续压缩过程；把多种材料排列在同一尺度上。`},{zh:`呼吸类比`,en:`breath analogy`,definition:`人的灵魂作为气维持身体，宇宙之气也包围并维持世界。它连接个体生命经验与整体宇宙论。`}],lineage:{inherited:`接受泰勒斯的物质一元论和阿那克西曼德的宇宙生成问题；其气同时吸收了“具体元素”与“范围无定”两种要求。`,school:`作为米利都学派第三人，他最突出的贡献不是换了一个本原名称，而是提供稀释—凝聚这一可复用机制。`,influenced:`其连续物质转化影响后来的赫拉克利特、阿那克萨哥拉、阿波罗尼亚的第欧根尼及古代医学气论。罗素还说他影响了毕达哥拉斯，并指出原子论者沿用其圆盘形地球。`,parallel:`与近代以压力、密度解释相变的科学共享“用定量变化说明性质差异”的结构，但他没有实验测量、微观理论或守恒定律。`},comparisons:[{target:`泰勒斯`,relation:`直接传承`,shared:`以一种可经验材料统一自然。`,difference:`泰勒斯主要给出水这一答案；阿那克西美尼进一步说明材料如何沿连续过程发生转化。`},{target:`阿那克西曼德`,relation:`直接传承`,shared:`世界从单一、持续的来源自然演化。`,difference:`阿那克西曼德用无规定来源避免元素偏向；阿那克西美尼用气兼顾中性、可见证据和变化机制。`},{target:`赫拉克利特`,relation:`同题比较`,shared:`都把世界看成一种材料的持续转化。`,difference:`阿那克西美尼以疏密序列解释物质；赫拉克利特以火、交换、对立张力解释更普遍的过程秩序。`}],russellView:`罗素认为阿那克西美尼不如阿那克西曼德有趣，却承认他取得了重要进展：火是稀释的气，气凝聚后依次成为水、土、石，因此物质之间的差异被处理为凝聚程度的数量差异。罗素同时提醒，古代人对他的评价反而高于阿那克西曼德，说明哲学史中的重要性排序本身会变化。`,modernCorrection:`罗素把理论概括为“差异完全是数量的”，便于理解但略显现代化。更稳妥的说法是：阿那克西美尼首次留下了以疏密过程统一解释质变的清晰见证。吹气冷热的观察是否真是他的论证，以及具体宇宙模型的归属，仍需保留证据等级。`,sources:[se(`第一卷第二章〈米利都学派〉`),{label:`Stanford Encyclopedia · Presocratic Philosophy`,kind:`补充`,url:`https://plato.stanford.edu/entries/presocratics/`},{label:`Internet Encyclopedia of Philosophy · Anaximenes`,kind:`补充`,url:`https://iep.utm.edu/anaximenes/`}]},{id:`pythagoras`,order:4,nameZh:`毕达哥拉斯`,nameEn:`Pythagoras`,greekName:`Πυθαγόρας`,dates:`约前 570—前 490`,active:`约前 530—前 500`,places:[`萨摩斯`,`克罗顿`,`梅塔蓬图姆`],school:`毕达哥拉斯传统`,figureId:`pythagoras`,chapterIds:[`b1-03`],thesis:`哲学不只是解释世界，也是一种净化灵魂的共同生活；数与和谐后来成为这条传统理解宇宙秩序的核心语言。`,evidenceCaution:`毕达哥拉斯本人没有留下著作，早期见证稀少，完整传记晚出数百年。灵魂轮回与生活规则较可能属于本人；“万物是数”、定理和完整宇宙论多半属于后来的学派。`,lifeSummary:`毕达哥拉斯出生于爱琴海的萨摩斯岛，约四十岁时迁往南意大利的克罗顿。罗素把迁徙放在僭主波利克拉底统治和萨摩斯—米利都商业竞争中理解；现代研究可以确认迁居克罗顿，却不能确认所有政治动机与埃及旅行。他在那里建立以饮食禁忌、仪式、自律和共同生活为特点的团体，吸引男女追随者，并可能卷入南意大利城邦政治。反毕达哥拉斯运动后来攻击这些团体；传统称他最终逃往梅塔蓬图姆并在那里去世。`,timeline:[{date:`约前 570`,place:`萨摩斯`,title:`出生`,detail:`出生于富裕而航海活跃的岛屿城邦；父亲与早年经历的记载互相冲突。`,certainty:`推定`},{date:`约前 530`,place:`萨摩斯 → 克罗顿`,title:`迁往南意大利`,detail:`约四十岁移居克罗顿并开始主要活动；罗素认为他厌恶波利克拉底的僭政。`,certainty:`较可靠`},{date:`前 530—500`,place:`克罗顿`,title:`建立共同体`,detail:`团体以灵魂命运、宗教仪式、饮食纪律和共同生活闻名，并对当地政治产生影响。`,certainty:`较可靠`},{date:`约前 500—490`,place:`克罗顿／梅塔蓬图姆`,title:`政治反扑与去世`,detail:`南意大利发生反毕达哥拉斯运动；个人逃亡与死亡细节来自较晚传统。`,certainty:`传统记载`}],inquiries:[{object:`灵魂与生活方式`,question:`人的灵魂如何摆脱死亡与反复投生的循环？`,start:`灵魂并不随身体死亡，而会进入其他人或动物；所有有生命者因此具有亲缘关系。`,steps:[`承认灵魂不朽与轮回`,`把日常饮食、仪式和欲望纳入灵魂后果`,`以记忆、自律和群体规则净化生活`,`把哲学变成持续操练而非单次知识`],conclusion:`好生活的目标是改善灵魂命运。哲学首次鲜明地成为一种可加入、可实践、可传承的生活制度。`},{object:`数、音乐与秩序`,question:`为什么感性和谐能够由精确关系表达？`,start:`音乐协和与简单整数比之间存在稳定联系；几何证明又呈现不依赖个别观察的确定性。`,steps:[`从和弦与比例发现可重复关系`,`把数视为结构而非只用于计数`,`由局部比例推想宇宙也有和谐秩序`,`把数学沉思解释为灵魂净化的最高活动`],conclusion:`在毕达哥拉斯传统中，真实秩序更接近数、比例和形式。必须注意：这一完整推导主要属于后世学派，不能全部归给本人。`},{object:`知识与人生等级`,question:`求知是控制世界的工具，还是一种独立的生活价值？`,start:`观看竞技者既不交易也不争胜，只为理解发生了什么。`,steps:[`区分逐利者、竞争者和观看者`,`把无利害的观看提升为沉思`,`把沉思与数学的确定、和谐相连`,`让理论生活获得高于政治行动的地位`],conclusion:`罗素据此解释西方传统中“理论高于实践、理性高于感官”的长久倾向，并同时批评它带来的形而上学偏见。`}],concepts:[{zh:`灵魂轮回`,en:`metempsychosis`,definition:`灵魂在不同生命形态中迁移；生命共同亲缘、饮食禁忌与净化实践由此获得统一理由。`},{zh:`毕达哥拉斯式生活`,en:`Pythagorean way of life`,definition:`由共同体、仪式、饮食、自律和学习构成的生活方案；比任何单条数学命题更可靠地属于早期传统。`},{zh:`和谐`,en:`harmonia`,definition:`不同部分依比例结合形成秩序。音乐中的整数关系使“可听见的美”与“可理解的数”发生连接。`},{zh:`理论／沉思`,en:`theōria`,definition:`以理解而非利益或竞争为目的的观看生活。罗素把它视为数学、哲学和后来神学共同抬高的理想。`}],lineage:{inherited:`罗素强调俄耳甫斯宗教的净化、轮回和共同体传统；也提到南意大利与爱奥尼亚知识交流。现代研究对具体借用关系更谨慎。`,school:`“毕达哥拉斯主义”跨越多个世纪。早期宗教生活、五世纪菲洛劳斯的宇宙论、阿尔库塔斯的数学不能无差别地写回创始人。`,influenced:`菲洛劳斯与阿尔库塔斯把传统发展为数学宇宙论；柏拉图吸收数、形式、灵魂与沉思理想，经他影响新柏拉图主义和基督教哲学。`,parallel:`与米利都学派同样追求宇宙统一，却把稳定性放在形式关系而非物质本原；与后世宗教修会共享生活纪律，但不存在简单直接的组织继承。`},comparisons:[{target:`米利都学派`,relation:`同题比较`,shared:`都寻找现象背后的统一秩序。`,difference:`米利都从可观察物质与生成机制出发；毕达哥拉斯传统把数、灵魂和净化生活放到中心。`},{target:`赫拉克利特`,relation:`批评关系`,shared:`都认为零散见闻不足以构成智慧。`,difference:`赫拉克利特点名批评毕达哥拉斯“多闻而无理解”；他以逻各斯和对立秩序取代知识收藏与宗教权威。`},{target:`柏拉图`,relation:`直接传承`,shared:`数学训练、灵魂不朽和超越感官的秩序。`,difference:`柏拉图用理念论、辩证法和政治哲学重组这些资源，不能把成熟柏拉图体系倒推给毕达哥拉斯。`}],russellView:`罗素把毕达哥拉斯称为思想史上影响最巨大的人之一：演绎数学、神秘主义与沉思伦理在他身上结合，使数学确定性成为哲学的理想。罗素一方面赞赏纯数学和无利害求知，另一方面认为由此产生了“思想高于感官”的错误形而上学倾向。他的叙述极有结构力量，但把很多后世学派成就集中到个人名下。`,modernCorrection:`现代研究把“毕达哥拉斯问题”放在首位：较早证据能支持灵魂轮回、仪式专家和严格生活方式，却没有证据证明本人提出勾股定理、建立成熟数学证明体系或完整宣称“万物是数”。页面因此保留罗素的影响史判断，同时把个人、早期共同体和后世学派分层。`,sources:[se(`第一卷第三章〈毕达哥拉斯〉`),{label:`Stanford Encyclopedia · Pythagoras`,kind:`补充`,url:`https://plato.stanford.edu/entries/pythagoras/`},{label:`Internet Encyclopedia · Presocratics / Pythagoras`,kind:`补充`,url:`https://iep.utm.edu/presocra/`}]},{id:`heraclitus`,order:5,nameZh:`赫拉克利特`,nameEn:`Heraclitus of Ephesus`,greekName:`Ἡράκλειτος`,dates:`约前 540—前 480`,active:`约前 500 年前后`,places:[`以弗所`,`爱奥尼亚`],school:`爱奥尼亚哲学／独立思想家`,figureId:`heraclitus`,chapterIds:[`b1-04`],thesis:`世界的稳定不是排除变化，而是由受逻各斯约束的转化和对立张力维持；有些事物正因为持续更新才能保持同一。`,evidenceCaution:`生平轶事大多是后人从格言反推的传说。作品只以约百余条残篇保存，语句刻意含混；“万物流变”等著名标签也主要经过柏拉图和后世解释。`,lifeSummary:`赫拉克利特生活在爱奥尼亚城邦以弗所，约于前 500 年前后活跃。该城位于波斯帝国西缘，拥有古老贵族、公共祭祀和商业网络。罗素只较有把握地说他是以弗所的贵族公民；关于他让出世袭职位、隐居山中和特殊死法的故事都很晚。他的残篇提到城邦放逐赫尔摩多罗斯，并表现出对群众政治、诗人和前辈知识权威的强烈蔑视。作品可能曾作为一部散文书流传，但我们只能通过其他作者的引用重建其排列和论证。`,timeline:[{date:`约前 540`,place:`以弗所`,title:`出生于贵族家庭`,detail:`家世与具体年份来自后世传统；贵族背景与其残篇中的政治语气相符，但不可写成完整履历。`,certainty:`推定`},{date:`6 世纪末`,place:`以弗所`,title:`城邦政治冲突`,detail:`残篇谴责公民放逐赫尔摩多罗斯，显示他与民主多数及地方政治发生尖锐冲突。`,certainty:`较可靠`},{date:`约前 500`,place:`以弗所`,title:`著作与思想活动`,detail:`写作涉及宇宙、知识、伦理和政治，以格言、悖论、双关和意象迫使读者主动理解。`,certainty:`较可靠`},{date:`5 世纪初`,place:`以弗所 → 雅典（思想传播）`,title:`克拉底鲁传播其思想`,detail:`克拉底鲁把极端流变解释带到雅典，影响青年柏拉图；这已是接受史而非赫拉克利特本人生平。`,certainty:`传统记载`}],inquiries:[{object:`变化与同一`,question:`如果组成材料不断替换，一个事物为何仍能保持自身？`,start:`河流、火焰和生命都持续更换材料，却能维持可识别的结构。`,steps:[`观察材料的连续流入与流出`,`区分低层材料与高层关系结构`,`把变化理解为维持结构的必要条件`,`以尺度和交换说明过程不会任意失控`],conclusion:`同一与变化并非简单互斥：河流之所以仍是那条河，恰因为新水持续流入。赫拉克利特不必被理解为“一切都乱变”。`},{object:`对立与秩序`,question:`冲突为什么不只破坏秩序，反而能够构成秩序？`,start:`弓与琴依靠反向拉力保持功能；昼夜、醒睡、冷热也通过互换被理解。`,steps:[`对立项互相规定意义`,`它们在不同时间、对象或角度出现`,`张力产生运动、功能与和谐`,`没有对立，世界只剩无差别的静止`],conclusion:`对立者不是逻辑上同时同义，而是在一个转换系统中相互依赖。“争斗”是结构关系，不只是政治暴力的赞美。`},{object:`知识与逻各斯`,question:`人怎样从零散经验进入对整体秩序的理解？`,start:`多数人拥有见闻、诗歌和仪式，却像睡着一样只生活在私人世界。`,steps:[`感官提供材料但不自动给出理解`,`寻找在众多变化中共同有效的说明`,`按每一事物的本性区分并连接`,`让个人判断服从共同的逻各斯`],conclusion:`智慧不是知道很多，而是把经验组织成一个共同、可说明的秩序。其格言写法本身就是让读者完成连接的训练。`}],concepts:[{zh:`逻各斯`,en:`logos`,definition:`兼有言说、说明、比例和共同秩序之意。它不是赫拉克利特私人意见，而是人可能理解却经常忽略的世界结构。`},{zh:`流变`,en:`flux`,definition:`事物材料与状态持续转化。现代解释强调：变化并非摧毁一切稳定，有些稳定正由规律更新维持。`},{zh:`对立统一`,en:`unity of opposites`,definition:`对立状态在时间、关系和功能系统中互相依存，不等于同一事物在同一方面同时具有矛盾性质。`},{zh:`火与交换`,en:`fire and exchange`,definition:`火既是元素意象，也是转化过程的模型；万物按尺度交换，整体数量和秩序在变化中保持。`},{zh:`争斗`,en:`strife`,definition:`差异力量的张力与轮替，是生成多样性和功能秩序的条件。罗素把它连接到黑格尔辩证法的远源。`}],lineage:{inherited:`延续米利都学派对自然内部秩序的追问，也继承阿那克西曼德的对立与宇宙正义语言；但他把讨论扩展到知识、伦理和政治。`,school:`没有证据表明他建立了制度化学派。后来的“赫拉克利特派”主要由接受者构成，克拉底鲁的极端流变也不能自动等同于本人。`,influenced:`克拉底鲁把其思想带给柏拉图；柏拉图用流变解释感性世界，斯多葛派吸收火、逻各斯和宇宙秩序。黑格尔及现代过程哲学又把他重构为变化与对立的先驱。`,parallel:`巴门尼德同样追问变化、存在和可靠知识，却从“不可思者不可存在”走向不变存在；两人常被并列为同一问题的极端答案，直接互相影响并无定论。`},comparisons:[{target:`阿那克西曼德`,relation:`同题比较`,shared:`对立力量和尺度共同形成宇宙秩序。`,difference:`阿那克西曼德把越界视为需补偿的不正义；赫拉克利特更激进地说争斗本身就是正义与生成条件。`},{target:`巴门尼德`,relation:`同题比较`,shared:`都不满足于感官表面，要求理性说明变化与存在。`,difference:`赫拉克利特在转换关系中寻找稳定；巴门尼德以存在的可思性排除真正的生成和消灭。`},{target:`克拉底鲁／柏拉图`,relation:`后世重构`,shared:`感性事物处于变化之中。`,difference:`克拉底鲁把流变推向无法稳定命名；柏拉图再以不变理念补足知识对象，这未必是赫拉克利特本人的结论。`},{target:`黑格尔`,relation:`后世重构`,shared:`对立不是外部事故，而参与构成发展。`,difference:`黑格尔建立概念辩证体系与历史逻辑；赫拉克利特留下的是格言式的宇宙、伦理和认识论联系。`}],russellView:`罗素把赫拉克利特描述为贵族式、骄傲而带有神秘主义色彩的思想家。他依次突出火、流变、对立融合和宇宙正义，并认为其中含有黑格尔哲学的萌芽。罗素尤其关心变化为什么令人寻求永恒，由此把赫拉克利特放进西方哲学“时间世界与永恒世界”的长期张力中。`,modernCorrection:`罗素沿用柏拉图以来“普遍流变”的强解释，也倾向把火当作与泰勒斯之水相似的基本物质。现代研究提出更细的读法：河流通过材料更新保持结构；对立项在不同关系和时间中相连，并非违反不矛盾律；火可能更重要地表示受尺度约束的交换过程。`,sources:[se(`第一卷第四章〈赫拉克利特〉`),{label:`Stanford Encyclopedia · Heraclitus`,kind:`补充`,url:`https://plato.stanford.edu/entries/heraclitus/`},{label:`Internet Encyclopedia of Philosophy · Heraclitus`,kind:`补充`,url:`https://iep.utm.edu/heraclit/`}]},{id:`parmenides`,order:6,nameZh:`巴门尼德`,nameEn:`Parmenides of Elea`,greekName:`Παρμενίδης`,dates:`约前 515—前 450`,active:`前 5 世纪前期`,places:[`埃利亚`,`大希腊`],school:`埃利亚学派`,figureId:`parmenides`,chapterIds:[`b1-05`],thesis:`思想和言说若要有所指，就不能以“非存在”为对象；由此，真正的存在不能生成、消灭、分割或移动。哲学第一次以论证条件强力约束宇宙论。`,evidenceCaution:`一首六步格哲学诗约保存一百六十行，生平则几乎只有后世记载。柏拉图笔下他在雅典与苏格拉底相见的时间线可能是文学设计；“完全否认经验世界”也只是众多解释之一。`,lifeSummary:`巴门尼德出生于南意大利的希腊殖民城埃利亚。该城由躲避波斯扩张的福凯亚人建立，处在爱奥尼亚知识传统与大希腊宗教—政治网络的交汇处。后世说他为城邦制定法律，也把他与色诺芬尼或毕达哥拉斯传统相连，但直接师承难以确认。他写过一首后来通称《论自然》的哲学诗：叙述者乘车抵达女神之门，先学习“真理之路”，再听取凡人的宇宙解释。罗素把他视为形而上学与逻辑论证的重大起点；现代研究则更重视诗中并未被简单抛弃的自然研究。`,timeline:[{date:`约前 515`,place:`埃利亚`,title:`出生`,detail:`年代主要由柏拉图对话中的戏剧日期反推；对话本身并非可靠编年记录。`,certainty:`推定`},{date:`前 5 世纪前期`,place:`埃利亚`,title:`写作哲学诗`,detail:`作品以神圣启示的旅程开场，却在核心部分使用连续推理考察“存在”必须具有什么属性。`,certainty:`较可靠`},{date:`前 5 世纪`,place:`埃利亚`,title:`立法者传统`,detail:`斯彪西波等后世作者称他为埃利亚制定法律；当地每年要求官员遵守“巴门尼德法律”的说法无法独立核验。`,certainty:`传统记载`},{date:`约前 450`,place:`雅典（柏拉图叙事）`,title:`与青年苏格拉底论辩`,detail:`柏拉图让年老的巴门尼德与芝诺访问雅典；这一场景首先服务于理念论批判，不宜直接当作旅行事实。`,certainty:`传统记载`}],inquiries:[{object:`思想、言说与存在`,question:`一条可被认识的探究道路，最低限度必须满足什么条件？`,start:`人可以思考和说出“是”；但若声称研究“不是”，研究对象就在被指认时取消了自身。`,steps:[`区分‘是’与‘不是’两条道路`,`指出非存在不可被认识或说出`,`禁止用非存在说明存在`,`把可思性当作宇宙论必须遵守的逻辑门槛`],conclusion:`可靠探究只能沿着“存在”展开。这里的关键不是先观察世界，再列材料，而是先检查一个解释是否自相矛盾。`},{object:`生成、消灭与运动`,question:`若存在不能来自非存在，它还能真正生成或改变吗？`,start:`生成意味着先前不存在；消灭意味着后来不再存在。二者都要求把非存在写进解释。`,steps:[`排除从无到有与从有到无`,`排除存在内部的空缺和断裂`,`由连续性推出不可分`,`由完整性推出不动、均一和无始无终`],conclusion:`“真正存在者”是不生不灭、完整连续、同质而不动的。经验变化若仍要被说明，就必须重新定义而不能诉诸无中生有。`},{object:`凡人意见与宇宙论`,question:`严格的存在论之后，为什么诗还要详细说明光、夜、天体和生命？`,start:`女神在真理之后转述凡人以光和夜组织世界的解释，并建立相当完整的宇宙生成图景。`,steps:[`承认人类经验以相反性质分类`,`用光与夜的混合排列现象`,`说明天体、性别与生命生成`,`把可接受的经验模型置于更高逻辑约束之下`],conclusion:`“意见”不必等于毫无价值的谬误；它可能是无法达到存在论确定性、却仍有系统性的自然解释。其地位是现代研究的核心争议。`}],concepts:[{zh:`存在者`,en:`what-is / to eon`,definition:`能够被思想和言说的对象；在真理之路上表现为不生不灭、连续、均一、完整而不动。`},{zh:`非存在`,en:`what-is-not`,definition:`不能被认识、陈述或充当生成来源的“不是”。巴门尼德用它检验解释是否偷偷依赖虚无。`},{zh:`真理之路`,en:`Way of Truth`,definition:`从“存在必定是，非存在不是”出发，以必要推论限定真实结构的探究道路。`},{zh:`凡人意见`,en:`Opinions of Mortals / doxa`,definition:`以光与夜等对立原则解释经验宇宙的部分；它与真理的关系可能是错误、次级模型或对现象的最佳说明。`}],lineage:{inherited:`继承爱奥尼亚自然哲学的宇宙整体问题，也可能接触毕达哥拉斯式宗教语言；但他的决定性变化是让解释先接受可思与可说条件的审查。`,school:`后世把巴门尼德、芝诺和麦里梭归为埃利亚学派。共同点是捍卫存在的统一与不变，并用论证揭露运动、多与分割的困难。`,influenced:`恩培多克勒、阿那克萨哥拉和原子论者都保留“不真正生成或毁灭”的约束，再以混合、分离或重排挽救经验变化；柏拉图和亚里士多德则把存在问题发展为体系性的本体论。`,parallel:`赫拉克利特同样寻找变化背后的可靠秩序；两人常被塑造成流变与静止的对立面，但是否直接互相批评并无定论。`},comparisons:[{target:`赫拉克利特`,relation:`同题比较`,shared:`都认为感官表象不足，世界必须有可理解的统一结构。`,difference:`赫拉克利特在有尺度的转换中保存同一；巴门尼德从可思性出发排除真实存在的生成和运动。`},{target:`芝诺`,relation:`直接传承`,shared:`以推论保护不变、统一的存在。`,difference:`巴门尼德正面说明存在的属性；芝诺多以反证展示承认运动与多会遭遇的悖论。`},{target:`恩培多克勒`,relation:`批评关系`,shared:`不允许存在真正产生或消失。`,difference:`恩培多克勒把不变性分配给四根，再用组合与分离解释可见变化。`},{target:`留基伯／德谟克利特`,relation:`批评关系`,shared:`保存基本存在者的不生不灭。`,difference:`原子论承认多个不可变原子，并把虚空作为运动条件，正面修正巴门尼德对非存在的禁令。`}],russellView:`罗素把巴门尼德与赫拉克利特并置为“万物变化”与“没有变化”两极。他尤其重建语言论证：凡能被思想或说出的东西必定存在，因此生成、消灭、运动和多样都不可能。罗素认为后来“实体”概念的历史任务，正是既向巴门尼德承认某种不变，又给经验变化留下空间。`,modernCorrection:`现代研究不再轻易把整首诗压缩成“现实只是一个静止球体”。作品保存了相当完整的宇宙论，并可能区分必要真理与现象模型，而非简单宣布自然研究无意义。“存在”究竟指唯一实体、必然存在方式，还是任何成功探究的对象，也仍存在严格一元论、模态解释等竞争读法。`,sources:[se(`第一卷第五章〈巴门尼德〉`),{label:`Stanford Encyclopedia · Parmenides`,kind:`补充`,url:`https://plato.stanford.edu/entries/parmenides/`},{label:`Internet Encyclopedia of Philosophy · Parmenides`,kind:`补充`,url:`https://iep.utm.edu/parmenid/`}]},{id:`empedocles`,order:7,nameZh:`恩培多克勒`,nameEn:`Empedocles of Acragas`,greekName:`Ἐμπεδοκλῆς`,dates:`约前 494—前 434`,active:`前 5 世纪中叶`,places:[`阿克拉加斯`,`西西里`,`大希腊`],school:`多元论自然哲学`,figureId:`empedocles`,chapterIds:[`b1-06`],thesis:`没有东西真正生成或消灭；四种永久的“根”在爱与争的作用下混合、分离，生命、感知和宇宙历史都是同一组关系的不同尺度。`,evidenceCaution:`作品以残篇和斯特拉斯堡纸草保存，传统上分为《论自然》与《净化》，但究竟是一部还是两部作品仍有争议。民主政治、治病神迹和跳入埃特纳火山等故事多来自晚期传记。`,lifeSummary:`恩培多克勒来自西西里富裕强盛的希腊城邦阿克拉加斯，生活在僭主政治瓦解、民主制度竞争及希腊人与迦太基势力长期对峙的环境中。古代传统称其家族有政治地位，他反对僭主或寡头、拒绝王位，也以医生、诗人、宗教教师和演说家著称；这些形象彼此交叠，却不能都当作可靠事件。他用诗歌同时讨论宇宙、生命、知觉、轮回和净化。比起把“科学”和“神秘”看成两个人格，更有效的理解是：同一个混合—分离宇宙论，也被用来说明身体和灵魂的命运。`,timeline:[{date:`约前 494`,place:`阿克拉加斯`,title:`出生`,detail:`出生于有影响力的家族是古代传统；具体年份由后世编年推定。`,certainty:`推定`},{date:`前 5 世纪中叶`,place:`阿克拉加斯`,title:`政治活动`,detail:`被描述为民主派、反僭主并曾解散寡头组织；故事可能保存历史记忆，也可能用来塑造哲人形象。`,certainty:`传统记载`},{date:`约前 450—前 430`,place:`西西里／大希腊`,title:`诗歌、医学与教学`,detail:`残篇把四根、爱与争、身体构造、知觉、轮回和净化放入相连的思想工程。`,certainty:`较可靠`},{date:`约前 434`,place:`地点不详`,title:`死亡与火山传奇`,detail:`亚里士多德传统说他约六十岁去世；跳入埃特纳火山以证明神性的故事是著名却不可靠的后世传奇。`,certainty:`推定`}],inquiries:[{object:`变化与基本成分`,question:`接受巴门尼德“不生不灭”的约束后，日常生成与毁灭怎样可能？`,start:`若从无到有不可能，就不能说木头、身体或世界被真正创造；但经验又显示事物不断出现和消失。`,steps:[`把生成改写为成分结合`,`把毁灭改写为成分分离`,`设定火、气、水、土四根永久平等`,`以比例差异解释不同物体与组织`],conclusion:`变化发生在关系与配比层，不发生在基本成分自身。四根像有限字母，能写出多种但并非任意的自然结构。`},{object:`宇宙运动与历史`,question:`不变成分为什么会组合和分开，并形成有方向的宇宙阶段？`,start:`只列四种材料仍不能解释它们为何运动、何时混合、何时分离。`,steps:[`以爱推动相异成分结合`,`以争推动成分分离`,`二力的相对优势周期变化`,`由完全融合的圆球到分离世界，再向相反方向循环`],conclusion:`爱与争是跨尺度的动力关系：它们不是简单的道德善恶，而使宇宙、身体和政治联结成周期性的结构。`},{object:`生命、感知与净化`,question:`同一套物理原则能否解释器官、认识与人的生活规范？`,start:`身体由四根混合，感觉器官与对象必须通过孔隙和流出物发生匹配；生命又被描述为流亡神灵的轮回。`,steps:[`让器官比例决定其功能`,`以流出物进入相合孔隙解释感觉`,`以‘同类认识同类’连接身体与对象`,`把杀生、饮食和轮回放进共同生命的宇宙亲缘`],conclusion:`自然论与净化论都反对绝对断裂：身体、动物、植物和宇宙共享材料与循环；伦理要求因而获得宇宙论背景。`}],concepts:[{zh:`四根`,en:`four roots`,definition:`火、气、水、土四种平等、不生不灭的基本成分。后世称“四元素”，但“根”更能显示其生成多样结构的功能。`},{zh:`爱`,en:`Love / Philotēs`,definition:`使不同成分结合、趋向统一的宇宙力量；不等于日常情感，也不在所有阶段都只产生良好结果。`},{zh:`争`,en:`Strife / Neikos`,definition:`使混合物分解、相同成分聚集的力量；与爱相互消长，不能简单归结为纯粹邪恶。`},{zh:`宇宙循环`,en:`cosmic cycle`,definition:`爱与争轮流占优，使世界在融合、分离及重新结合之间演化；循环究竟包含一个还是两个完整宇宙生成过程仍有争论。`},{zh:`流出物与孔隙`,en:`effluences and pores`,definition:`对象发出的微粒进入器官中相合的孔隙，由此解释感知、吸引与部分身体过程。`}],lineage:{inherited:`接受巴门尼德关于真正存在者不生不灭的限制，也继承毕达哥拉斯—俄耳甫斯传统的轮回与净化问题，并吸收西西里医学和自然观察。`,school:`通常与阿那克萨哥拉并列为前苏格拉底多元论者：不再寻找单一变化材料，而以多个永久成分的重排保存经验世界。`,influenced:`四元素框架经柏拉图、亚里士多德和希波克拉底医学长期延续；爱与争、孔隙感知和生物组合也成为后世自然哲学的反复参照。`,parallel:`阿那克萨哥拉同样把生成改为混合和分离，却拒绝只有四种基本材料；原子论则把成分简化为形状不同但无性质差异的原子。`},comparisons:[{target:`巴门尼德`,relation:`批评关系`,shared:`基本存在者不能从无生成或彻底消灭。`,difference:`巴门尼德将真实存在推向一与不动；恩培多克勒承认四种不变成分及其空间重组。`},{target:`阿那克萨哥拉`,relation:`同题比较`,shared:`以永久成分的混合和分离解释可见生成。`,difference:`恩培多克勒用四根及爱、争；阿那克萨哥拉主张无限多种成分，并以努斯启动旋转。`},{target:`德谟克利特`,relation:`同题比较`,shared:`宏观性质由更基本单位的组合方式产生。`,difference:`四根本身带有火水等性质，且受两种宇宙力支配；原子只以形状、次序和位置区别，在虚空中机械运动。`},{target:`达尔文`,relation:`后世重构`,shared:`不合适的生物组合消失、较能生存的结构留下。`,difference:`恩培多克勒没有遗传、种群与累积选择理论；其怪异肢体组合只是宇宙阶段中的自然生成模型。`}],russellView:`罗素把恩培多克勒写成哲学家、先知、科学家与“江湖术士”的奇特混合，既赞赏水钟实验、空气压力、离心力及植物性别等观察，也详细转述神性宣称和火山传奇。理论上，他突出四元素、爱与争以及循环宇宙，认为恩培多克勒在保存巴门尼德不变性的同时重新允许变化。`,modernCorrection:`“科学家与骗子并存”的肖像过度依赖晚期传记，也把现代学科边界投射到诗人身上。新纸草材料显示物理宇宙论与宗教净化可能比罗素设想得更紧密。四根不是现代化学元素，爱与争也兼具物理、心理和伦理语义；关于一个或两个宇宙生成过程尚无定论。`,sources:[se(`第一卷第六章〈恩培多克勒〉`),{label:`Stanford Encyclopedia · Empedocles`,kind:`补充`,url:`https://plato.stanford.edu/entries/empedocles/`},{label:`Internet Encyclopedia of Philosophy · Empedocles`,kind:`补充`,url:`https://iep.utm.edu/empedocl/`}]},{id:`anaxagoras`,order:8,nameZh:`阿那克萨哥拉`,nameEn:`Anaxagoras of Clazomenae`,greekName:`Ἀναξαγόρας`,dates:`约前 500—前 428`,active:`约前 462—前 432 在雅典`,places:[`克拉佐梅奈`,`雅典`,`兰普萨库斯`],school:`多元论自然哲学`,figureId:`anaxagoras`,chapterIds:[`b1-08`],thesis:`一切可见事物都由无限多种成分混合而成，并以某类成分占优势获得名称；独立而未混合的努斯启动旋转，使原始混合物逐渐分离成有序宇宙。`,evidenceCaution:`生平主要来自数百年后的传记，入雅典、审判与流亡的日期互有冲突。“种子”和“同质部分”常由后世术语反向概括；努斯究竟是目的因还是卓越的运动起点也长期有争议。`,lifeSummary:`阿那克萨哥拉出生于爱奥尼亚城邦克拉佐梅奈，成年后长期居住雅典，通常被视为把爱奥尼亚自然研究带入古典雅典的关键人物。他与伯里克利政治圈关系密切，古代传统还把欧里庇得斯列为学生。其自然解释把太阳说成炽热石块、月亮说成土质天体，并说明日月食；这些观点后来被联系到“不敬神”指控。审判究竟发生于何时、是否具有打击伯里克利的政治动机并不确定。他离开雅典后在小亚细亚的兰普萨库斯教学并去世，当地据说长期纪念他。`,timeline:[{date:`约前 500`,place:`克拉佐梅奈`,title:`出生`,detail:`来自富裕家庭、放弃产业求知的故事带有哲人传记模式；出生地较为确定。`,certainty:`推定`},{date:`约前 462`,place:`雅典`,title:`进入雅典知识与政治圈`,detail:`传统称他在雅典活动约三十年，并与伯里克利交往；准确起止日期有争议。`,certainty:`传统记载`},{date:`前 5 世纪中叶`,place:`雅典`,title:`自然论写作与教学`,detail:`以原始混合、无限可分、努斯旋转及天体自然解释建立一个从宇宙到感觉的系统。`,certainty:`较可靠`},{date:`约前 432—前 428`,place:`雅典 → 兰普萨库斯`,title:`受审、离开雅典并去世`,detail:`因太阳和月亮理论被控不敬神、后获伯里克利营救的叙事广为流传，但时间与细节无法确证。`,certainty:`传统记载`}],inquiries:[{object:`生成、混合与性质`,question:`若没有真正生成，一种食物为什么能长成血、骨、毛发等不同组织？`,start:`从面包和水中不可能凭空产生原先完全不存在的性质，因此成品的成分必须已经以微量存在。`,steps:[`否定绝对生成和消灭`,`设定原始状态中万物混在一起`,`主张任何混合物都含有各种成分`,`用占优势的成分说明事物为何被命名为金、肉或骨`],conclusion:`“一切在一切之中”不是说每物外观相同，而是没有纯粹隔绝的材料；可见性质来自混合比例和优势。`},{object:`努斯与宇宙秩序`,question:`若最初一切混合且静止，分离和秩序从何开始？`,start:`混合物自身没有明显理由打破均衡，也不能解释宇宙旋转为何具有可辨方向和层次。`,steps:[`把努斯规定为最精纯且不与他物混合`,`赋予它对万物的知识和支配力`,`由努斯启动局部旋转`,`旋转扩大并使稀密、冷热、明暗逐步分离`],conclusion:`努斯为秩序提供独立起点，但作品后续主要依靠碰撞、旋转和分离说明细节；它是否始终按目的安排宇宙仍有争议。`},{object:`天体、感觉与不可见结构`,question:`人怎样从有限感官推知巨大天体和微小成分？`,start:`太阳看似神圣圆盘、食物看似单一，感官却只呈现尺度有限的表面。`,steps:[`把太阳解释为炽热石块、月亮解释为土质天体`,`用遮蔽说明日月食`,`以相反性质的刺激解释感觉`,`由可见现象推断其中隐藏的成分和过程`],conclusion:`现象既会限制认识，也能成为通往不可见结构的线索；自然解释因此不必服从传统神话分类。`}],concepts:[{zh:`努斯`,en:`Nous / Mind`,definition:`唯一不与其他成分混合、具有知识与力量并启动宇宙旋转的原则；可译“心灵”或“理智”。`},{zh:`万物混合`,en:`everything in everything`,definition:`每个可分混合物中都含有各种类型的成分，没有绝对纯物；差异来自比例而非某种性质凭空出现。`},{zh:`优势原则`,en:`predominance`,definition:`一个对象按其中占优势的成分被感知和命名，因此少量其他成分可以存在而不改变其日常分类。`},{zh:`无限可分`,en:`infinite divisibility`,definition:`没有最小部分；无论取多小的量仍含有多种成分。这与原子论的不可分单位形成直接对照。`},{zh:`旋转`,en:`cosmic rotation`,definition:`由努斯启动、范围不断扩大的涡旋运动，使冷热、稀密等成分分离并形成天体和世界。`}],lineage:{inherited:`接受巴门尼德关于无中生有不可能的限制，也延续爱奥尼亚气象和天体研究；其长期雅典生活把两地的知识网络连接起来。`,school:`属于多元论者，但不把基本成分限制为四种，也不承认物质最小单位；其系统由无限混合物与独立努斯共同构成。`,influenced:`苏格拉底—柏拉图传统从努斯中期待目的论，却批评他实际多用机械原因；亚里士多德赞赏他把心灵与混合物分开，同时认为其使用不充分。`,parallel:`恩培多克勒用四根和两力解决同一变化难题；原子论同样依靠重排，却用不可分原子和虚空取代无限可分、万物互含的混合物。`},comparisons:[{target:`恩培多克勒`,relation:`同题比较`,shared:`不存在真正生成或毁灭，只有永久成分的混合与分离。`,difference:`恩培多克勒只有四根并由爱、争推动；阿那克萨哥拉承认无限多种成分，由努斯开启旋转。`},{target:`留基伯／德谟克利特`,relation:`同题比较`,shared:`物体性质取决于微观组成和排列过程。`,difference:`阿那克萨哥拉无限可分且一切互含；原子论设不可分原子，并允许真正空无的虚空。`},{target:`苏格拉底／柏拉图`,relation:`批评关系`,shared:`心灵应当与宇宙秩序有关。`,difference:`柏拉图笔下苏格拉底期待努斯说明何者最好，却发现阿那克萨哥拉主要诉诸空气、以太和机械运动。`},{target:`亚里士多德`,relation:`直接传承`,shared:`不能只列物质，还需说明运动和秩序来源。`,difference:`亚里士多德把目的、形式、动力和材料系统区分；阿那克萨哥拉的努斯更多承担最初运动与分离功能。`}],russellView:`罗素认为阿那克萨哥拉的原创性不及毕达哥拉斯、赫拉克利特或巴门尼德，但历史位置重要：他把哲学带到雅典，并首次明确提出心灵是主要原因。罗素同时沿用柏拉图和亚里士多德的批评——努斯启动旋转后很少出场，具体解释仍主要是物质和机械的。`,modernCorrection:`审判与流亡叙事受后期政治传记影响，不宜写成确定事实。“种子”和亚里士多德的“同质部分”也不能无条件当作本人技术词。现代解释更注意其彻底的无限主义：没有最小量，也没有纯物质；努斯虽启动秩序，却未必是按照人类价值选择“最好世界”的人格设计者。`,sources:[se(`第一卷第八章〈阿那克萨哥拉〉`),{label:`Stanford Encyclopedia · Anaxagoras`,kind:`补充`,url:`https://plato.stanford.edu/entries/anaxagoras/`},{label:`Internet Encyclopedia of Philosophy · Anaxagoras`,kind:`补充`,url:`https://iep.utm.edu/anaxag/`}]},{id:`leucippus`,order:9,nameZh:`留基伯`,nameEn:`Leucippus`,greekName:`Λεύκιππος`,dates:`约前 5 世纪`,active:`约前 440 年前后`,places:[`阿布德拉（传统归属）`,`米利都／埃利亚（不同传统）`],school:`古代原子论`,figureId:`leucippus`,chapterIds:[`b1-09`],thesis:`把巴门尼德式的不变存在拆分为无数不可分实体，并承认真正的虚空，从而让运动、分离和重组在不依赖生成毁灭的条件下成为可能。`,evidenceCaution:`留基伯是本批材料最薄弱的人物：出生地、生卒年、师承和著作归属都不确定，伊壁鸠鲁甚至否认其存在。多数古代证言仍把他列为德谟克利特老师及原子论创始者，但两人的学说通常无法逐条拆分。`,lifeSummary:`留基伯大概活动于前五世纪，传统分别把他的故乡说成米利都、埃利亚或阿布德拉。他常被安排在芝诺之后、德谟克利特之前：先理解埃利亚学派对运动与非存在的挑战，再提出原子和虚空作为回应。亚里士多德和泰奥弗拉斯托斯明确把原子论开端归给他，并说德谟克利特是其同伴或学生；但没有独立传记可重建旅行、政治交往或确切年代。题为《大宇宙系统》和《论心灵》的作品曾归于他，现仅存一句著名残言，且著作归属同样可能在原子论共同传统中移动。`,timeline:[{date:`前 5 世纪前半`,place:`米利都／埃利亚／阿布德拉`,title:`出身与活动地`,detail:`三个地点分别见于不同古代传统，无法据此选择一条确定迁移路线。`,certainty:`传统记载`},{date:`约前 440`,place:`阿布德拉`,title:`原子论形成`,detail:`相对年代来自他先于德谟克利特、又回应巴门尼德与芝诺问题的思想位置。`,certainty:`推定`},{date:`前 5 世纪`,place:`阿布德拉（传统归属）`,title:`与德谟克利特合作或师承`,detail:`后世通常称德谟克利特为学生，但两人可能代表一个难以拆分的研究传统。`,certainty:`传统记载`}],inquiries:[{object:`运动与虚空`,question:`若非存在不能存在、存在内部没有空缺，运动如何可能？`,start:`巴门尼德排除非存在，芝诺展示连续分割中的运动困难；经验却迫使解释保留运动与多。`,steps:[`接受基本存在者不生成、不毁灭`,`把存在者改为无数不可分实体`,`承认虚空以提供间隔和移动空间`,`用位置重排代替性质生成`],conclusion:`原子是“有”，虚空在某种意义上是“无”，但无也必须作为空间条件存在。原子论由此对埃利亚禁令作出最直接修正。`},{object:`因果与宇宙形成`,question:`没有设计者，原子运动怎样形成世界？`,start:`若原子和虚空足以解释变化，就不应在每个结果处再加入目的或神意。`,steps:[`设定原子在无限虚空中持续运动`,`不同形状与运动形成涡旋`,`碰撞、缠结与筛分产生复合体`,`让世界形成服从必然性而非预设目的`],conclusion:`现存残言称没有事物无缘无故发生，一切出于理由与必然；但具体机械模型多由留基伯—德谟克利特共同证言保存。`}],concepts:[{zh:`原子`,en:`atomon / indivisible`,definition:`不可切分、内部无空隙且本身不改变的微小实体；古代“不可分”是理论属性，不等于现代物理学原子。`},{zh:`虚空`,en:`void`,definition:`原子之间的空无间隔，使多、运动和重组成为可能；它是原子论对“非存在不能存在”的关键修正。`},{zh:`必然`,en:`necessity / anankē`,definition:`现象由原子先前的运动、碰撞和结构关系产生，而非为某种目的临时安排。`}],lineage:{inherited:`主要思想背景是巴门尼德和芝诺对非存在、分割与运动的限制；出生地传统又可能把他连接到米利都自然哲学。`,school:`古代原子论的创始层。留基伯与德谟克利特的文本、命题和声誉高度重叠，因此页面只把古代证言较一致的“创始角色”谨慎归给他。`,influenced:`德谟克利特把原子论扩展为宇宙、知觉、生命、文化与伦理的广泛系统；伊壁鸠鲁和卢克莱修后来调整原子运动并赋予其伦理目标。`,parallel:`恩培多克勒和阿那克萨哥拉都以不变成分重排回答巴门尼德，但只有原子论明确设定不可分单位和虚空。`},comparisons:[{target:`巴门尼德／芝诺`,relation:`批评关系`,shared:`基本存在者不生成、不消灭，并认真接受关于运动的逻辑困难。`,difference:`留基伯允许多个存在者和作为间隔的虚空，从而恢复运动；这正是埃利亚学派拒绝的条件。`},{target:`德谟克利特`,relation:`直接传承`,shared:`原子、虚空、机械运动与必然性构成共同理论。`,difference:`古代传统通常把发明归给留基伯、系统发展归给德谟克利特，但具体命题往往无法可靠分配。`},{target:`阿那克萨哥拉`,relation:`同题比较`,shared:`用微观重排而非真实生成解释宏观变化。`,difference:`阿那克萨哥拉坚持无限可分和万物互含；留基伯以不可分原子和空无间隔终止分割。`}],russellView:`罗素在“原子论者”一章把留基伯和德谟克利特合并处理，因为二人的思想很难分开。他把原子论视为前苏格拉底自然研究的高潮：既接受巴门尼德关于基本存在不变的洞见，又通过多个原子和虚空给经验变化以清晰机械解释。`,modernCorrection:`不能把共同原子论系统中的每一条命题都写成留基伯个人发现，也不能由伊壁鸠鲁的否认直接断言他是虚构人物。最稳妥的层级是：历史存在有较强古代见证；创始作用很可能真实；具体生平、书目以及与德谟克利特的分工则高度不确定。页面采用的版画是十八世纪后世想象，不是肖像记录。`,sources:[se(`第一卷第九章〈原子论者〉`),{label:`Stanford Encyclopedia · Ancient Atomism`,kind:`补充`,url:`https://plato.stanford.edu/entries/atomism-ancient/`},{label:`Internet Encyclopedia of Philosophy · Leucippus`,kind:`补充`,url:`https://iep.utm.edu/leucipp/`}]},{id:`democritus`,order:10,nameZh:`德谟克利特`,nameEn:`Democritus of Abdera`,greekName:`Δημόκριτος`,dates:`约前 460—前 370`,active:`前 5 世纪后半`,places:[`阿布德拉`,`雅典（传统记载）`,`埃及与东方（旅行传统）`],school:`古代原子论`,figureId:`democritus`,chapterIds:[`b1-09`],thesis:`真实层只有形状各异的原子与虚空；感官性质、生命和世界由原子的数量、排列与运动关系生成，而伦理上的安宁则来自调节欲望、判断与生活尺度。`,evidenceCaution:`著作目录庞大却几乎全失，现存残篇和后世摘要的真伪、分类常有争议。旅行范围与“笑的哲学家”形象高度传奇化；许多物理命题也只能归给留基伯—德谟克利特共同体系。`,lifeSummary:`德谟克利特出生于色雷斯海岸的希腊城邦阿布德拉，与苏格拉底大致同时，却因理论延续早期自然哲学而被罗素放在苏格拉底之前讨论。传统说他继承财产后广泛旅行至埃及、波斯甚至更远地区，又曾到雅典而无人认识；可靠程度不一，却反映其后来“博学研究者”的名声。他写作范围据说覆盖宇宙、数学、感觉、医学、语言、技术和伦理。雅典哲学传统很少直接保存其作品，亚里士多德却持续认真讨论他的理论。后世称他为“笑的哲学家”，把节制、愉悦与看透人事结合成一种人物图像。`,timeline:[{date:`约前 460`,place:`阿布德拉`,title:`出生`,detail:`古代编年分歧很大；可以较稳妥地把他视为苏格拉底的同时代人。`,certainty:`推定`},{date:`前 5 世纪后半`,place:`地中海东部（旅行传统）`,title:`旅行与学习`,detail:`埃及、巴比伦、波斯乃至印度的行程多由晚期材料扩大，不宜画成确定路线。`,certainty:`传统记载`},{date:`约前 430 后`,place:`阿布德拉`,title:`扩展原子论体系`,detail:`将原子和虚空应用于宇宙、感觉、心灵、生命与文化解释，并形成大量著作传统。`,certainty:`较可靠`},{date:`约前 370`,place:`阿布德拉`,title:`去世与接受史`,detail:`长寿、公众尊崇及“笑的哲学家”故事主要塑造后世形象；确切卒年未知。`,certainty:`推定`}],inquiries:[{object:`原子结构与宏观变化`,question:`只有不变原子和虚空，如何产生不同物体、性质与世界？`,start:`若原子内部没有差异性质，就必须让差异来自它们之间的可重复关系。`,steps:[`让原子只在形状、大小上不同`,`用次序和位置区分结构`,`以碰撞、缠结、排列形成复合体`,`以分散解释复合物消灭，并允许无限虚空中形成无数世界`],conclusion:`宏观生成是结构涌现：基本单位保持不变，关系却能产生密度、质地、天体和生命等多层现象。`},{object:`感觉与知识`,question:`若颜色、甜苦只由原子互动产生，感官还能提供真实吗？`,start:`同一食物对不同身体可能呈现不同味道，说明性质不只属于对象本身；但理性又必须从感觉获得材料。`,steps:[`让对象释放原子薄膜作用于器官`,`用原子形状与器官状态解释感觉差异`,`区分约定性的感官性质与原子、虚空的真实结构`,`承认理性若否定全部感官，也会摧毁自身证据`],conclusion:`知识具有层级而非简单二分：感官给出现象，理性推断其微观原因；两者相互依赖且都可能受身体条件限制。`},{object:`人的生活、文化与安宁`,question:`一个机械自然世界中，怎样形成可实践的好生活？`,start:`幸福若依赖财富、名声或无限欲望，就持续受外界偶然运动支配。`,steps:[`把愉悦与痛苦视为行动信号而非最高放纵`,`用衡量和节制限制欲望`,`让判断、习惯与教育重塑人的原子状态`,`以社会合作、技艺和语言解释人类从匮乏走向文化`],conclusion:`目标是“心灵安宁”或“愉悦的平衡”：不是逃离物质世界，而是在因果世界中通过理解与训练获得较稳定的生活结构。`}],concepts:[{zh:`原子`,en:`atoms`,definition:`实在、坚实、不可切分且不生不灭的单位；彼此主要以形状、大小、次序和位置区分。`},{zh:`虚空`,en:`void`,definition:`原子运动和彼此分离所需的空无空间；与原子共同构成现实的两个基本方面。`},{zh:`约定性质`,en:`qualities by convention`,definition:`颜色、声音、冷热、甜苦不是孤立原子自带的性质，而在原子结构与感知者身体互动时出现。`},{zh:`必然性`,en:`necessity`,definition:`自然事件由原子运动及先行条件产生，无须诉诸为人安排的目的；它不是宿命预言，而是因果连续性。`},{zh:`心灵安宁`,en:`euthymia / cheerfulness`,definition:`通过节制、衡量、知识和稳定判断获得的平衡愉悦；与后来伊壁鸠鲁的宁静相近但不能完全等同。`}],lineage:{inherited:`直接发展留基伯的原子与虚空，并通过这一框架回答巴门尼德和芝诺；同时延续爱奥尼亚传统以自然过程统一解释天体、生命与人。`,school:`古代原子论的第一位大型系统化者。其机械自然论与伦理残篇共同属于德谟克利特传统，但二者是否组成一个严格演绎体系尚不确定。`,influenced:`伊壁鸠鲁继承原子、虚空和感觉论，却修改原子运动并建立以解除恐惧为目的的共同体伦理；卢克莱修将其转化为拉丁哲学诗。近代机械哲学又把德谟克利特视为古代先驱。`,parallel:`阿那克萨哥拉以无限混合和努斯解释同一组变化问题；柏拉图、亚里士多德也讨论感知和物质结构，却反对把形式、目的与价值完全还原为碰撞。`},comparisons:[{target:`留基伯`,relation:`直接传承`,shared:`原子、虚空、涡旋和非目的性的自然解释。`,difference:`传统把基本创意归给留基伯，把广泛系统化归给德谟克利特；具体边界大多无法确定。`},{target:`阿那克萨哥拉`,relation:`同题比较`,shared:`宏观对象由不可见成分及其关系解释。`,difference:`阿那克萨哥拉的成分无限可分、每物含一切，并由努斯启动；德谟克利特的原子不可分，在虚空中按机械必然运动。`},{target:`柏拉图／亚里士多德`,relation:`批评关系`,shared:`自然应当具有可说明的结构，感觉不能直接等同于真实。`,difference:`二人要求形式、目的或善在解释中发挥作用；德谟克利特优先用原子位置、碰撞和身体状态说明现象。`},{target:`伊壁鸠鲁`,relation:`直接传承`,shared:`以原子论消除神意对自然事件的任意干预，并把认识连接到生活安宁。`,difference:`伊壁鸠鲁加入原子偏斜、强调自由和无恐惧，把物理学更明确地服务于治疗性伦理。`}],russellView:`罗素把德谟克利特视为前苏格拉底科学精神的顶峰，也是后来哲学开始退让给伦理与宗教之前的最后一位纯粹自然解释者。他赞赏原子论用坚实不可变的单位、虚空和机械碰撞统一解释变化，也指出其因果决定论、感觉理论和无穷世界设想具有惊人的现代感。`,modernCorrection:`把德谟克利特称为“现代科学家”会掩盖古代论证背景：原子首先回应存在、分割和运动问题，而非实验检测到的粒子；古代原子也不是今天可分的化学原子。其伦理学并非附带格言，而可能通过身体—心灵连续性与自然论相连，但现存文本不足以证明一套从物理必然推出伦理规范的完整体系。现用雕像亦为身份不明的希腊头像，只作视觉识别。`,sources:[se(`第一卷第九章〈原子论者〉`),{label:`Stanford Encyclopedia · Ancient Atomism`,kind:`补充`,url:`https://plato.stanford.edu/entries/atomism-ancient/`},{label:`Internet Encyclopedia of Philosophy · Democritus`,kind:`补充`,url:`https://iep.utm.edu/democrit/`}]}];Object.fromEntries(ce.map(e=>[e.id,e]));var T=(e,t,n,r,i,a=e)=>({id:e,nameZh:t,nameEn:n,figureId:a,chapterIds:r,relation:i}),le=[{id:`greek-origins`,title:`希腊哲学的形成`,years:`约前 600—前 450`,russellRange:`第一卷 · 前苏格拉底哲学（第 I—X 章）`,condition:`城邦、殖民贸易、字母书写与跨文化接触，使自然解释逐渐从神话叙事中分化出来。`,commonProblems:[`世界由什么构成？`,`变化如何可能？`,`理性与感官何者更可靠？`],contextChapterIds:[`b1-01`],schools:[{id:`milesian`,title:`米利都自然哲学`,english:`Milesian natural philosophy`,response:`以一种可理解的自然本原说明多样世界。`,sharedPattern:`寻找本原，并用连续的自然过程解释变化。`,chapterIds:[`b1-02`],philosophers:[]},{id:`pythagorean`,title:`毕达哥拉斯传统`,english:`Pythagorean tradition`,response:`把可见世界背后的秩序理解为数、比例与和谐。`,sharedPattern:`数学结构、宗教生活与灵魂观相互支撑。`,chapterIds:[],philosophers:[T(`pythagoras`,`毕达哥拉斯`,`Pythagoras`,[`b1-03`],`把数学秩序发展为一种生活与宇宙方案。`)]},{id:`becoming-being`,title:`生成与存在之争`,english:`Becoming and being`,response:`围绕变化与恒常的冲突，提出不同的本体论方案。`,sharedPattern:`用逻辑约束自然解释，再说明经验世界为何显得变化。`,chapterIds:[],philosophers:[T(`heraclitus`,`赫拉克利特`,`Heraclitus`,[`b1-04`],`把对立和流变理解为秩序本身。`),T(`parmenides`,`巴门尼德`,`Parmenides`,[`b1-05`],`以严格推理否定真正存在的生成和消灭。`),T(`empedocles`,`恩培多克勒`,`Empedocles`,[`b1-06`],`以不变元素的组合解释可见变化。`),T(`anaxagoras`,`阿那克萨哥拉`,`Anaxagoras`,[`b1-08`],`以心灵和种子说明秩序与差异。`)]},{id:`atomists`,title:`原子论`,english:`Atomism`,response:`以原子在虚空中的运动，同时保留不变存在与经验变化。`,sharedPattern:`机械因果、不可分微粒与组合解释。`,chapterIds:[`b1-09`],philosophers:[T(`leucippus`,`留基伯`,`Leucippus`,[`b1-09`],`以原子与虚空回应埃利亚学派对运动的限制。`),T(`democritus`,`德谟克利特`,`Democritus`,[`b1-09`],`把原子论扩展为自然、认识与伦理的系统。`)]},{id:`sophists`,title:`智者运动`,english:`Sophistic movement`,response:`把注意力从宇宙本原转向语言、公共判断和人的处境。`,sharedPattern:`论辩、修辞与相对主义的问题意识。`,chapterIds:[],philosophers:[T(`protagoras`,`普罗泰戈拉`,`Protagoras`,[`b1-10`],`以人的尺度重新界定知识与判断。`)]}]},{id:`classical-athens`, 小亚细亚西岸希腊地区，连接爱琴海与近东知识网络。`},{id:`athens-place`,zh:`雅典`,en:`Athens`,category:`地名`,note:`古典时期民主、修辞、戏剧和哲学学园的主要中心。`},{id:`alexandria`,zh:`亚历山大里亚`,en:`Alexandria`,category:`地名`,alternatives:[`亚历山大城`],note:`希腊化与罗马时期重要的图书、科学和多宗教思想中心。`},{id:`rome`,zh:`罗马`,en:`Rome`,category:`地名`,note:`既指城市，也常指共和国或帝国制度；语境需分别判断。`},{id:`milesian`,zh:`米利都学派`,en:`Milesian School`,category:`学派`,note:`用自然本原而非神话谱系解释世界的早期哲学传统。`},{id:`cynicism`,zh:`犬儒派`,en:`Cynics / Cynicism`,category:`学派`,note:`以减少需要和反习俗生活追求不受外物支配的自由。`},{id:`scepticism`,zh:`怀疑派`,en:`Sceptics / Scepticism`,category:`学派`,alternatives:[`怀疑主义`],note:`通过为相反判断提供理由并悬置断言，降低精神扰动。`},{id:`epicureanism`,zh:`伊壁鸠鲁派`,en:`Epicureans / Epicureanism`,category:`学派`,alternatives:[`伊壁鸠鲁主义`],note:`把快乐理解为无痛与宁静，以自然知识解除恐惧。`},{id:`stoicism`,zh:`斯多葛主义`,en:`Stoicism`,category:`学派`,alternatives:[`斯多葛派`],note:`强调德性、自然秩序、判断训练和内在自由。`},{id:`neoplatonism`,zh:`新柏拉图主义`,en:`Neoplatonism`,category:`学派`,note:`以太一、精神和灵魂的层级重新解释柏拉图传统。`},{id:`scholasticism`,zh:`经院哲学`,en:`Scholasticism`,category:`学派`,note:`中世纪大学中以问题、反对、回答和反驳组织知识的专业传统。`},{id:`rationalism`,zh:`理性主义`,en:`Rationalism`,category:`学派`,note:`以理性原则和演绎体系作为知识的重要基础。`},{id:`empiricism`,zh:`经验主义`,en:`Empiricism`,category:`学派`,note:`要求观念和知识最终说明其经验来源与证据。`},{id:`romanticism`,zh:`浪漫主义`,en:`Romanticism`,category:`学派`,note:`强调个性、情感、创造和自然，反抗机械理性与抽象秩序。`},{id:`utilitarianism`,zh:`功利主义`,en:`Utilitarianism`,category:`学派`,note:`按行动或制度对总体幸福的后果进行伦理评价。`},{id:`pragmatism`,zh:`实用主义`,en:`Pragmatism`,category:`学派`,note:`通过观念在经验、行动和共同探究中的作用理解意义与真理。`},{id:`analytic`,zh:`分析哲学`,en:`Analytic Philosophy`,category:`学派`,note:`重视逻辑、语言和概念澄清，反对含混的宏大体系。`},{id:`arche`,zh:`本原`,en:`archē / first principle`,category:`概念`,alternatives:[`始基`],note:`早期希腊哲学中万物由之生成或得到统一解释的根本原则。`},{id:`logos`,zh:`逻各斯`,en:`logos`,category:`概念`,alternatives:[`理则`,`道`],note:`可指言说、理由或秩序；在赫拉克利特和基督教语境中含义不同。`},{id:`non-being`,zh:`非存在`,en:`what-is-not / non-being`,category:`概念`,note:`巴门尼德认为它不能被认识或充当生成来源；原子论则以虚空重新处理“无”的地位。`},{id:`four-roots`,zh:`四根`,en:`four roots`,category:`概念`,note:`恩培多克
