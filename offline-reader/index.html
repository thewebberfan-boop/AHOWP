构成整体解释。`,difference:`柏拉图常以分离理念提供尺度；亚里士多德让形式内在于具体实体，并从现象和分类开始。`},{target:`德谟克利特`,relation:`批评关系`,shared:`自然现象应由稳定结构和因果说明。`,difference:`德谟克利特优先用原子、虚空和碰撞；亚里士多德认为材料与动力不足以解释形式、功能和目的。`},{target:`伊壁鸠鲁`,relation:`批评关系`,shared:`伦理围绕幸福、友谊和欲望管理。`,difference:`亚里士多德把幸福理解为德性活动并需要城邦参与；伊壁鸠鲁以无痛、宁静和退出权力竞争压缩需要。`},{target:`近代科学`,relation:`后世重构`,shared:`重视观察、分类、论证和原因。`,difference:`近代科学以数学实验和可修正模型替代其许多定性目的论；阻碍常来自后世权威化，不等于本人反对观察。`}],russellView:`罗素要求从前人与后人两面看亚里士多德：相对前人，他的分类、常识和系统建设功绩巨大；相对两千年权威化的后果，他的错误又成为进步障碍。罗素赞赏其中道伦理的成熟，却批评它偏向舒适的希腊绅士；也批判奴隶制辩护、目的论物理及主谓逻辑对实体观的长期束缚。`,modernCorrection:`把亚里士多德当作一部封闭‘体系大全’会掩盖现存文本的讲义性质、内部发展和合作研究背景。罗素有时把后世经院化责任过多归给本人，也用现代形式逻辑标准低估其逻辑问题的历史广度。另一方面，生物学中的目的说明不等于每个器官由人格设计者预先制造，须与神学设计论区分。`,sources:[M(`第一卷第十九至二十三章〈亚里士多德〉`),{label:`Stanford Encyclopedia · Aristotle`,kind:`补充`,url:`https://plato.stanford.edu/entries/aristotle/`},{label:`Internet Encyclopedia of Philosophy · Aristotle`,kind:`补充`,url:`https://iep.utm.edu/aristotle/`}]},{id:`diogenes`,order:15,nameZh:`第欧根尼`,nameEn:`Diogenes of Sinope`,greekName:`Διογένης ὁ Σινωπεύς`,dates:`约前 412／404—前 323`,active:`前 4 世纪中叶`,places:[`锡诺普`,`雅典`,`科林斯`],school:`犬儒主义`,figureId:`diogenes`,chapterIds:[`b1-26`],thesis:`自由不先来自拥有更多选择，而来自减少被财富、名望、礼俗和统治者控制的需要；哲学必须通过身体训练、公开直言和可见生活证明这一点。`,evidenceCaution:`没有可靠著作传世，材料主要来自数百年后的轶事集。住桶、白日提灯、与亚历山大会面及伪造钱币等故事具有强烈象征结构；它们适合说明犬儒理想，不等于可按日期还原的履历。`,lifeSummary:`第欧根尼来自黑海南岸希腊城锡诺普，因“毁坏／重铸货币”被放逐的传统可能同时象征他重估社会价值。到雅典后据说追随苏格拉底学生安提斯泰尼，但严格师承并不确定。他把街道、市场和公共建筑变成哲学场所，以极少财物、乞食、公开身体行为和尖锐答问挑战财富、体面与城邦身份。后期与科林斯关系密切，又有被海盗卖作奴隶后教育主人子女的故事。传说亚历山大许诺满足愿望时，他只要求对方不要挡住阳光；历史真实性有限，却准确压缩了权力与自足的关系。`,timeline:[{date:`约前 412／404`,place:`锡诺普`,title:`出生`,detail:`两个常见年代均来自后世编年；父亲从事钱币或银行事务的说法与放逐故事紧密相连。`,certainty:`推定`},{date:`前 4 世纪前期`,place:`锡诺普 → 雅典`,title:`因钱币事件流亡`,detail:`‘毁坏货币’可能是真实刑事背景，也可能是犬儒派‘重估习俗价值’的传记化寓言。`,certainty:`传统记载`},{date:`前 4 世纪中叶`,place:`雅典`,title:`把公共生活变成哲学训练`,detail:`以最少用品、直言和反羞耻表演暴露礼俗如何制造依赖；具体轶事多不可独立核验。`,certainty:`传统记载`},{date:`前 323`,place:`科林斯`,title:`去世`,detail:`与亚历山大同日去世是典型的象征性编排；地点和大致时代较可能，死因众说纷纭。`,certainty:`推定`}],inquiries:[{object:`需要、习俗与自由`,question:`如果幸福依赖财富、身份和他人认可，一个人还能真正自主吗？`,start:`社会不断把非必要欲望包装成生活条件，获得越多反而需要更多保护、迎合和服从。`,steps:[`区分自然必需与习俗制造的欲望`,`通过贫困和耐苦训练减少需要`,`公开打破无害却束缚人的羞耻规则`,`以自足换取对权势直言的能力`],conclusion:`犬儒自由是低依赖结构：需要越少，外部权力可用来交换服从的筹码越少。贫困在此是主动训练，不是赞美被迫匮乏。`},{object:`哲学表达与公开生活`,question:`理论若不改变日常动作，是否真的被理解？`,start:`学院论证可能在生活方式中不留下痕迹，甚至为奢侈和权力提供更精致的辩护。`,steps:[`让身体成为最直接的反例`,`以笑话、羞辱和悖论打断习惯`,`在市场而非封闭学校教学`,`把每次与权力相遇变成自足测试`],conclusion:`第欧根尼的‘论证’常是一次可见行动：它不证明完整形而上学，却迫使旁观者比较所宣称的善与实际依赖。`}],concepts:[{zh:`自足`,en:`autarkeia / self-sufficiency`,definition:`通过压缩欲望和训练身体降低对财富、社会地位及统治者的依赖，是犬儒自由的物质基础。`},{zh:`直言`,en:`parrhēsia / frank speech`,definition:`承担风险公开说真话；不是无代价的冒犯，而是只有不依附权势者较能实践的自由。`},{zh:`训练`,en:`askēsis`,definition:`以耐寒、简食、公开羞耻测试等反复练习重塑欲望，使哲学成为身体和习惯的能力。`},{zh:`世界公民`,en:`kosmopolitēs / citizen of the world`,definition:`拒绝把价值和归属完全锁定在出生城邦；它首先是对排他身份的否定，还不是现代国际法意义的公民权。`},{zh:`依自然而活`,en:`living according to nature`,definition:`让身体的有限需要而非习俗制造的名望、奢侈和羞耻决定生活；‘自然’在这里首先是一种批判尺度。`},{zh:`改铸通货`,en:`defacing the currency / paracharattein to nomisma`,definition:`既是流亡传说中的铸币事件，也是重新检验社会通行价值的犬儒比喻；历史事实与哲学象征须分开。`}],lineage:{inherited:`犬儒派自称继承苏格拉底的简朴、公开审问与灵魂优先，经安提斯泰尼传统进一步把德性从理论转成生活训练。`,school:`犬儒主义没有固定校园、课程或统一教义。第欧根尼、克拉特斯等以可复制的生活姿态构成松散传统，‘犬’既是侮辱也被重新占用。`,influenced:`克拉特斯影响斯多葛创始人芝诺；自足、顺应自然、直言和世界公民观念进入斯多葛主义，也在后世修道、政治批判中被反复重构。`,parallel:`庄子式逍遥与犬儒自足都批判社会价值倒置，但犬儒更依赖公共挑衅、身体训练和希腊城邦的直言政治。`},comparisons:[{target:`苏格拉底`,relation:`后世重构`,shared:`以生活和问答揭露财富、名望与自负。`,difference:`苏格拉底仍履行公民与家庭角色；第欧根尼把无家、贫困和反礼俗推进为公开训练。`},{target:`柏拉图`,relation:`批评关系`,shared:`都认为欲望和教育决定灵魂秩序。`,difference:`柏拉图设计长期制度和知识等级；第欧根尼以最低制度依赖和当场行动检验善。`},{target:`伊壁鸠鲁`,relation:`同题比较`,shared:`减少非自然欲望以获得独立和安宁。`,difference:`伊壁鸠鲁经营稳定友谊共同体并避开公共冲突；第欧根尼主动在公共空间制造冲突以揭露习俗。`},{target:`斯多葛主义`,relation:`影响后继`,shared:`自足、顺应自然、德性足以构成自由。`,difference:`斯多葛派建立逻辑、物理和角色义务体系；犬儒派轻视体系并以激进生活作为‘通往德性的捷径’。`}],russellView:`罗素把第欧根尼写成决定像狗一样生活、拒绝习俗并以最少需要获得自由的人。他欣赏犬儒主义在亚历山大时代提供的个人独立，却也区分早期严肃训练与后来‘犬儒’一词所含的消极不信和无所作为。其叙述大量借助住桶、提灯和亚历山大轶事。`,modernCorrection:`这些轶事应作为压缩理念的表演文本，而非可逐项验证的史实。犬儒主义也不等于现代所说“认为人人自私”的犬儒心态；它有明确的德性、自然与训练标准。公开身体行为并非简单反社会，而是在重新划分什么真正可耻：欲望奴役和灵魂失调比违反礼仪更可耻。`,sources:[M(`第一卷第二十六章〈犬儒派与怀疑派〉`),{label:`Internet Encyclopedia of Philosophy · Cynics`,kind:`补充`,url:`https://iep.utm.edu/cynics/`},{label:`Diogenes Laertius · Lives, Book VI`,kind:`补充`,url:`https://en.wikisource.org/wiki/Lives_of_the_Eminent_Philosophers/Book_VI`}]},{id:`pyrrho`,order:16,nameZh:`皮浪`,nameEn:`Pyrrho of Elis`,greekName:`Πύρρων`,dates:`约前 360—前 270`,active:`前 4 世纪末至前 3 世纪初`,places:[`埃利斯`,`亚洲远征路线（传统记载）`],school:`早期皮浪主义`,figureId:`pyrrho`,chapterIds:[`b1-26`],thesis:`事物本性无法由人的判断稳定把握，因此不应匆忙断言‘它本来就是如此’；不在相反判断之间强行选边，心灵便较少被得失和恐惧扰动。`,evidenceCaution:`皮浪本人没有著作，主要经学生蒂蒙和更晚作者认识。随亚历山大到印度、遇见裸身哲人以及车来不避等故事难以核验；后期塞克斯都的皮浪主义也不能完整倒推给早期皮浪。`,lifeSummary:`皮浪来自伯罗奔尼撒西部城邦埃利斯，可能早年从事绘画。传统说他随亚历山大远征东方，接触波斯贤者与印度裸身哲人后形成不执著判断的生活方式；是否实际发生及思想影响程度都有争议。返回埃利斯后，他通过生活示范而非写作教学，学生蒂蒙以诗和散文传播其形象。城邦据说授予他祭司身份并因他免除哲学家税赋，这些荣誉传统反映其并非彻底脱离日常共同体。晚期轶事把他写成连车辆和悬崖也不躲避的人，却与“依表象生活”的怀疑实践相矛盾。`,timeline:[{date:`约前 360`,place:`埃利斯`,title:`出生`,detail:`年代由后世编年推定；早年画家身份只有晚期材料支持。`,certainty:`推定`},{date:`前 334—前 324`,place:`亚历山大远征路线`,title:`东方旅行传统`,detail:`据说随远征接触波斯和印度思想者；旅行可能有历史核心，思想借用的具体内容无法确认。`,certainty:`传统记载`},{date:`前 4 世纪末`,place:`埃利斯`,title:`以生活示范教学`,detail:`本人不写作，蒂蒙等学生用格言和诗歌保存其关于事物、态度和安宁的三问结构。`,certainty:`较可靠`},{date:`约前 270`,place:`埃利斯`,title:`去世与地方荣誉`,detail:`长寿和祭司荣誉来自传记传统；可以较稳妥确认他在故乡形成持续声望。`,certainty:`推定`}],inquiries:[{object:`事物本性与判断`,question:`相反理由势均力敌时，人凭什么断言事物自身必定如此？`,start:`感觉、习俗和哲学论证不断冲突，我们获得的是事物如何显现，而不是不带关系的本性印章。`,steps:[`比较相反表象和理由`,`不把任何一方提升为无条件本性`,`保持判断不定或不加断言`,`仍按眼前表象与生活需要行动`],conclusion:`对超出表象的本性不作确定断言。早期皮浪究竟主张‘事物本性不确定’，还是只说我们无法确定，是重要解释争议。`},{object:`悬置与安宁`,question:`为什么减少断言会减少焦虑，而不是让人无法生活？`,start:`人不只受到疼痛和损失扰动，也因坚持某物绝对善恶而增加追逐、恐惧和失望。`,steps:[`识别价值判断中的过度确信`,`让相反理由形成平衡`,`停止强迫思想作最终裁决`,`依表象、习惯和即时能力处理生活`],conclusion:`悬置判断之后可能意外出现不动心。安宁不是先被证明的宇宙真理，而是放松教条执着后的实践结果。`}],concepts:[{zh:`悬置判断`,en:`epochē / suspension of judgment`,definition:`在理由无法决定时不肯定也不否定事物本性；它不是停止感知、说话或采取日常行动。`},{zh:`不动心`,en:`ataraxia / tranquility`,definition:`不被相反判断和对绝对得失的执着持续扰动；后期皮浪主义把它描述为悬置之后如影随形的结果。`},{zh:`表象`,en:`phainomena / appearances`,definition:`事物当下如何呈现。怀疑者可以承认‘蜂蜜显得甜’，而不进一步断言蜂蜜本性绝对甜。`},{zh:`无定性`,en:`indeterminacy`,definition:`早期证言中事物被说成无差别、不稳定或不可判定；究竟是世界属性还是人的认识处境仍有争议。`},{zh:`等力`,en:`equipollence / isostheneia`,definition:`对立说法在说服力上势均力敌，因而没有充分理由选择其中一方；该术语主要由后期皮浪主义系统化。`},{zh:`依表象生活`,en:`living by appearances`,definition:`不判断事物终极本性，仍可依感觉、习惯、技艺和共同规则行动，从而回应怀疑会使人瘫痪的指控。`}],lineage:{inherited:`可能受德谟克利特关于安宁、智者与苏格拉底对判断限度的讨论影响；东方旅行提供比较背景，但不能凭相似性直接证明佛教来源。`,school:`皮浪没有建立正式学校。蒂蒙保存其形象；后来的埃奈西德穆和塞克斯都在数世纪后系统化论证模式，形成我们更熟悉的皮浪主义。`,influenced:`塞克斯都著作经文艺复兴重见后影响蒙田、笛卡尔、休谟等近代认识论；这种影响更多来自后期皮浪主义而非皮浪本人残篇。`,parallel:`学院怀疑主义同样悬置判断，却主要在柏拉图学院内部批判斯多葛知识标准；早期皮浪更突出生活姿态和安宁。`},comparisons:[{target:`阿尔克西劳`,relation:`同题比较`,shared:`拒绝在缺乏决定性标准时给表象完全同意。`,difference:`皮浪传统以安宁和依表象生活为核心；阿尔克西劳以苏格拉底辩证法专门挑战斯多葛认知印象。`},{target:`卡尔内阿德`,relation:`同题比较`,shared:`悬置确定断言仍须说明行动如何可能。`,difference:`卡尔内阿德发展有层级的可信印象供实践审查；早期皮浪材料更强调不执著及生活结果。`},{target:`伊壁鸠鲁`,relation:`同题比较`,shared:`哲学以解除恐惧、取得宁静为生活目标。`,difference:`伊壁鸠鲁以原子论和感觉标准建立正面教义；皮浪不以另一套自然学填补不确定性。`},{target:`佛教哲学`,relation:`后世重构`,shared:`旅行传统与不执著、安宁之间存在可比较线索。`,difference:`直接传播证据不足，佛教的缘起、无我和解脱体系也不能压缩为希腊式悬置判断。`}],russellView:`罗素沿袭传统叙事，称皮浪随亚历山大到东方并在埃利斯建立怀疑传统。他把核心写成：没有充分理由偏好一种判断，聪明人因此避免信念、依习俗生活，并从无信念中获得安宁。罗素把这种方案视作希腊化不安全时代的‘抗焦虑药’，同时质疑彻底怀疑能否一贯表达。`,modernCorrection:`“朋友必须把他从马车前拖走”与依表象生活明显冲突，更像哲人传奇。现代研究还区分早期皮浪与后期皮浪主义：皮浪可能提出了关于事物无定性的正面看法，未必已经采用塞克斯都式不对任何本性作断言的纯探究立场。东方影响值得比较，但不能由一次旅行故事直接坐实。`,sources:[M(`第一卷第二十六章〈犬儒派与怀疑派〉`),{label:`Stanford Encyclopedia · Ancient Skepticism`,kind:`补充`,url:`https://plato.stanford.edu/entries/skepticism-ancient/`},{label:`Internet Encyclopedia of Philosophy · Pyrrho`,kind:`补充`,url:`https://iep.utm.edu/pyrrho/`}]},{id:`arcesilaus`,order:17,nameZh:`阿尔克西劳`,nameEn:`Arcesilaus`,greekName:`Ἀρκεσίλαος`,dates:`前 316／315—前 241／240`,active:`约前 268—前 241 领导学院`,places:[`皮塔内`,`雅典`],school:`学院怀疑主义`,figureId:`arcesilaus`,chapterIds:[`b1-26`],thesis:`没有任何印象能仅凭自身保证它不可能来自虚假对象；理性因而要求停止把表象批准为确定真理，但行动仍可依据在处境中显得合理的方案进行。`,evidenceCaution:`本人没有著作，观点主要从西塞罗、塞克斯都和普鲁塔克等后世材料重建。许多论证可能是针对斯多葛前提的辩证反驳，而非阿尔克西劳自己肯定的教义。`,lifeSummary:`阿尔克西劳出生于小亚细亚爱奥利斯的皮塔内，青年到雅典，先后接触数学家奥托吕科斯、吕克昂和柏拉图学院传统。约前 268／266 年成为学院主持者，使学院从正面形而上教学转向以苏格拉底式问答检验同时代学派。主要对手是芝诺及早期斯多葛派：他们认为某些“认知印象”以自身清晰结构保证真实，智者可以据此获得知识。阿尔克西劳通过梦、疯狂、相似对象等案例指出真印象可能有不可区分的假对应物。他不写书，使教学保持为现场辩论，也让后世难以区分其真实立场和策略性反驳。`,timeline:[{date:`前 316／315`,place:`皮塔内`,title:`出生`,detail:`来自较富裕家庭的传统较可信；早年学画或诗歌等细节属于后世传记。`,certainty:`较可靠`},{date:`前 3 世纪初`,place:`雅典`,title:`进入学院知识网络`,detail:`先在吕克昂及其他教师处学习，后转入学院，形成以柏拉图对话中的苏格拉底为核心的方法。`,certainty:`传统记载`},{date:`约前 268／266`,place:`雅典`,title:`主持柏拉图学院`,detail:`学院由此进入所谓中期学院或怀疑时期，持续与斯多葛、伊壁鸠鲁认识论辩论。`,certainty:`较可靠`},{date:`前 241／240`,place:`雅典`,title:`去世`,detail:`关于酗酒致死的传闻带有敌对学派诋毁色彩；卒年较确定，死因不明。`,certainty:`较可靠`}],inquiries:[{object:`真理标准与认知印象`,question:`一种印象能否仅凭自身，让人确定它绝不可能由假对象造成？`,start:`斯多葛派要求只同意具有真理保证的认知印象，以此区分知识与意见。`,steps:[`寻找与真印象现象上相同的假印象`,`使用梦、幻觉和相似对象检验标准`,`指出当事人无法从印象内部辨别来源`,`拒绝给予任何印象不可撤回的同意`],conclusion:`若没有无假对应物的印象，斯多葛标准无法完成认证；悬置判断是遵守严格理性标准的结果，而非讨厌知识。`},{object:`无信念行动`,question:`如果不肯定任何印象为真，为什么还能出门、选择和承担责任？`,start:`对手认为行动需要先同意‘这件事应当做’，全面悬置会让人像植物一样不动。`,steps:[`区分出现印象与批准其为真`,`承认多个行动方案会呈现于理性思考`,`依‘合理者’比较处境和后果`,`行动而不把选择升级为不可错知识`],conclusion:`怀疑者可按合理表象行动。可行动性不要求形而上确定性，只要求保留感知、思考和比较能力。`}],concepts:[{zh:`认知印象`,en:`kataleptic impression`,definition:`斯多葛派设想的真理印象：源自真实对象，并具有不可能来自虚假对象的呈现方式；阿尔克西劳攻击其可识别性。`},{zh:`全面悬置`,en:`universal epochē`,definition:`不对任何印象作确定真理的同意；它是否为阿尔克西劳的正面主张，还是辩证结果，仍有争议。`},{zh:`合理者`,en:`eulogon / the reasonable`,definition:`在没有确定知识时指导行动的可辩护表象或方案，不等于已被断言为真实。`},{zh:`辩证反驳`,en:`dialectical argument`,definition:`暂取对手前提，展示其导致矛盾或无法达到目标；论证结论不必是怀疑者自己的教义。`},{zh:`不可区分论证`,en:`indistinguishability argument`,definition:`若真实印象总可能有一个在主观呈现上完全相同的虚假对应，便不存在仅凭呈现即可保证真理的认知标记。`},{zh:`不行动反驳`,en:`reply to the inactivity objection`,definition:`悬置确定同意不等于无法行动；行动仍可跟随当下合理、可辩护的表象，而不宣称它不可错。`}],lineage:{inherited:`重新突出柏拉图对话中的苏格拉底审问者，而非理念体系建构者；也继承学院内部对知识、意见和假设的长期区分。`,school:`他开启学院怀疑主义。其方法被卡尔内阿德发展，后由克利托马科、西塞罗等以不同程度的可错论解释传播。`,influenced:`迫使斯多葛派反复修订认知印象和同意理论；通过西塞罗《学园派论》影响奥古斯丁及近代怀疑论语汇。`,parallel:`皮浪主义同样悬置，却不依附学院—斯多葛争论，并更明确把宁静列为实践结果。`},comparisons:[{target:`苏格拉底`,relation:`后世重构`,shared:`通过问答检验他人自信，拒绝假装拥有智慧。`,difference:`阿尔克西劳把方法用于系统攻击希腊化知识标准，并提出悬置后的行动问题。`},{target:`斯多葛芝诺`,relation:`批评关系`,shared:`同意应受理性控制，未经认证的意见会导致错误。`,difference:`芝诺认为某些印象可自证真实；阿尔克西劳认为真假印象可能不可区分，因而应悬置。`},{target:`皮浪`,relation:`同题比较`,shared:`不把出现于心的表象直接升级为事物本性。`,difference:`皮浪传统以宁静和生活示范为中心；阿尔克西劳以学院辩证法和认识标准之争为中心。`},{target:`卡尔内阿德`,relation:`影响后继`,shared:`反对斯多葛确定印象，并须回应不行动反驳。`,difference:`阿尔克西劳用‘合理者’保持行动；卡尔内阿德细化为可说服、无冲突并经检查的层级标准。`}],russellView:`罗素把阿尔克西劳视为学院转向怀疑主义的关键人物，强调他复活苏格拉底式无知，以相反论证破坏斯多葛关于确定知识的自信。罗素的整体叙述把学院怀疑看作不安全时代中哲学由世界体系退向心理防御的一部分。`,modernCorrection:`不能简单说他‘知道一切不可知’，因为许多否定句可能只是从对手前提推出。现代研究尤其重视行动论：阿尔克西劳并非让人自动响应刺激，而是保留理性比较，只拒绝把选择当成已认证真理。其方法是一种严格探究伦理，而不仅是消极怀疑。`,sources:[M(`第一卷第二十六章〈犬儒派与怀疑派〉`),{label:`Stanford Encyclopedia · Ancient Skepticism`,kind:`补充`,url:`https://plato.stanford.edu/entries/skepticism-ancient/`},{label:`Internet Encyclopedia of Philosophy · Academic Skepticism`,kind:`补充`,url:`https://iep.utm.edu/ancient-greek-skepticism/`}]},{id:`carneades`,order:18,nameZh:`卡尔内阿德`,nameEn:`Carneades of Cyrene`,greekName:`Καρνεάδης`,dates:`前 214／213—前 129／128`,active:`前 2 世纪中叶`,places:[`昔兰尼`,`雅典`,`罗马`],school:`学院怀疑主义`,figureId:`carneades`,chapterIds:[`b1-26`],thesis:`确定无误的认知标记不可获得，但实践不必因此停摆；印象可以按说服力、与其他印象的一致及经受检查的程度分层，重要行动应接受更严格审查。`,evidenceCaution:`本人没有写作，主要通过学生克利托马科、西塞罗和塞克斯都重建。我们不确定“可信印象”只是辩证回应，还是他自己的可错认识论；在罗马连续为正义正反演说的具体内容也经后世塑形。`,lifeSummary:`卡尔内阿德出生于北非希腊城市昔兰尼，后在雅典学习并成为学院主持者。他延续阿尔克西劳对斯多葛知识标准的批评，却更细致地说明无确定知识时怎样合理行动。前 155 年，他与斯多葛派第欧根尼、逍遥派克里托劳斯组成雅典使团前往罗马，处理罚款争议。传统说他第一天赞美正义、第二天用同样力量反驳，震动罗马青年并促使老加图要求使团尽快离开。故事即使经过修饰，也显示希腊辩证训练进入罗马政治文化的历史节点。`,timeline:[{date:`前 214／213`,place:`昔兰尼`,title:`出生`,detail:`北非希腊城市拥有数学、修辞和哲学传统；早年学习路线主要来自晚期传记。`,certainty:`较可靠`},{date:`前 2 世纪中叶`,place:`雅典`,title:`主持学院并发展或然标准`,detail:`持续攻击斯多葛认知印象，使用相似物、疯狂和梦等案例，并把实践依据细分为三个审查层级。`,certainty:`较可靠`},{date:`前 155`,place:`罗马`,title:`参加哲学家使团`,detail:`使团本身可靠；连续为正义正反演说及加图反应的细节可能经道德化叙述。`,certainty:`较可靠`},{date:`前 129／128`,place:`雅典`,title:`去世`,detail:`晚年失明等记载有一定传统支持；思想主要由从未完全确定老师立场的克利托马科保存。`,certainty:`较可靠`}],inquiries:[{object:`相似表象与确定知识`,question:`如果两个鸡蛋、两粒沙甚至真幻觉看起来完全相同，表象能自带真理保证吗？`,start:`斯多葛派要求认知印象具有无法由假对象产生的特征；现实中极近相似物却可能给任何观察者同样呈现。`,steps:[`寻找不可区分的相似对象`,`比较正常、梦境和疯狂状态下的行动`,`切断清晰感与真实来源的必然联系`,`要求知识标准承担无法完成的自我认证`],conclusion:`表象的鲜明或驱动力不足以保证真实。人仍可判断其可信程度，但不应把心理确信等同于不可错知识。`},{object:`可信印象与实践审查`,question:`没有确定知识，重要行动怎样避免任意和瘫痪？`,start:`日常选择不可能等到绝对证明；但风险越高，单一第一印象越不够。`,steps:[`普通事务依有说服力的印象`,`重要事务检查周围印象是否冲突`,`关乎幸福时进行全面反复审查`,`只给予暂时认可，不声称把握本性`],conclusion:`可信度是分层程序而非真理印章。像暗处辨认绳与蛇，应靠光线、触探和关系检查提高可行动的可靠性。`},{object:`正义、政治与相反论证`,question:`一个国家称为正义的规则，是普遍原则还是自身利益的合理化？`,start:`帝国、城邦和个人常在利益变化时改变正义语言，却宣称遵守同一普遍标准。`,steps:[`先重建支持自然正义的最强论证`,`再以国家利益和历史实践提出反例`,`展示权威理论未完成证明`,`将结论保持为对确信的检验而非赞美不义`],conclusion:`正反演说的目的不是自动证明正义不存在，而是迫使政治主张暴露前提、代价和自利结构。`}],concepts:[{zh:`可信印象`,en:`pithanē phantasia / persuasive impression`,definition:`足以在实践中说服人的表象；它提供可行动理由，但不保证对象在本性上确实如此。`},{zh:`无冲突印象`,en:`undiverted impression`,definition:`与周围相关表象没有张力的可信印象，是比单一第一印象更高的审查层级。`},{zh:`充分检查`,en:`thoroughly explored impression`,definition:`在重要问题中逐项核验相关条件、替代解释和反例后仍保持说服力的印象。`},{zh:`暂时认可`,en:`approval`,definition:`按可信印象行动，但不作斯多葛式‘实际为真’的完全同意；是否构成较弱信念，古今均有争议。`},{zh:`正反双论`,en:`arguments on both sides`,definition:`对同一命题分别建立最强支持与反对理由，以暴露自明性不足；罗马的正义演说是最著名但经后世转述的例子。`},{zh:`实践可错论`,en:`practical fallibilism`,definition:`在拒绝确定知识后，仍按分层检查过的可信印象行动；这是本站对其结构的现代学习性概括，不是古代自用标签。`}],lineage:{inherited:`继承阿尔克西劳的学院辩证法和对斯多葛认知印象的攻击，也回到柏拉图对知识与意见、假设与证明的区分。`,school:`属于学院怀疑主义成熟期。克利托马科把他解释为仍全面悬置，斐洛则允许暂时信念，显示其遗产内部已经分裂。`,influenced:`西塞罗用拉丁语把可信性转译为 probabile 与 veri simile，成为古代怀疑主义进入罗马和近代可错论的重要桥梁。`,parallel:`现代概率判断同样按证据更新可信度，但卡尔内阿德没有数学概率模型；他的‘或然’首先是实践审查和反教条工具。`},comparisons:[{target:`阿尔克西劳`,relation:`承接前人`,shared:`反对可自证的认知印象，并以合理实践回答不行动指控。`,difference:`卡尔内阿德把实践标准细分为说服力、一致性和充分检查，较接近可错认识论。`},{target:`皮浪`,relation:`同题比较`,shared:`不把表象直接断言为事物本性。`,difference:`皮浪传统突出悬置后的宁静；卡尔内阿德服务于学院内部认识论与公共论证，安宁不是核心目标。`},{target:`斯多葛主义`,relation:`批评关系`,shared:`行动要区分未经检验的冲动与理性认可。`,difference:`斯多葛派追求保证真实的认知印象；卡尔内阿德只允许经层级检查后仍可错的实践依据。`},{target:`现代可错论`,relation:`后世重构`,shared:`合理相信不要求不可错，重要结论需要更强证据。`,difference:`现代可错论通常仍肯定知识和信念；卡尔内阿德是否允许真正信念，取决于对其学生证言的解释。`}],russellView:`罗素最突出卡尔内阿德前 155 年在罗马的使团和正反两场正义演说，把它视为希腊怀疑论冲击罗马传统道德的戏剧性时刻。他也注意到学院派以或然性指导生活，但更倾向把整个怀疑传统解释为宏大公共信念衰落后的个人安稳方案。`,modernCorrection:`正反演说不能直接证明卡尔内阿德反对正义；更可能是展示柏拉图和亚里士多德式自然正义尚未获得决定性论证。其可信标准不是‘哪边票多就信哪边’，而是随风险增加审查强度。把它叫概率论会过度现代化，把它叫全面无信念又会忽略暂时认可的复杂性。`,sources:[M(`第一卷第二十六章〈犬儒派与怀疑派〉`),{label:`Stanford Encyclopedia · Ancient Skepticism`,kind:`补充`,url:`https://plato.stanford.edu/entries/skepticism-ancient/`},{label:`Internet Encyclopedia of Philosophy · Academic Skepticism`,kind:`补充`,url:`https://iep.utm.edu/ancient-greek-skepticism/`}]},{id:`epicurus`,order:19,nameZh:`伊壁鸠鲁`,nameEn:`Epicurus`,greekName:`Ἐπίκουρος`,dates:`前 341—前 270`,active:`前 4 世纪末至前 3 世纪前期`,places:[`萨摩斯`,`米蒂利尼`,`兰普萨库斯`,`雅典`],school:`伊壁鸠鲁主义`,figureId:`epicurus`,chapterIds:[`b1-27`],thesis:`幸福不是不断增加强烈刺激，而是消除身体疼痛和心灵扰动；原子论、死亡分析、欲望分类、友谊与正义契约共同把恐惧降到最低。`,evidenceCaution:`据说写作三百余卷，大部分失传；主要依靠第欧根尼·拉尔修保存的书信和格言、赫库兰尼姆纸草及卢克莱修。原子偏斜在存世本人文本中未直接出现，其具体功能与归属仍有争议。`,lifeSummary:`伊壁鸠鲁生于萨摩斯岛的雅典移民家庭，十八岁到雅典履行公民兵役。家庭被逐出萨摩斯后，他在小亚细亚多地生活，约前 311 年在米蒂利尼开始教学，后在兰普萨库斯形成稳定朋友圈。前 306 年回雅典购置“花园”，建立接纳妇女和奴隶的共同体，以简朴饮食、友谊、写作和共同学习实践哲学。他并非纵欲享乐者，而把最高快乐定义为身体无痛与心灵宁静。前 270 年因长期结石或泌尿疾病去世，临终书信称身体剧痛仍被回忆哲学交谈的快乐抵消。`,timeline:[{date:`前 341`,place:`萨摩斯`,title:`出生于雅典移民家庭`,detail:`父母是雅典公民，定居萨摩斯；后世关于贫困和母亲巫术活动的说法常带有敌对宣传。`,certainty:`较可靠`},{date:`前 323—前 321`,place:`雅典／小亚细亚`,title:`服役与家庭迁移`,detail:`十八岁赴雅典履行兵役；雅典移民随后被马其顿方面逐出萨摩斯，家庭转居科洛封。`,certainty:`较可靠`},{date:`约前 311—前 307`,place:`米蒂利尼／兰普萨库斯`,title:`教学并形成朋友圈`,detail:`米蒂利尼教学受挫后转往兰普萨库斯，结识赫尔马科斯、梅特罗多罗斯等终身伙伴。`,certainty:`较可靠`},{date:`前 306`,place:`雅典`,title:`建立花园学派`,detail:`购买城内住宅与花园，形成以友谊、共同学习和低欲望生活为核心的长期共同体。`,certainty:`较可靠`},{date:`前 270`,place:`雅典`,title:`在长期病痛中去世`,detail:`临终书信与遗嘱保存较好，安排共同体延续、朋友家属和奴隶解放，体现哲学与制度生活结合。`,certainty:`较可靠`}],inquiries:[{object:`自然、神与恐惧`,question:`雷电、疾病和天象若被解释为神罚，人怎样获得稳定生活？`,start:`未知自然过程被人格化后，每个偶然事件都可能成为神意警告，制造无法证伪的焦虑。`,steps:[`以原子和虚空解释自然`,`允许同一遥远天象有多个不违经验的自然说明`,`肯定神若完满便不忙于惩罚人`,`把自然研究服务于消除迷信恐惧`],conclusion:`神可以存在，但不管理世界；自然事件不含针对个人的惩罚意图。物理学的治疗目标比争夺唯一遥远天象模型更重要。`},{object:`死亡、灵魂与感觉`,question:`死亡为什么不应被当作人生中最大的恶？`,start:`一切善恶经验都以感觉为条件；灵魂同样由细微原子组成，随身体解散。`,steps:[`说明灵魂是身体性的复合物`,`死亡使感觉能力终止`,`活着时死亡尚未来，死亡到来时主体已不在`,`排除死后惩罚与永恒缺失体验`],conclusion:`死亡对我们不是可被感受的恶。应处理的是当下对死亡的想象性恐惧，而非追求不可能的个人永存。`},{object:`快乐、欲望与选择`,question:`若快乐是善，为什么不应追逐每一种强烈快乐？`,start:`某些快乐带来更大后痛，某些暂时痛苦换来长期健康；单次强度不是可靠尺度。`,steps:[`把快乐理解为痛苦和扰动的消除`,`区分自然且必要、自然不必要与空洞欲望`,`比较选择的长期后果`,`让审慎统摄饮食、名望、权力和情欲`],conclusion:`最高快乐是无痛和宁静的稳定状态。面包、水和可靠朋友常比奢侈更有效，因为它们满足需要而不制造新的依赖。`},{object:`友谊、正义与共同生活`,question:`以个人快乐为目标，为什么还要忠诚、正义并为朋友承担痛苦？`,start:`孤立个体持续担心伤害、背叛和权力变化；安全感本身依赖可信关系。`,steps:[`以互不伤害契约界定正义`,`让法律有效性随共同利益条件变化`,`通过长期忠诚把朋友变成安全世界`,`在花园制度中实践照顾、记忆与教育`],conclusion:`审慎、正义和友谊不是牺牲快乐的外在义务，而是稳定快乐的构成条件；贤者甚至可为朋友承受风险。`}],concepts:[{zh:`无痛`,en:`aponia`,definition:`身体没有疼痛的稳定状态，是快乐的极限之一；它不同于持续寻求强烈感官刺激。`},{zh:`心灵宁静`,en:`ataraxia`,definition:`摆脱对神、死亡、未来和无限欲望的扰动；通过自然知识、欲望管理和友谊共同获得。`},{zh:`欲望分类`,en:`classification of desires`,definition:`自然且必要、自然但非必要、空洞欲望三类；分类帮助把有限需要与名望权力等无终点追逐分开。`},{zh:`原子偏斜`,en:`atomic swerve / clinamen`,definition:`原子在无固定时地发生的最小偏移，用于解释碰撞并可能为自主行动留出空间；本人现存文本未直接保存。`},{zh:`互不伤害契约`,en:`compact neither to harm nor be harmed`,definition:`正义不是脱离共同体的永恒实体，而是在具体条件下保障相互安全的协议和制度。`},{zh:`四重药`,en:`tetrapharmakos / four-part cure`,definition:`神不足惧、死不足忧、善易获得、痛可忍受的后世格言式压缩，把自然学和欲望训练合为记忆工具。`},{zh:`死亡与我无关`,en:`death is nothing to us`,definition:`一切善恶经验依赖感觉；死亡发生时感觉主体已不存在，因此不能被想象成死者持续承受的状态。`},{zh:`友谊`,en:`philia / friendship`,definition:`从互助安全开始并发展为自身可贵的共同生活关系，是花园学派把个人安宁变成可持续实践的社会条件。`}],lineage:{inherited:`采用德谟克利特原子论，却让自然研究明确服务于解除恐惧；也在希腊伦理关于快乐、审慎和友谊的争论中形成独立方案。`,school:`花园既是学派也是生活共同体，保存创始人文本和纪念实践，教义稳定性较强。成员包括妇女、奴隶和外来者，虽不能等同现代平等制度，却突破学院常规。`,influenced:`卢克莱修用拉丁诗系统传播其自然和治疗方案；赫库兰尼姆的菲洛德穆发展修辞、音乐与情绪治疗。近代唯物论和世俗伦理多次重读他。`,parallel:`斯多葛主义同样治疗恐惧并重视判断，却以宇宙理性和德性为唯一善；伊壁鸠鲁则以快乐、原子偶然性和低政治参与建立安宁。`},comparisons:[{target:`德谟克利特`,relation:`承接前人`,shared:`原子、虚空、灵魂身体性和非神意自然。`,difference:`伊壁鸠鲁加入偏斜传统，更强调感觉标准，并把物理学系统服务于无恐惧生活。`},{target:`亚里士多德`,relation:`批评关系`,shared:`幸福需要审慎、友谊和长期活动，不等于瞬间快感。`,difference:`亚里士多德以德性活动和城邦参与为核心；伊壁鸠鲁以无痛宁静和退出权力竞争降低风险。`},{target:`皮浪`,relation:`同题比较`,shared:`最终目标包含心灵宁静。`,difference:`皮浪传统通过悬置教条达到宁静；伊壁鸠鲁肯定原子论、感觉标准和欲望分类等明确教义。`},{target:`卢克莱修`,relation:`影响后继`,shared:`原子自然学、灵魂有死、神不干预和消除死亡恐惧。`,difference:`卢克莱修用拉丁史诗、罗马政治危机和强烈意象重新组织学说，诗歌形式本身成为治疗工具。`}],russellView:`罗素纠正了把伊壁鸠鲁误解为纵欲者的常见看法，突出无痛、宁静、简食和友谊。他认为伊壁鸠鲁只因自然解释能消除迷信才关心科学，甚至允许对遥远天象并列多种说明；又认为死亡论虽有逻辑力量，却难完全战胜本能恐惧。整体评价夹杂尊重与对其退避公共世界的保留。`,modernCorrection:`物理学并非随意编造：多重解释仍必须与感觉和基本原理相容。‘退出政治’也不是完全隔绝社会，花园本身具有制度、书信网络、正义契约和照顾实践。把快乐只译成消极无痛会低估记忆、交谈和友谊的积极愉悦；把偏斜直接等同现代自由意志或量子随机同样过度。`,sources:[M(`第一卷第二十七章〈伊壁鸠鲁派〉`),{label:`Stanford Encyclopedia · Epicurus`,kind:`补充`,url:`https://plato.stanford.edu/entries/epicurus/`},{label:`Internet Encyclopedia of Philosophy · Epicurus`,kind:`补充`,url:`https://iep.utm.edu/epicur/`}]},{id:`lucretius`,order:20,nameZh:`卢克莱修`,nameEn:`Titus Lucretius Carus`,greekName:`Titus Lucretius Carus`,dates:`约前 99／94—前 55／54`,active:`前 1 世纪中叶`,places:[`罗马共和国（具体出生地不明）`],school:`罗马伊壁鸠鲁主义`,figureId:`lucretius`,chapterIds:[`b1-27`],thesis:`诗歌以感性图像把不可见的原子世界变成可理解经验：理解身体、灵魂、宇宙和文明的自然原因，能够拆除宗教恐惧、死亡恐惧与无止境欲望。`,evidenceCaution:`生平几乎空白，唯一同期外部材料是西塞罗前 54 年书信对诗作的简评。爱情药致疯、自杀和西塞罗整理遗稿的故事来自数百年后的哲罗姆，可信度很低；《物性论》似未完成最终修订。`,lifeSummary:`卢克莱修生活在罗马共和国晚期内战和政治失序的前一世纪中叶，具体出生地、阶层与社交圈都不确定。他把六卷拉丁长诗《物性论》献给罗马贵族盖乌斯·孟米乌斯，以伊壁鸠鲁自然学治疗宗教与死亡恐惧。西塞罗前 54 年致弟昆图斯的信称该诗兼具才华与技艺，这是唯一接近同时代的外部见证。诗中前后提纲重复、卷次调整痕迹和未兑现承诺显示作者可能未及最后修订。维吉尔、贺拉斯和奥维德很快吸收其语言；中世纪传抄稀少但未完全失传，十五世纪手稿发现使其成为近代原子论的重要古代资源。`,timeline:[{date:`约前 99／94`,place:`罗马共和国`,title:`出生`,detail:`哲罗姆提供的两个年龄方案与卒年互有冲突；姓名显示罗马公民身份，其他家庭信息未知。`,certainty:`推定`},{date:`前 60—前 55 前后`,place:`罗马共和国`,title:`写作《物性论》`,detail:`六卷诗从原子虚空推进到灵魂、感觉、宇宙与文明，写作背景是共和国政治动荡。`,certainty:`较可靠`},{date:`前 54`,place:`罗马`,title:`西塞罗书信提及诗作`,detail:`西塞罗同意弟弟对卢克莱修诗才与技艺的赞赏，证明作品当时已在精英圈阅读。`,certainty:`较可靠`},{date:`约前 55／54`,place:`地点不明`,title:`去世与未完成修订`,detail:`早逝可解释文本修订痕迹，但疯癫、自杀和爱情药故事与早期接受不符。`,certainty:`推定`},{date:`1417`,place:`德意志修道院网络`,title:`手稿重新进入人文主义传播`,detail:`波焦发现一份手稿并非作品从零‘复活’，而是使此前稀少的传本快速进入印刷和近代思想网络。`,certainty:`较可靠`}],inquiries:[{object:`不可见自然与可见证据`,question:`原子和虚空看不见，为什么仍可成为合理解释？`,start:`风和气也不可被眼睛直接看见，却以树木弯折、触感和运动显现效果；不可见不等于无证据。`,steps:[`从无中不能生有、存在不能归无开始`,`由运动需要间隔推出虚空`,`由复合物可毁而自然不耗尽推出不灭原子`,`用宏观规律反推微观结构`],conclusion:`原子理论通过可见后果、解释统一性和对竞争材料论的反驳获得支持；诗的比喻承担从经验到不可见结构的桥梁。`},{object:`灵魂、死亡与治疗`,question:`怎样让‘死亡没有感觉’不只是一句抽象安慰？`,start:`人把自己想象成死后仍在场的旁观者，因而哀悼永远失去未来或担心地下惩罚。`,steps:[`证明灵魂与身体相互依赖且同为原子复合物`,`列举灵魂不能独立存活的论证`,`用出生前的无感与死后对称`,`把地狱刑罚解释为今生欲望和恐惧的投射`],conclusion:`主体随复合体解散，不会经验自身缺席。自然知识借诗歌反复练习，才可能把逻辑结论转化为情绪习惯。`},{object:`原子偏斜、因果与行动`,question:`若原子只平行下落或一切都由先前运动锁定，碰撞和自主行动如何开始？`,start:`完全相同速度的直线下落不能相遇；无穷因果链又似乎不给行动者留下发起运动的空间。`,steps:[`设定无固定时间地点的最小偏斜`,`让原子产生碰撞和复合`,`把动物意愿作为独立行动事实`,`拒绝把偏斜直接当成随机决定每个选择`],conclusion:`偏斜为自然形成与能动性提供非严格决定的余地，但它怎样与成熟心理选择连接，文本没有给出完整机制。`},{object:`文明、宗教与自然史`,question:`语言、法律和宗教是否必须来自神授或一次设计？`,start:`世界并不特别适合人类，新生儿脆弱，农业艰难；这与为人类预制的完美设计不符。`,steps:[`从早期人类适应环境和共同防御开始`,`让语言由反应和使用逐渐形成`,`以互不伤害需要产生法律`,`把天象恐惧与权力经验投射为神罚`],conclusion:`文明是无预定蓝图的累积过程，既带来技艺与合作，也不断制造战争、奢侈和新的恐惧。`}],concepts:[{zh:`《物性论》`,en:`De rerum natura / On the Nature of Things`,definition:`六卷拉丁哲学史诗，以原子自然学完成从宇宙、灵魂到文明和疾病的治疗性课程。`},{zh:`物象薄膜`,en:`simulacra`,definition:`物体不断发出的极薄原子膜，保留外形并作用于眼睛或心灵，用于解释视觉、梦和想象。`},{zh:`原子偏斜`,en:`clinamen / atomic swerve`,definition:`原子运动中的最小无定时偏移，使碰撞可能并为能动性讨论留下空间。`},{zh:`死亡对称论证`,en:`symmetry argument`,definition:`出生前的无感觉并不使我们痛苦，死亡后的无感觉也不应被想象成主体持续承受的损失。`},{zh:`蜜糖与苦艾`,en:`honeyed cup`,definition:`诗歌如杯缘的蜜，使读者愿意服下起初苦涩的自然哲学；形式不是装饰，而是情绪治疗的技术。`},{zh:`灵魂有死`,en:`mortality of the soul`,definition:`灵魂由细微原子构成并依赖身体组织，身体解体后不能继续感受；这一自然学结论直接服务于消除死后惩罚恐惧。`},{zh:`多重自然解释`,en:`multiple explanations`,definition:`当天体现象的具体成因无法由证据唯一决定时，可以保留多个彼此相容的自然原因，只要排除神意干预和逻辑不可能。`},{zh:`文明发生史`,en:`natural history of civilization`,definition:`语言、火、家庭、法律和技术从需要、模仿与试错中逐步形成，无须预设神一次性授予完整制度。`}],lineage:{inherited:`公开把伊壁鸠鲁称为解放人类的导师，并通过其传统继承德谟克利特原子论；拉丁史诗形式又与恩尼乌斯等罗马诗歌传统对话。`,school:`属于罗马伊壁鸠鲁主义，却不是简单翻译。诗的结构、共和国处境、拉丁术语创新和宏大自然意象构成独立哲学表达。`,influenced:`维吉尔、贺拉斯、奥维德及后世拉丁诗吸收其语言；文艺复兴后影响伽桑狄、近代原子论、宗教批判和自然主义文学。`,parallel:`现代科普同样用可视比喻连接不可见模型和公众理解，但卢克莱修的目标还包括灵魂训练与生活解放，不只传播事实。`},comparisons:[{target:`伊壁鸠鲁`,relation:`承接前人`,shared:`原子、虚空、感觉标准、神不干预和死亡不应恐惧。`,difference:`伊壁鸠鲁以书信、格言和共同体教学；卢克莱修以拉丁史诗、强烈意象和罗马历史经验完成传播。`},{target:`德谟克利特`,relation:`后世重构`,shared:`复合物由不灭原子在虚空中形成，感觉性质属于结构互动。`,difference:`卢克莱修继承伊壁鸠鲁的偏斜和治疗伦理，不再以纯粹必然性描述全部运动。`},{target:`柏拉图`,relation:`批评关系`,shared:`哲学必须改变灵魂对死亡和善的理解。`,difference:`柏拉图以灵魂不朽和理念提升生命；卢克莱修以灵魂有死和自然原因消除超自然恐惧。`},{target:`现代自然主义`,relation:`后世重构`,shared:`用非神意因果解释宇宙、心灵和文明。`,difference:`其原子、感觉薄膜和宇宙模型不是现代实验科学，近代接受也常选择性改造而非直接延续。`}],russellView:`罗素主要借卢克莱修让伊壁鸠鲁主义获得最有力的声音，大段引用其赞颂理性突破宗教壁垒、证明灵魂有死和描写原子世界的诗句。他认为卢克莱修的热情、想象和道德严肃超过学派创始人，也把他视作古代少数彻底反迷信的伟大诗人。`,modernCorrection:`爱情药、间歇疯癫和自杀不能当作解释作品强度的心理事实，西塞罗‘编辑遗稿’也未获同期证据。《物性论》并非把科学包上甜美外衣：比喻、重复、恐怖和崇高场景直接参与认知与情绪训练。手稿在 1417 年前并未完全消失，‘一书开启现代性’的流行叙事同样过度简化传播网络。`,sources:[M(`第一卷第二十七章〈伊壁鸠鲁派〉`),{label:`Stanford Encyclopedia · Lucretius`,kind:`补充`,url:`https://plato.stanford.edu/entries/lucretius/`},{label:`Internet Encyclopedia of Philosophy · Lucretius`,kind:`补充`,url:`https://iep.utm.edu/lucretius/`}]}],fe={thales:[{kind:`轶事`,title:`仰望星空与脚下的井`,text:`柏拉图转述，有人嘲笑泰勒斯一边观星一边走路，结果掉进井里；旁边的色雷斯女仆笑他只想知道天上的事，却看不见脚下。`,caveat:`这是后世用来讲哲学家形象的寓言式轶事，不是可核实的生平记录。`}],pythagoras:[{kind:`例子`,title:`“毕达哥拉斯定理”`,text:`今天课堂里最容易辨认的毕达哥拉斯标签，是直角三角形三边关系的定理名称；它让一个古代共同体的名字进入了日常数学。`,caveat:`定理名称不等于本人首次发现或证明；古代多种文明已有相关几何知识。`}],heraclitus:[{kind:`名言`,title:`“人不能两次踏进同一条河流”`,text:`这句流行译法把赫拉克利特变成最容易被引用的“变化哲学家”：河水在流，踏入河中的人也在变化。`,caveat:`这不是现存残篇中的完整原句，而是后世根据相关片段形成的概括。`}],empedocles:[{kind:`轶事`,title:`跳入埃特纳火山？`,text:`晚期传说说恩培多克勒为了让人相信自己已经成神，跳进埃特纳火山，只留下青铜鞋；这个故事把他的科学、诗歌和神秘形象浓缩在一起。`,caveat:`火山故事很可能是哲人传奇；它的辨识度高于史实可靠性。`}],democritus:[{kind:`生活印象`,title:`“笑的哲学家”`,text:`后世常把德谟克利特画成“笑的哲学家”，仿佛他用笑声回应人类把财富、名声和恐惧看得过重。这个称号让抽象的原子论者有了鲜明的世俗形象。`,caveat:`称号主要来自后世道德化肖像，不能当作本人始终面带笑容的事实。`}],protagoras:[{kind:`名言`,title:`“人是万物的尺度”`,text:`这句短语至今常被用来讨论“真理是否依赖观察者”与“价值是否因人而异”，也是普罗泰戈拉最具公众辨识度的哲学标签。`,caveat:`原文只以残篇和柏拉图转述保存；“人”的含义与命题范围仍有争论。`}],socrates:[{kind:`轶事`,title:`雅典街头的“牛虻”`,text:`苏格拉底把自己比作叮咬迟钝马匹的牛虻：不停追问，让城邦不要在自满中沉睡。这个形象比任何术语都更容易说明他的公共角色。`,caveat:`“牛虻”来自《申辩篇》的文学性自我描述；我们对历史苏格拉底的认识仍依赖多种作者。`},{kind:`名言`,title:`“我只知道自己一无所知”`,text:`这句流行名言把苏格拉底式谦逊压缩成一句日常警语：先承认不知道，才有继续追问的可能。`,caveat:`它是后世对《申辩篇》相关论述的简化转述，不是现存文本中的逐字原句。`}],plato:[{kind:`例子`,title:`洞穴里的影子`,text:`“洞穴寓言”已经脱离《理想国》成为日常比喻：人们可能把墙上的影子当成全部现实，而教育像转身走向洞外。`,caveat:`这是哲学寓言的现代通俗化使用，不能直接等同于柏拉图完整的知识论和政治论。`}],aristotle:[{kind:`生活印象`,title:`亚历山大的老师`,text:`“亚历山大的老师”是亚里士多德最有世俗辨识度的身份：哲学家不只在书斋里写作，也曾为未来的征服者授课。`,caveat:`师生关系的具体内容和影响范围，不能由这一称号全部推断。`}],diogenes:[{kind:`轶事`,title:`请别挡住我的阳光`,text:`传说亚历山大大帝来见第欧根尼，问他想要什么；哲学家只回答“请别挡住我的阳光”。这则故事把权力与少欲望的对照变成一句人人能懂的回答。`,caveat:`故事有多个古代版本，重点在犬儒派的表演性价值观，不在逐字核验。`}],pyrrho:[{kind:`轶事`,title:`朋友要把他从车前拉开`,text:`关于皮浪的传奇说，他因为不判断事情好坏，连马车迎面而来时也不躲，朋友只好把他拖开；这正好构成对“彻底悬置判断”的反讽。`,caveat:`这是后世用来攻击或调侃怀疑主义的哲人轶事。`}],epicurus:[{kind:`生活印象`,title:`花园里的简单快乐`,text:`“伊壁鸠鲁主义”在日常语言中常被误解为奢侈享乐；花园、朋友、面包和水构成的简朴生活，反而更接近他要表达的快乐尺度。`,caveat:`花园不是与世隔绝的度假地，而是有教学、友谊和照顾关系的共同体。`}],lucretius:[{kind:`例子`,title:`蜜糖与苦艾`,text:`卢克莱修说，诗歌像杯沿的蜜，让读者愿意喝下起初苦涩的自然哲学；这也成为今天解释科普写作为何需要故事和形式的经典比喻。`,caveat:`这是《物性论》的自我比喻，不是后世凭空附会。`}],zeno:[{kind:`轶事`,title:`一场沉船把他推向哲学`,text:`传说芝诺在货物沉船后来到雅典，看见苏格拉底的画像，便问自己应当追随怎样的人；这个故事把损失转写成新生活的起点。`,caveat:`故事来自后世传记，具体情节不宜当作可核实履历。`}],cleanthes:[{kind:`轶事`,title:`白天汲水，夜里听课`,text:`传统说克里安西斯白天靠汲水和体力劳动生活，夜里再去听芝诺讲学；这让他成为“把哲学带进贫困日常”的斯多葛形象。`,caveat:`劳动细节带有哲人传记的塑形色彩，但与其贫困和长期从学的传统形象相符。`}],chrysippus:[{kind:`轶事`,title:`对驴子吃无花果发笑`,text:`一则传说说，克律西波斯先看驴子吃无花果，又让人给它酒，随后因自己的玩笑而笑死；荒诞故事恰好冲淡了“逻辑巨匠”的严肃面孔。`,caveat:`这是晚期轶事，不能当作死因事实。`}],seneca:[{kind:`生活印象`,title:`富有的斯多葛主义者`,text:`塞涅卡常被公众记成一个矛盾人物：他宣讲简朴与内在自由，却拥有巨额财富并服务于尼禄。这个反差让斯多葛伦理可以被拿来检验真实生活，而不只是背诵格言。`,caveat:`财富来源、政治责任和道德评价都有历史争议，不能用一句“伪君子”结束讨论。`}],epictetus:[{kind:`轶事`,title:`奴隶身份与断腿故事`,text:`传统说爱比克泰德曾被主人拧腿，他平静地提醒“腿要断了”，腿真的断后仍继续生活；故事把“外物不能替你决定判断”变成身体层面的极端例子。`,caveat:`故事版本不一，史料不足以确认每个细节。`}],aurelius:[{kind:`名言`,title:`皇帝写给自己的提醒`,text:`《沉思录》最有辨识度的地方，是皇帝把自己当作需要反复提醒的普通人：不要被赞誉牵走，先处理眼前该做的事。它因此常被现代读者当作私人日记式的生活读物。`,caveat:`《沉思录》不是为公众出版的格言集，中文流行引文常经过改写。`}]},pe={thales:4,anaximander:4,anaximenes:2,pythagoras:5,heraclitus:5,parmenides:5,empedocles:4,anaxagoras:3,leucippus:2,democritus:4,protagoras:4,socrates:5,plato:5,aristotle:5,diogenes:4,pyrrho:3,arcesilaus:2,carneades:3,epicurus:5,lucretius:5,zeno:4,cleanthes:3,chrysippus:4,panaetius:2,posidonius:2,seneca:5,epictetus:5,aurelius:5,plotinus:5},N=[...de,...le,...ue].map(e=>({...e,stars:pe[e.id]||e.stars||1,culturalNotes:fe[e.id]||e.culturalNotes})).sort((e,t)=>e.order-t.order);Object.fromEntries(N.map(e=>[e.id,e]));var P=(e,t,n,r,i,a=e)=>({id:e,nameZh:t,nameEn:n,figureId:a,chapterIds:r,relation:i}),me=[{id:`greek-origins`,title:`希腊哲学的形成`,years:`约前 600—前 450`,russellRange:`第一卷 · 前苏格拉底哲学（第 I—X 章）`,condition:`城邦、殖民贸易、字母书写与跨文化接触，使自然解释逐渐从神话叙事中分化出来。`,commonProblems:[`世界由什么构成？`,`变化如何可能？`,`理性与感官何者更可靠？`],contextChapterIds:[`b1-01`],schools:[{id:`milesian`,title:`米利都自然哲学`,english:`Milesian natural philosophy`,response:`以一种可理解的自然本原说明多样世界。`,sharedPattern:`寻找本原，并用连续的自然过程解释变化。`,chapterIds:[`b1-02`],philosophers:[]},{id:`pythagorean`,title:`毕达哥拉斯传统`,english:`Pythagorean tradition`,response:`把可见世界背后的秩序理解为数、比例与和谐。`,sharedPattern:`数学结构、宗教生活与灵魂观相互支撑。`,chapterIds:[],philosophers:[P(`pythagoras`,`毕达哥拉斯`,`Pythagoras`,[`b1-03`],`把数学秩序发展为一种生活与宇宙方案。`)]},{id:`becoming-being`,title:`生成与存在之争`,english:`Becoming and being`,response:`围绕变化与恒常的冲突，提出不同的本体论方案。`,sharedPattern:`用逻辑约束自然解释，再说明经验世界为何显得变化。`,chapterIds:[],philosophers:[P(`heraclitus`,`赫拉克利特`,`Heraclitus`,[`b1-04`],`把对立和流变理解为秩序本身。`),P(`parmenides`,`巴门尼德`,`Parmenides`,[`b1-05`],`以严格推理否定真正存在的生成和消灭。`),P(`empedocles`,`恩培多克勒`,`Empedocles`,[`b1-06`],`以不变元素的组合解释可见变化。`),P(`anaxagoras`,`阿那克萨哥拉`,`Anaxagoras`,[`b1-08`],`以心灵和种子说明秩序与差异。`)]},{id:`atomists`,title:`原子论`,english:`Atomism`,response:`以原子在虚空中的运动，同时保留不变存在与经验变化。`,sharedPattern:`机械因果、不可分微粒与组合解释。`,chapterIds:[`b1-09`],philosophers:[P(`leucippus`,`留基伯`,`Leucippus`,[`b1-09`],`以原子与虚空回应埃利亚学派对运动的限制。`),P(`democritus`,` ticle`,{"data-relation-type":e,children:[(0,V.jsx)(`span`,{children:String(Ho.indexOf(e)+1).padStart(2,`0`)}),(0,V.jsx)(`b`,{children:e}),(0,V.jsx)(`strong`,{children:n.filter(t=>t.relation===e).length}),(0,V.jsx)(`p`,{children:Uo[e]})]},e))})]})})]})}var Yo=e=>({label:`罗素《西方哲学史》${e}`,kind:`原书`,url:`https://www.russell-j.com/cool/HWP_1945.pdf`}),Xo={label:`Stanford Encyclopedia · Medieval Philosophy`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/medieval-philosophy/`},Zo=[{id:`patristic-christian-tradition`,order:9,nameZh:`教父哲学与拉丁基督教传统`,nameEn:`Patristic Philosophy and Latin Christianity`,kind:`跨语言传统 · 经文解释与教义形成`,period:`约公元 1—5 世纪`,regions:[`亚历山大里亚`,`罗马帝国`,`米兰`,`北非`],thesis:`把犹太—基督教经文、希腊哲学与教会共同体放入同一解释工程：上帝如何超越世界又创造世界，恶与自由如何并存，经文怎样在字面之外产生理性意义。`,classificationNote:`‘教父哲学’不是一个有统一章程的学派。斐洛是犹太思想家而非教父，安布罗斯和哲罗姆也不以系统哲学见长；本站把他们并置，是为了呈现经文、翻译、柏拉图主义和教会制度怎样共同形成拉丁中世纪的思想语言。`,context:{overview:`希腊语哲学已成为罗马帝国的跨地域知识语言，犹太与基督教共同体却以启示、创造和救赎理解历史。迫害、帝国基督教化、教义争论与西部政治危机，使‘如何用哲学说明经文而不让哲学取代经文’成为持续压力。`,factors:[{title:`经文与希腊教育相遇`,detail:`寓意解释、逻各斯和非物质实在提供接口，使人格化叙事能与哲学的超越原则对话。`},{title:`教义与共同体边界`,detail:`三位一体、基督论、自由和恩典不只是抽象命题，也决定礼仪、权威与共同体归属。`},{title:`帝国结构转变`,detail:`从受迫害少数群体到帝国宗教，教会必须处理皇权、公共罪责、教育和城市照护。`}]},architecture:{commonProblem:`独一而超越的上帝怎样创造并作用于可变世界？经文、理性和教会权威之间应如何分工？`,sharedPremise:`真理不能最终自相矛盾；受造世界和人类理性有可理解秩序，但完整救赎知识仍依赖启示与共同体实践。`,method:`比较经文文本，以字面、寓意和精神层次解释困难段落；吸收柏拉图主义的非物质实在和内在上升，再用论战、讲道、自传与制度行动检验理论。`,answer:`上帝保持超越，逻各斯、创造、照明和恩典说明世界与心灵的依赖；理性服务于理解信仰，同时经文解释必须接受语言、语境和教会生活的约束。`,tensions:[{title:`哲学资源／启示边界`,detail:`希腊概念能澄清信仰，也可能把创造、复活和人格自由改写成异质体系。`},{title:`字面／寓意`,detail:`寓意可避免神人同形和文本冲突，却也可能让解释者把自己的体系写回经文。`},{title:`自由／恩典`,detail:`奥利金强调理性受造者的选择；奥古斯丁晚期更突出原罪后意志受缚与恩典主动性。`},{title:`教会权威／政治权力`,detail:`安布罗斯以圣礼纪律限制皇帝，但这种结构并不是现代政教分离。`}]},philosophers:[{id:`philo-alexandria`,role:`犹太—希腊解释先驱`,contribution:`以寓意释经、逻各斯和神圣能力连接摩西经文与柏拉图—斯多葛哲学。`,interaction:`为奥利金等基督教解释者提供方法资源，但不应被反向写成基督教作者。`},{id:`origen`,role:`系统释经与护教者`,contribution:`把经文多层意义、自由意志、灵魂教育和基督—逻各斯组织成早期系统神学。`,interaction:`大胆推测既影响希腊教父，也在后世奥利金主义争论中被选择性定罪。`},{id:`ambrose`,role:`主教权威实践者`,contribution:`以讲道、礼仪纪律和政治行动确立基督教皇帝仍受教会道德约束。`,interaction:`其讲道帮助奥古斯丁越过粗糙字面主义，并留下政教边界先例。`},{id:`jerome`,role:`翻译与文本校正者`,contribution:`学习希伯来语、修订拉丁经文，使语言与文本差异成为解释权威的一部分。`,interaction:`与奥古斯丁围绕新译本、教会使用和解释风险展开有价值的分歧。`},{id:`augustine`,role:`拉丁传统系统建构者`,contribution:`以记忆、时间、意志、恶的缺失、恩典和两个城重组基督教哲学问题。`,interaction:`成为安瑟伦、波那文图拉、阿奎那及宗教改革都必须回应的共同来源。`}],development:[{period:`公元 1 世纪`,title:`犹太经文与希腊哲学的接口`,detail:`斐洛以寓意、逻各斯和超越神学建立可复用的调和形式。`},{period:`2—3 世纪`,title:`护教与系统释经`,detail:`奥利金把经文校勘、哲学教育和救赎宇宙论组合起来。`},{period:`4 世纪`,title:`帝国教会与拉丁转译`,detail:`安布罗斯、哲罗姆等人处理教义、皇权、翻译和禁欲共同体。`},{period:`4—5 世纪`,title:`奥古斯丁综合`,detail:`个人内在性、恩典争论与罗马危机被写成拉丁中世纪最持久的问题框架。`}],relations:[{target:`柏拉图主义`,relation:`思想来源`,detail:`非物质实在、灵魂上升和恶的缺失被改写进创造、启示与救赎框架。`},{target:`斯多葛主义`,relation:`思想来源`,detail:`逻各斯、自然法、良知与激情分析进入基督教语言，但天意与神性结构发生改变。`},{target:`西方修道制度与教牧思想`,relation:`分化`,detail:`经文、禁欲和教会共同体由教父论述进一步制度化为修院规程与牧灵治理。`},{target:`中世纪基督教新柏拉图主义`,relation:`吸收改造`,detail:`奥古斯丁、奥利金和希腊负神学资源在波爱修斯、爱留根纳与安瑟伦处被重新系统化。`},{target:`十二世纪辩证法与共相论`,relation:`后世重构`,detail:`教父权威文本成为学校辩证法的问题材料，信仰理解被改写成定义、反驳与语义分析。`}],influence:[{field:`形而上学`,detail:`创造、神圣单纯性、恶的缺失和时间—永恒关系成为中世纪共同问题。`},{field:`解释学`,detail:`字面、寓意、语言校勘与阅读共同体构成西方经文解释的长期工具。`},{field:`政治与制度`,detail:`主教权威、教会自主和两个城为后世政教争论提供并不一致的资源。`}],russellView:`罗素把早期基督教思想放在希腊哲学、犹太传统与帝国政治的交汇中，尤其突出奥利金的系统性、三位教会博士的制度影响和奥古斯丁对整个中世纪的支配地位。`,modernCorrection:`不能把教父思想只理解为希腊理性的衰退或中世纪的序幕。不同语言、体裁和共同体实践本身会产生哲学问题；斐洛、奥利金、安布罗斯、哲罗姆与奥古斯丁的功能也不能互相替代。`,chapterIds:[`b2-01`,`b2-02`,`b2-03`,`b2-04`],sources:[Yo(`第二卷第一至四章`),Xo,{label:`Stanford Encyclopedia · Augustine`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/augustine/`}]},{id:`monastic-pastoral-tradition`,order:10,nameZh:`西方修道制度与教牧思想`,nameEn:`Western Monastic and Pastoral Tradition`,kind:`生活制度 · 德性训练与公共治理`,period:`约 4—12 世纪`,regions:[`意大利`,`罗马`,`高卢`,`西欧修院网络`],thesis:`把德性从少数人的极端苦行改造成可持续的共同生活：稳定、作息、阅读、劳动、服从与牧灵照管共同塑造欲望，也为帝国行政衰弱后的教育和救济提供制度。`,classificationNote:`这不是以共同命题定义的哲学学派，而是生活制度与实践思想传统。本尼狄克主要以规程、格列高利以教牧与行政、伯尔纳以修院神学发挥作用；把他们放在一页，是为了说明制度本身如何承担哲学训练。`,context:{overview:`西罗马帝国政治结构破碎、战争与人口危机持续，教会和修院逐渐承担救济、教育、土地管理与地方协调。东方禁欲传统进入拉丁西欧后，需要从英雄式隐修转化为普通团体能够长期执行的规则。`,factors:[{title:`行政与城市危机`,detail:`主教和修院在国家能力不足处承担粮食、谈判、教育与照护，但也积累地产和权力。`},{title:`从隐修到共同生活`,detail:`孤独苦行难以普遍复制，共同规程通过稳定关系和可调节尺度降低崩解风险。`},{title:`读写与礼仪节奏`,detail:`诵读、抄写和固定祈祷把时间组织成重复训练，使学习不再依赖城市学校。`}]},architecture:{commonProblem:`人在欲望、权力和危机压力下，怎样依靠共同制度而非短暂热情维持德性、学习与照护？`,sharedPremise:`人格由重复实践和关系塑造；权威若不被规程、谦卑与服务目的约束，就会退化为支配。`,method:`以稳定居所、共同财产、作息、礼仪、阅读和劳动训练习惯；再以牧灵分类和修院讲道，把同一规范按不同人的处境调整。`,answer:`德性不是离开世界的纯内在状态，而是由时间表、共同体、责任与照护反复实现；领导职位应被理解为负担和服务。`,tensions:[{title:`服从／权力滥用`,detail:`服从能打破自我中心，也可能遮蔽上级错误；规程必须同时约束院长。`},{title:`默观／行动`,detail:`追求安静可能逃避邻人需要，公共治理又可能吞噬内在生活。`},{title:`贫穷理想／制度财富`,detail:`修院需要稳定资源，却可能因地产和特权远离最初克制目标。`},{title:`保存文化／选择文化`,detail:`修院保存文本并不等于完整保存古代知识，阅读始终受礼仪与教义目标筛选。`}]},philosophers:[{id:`benedict`,role:`共同生活规程化者`,contribution:`以稳定、服从、礼仪、阅读和劳动构成可调节的长期训练。`,interaction:`其规程经数世纪改革才成为西欧主导标准，不是创立即统一全部修院。`},{id:`gregory-great`,role:`修道经验的公共转译者`,contribution:`把默观纪律带入教皇行政、救济、讲道和传教，并以《牧灵规则》塑造领导伦理。`,interaction:`通过《对话录》把本尼狄克塑造成西方修道典范。`},{id:`bernard-clairvaux`,role:`修院神学与改革者`,contribution:`以谦卑、爱的阶段和《雅歌》默想批评脱离人格转化的知识。`,interaction:`与阿伯拉尔的冲突显示修院神学和城市学校辩证法的制度张力。`},{id:`ambrose`,role:`主教公共责任先例`,contribution:`把教会领袖的礼仪纪律与城市政治责任结合。`,interaction:`为格列高利式主教治理提供先行模型，但两人面对的帝国条件不同。`}],development:[{period:`4—5 世纪`,title:`东方禁欲传统西传`,detail:`隐修、共同生活与拉丁教父写作形成多种并存规程。`},{period:`6 世纪`,title:`本尼狄克规程与格列高利治理`,detail:`温和共同规程和危机中的教皇行政形成可复制组合。`},{period:`8—10 世纪`,title:`加洛林统一与修院网络`,detail:`本尼狄克规程在改革中逐渐成为标准，修院承担教育和地产治理。`},{period:`11—12 世纪`,title:`改革与修院神学高峰`,detail:`克吕尼、熙笃等运动重新讨论贫穷、礼仪、劳动和教会权力。`}],relations:[{target:`教父哲学与拉丁基督教传统`,relation:`思想来源`,detail:`继承经文、禁欲、主教责任和奥古斯丁的欲望分析，并将其制度化。`},{target:`十二世纪辩证法与共相论`,relation:`竞争`,detail:`伯尔纳与阿伯拉尔的论争把修院默想和城市学校辩证法的不同知识理想公开化。`},{target:`中世纪政教权力思想`,relation:`吸收改造`,detail:`主教、教皇与修院的治理实践为后世讨论属灵权威和强制权提供制度经验。`},{target:`方济各会经院哲学与唯名论`,relation:`后世重构`,detail:`托钵修会在城市大学环境中重新解释贫穷、服从和共同生活。`}],influence:[{field:`制度伦理`,detail:`规则、角色和作息说明德性如何依赖环境设计，而非只靠孤立意志。`},{field:`教育与文本`,detail:`修院阅读、抄写和学校网络维持拉丁文化连续性，但不是唯一知识保存者。`},{field:`领导思想`,detail:`职位作为照护负担、按处境施教与服务型权威成为长期教牧模型。`}],russellView:`罗素把本尼狄克和格列高利视为混乱时代的制度建构者：原创哲学有限，却通过纪律、修院和教皇行政保存了西欧组织能力；他对格列高利的奇迹信仰则评价严厉。`,modernCorrection:`‘修道院独自保存文明’和‘黑暗时代只有迷信’都是过度概括。更准确的重点是多种制度网络怎样选择性保存知识，并在照护、土地、性别和权力上同时产生贡献与限制。`,chapterIds:[`b2-05`,`b2-06`,`b2-07`,`b2-09`,`b2-11`],sources:[Yo(`第二卷第五至七、第九及十一章`),Xo]},{id:`medieval-christian-neoplatonism`,order:11,nameZh:`中世纪基督教新柏拉图主义`,nameEn:`Medieval Christian Neoplatonism`,kind:`长时段思想传统 · 拉丁与希腊资源汇流`,period:`约 5—12 世纪`,regions:[`意大利`,`加洛林宫廷`,`贝克修道院`,`坎特伯雷`],thesis:`由可见世界和内在心灵上升至不可见源头，再以创造、神显、永恒和信仰理解重写古代流溢结构；上帝既是一切可理解性的根源，又超越存在和概念。`,classificationNote:`‘中世纪基督教新柏拉图主义’是现代分析标签，不是成员自称。波爱修斯同时传递亚里士多德逻辑，安瑟伦也不是爱留根纳体系的简单继承人；页面保留的是共同上升结构及其不同改写。`,context:{overview:`西欧直接可得的柏拉图文本很少，却通过奥古斯丁、波爱修斯、伪狄奥尼修和希腊教父持续接受新柏拉图思想。翻译稀缺使少数文本拥有异常大的结构性影响。`,factors:[{title:`有限文本条件`,detail:`拉丁世界主要通过《蒂迈欧》片段、奥古斯丁和波爱修斯认识柏拉图传统，而非完整对话集。`},{title:`希腊负神学重入西欧`,detail:`爱留根纳翻译伪狄奥尼修和马克西穆斯，使超越存在、神显和复归进入拉丁讨论。`},{title:`修院理性与祈祷`,detail:`安瑟伦把奥古斯丁内在性、逻辑训练和祈祷压缩为信仰寻求理解。`}]},architecture:{commonProblem:`超越一切有限范畴的上帝，怎样被受造世界和心灵认识？多样存在怎样来自统一根源并向它复归？`,sharedPremise:`感官世界自身不足以说明真理与善的稳定性；可见秩序是不可见原因的痕迹，却不能穷尽原因本身。`,method:`由外物秩序进入心灵和可理解形式，以肯定神学说明显现，再用否定神学取消有限谓词；逻辑反证则检验最高者概念的必然含义。`,answer:`受造物以参与、神显或被赋予存在依赖上帝；认识可以沿痕迹上升，但最终必须承认神超越普通存在分类。`,tensions:[{title:`流溢／创造`,detail:`世界若由最高者必然展开，如何保存自由创造与偶然历史？`},{title:`可说／不可说`,detail:`完全否定会使神学沉默，纯肯定又把上帝降为最高受造物。`},{title:`理性必然／信仰起点`,detail:`安瑟伦追求必然理解，但论证始终发生在祈祷与信仰共同体内部。`},{title:`世界价值／超越回归`,detail:`受造世界是神显和善的痕迹，却也可能被仅当作应当越过的低级阶段。`}]},philosophers:[{id:`augustine`,role:`拉丁内在性来源`,contribution:`把新柏拉图上升结构转入创造、意志、记忆、照明与历史救赎。`,interaction:`成为波爱修斯和安瑟伦的重要背景，也被爱留根纳与希腊负神学重新组合。`},{id:`boethius`,role:`古代—中世纪中介`,contribution:`以《慰藉》传递晚期柏拉图主义，以逻辑翻译提供学校推理工具。`,interaction:`共相、永恒和先知自由问题进入阿伯拉尔与后期经院哲学。`},{id:`eriugena`,role:`神显体系建构者`,contribution:`以自然四分、否定神学和复归系统化希腊基督教新柏拉图主义。`,interaction:`其大胆体系既影响神秘传统，也因泛神论嫌疑被后世审查。`},{id:`anselm`,role:`信仰理性化者`,contribution:`以不依赖大量权威引文的论证处理上帝存在、自由和救赎必然性。`,interaction:`本体论论证成为阿奎那批评与近代哲学重构的长期对象。`}],development:[{period:`4—6 世纪`,title:`奥古斯丁与波爱修斯的拉丁传递`,detail:`内在上升、永恒和逻辑教育成为早期中世纪可用资源。`},{period:`5—9 世纪`,title:`伪狄奥尼修传统西传`,detail:`希腊负神学经爱留根纳翻译进入加洛林宫廷。`},{period:`9 世纪`,title:`自然四分与神显体系`,detail:`爱留根纳把逻辑、创造和复归写成拉丁中世纪最大胆的早期体系。`},{period:`11 世纪`,title:`安瑟伦的紧缩论证`,detail:`宏大宇宙层级被转化为概念、反证和信仰理解的问题形式。`}],relations:[{target:`柏拉图主义`,relation:`思想来源`,detail:`灵魂上升、可理解秩序和由一到多的结构经奥古斯丁与伪狄奥尼修进入中世纪。`},{target:`教父哲学与拉丁基督教传统`,relation:`思想来源`,detail:`创造、照明、负神学和信仰理解由教父文本提供基督教框架。`},{target:`十二世纪辩证法与共相论`,relation:`吸收改造`,detail:`波爱修斯逻辑和安瑟伦论证把上升传统转化为语义、共相与必然性讨论。`},{target:`多明我会亚里士多德综合`,relation:`竞争`,detail:`两者都处理神、灵魂与创造；后者更系统依赖亚里士多德自然知识、抽象论和类比。`},{target:`方济各会经院哲学与唯名论`,relation:`后世重构`,detail:`波那文图拉延续照明和上升，司各脱与奥卡姆则重新限制其共同本性和神学证明。`}],influence:[{field:`神学语言`,detail:`否定、超越和参与提供在神人同义与完全不可知之间说话的工具。`},{field:`心灵哲学`,detail:`记忆、内在确定性、自我上升和自由意志进入中世纪主体讨论。`},{field:`本体论论证`,detail:`安瑟伦的概念路径经批评与重构进入笛卡尔、莱布尼茨和现代模态哲学。`}],russellView:`罗素把奥古斯丁—波爱修斯—爱留根纳—安瑟伦视为柏拉图传统支配拉丁思想的主线，既赞赏爱留根纳和安瑟伦的原创性，也警惕其神学前提。`,modernCorrection:`中世纪柏拉图主义并非只等待亚里士多德归来；它与逻辑、翻译、释经和制度相互生成。‘新柏拉图主义’标签必须说明媒介和差异，不能假定从普罗提诺到安瑟伦存在无断裂直线。`,chapterIds:[`b2-04`,`b2-05`,`b2-08`,`b2-11`],sources:[Yo(`第二卷第四、五、八及十一章`),Xo,{label:`Stanford Encyclopedia · John Scottus Eriugena`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/scottus-eriugena/`}]},{id:`islamic-falsafa-kalam`,order:12,nameZh:`伊斯兰哲学：法尔萨法与卡拉姆批评`,nameEn:`Islamic Philosophy: Falsafa and Kalām Critique`,kind:`多传统论争 · 证明、启示与自然秩序`,period:`约 9—12 世纪`,regions:[`巴格达`,`中亚`,`波斯`,`安达卢西亚`,`马格里布`],thesis:`希腊式证明哲学、伊斯兰神学与苏非实践围绕同一问题竞争：自然因果和必然存在怎样与神圣自由相容，哲学证明与经文解释各自面向谁。`,classificationNote:`法尔萨法、卡拉姆和苏非思想不是一个学派。阿维森纳自称以新的方式完成亚里士多德，安萨里从神学内部批评哲学家的证明资格，阿威罗伊再为亚里士多德哲学辩护；并置的重点是可追踪的论争链。`,context:{overview:`8—10 世纪希腊科学和哲学经叙利亚语与阿拉伯语翻译进入阿拔斯知识世界，形成哲学、医学、数学和宫廷赞助网络。法学与神学教育另有制度，哲学因此必须说明自身与启示、律法和共同体的关系。`,factors:[{title:`希腊—阿拉伯翻译运动`,detail:`几乎完整的亚里士多德、晚期古代注释和新柏拉图材料被翻译、改写并纳入新问题。`},{title:`法尔萨法与卡拉姆`,detail:`哲学家追求示范性证明，神学家从神圣属性、创造、正义与启示问题发展辩证论证。`},{title:`跨地域政治网络`,detail:`阿维森纳服务中亚和波斯宫廷，阿威罗伊服务安达卢西亚—马格里布政权，哲学从未只存在于单一‘伊斯兰黄金时代’中心。`}]},architecture:{commonProblem:`世界秩序是由必然因果展开还是由神圣选择持续创造？哲学证明若与经文字面冲突，应怎样判断和解释？`,sharedPremise:`理性论证具有真实价值，但真理、启示和人的最终命运不能由未经检验的权威或含混类比解决。`,method:`阿维森纳由本质—存在和可能—必然构造体系；安萨里逐项检验证明前提并用反例削弱因果必然；阿威罗伊返回亚里士多德文本和论证等级回应。`,answer:`没有共同结论：阿维森纳以必然存在统一因果，安萨里把稳定自然次序置于神圣自由下，阿威罗伊则主张严格证明与正确解释的经文不可能冲突。`,tensions:[{title:`必然秩序／神圣自由`,detail:`若世界由第一因必然流出，创造还能否是选择；若每刻完全直接创造，自然科学如何说明原因？`},{title:`证明／辩证`,detail:`谁有资格声称前提自明、结论必然，是安萨里攻击哲学家的核心。`},{title:`精英解释／公共信仰`,detail:`复杂寓意是否应向所有人公开，涉及教育能力和共同体稳定。`},{title:`共同理智／个人责任`,detail:`阿威罗伊式理智统一如何解释个人知识、不朽和道德归责，引发拉丁世界激烈争论。`}]},philosophers:[{id:`avicenna`,role:`体系重构者`,contribution:`以本质—存在、必然存在、灵魂能力和百科结构建立后世阿拉伯哲学的主框架。`,interaction:`安萨里以其体系为主要批评对象，拉丁经院哲学则大量吸收其概念。`},{id:`al-ghazali`,role:`证明审查者`,contribution:`精确陈述哲学后批评世界永恒、神知和因果必然，并将知识与苏非实践连接。`,interaction:`促使阿威罗伊写《不一致的不一致》，但并未终结伊斯兰哲学。`},{id:`averroes`,role:`亚里士多德辩护者`,contribution:`以多层注释、论证等级和经文解释规则维护哲学合法性。`,interaction:`经希伯来文和拉丁文获得巨大后世影响，并成为阿奎那批评理智统一的对象。`}],development:[{period:`8—10 世纪`,title:`翻译与巴格达逍遥传统`,detail:`希腊文本、基督徒译者和穆斯林赞助者共同形成阿拉伯语哲学语汇。`},{period:`11 世纪`,title:`阿维森纳体系取得中心地位`,detail:`哲学由注释亚里士多德转为注释和改写阿维森纳式百科。`},{period:`11—12 世纪`,title:`安萨里的内在批评`,detail:`卡拉姆吸收哲学工具，同时拒绝部分形而上学结论的证明资格。`},{period:`12 世纪以后`,title:`阿威罗伊回应与跨语言接受`,detail:`其亚里士多德注释在拉丁和希伯来传统中的影响尤其深远。`}],relations:[{target:`亚里士多德主义／逍遥学派`,relation:`思想来源`,detail:`逻辑、自然学、灵魂论和示范科学提供法尔萨法的课程骨架。`},{target:`柏拉图主义`,relation:`思想来源`,detail:`新柏拉图流溢、理智层级与亚里士多德材料结合，塑造阿维森纳宇宙论。`},{target:`中世纪犹太哲学`,relation:`吸收改造`,detail:`阿拉伯语哲学与卡拉姆为迈蒙尼德处理律法、创世和神圣属性提供共同语境。`},{target:`多明我会亚里士多德综合`,relation:`后世重构`,detail:`阿维森纳和阿威罗伊经翻译进入大学，推动阿尔伯特与阿奎那吸收并批评。`},{target:`方济各会经院哲学与唯名论`,relation:`后世重构`,detail:`阿维森纳的本性与意向、哲学证明和因果问题进入司各脱与后期拉丁争论。`}],influence:[{field:`存在论`,detail:`本质—存在与必然—可能区分改变伊斯兰、犹太和拉丁形而上学。`},{field:`因果哲学`,detail:`火与棉花之争持续迫使哲学区分经验规律、必要联系与神圣行动。`},{field:`跨语言大学知识`,detail:`阿拉伯语百科和注释经拉丁、希伯来翻译重塑十三世纪课程。`}],russellView:`罗素把伊斯兰文明视为古希腊知识保存并传回西欧的关键中介，重点讨论阿维森纳、安萨里与阿威罗伊的亚里士多德主义、神学批评和拉丁影响。`,modernCorrection:`‘保存希腊哲学的桥梁’严重低估原创性，也把伊斯兰世界写成欧洲前史。现代研究强调阿维森纳之后哲学持续繁荣，法尔萨法、卡拉姆和苏非思想会相互吸收，而非单线兴衰。`,chapterIds:[`b2-10`,`b2-12`,`b2-13`,`b2-14`],sources:[Yo(`第二卷第十、十二至十四章`),Xo,{label:`Stanford Encyclopedia · al-Ghazali`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/al-ghazali/`}]},{id:`medieval-jewish-philosophy`,order:13,nameZh:`中世纪犹太哲学`,nameEn:`Medieval Jewish Philosophy`,kind:`跨语言传统 · 律法、解释与哲学`,period:`约 9—13 世纪（含斐洛前史）`,regions:[`亚历山大里亚`,`安达卢西亚`,`北非`,`埃及`,`普罗旺斯`],thesis:`在犹太律法和释经传统中吸收希腊—阿拉伯哲学：上帝属性、创世、先知和诫命可以接受理性说明，但哲学表达必须考虑语言、读者能力与共同体实践。`,classificationNote:`斐洛属于希腊化犹太哲学，不是中世纪作者；本站把他作为远源而非连续师承成员。现有人物资料以迈蒙尼德为核心，页面不据此假装中世纪犹太哲学只有一位代表。`,context:{overview:`中世纪犹太思想家生活在伊斯兰和基督教政权下，常以阿拉伯语参与共同哲学世界，同时以希伯来经文、拉比法学和社群责任组织问题。翻译把阿拉伯语著作带入希伯来文和拉丁文的新读者网络。`,factors:[{title:`阿拉伯语思想共同体`,detail:`犹太、穆斯林和基督徒共享哲学术语、医学与科学教育，不等于宗教边界消失。`},{title:`成文与口传律法`,detail:`哲学解释必须面对《托拉》、密西拿和塔木德传统，而非只有抽象启示命题。`},{title:`迁徙与翻译`,detail:`安达卢西亚、马格里布、埃及和普罗旺斯之间的迁徙，使阿拉伯语作品转入希伯来文与拉丁文。`}]},architecture:{commonProblem:`哲学证明与律法经文表面冲突时，怎样既不放弃理性，也不破坏共同体的实践与语言？`,sharedPremise:`真理不能反对真理，但经文使用面向共同体的叙事和比喻；不同读者对复杂形而上学的承受能力不同。`,method:`结合语言解释、否定神学、行动属性、隐微写作和法律分类；对世界永恒等无法证明的问题保持审慎。`,answer:`关于上帝本质，知道‘不是什么’常比肯定共有属性可靠；律法不仅传递命题，也训练行动、欲望和共同生活。`,tensions:[{title:`哲学精英／共同体读者`,detail:`隐微写作保护学习过程，也可能制造谁有权解释的精英结构。`},{title:`否定神学／宗教语言`,detail:`严格否定可维护神圣统一，却会拉远祈祷和经文中的人格语言。`},{title:`创世／世界永恒`,detail:`哲学能否证明时间开端，决定何时需要依靠启示而非示范。`},{title:`思想融合／身份抹除`,detail:`共享阿拉伯哲学语言不能把犹太思想只写成伊斯兰或拉丁传统的附属。`}]},philosophers:[{id:`philo-alexandria`,role:`希腊化前史`,contribution:`以寓意释经和逻各斯展示犹太经文与希腊哲学可以形成高密度接口。`,interaction:`与迈蒙尼德没有简单直线师承，两人分别面对中期柏拉图主义和亚里士多德—阿拉伯哲学。`},{id:`maimonides`,role:`法律与哲学综合者`,contribution:`以《密西拿托拉》系统化律法，以《迷途指津》处理负神学、创世、先知与哲学困惑。`,interaction:`吸收阿维森纳和阿威罗伊问题，又影响阿奎那及希伯来文后继争论。`},{id:`avicenna`,role:`阿拉伯语形而上学来源`,contribution:`本质—存在、必然存在和灵魂理论为犹太哲学提供关键术语。`,interaction:`迈蒙尼德既使用哲学框架，也对宇宙必然性和神圣属性保持距离。`},{id:`averroes`,role:`安达卢西亚平行传统`,contribution:`亚里士多德注释和解释层级经希伯来翻译进入犹太思想。`,interaction:`两者共享安达卢西亚背景，但各自在不同律法共同体内工作。`}],development:[{period:`公元 1 世纪`,title:`斐洛的希腊化前史`,detail:`犹太经文首次在大规模希腊哲学解释中形成体系。`},{period:`9—11 世纪`,title:`卡拉姆与早期犹太哲学`,detail:`萨阿迪亚等人在阿拉伯语神学环境中讨论创造、启示和理性。`},{period:`12 世纪`,title:`安达卢西亚与迈蒙尼德`,detail:`亚里士多德—阿拉伯哲学、法律系统化和社群领导汇合。`},{period:`13 世纪以后`,title:`希伯来翻译与内部争论`,detail:`《迷途指津》和阿威罗伊著作进入欧洲犹太社群，引发支持与反对。`}],relations:[{target:`教父哲学与拉丁基督教传统`,relation:`分化`,detail:`斐洛式经文—哲学接口分别被基督教和犹太传统重构，不能据相似性假定统一谱系。`},{target:`伊斯兰哲学：法尔萨法与卡拉姆批评`,relation:`思想来源`,detail:`中世纪犹太哲学在阿拉伯语思想世界中直接吸收法尔萨法、卡拉姆、科学和写作形式。`},{target:`多明我会亚里士多德综合`,relation:`后世重构`,detail:`迈蒙尼德经拉丁翻译进入阿奎那的神圣属性、律法和创世讨论。`},{target:`中世纪政教权力思想`,relation:`竞争`,detail:`迈蒙尼德以社群法律和领袖责任处理宗教—政治生活，与相近时期拉丁教皇—帝国问题形成并行而不同的制度答案。`}],influence:[{field:`负神学`,detail:`严格区分行动属性与本质属性，强化语言限度意识。`},{field:`法律哲学`,detail:`诫命既有共同体秩序功能，也服务于人格和理智完善。`},{field:`跨文化解释`,detail:`同一哲学问题在犹太、伊斯兰和基督教律法传统中产生不同边界。`}],russellView:`罗素以犹太宗教发展为第二卷开端，并把迈蒙尼德视为最重要的犹太哲学家，强调其亚里士多德主义、创世审慎和对阿奎那的影响。`,modernCorrection:`不能只在‘影响基督教欧洲’时才看见犹太哲学。其核心还包括希伯来与阿拉伯语文本、拉比法律、社群领导和内部接受史；斐洛与迈蒙尼德之间也不是空白直线。`,chapterIds:[`b2-01`,`b2-10`,`b2-13`],sources:[Yo(`第二卷第一、十及十三章`),Xo,{label:`Stanford Encyclopedia · Maimonides`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/maimonides/`}]},{id:`twelfth-century-dialectic`,order:14,nameZh:`十二世纪辩证法与共相论`,nameEn:`Twelfth-Century Dialectic and the Problem of Universals`,kind:`学校问题共同体 · 修院与城市课堂竞争`,period:`约 1050—1150`,regions:[`贝克`,`巴黎`,`苏瓦松`,`克莱尔沃`],thesis:`逻辑不再只是古代教材，而成为处理共相、三位一体、伦理意图和权威冲突的方法；城市学校的辩证技术与修院神学的转化理想在同一世纪公开碰撞。`,classificationNote:`这不是统一学派。安瑟伦、罗瑟林、阿伯拉尔和伯尔纳彼此批评，甚至代表不同制度环境；页面将他们组织为共享问题空间，而不是制造不存在的共同教义。`,context:{overview:`城市、主教座堂学校和巴黎教师市场扩大，学生可在竞争名师之间流动。拉丁世界主要掌握波爱修斯传下的旧逻辑，还未完整获得亚里士多德自然学和形而上学，语言与范畴因此承担异常大的理论重量。`,factors:[{title:`竞争性学校网络`,detail:`教师通过公开辩论建立声誉，学生跨地区流动，哲学论证获得新的职业和制度动力。`},{title:`有限的亚里士多德材料`,detail:`《范畴篇》《解释篇》和波菲利导论足以引发共相与语义问题，却尚无完整自然哲学体系。`},{title:`修院与学校知识观`,detail:`辩证法强调辨义和冲突解决，修院神学则追问求知是否使欲望谦卑和转化。`}]},architecture:{commonProblem:`共同名称如何真实述说许多个体？理性澄清信仰时，怎样避免把奥秘拆成语言游戏或权威堆积？`,sharedPremise:`概念、名称和论证形式会改变神学结论；仅引用权威不足以解决看似矛盾的文本。`,method:`以定义、区分、反证、正反权威并列和语义分析推进问题；修院批评则检验求知动机、谦卑与生活后果。`,answer:`罗瑟林把存在优先权交给个体与名称；阿伯拉尔用语词意义和谓述功能避免共同实体；安瑟伦以信仰内部的必要论证工作；伯尔纳坚持知识必须完成于爱。`,tensions:[{title:`实在共相／语言功能`,detail:`共同谓词需要客观根据，却未必要求一个可与个体分离的共同物。`},{title:`辩证法／奥秘`,detail:`逻辑能发现含混，也可能在尚未理解宗教实践时制造虚假控制感。`},{title:`意图／行为`,detail:`阿伯拉尔将责任定位于同意和意图，但外在后果与无知责任仍不能消失。`},{title:`自由探究／制度谴责`,detail:`苏瓦松与桑斯的审查显示学术争论同时受权威和政治网络塑造。`}]},philosophers:[{id:`anselm`,role:`信仰内的必然论证者`,contribution:`以本体论论证、自由意志和救赎必然性展示理性无需堆积权威也能工作。`,interaction:`直接反驳罗瑟林的三位一体解释，也成为阿奎那后来的批评对象。`},{id:`roscelin`,role:`早期唯名论触发者`,contribution:`把共相与名称或声音联系，使个体与共同谓词的冲突进入神学。`,interaction:`其观点主要由安瑟伦和阿伯拉尔等对手保存，必须保持证据谨慎。`},{id:`abelard`,role:`语义与辩证法革新者`,contribution:`以状态、谓述和《是与否》重写共相、权威冲突和意图伦理。`,interaction:`既批评罗瑟林，也因神学方法受到伯尔纳推动的审查。`},{id:`bernard-clairvaux`,role:`修院知识批评者`,contribution:`以谦卑、爱与人格转化检验辩证知识的目的。`,interaction:`不是拒绝一切理性，而是与阿伯拉尔争夺何种知识实践配称神学。`},{id:`boethius`,role:`逻辑文本来源`,contribution:`其翻译注释和共相问题为十二世纪学校提供基础材料。`,interaction:`后继者在有限文本上发展出远超原导论规模的语义与本体论。`}],development:[{period:`11 世纪后半叶`,title:`逻辑复兴与罗瑟林争议`,detail:`共同名称和三位一体关系首次以高强度方式碰撞。`},{period:`1070—1100 年代`,title:`安瑟伦的独立论证`,detail:`修院祈祷和逻辑反证结合为信仰寻求理解。`},{period:`1100—1140 年代`,title:`阿伯拉尔与巴黎学校`,detail:`共相、语义、权威冲突和意图伦理形成系统课堂方法。`},{period:`1140 以后`,title:`谴责与大学化前夜`,detail:`伯尔纳—阿伯拉尔冲突后，辩证方法仍进入十三世纪问题体裁。`}],relations:[{target:`中世纪基督教新柏拉图主义`,relation:`思想来源`,detail:`波爱修斯逻辑和安瑟伦式信仰理解提供文本与论证起点。`},{target:`西方修道制度与教牧思想`,relation:`竞争`,detail:`城市学校的公开辩证法与修院默想在知识目标、权威与人格转化上发生冲突。`},{target:`多明我会亚里士多德综合`,relation:`分化`,detail:`十三世纪在新亚里士多德材料和大学制度中把问题体裁扩展为完整神学—哲学综合。`},{target:`方济各会经院哲学与唯名论`,relation:`分化`,detail:`方济各会传统同时继承修院灵修、语言分析与个体优先，并在司各脱和奥卡姆处分叉。`}],influence:[{field:`逻辑与语义`,detail:`共相、语词意义、命题内容和指称成为拉丁哲学的长期强项。`},{field:`经院方法`,detail:`并列反对意见、辨析权威和公开答辩成为大学问题体裁基础。`},{field:`伦理`,detail:`意图、同意与行为区分把责任放入更细的心理结构。`}],russellView:`罗素把十二世纪写成经院哲学重新活跃的阶段，以安瑟伦论证、罗瑟林唯名论和阿伯拉尔—伯尔纳冲突展示理性、权威与个人独立。`,modernCorrection:`‘理性阿伯拉尔对反智伯尔纳’过于戏剧化。双方都使用理性并关心灵魂，只是制度、体裁和知识目的不同；罗瑟林材料又极少，不能补成完整唯名论体系。`,chapterIds:[`b2-11`,`b2-12`],sources:[Yo(`第二卷第十一至十二章`),Xo,{label:`Stanford Encyclopedia · Peter Abelard`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/abelard/`}]},{id:`dominican-aristotelian-synthesis`,order:15,nameZh:`多明我会亚里士多德综合`,nameEn:`Dominican Aristotelian Synthesis`,kind:`大学经院传统 · 亚里士多德吸收与校正`,period:`约 1230—14 世纪`,regions:[`巴黎`,`科隆`,`意大利`,`拉丁大学网络`],thesis:`完整的亚里士多德自然与形而上学具有相对自主的证明方法；神学无需摧毁自然知识，而应吸收、校正并把它置于创造和恩典的更大秩序。`,classificationNote:`页面聚焦大阿尔伯特与托马斯·阿奎那的多明我会路线，不把所有多明我会作者归为托马斯主义。阿维森纳、阿威罗伊和迈蒙尼德是关键思想来源与论敌，不是该修会成员。`,context:{overview:`十二至十三世纪翻译运动把亚里士多德自然学、形而上学及阿拉伯注释带入巴黎等大学。新知识解释力强，却与世界永恒、单一理智和创造教义产生冲突；托钵修会进入大学后承担系统回应。`,factors:[{title:`完整亚里士多德进入课程`,detail:`逻辑之外的自然、心理和形而上学文本首次形成统一学科压力。`},{title:`阿拉伯与犹太哲学输入`,detail:`阿维森纳、阿威罗伊和迈蒙尼德不仅传递文本，也提供原创问题结构。`},{title:`大学与托钵修会`,detail:`巴黎教席、公开答辩和修会网络使综合体系能够快速传播并接受审查。`}]},architecture:{commonProblem:`自然理性的证明能走多远？怎样接受亚里士多德科学而不接受世界永恒、单一理智或与创造冲突的解释？`,sharedPremise:`真理不能反对真理；哲学和神学因对象、起点与方法不同而可区分，却在同一世界中最终协调。`,method:`先完整重述哲学对手，以四因、潜能—现实、质料—形式和后验论证分析自然，再用类比、存在参与与信仰条款划分边界。`,answer:`自然与理性有真实自主性，恩典使自然完成；人可由受造效果认识第一原因，却不能仅凭自然理性证明三位一体等启示真理。`,tensions:[{title:`学科自主／神学统摄`,detail:`若哲学完全自主，可能产生双重权威；若每个自然问题直接诉诸启示，学科区分又失效。`},{title:`亚里士多德／创造论`,detail:`自然种类和永恒运动解释必须与自由创造、时间开端的信仰区分。`},{title:`理智普遍性／个人灵魂`,detail:`知识的共同有效性不能以取消个人理智、不朽和责任为代价。`},{title:`自然法普遍性／具体审慎`,detail:`普遍倾向需要在可变制度中应用，不能变成脱离历史的规则清单。`}]},philosophers:[{id:`albert-great`,role:`百科吸收开拓者`,contribution:`系统释义亚里士多德与阿拉伯材料，并以观察、学科区分扩大自然研究。`,interaction:`在科隆培养阿奎那，但其自然哲学与神秘传统有独立价值。`},{id:`aquinas`,role:`存在与神学综合者`,contribution:`以存在活动、五路、类比、自然法和德性伦理建立高度统一体系。`,interaction:`吸收阿维森纳，依赖又批评阿威罗伊，并持续回应奥古斯丁与迈蒙尼德。`},{id:`avicenna`,role:`形而上学来源`,contribution:`提供本质—存在、可能—必然和灵魂能力结构。`,interaction:`阿奎那保留区分却改变必然流溢和认识机制。`},{id:`averroes`,role:`注释权威与论敌`,contribution:`使完整亚里士多德论证进入拉丁大学，并以理智统一提出尖锐挑战。`,interaction:`阿尔伯特和阿奎那都大量阅读且明确反驳。`},{id:`maimonides`,role:`一神论平行资源`,contribution:`负神学、创世审慎和律法目的影响拉丁讨论。`,interaction:`阿奎那发展更肯定的类比语言，并把自然法置于基督教神学体系。`}],development:[{period:`12—13 世纪初`,title:`翻译与禁令`,detail:`亚里士多德和阿拉伯哲学迅速进入课程，也受到巴黎局部限制。`},{period:`约 1240—1260`,title:`大阿尔伯特的百科吸收`,detail:`先理解学科整体，再判断与基督教教义的冲突。`},{period:`1250—1274`,title:`阿奎那体系化`,detail:`问题体裁、存在论和德性—法律结构形成成熟综合。`},{period:`1277 以后`,title:`谴责、校正与托马斯主义`,detail:`部分命题受审查，阿奎那思想在争论中逐渐成为独立学派资源。`}],relations:[{target:`亚里士多德主义／逍遥学派`,relation:`思想来源`,detail:`四因、潜能—现实、灵魂与德性提供自然哲学和伦理骨架。`},{target:`伊斯兰哲学：法尔萨法与卡拉姆批评`,relation:`思想来源`,detail:`阿维森纳和阿威罗伊的体系与注释迫使拉丁作者重新定义存在、理智和证明。`},{target:`中世纪犹太哲学`,relation:`思想来源`,detail:`迈蒙尼德的神圣属性、创世和律法分析进入阿奎那综合。`},{target:`中世纪基督教新柏拉图主义`,relation:`竞争`,detail:`都处理上帝与受造物，但对照明、抽象、类比和自然知识自主性重心不同。`},{target:`方济各会经院哲学与唯名论`,relation:`竞争`,detail:`方济各会作者围绕存在语言、个体化、自由、照明和本体简约持续修正托马斯路线。`}],influence:[{field:`天主教神学`,detail:`托马斯主义成为长期教学传统，但其正统地位经历数世纪形成。`},{field:`德性与自然法`,detail:`共同善、实践理性和审慎仍影响伦理、法律与政治哲学。`},{field:`学科关系`,detail:`自然理性与启示既区分又协调，成为讨论科学与宗教关系的经典模型。`}],russellView:`罗素把大阿尔伯特与阿奎那视为天主教吸收亚里士多德的决定性人物，称阿奎那为最伟大的经院哲学家，同时批评其结论受正统预设限制。`,modernCorrection:`这不是单向‘基督教化亚里士多德’：阿拉伯与犹太原创哲学深刻改变了问题，阿奎那也并非未经争论即成为官方思想。体系内部的真实反对意见不能被事后正统化抹平。`,chapterIds:[`b2-10`,`b2-12`,`b2-13`],sources:[Yo(`第二卷第十、十二至十三章`),Xo,{label:`Stanford Encyclopedia · Thomas Aquinas`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/aquinas/`}]},{id:`franciscan-scholastic-nominalism`,order:16,nameZh:`方济各会经院哲学与唯名论`,nameEn:`Franciscan Scholasticism and Nominalism`,kind:`修会内部多路线 · 照明、经验、个体与简约`,period:`约 13—14 世纪`,regions:[`巴黎`,`牛津`,`科隆`,`阿维尼翁`,`慕尼黑`],thesis:`方济各会思想没有单一教义：波那文图拉以照明和爱限制哲学自足，罗杰·培根以语言、数学和经验改革知识，司各脱强化个体与自由，奥卡姆再以符号和简约削减本体承诺。`,classificationNote:`将四人并置不意味着从波那文图拉直线发展到奥卡姆。‘方济各会学派’内部差异极大，唯名论只适合奥卡姆等部分路线；页面用共同制度背景展示分化，而非强求共享体系。`,context:{overview:`方济各会从贫穷与传教运动进入巴黎、牛津等大学，必须同时处理修会身份、学术职业和新亚里士多德知识。内部关于贫穷、权威和哲学方法的冲突，使个体、自由与简约问题具有制度后果。`,factors:[{title:`托钵修会进入大学`,detail:`贫穷共同体成为拥有教席和国际网络的学术机构，产生理想与制度资源之间的张力。`},{title:`牛津与巴黎差异`,detail:`数学、光学、语言与自然研究在牛津环境中更突出，巴黎则集中神学教席和谴责争论。`},{title:`贫穷与教皇权力争论`,detail:`奥卡姆的政治转向源于基督和使徒贫穷争议，逻辑简约与权威限制并非完全分离。`}]},architecture:{commonProblem:`哲学知识需要多少形而上学装置？个体、自由和经验证据怎样在神学体系中获得不被普遍形式吞没的位置？`,sharedPremise:`受造物的个体性与神圣自由不能被必然体系轻易取消；知识方法必须对语言、证据和心灵限度负责。`,method:`波那文图拉以照明和上升组织知识；培根用语言、数学、仪器和经验纠错；司各脱以形式区别和模态分析；奥卡姆用心灵语言、指代与剃刀削减实体。`,answer:`不存在单一答案。共同方向是拒绝把托马斯综合当作唯一可能框架，并从爱、实验、此性、意志或符号功能重新安排哲学边界。`,tensions:[{title:`照明／自然认识`,detail:`确定真理是否需要特殊神圣照明，还是自然抽象能力已经充分？`},{title:`共同本性／个体`,detail:`司各脱保留共同本性与此性，奥卡姆则认为这仍增加多余实体。`},{title:`理智／意志`,detail:`自由行动是否由最好判断决定，还是意志在同一时刻仍能选择相反项？`},{title:`知识改革／制度服从`,detail:`培根与奥卡姆都因改革和争论遭修会限制，却不能简单塑造成现代自由科学家。`}]},philosophers:[{id:`roger-bacon`,role:`知识改革者`,contribution:`以语言、数学、光学和经验科学校正权威、习惯与翻译错误。`,interaction:`与大阿尔伯特共享自然知识扩展，却提出更激进的课程改革计划。`},{id:`bonaventure`,role:`奥古斯丁—方济各综合者`,contribution:`把世界痕迹、神圣照明和心灵旅程连接到爱与默观。`,interaction:`与阿奎那同在巴黎教学，却对哲学自足和世界永恒保持更强警惕。`},{id:`duns-scotus`,role:`精微形而上学家`,contribution:`以存在单义、此性、形式区别和同步偶然性强化个体与自由。`,interaction:`批评托马斯路线，又成为奥卡姆进一步本体简约的直接背景。`},{id:`ockham`,role:`逻辑简约与政治批评者`,contribution:`用心灵语言和指代理论解释共相，并限制教皇绝对权力。`,interaction:`拒绝司各脱若干实体性区分，却继承个体优先和意志问题。`}],development:[{period:`13 世纪中叶`,title:`波那文图拉与培根的不同改革`,detail:`一条以照明和爱整合大学知识，一条以语言、数学和经验纠错。`},{period:`13 世纪末`,title:`司各脱的精微体系`,detail:`存在语言、个体化和自由获得新的模态与形式工具。`},{period:`14 世纪前期`,title:`奥卡姆的本体简约`,detail:`共同本性与形式区别被符号理论和个体本体论取代。`},{period:`14 世纪以后`,title:`学派化与近代重读`,detail:`司各脱主义、奥卡姆主义长期并存，后世又把培根和剃刀改写成现代科学先驱符号。`}],relations:[{target:`西方修道制度与教牧思想`,relation:`思想来源`,detail:`贫穷、服从、共同生活和人格转化提供修会身份资源。`},{target:`十二世纪辩证法与共相论`,relation:`思想来源`,detail:`共相、语义、权威冲突和意图问题成为晚期经院逻辑的起点。`},{target:`伊斯兰哲学：法尔萨法与卡拉姆批评`,relation:`思想来源`,detail:`阿维森纳的本性与意向、阿拉伯光学及因果争论进入方济各会讨论。`},{target:`多明我会亚里士多德综合`,relation:`竞争`,detail:`围绕照明、存在语言、个体化、自由和神学证明形成多条批评路线。`},{target:`中世纪政教权力思想`,relation:`吸收改造`,detail:`奥卡姆把方济各贫穷争论转化为教皇可错、信徒自由和权威纠正问题。`}],influence:[{field:`个体与模态`,detail:`此性、同步偶然性和个体本体论持续影响现代形而上学。`},{field:`逻辑与方法`,detail:`心灵语言、指代和简约原则强化语言分析与解释经济性。`},{field:`科学史形象`,detail:`数学、经验与剃刀常被现代化重读，需要与其中世纪神学目标并置。`}],russellView:`罗素把方济各会作者视为反托马斯和走向近代的路线，赞赏罗杰·培根的实验精神、司各脱的个体与意志、奥卡姆的唯名论和反教皇政治。`,modernCorrection:`‘从经院衰落到现代科学’是过强直线。四人有不同问题和制度处境；奥卡姆剃刀不是经验主义口号，司各脱精微也不是无意义繁琐。`,chapterIds:[`b2-14`,`b2-15`],sources:[Yo(`第二卷第十四至十五章`),Xo,{label:`Stanford Encyclopedia · William of Ockham`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/ockham/`}]},{id:`medieval-church-state-thought`,order:17,nameZh:`中世纪政教权力思想`,nameEn:`Medieval Church–State Thought`,kind:`跨时期问题传统 · 教会、帝国与公民共同体`,period:`4—14 世纪`,regions:[`米兰`,`罗马`,`阿维尼翁`,`巴黎`,`慕尼黑`,`意大利城邦`],thesis:`宗教权威与政治强制权并非天然同一：从主教约束皇帝、教皇承担城市治理，到奥卡姆和马西略限制教皇权力，争论逐步转向谁制定法律、谁能纠正最高权威。`,classificationNote:`这是跨时期政治问题传统，不是成员相识或共享教义的学派。安布罗斯与格列高利扩展教会公共权威，奥卡姆与马西略则在不同基础上限制教皇；把他们连成直线进步史同样错误。`,context:{overview:`晚期罗马帝国的基督教化、西部行政崩解、教皇制扩张、授职权争论、城市和王权成长，反复改变属灵权威与强制权的实际分配。十四世纪教廷—帝国冲突使法律来源与代表问题达到新强度。`,factors:[{title:`帝国基督教化`,detail:`皇帝进入教会后，主教必须判断政治统治是否也受圣礼和公共道德纪律约束。`},{title:`行政缺位与教会治理`,detail:`格列高利时期教皇承担救济、地产、谈判和传教，属灵职位获得现实行政能力。`},{title:`教皇—帝国与城市冲突`,detail:`授职、税收、司法和意大利政治使‘最高权力’不再能靠模糊双权理论维持。`}]},architecture:{commonProblem:`谁拥有制定并强制执行公共法律的权力？当皇帝或教皇犯错时，谁能审判和纠正最高权威？`,sharedPremise:`公共和平需要可识别的权威边界；宗教职位具有道德功能，却不能自动证明所有政治命令正当。`,method:`早期通过书信、圣礼纪律和主教行动建立先例；后期以法律文本、权利、异端可能性、公民整体和会议代表进行制度论证。`,answer:`安布罗斯主张皇帝在教会内受纪律；格列高利把权威写成牧灵服务；奥卡姆允许纠正错误教皇；马西略则把政治强制法源置于公民整体。`,tensions:[{title:`道德权威／强制权`,detail:`能教导或拒绝圣礼是否意味着能罚款、监禁、废立君主？`},{title:`补位治理／权力扩张`,detail:`教会在危机中承担行政可保护共同体，也会把临时功能转成永久管辖主张。`},{title:`统一教会／纠错机制`,detail:`若最高教皇可能异端，会议、信徒或世俗权力以何种程序纠正？`},{title:`公民整体／现代民主`,detail:`马西略的立法者概念限制教皇，却不等于普选、平权和现代世俗国家。`}]},philosophers:[{id:`ambrose`,role:`主教限制皇权的先例`,contribution:`以教会自主和忏悔纪律说明基督教皇帝仍受公共道德判断。`,interaction:`后世常把狄奥多西事件塑造成教会战胜国家，实际关系更依赖协商。`},{id:`gregory-great`,role:`教皇治理实践者`,contribution:`在帝国能力衰弱时承担行政、救济、谈判和传教，并以服务语言规范职位。`,interaction:`其补位治理为教皇公共权威积累现实基础，也不能简单等同后期教皇君主制。`},{id:`ockham`,role:`权威可错与信徒自由论者`,contribution:`从方济各贫穷争论出发，论证教皇可能异端且权力受到福音自由限制。`,interaction:`与马西略共同投靠路易四世，却保留更强的教会制度与权利语言。`},{id:`marsilius-padua`,role:`公民立法与会议主义者`,contribution:`把强制法源归于公民整体或较有分量部分，并否认教士独立强制权。`,interaction:`比奥卡姆更彻底地从政治共同体结构限制教皇管辖。`}],development:[{period:`4 世纪`,title:`主教纪律面对基督教皇帝`,detail:`安布罗斯以圣礼和教会空间建立皇权并非宗教无责的先例。`},{period:`6 世纪`,title:`教皇承担城市与区域治理`,detail:`格列高利把牧灵、行政和外交组合为新的公共职位。`},{period:`11—13 世纪`,title:`教皇君主制与授职争论`,detail:`双权关系制度化并扩张，王权、教会法和城市同时成长。`},{period:`14 世纪`,title:`奥卡姆与马西略的限制理论`,detail:`教皇可错、会议代表、公民立法和无强制教士成为系统论证。`}],relations:[{target:`教父哲学与拉丁基督教传统`,relation:`思想来源`,detail:`教会自主、两个城和公共罪责为政教边界提供早期语言。`},{target:`西方修道制度与教牧思想`,relation:`思想来源`,detail:`主教和教皇的实际治理使权威作为照护与行政负担得到制度经验。`},{target:`十二世纪辩证法与共相论`,relation:`吸收改造`,detail:`学校论证和教会法使权威冲突逐渐从先例转向程序、法源和代表问题。`},{target:`方济各会经院哲学与唯名论`,relation:`思想来源`,detail:`奥卡姆把修会贫穷、权利和权威可错直接带入反教皇政治论证。`},{target:`近代国家、宗教改革与宪政`,relation:`后世重构`,detail:`后世选择性吸收会议、公民立法和权力限制，但不应把中世纪论证直接等同现代主权。`}],influence:[{field:`权力限制`,detail:`最高宗教权威可能犯错，因此需要纠正主体、程序和管辖边界。`},{field:`法源与代表`,detail:`公民整体、较有分量部分和大公会议把共同体代表问题推到中心。`},{field:`政教边界`,detail:`道德教导、圣礼管辖和世俗强制被逐步区分，虽未形成现代分离模式。`}],russellView:`罗素从安布罗斯限制狄奥多西写到教皇制兴衰，最终高度评价马西略和奥卡姆反对教皇绝对权力，把他们视为近代政治思想的先声。`,modernCorrection:`罗素的自由主义进步线索会压平不同制度语境。安布罗斯不是现代宪政者，格列高利不是国家替代者，马西略的公民也不等于全民；但他们确实提供了可错权威、管辖区分与法源竞争的关键模型。`,chapterIds:[`b2-03`,`b2-06`,`b2-07`,`b2-09`,`b2-14`,`b2-15`],sources:[Yo(`第二卷第三、六、七、九、十四至十五章`),Xo,{label:`Stanford Encyclopedia · Marsilius of Padua`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/marsilius-padua/`}]}],Qo={思想来源:{order:1,direction:`directed`,temporal:`先行资源`,mechanism:`概念输入`,description:`后来的传统把前人的问题、概念或论证当作资源。`},竞争:{order:2,direction:`reciprocal`,temporal:`同代或相近时期`,mechanism:`问题论争`,description:`不同传统围绕相近问题提出互相排斥或持续回应的答案。`},分化:{order:3,direction:`directed`,temporal:`共同传统的支流`,mechanism:`谱系分叉`,description:`共同来源内部形成不同路线；方向表示谱系分支，不等于严格年代顺序。`},吸收改造:{order:4,direction:`directed`,temporal:`选择性继承`,mechanism:`功能改写`,description:`后来的传统选择性继承概念，并将其放入新的体系或目的中。`},后世重构:{order:5,direction:`directed`,temporal:`后世接受`,mechanism:`翻译、注释与制度化`,description:`较晚时代通过翻译、注释、制度或新问题重新解释前一传统。`}},$o=e=>({label:`罗素《西方哲学史》${e}`,kind:`原书`,url:`https://www.russell-j.com/cool/HWP_1945.pdf`}),es=[{id:`presocratic-traditions`,order:1,nameZh:`前苏格拉底自然哲学诸传统`,nameEn:`Presocratic Traditions`,kind:`传统群 · 现代统称`,period:`约前 6 世纪—前 5 世纪`,regions:[`爱奥尼亚`,`大希腊`,`雅典`],thesis:`把世界视为可以从内部原则得到解释的秩序，并在‘变化如何可能’这一共同问题上，依次提出本原、数、逻各斯、存在、多元要素和原子等不同方案。`,classificationNote:`“前苏格拉底”不是当事人自称的学派，也不完全是年代概念：阿那克萨哥拉和德谟克利特与苏格拉底同时。本站把它作为问题谱系，内部差异比统一教义更重要。`,context:{overview:`殖民城邦、海上贸易、测量技术和跨文明接触，使早期希腊思想能够把天象、地理、生命和政治秩序放在同一个可解释世界中。波斯扩张与城邦竞争又把知识从爱奥尼亚带向大希腊和雅典。`,factors:[{title:`爱奥尼亚交流网络`,detail:`米利都等港口连接埃及、巴比伦和小亚细亚；历法、几何与航海经验提供了寻找稳定规律的材料。`},{title:`从神谱到自然秩序`,detail:`解释仍可使用神性语言，但关键因果逐渐位于世界内部，不再依赖人格神每次临时干预。`},{title:`迁徙与思想转运`,detail:`波斯征服、殖民活动和个人迁徙使问题从爱奥尼亚转入南意大利、西西里和雅典，并在新环境中发生分化。`}]},architecture:{commonProblem:`多样事物从何而来？世界持续变化时，什么使它仍是一个可理解的整体？`,sharedPremise:`自然具有自身的原则和秩序；少数能够重复使用的原因，应当解释尽可能多的现象。`,method:`从可观察现象提出统一本原，再用反例迫使理论升级：单一材料难以解释对立，纯粹变化威胁知识，绝对不变又威胁经验，于是出现多元论和原子论。`,answer:`没有统一答案，真正的共同成果是一条可复用的推理链：本原问题 → 变化难题 → 存在约束 → 保存不生不灭要素并重构组合变化。`,tensions:[{title:`变化／恒常`,detail:`赫拉克利特把秩序放在变化关系中；巴门尼德则从‘存在不能不在’推出真实者不生不灭。`},{title:`一／多`,detail:`米利都传统寻求单一本原；恩培多克勒、阿那克萨哥拉与原子论者用多个恒常成分解释可见变化。`},{title:`经验／理性约束`,detail:`感官显示生成与消灭，论证却要求不从无中生有；后继理论必须同时对两者负责。`}]},philosophers:[{id:`thales`,role:`米利都问题起点`,contribution:`以水作为本原，把多样世界压缩为自然材料的变化。`,interaction:`阿那克西曼德保留问题形式，却反对把已知元素当作无条件本原。`},{id:`anaximander`,role:`抽象化本原`,contribution:`以无定者说明对立如何从更中性的根源分化。`,interaction:`阿那克西美尼重新选择可感材料，并补上凝聚—稀释机制。`},{id:`anaximenes`,role:`机制化单一本原`,contribution:`用气及凝聚、稀释连接统一材料与多种形态。`,interaction:`为后来以过程解释性质差异提供清晰模型。`},{id:`pythagoras`,role:`数与生活共同体`,contribution:`把数的比例、灵魂净化和共同生活联系起来。`,interaction:`其数学秩序深刻影响柏拉图，但个人教义与后世学派层累难以分开。`},{id:`heraclitus`,role:`变化中的秩序`,contribution:`用逻各斯和对立张力说明变化并非混乱。`,interaction:`巴门尼德从相反方向把‘存在’的逻辑约束推到极端。`},{id:`parmenides`,role:`存在论约束`,contribution:`以不可从无到有的论证，迫使后继者重新解释变化。`,interaction:`恩培多克勒、阿那克萨哥拉和原子论都保留不生不灭成分，再解释其重组。`},{id:`empedocles`,role:`多元论回应`,contribution:`以四根和爱、争说明组合、分离与宇宙循环。`,interaction:`与阿那克萨哥拉都回应巴门尼德，却给出有限要素与无限种子的不同方案。`},{id:`anaxagoras`,role:`心灵与混合`,contribution:`以万物相含和努斯解释分离运动及秩序。`,interaction:`把自然哲学带入雅典，也成为苏格拉底与柏拉图讨论目的因的重要背景。`},{id:`leucippus`,role:`原子论奠基`,contribution:`以原子和虚空同时保存存在者不生灭与可见运动。`,interaction:`德谟克利特扩展这一方案；两人具体分工因证据残缺而难确定。`},{id:`democritus`,role:`原子论系统化`,contribution:`用形状、次序和位置差异解释性质，不把目的作为自然变化的基本原因。`,interaction:`后来伊壁鸠鲁吸收原子论，再为伦理治疗加入偏斜与欲望理论。`}],development:[{period:`约前 6 世纪`,title:`本原与宇宙生成`,detail:`米利都思想家首次形成连续问题：共同材料是什么，它怎样变成可见世界？`},{period:`前 6—5 世纪`,title:`数、变化与存在`,detail:`毕达哥拉斯传统、赫拉克利特和巴门尼德分别把秩序放在比例、变化关系与存在必然性中。`},{period:`前 5 世纪`,title:`多元论与原子论`,detail:`后继者接受‘基本存在者不生不灭’，把经验变化重写为恒常成分的组合、分离或运动。`},{period:`前 4 世纪以后`,title:`被系统哲学重新编排`,detail:`柏拉图、亚里士多德及后世文献保存并分类这些思想；我们今天看到的谱系因此带有后继者的问题框架。`}],relations:[{target:`柏拉图主义`,relation:`思想来源`,detail:`理念论同时回应赫拉克利特式流变、巴门尼德式存在和毕达哥拉斯式数学秩序。`},{target:`伊壁鸠鲁主义`,relation:`思想来源`,detail:`伊壁鸠鲁继承德谟克利特的原子和虚空，但改变物理学以服务自由与安宁。`},{target:`斯多葛主义`,relation:`思想来源`,detail:`斯多葛派吸收赫拉克利特的火与逻各斯，却把它们系统化为天意、决定论和伦理秩序。`},{target:`亚里士多德主义`,relation:`吸收改造`,detail:`亚里士多德以四因和质料—形式重写早期思想，并由此建立西方哲学最有影响力的前史叙述。`}],influence:[{field:`问题形式`,detail:`本原、变化、存在、一与多成为此后形而上学反复使用的最小问题集。`},{field:`解释标准`,detail:`世界应由一般、内在、可讨论的原则解释，这一转变比任何单个本原答案更持久。`},{field:`证据意识`,detail:`残篇与见证的区分提醒我们：哲学史知识不仅有内容，也有可靠度层级。`}],russellView:`罗素把希腊哲学的诞生与城邦活力、商业交流、科学好奇和宗教气质并置，并用一条从米利都到原子论的论证升级链，展示西方理性思辨如何形成。`,modernCorrection:`罗素的叙事清晰却容易制造线性进步印象。‘从神话到理性’不是神话突然消失，而是解释责任逐渐转向自然内部；‘前苏格拉底’也只是便利标签，不能抹平各传统的宗教、伦理与认识论差异。`,chapterIds:[`b1-01`,`b1-02`,`b1-03`,`b1-04`,`b1-05`,`b1-06`,`b1-08`,`b1-09`,`b1-24`],sources:[$o(`第一卷第一至九章、第二十四章`),{label:`Stanford Encyclopedia · Presocratic Philosophy`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/presocratics/`}]},{id:`sophists-socratic-turn`,order:2,nameZh:`智者与苏格拉底转向`,nameEn:`Sophists and the Socratic Turn`,kind:`问题共同体 · 竞争方案`,period:`约前 5 世纪中后期`,regions:[`雅典`,`希腊城邦世界`],thesis:`民主法庭、公共辩论和战争危机把哲学重心推向语言、德性、知识与城邦生活；智者与苏格拉底面对同一公共世界，却对教育、真理和说服的关系作出竞争性回答。`,classificationNote:`这不是统一学派。‘智者’包含多位收费授课、观点不同的教师；苏格拉底本人没有建立学校或留下著作。把两者并置，是为了保留共同历史问题与关键分歧。`,context:{overview:`前 5 世纪雅典的民主制度需要公民在议会和法庭中说服他人；帝国扩张、伯罗奔尼撒战争、寡头政变与败战又暴露了法律、习俗和德性的脆弱。哲学因而从宇宙本原转向人如何判断和共同生活。`,factors:[{title:`民主公共空间`,detail:`政治参与依赖演说、反驳和法律解释，语言能力成为真实的社会力量。`},{title:`城邦间习俗差异`,detail:`旅行教师观察到各地法律与价值不同，推动自然／约定、普遍／相对问题进入中心。`},{title:`战争与制度危机`,detail:`长期战争和政权更替使‘谁真正知道善、谁有资格教育与统治’不再是抽象问题。`}]},architecture:{commonProblem:`德性是否可教？法律与正义来自自然还是约定？在意见冲突中，人凭什么声称自己知道？`,sharedPremise:`人的判断、语言和教育会改变公共行动；未经检验的传统不足以自动提供正当性。`,method:`智者训练修辞、对立论证和案例判断；苏格拉底以连续问答追索定义、暴露矛盾，并把承认无知转化为继续探究的起点。`,answer:`智者倾向提供参与城邦所需的可教能力；苏格拉底把首要任务改为灵魂照料和信念一致性。共同转向是‘人及其共同生活’，分歧在说服成功是否等于认识改善。`,tensions:[{title:`说服／真理`,detail:`有效言说能赢得判断，却未必证明内容为真；苏格拉底要求将胜负重新置于概念审查之下。`},{title:`自然／约定`,detail:`不同城邦的规范差异可支持相对主义，也可反过来推动寻找超越习俗的正义尺度。`},{title:`可教技术／人格转变`,detail:`政治技能可以训练，但知道德性定义是否足以使人变好，始终没有简单答案。`}]},philosophers:[{id:`protagoras`,role:`智者运动代表`,contribution:`以‘人为万物的尺度’突出判断的处境性，并以反对意见的训练服务公民能力。`,interaction:`柏拉图通过对话录使其与苏格拉底持续竞争：德性教育究竟是公共技术还是知识问题？`},{id:`socrates`,role:`伦理问答的转折点`,contribution:`把承认无知、定义追问和反驳结合成对信念与生活的一体审查。`,interaction:`与智者共享公共辩论形式，却拒绝把胜诉、收费授课或传授现成答案当作哲学成功。`},{id:`plato`,role:`主要记录者与重构者`,contribution:`用对话录保存并塑造苏格拉底形象，同时把智者／哲学家的区分理论化。`,interaction:`我们对这场竞争的认识深受他的立场支配，不能把戏剧角色直接等同于历史人物。`}],development:[{period:`前 5 世纪中叶`,title:`流动教师进入雅典`,detail:`修辞、法律论证和一般教育回应民主城邦的现实需求。`},{period:`约前 430—前 399`,title:`苏格拉底式公开审问`,detail:`苏格拉底不提供固定课程，而在公共交谈中把‘你如何生活’变成持续检验。`},{period:`前 399 以后`,title:`苏格拉底诸传统分化`,detail:`柏拉图学院、犬儒派、昔兰尼派及其他‘小苏格拉底学派’分别放大知识、德性、自足或快乐。`},{period:`后世`,title:`智者形象被重新评价`,detail:`长期以来智者主要经柏拉图的批评被理解；现代研究更重视其语言、法律与政治思想的独立价值。`}],relations:[{target:`古代怀疑主义`,relation:`思想来源`,detail:`承认无知和对立论证后来成为怀疑方法的重要资源，但苏格拉底并不等于后来的悬置判断。`},{target:`柏拉图主义`,relation:`分化`,detail:`柏拉图把苏格拉底式伦理审问扩展为理念、灵魂、知识和政治秩序的系统。`},{target:`犬儒主义`,relation:`分化`,detail:`犬儒派把苏格拉底的自足、坦率与生活一致性推向公开、激进的实践。`},{target:`亚里士多德主义`,relation:`吸收改造`,detail:`亚里士多德把定义、论证和德性教育纳入系统逻辑、伦理与政治研究。`}],influence:[{field:`哲学对象`,detail:`知识、德性、正义、语言和教育成为可以系统追问的中心对象。`},{field:`哲学方法`,detail:`反驳、定义追问和对立论证成为后世学园竞争的共同技术。`},{field:`哲学生活`,detail:`哲学不只生产命题，也要求言说、选择与人格之间保持可说明的一致。`}],russellView:`罗素把普罗泰戈拉放在主观主义与民主文化的背景中，把苏格拉底作为伦理哲学的决定性转折，并特别关注历史苏格拉底与柏拉图笔下人物难以分离的问题。`,modernCorrection:`不能把所有智者都归为‘否认真理的诡辩家’，也不能把苏格拉底方法缩成万能教学步骤。两者都是由有限、带立场的文献重构；页面保留竞争关系，不预设一方只是另一方的反面教材。`,chapterIds:[`b1-07`,`b1-10`,`b1-11`],sources:[$o(`第一卷第七、第十至十一章`),{label:`Stanford Encyclopedia · The Sophists`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/sophists/`},{label:`Stanford Encyclopedia · Socrates`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/socrates/`}]},{id:`platonism`,order:3,nameZh:`柏拉图主义`,nameEn:`Platonism`,kind:`长时段传统 · 学园及多次重构`,period:`前 387 年前后—古代晚期`,regions:[`雅典`,`地中海世界`,`罗马帝国`],thesis:`以可理解秩序说明知识、价值与世界：感性多样只有通过形式、灵魂与统一原则才可被认识和评价；这一核心不断被学院怀疑主义、中期柏拉图主义和普罗提诺重新解释。`,classificationNote:`柏拉图主义不是一套两千年不变的命题。柏拉图本人以对话写作，学园后来经历怀疑转向；‘新柏拉图主义’也是现代标签。页面以持续重现的问题结构连接这些差异。`,context:{overview:`伯罗奔尼撒战争、雅典败亡、寡头政变和苏格拉底之死，使知识与政治秩序的关系成为柏拉图的核心压力。古代晚期的帝国危机、宗教竞争和超越诉求，又推动普罗提诺把柏拉图资源重构为层级宇宙。`,factors:[{title:`城邦政治失序`,detail:`民主与寡头的反复失败，使‘谁知道善、谁有资格统治’进入哲学体系中心。`},{title:`苏格拉底之死`,detail:`哲学审问与城邦权威的冲突，推动柏拉图思考教育、法律和灵魂秩序。`},{title:`数学与学园制度`,detail:`几何展示了不依赖个别感官对象的可证明关系；学院则使问题能够跨代延续并发生内部转向。`},{title:`古代晚期帝国与宗教环境`,detail:`三世纪危机与多种救赎传统并存，使统一、超越和灵魂回归获得新的历史重量。`}]},architecture:{commonProblem:`变化的感性经验如何产生稳定知识？善与正义如何拥有不随意见改变的尺度？多样世界为什么仍具有统一秩序？`,sharedPremise:`可理解性和价值不能完全由当下感官事实或多数意见提供；灵魂必须通过理性转向更稳定的结构。`,method:`以对话和辩证法清除定义矛盾，再借数学、分类、假设上升与整体—部分对应，把认识论、伦理、政治和宇宙论连成层级结构。`,answer:`柏拉图以理念和善提供稳定尺度；学院怀疑派把苏格拉底式反驳用于限制独断；普罗提诺则以太一—精神—灵魂说明统一如何生成多样并使回归可能。`,tensions:[{title:`超越形式／具体事物`,detail:`理念若独立，如何解释参与和因果；若完全内在，又是否仍能提供不变尺度？`},{title:`哲人知识／政治自由`,detail:`知识资格能否转化为统治资格，是《理想国》最强也最危险的推论之一。`},{title:`体系／怀疑`,detail:`学院派怀疑主义并非简单背叛柏拉图，它可被理解为继承对话中的反独断方法。`},{title:`超越／世界价值`,detail:`普罗提诺要求灵魂上升，却反对把感性宇宙判为纯粹邪恶。`}]},philosophers:[{id:`socrates`,role:`伦理与方法来源`,contribution:`提供灵魂照料、定义追问和哲学生活的原型。`,interaction:`柏拉图既保存又重构苏格拉底；成熟对话中的体系不能全部还原为历史苏格拉底。`},{id:`plato`,role:`学院创立者与核心作者`,contribution:`把理念、灵魂、知识、德性、政治与宇宙论组织为互相支持的问题网络。`,interaction:`其对话保留多声部和发展变化，后继者因此能从不同部分建立不同柏拉图主义。`},{id:`arcesilaus`,role:`学院怀疑转向`,contribution:`以反驳斯多葛认识标准恢复不轻率断言的苏格拉底姿态。`,interaction:`把学院从正面体系转向针对论敌的双向论证。`},{id:`carneades`,role:`学院怀疑主义深化`,contribution:`用可信印象说明缺少确定知识时仍可行动。`,interaction:`与斯多葛派围绕认知印象、责任和自然法形成长期竞争。`},{id:`plotinus`,role:`古代晚期系统重构`,contribution:`以太一、精神与灵魂的流溢—回归结构，重写柏拉图的统一、理念和灵魂问题。`,interaction:`吸收亚里士多德和斯多葛资源，同时反对把世界视为恶的诺斯替方案。`}],development:[{period:`前 4 世纪`,title:`柏拉图与早期学院`,detail:`对话写作和共同研究形成学园，但不存在一本由柏拉图亲自写定的教科书式体系。`},{period:`前 3—1 世纪`,title:`学院怀疑主义`,detail:`阿尔克西劳与卡尔内阿德把反驳、悬置和可行动性置于中心。`},{period:`前 1 世纪—公元 2 世纪`,title:`中期柏拉图主义`,detail:`多位作者重新突出正面教义、神学与理念秩序，并与亚里士多德、斯多葛主义发生融合。`},{period:`公元 3 世纪以后`,title:`普罗提诺及后继者`,detail:`统一原则被提升为超越存在的太一，传统进入古代晚期宗教哲学与中世纪思想。`}],relations:[{target:`前苏格拉底自然哲学诸传统`,relation:`思想来源`,detail:`流变、存在、数与努斯分别进入柏拉图的知识、形式和宇宙秩序问题。`},{target:`斯多葛主义`,relation:`竞争`,detail:`双方围绕知识标准、灵魂、宇宙理性和善展开长期争论，也发生概念互借。`},{target:`亚里士多德主义`,relation:`分化`,detail:`亚里士多德保留形式与目的，却反对把形式作为与具体实体分离的独立世界。`},{target:`古代怀疑主义`,relation:`分化`,detail:`学院怀疑主义是柏拉图学园自身的一段历史，同时又与皮浪传统保持差异。`}],influence:[{field:`形而上学`,detail:`形式、参与、统一层级与灵魂结构成为古代晚期及中世纪哲学的核心资源。`},{field:`政治哲学`,detail:`知识与统治、教育与制度塑形的关系持续引发借鉴和批评。`},{field:`宗教哲学`,detail:`新柏拉图主义为基督教、伊斯兰和犹太哲学提供超越、创造与回归的概念语言。`}],russellView:`罗素用六章展开柏拉图：思想来源、理想国、理念、不朽、宇宙生成和知识，并在普罗提诺一章追踪其古代晚期重构。他高度评价问题规模，却严厉批评哲学王政治和把超感世界置于经验之上的倾向。`,modernCorrection:`罗素常把对话中的论证压成单一‘柏拉图体系’，也以现代自由主义直接裁判古代政治方案。页面保留其批评价值，同时区分对话的戏剧结构、柏拉图本人立场、学院历史与后世柏拉图主义。`,chapterIds:[`b1-12`,`b1-13`,`b1-14`,`b1-15`,`b1-16`,`b1-17`,`b1-18`,`b1-30`],sources:[$o(`第一卷第十二至十八章、第三十章`),{label:`Stanford Encyclopedia · Plato`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/plato/`},{label:`Stanford Encyclopedia · Plotinus`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/plotinus/`}]},{id:`aristotelianism`,order:4,nameZh:`亚里士多德主义／逍遥学派`,nameEn:`Aristotelianism / Peripatetic School`,kind:`有组织学园 · 跨时代研究传统`,period:`约前 335 年起`,regions:[`雅典`,`希腊化世界`,`后世欧亚学术网络`],thesis:`从具体事物与各门知识的实际解释出发，以范畴、四因、质料—形式、潜能—现实和目的结构建立可分科又互相连接的研究体系。`,classificationNote:`‘逍遥学派’首先指亚里士多德在吕克昂形成的学园传统；‘亚里士多德主义’则包括后世希腊注释家、伊斯兰哲学和拉丁经院哲学的多次重构，远大于创始人的原始学园。`,context:{overview:`马其顿崛起削弱城邦自主，亚历山大征服又扩大了可收集、分类和比较的世界。亚里士多德在柏拉图学院学习后，于吕克昂组织讲授与共同研究，把逻辑、自然、生命、伦理、政治和诗学纳入相互连接的知识工程。`,factors:[{title:`学院训练与分歧`,detail:`二十年学院经历提供问题资源；对分离理念的批评推动形式回到具体实体。`},{title:`马其顿与扩大的世界`,detail:`跨城邦政治和自然资料的积累，使比较政体、动物分类与知识分科获得现实条件。`},{title:`吕克昂的协作研究`,detail:`学园不仅传授结论，也收集宪制、物种和前人意见，形成研究共同体。`}]},architecture:{commonProblem:`怎样既尊重经验中的具体事物，又说明其稳定结构、变化原因、知识形式和善的目标？`,sharedPremise:`事物是可分类、可说明的；完整理解通常需要回答它是什么、由什么构成、如何发生以及为了什么。`,method:`从各学科公认现象与前人难题出发，区分多重意义，建立范畴和论证形式，再以原因分析把局部解释放入层级秩序。`,answer:`形式存在于具体实体中；变化是潜能实现为现实；知识把握原因；人的善则是灵魂依德性进行符合其功能的活动。`,tensions:[{title:`经验收集／目的解释`,detail:`丰富观察与强目的论并存；后世科学既继承分类，又逐渐拒绝部分自然目的论。`},{title:`个别实体／普遍知识`,detail:`真正存在的是具体个体，但科学知识表达普遍原因，两者如何衔接构成持续难题。`},{title:`德性／外在条件`,detail:`幸福要求德性活动，却也需要朋友、健康和一定资源，因此不同于斯多葛的‘德性唯一善’。`}]},philosophers:[{id:`plato`,role:`主要思想来源与论敌`,contribution:`提供形式、知识、灵魂、德性和政体问题的系统背景。`,interaction:`亚里士多德反对分离理念，却保留形式、目的和知识等级的基本追求。`},{id:`aristotle`,role:`吕克昂创立者`,contribution:`建立逻辑、形而上学、自然学、生命研究、伦理和政治之间的解释接口。`,interaction:`后继者整理讲稿和著作传统，但现有页面暂以创始人的结构为主，避免虚构尚未建立的人物资料。`}],development:[{period:`约前 335—前 322`,title:`吕克昂研究共同体`,detail:`亚里士多德与合作者进行讲授、资料收集和分类研究。`},{period:`希腊化—罗马时期`,title:`学园延续与文本整理`,detail:`泰奥弗拉斯托斯延续自然研究；公元前一世纪前后，著作编订推动系统阅读。`},{period:`古代晚期`,title:`注释传统`,detail:`注释家在柏拉图主义占优势的环境中保存、解释并调和亚里士多德文本。`},{period:`中世纪`,title:`阿拉伯语与拉丁语重构`,detail:`翻译、注释和神学争论使亚里士多德成为跨宗教的大学知识骨架。`}],relations:[{target:`斯多葛主义`,relation:`竞争`,detail:`双方都建构逻辑—自然—伦理体系，但在实体、逻辑单位、情绪和外物价值上不同。`},{target:`柏拉图主义`,relation:`分化`,detail:`共同追求可理解形式与善，却在形式是否分离、经验研究地位和政治方案上分道。`},{target:`近代科学`,relation:`吸收改造`,detail:`分类、论证和因果追问被继承，地心宇宙与若干目的论解释则成为突破对象。`},{target:`中世纪经院哲学`,relation:`后世重构`,detail:`经翻译和注释进入伊斯兰、犹太与拉丁思想，成为信仰—理性关系的主要技术语言。`}],influence:[{field:`知识组织`,detail:`学科划分、定义、范畴与证明方式塑造了长期教育制度。`},{field:`逻辑`,detail:`三段论成为两千多年形式推理教学的中心模型。`},{field:`伦理与政治`,detail:`德性、实践智慧、共同体和政体比较持续影响当代伦理与政治研究。`}],russellView:`罗素分别讨论形而上学、伦理学、政治学、逻辑学和物理学，承认亚里士多德对概念与学科结构的巨大塑造，也认为其权威在中世纪以后妨碍了经验科学。`,modernCorrection:`不能把后世教科书式‘亚里士多德主义’全部归因于亚里士多德本人，也不能用科学史上的错误抹去其观察、解释层级和实践推理。页面区分创始文本、学园延续与后世制度化权威。`,chapterIds:[`b1-19`,`b1-20`,`b1-21`,`b1-22`,`b1-23`,`b1-24`],sources:[$o(`第一卷第十九至二十四章`),{label:`Stanford Encyclopedia · Aristotle`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/aristotle/`}]},{id:`cynicism`,order:5,nameZh:`犬儒主义`,nameEn:`Cynicism`,kind:`生活实践运动 · 松散传承`,period:`约前 4 世纪—罗马帝国时期`,regions:[`雅典`,`科林斯`,`希腊化—罗马城市`],thesis:`把哲学从论证结果压缩为可见生活：通过训练、自足、坦率和对习俗的公开挑战，证明幸福所需极少，而社会制造的欲望与身份依赖才是束缚。`,classificationNote:`犬儒主义没有稳定教义机构，人物故事又高度传奇化。它更像可模仿的生活姿态和师承链，而非拥有统一课程的学校；‘犬儒’的现代贬义也不同于古代 Cynicism。`,context:{overview:`城邦秩序衰落、财富差距、流亡和身份不稳定，使一种无需财产、职位或特定政体即可实践的自由方案具有吸引力。犬儒哲学选择市场、街道和身体行为作为论证场所。`,factors:[{title:`城邦身份松动`,detail:`战争、流亡和马其顿扩张削弱稳定公民身份，自足成为可携带的安全结构。`},{title:`公共空间与表演`,detail:`犬儒派不用封闭学园证明观点，而以衣着、居所、乞讨、直言和羞耻规范制造反例。`},{title:`财富与虚荣批判`,detail:`他们把大量社会努力重新描述为对名声、权力和人工欲望的奴役。`}]},architecture:{commonProblem:`当财富、地位、政治稳定和他人评价都不可靠时，人怎样获得不易被夺走的自由？`,sharedPremise:`德性足以支撑幸福；多数欲望和羞耻规则来自习俗训练，而非不可改变的自然需要。`,method:`以苦练减少依赖，以坦率言说揭露权力，以反习俗行为测试规范，并让哲学家的生活本身成为论证。`,answer:`缩减需要、依自然生活和不把社会评价当作善恶尺度，可以获得自足；世界公民身份则把归属从单一城邦移向所有人。`,tensions:[{title:`自由／社会责任`,detail:`退出常规角色能暴露规范虚假，却也可能削弱共同制度的建设能力。`},{title:`表演／论证`,detail:`戏剧性行动易于记忆，但后世轶事可能遮蔽其反例推理和训练结构。`},{title:`自然／习俗`,detail:`诉诸自然可以批判奢侈，也需要解释何种自然生活值得规范性服从。`}]},philosophers:[{id:`socrates`,role:`伦理生活原型`,contribution:`节制、公开问答和对财富地位的轻视为犬儒传统提供可模仿的苏格拉底形象。`,interaction:`犬儒派放大其实践面，减少柏拉图式形而上体系。`},{id:`diogenes`,role:`标志性实践者`,contribution:`以自足、坦率和反习俗行为把生活变成公共反例。`,interaction:`大量故事形成可传播的哲学人格，但具体言行需要按传记可靠度分层。`},{id:`zeno`,role:`体系化继承者`,contribution:`经克拉特斯吸收犬儒式德性与自足，再加入逻辑、物理和社会义务。`,interaction:`斯多葛主义保留内在自由，却弱化犬儒对常规角色的全面挑衅。`}],development:[{period:`前 4 世纪`,title:`苏格拉底遗产的激进化`,detail:`安提斯泰尼与犬儒传统的确切关系存在争论；第欧根尼成为最强视觉原型。`},{period:`前 4—3 世纪`,title:`师承与斯多葛接口`,detail:`克拉特斯把生活训练传给季蒂昂的芝诺，犬儒伦理进入更完整体系。`},{period:`罗马帝国时期`,title:`公共道德批评复兴`,detail:`犬儒形象在城市中成为直言、贫困实践与权力批判的角色。`},{period:`现代词义迁移`,title:`Cynicism 不等于犬儒式不信任`,detail:`现代‘玩世不恭’主要指怀疑动机；古代传统则积极主张德性、自足和训练。`}],relations:[{target:`智者与苏格拉底转向`,relation:`思想来源`,detail:`继承苏格拉底的德性优先、言行一致和公共审问。`},{target:`伊壁鸠鲁主义`,relation:`竞争`,detail:`双方都缩减欲望；犬儒以公开挑衅实现自由，伊壁鸠鲁以友谊共同体和安静生活降低扰动。`},{target:`斯多葛主义`,relation:`分化`,detail:`斯多葛派把犬儒生活训练扩展为逻辑—物理—伦理体系，并重新接纳家庭和政治角色。`}],influence:[{field:`哲学作为生活`,detail:`思想必须在欲望、身体和公开选择中接受检验。`},{field:`权力批评`,detail:`坦率言说和对身份符号的拒绝，成为哲学批评社会规范的高压缩形式。`},{field:`斯多葛伦理`,detail:`德性优先、自足和世界公民观经斯多葛主义获得更长制度生命。`}],russellView:`罗素以第欧根尼轶事呈现犬儒派对文明、财产和权力的拒绝，并把它视为城邦衰落后个人退回内在德性的典型反应及斯多葛主义的重要来源。`,modernCorrection:`轶事极具记忆效率，却不能自动等于历史事实。犬儒主义也不只是消极逃避：其身体训练、坦率和世界公民语言构成对社会需要如何被制造的主动检验。`,chapterIds:[`b1-25`,`b1-26`,`b1-28`],sources:[$o(`第一卷第二十五至二十六章、第二十八章`),{label:`Internet Encyclopedia of Philosophy · Cynics`,kind:`现代研究`,url:`https://iep.utm.edu/cynics/`}]},{id:`ancient-skepticism`,order:6,nameZh:`古代怀疑主义`,nameEn:`Ancient Skepticism`,kind:`多支思想运动 · 方法传统`,period:`约前 4 世纪末—公元 2 世纪以后`,regions:[`希腊化世界`,`雅典学院`,`罗马帝国`],thesis:`当相互冲突的论证都声称确定性时，先审查知识标准本身；通过对置论证、悬置判断或降低行动承诺，避免未经证明的独断并寻求安宁。`,classificationNote:`皮浪传统与学院怀疑主义不是同一组织：前者把悬置发展为生活方法，后者在柏拉图学院内部主要攻击斯多葛知识标准。合称‘古代怀疑主义’是方法家族，不是统一教义。`,context:{overview:`亚历山大征服后的文化接触、学园间公开竞争和城邦政治失重，使互相冲突却论证精密的世界观并存。怀疑主义不再直接增加一个体系，而是检查任何体系凭什么要求同意。`,factors:[{title:`多文化与多学说并存`,detail:`法律、宗教和哲学判断的差异，使单一传统的自明性下降。`},{title:`学园竞争`,detail:`斯多葛派提出认知印象作为确定标准，学院派以不可区分反例集中攻击。`},{title:`哲学治疗需求`,detail:`对确定性的强迫追求本身会造成扰动；悬置判断因此既是认识方法，也是生活技术。`}]},architecture:{commonProblem:`当感觉、论证和权威彼此冲突时，怎样避免把尚未证明的意见误当知识，同时仍能行动？`,sharedPremise:`提出主张的人承担证明责任；一个印象若有不可区分的错误对应物，就不足以独自保证真理。`,method:`收集等强的相反论证，揭示标准循环、分歧与无穷后退；在证据不足时悬置，或仅按现象与较可信印象行动。`,answer:`皮浪路线以悬置判断意外带来安宁；学院路线削弱确定知识，并用合理或可信印象解释实践。它们共同拒绝从‘必须行动’反推‘已经确定知道’。`,tensions:[{title:`悬置／行动`,detail:`若不承诺事物本性，是否仍能选择？回答诉诸现象、习惯、技能或可信程度。`},{title:`反独断／自我反驳`,detail:`若断言‘没有知识’，自身也像独断；成熟怀疑主义往往连这一断言也不固定化。`},{title:`方法／结论`,detail:`怀疑不是‘一切都错’的结论，而是持续控制同意强度的方法。`}]},philosophers:[{id:`pyrrho`,role:`皮浪式生活原型`,contribution:`把不确定、悬置与不受扰动的生活联系起来。`,interaction:`本人没有著作；后世皮浪主义主要经蒂孟和塞克斯都·恩披里柯重构，不能全部倒置给他。`},{id:`arcesilaus`,role:`学院怀疑转向`,contribution:`用对置论证攻击斯多葛认知印象，并恢复学院的非独断姿态。`,interaction:`把怀疑方法带入柏拉图学院的制度核心。`},{id:`carneades`,role:`学院方法深化`,contribution:`以不可区分反例削弱确定性，以可信印象为行动建立分级依据。`,interaction:`对斯多葛自然法、正义和责任进行正反两面论证。`}],development:[{period:`前 4—3 世纪`,title:`皮浪与生活原型`,detail:`早期材料稀少；核心形象是面对事物不可判定而不轻率承诺。`},{period:`前 3—2 世纪`,title:`学院怀疑主义`,detail:`阿尔克西劳和卡尔内阿德在学院中以斯多葛知识论为主要论敌。`},{period:`前 1 世纪`,title:`学院转向与分流`,detail:`学院出现较温和、折衷的知识立场；皮浪传统由埃奈西德穆重新激活。`},{period:`公元 2—3 世纪`,title:`塞克斯都的系统保存`,detail:`《皮浪主义纲要》等作品保存模式、反驳和按现象生活的成熟版本。`}],relations:[{target:`斯多葛主义`,relation:`竞争`,detail:`围绕认知印象、同意和行动标准形成古代最精密的认识论争论之一。`},{target:`伊壁鸠鲁主义`,relation:`竞争`,detail:`伊壁鸠鲁派把感觉当作不可反驳的起点；怀疑派追问从感觉到对象本性的推断是否过强。`},{target:`柏拉图主义`,relation:`分化`,detail:`学院怀疑主义属于学院史，却对是否存在正面柏拉图教义保持克制。`},{target:`近代怀疑与经验主义`,relation:`后世重构`,detail:`古代论证经文艺复兴重新传播，进入蒙田、笛卡尔和休谟的问题背景，但用途各不相同。`}],influence:[{field:`认识论`,detail:`把标准、证明责任和同意强度变成独立研究对象。`},{field:`论证训练`,detail:`系统生成相反理由，迫使理论说明自身标准而非只重复结论。`},{field:`行动理性`,detail:`区分确定知识与足够行动依据，为不确定条件下的判断提供模型。`}],russellView:`罗素把怀疑派放在希腊化世界的疲惫与私人安宁追求中，强调皮浪的不动心，并以卡尔内阿德展示学院派对自然法和确定知识的攻击。`,modernCorrection:`若只把怀疑主义理解为文明衰退后的消极症状，会忽略其对知识标准、论证责任和实践合理性的技术贡献。皮浪、学院与后期塞克斯都传统也必须分层，不能互相代换。`,chapterIds:[`b1-25`,`b1-26`],sources:[$o(`第一卷第二十五至二十六章`),{label:`Stanford Encyclopedia · Ancient Skepticism`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/skepticism-ancient/`}]},{id:`epicureanism`,order:7,nameZh:`伊壁鸠鲁主义`,nameEn:`Epicureanism`,kind:`有组织学园 · 生活治疗体系`,period:`前 307/306 年起—罗马帝国时期`,regions:[`雅典花园`,`希腊化世界`,`罗马`],thesis:`以原子论清除神罚与死后恐惧，以欲望分类降低生活成本，再以友谊、审慎和稳定快乐建立可持续的安宁。物理学的最终用途是伦理治疗。`,classificationNote:`伊壁鸠鲁花园拥有明确创始人、共同生活和高度稳定的教义传承，是八页中最接近严格组织学派的类型之一；但不能把德谟克利特直接列为成员，他只是关键思想来源。`,context:{overview:`亚历山大死后，继业者战争和庞大王国取代公民可直接掌控的城邦政治。个人需要一种不以权力、财富和公共成功为条件的幸福技术；花园以小型友谊共同体回应这种不确定。`,factors:[{title:`希腊化政治失距`,detail:`王国规模扩大而个人政治控制感下降，哲学重心转向可在日常生活中实施的稳定。`},{title:`宗教恐惧`,detail:`神意、天象和死后惩罚把不可控制事件解释为针对个人的威胁。`},{title:`花园共同体`,detail:`朋友、书信和共同学习替代权力竞争，女性与奴隶的参与也使其社会形态较为特殊。`}]},architecture:{commonProblem:`人为什么在基本需要并不多时仍持续焦虑？怎样解除对神、死亡、痛苦和欲望无穷扩张的恐惧？`,sharedPremise:`善恶必须与有感觉的生命相关；自然由原子和虚空构成，神若存在也不以惩罚干预世界。`,method:`用自然解释替代神罚解释，用死亡论证拆除想象对象，用欲望分类区分自然必要与空洞欲望，再以审慎计算长期痛苦和快乐。`,answer:`快乐不是不断增强刺激，而是身体无痛与心灵不受扰动；最可靠的条件是节制、友谊、理解自然和降低对外部地位的依赖。`,tensions:[{title:`快乐／节制`,detail:`把伊壁鸠鲁主义等同纵欲会颠倒结构：强烈欲望常增加依赖，稳定快乐反而要求限制。`},{title:`退出政治／共同体`,detail:`远离权力竞争不是孤立个人主义；花园以友谊和互助建立另一种共同生活。`},{title:`原子必然／行动自由`,detail:`偏斜试图打破严格决定链，但它怎样产生负责行动仍是解释难点。`}]},philosophers:[{id:`democritus`,role:`原子论思想来源`,contribution:`提供原子、虚空和非目的性自然解释。`,interaction:`伊壁鸠鲁保留基本物理骨架，却改变认识论、运动理论和伦理目的。`},{id:`epicurus`,role:`花园创立者`,contribution:`把准则学、物理学和伦理学压缩成消除恐惧与管理欲望的完整治疗系统。`,interaction:`以书信、格言和共同体维持稳定传承。`},{id:`lucretius`,role:`拉丁世界的诗性传播者`,contribution:`以《物性论》把原子物理、死亡论证和伦理治疗转化为连续诗性体验。`,interaction:`既保存希腊学说，也使其进入罗马文学和后世欧洲思想。`}],development:[{period:`前 307/306`,title:`雅典花园建立`,detail:`共同生活、教学和书信网络使哲学成为可重复实践。`},{period:`希腊化时期`,title:`教义稳定传播`,detail:`学派重视忠于创始人，以简明纲要帮助记忆物理与伦理之间的关系。`},{period:`前 1 世纪`,title:`进入罗马世界`,detail:`卢克莱修以拉丁诗保存和传播体系；坎帕尼亚等地也形成社群。`},{period:`近代早期`,title:`原子论与世俗伦理复兴`,detail:`文本重新流通后影响自然哲学、宗教批评与功利讨论，但常被改造成不同理论。`}],relations:[{target:`前苏格拉底自然哲学诸传统`,relation:`思想来源`,detail:`从德谟克利特继承原子与虚空，将自然解释直接服务于解除恐惧。`},{target:`斯多葛主义`,relation:`竞争`,detail:`两者都追求安定；伊壁鸠鲁拒绝天意并缩小公共欲望，斯多葛接受宇宙天意与角色责任。`},{target:`犬儒主义`,relation:`竞争`,detail:`两者都降低物质需要，花园选择私密友谊与审慎，犬儒选择公开挑战和激进自足。`},{target:`近代原子论与功利主义`,relation:`后世重构`,detail:`后世吸收自然主义或快乐概念，但未必保留花园的欲望分类和安宁目标。`}],influence:[{field:`哲学治疗`,detail:`四重药等压缩方式把复杂体系转化为可反复调用的恐惧处理工具。`},{field:`自然主义`,detail:`以自然因果解释心灵、死亡与天象，减少超自然惩罚在伦理中的作用。`},{field:`欲望管理`,detail:`区分自然必要、自然非必要与空洞欲望，提供高信息效率的生活决策框架。`}],russellView:`罗素同情伊壁鸠鲁的温和人格、友谊伦理和对宗教恐惧的反抗，同时认为其快乐理想带有动荡时代的退缩和消极性。`,modernCorrection:`‘快乐主义’不等于感官放纵，‘远离政治’也不等于没有社会关系。页面把物理—死亡—欲望—友谊的完整推导放回中心，并区分伊壁鸠鲁本人、罗马传播与近代改造。`,chapterIds:[`b1-25`,`b1-27`],sources:[$o(`第一卷第二十五、二十七章`),{label:`Stanford Encyclopedia · Epicurus`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/epicurus/`}]},{id:`stoicism`,order:8,nameZh:`斯多葛主义`,nameEn:`Stoicism`,kind:`有组织学园 · 跨地域实践传统`,period:`约前 300 年—公元 2 世纪以后`,regions:[`雅典彩绘柱廊`,`罗得岛`,`罗马帝国`],thesis:`逻辑训练同意，物理学说明人处于理性因果整体，伦理学据此把善定位于判断与行动品质：外部命运不能保证幸福，德性却能把人变成整体秩序的主动参与者。`,classificationNote:`斯多葛主义有明确学园传承，但早期著作几乎失传，现存完整文本主要来自罗马时期。‘早期—中期—罗马’是有用压缩，不意味着每阶段内部完全一致。`,context:{overview:`亚历山大帝国解体后，跨地域王国和罗马帝国扩大了共同世界，也削弱个人对政治命运的控制。斯多葛主义由塞浦路斯移民在雅典公共柱廊创立，后经罗得岛与罗马精英网络，转化为世界公民、自然法和角色伦理。`,factors:[{title:`城邦到世界国家`,detail:`政治尺度扩大，使共同理性和世界公民观既像现实经验的抽象，也像对帝国等级的规范批评。`},{title:`学园公开竞争`,detail:`与学院怀疑派、伊壁鸠鲁派的争论迫使知识标准、决定论和善恶理论高度系统化。`},{title:`罗马角色社会`,detail:`元老、皇帝、被释放奴隶和流亡者都借同一伦理处理不同责任，使学说从体系转向角色实践。`}]},architecture:{commonProblem:`在外部事件受命运和他人支配时，什么仍属于人的行动？决定论世界中如何保存责任、自由和公共义务？`,sharedPremise:`宇宙是由物质与主动理性原则构成的因果整体；真正的善只在理性选择的德性，外物虽可选择却不能决定幸福。`,method:`逻辑检验印象，心理学区分印象—同意—冲动—行动，物理学把个人放入自然整体，日常练习再通过预想、复盘和角色提醒改变判断习惯。`,answer:`自由不是逃出因果，而是让行动通过自己的理性同意发生；合乎自然生活把个人理性、共同人性和宇宙秩序连接起来。`,tensions:[{title:`命运／责任`,detail:`一切有原因时，主体仍须作为行动的内在原因；克律西波斯以同意、性格和共命运回应。`},{title:`德性唯一善／现实选择`,detail:`健康财富不是善，却仍有‘可取’差别；理论必须避免把行动选择变成无意义。`},{title:`内在自由／制度改变`,detail:`调整判断能抵抗压迫，也可能被误读成只要求个人忍受不公。`},{title:`统一体系／历史变体`,detail:`中期和罗马作者弱化部分物理学，强化角色、良知和日常训练。`}]},philosophers:[{id:`zeno`,role:`创立者`,contribution:`整合犬儒德性、赫拉克利特宇宙论与辩证训练，提出逻辑—物理—伦理纲领。`,interaction:`克里安西斯继承学园，克律西波斯完成系统化。`},{id:`cleanthes`,role:`保存者与宗教表达者`,contribution:`以《宙斯颂》和宇宙自然强化命运、理性与自愿一致。`,interaction:`把学园交给克律西波斯，其版本更突出整体自然和虔敬。`},{id:`chrysippus`,role:`系统化者`,contribution:`发展命题逻辑、同意心理学与兼容论，使学派具备长期论辩能力。`,interaction:`集中回应学院怀疑主义，并成为后世共同框架。`},{id:`panaetius`,role:`中期转译者`,contribution:`弱化部分争议宇宙论，把伦理转向角色和普通人的恰当行动。`,interaction:`经罗马精英圈及西塞罗，使学派进入公共义务语言。`},{id:`posidonius`,role:`跨学科扩展者`,contribution:`连接自然、情绪、历史与地理，重新重视非理性心理动力。`,interaction:`影响罗马知识网络，但具体教义常由后世间接保存。`},{id:`seneca`,role:`罗马道德写作者`,contribution:`以书信和短论处理财富、愤怒、死亡、权力与每日自省。`,interaction:`把系统教义转化为不完美实践者可重复的训练。`},{id:`epictetus`,role:`同意与控制训练者`,contribution:`把‘取决于我们／不取决于我们’压缩成行动纪律，突出角色与选择能力。`,interaction:`其学生阿里安保存讲课；马可·奥勒留把相关练习用于帝国职责。`},{id:`aurelius`,role:`帝国角色实践者`,contribution:`以私人笔记反复练习整体视角、死亡意识和对共同体的责任。`,interaction:`不是理论创新者，而是检验斯多葛伦理在最高权力与持续压力下如何运作。`}],development:[{period:`约前 300—前 207`,title:`创立与系统化`,detail:`芝诺提出纲领，克里安西斯保存，克律西波斯建立成熟逻辑、物理和伦理接口。`},{period:`前 2—1 世纪`,title:`中期斯多葛主义`,detail:`帕奈提奥斯和波塞多尼奥斯与柏拉图、亚里士多德传统及罗马公共生活重新接合。`},{period:`公元 1—2 世纪`,title:`罗马实践转向`,detail:`塞涅卡、爱比克泰德和马可·奥勒留留下更完整的伦理训练文本。`},{period:`后世`,title:`自然法、基督教与现代复兴`,detail:`共同理性、良知和内在训练被多次吸收，但常脱离原有物理学与逻辑。`}],relations:[{target:`犬儒主义`,relation:`思想来源`,detail:`继承德性、自足和训练，同时重建逻辑、自然和社会角色。`},{target:`前苏格拉底自然哲学诸传统`,relation:`思想来源`,detail:`把赫拉克利特的火与逻各斯系统化为物质世界中的理性天意。`},{target:`古代怀疑主义`,relation:`竞争`,detail:`认知印象、同意和行动标准在长期争论中共同被精炼。`},{target:`伊壁鸠鲁主义`,relation:`竞争`,detail:`同样治疗恐惧，却以天意和公共角色对抗原子偶然与退隐策略。`},{target:`基督教与近代自然法`,relation:`后世重构`,detail:`普遍理性、世界公民和内在良知被吸收，但人格神、恩典和灵魂观改变了原体系。`}],influence:[{field:`逻辑与语言`,detail:`命题逻辑、条件式和可说之物形成区别于亚里士多德词项逻辑的传统。`},{field:`伦理心理学`,detail:`印象—同意—冲动链把情绪训练和责任放在可分析的判断节点。`},{field:`政治与法律`,detail:`共同理性、自然法和世界公民观为跨城邦规范提供语言。`},{field:`现代实践`,detail:`认知行为取向和现代斯多葛复兴常借其训练方法，但不能直接等同古代完整体系。`}],russellView:`罗素把斯多葛主义视为希腊化—罗马世界最有历史影响的伦理之一，突出决定论、德性唯一善、内在自由、自然法及其通向基督教的桥梁，同时担忧顺从命运会削弱改变现实的动力。`,modernCorrection:`不能用‘控制二分’概括全部时期，也不能把天意决定论直接等同消极宿命。学派的逻辑、物理和伦理原本互相支撑；罗马文本最完整，却不应反向覆盖早期三位领袖的差异。`,chapterIds:[`b1-25`,`b1-28`,`b1-29`],sources:[$o(`第一卷第二十五、二十八至二十九章`),{label:`Stanford Encyclopedia · Stoicism`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/stoicism/`},{label:`Internet Encyclopedia of Philosophy · Stoicism`,kind:`现代研究`,url:`https://iep.utm.edu/stoicism/`}]}],ts={"presocratic-traditions":5,"sophists-socratic-turn":5,platonism:5,aristotelianism:5,cynicism:4,"ancient-skepticism":4,epicureanism:5,stoicism:5,"patristic-christian-tradition":4,"monastic-pastoral-tradition":2,"medieval-christian-neoplatonism":3,"islamic-falsafa-kalam":4,"medieval-jewish-philosophy":3,"twelfth-century-dialectic":3,"dominican-aristotelian-synthesis":4,"franciscan-scholastic-nominalism":4,"medieval-church-state-thought":3},H=[...es,...Zo].map(e=>({...e,stars:ts[e.id]||e.stars||1})).sort((e,t)=>e.order-t.order),ns=e=>H.find(t=>t.nameZh===e||e.startsWith(t.nameZh)||t.nameZh.startsWith(e)),rs=e=>ns(e)?.order??2**53-1;function is(e){return e.map((e,t)=>({relation:e,sourceIndex:t})).sort((e,t)=>Qo[e.relation.relation].order-Qo[t.relation.relation].order||rs(e.relation.target)-rs(t.relation.target)||e.sourceIndex-t.sourceIndex).map(({relation:e})=>e)}function as(){let e=new Map;return H.forEach(t=>{t.relations.forEach(n=>{let r=ns(n.target);if(!r||r.id===t.id)return;let[i,a]=t.order<r.order?[t,r]:[r,t],o=`${n.relation}:${i.id}:${
