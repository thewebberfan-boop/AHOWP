的影响`,`Locke's Influence`,637,[`自由主义`,`影响`]],[`b3-16`,`modern`,`从文艺复兴到休谟`,`XVI`,`贝克莱`,`Berkeley`,643,[`观念论`,`知觉`]],[`b3-17`,`modern`,`从文艺复兴到休谟`,`XVII`,`休谟`,`Hume`,655,[`怀疑`,`因果`]],[`b3-18`,`modern`,`从卢梭到现代`,`XVIII`,`浪漫主义运动`,`The Romantic Movement`,670,[`浪漫主义`,`个人`]],[`b3-19`,`modern`,`从卢梭到现代`,`XIX`,`卢梭`,`Rousseau`,679,[`自由`,`政治`]],[`b3-20`,`modern`,`从卢梭到现代`,`XX`,`康德`,`Kant`,696,[`知识`,`先验`]],[`b3-21`,`modern`,`从卢梭到现代`,`XXI`,`十九世纪的思想潮流`,`Currents of Thought in the Nineteenth Century`,712,[`历史`,`思想`]],[`b3-22`,`modern`,`从卢梭到现代`,`XXII`,`黑格尔`,`Hegel`,722,[`辩证法`,`国家`]],[`b3-23`,`modern`,`从卢梭到现代`,`XXIII`,`拜伦`,`Byron`,738,[`浪漫主义`,`个人`]],[`b3-24`,`modern`,`从卢梭到现代`,`XXIV`,`叔本华`,`Schopenhauer`,745,[`意志`,`悲观主义`]],[`b3-25`,`modern`,`从卢梭到现代`,`XXV`,`尼采`,`Nietzsche`,751,[`价值`,`权力`]],[`b3-26`,`modern`,`从卢梭到现代`,`XXVI`,`功利主义者`,`The Utilitarians`,764,[`功利`,`伦理`]],[`b3-27`,`modern`,`从卢梭到现代`,`XXVII`,`卡尔·马克思`,`Karl Marx`,773,[`历史`,`阶级`]],[`b3-28`,`modern`,`从卢梭到现代`,`XXVIII`,`柏格森`,`Bergson`,782,[`时间`,`直觉`]],[`b3-29`,`modern`,`从卢梭到现代`,`XXIX`,`威廉·詹姆斯`,`William James`,801,[`实用主义`,`经验`]],[`b3-30`,`modern`,`从卢梭到现代`,`XXX`,`约翰·杜威`,`John Dewey`,809,[`实用主义`,`教育`]],[`b3-31`,`modern`,`从卢梭到现代`,`XXXI`,`逻辑分析哲学`,`The Philosophy of Logical Analysis`,818,[`分析`,`逻辑`]]].map(([e,t,n,r,i,a,o,s])=>({id:e,book:t,part:n,roman:r,title:i,english:a,pdfPage:o,themes:s})),p={"b1-04":{context:`爱奥尼亚自然哲学之后，思想开始把‘变化本身’当作世界的基本事实。`,summary:`赫拉克利特把世界理解为持续生成的秩序。对立并非秩序的失败，而是维持秩序的张力；火与逻各斯分别呈现变化的形象和变化中的尺度。`,keyPoints:[`万物处于流变，稳定更像关系而非静止实体。`,`对立面彼此依存，冲突能够构成和谐。`,`逻各斯意味着变化仍可被理性把握。`],russell:`罗素欣赏其历史影响，但警惕把冲突神秘化。他把赫拉克利特视作后来辩证思维的重要源头。`,questions:[`如果一切都变，知识如何可能？`,`‘对立统一’是解释，还是一种描述方式？`],axis:[`变化`,`恒常`]},"b1-11":{context:`雅典民主、战争与智者运动共同构成苏格拉底活动的公共空间。`,summary:`苏格拉底把哲学的中心从自然转向‘应当怎样生活’。他的问答法并不直接交付结论，而是通过暴露概念矛盾，要求人对自己的信念负责。`,keyPoints:[`德性与知识存在紧密联系。`,`自知首先意味着承认无知。`,`审问概念也是一种公共伦理实践。`],russell:`罗素区分历史上的苏格拉底与柏拉图笔下的形象，并强调资料互相冲突带来的困难。`,questions:[`知道善是否足以使人行善？`,`苏格拉底的守法与独立批判是否矛盾？`],axis:[`个人良知`,`城邦法律`]},"b1-14":{context:`伯罗奔尼撒战争后的政治失序，使柏拉图将正义问题与理想政体连在一起。`,summary:`《理想国》把城邦看成放大的灵魂：理性、意气与欲望各安其位，正义便是整体秩序。哲学王方案把知识资格转化为统治资格。`,keyPoints:[`正义被界定为各部分履行适当功能。`,`教育制度比个别法律更根本。`,`哲学王将真理与政治权威结合。`],russell:`罗素认为这套秩序牺牲了个人自由，并把它视作后来极权式政治理想的一条思想先声。`,questions:[`掌握真理能否自动带来统治正当性？`,`共同体秩序可以在多大程度上塑造个人生活？`],axis:[`社会秩序`,`个人自由`]},"b1-19":{context:`亚里士多德在批评柏拉图理念论的同时，试图保留形式与可理解秩序。`,summary:`具体事物是质料与形式的结合；变化可借潜能到现实的展开来说明。实体、四因与不动的推动者共同构成一套层级化世界图景。`,keyPoints:[`形式不在事物之外，而在具体实体之中。`,`四因同时回答材料、结构、动力与目的。`,`潜能与现实解释变化而不放弃同一性。`],russell:`罗素肯定其概念影响，也批评目的论和传统权威后来阻碍经验科学。`,questions:[`目的因是自然解释的一部分吗？`,`形式与质料能否真正避免柏拉图式二分？`],axis:[`经验事物`,`形式秩序`]},"b1-28":{context:`城邦独立衰落后，哲学的重心从公共政治转向个人如何承受不确定世界。`,summary:`斯多葛主义区分可控制与不可控制之物，把德性视为唯一真正的善。个人通过服从普遍理性获得内在自由，并由此发展出世界公民观。`,keyPoints:[`自由主要是对自身判断与欲望的治理。`,`自然法把所有理性存在者联系起来。`,`情绪困扰源于对事件所作的判断。`],russell:`罗素强调它在帝国时代与基督教形成之间的桥梁作用，也指出其伦理容易滑向消极忍受。`,questions:[`内在自由会不会削弱改变制度的动力？`,`顺应自然与宿命论如何区分？`],axis:[`内在自由`,`外在命运`]},"b1-29":{context:`罗马以军事征服终结希腊城邦的政治自主，又以道路、法律、城市和长期和平把希腊化文化扩散到统一帝国。`,summary:`本章不是一套哲学，而是第一卷末尾的历史接口：罗马自身较少创造抽象体系，却提供了希腊文化向西方、东方宗教向帝国、以及古代知识向基督教和伊斯兰世界传递的制度空间。共和国扩张、内战、奥古斯都秩序和三世纪危机也改变了哲学所回答的问题。`,keyPoints:[`罗马和平扩大了共同文明和世界国家的经验。`,`希腊文化征服罗马精英，东方宗教同时进入西方。`,`稳定帝国利于传播，却也可能使思想与政治生活趋于定型。`,`三世纪军事、财政与城市危机为普罗提诺的超越转向提供历史背景。`],russell:`罗素把罗马视为重要的政治与传输装置，而非原创哲学中心；其判断有助于建立历史架子，但也低估了罗马法律、修辞和制度实践本身的思想创造性。`,questions:[`统一帝国促进文化传播时，是否也降低思想的政治创造力？`,`斯多葛主义的世界公民观是帝国经验的批判，还是其理想化？`],axis:[`文化传播`,`政治定型`]},"b1-30":{context:`三世纪罗马帝国经历战争、瘟疫、财政崩坏和城市衰落；基督教、诺斯替主义与柏拉图传统都在寻找超越不稳定现实的秩序。`,summary:`普罗提诺把真实组织为太一、精神与灵魂的层级：较低层由较高层的丰盈活动产生，又通过沉思返回来源。感性世界不是邪恶造物，而是可知秩序在物质条件下尽可能美的形象。人的最高生活由德性净化、内在转向和不可言说的合一构成。`,keyPoints:[`太一超越存在和普通谓词，是一切统一性的根据。`,`精神包含理念整体，灵魂连接可知世界与感性自然。`,`流溢不是时间中的创造，回归也不是空间迁移。`,`反诺斯替论证保留感性宇宙的秩序和美。`,`该体系既是古希腊哲学的终点，也是中世纪基督教形而上学的重要起点。`],russell:`罗素赞赏体系的美、灵魂论和人格高度，同时批评它把注意力由外部世界转向内在完善，可能削弱科学与制度改革。`,questions:[`绝对简单的太一如何在不改变、不需要的情况下产生多样世界？`,`向内回归能否同时保留对感性世界和公共生活的责任？`],axis:[`超越统一`,`感性多样`]},"b2-04":{context:`古典世界向基督教世界过渡，个人灵魂、救赎与教会权威成为哲学核心。`,summary:`奥古斯丁把柏拉图主义资源纳入基督教：恶不是实体而是善的缺失，时间属于被创造的心灵经验，人的意志又因原罪需要恩典。`,keyPoints:[`确定性可从怀疑者自身的存在切入。`,`时间通过记忆、注意与期待呈现。`,`自由意志与神圣预知形成持续张力。`],russell:`罗素认为奥古斯丁塑造了中世纪思想的心理深度，同时也强化了罪与惩罚的神学框架。`,questions:[`恶若只是缺失，苦难是否被解释充分？`,`恩典优先时，道德责任如何成立？`],axis:[`自由意志`,`神圣恩典`]},"b2-13":{context:`亚里士多德著作经伊斯兰与拉丁学术网络重新进入西欧，信仰与理性的边界需被重画。`,summary:`阿奎那用亚里士多德哲学系统化基督教神学：某些关于世界的真理可由自然理性抵达，启示则补足理性无法独立达到的内容。`,keyPoints:[`信仰与理性来源不同，却不应真正冲突。`,`由运动、因果等经验事实通向第一原因。`,`自然法把伦理规范建立在人性目的上。`],russell:`罗素赞赏体系的严密，却认为结论预先服从教义，削弱了开放探究。`,questions:[`预设信仰结论的论证还能否称为哲学？`,`从因果链能否推出具有宗教属性的上帝？`],axis:[`自然理性`,`神圣启示`]},"b3-08":{context:`宗教战争与国家权力重组，使政治哲学转向秩序如何在冲突个体之间建立。`,summary:`霍布斯从欲望、恐惧与自我保存出发构造自然状态。为摆脱不安全，人们相互订约并授权主权者，政治权威因而来自人为建构而非神授。`,keyPoints:[`自然平等也意味着相互伤害能力的接近。`,`契约发生在个体之间，主权者是被授权者。`,`和平与安全构成服从权威的核心理由。`],russell:`罗素重视其清晰的世俗推理，但拒绝几乎不受限制的主权结论。`,questions:[`安全是否足以压倒自由？`,`主权者破坏保护承诺时，服从义务还存在吗？`],axis:[`社会秩序`,`个人权利`]},"b3-09":{context:`新科学要求摆脱经院权威，为知识寻找可重复、可演绎的确定起点。`,summary:`笛卡尔以方法性怀疑清除可疑信念，在‘我思’中找到不可否认的自我存在，再尝试重建上帝、外部世界以及心物二元论。`,keyPoints:[`怀疑被用作建立确定性的工具。`,`思维实体与广延实体性质不同。`,`清楚分明观念承担真理标准的角色。`],russell:`罗素把主体作为起点视为现代哲学的转折，也认为从我思通向外部世界的重建并不成功。`,questions:[`‘我思’证明的是一个实体自我，还是仅有思维事件？`,`心物二元论如何解释两者互动？`],axis:[`主观确定性`,`外部世界`]},"b3-10":{context:`理性主义继续追求统一体系，但拒绝把自然与上帝看成彼此外在。`,summary:`斯宾诺莎主张只有一个无限实体——上帝即自然；心与物是同一实体的不同属性。自由不是摆脱因果，而是理解必然性并由理性行动。`,keyPoints:[`实体自因且唯一，个别事物是其样态。`,`心物平行避免两种实体的相互作用难题。`,`理解情感的原因能够增加主动性。`],russell:`罗素对斯宾诺莎的伦理人格评价极高，并特别欣赏其从理解必然性中获得平静的理想。`,questions:[`如果一切必然，道德责任意味着什么？`,`‘上帝即自然’保留了多少宗教含义？`],axis:[`必然性`,`自由`]},"b3-13":{context:`英国经验主义与政治自由主义共同反对天赋观念和绝对权威。`,summary:`洛克把心灵比作尚未书写的纸张，观念来自感觉与反省。知识是观念之间关系的把握，但对实体、外部对象和他人心灵的确定性有限。`,keyPoints:[`拒绝作为既成内容的天赋观念。`,`区分第一性质与第二性质。`,`个人同一性更多依赖意识连续，而非同一物质。`],russell:`罗素赞赏洛克的温和与反独断精神，同时指出其认识论仍保留难以证明的实体假设。`,questions:[`经验能否提供普遍必然知识？`,`记忆标准会不会让个人同一性陷入循环？`],axis:[`经验`,`理性结构`]},"b3-17":{context:`经验主义推进到极限后，实体、自我和因果关系都面临证据不足的问题。`,summary:`休谟区分印象与观念，并追问每个观念来自何种经验。因果必然性不是被感知的连接，而是重复经验形成的心理习惯；自我也只是知觉束。`,keyPoints:[`事实推理依赖因果，却无法由纯理性证明。`,`归纳预设未来类似过去，但此预设不能循环证明。`,`怀疑在生活实践中会被自然习惯缓和。`],russell:`罗素认为休谟把经验主义推向逻辑终点，并留下现代哲学必须回应的归纳难题。`,questions:[`没有理性证明，科学归纳凭什么可靠？`,`知觉束能否解释统一的行动主体？`],axis:[`理性证明`,`自然习惯`]},"b3-20":{context:`理性主义与经验主义的冲突，以及休谟的怀疑，促使康德重问经验何以可能。`,summary:`康德认为认识并非被动复制世界：感性以空间和时间组织材料，知性以范畴统一经验。我们认识现象，却不能用同样方式认识物自身。`,keyPoints:[`先天综合判断试图解释数学与自然科学的必然性。`,`主体的认识结构规定了可能经验的形式。`,`理性越出经验会产生无法解决的二律背反。`],russell:`罗素承认康德问题的重要性，但反对把空间、时间及范畴过多地归于主体构造。`,questions:[`物自身若不可知，为何仍需设定？`,`先验条件是普遍结构，还是人类认知的历史事实？`],axis:[`主体形式`,`客观世界`]},"b3-22":{context:`德国观念论试图跨越康德留下的现象与物自身二分，并把历史纳入理性体系。`,summary:`黑格尔把实在理解为整体性的精神发展，矛盾推动概念和历史达到更高综合。个别事物只有在关系网络与整体进程中才获得充分真理。`,keyPoints:[`真理不是孤立命题，而是展开的整体。`,`否定性推动概念超越自身局限。`,`自由通过历史制度获得具体形式。`],russell:`罗素严厉反对从逻辑结构推出政治整体主义，认为黑格尔把国家权威置于个人之上。`,questions:[`矛盾如何成为真实的发展动力？`,`整体视角是否必然削弱个人的独立价值？`],axis:[`历史整体`,`具体个人`]},"b3-25":{context:`十九世纪欧洲的宗教衰退、民族主义与浪漫主义，使价值来源成为尖锐问题。`,summary:`尼采以谱系方式追问价值如何产生，批判把软弱与怨恨包装成普遍道德。他要求在旧价值失效后重新创造价值，并以生命肯定抵抗虚无主义。`,keyPoints:[`道德概念有权力关系与历史来源。`,`主人道德与奴隶道德呈现不同价值姿态。`,`超人象征自我超越，而非生物学类别。`],russell:`罗素欣赏其洞察力和文体，却强烈反对英雄崇拜、残酷审美与反平等倾向。`,questions:[`揭示价值来源是否等于反驳价值？`,`自我创造怎样避免变成强者任性？`],axis:[`价值创造`,`普遍道德`]},"b3-27":{context:`工业资本主义与工人阶级形成，使哲学重新把物质生产和社会冲突置于历史中心。`,summary:`马克思把黑格尔的历史运动转向物质生活：生产关系与阶级冲突塑造制度和观念。哲学的任务不仅是解释世界，也要介入改变世界的实践。`,keyPoints:[`社会存在深刻制约意识形态。`,`阶级斗争推动历史结构变化。`,`异化描述劳动者与产品、活动和自身能力的分离。`],russell:`罗素承认经济结构的解释力，但批评历史必然论以及由此支持的政治专断。`,questions:[`经济因素在多大程度上决定观念？`,`历史趋势能否为具体政治手段提供正当性？`],axis:[`结构条件`,`人的能动性`]},"b3-31":{context:`数学基础危机与语言转向，使哲学从建造宏大体系转向澄清命题结构。`,summary:`逻辑分析通过拆解语法表面形式，揭示命题的逻辑结构。它试图减少虚假问题，并让哲学与科学共享清晰、可检验的论证标准。`,keyPoints:[`语法形式可能掩盖真正的逻辑形式。`,`分析把复杂命题还原为更基本关系。`,`哲学更像澄清活动，而非关于世界的竞争性学说。`],russell:`这是全书最接近作者自身立场的一章：反体系、重分析，同时保留对科学尚不能回答之问题的哲学敏感。`,questions:[`分析能消除哲学问题，还是只改变表达方式？`,`价值与人生问题能否接受同样的逻辑处理？`],axis:[`逻辑清晰`,`形而上体系`]}},m={generatedAt:`2026-08-24T22:17:01.296Z`,policy:`Representative images resolved from encyclopedia records to Wikimedia Commons; every downloaded image retains its source and license metadata.`,count:82,ready:76,needsReview:6,figures:[{id:`thales`,zh:`泰勒斯`,en:`Thales`,wikipediaTitle:`Thales of Miletus`,wikipediaUrl:`https://en.wikipedia.org/wiki/Thales_of_Miletus`,wikidat ransition:`统一的中世纪宇宙 → 多中心竞争与可检验的自然`,world:[`民族国家、印刷术和远洋扩张改变权威结构`,`宗教改革打破西欧教会统一`,`哥白尼、开普勒和伽利略重建宇宙图景`],carrier:`宫廷、城市人文主义者、印刷网络、宗派国家与科学院`,commonQuestion:`当传统权威不再统一，知识与政治秩序应依据什么建立？`,chain:[{label:`权威分裂`,text:`教会统一 → 宗派与国家`,kind:`condition`},{label:`知识扩张`,text:`古典文献 + 新世界 + 新天文学`,kind:`transmit`},{label:`方法转向`,text:`注释权威 → 数学与实验`,kind:`response`},{label:`现代起点`,text:`主体和国家重新奠基`,kind:`inherit`}],responses:[{id:`machiavelli`,title:`把政治作为现实力量研究`,figures:`马基雅维利`,region:`意大利城邦`,answer:`政治首先要处理权力、稳定和行动后果，而不是服从完整神学伦理。`,method:`历史案例与现实主义比较`,difference:`最早鲜明表现政治从统一宗教道德中独立。`,chapterIds:[`b3-02`,`b3-03`]},{id:`reformation`,title:`把宗教权威移回个人与经文`,figures:`路德及宗教改革者`,region:`北欧与德意志`,answer:`教会传统不再是唯一中介，个人良心和经文解释获得更大地位。`,method:`文本回归、信仰争论与印刷传播`,difference:`释放个人判断，也把宗教权威转移给宗派国家。`,chapterIds:[`b3-04`,`b3-05`]},{id:`new-science`,title:`以数学和实验重建自然知识`,figures:`哥白尼、开普勒、伽利略、培根`,region:`欧洲知识网络`,answer:`自然应由数量关系、观察和可重复方法解释，而非由目的和传统权威决定。`,method:`数学建模、实验与归纳`,difference:`改变的不只是结论，而是什么可以算作知识。`,chapterIds:[`b3-06`,`b3-07`]}],legacy:[`世俗国家`,`个人解释权`,`数学化自然`,`现代哲学寻找新基础的任务`],review:`文艺复兴、宗教改革和科学革命看似不同，为什么都可以理解为对统一权威结构的拆解？`,coverage:`book`},{id:`early-modern`,years:`1650—1750`,title:`理性、经验与现代秩序`,subtitle:`从霍布斯到休谟`,transition:`失去共同权威 → 从主体、经验和契约重新奠基`,world:[`宗教战争强化对政治和平的需求`,`新科学成为可靠知识的模型`,`商业社会与英国革命推动自由主义`],carrier:`共和国、王权国家、科学院、沙龙与出版市场`,commonQuestion:`知识如何获得确定性？相互冲突的个人如何建立稳定政治？`,chain:[{label:`共同危机`,text:`权威不再自动可信`,kind:`condition`},{label:`知识路线`,text:`理性主义 ↔ 经验主义`,kind:`oppose`},{label:`政治路线`,text:`绝对主权 ↔ 自由主义`,kind:`oppose`},{label:`终点危机`,text:`休谟把经验主义推向怀疑`,kind:`inherit`}],responses:[{id:`hobbes`,title:`从恐惧和契约建立主权`,figures:`霍布斯`,region:`英格兰`,answer:`自然平等导致不安全，个人为和平授权一个不可分割的公共权力。`,method:`机械论、思想实验与演绎构造`,difference:`以个人为起点，却推出强大的国家。`,chapterIds:[`b3-08`]},{id:`rationalists`,title:`从清楚原则演绎世界`,figures:`笛卡尔、斯宾诺莎、莱布尼茨`,region:`法国、荷兰、德意志`,answer:`理性可以从确定起点建立关于心灵、自然和上帝的系统知识。`,method:`怀疑、定义、公理与演绎`,difference:`共享数学理想，却对实体、自由和心物关系给出不同体系。`,chapterIds:[`b3-09`,`b3-10`,`b3-11`]},{id:`locke`,title:`从经验与权利限制权威`,figures:`洛克`,region:`英格兰`,answer:`观念来自经验，政治权力来自保护自然权利的有限委托。`,method:`心理发生分析与契约论`,difference:`在知识和政治两方面都反对天赋内容与绝对权威。`,chapterIds:[`b3-12`,`b3-13`,`b3-14`,`b3-15`]},{id:`hume`,title:`揭示经验基础的限度`,figures:`贝克莱、休谟`,region:`不列颠与爱尔兰`,answer:`实体、因果和自我都不能按传统方式从经验中得到必然证明。`,method:`观念来源追踪与怀疑分析`,difference:`经验主义成功拆除旧形而上学，也动摇了科学归纳的理性基础。`,chapterIds:[`b3-16`,`b3-17`]}],legacy:[`现代主体`,`社会契约`,`自由主义`,`理性主义—经验主义框架`,`康德问题的起点`],review:`为什么同样受新科学影响，笛卡尔从理性确定性出发，洛克从经验出发，霍布斯却把方法用于国家建构？`,coverage:`book`},{id:`revolution-idealism`,years:`1750—1850`,title:`革命、浪漫主义与历史理性`,subtitle:`卢梭、康德与德国观念论`,transition:`普遍理性与个人权利 → 自由、历史和民族共同体`,world:[`启蒙思想进入美国与法国革命`,`浪漫主义反抗机械理性和商业文明`,`拿破仑战争与民族国家改变欧洲`],carrier:`公共舆论、大学、文学运动、革命国家与民族文化`,commonQuestion:`自由是个人不受干涉，还是个人通过共同体和历史实现自身？`,chain:[{label:`政治爆发`,text:`启蒙原则 → 革命实践`,kind:`condition`},{label:`情感反动`,text:`理性秩序 → 浪漫个性`,kind:`oppose`},{label:`哲学重建`,text:`主体条件 → 历史精神`,kind:`response`},{label:`新危险`,text:`自由可能被整体国家吸收`,kind:`exception`}],responses:[{id:`rousseau`,title:`从自然自由到公意`,figures:`卢梭`,region:`日内瓦 / 法国`,answer:`文明制造依赖与不平等，正当共同体必须使服从法律等于服从共同意志。`,method:`起源叙事、社会批判与契约构造`,difference:`既启发民主自由，也为整体意志留下危险空间。`,chapterIds:[`b3-18`,`b3-19`]},{id:`kant`,title:`为经验与自由划定条件`,figures:`康德`,region:`普鲁士`,answer:`主体的先天形式使经验知识可能；自由则属于实践理性的道德要求。`,method:`先验分析与二律背反`,difference:`不在理性和经验中选边，而是研究二者何以可能。`,chapterIds:[`b3-20`]},{id:`hegel`,title:`把矛盾放入历史整体`,figures:`黑格尔`,region:`德意志大学`,answer:`理性与自由通过历史制度逐步展开，局部只有在整体关系中才被理解。`,method:`辩证运动与历史解释`,difference:`把康德的主体结构扩展成世界历史的自我发展。`,chapterIds:[`b3-21`,`b3-22`]},{id:`romantics`,title:`以个性、意志和激情反抗体系`,figures:`拜伦、叔本华`,region:`欧洲文学与哲学`,answer:`抽象理性无法穷尽生命，个体激情或盲目意志比理性秩序更根本。`,method:`艺术形象、内省与意志形而上学`,difference:`把哲学重新拉向不可被体系驯服的经验。`,chapterIds:[`b3-23`,`b3-24`]}],legacy:[`现代自由概念的分叉`,`先验方法`,`历史辩证法`,`民族国家与浪漫个人主义`],review:`为什么法国革命既能支持个人自由，也能推动卢梭式公意、黑格尔式国家和浪漫主义反理性？`,coverage:`book`},{id:`industrial-modern`,years:`1850—1930`,title:`工业社会与现代哲学分流`,subtitle:`从尼采、马克思到逻辑分析`,transition:`单一宏大体系 → 多种方法解释工业化、科学与现代生活`,world:[`工业资本主义和大众政治重组阶级关系`,`进化论与现代科学改变人的位置`,`大学专业化促成哲学方法分流`],carrier:`政党、大学、工人运动、科学共同体与大众出版`,commonQuestion:`在工业、科学和传统价值崩解的世界里，哲学应解释结构、重估价值，还是澄清语言？`,chain:[{label:`共同环境`,text:`工业化、世俗化、科学化`,kind:`condition`},{label:`解释对象`,text:`价值 / 阶级 / 经验 / 语言`,kind:`response`},{label:`方法分流`,text:`谱系、历史、实用、分析`,kind:`oppose`},{label:`现代格局`,text:`哲学不再共享单一中心`,kind:`inherit`}],responses:[{id:`nietzsche`,title:`追溯并重估价值`,figures:`尼采`,region:`德语欧洲`,answer:`传统道德有历史和权力来源，虚无主义需要通过价值创造来克服。`,method:`谱系、心理洞察与格言`,difference:`不问价值是否符合永恒标准，而问它由何种生命需要产生。`,chapterIds:[`b3-25`]},{id:`utilitarian-marx`,title:`以结果或结构评价社会`,figures:`功利主义者、马克思`,region:`英国 / 欧洲工人运动`,answer:`制度可按总体幸福评价，或按生产关系与阶级支配解释并改变。`,method:`后果计算、政治经济学与历史唯物解释`,difference:`都把哲学拉向社会改革，却对个人利益和历史结构权重不同。`,chapterIds:[`b3-26`,`b3-27`]},{id:`pragmatists`,title:`以实践后果理解真理`,figures:`威廉·詹姆斯、约翰·杜威`,region:`美国`,answer:`观念的意义和真理应联系其在经验、行动和共同探究中的作用。`,method:`经验实验、功能分析与教育实践`,difference:`拒绝脱离生活的二元体系，把认识放回持续调整的环境。`,chapterIds:[`b3-29`,`b3-30`]},{id:`analysis`,title:`以逻辑分析澄清问题`,figures:`弗雷格传统、罗素与分析哲学`,region:`英国及欧洲逻辑传统`,answer:`许多哲学困难来自语法表面，揭示逻辑形式可以重构或消除问题。`,method:`逻辑形式、定义与语言分析`,difference:`不再建立历史整体，而把哲学变成精确的澄清活动。`,chapterIds:[`b3-31`]}],legacy:[`价值谱系`,`社会结构批判`,`实用主义`,`分析哲学`,`现代哲学的多中心格局`],review:`为什么工业社会没有产生一个统一哲学，而同时产生了尼采、马克思、实用主义和逻辑分析？`,coverage:`book`}],ne={origins:{events:[{id:`ionian-network`,marker:`前 8—6 世纪`,title:`殖民、贸易与爱奥尼亚知识网络`,detail:`希腊人在地中海和黑海沿岸建立殖民城邦。米利都等商业城市同时接触埃及测量、巴比伦天文和多地宗教观念。知识开始脱离单一祭司传统，在旅行者与城邦精英之间比较、修正。`},{id:`polis-rise`,marker:`前 7—6 世纪`,title:`城邦政治与成文法兴起`,detail:`贵族、僭主和平民围绕土地、债务和公民资格反复冲突。成文法与公共议事让秩序显得并非只能由神授，也能由人说明和改变；论证由此成为公共生活的一种力量。`},{id:`persian-wars`,marker:`前 499—449`,title:`希波战争与希腊世界重组`,detail:`爱奥尼亚起义和希波战争摧毁、迁移了一些早期思想中心，同时提升雅典的军事与文化地位。哲学活动逐渐由小亚细亚向南意大利和雅典转移。`}],problems:[{id:`arche`,marker:`自然`,title:`多样世界是否有共同本原？`,detail:`跨文明观察带来大量不同解释。早期哲学家尝试用水、无限者、气、数或原子等较少的自然原则说明较多现象，使世界成为可以争论的对象。`},{id:`change-being`,marker:`存在`,title:`变化与恒常如何同时成立？`,detail:`经验呈现生成与毁灭，理性却要求同一和不矛盾。赫拉克利特、巴门尼德及后来的多元论者，正是在回应感官变化与理性恒常之间的冲突。`},{id:`reason-sense`,marker:`知识`,title:`感官和推理，何者更可靠？`,detail:`数学证明显示推理可以达到不依赖眼前经验的确定性；但自然研究又从观察起步。这个张力后来成为柏拉图主义、经验研究和科学方法长期分化的起点。`}]},athens:{events:[{id:`athenian-democracy`,marker:`前 508—431`,title:`民主、帝国与公共辩论扩张`,detail:`克利斯提尼改革后，公民大会、法庭和演说成为雅典政治核心。海上同盟又带来财富与帝国权力。能否说服公众、界定正义，成为真实的政治能力。`},{id:`peloponnesian-war`,marker:`前 431—404`,title:`伯罗奔尼撒战争与政体反复`,detail:`长期战争、瘟疫、远征失败以及民主和寡头政变交替，削弱了雅典对自身制度的信心。苏格拉底之死与柏拉图的政治不信任，都处在这一创伤背景中。`},{id:`macedonian-rise`,marker:`前 387—322`,title:`学园建立与马其顿接管希腊`,detail:`柏拉图学院和亚里士多德吕克昂把哲学变成持续教学与研究制度；与此同时，马其顿击败希腊城邦，传统公民政治的自主空间迅速缩小。`}],problems:[{id:`knowledge-opinion`,marker:`知识`,title:`公共意见之外，是否有可靠知识？`,detail:`民主法庭依赖多数判断，智者展示同一案件可以有相反论证。苏格拉底与柏拉图因此追问：若没有稳定定义和真理，政治判断如何避免只剩说服与权势？`},{id:`virtue-education`,marker:`伦理`,title:`德性能够通过教育获得吗？`,detail:`新兴政治生活让修辞教师成为职业，但“会成功”是否等于“是善的”并不清楚。苏格拉底把教育从技能训练转成对灵魂、知识和行动一致性的审问。`},{id:`best-polis`,marker:`政治`,title:`失序之后，怎样组织好城邦？`,detail:`雅典的战争失败使哲学家不得不比较民主、寡头、君主和混合政体。柏拉图从知识资格设计理想国，亚里士多德则从现实宪制与公民生活寻找可行秩序。`}]},hellenistic:{events:[{id:`alexander`,marker:`前 334—323`,title:`亚历山大征服波斯帝国`,detail:`马其顿军队把希腊势力推进到埃及、中亚和印度河流域。征服制造了跨地域的政治与文化空间，也终结了希腊城邦作为最高政治单位的稳定地位。`},{id:`successor-kingdoms`,marker:`前 323—168`,title:`继业者王国与希腊化城市形成`,detail:`帝国分裂为托勒密、塞琉古等君主国。亚历山大里亚等城市汇聚希腊、埃及、波斯和犹太传统，学派与图书馆取代城邦公民共同体，成为知识的重要载体。`},{id:`roman-expansion`,marker:`前 168—30`,title:`罗马接管地中海世界`,detail:`罗马先后控制马其顿、希腊和埃及。政治中心继续远离传统希腊城邦，哲学则被带入罗马精英教育和更广泛的帝国生活。`}],problems:[{id:`inner-freedom`,marker:`生活`,title:`无法控制政治时，个人怎样自由？`,detail:`个人从城邦决策者变为大王国的臣民，外部地位更不稳定。犬儒、伊壁鸠鲁和斯多葛学派都把自由重新安放在需要、欲望或判断的管理上。`},{id:`cosmopolis`,marker:`共同体`,title:`跨地域世界需要怎样的共同身份？`,detail:`人口迁移和文化混合削弱了单一城邦身份。斯多葛主义用共同理性和自然法构造“世界公民”，其他学派则用友谊小共同体或退出公共规范回应。`},{id:`tranquility-certainty`,marker:`知识`,title:`确定知识是否是安宁的必要条件？`,detail:`怀疑派认为减少知识承诺本身能够消除扰动；伊壁鸠鲁派却认为必须理解自然，才能解除神罚和死亡恐惧。两者共享宁静目标，却对知识的作用判断相反。`}]},roman:{events:[{id:`augustan-order`,marker:`前 27—180`,title:`元首制与帝国和平`,detail:`奥古斯都以后，军队、税制、道路和行政把广大地区纳入较稳定的秩序。希腊哲学被罗马精英吸收，但哲学家很少再把参与独立城邦当作生活前提。`},{id:`citizenship-law`,marker:`1—3 世纪`,title:`罗马法与公民身份扩张`,detail:`城市网络、法律程序和二一二年的公民权敕令扩大了共同制度。不同民族在同一帝国中生活，使普遍法、角色义务和人类共同性的观念更有现实基础。`},{id:`third-century-crisis`,marker:`235—284`,title:`三世纪危机与宗教需求上升`,detail:`皇位频繁更替、内战、边境压力、瘟疫和经济混乱削弱帝国安全感。传统公共宗教难以解释个人苦难，神秘宗教和更强的来世救赎需求因而扩张。`}],problems:[{id:`role-duty`,marker:`伦理`,title:`庞大制度中的人应怎样履行角色？`,detail:`帝国把皇帝、奴隶、士兵和官员置于不同位置。罗马斯多葛主义试图说明：外在角色有别，但每个人都能通过理性判断和恰当行动保有德性。`},{id:`fate-freedom`,marker:`自由`,title:`必然命运中还能有什么自由？`,detail:`个人难以影响帝国政治，战争与疾病也不可预测。哲学于是区分事件本身与人的判断，把自由缩小却加固为无法被外力直接夺走的内在能力。`},{id:`higher-reality`,marker:`形而上学`,title:`外部秩序之外，更高真实在哪里？`,detail:`帝国制度能提供法律，却不能提供终极意义。普罗提诺把真实组织成太一、精神与灵魂的层级，并要求灵魂由感性多样返回统一根源。`}]},patristic:{events:[{id:`constantine`,marker:`313—325`,title:`君士坦丁改宗与尼西亚会议`,detail:`基督教获得合法地位后，教义分歧不再只是宗派内部问题。皇帝召集会议处理基督性质等争论，神学语言与帝国统一第一次被制度性地连接。`},{id:`state-religion`,marker:`380—395`,title:`基督教成为帝国主导宗教`,detail:`狄奥多西时期，尼西亚基督教获得国家支持，异教祭祀受到限制。教会吸收行政资源，也必须处理权力、强制与正统边界的问题。`},{id:`western-collapse`,marker:`410—529`,title:`西罗马瓦解与修道制度成长`,detail:`罗马遭劫和西部皇权消失，使城市教育与行政网络衰退。主教和修道院逐渐承担救济、识字教育与典籍保存，教会成为少数跨地域连续组织。`}],problems:[{id:`greek-language`,marker:`神学`,title:`如何用希腊概念表达启示？`,detail:`圣经叙事谈创造与救赎，希腊哲学谈实体、形式和永恒。教父必须借用后者澄清三位一体与基督论，同时避免让基督教被完全改写成柏拉图主义。`},{id:`evil-grace`,marker:`人性`,title:`恶、自由意志与恩典怎样相容？`,detail:`基督教既坚持上帝全善全能，又必须解释罪与苦难。奥古斯丁把恶理解为善的缺失，把犯罪归于意志，却又强调堕落者离不开神圣恩典。`},{id:`sacred-history`,marker:`历史`,title:`帝国崩溃意味着宗教失败吗？`,detail:`罗马被劫后，异教作者把灾难归咎于基督教。奥古斯丁以“上帝之城”和“世俗之城”区分政治命运与救赎史，使历史获得一个超越帝国兴亡的方向。`}]},"early-medieval":{events:[{id:`islamic-expansion`,marker:`7—10 世纪`,title:`伊斯兰扩张与翻译运动`,detail:`阿拉伯帝国连接叙利亚、波斯、埃及与西班牙。巴格达等中心把希腊哲学、印度数学和医学译成阿拉伯语，并在注释、计算与科学实践中继续发展。`},{id:`carolingian`,marker:`800—843`,title:`查理曼帝国与拉丁教育重建`,detail:`查理曼加冕象征西部帝国观念复兴。宫廷和修道院推动文字规范、学校与抄本复制，但统一很快瓦解，教育仍主要依附少数宗教机构。`},{id:`investiture`,marker:`1075—1122`,title:`教会改革与叙任权斗争`,detail:`改革教皇反对世俗君主任命主教，皇帝则坚持传统控制。冲突把精神权威与世俗权力明确区分，也推动教会法和制度论证发展。`}],problems:[{id:`preservation-authority`,marker:`知识`,title:`文明断裂后，谁有权保存和筛选知识？`,detail:`不同地区保存了不同古典资源：西欧修道院偏重拉丁宗教文本，拜占庭保留希腊传统，伊斯兰城市则广泛翻译和扩展。保存从来同时意味着选择。`},{id:`reason-revelation`,marker:`方法`,title:`跨语言知识怎样进入信仰体系？`,detail:`翻译不只是换语言，也会改变概念。约翰·司各脱、阿维森纳和阿威罗伊都必须判断：哲学推理与启示冲突时，是重新解释经文、限制理性，还是区分真理层次。`},{id:`two-powers`,marker:`政治`,title:`教皇与皇帝，谁代表普遍秩序？`,detail:`西欧没有单一帝国，却同时继承罗马皇权和普世教会理想。主教任命、财产和法律管辖的争执，使政治思想长期围绕两种普遍权威的边界展开。`}]},scholastic:{events:[{id:`translations-crusades`,marker:`1095—1250`,title:`十字军、城市贸易与翻译回流`,detail:`军事接触并非知识传播的唯一渠道，但地中海联系扩大，使托莱多、西西里等地的阿拉伯语和希腊语著作进入拉丁世界，完整亚里士多德尤其改变大学课程。`},{id:`universities`,marker:`12—13 世纪`,title:`大学与托钵修会兴起`,detail:`巴黎、牛津等大学形成教师、课程与学位制度；方济各会和多明我会进入城市教育。哲学问题被固定成可反驳、可答辩、可积累的专业论证格式。`},{id:`papal-decline`,marker:`1302—1378`,title:`教皇高峰后的政治裂缝`,detail:`教皇与法国王权冲突、阿维尼翁时期及教会分裂削弱普世权威。民族王权、城市和新法律实践上升，使经院综合失去原有的统一制度基础。`}],problems:[{id:`faith-reason`,marker:`体系`,title:`理性与启示能组成完整世界吗？`,detail:`亚里士多德提供自然、逻辑和伦理的系统解释，却包含与基督教不完全相容的前提。阿奎那试图划分自然理性能及之处，以及必须依赖启示的领域。`},{id:`universal-individual`,marker:`本体论`,title:`普遍概念和个体事物谁更根本？`,detail:`大学辩论需要精确定义“人性”“种类”等共相的地位。实在论、概念论和唯名论的差异，又影响上帝知识、个体责任和经验对象应如何被理解。`},{id:`limits-system`,marker:`方法`,title:`一个体系应当在哪里停止解释？`,detail:`经院方法追求兼容全部权威，但奥卡姆等人强调简约、个体和上帝意志，缩小理性证明范围。体系内部由此产生限制体系自身的工具。`}]},"renaissance-science":{events:[{id:`print-fall`,marker:`1450—1453`,title:`印刷术传播与君士坦丁堡陷落`,detail:`活字印刷显著降低文本复制成本，希腊学者和手稿又更多进入意大利。古典材料不再只由大学经院传统解释，人文主义者开始校勘原文和比较版本。`},{id:`oceanic-expansion`,marker:`1492—1522`,title:`远洋航行扩大已知世界`,detail:`跨大西洋航行和环球航行暴露了古典地理知识的限度，也带来殖民、财富与暴力。经验事实能够公开修正权威文本，欧洲人的人类与自然观被迫扩展。`},{id:`reformation-science`,marker:`1517—1633`,title:`宗教改革与日心说冲突`,detail:`宗教改革打破西欧教会统一；哥白尼、开普勒和伽利略又以数学和观察改变宇宙结构。经文、古代权威与可检验自然知识之间出现多重竞争。`}],problems:[{id:`political-reality`,marker:`政治`,title:`政治能否脱离统一神学伦理研究？`,detail:`意大利城邦的战争与外交显示，统治者常按权力后果而非传统德性行动。马基雅维利由此把政治稳定、能力和时机当作相对独立的研究对象。`},{id:`interpretation-authority`,marker:`权威`,title:`个人、经文与教会，谁解释真理？`,detail:`印刷让经文和论战迅速传播，宗教改革削弱教会作为唯一中介的地位。个人良心上升，却也产生宗派国家、教义冲突和新的强制。`},{id:`new-method`,marker:`科学`,title:`什么方法能让自然知识可信？`,detail:`旧体系依赖经典注释和目的因，新天文学则依赖测量、数学预测与仪器观察。争论的核心不只是地球是否运动，而是什么证据足以推翻权威。`}]},"early-modern":{events:[{id:`religious-wars`,marker:`1618—1648`,title:`三十年战争与威斯特伐利亚和约`,detail:`宗教、王朝和领土冲突造成中欧巨大破坏。和约强化领土国家秩序，也使政治和平越来越难以依赖全欧洲共享的宗教真理。`},{id:`english-revolutions`,marker:`1642—1689`,title:`英国内战与光荣革命`,detail:`王权、议会、宗教和财产权的冲突经历内战、共和国、复辟与权利法案。霍布斯和洛克由同一政治危机出发，却分别强调不可分主权与有限政府。`},{id:`newtonian-science`,marker:`1660—1687`,title:`科学共同体与牛顿综合`,detail:`皇家学会等机构推动公开实验和通信，牛顿以数学定律统一地上与天体运动。科学成为哲学家想要模仿、解释或限制的可靠知识模型。`}],problems:[{id:`certainty-foundation`,marker:`认识论`,title:`失去共同权威后，确定性从哪里开始？`,detail:`笛卡尔从不可怀疑的主体出发，理性主义者追求数学式体系；洛克和休谟则追踪观念的经验来源。现代哲学由此把“认识者”放到知识结构中心。`},{id:`sovereignty-rights`,marker:`政治`,title:`安全、主权与个人权利怎样排序？`,detail:`宗教战争显示分裂权威可能导致暴力，英国内战又显示绝对权力本身也危险。社会契约论用个人同意重建国家，却对权力边界给出不同答案。`},{id:`causation-induction`,marker:`科学`,title:`经验为何能支持普遍科学定律？`,detail:`科学不断成功，但经验只呈现有限事件。休谟指出，我们看见的是连续发生，而非必然联系；归纳依赖习惯，却无法用不循环的经验论证自身。`}]},"revolution-idealism":{events:[{id:`atlantic-revolutions`,marker:`1776—1799`,title:`美国革命与法国革命`,detail:`自然权利、人民主权和公民平等进入制度实践；法国革命同时经历共和、恐怖与政变。自由不再只是理论原则，也暴露出共同意志与政治暴力的紧张。`},{id:`napoleonic`,marker:`1799—1815`,title:`拿破仑战争重绘欧洲`,detail:`法国制度和民族动员席卷欧洲，随后又由王朝复辟收束。战争促进民族意识，也让哲学家把国家、法律和历史变化理解为自由展开的现实场所。`},{id:`industrial-1848`,marker:`1815—1848`,title:`工业化、民族主义与革命浪潮`,detail:`工厂城市、阶级分化和市场关系改变日常生活，民族独立与宪政运动扩张。浪漫主义反对把人缩减为计算与生产单位，一八四八年革命则集中暴露社会矛盾。`}],problems:[{id:`freedom-general-will`,marker:`政治`,title:`个人自由如何进入共同意志？`,detail:`革命需要以人民名义行动，却可能压制具体个人。卢梭的公意、康德的自律和黑格尔的制度自由，都试图说明服从共同规则何时不是失去自由。`},{id:`subject-world`,marker:`认识论`,title:`主体是在发现世界，还是构成经验？`,detail:`休谟的怀疑使理性主义和经验主义都难以保证科学必然性。康德转而研究经验得以可能的主体条件，并由此开启德国观念论。`},{id:`history-freedom`,marker:`历史`,title:`历史变化是否具有理性方向？`,detail:`革命和战争让制度在一代人内剧烈改变。黑格尔把冲突解释为自由意识的发展，浪漫主义者则担心抽象历史整体吞没个性、情感与不可替代的生命。`}]},"industrial-modern":{events:[{id:`industrial-capital`,marker:`1848—1871`,title:`工业资本主义与工人运动成长`,detail:`铁路、工厂和城市化扩大生产，也加深劳动分工、周期危机与阶级冲突。工会、社会主义和大众政治兴起，社会结构本身成为哲学解释与改造对象。`},{id:`darwin-secular`,marker:`1859 以后`,title:`进化论与传统世界观动摇`,detail:`达尔文以自然选择解释物种形成，人类不再天然处于独立创造的位置。历史发展、生命竞争和宗教权威的衰退，共同迫使哲学重估价值来源。`},{id:`mass-war-analysis`,marker:`1879—1918`,title:`专业大学、逻辑革命与世界大战`,detail:`哲学和科学在大学中专业化，现代逻辑改变了分析工具；民族国家和工业技术又在第一次世界大战中显示巨大破坏力。统一进步叙事因此失去可信度。`}],problems:[{id:`value-after-god`,marker:`价值`,title:`传统宗教衰退后，价值从哪里来？`,detail:`科学解释减少了诉诸神意的空间，社会规范又显出历史性。尼采用谱系追问价值由何种生命与权力关系产生，并把虚无主义视为现代核心危机。`},{id:`structure-agency`,marker:`社会`,title:`人的生活由结构决定到什么程度？`,detail:`马克思强调生产关系与阶级，功利主义从行动后果评价制度，实用主义则把观念放回环境中的调整活动。它们都反对孤立主体，却给人的能动性留下不同空间。`},{id:`philosophy-task`,marker:`方法`,title:`哲学应建体系、改社会，还是澄清语言？`,detail:`现代知识专业化后，哲学失去单一中心。谱系、政治经济学、实用实验和逻辑分析并存，分歧已不只是答案不同，而是对哲学任务本身的判断不同。`}]}},re=[{id:`natural`,title:`自然假说`,rule:`用更少的自然本原解释更多现象`,uses:[`米利都学派`,`原子论`,`新科学`],stages:[`origins`,`renaissance-science`]},{id:`deduction`,title:`演绎与体系`,rule:`从少数被认为可靠的起点推出整体结构`,uses:[`巴门尼德`,`柏拉图`,`笛卡尔`,`斯宾诺莎`],stages:[`origins`,`athens`,`early-modern`]},{id:`dialectic`,title:`问答与辩证`,rule:`通过矛盾、反方和概念区分推进认识`,uses:[`苏格拉底`,`经院哲学`,`黑格尔`],stages:[`athens`,`scholastic`,`revolution-idealism`]},{id:`classification`,title:`分类与功能`,rule:`先区分事物类型，再解释各自原因和适当活动`,uses:[`亚里士多德`,`经院体系`],stages:[`athens`,`scholastic`]},{id:`therapy`,title:`哲学治疗`,rule:`改变欲望与判断，使人能够承受不可控制的世界`,uses:[`犬儒派`,`伊壁鸠鲁派`,`斯多葛派`,`怀疑派`],stages:[`hellenistic`,`roman`]},{id:`interpretation`,title:`解释与综合`,rule:`把既有经典放入新的宗教或概念体系`,uses:[`奥古斯丁`,`阿奎那`,`伊斯兰哲学`],stages:[`patristic`,`early-medieval`,`scholastic`]},{id:`empirical`,title:`经验与实验`,rule:`追踪观念来源，并让主张接受观察或实践检验`,uses:[`培根`,`洛克`,`休谟`,`实用主义`],stages:[`renaissance-science`,`early-modern`,`industrial-modern`]},{id:`critique`,title:`条件分析`,rule:`不直接回答对象是什么，而先问认识它何以可能`,uses:[`康德`,`语言分析`],stages:[`revolution-idealism`,`industrial-modern`]},{id:`genealogy`,title:`历史与谱系`,rule:`通过生成过程解释观念、制度和价值的权力来源`,uses:[`黑格尔`,`马克思`,`尼采`],stages:[`revolution-idealism`,`industrial-modern`]}],ie=[{from:`毕达哥拉斯的数学—宗教秩序`,to:`柏拉图的理念论`,label:`改造`,weight:3},{from:`柏拉图与新柏拉图主义`,to:`奥古斯丁神学`,label:`吸收`,weight:3},{from:`斯多葛自然法与普世人性`,to:`基督教伦理与近代自然权利`,label:`远程传递`,weight:3},{from:`亚里士多德著作`,to:`伊斯兰哲学 → 拉丁经院哲学`,label:`跨文明传播`,weight:3},{from:`古代怀疑主义`,to:`休谟的经验主义怀疑`,label:`问题复活`,weight:2},{from:`苏格拉底的概念追问`,to:`现代逻辑与语言分析`,label:`方法回声`,weight:2},{from:`柏拉图式整体政治`,to:`卢梭、黑格尔与国家哲学`,label:`结构回声`,weight:2},{from:`赫拉克利特的变化与冲突`,to:`黑格尔、马克思与尼采`,label:`高权重例外`,weight:1}],ae={"a priori":`a priori`,aēr:`air`,anankē:`necessity`,anamnēsis:`recollection`,antilogiai:`opposing arguments`,apeiron:`the boundless`,aponia:`absence of bodily pain`,archē:`first principle`,aretē:`virtue`,askēsis:`practice`,ataraxia:`tranquility`,atomon:`atom`,autarkeia:`self-sufficiency`,clinamen:`atomic swerve`,clementia:`clemency`,"de rerum natura":`On the Nature of Things`,daimonion:`divine sign`,doxa:`opinions`,eidōla:`images`,ekpyrōsis:`cosmic conflagration`,elenchus:`refutation`,epistrophē:`return`,epochē:`suspension of judgment`,euboulia:`good deliberation`,eudaimonia:`flourishing`,eulogon:`the reasonable`,euthymia:`cheerfulness`,hēgemonikon:`ruling faculty`,henōsis:`union`,harmonia:`harmony`,hylomorphism:`matter-form theory`,hypostases:`levels of being`,isostheneia:`equipollence`,katharsis:`purification`,kathēkon:`appropriate action`,"katalēptikē phantasia":`cognitive impression`,kosmopolitēs:`citizen of the world`,lekton:`sayable`,logos:`reason / order`,maieutic:`midwifery`,methexis:`participation`,metempsychosis:`transmigration of souls`,mimēsis:`imitation`,neikos:`strife`,nous:`mind`,officium:`duty`,ousia:`substance`,"paracharattein to nomisma":`defacing the currency`,parrhēsia:`frank speech`,phainomena:`appearances`,philia:`friendship`,philotēs:`love`,phronēsis:`practical wisdom`,"pithanē phantasia":`persuasive impression`,prohairesis:`volition`,proficiens:`progressor`,prosōpon:`role`,psychē:`soul`,pneuma:`breath / spirit`,personae:`roles`,simulacra:`images`,sophos:`sage`,sympatheia:`cosmic sympathy`,synkatathesis:`assent`,tetrapharmakos:`four-part cure`,theōria:`contemplation`,"to eon":`what-is`},oe={"universal epochē":{english:`universal suspension`,original:`epochē`}};function se(e){let t=oe[e.toLocaleLowerCase()];if(t)return t;let n=e.split(` / `).map(e=>e.trim()).filter(Boolean),r=n.filter(e=>ae[e.toLocaleLowerCase()]),i=n.filter(e=>!ae[e.toLocaleLowerCase()]);return r.length?{english:i.join(` / `)||ae[r[0].toLocaleLowerCase()]||e,original:r.join(` / `)}:{english:e}}var O=e=>({label:`罗素《西方哲学史》${e}`,kind:`原书`,url:`https://www.russell-j.com/cool/HWP_1945.pdf`}),k={label:`Stanford Encyclopedia · Stoicism`,kind:`补充`,url:`https://plato.stanford.edu/entries/stoicism/`},ce={label:`Internet Encyclopedia of Philosophy · Stoicism`,kind:`补充`,url:`https://iep.utm.edu/stoicism/`},le=[{id:`zeno`,order:21,nameZh:`季蒂昂的芝诺`,nameEn:`Zeno of Citium`,greekName:`Ζήνων ὁ Κιτιεύς`,dates:`约前 334—前 262`,active:`约前 300 年前后`,places:[`季蒂昂`,`雅典`,`彩绘柱廊`],school:`早期斯多葛主义`,figureId:`zeno`,chapterIds:[`b1-28`],thesis:`世界受同一理性秩序贯穿；人不能退出因果整体，却能通过审查印象、控制同意并使意志合乎自然，把自由安放在自身的判断中。`,evidenceCaution:`著作全部失传，只剩后世摘录和转述；早期斯多葛主义又常以学派整体名义保存，因此不能把克律西波斯后来系统化的每项教义都直接归给芝诺。`,lifeSummary:`芝诺来自塞浦路斯的腓尼基文化城市季蒂昂，在亚历山大帝国解体、东方移民进入雅典学术圈的时代来到雅典。他先后接触犬儒派克拉特斯、麦加拉辩证传统和柏拉图学院，约前 300 年开始在雅典广场的彩绘柱廊讲学，学派遂由讲学地点得名。其思想把犬儒派的自足伦理、赫拉克利特式火与逻各斯、苏格拉底的德性追问组织在一起，首次形成逻辑—物理—伦理相互支撑的斯多葛方案。`,timeline:[{date:`约前 334`,place:`季蒂昂（塞浦路斯）`,title:`出生于东地中海商贸城市`,detail:`古代资料称其有腓尼基背景；确切出生年份和家庭情况存在差异。`,certainty:`推定`},{date:`约前 312—前 300`,place:`雅典`,title:`进入多个哲学传统`,detail:`沉船后接触哲学的故事带有传记程式；较可信的是他曾从学克拉特斯、斯提尔波和学院哲学家。`,certainty:`传统记载`},{date:`约前 300`,place:`雅典彩绘柱廊`,title:`形成斯多葛学派`,detail:`在公共柱廊讲学，使哲学从封闭学园延伸到城市公共空间；学生后来被称为“柱廊派”。`,certainty:`较可靠`},{date:`约前 262`,place:`雅典`,title:`去世并由克里安西斯继承`,detail:`雅典人对其德性和公共教导给予荣誉；具体死因来自晚期轶事，不宜确定化。`,certainty:`较可靠`}],inquiries:[{object:`知识与行动`,question:`印象不断进入心灵时，人在哪里对真假和行动负责？`,start:`感官印象并不自动等于判断；同一事件可以被接受、拒绝或暂缓认可。`,steps:[`外物引起印象`,`理性检查印象是否具有可靠来源`,`心灵给予或拒绝同意`,`冲动由已同意的价值判断转成行动`],conclusion:`自由不意味着事件无原因，而在于行动通过主体的同意结构发生；认识训练因此直接构成伦理训练。`},{object:`宇宙秩序与善`,question:`若自然由必然因果支配，个人怎样仍能过好生活？`,start:`宇宙不是无序粒子的偶然集合，而是由物质与贯穿其中的理性火共同构成的有机整体。`,steps:[`把神、自然、命运和普遍理性理解为同一秩序的不同名称`,`承认外部事件不由个人完全支配`,`把善限定为理性意志的德性`,`使个人目的与整体自然相协调`],conclusion:`合乎自然生活不是被动接受一切，而是把价值判断集中于能够成为自己行动原则的部分。`}],concepts:[{zh:`同意`,en:`assent / synkatathesis`,definition:`心灵对印象作出认可的环节。外部刺激可以强迫印象出现，却不等于已经证明它真实或值得追随。`},{zh:`认知印象`,en:`cognitive impression / katalēptikē phantasia`,definition:`被设想为由真实对象以足够清楚方式造成、可以成为知识基础的印象；学院怀疑派后来集中攻击这一标准。`},{zh:`逻各斯`,en:`logos / cosmic reason`,definition:`贯穿物质世界、组织因果与目的的理性原则；在早期斯多葛主义中它不是脱离世界的非物质存在。`},{zh:`合乎自然生活`,en:`living according to nature`,definition:`使人的理性能力与整体自然秩序一致。该公式由早期学派逐步定型，不应只理解成服从本能。`},{zh:`德性是唯一的善`,en:`virtue as the only good`,definition:`健康、财富、地位本身不决定生活好坏；真正的善在于理性选择的品质。后来的斯多葛派用“可取的无差别物”处理现实选择。`}],lineage:{inherited:`由犬儒派继承自足和德性优先，由苏格拉底传统继承灵魂照料，由赫拉克利特获得火、逻各斯和宇宙循环语言，同时吸收麦加拉派与学院的辩证训练。`,school:`创立早期斯多葛主义，但现存‘斯多葛体系’大多经过克里安西斯的保存和克律西波斯的重构；创始与成熟体系必须分开。`,influenced:`克里安西斯直接继承学园，克律西波斯完成系统化；经中期斯多葛主义和罗马作者，德性、自然法与内在自由进入欧洲伦理传统。`,parallel:`与伊壁鸠鲁都回应希腊化世界的不安全，并重视哲学治疗；前者相信理性天意和公共责任，后者以原子偶然性、友谊共同体和降低欲望获得安定。`},comparisons:[{target:`犬儒派`,relation:`承接前人`,shared:`德性、自足和减少外物支配。`,difference:`芝诺把激进生活姿态扩展为包含逻辑和宇宙论的完整体系，并保留较多社会角色与共同体义务。`},{target:`赫拉克利特`,relation:`后世重构`,shared:`火、逻各斯、对立统一与宇宙秩序。`,difference:`斯多葛派把零散格言系统化为实体论、天意论和循环宇宙论，不能视作未经变化的直接复制。`},{target:`克律西波斯`,relation:`影响后继`,shared:`逻辑、物理与伦理互相支撑，德性要求合乎自然。`,difference:`芝诺提出方向；克律西波斯细化命题逻辑、心理过程和决定论，使之成为可辩护的学派体系。`},{target:`伊壁鸠鲁`,relation:`同题比较`,shared:`都把哲学变成解除恐惧和获得稳定生活的方法。`,difference:`芝诺接受天意与公共义务；伊壁鸠鲁拒绝神意治理，并倾向从政治竞争中退出。`}],russellView:`罗素把芝诺描绘成重德性、厌恶形而上精微的唯物论者：神、灵魂和德性都必须在实体世界中得到说明。他强调斯多葛主义把赫拉克利特式宇宙火、严格决定论和有益天意结合起来，又由‘德性是唯一的善’推出外物不能伤害贤者的内在自由。`,modernCorrection:`“可控制／不可控制”是爱比克泰德最鲜明的表达，不宜原样倒置给芝诺。现代研究也比罗素更强调早期体系的逻辑—物理—伦理一体性，并提醒我们：资料多来自敌对作者和数百年后的编纂者，学派共识与创始人本人观点无法处处拆分。`,sources:[O(`第一卷第二十八章〈斯多葛主义〉`),k,ce]},{id:`cleanthes`,order:22,nameZh:`克里安西斯`,nameEn:`Cleanthes of Assos`,greekName:`Κλεάνθης`,dates:`约前 331—前 232`,active:`前 3 世纪中叶`,places:[`阿索斯`,`雅典`,`彩绘柱廊`],school:`早期斯多葛主义`,figureId:`cleanthes`,chapterIds:[`b1-28`],thesis:`既然命运是贯穿宇宙的理性秩序，人的自由不是改变必然链条，而是由理解转向自愿同行；不愿同行者仍会被因果整体带走。`,evidenceCaution:`作品仅存《宙斯颂》及若干残片，生平多依赖第欧根尼·拉尔修的晚期资料。罗素只突出两项事例，不能据此把他的全部工作缩减为宗教诗和反日心说。`,lifeSummary:`克里安西斯来自小亚细亚阿索斯，传统称他早年以拳击或体力劳动维生，白天听芝诺讲学、夜间汲水。无论细节是否可靠，这一形象说明古人如何把他的耐力与斯多葛德性联系起来。芝诺死后，他成为第二任学园领袖，维持学派约三十年。《宙斯颂》把神、自然法、逻各斯和命运写成可祈祷的宇宙秩序，是早期斯多葛宗教感最完整的残存文本。`,timeline:[{date:`约前 331`,place:`阿索斯`,title:`出生`,detail:`确切年代不明；来自爱琴海东岸，而非雅典本地精英。`,certainty:`推定`},{date:`前 3 世纪初`,place:`雅典`,title:`成为芝诺学生`,detail:`夜间劳动支付学习生活的故事属于传统记载，但其长期从学和贫困形象较稳定。`,certainty:`传统记载`},{date:`约前 262`,place:`雅典彩绘柱廊`,title:`继承学园`,detail:`芝诺去世后主持斯多葛学派，守住早期教义并培养克律西波斯。`,certainty:`较可靠`},{date:`约前 232`,place:`雅典`,title:`去世`,detail:`绝食而死的细节具有哲学家传记的典型色彩；年代本身较常采用。`,certainty:`传统记载`}],inquiries:[{object:`命运与自愿`,question:`同一必然事件，为什么可以被自由地接受，也可以被强迫地承受？`,start:`因果秩序不会因个人愿望暂停，但人的判断可以理解或误认自己在整体中的位置。`,steps:[`确认宇宙由理性法则统摄`,`区分事件发生与主体对事件的意愿`,`训练意愿与自然目标一致`,`把反抗必然造成的附加痛苦归因于错误判断`],conclusion:`著名的车与狗比喻表达兼容结构：车必然前进，狗可以同行或被拖行；自由是意愿与必然的协调。`},{object:`自然、神与虔敬`,question:`自然法为何不仅是物理事实，也能成为伦理规范？`,start:`同一逻各斯既维持宇宙秩序，也使人具有推理和理解共同法则的能力。`,steps:[`把宙斯理解为普遍理性而非任性人格神`,`由共同理性说明自然的整体关联`,`把善理解为自觉参与这一秩序`,`以赞颂和服从把知识转化为生活态度`],conclusion:`《宙斯颂》把物理学、神学和伦理压缩为同一关系：理解宇宙秩序，就是学习怎样自愿生活。`}],concepts:[{zh:`《宙斯颂》`,en:`Hymn to Zeus`,definition:`现存最完整的早期斯多葛文本，以宗教诗形式把宙斯、逻各斯、共同法和命运联系起来。`},{zh:`自愿同行`,en:`willing agreement with fate`,definition:`不能取消必然性，但可以让自己的愿望与必然秩序一致；这比简单的被动忍耐多出理解与意愿层。`},{zh:`宇宙自然`,en:`cosmic nature`,definition:`克里安西斯把“合乎自然”主要解释为合乎整体宇宙秩序；克律西波斯后来更明确加入人的理性本性。`},{zh:`宇宙大火`,en:`cosmic conflagration / ekpyrōsis`,definition:`世界周期性归于神性之火再重新展开的学说；罗素用它凸显斯多葛决定论与永恒重复。`}],lineage:{inherited:`直接继承芝诺，将赫拉克利特式火与逻各斯、苏格拉底式德性和犬儒式坚忍转化为更具宗教情感的宇宙伦理。`,school:`第二任学园领袖，首要贡献是保存、解释和人格化早期教义；不是像克律西波斯那样的大规模系统重建者。`,influenced:`培养克律西波斯并把学园交给下一代；《宙斯颂》的自然神学语言也成为理解斯多葛虔敬和后来宗教接受的重要证据。`,parallel:`与斯宾诺莎都把自由理解为认识必然性后的主动一致，但两者实体论、情感理论和历史语境完全不同，只能作结构比较。`},comparisons:[{target:`季蒂昂的芝诺`,relation:`承接前人`,shared:`神、自然、命运和理性构成同一宇宙秩序。`,difference:`克里安西斯更突出宇宙自然、虔敬和意愿服从，并以诗歌保存教义。`},{target:`克律西波斯`,relation:`影响后继`,shared:`合乎自然生活与决定论宇宙。`,difference:`克里安西斯偏重整体自然和宗教表达；克律西波斯扩展人的本性、逻辑和心理机制。`},{target:`伊壁鸠鲁`,relation:`同题比较`,shared:`都要消除人对命运和死亡的扰动。`,difference:`克里安西斯以信任理性天意获得安定；伊壁鸠鲁否认天意介入，以自然偶然性解除神罚恐惧。`}],russellView:`罗素说克里安西斯主要因两件事值得注意：主张应以不敬神罪起诉日心说的阿里斯塔克斯，以及留下《宙斯颂》和一首服从命运的祈祷。后者被罗素用来呈现斯多葛决定论的宗教情感。`,modernCorrection:`罗素的取材有意尖锐，却容易遮蔽克里安西斯在早期学派连续性、灵魂学说和伦理公式发展中的位置。反日心说的轶事也不应成为评价其全部哲学的捷径；其文本残缺决定了页面应短而明确，而不是补成虚假的完整体系。`,sources:[O(`第一卷第二十八章〈斯多葛主义〉`),k,ce]},{id:`chrysippus`,order:23,nameZh:`克律西波斯`,nameEn:`Chrysippus of Soli`,greekName:`Χρύσιππος`,dates:`约前 280—前 207`,active:`约前 230—前 207`,places:[`索利`,`雅典`,`彩绘柱廊`],school:`早期斯多葛主义`,figureId:`chrysippus`,chapterIds:[`b1-28`],thesis:`德性不是孤立格言的结果，而是一个系统：命题逻辑训练正确推断，物理学说明理性自然，心理学解释印象与同意，伦理学据此界定能负责的行动。`,evidenceCaution:`据说著书七百余卷，现无完整作品，只能由残片及西塞罗、普鲁塔克、盖伦等常带批评目的的见证重构。许多通称“斯多葛”的成熟学说可能主要来自他，却难逐项确定。`,lifeSummary:`克律西波斯出生于小亚细亚索利，在雅典从学克里安西斯，也接触学院派辩证法。约前 230 年成为第三任学园领袖。学派曾在克里安西斯时期声势减弱，他以庞大写作和精密论证重建逻辑、知识论、物理学、心理学与伦理学，使斯多葛主义获得与柏拉图学院和伊壁鸠鲁学派长期竞争的能力。古代所谓“若无克律西波斯，便无斯多葛”准确概括了他的结构性位置。`,timeline:[{date:`约前 280`,place:`索利（奇里乞亚）`,title:`出生`,detail:`来自希腊化东方城市；家庭财产与早年长跑经历主要见于晚期传记。`,certainty:`推定`},{date:`前 3 世纪中叶`,place:`雅典`,title:`学习并独立讲授辩证法`,detail:`师从克里安西斯，同时吸收学院论辩；后来以回应怀疑派攻击著称。`,certainty:`较可靠`},{date:`约前 230`,place:`雅典彩绘柱廊`,title:`成为第三任学园领袖`,detail:`开始大规模整理并辩护学派各部分，使斯多葛主义成为高度系统化传统。`,certainty:`较可靠`},{date:`前 207`,place:`雅典`,title:`去世`,detail:`具体死因有饮酒或大笑等互相冲突的轶事；只宜保留大致年代。`,certainty:`较可靠`}],inquiries:[{object:`命题逻辑`,question:`推理的有效性是否只能由主词—谓词和范畴三段论说明？`,start:`日常论证常以“如果……那么……”“或者……”“不可能同时……”连接整个命题，而非比较概念的包含关系。`,steps:[`把可真可假的完整命题作为基本单位`,`识别否定、合取、析取和条件关系`,`建立若干不可证明式作为推理骨架`,`用规则把复杂论证还原为有效形式`],conclusion:`形成区别于亚里士多德词项逻辑的命题逻辑传统；它不是现代逻辑的原样前身，却处理了现代人熟悉的联结词推理。`},{object:`决定论与责任`,question:`一切有原因时，人的同意为什么不只是外因推动？`,start:`命运是完整因果网络，但同一外部推动会因对象自身结构不同而产生不同运动。`,steps:[`承认印象和处境有先行原因`,`把主体性格与判断纳入完整原因`,`以圆柱受推后按自身形状滚动说明内在因`,`区分无原因偶然与由主体结构产生的行动`],conclusion:`责任不要求脱离因果，而要求行动通过主体的判断与性格成为自己的行动；这是古代兼容论的重要模型。`},{object:`情绪与价值判断`,question:`恐惧、愤怒等激情为何能接受理性治疗？`,start:`激情不只是身体冲击，也包含“外物极其善恶、现在必须如此反应”的认可。`,steps:[`识别引发情绪的印象`,`分离最初反应与后续同意`,`检验外物是否真正决定善恶`,`用反复练习重塑冲动和稳定性格`],conclusion:`错误价值判断使冲动过度并成为激情；改变判断能够改变情绪轨迹，但并非要求人瞬间消除一切自然反应。`}],concepts:[{zh:`可说之物`,en:`lekton / sayable`,definition:`话语所表达、可以为真或假的意义内容；它既不是声音，也不是外部物体，是斯多葛语义学的重要非物体对象。`},{zh:`不可证明式`,en:`indemonstrables`,definition:`无需由其他形式证明的基本有效推理模式，例如肯定前件和否定后件式；复杂论证可由规则归约到它们。`},{zh:`共命运`,en:`co-fated events`,definition:`结果与实现它的行动条件共同属于因果链；“命定会康复”并不排除必须找医生，借此反驳宿命论式不行动。`},{zh:`气息`,en:`pneuma`,definition:`由火与气构成、贯穿物质并赋予组织和张力的主动原则；在人身上承担灵魂和认知活动。`},{zh:`激情判断论`,en:`passions as judgments`,definition:`激情包含错误或失度的价值判断与冲动；理性治疗针对的是认可结构，不只是压制表情。`},{zh:`贤者`,en:`sage / sophos`,definition:`判断完全一致、只以德性为善的理想人物；它主要是规范标尺，不能假定普通实践者已经达到。`}],lineage:{inherited:`继承芝诺的三分体系和克里安西斯的自然伦理，并吸收麦加拉—辩证传统对条件命题、悖论和论证形式的长期研究。`,school:`第三任学园领袖和最重要的系统化者；早期斯多葛主义的成熟版本在很大程度上就是经他整理、辩护和扩展后的版本。`,influenced:`后续斯多葛派即使修正他的物理或心理学，也在其概念框架中工作；西塞罗、塞涅卡、爱比克泰德和马可·奥勒留保存并改造了其伦理遗产。`,parallel:`与亚里士多德都要给有效推理建立形式规则，但亚里士多德以词项和范畴命题为中心，克律西波斯以完整命题及其联结关系为中心。`},comparisons:[{target:`季蒂昂的芝诺`,relation:`承接前人`,shared:`哲学由逻辑、物理和伦理构成一个系统。`,difference:`芝诺提供纲领；克律西波斯增加技术细节，并回应怀疑派、学院派和宿命论反驳。`},{target:`克里安西斯`,relation:`承接前人`,shared:`宇宙决定论、天意与合乎自然生活。`,difference:`克里安西斯偏重宇宙自然和宗教表达；克律西波斯突出人的理性本性、命题逻辑和心理机制。`},{target:`亚里士多德`,relation:`同题比较`,shared:`都系统研究有效推理、原因、灵魂与德性。`,difference:`两者逻辑基本单位和实体论不同；斯多葛派坚持只有物体能作用或受作用。`},{target:`卡尔内阿德`,relation:`批评关系`,shared:`都围绕知识标准、有效推断和行动依据展开。`,difference:`克律西波斯维护可靠印象和系统知识；卡尔内阿德以不可区分反例和相反论证削弱确定性。`}],russellView:`罗素称他多产而使斯多葛主义变得系统且学院化，特别指出假言与析取推理、语法研究和经验主义知识论。他也用其关于善恶相互蕴含、灵魂存续和神义论的说法，展示决定论、天意与恶之间难以完全消除的张力。`,modernCorrection:`罗素承认其逻辑贡献，却未充分展开斯多葛命题逻辑的技术独立性。现代研究通常也不把斯多葛决定论直接等同于消极宿命论：同意、性格原因与共命运论证正是为保存行动和责任而提出。`,sources:[O(`第一卷第二十八章〈斯多葛主义〉`),{label:`Internet Encyclopedia of Philosophy · Chrysippus`,kind:`补充`,url:`https://iep.utm.edu/chrysippus/`},k]},{id:`panaetius`,order:24,nameZh:`帕奈提奥斯`,nameEn:`Panaetius of Rhodes`,greekName:`Παναίτιος`,dates:`约前 185—前 109`,active:`前 2 世纪后半叶`,places:[`罗得岛`,`雅典`,`罗马`],school:`中期斯多葛主义`,figureId:`panaetius`,chapterIds:[`b1-28`,`b1-29`],thesis:`伦理不能只描述几乎不存在的完美贤者，还要说明普通人在具体身份、能力和政治关系中怎样选择恰当行动；这使斯多葛主义能够进入罗马公共生活。`,evidenceCaution:`作品失传，主要经西塞罗及其他见证重构。《论义务》前两卷明确借鉴他的同名著作，但西塞罗的罗马改写不能逐句当作帕奈提奥斯原文。`,lifeSummary:`帕奈提奥斯生于罗得岛，先在雅典进入斯多葛传统，后与小西庇阿为核心的罗马精英圈交往并随其出行。约前 129 年主持雅典学园。他处在罗马征服希腊世界、共和国精英需要吸收希腊教育为公共伦理服务的节点：弱化早期学派较难被罗马常识接受的宇宙大火、占卜和灵魂存续学说，转而突出角色、义务和现实判断。`,timeline:[{date:`约前 185`,place:`罗得岛`,title:`出生`,detail:`来自重要海上城邦和希腊教育中心；具体年份为后世推定。`,certainty:`推定`},{date:`前 2 世纪中叶`,place:`雅典`,title:`进入斯多葛学派`,detail:`从学于第欧根尼与安提帕特等学园领袖，并吸收柏拉图和亚里士多德传统。`,certainty:`较可靠`},{date:`约前 145—前 139`,place:`罗马及地中海`,title:`进入小西庇阿交往圈`,detail:`与罗马政治精英的友谊使斯多葛伦理直接面对统治、外交与公共角色。`,certainty:`较可靠`},{date:`约前 129—前 109`,place:`雅典`,title:`主持学园并写作《论义务》`,detail:`著作失传，但经西塞罗《论义务》成为斯多葛伦理进入拉丁世界的关键渠道。`,certainty:`较可靠`}],inquiries:[{object:`角色与恰当行动`,question:`尚未成为贤者的人，怎样在家庭、职业和政治角色中作出可执行的选择？`,start:`“德性是唯一的善”给出最高尺度，却不能直接回答每个普通人此刻应任什么职、承担何种风险。`,steps:[`承认人共有理性和社会本性`,`辨认个人禀赋、处境与所承担角色`,`区分真正德性与仍可合理选择的外物`,`在冲突义务中寻找与整体人格一致的行动`],conclusion:`恰当行动把理想伦理转译为普通人的角色实践；哲学由极端贤者模型进入可持续的公共生活。`},{object:`传统修正`,question:`一个学派怎样在保持核心身份时放弃部分旧教义？`,start:`早期斯多葛主义的宇宙大火、占星和严格物质灵魂论并非伦理实践的每一部分都必需。`,steps:[`保留德性、自然和社会义务的核心`,`吸收柏拉图与亚里士多德的可用分析`,`降低争议物理学对伦理的负担`,`以罗马制度和日常责任检验理论可用性`],conclusion:`学派连续性可以依靠反复使用的问题结构和实践方法，而不是要求历代成员重复全部命题。`}],concepts:[{zh:`恰当行动`,en:`appropriate action / kathēkon`,definition:`在人的自然、关系和具体处境中能够给出合理说明的行动；它不等于只有完美贤者才能完成的完全德性行为。`},{zh:`角色伦理`,en:`role ethics / personae`,definition:`共同人性、个人禀赋、处境和自选生活道路共同限定行动；主要由西塞罗保存，具体归属需谨慎。`},{zh:`义务`,en:`duty / officium`,definition:`西塞罗以 officium 转译希腊伦理中的恰当行动，使其进入罗马公民、家庭和行政语言。`},{zh:`中期斯多葛主义`,en:`Middle Stoicism`,definition:`现代史学常用的阶段标签，指前 2—1 世纪斯多葛派对柏拉图主义、现实伦理与罗马文化的重新接合；其边界仍有争论。`}],lineage:{inherited:`继承早期斯多葛的德性、自然和社会性框架，同时与柏拉图学院和亚里士多德传统更积极对话。`,school:`中期斯多葛主义的转折人物：不是抛弃学派，而是降低部分宇宙论承诺，把伦理重心移向恰当行动和现实角色。`,influenced:`直接教导波塞多尼奥斯；其《论义务》经西塞罗改写，长期影响罗马伦理、基督教道德论和近代公共责任语言。`,parallel:`与亚里士多德实践智慧都强调行动要看角色和情境；但帕奈提奥斯仍保留斯多葛的共同理性、德性唯一善及宇宙共同体背景。`},comparisons:[{target:`克律西波斯`,relation:`承接前人`,shared:`德性、自然理性和人的社会性构成伦理基础。`,difference:`帕奈提奥斯弱化部分物理和占卜教义，更集中于非贤者的恰当行动与公共角色。`},{target:`西塞罗`,relation:`影响后继`,shared:`以义务、角色和共同人性组织公共伦理。`,difference:`西塞罗不是斯多葛派，并把希腊材料转译到罗马共和国政治和拉丁修辞中。`},{target:`波塞多尼奥斯`,relation:`影响后继`,shared:`扩大与柏拉图主义和其他学科的对话。`,difference:`波塞多尼奥斯重新加强宇宙论、灵魂论和科学研究，体系范围远大于现存帕奈提奥斯伦理证据。`}],russellView:`罗素用很短篇幅把帕奈提奥斯标为斯多葛主义的重要修改者：加入柏拉图主义成分、放弃物质主义，并通过与小西庇阿和西塞罗的关系使斯多葛主义为罗马所知。下一章又提到他赞赏罗马政体的混合结构。`,modernCorrection:`“放弃物质主义”可能把复杂变化说得过整齐；现存证据不足以重建完整体系。更可靠的学习定位是传播与重心转移：他使恰当行动、角色和公共义务成为斯多葛主义跨入罗马世界的高连接节点。`,sources:[O(`第一卷第二十八章〈斯多葛主义〉及第二十九章〈罗马帝国与文化的关系〉`),k,ce]},{id:`posidonius`,order:25,nameZh:`波塞多尼奥斯`,nameEn:`Posidonius of Apamea`,greekName:`Ποσειδώνιος`,dates:`约前 135—前 51`,active:`前 1 世纪前期`,places:[`阿帕米亚`,`雅典`,`罗得岛`,`西地中海`],school:`中期斯多葛主义`,figureId:`posidonius`,chapterIds:[`b1-28`],thesis:`人的情绪、城邦历史、海潮和星辰不是分散题目，而是同一个有机宇宙在不同尺度上的表现；哲学应以跨学科观察恢复部分与整体的联系。`,evidenceCaution:`大量著作仅存残片，且许多说法由盖伦、斯特拉波、西塞罗等各有目的的作者转述。旧研究曾把几乎所有后期斯多葛变化归给他，现代研究对此更谨慎。`,lifeSummary:`波塞多尼奥斯生于叙利亚阿帕米亚，在塞琉古世界衰落的背景下西行，赴雅典从学帕奈提奥斯，后定居罗得岛并主持学园。他旅行至西班牙、加的斯和高卢，观察海潮、气候与不同社会，同时写作天文、地理、历史、灵魂和伦理。西塞罗曾听其讲学，庞培也拜访过他。他是把希腊学派知识转接给罗马精英、又把斯多葛主义重新扩展为宇宙综合体系的关键人物。`,timeline:[{date:`约前 135`,place:`阿帕米亚（叙利亚）`,title:`出生于塞琉古世界晚期`,detail:`罗素以叙利亚政治失序解释其西行愿望，这是有启发性的历史联系，不是可直接证明的个人动机。`,certainty:`推定`},{date:`前 2 世纪末`,place:`雅典`,title:`从学帕奈提奥斯`,detail:`接受斯多葛训练，并发展与柏拉图、亚里士多德和毕达哥拉斯传统的广泛对话。`,certainty:`较可靠`},{date:`约前 100 前后`,place:`西地中海／大西洋沿岸`,title:`旅行与自然观察`,detail:`研究加的斯潮汐、天文距离、气候和民族习俗，把实地材料纳入宇宙与历史解释。`,certainty:`较可靠`},{date:`前 1 世纪前期`,place:`罗得岛`,title:`教学并连接罗马知识界`,detail:`西塞罗约前 78 年听讲，庞培两度来访；其著作成为罗马理解希腊哲学和科学的重要渠道。`,certainty:`较可靠`},{date:`约前 51`,place:`罗得岛`,title:`去世`,detail:`作品随后大量散失，只能由后世引用重构其跨学科体系。`,certainty:`推定`}],inquiries:[{object:`灵魂与激情`,question:`若激情只是错误判断，为什么明知不该仍会被欲望或愤怒牵引？`,start:`经验显示情绪具有速度、身体牵引和非理性动力，不能总被还原为一次冷静的错误推论。`,steps:[`保留理性同意在责任中的作用`,`承认灵魂中存在类似欲望与意气的非理性运动`,`借柏拉图分析内部冲突`,`以习惯、教育和身体条件解释情绪强度`],conclusion:`伦理治疗既要修正判断，也要训练非理性倾向；这不是简单放弃斯多葛主义，而是扩大其心理模型。`},{object:`宇宙关联与科学`,question:`局部观察怎样进入一个统一的自然体系？`,start:`潮汐、月相、气候、地理和社会习俗呈现跨尺度相关性，单一地点经验不足以解释。`,steps:[`通过旅行收集差异材料`,`以测量和数学寻找稳定关系`,`把地球现象嵌入天文周期`,`用宇宙整体的相互作用解释局部变化`],conclusion:`哲学不应只向内训练意志；自然观察、历史和地理同样帮助理解人所处的理性整体。`},{object:`灵魂命运与宇宙层级`,question:`人的灵魂怎样同时属于身体生活与更高宇宙秩序？`,start:`斯多葛的物质灵魂和柏拉图的灵魂升降提供两套不同资源。`,steps:[`保持宇宙由神性气息贯穿`,`吸收灵魂可在死后存续的层级想象`,`以灵魂纯净程度解释上升差异`,`把星辰、占星和宇宙同感连入同一图景`],conclusion:`波塞多尼奥斯形成较折衷的灵魂宇宙论；它连接中期斯多葛主义、新毕达哥拉斯主义和后来宗教思想，但证据高度间接。`}],concepts:[{zh:`宇宙同感`,en:`cosmic sympathy / sympatheia`,definition:`宇宙各部分因共同的神性气息和整体组织而相互关联；可支撑自然研究，也曾被用于占星与占卜。`},{zh:`非理性运动`,en:`non-rational movements`,definition:`灵魂中不能完全化约为理性判断的欲望和意气倾向；对其确切理论应避免仅据盖伦的批评性转述下结论。`},{zh:`跨尺度解释`,en:`cross-scale explanation`,definition:`把天文周期、海潮、气候、地理与人类生活放进一个相互作用的宇宙；是本站对其研究方法的压缩标签。`},{zh:`灵魂升降`,en:`ascent and descent of soul`,definition:`灵魂死后依其纯净程度在宇宙层级中上升或滞留的理论；罗素强调它吸收了柏拉图、俄耳甫斯和新毕达哥拉斯成分。`},{zh:`历史的自然条件`,en:`natural conditions of history`,definition:`用地理、气候、资源和社会性格的关联解释历史差异；不是现代决定论模型，却扩大了古代史学的解释范围。`}],lineage:{inherited:`直接继承帕奈提奥斯，又重新吸收柏拉图的灵魂论、毕达哥拉斯式宇宙关联，并延续斯多葛物理学与自然神学。`,school:`中期斯多葛主义的综合者：把学派从现实义务再扩展到心理学、历史、地理和天文学，形成希腊化知识的末期总汇。`,influenced:`西塞罗直接听讲并大量传播其思想；斯特拉波、塞涅卡等保存其科学材料，其灵魂和宇宙层级也为后来的宗教哲学提供过渡语汇。`,parallel:`与亚里士多德都跨越自然、灵魂、伦理和政治研究，但波塞多尼奥斯更强调宇宙同感，并处在罗马扩张形成的新地理视野中。`},comparisons:[{target:`帕奈提奥斯`,relation:`承接前人`,shared:`与柏拉图传统对话，并把斯多葛主义连接罗马世界。`,difference:`帕奈提奥斯偏重义务和角色；波塞多尼奥斯恢复宏大宇宙论并扩展实地科学研究。`},{target:`克律西波斯`,relation:`批评关系`,shared:`保留宇宙理性、命运和情绪治疗。`,difference:`波塞多尼奥斯更认真承认非理性心理运动，不把激情简单处理成单一错误判断。`},{target:`西塞罗`,relation:`影响后继`,shared:`把希腊哲学、政治伦理和罗马公共语言连接。`,difference:`波塞多尼奥斯仍建构斯多葛宇宙体系；西塞罗以学院派立场选择、翻译并比较诸学派。`},{target:`普罗提诺`,relation:`同题比较`,shared:`都以层级和整体关联处理灵魂与宇宙。`,difference:`波塞多尼奥斯仍重旅行、测量和物质宇宙；普罗提诺把最高真实置于超越感性的太一与精神。`}],russellView:`罗素对他的评价明显高于篇幅：不仅称其折衷哲学家，还详细写到叙利亚背景、西行旅行、潮汐研究、天文学和续写波利比乌斯。他特别强调其柏拉图化灵魂论、占星和死后上升，并认为这些成分可能为诺斯替主义铺路。`,modernCorrection:`罗素依赖早期二十世纪的“中期斯多葛主义”叙事，容易把他塑造成从严格斯多葛主义走向神秘主义的单线桥梁。现代重构更重视资料碎片性：他确有跨学科和折衷倾向，但具体理论不能只由后世影响倒推。`,sources:[O(`第一卷第二十八章〈斯多葛主义〉`),k,ce]},{id:`seneca`,order:26,nameZh:`塞涅卡`,nameEn:`Lucius Annaeus Seneca`,greekName:`Lucius Annaeus Seneca`,dates:`约前 4—公元 65`,active:`公元 41—65`,places:[`科尔多瓦`,`罗马`,`科西嘉`],school:`罗马斯多葛主义`,figureId:`seneca`,chapterIds:[`b1-28`,`b1-29`],thesis:`哲学不是在无风险处谈德性，而是在财富、愤怒、丧失、时间压力和权力妥协中反复检查判断；正因为实践会失败，日常操练才有必要。`,evidenceCaution:`著作保存较丰富，但政治生平主要来自塔西佗、苏埃托尼乌斯和卡西乌斯·狄奥，评价立场不同。高利贷引发不列颠起义等说法存在争议；不能只据道德轶事裁定其全部行为。`,lifeSummary:`塞涅卡生于西班牙科尔多瓦的罗马骑士家庭，在罗马受教育并进入元老院政治。公元 41 年被克劳狄乌斯流放科西嘉，49 年由小阿格里皮娜召回，成为尼禄教师，54 年后与布鲁斯共同参与帝国治理。随着尼禄统治恶化，他逐步退隐，65 年被命令自杀。其作品跨越书信、安慰文、自然研究、悲剧和政治劝诫，把斯多葛伦理置于最不纯粹的权力环境中。`,timeline:[{date:`约前 4`,place:`科尔多瓦`,title:`出生于罗马行省精英家庭`,detail:`幼年赴罗马，接受修辞与哲学教育；确切出生年在前 4 与公元 1 年等方案间有争议。`,certainty:`推定`},{date:`公元 41—49`,place:`科西嘉`,title:`被流放`,detail:`官方指控涉及通奸，背后也有宫廷政治；流放期写安慰作品，并在求归与哲学自持之间留下明显张力。`,certainty:`较可靠`},{date:`公元 49—54`,place:`罗马`,title:`召回并教育尼禄`,detail:`由小阿格里皮娜安排成为皇子教师，哲学家由私人写作者进入皇权核心。`,certainty:`较可靠`},{date:`公元 54—62`,place:`罗马`,title:`参与帝国治理`,detail:`在尼禄初期担任顾问并积累巨额财富；《论宽仁》尝试把君主自制变成政治原则。`,certainty:`较可靠`},{date:`公元 65`,place:`罗马近郊`,title:`被命令自杀`,detail:`卷入皮索阴谋后按皇命自尽；塔西佗的死亡叙事具有强烈文学塑造，但事件本身可靠。`,certainty:`较可靠`}],inquiries:[{object:`激情与愤怒`,question:`愤怒是维护正义的必要动力，还是失控判断？`,start:`受伤的最初震动可能不可避免，但“我受辱且必须报复”需要心灵继续认可。`,steps:[`区分最初身体反应与完整激情`,`识别夸大伤害和报复价值的判断`,`通过延迟、换位和预演削弱同意`,`以稳定的正义行动取代情绪爆发`],conclusion:`正义不需要愤怒作燃料；激情是加速并拒绝修正的判断，训练目标是恢复可审查的行动间隔。`},{object:`时间与死亡`,question:`人生短暂是自然事实，还是使用方式造成的体验？`,start:`人把时间交给名望、事务和他人期待，同时把真正生活推迟到不确定的未来。`,steps:[`把每日时间视为不可回收的所有物`,`预想死亡和丧失以校准价值`,`减少不能形成自主目的的忙碌`,`用回顾和写作检查一天的判断`],conclusion:`生命并非单纯太短，而是大量时间未被占有；死亡练习让当下行动获得边界，而非鼓励消极等死。`},{object:`权力、财富与一致性`,question:`拥有财富和政治权力的人还能否真诚主张外物无关善恶？`,start:`斯多葛主义允许选择健康、资源和职位，但不允许把它们当作德性的替代品。`,steps:[`区分善与可取的无差别物`,`检验获取和使用财富的方式`,`把政治权力限定为服务与克制`,`承认实践者处于进步而非完美贤者状态`],conclusion:`财富本身不能自动反驳斯多葛伦理，但行为与教诲间的差距仍是实质证据；哲学必须允许公共检验。`}],concepts:[{zh:`道德进步者`,en:`progressor / proficiens`,definition:`尚非贤者、但通过练习减少错误判断的人；它让伦理成为可持续过程，也防止用完美标准掩饰现实责任。`},{zh:`预演逆境`,en:`premeditation of adversity`,definition:`提前想象疾病、贫困、流放或死亡，检查自己是否把外物误判为绝对恶，并准备合宜行动。`},{zh:`每日省察`,en:`daily self-examination`,definition:`在一天结束时回顾愤怒、恐惧和选择；不是自我羞辱，而是把经验变成下一次判断的材料。`},{zh:`宽仁`,en:`clemency / clementia`,definition:`掌权者在有惩罚能力时依据理性节制惩罚；不同于软弱或任性赦免，是面向君主的政治自制。`},{zh:`时间占有`,en:`ownership of time`,definition:`把时间视为最易被他人和事务夺走、又无法补回的资源；哲学首先要求辨认时间流向。`},{zh:`可取的无差别物`,en:`preferred indifferent`,definition:`健康、财富等不是道德善，却通常有合理选择价值；这一层级使斯多葛伦理能够处理现实决策。`}],lineage:{inherited:`继承早期斯多葛的激情判断论、德性唯一善和自然共同体，也常引用伊壁鸠鲁，显示敌对学派之间可以共享有用的生活训练。`,school:`罗马帝国斯多葛主义的拉丁写作者；贡献不在重建全部逻辑物理体系，而在发展书信、安慰、政治劝诫和日常练习的哲学形式。`,influenced:`早期基督教作者曾把他视为近似同道，文艺复兴和新斯多葛主义广泛阅读其作品；现代公众也常由其书信进入斯多葛主义。`,parallel:`与马可·奥勒留都在权力中训练自制，但塞涅卡是顾问和文人，文本面向读者劝说；《沉思录》主要是皇帝写给自己的提醒。`},comparisons:[{target:`伊壁鸠鲁`,relation:`同题比较`,shared:`限制欲望、经营时间、预备死亡并追求心灵稳定。`,difference:`塞涅卡保留天意、德性唯一善和公共角色；伊壁鸠鲁以快乐、友谊和非天意自然学组织生活。`},{target:`爱比克泰德`,relation:`同题比较`,shared:`外物不能决定善恶，哲学必须通过每日练习改变判断。`,difference:`塞涅卡以书信和政治处境讨论渐进修养；爱比克泰德以课堂反诘集中分析意志和印象使用。`},{target:`马可·奥勒留`,relation:`后世重构`,shared:`把权力角色变成自我约束而非价值来源。`,difference:`塞涅卡与尼禄的妥协构成公开一致性问题；马可作为最高统治者面对战争、行政和角色疲劳。`}],russellView:`罗素以明显反讽写他的巨富、高息借贷、尼禄教师身份和临终表演，认为后世更多按优美教诲而非可疑实践评价他；同时承认塞涅卡与后继者传播了普遍人爱、自然法和斯多葛伦理。`,modernCorrection:`不应以圣徒化故事遮蔽政治责任，也不应因人格不一致便跳过其哲学。塞涅卡的独特价值恰在“进步者”视角、文本体裁和制度内妥协：它使理论能被行为证据反向检验。罗素关于不列颠放贷与起义的因果联系也需标为争议说法。`,sources:[O(`第一卷第二十八章〈斯多葛主义〉`),{label:`Stanford Encyclopedia · Seneca`,kind:`补充`,url:`https://plato.stanford.edu/entries/seneca/`},k]},{id:`epictetus`,order:27,nameZh:`爱比克泰德`,nameEn:`Epictetus`,greekName:`Ἐπίκτητος`,dates:`约公元 50—135`,active:`公元 1 世纪末—2 世纪初`,places:[`希拉波利斯`,`罗马`,`尼科波利斯`],school:`罗马斯多葛主义`,figureId:`epictetus`,chapterIds:[`b1-28`,`b1-29`],thesis:`事件、身体和名誉不完全由我决定，但如何使用印象、给予何种同意和选择怎样行动属于我的意志；自由是把欲望收回到这一能力范围。`,evidenceCaution:`本人没有留下可确认的著作；《论说集》和《手册》由学生阿里安记录、编辑，现存《论说集》仅四卷。奴隶时期因主人虐待致跛的故事无法确定，罗素采用的生卒年也已被现代研究修正。`,lifeSummary:`爱比克泰德出生于小亚细亚希拉波利斯，早年在罗马成为尼禄宫廷获释奴隶埃帕弗罗狄托斯的奴隶，并从斯多葛哲学家穆索尼乌斯·鲁弗斯学习。获释后从事教学；多米提安驱逐哲学家时，他迁往希腊西岸尼科波利斯建立学校。其课堂面向准备进入公共生活的青年，以尖锐问答反复训练欲望、行动和同意。学生阿里安保存的文本，使早期斯多葛的抽象结构变成最清晰的实践课程。`,timeline:[{date:`约公元 50`,place:`希拉波利斯`,title:`出生并在奴隶身份中成长`,detail:`出生年月、家庭与被带往罗马的过程不详；其名字本身意为“被获得者”。`,certainty:`推定`},{date:`公元 60—80 年代`,place:`罗马`,title:`从奴隶到哲学学生与教师`,detail:`隶属埃帕弗罗狄托斯并听穆索尼乌斯讲学；获释时间与腿疾原因均不能确定。`,certainty:`较可靠`},{date:`约公元 89—93`,place:`罗马／尼科波利斯`,title:`在驱逐哲学家的政策下迁居`,detail:`多米提安时期哲学家被逐，他转往伊庇鲁斯并长期办学。确切诏令年份有不同说法。`,certainty:`较可靠`},{date:`公元 2 世纪初`,place:`尼科波利斯`,title:`教学并由阿里安记录`,detail:`《论说集》保留课堂辩难，《手册》把核心训练压缩成便携纲要。`,certainty:`较可靠`},{date:`约公元 135`,place:`尼科波利斯`,title:`去世`,detail:`现代常用年代晚于罗素采用的约公元 100 年；晚年收养孩子等细节来自后世资料。`,certainty:`推定`}],inquiries:[{object:`控制与自由`,question:`奴役、疾病或暴政能夺走什么，又不能夺走什么？`,start:`身体、财产、名声和职位依赖他人及环境；判断、欲望和行动意向则以主体的理性使用为核心。`,steps:[`区分属于自己与不属于自己的事`,`停止要求外物必按愿望发生`,`把欲望集中于正确使用判断`,`在不可控结果中履行可控的行动责任`],conclusion:`自由不是控制世界，而是不把自身的善恶托付给世界；控制区分首先限制欲望，并不免除行动。`},{object:`印象与同意`,question:`遭遇发生到情绪和行动之间，哪里可以插入训练？`,start:`印象会自动出现，但“这是灾难”“我必须报复”是进一步的价值判断。`,steps:[`暂停并称其为一个印象`,`检查它涉及事实还是价值`,`用德性和角色标准审问`,`只对经检验的判断给予同意并行动`],conclusion:`哲学训练创造判断间隔；人不能阻止第一印象，却能逐步改变使用印象的习惯。`},{object:`角色与共同体`,question:`内在自由为什么不等于退出家庭、城邦和他人？`,start:`每个人既是理性主体，也是子女、父母、公民或朋友；角色提供具体行动材料。`,steps:[`由共同理性确认人是社会性存在`,`辨认当下关系所含责任`,`把结果与评价交还外部因果`,`以正义、自制和善意完成自己的部分`],conclusion:`只控制自己的判断并非只关心自己；恰当行动正是在无法控制他人的关系中保持人格一致。`}],concepts:[{zh:`控制二分`,en:`dichotomy of control`,definition:`有些事取决于我们，有些不取决于我们。现代口号容易过度简化；核心是区分意志活动与其外部材料和结果。`},{zh:`选择能力`,en:`volition / prohairesis`,definition:`评价印象、形成欲望并选择行动的理性能力，是人格与责任的中心，不等于脱离原因的任意意志。`},{zh:`印象的使用`,en:`use of impressions`,definition:`印象本身是材料，怎样解释、同意和转化为冲动决定其伦理意义。`},{zh:`三种训练`,en:`disciplines of desire, action, and assent`,definition:`约束欲望以接受发生之事，在关系中采取恰当行动，并检查印象真假；三者共同构成实践课程。`},{zh:`角色`,en:`role / prosōpon`,definition:`人在共同体中的具体位置与关系；扮演角色不等于迎合评价，而是用德性完成分配给自己的行动部分。`},{zh:`哲学操练`,en:`askēsis / practice`,definition:`通过课堂反诘、预演、提醒和实际选择把原则变成稳定习惯；仅能复述理论不算掌握哲学。`}],lineage:{inherited:`直接依赖芝诺、克里安西斯和克律西波斯，也受教师穆索尼乌斯影响；其尖锐问答和人格榜样尤其接近柏拉图笔下的苏格拉底与犬儒传统。`,school:`罗马帝国时期最具方法性的斯多葛教师，把早期逻辑—物理—伦理体系压缩为意志、印象和三种训练，但并未否认宇宙论背景。`,influenced:`学生阿里安保存其课程；马可·奥勒留明确阅读并吸收其教导，后世基督教、军事教育、心理治疗和现代斯多葛复兴均反复使用其控制区分。`,parallel:`现代认知行为治疗同样关注解释与情绪行为的关系，但不存在简单直线继承；临床方法、证据标准和治疗目标远比古代伦理训练具体。`},comparisons:[{target:`季蒂昂的芝诺`,relation:`承接前人`,shared:`外物不是善恶，同意与理性意志构成自由核心。`,difference:`芝诺建立完整学派结构；爱比克泰德以课堂语言把它集中为可重复的生活训练。`},{target:`塞涅卡`,relation:`同题比较`,shared:`以日常练习修正情绪、死亡恐惧和外物依赖。`,difference:`塞涅卡使用书信、文学与宫廷经验；爱比克泰德使用教师反诘和严格的意志范围分析。`},{target:`马可·奥勒留`,relation:`影响后继`,shared:`检查印象、接受自然、履行角色并保持内在统治。`,difference:`爱比克泰德是面向学生的教师；马可把同一结构变成皇帝在战争与行政中的私人提醒。`},{target:`皮浪`,relation:`同题比较`,shared:`都减少判断对心灵的扰动。`,difference:`皮浪传统对事物本性悬置断言；爱比克泰德确信德性、自然理性和正确同意可以成立。`}],russellView:`罗素用奴隶、跛足、被逐和尼科波利斯教学构造他与皇帝马可·奥勒留的社会反差，并大量引述其对暴君、死亡、兄弟关系和顺从神意的教导。罗素既赞赏其人格力量，也批评斯多葛伦理把外部伤害宣布为无关紧要。`,modernCorrection:`罗素给出的约公元 60—100 年已不是常用编年，现代多取约 50—135 年。控制二分也不应被读成“只管心态”：行动、关系与共同体义务属于意志正确使用的材料，只是成功结果不能作为德性的必要条件。`,sources:[O(`第一卷第二十八章〈斯多葛主义〉`),{label:`Stanford Encyclopedia · Epictetus`,kind:`补充`,url:`https://plato.stanford.edu/entries/epictetus/`},{label:`Internet Encyclopedia of Philosophy · Epictetus`,kind:`补充`,url:`https://iep.utm.edu/epictetu/`}]},{id:`aurelius`,order:28,nameZh:`马可·奥勒留`,nameEn:`Marcus Aurelius`,greekName:`Marcus Aurelius Antoninus`,dates:`公元 121—180`,active:`公元 161—180 在位`,places:[`罗马`,`多瑙河边境`,`安条克`,`文多博纳／西尔米乌姆`],school:`罗马斯多葛主义`,figureId:`aurelius`,chapterIds:[`b1-28`,`b1-29`],thesis:`皇帝不能保证战争、瘟疫和他人服从，却必须管理自己的统治能力：把印象还原为事实、把角色转化为义务，并让每个行动服务于理性共同体。`,evidenceCaution:`《沉思录》是写给自己的练习笔记，不是完整体系或公开自传；写作时间与地点只能大致推定。其统治也必须结合法律、战争和基督徒受迫害等复杂史实，不能仅由私人伦理文字评价。`,lifeSummary:`马可生于罗马元老院家庭，少年受到哈德良关注，公元 138 年被安敦尼·毕尤收养，161 年继位并与卢基乌斯·维鲁斯共同执政。其统治长期面对东方战争、安敦尼瘟疫、多瑙河冲突和将领叛乱。《沉思录》多写于军营和行政压力中，记录他如何借爱比克泰德等斯多葛资源抵抗愤怒、虚荣和角色疲劳。它呈现的不是已经平静的圣人，而是需要不断重做判断的最高统治者。`,timeline:[{date:`公元 121`,place:`罗马`,title:`出生于元老院家庭`,detail:`早年接受拉丁修辞、希腊哲学与法律教育；《沉思录》第一卷以感谢教师和亲友保存其自我理解。`,certainty:`较可靠`},{date:`公元 138`,place:`罗马`,title:`被安敦尼·毕尤收养`,detail:`哈德良的继承安排使他成为未来皇帝，并在长期储君阶段学习行政。`,certainty:`较可靠`},{date:`公元 161`,place:`罗马`,title:`继位并实行共同统治`,detail:`与卢基乌斯·维鲁斯共同执政；随后面对帕提亚战争及军队带回的严重瘟疫。`,certainty:`较可靠`},{date:`约公元 170 年代`,place:`多瑙河边境`,title:`战争中写作《沉思录》`,detail:`部分卷标有“在夸迪人地区”等地点，显示私人练习与前线统治同时进行。`,certainty:`较可靠`},{date:`公元 180`,place:`多瑙河前线`,title:`病逝并由康茂德继位`,detail:`具体死亡地点在文多博纳与西尔米乌姆之间有争议；世袭继承也成为后世评价其政治判断的焦点。`,certainty:`较可靠`}],inquiries:[{object:`表象与事实`,question:`怎样阻止侮辱、痛苦和失败立即占据心灵？`,start:`事件首先以描述进入经验，随后才被附加“不可忍受”“对我有害”等价值判断。`,steps:[`暂停自动评价`,`把印象还原为颜色、声音、运动或身体变化`,`询问它是否损害理性与正义能力`,`选择与角色和共同善一致的回应`],conclusion:`去除附加判断不是否认事实，而是防止事件越权决定人格；真正伤害是让自身的统治能力变坏。`},{object:`角色义务与公共善`,question:`若德性只属于个人意志，为何皇帝还必须管理粮食、战争和法律？`,start:`人是理性且社会性的部分，角色所面对的外物虽非道德善，却是正义行动的材料。`,steps:[`把自己定位为共同体的一部分`,`由皇帝角色识别具体责任`,`尽力改善外部结果但不把结果等同德性`,`用共同善而非赞誉衡量行动意向`],conclusion:`内在自由不取消行政责任；正因为结果不可保证，行动原则和持续履责才成为可评价部分。`},{object:`宇宙视角与死亡`,question:`权力、名声和痛苦为何显得巨大，怎样恢复比例？`,start:`局部当下会遮蔽时间尺度和整体自然，使个人事件被误认为宇宙中心。`,steps:[`从高处想象城市、帝国与众生`,`把当下放入生成毁灭的长时段`,`记住施害者和受害者都将死亡`,`返回此刻可以完成的正义行动`],conclusion:`宇宙视角压缩虚荣和怨恨，但最终必须落回具体义务，否则只会成为疏离现实的心理技巧。`}],concepts:[{zh:`统治能力`,en:`ruling faculty / hēgemonikon`,definition:`组织印象、同意和行动的心灵中心；皇帝对帝国的统治被反转为首先治理自身判断。`},{zh:`去除判断`,en:`stripping impressions`,definition:`把奢侈、痛苦或侮辱还原为不带夸张价值的事实成分，以暴露欲望和厌恶添加的语言。`},{zh:`从高处观看`,en:`view from above`,definition:`在空间和时间大尺度上观看个人、城市和帝国，降低名望与怨恨的虚假重量。`},{zh:`世界城邦`,en:`cosmopolis`,definition:`所有理性存在者共享自然法的共同体；具体政治共同体是其中部分，正义不能只服务本城利益。`},{zh:`社会行动`,en:`social action`,definition:`人的自然功能是与他人合作；障碍可以改变行动路径，却不必破坏服务共同善的目的。`},{zh:`保留条件`,en:`reserve clause`,definition:`采取行动时附带“若无自然或义务阻碍”的条件，使坚定努力与接受不可控结果可以并存。`}],lineage:{inherited:`经教师鲁斯提库斯等人接触爱比克泰德，并阅读早期斯多葛作者；也选择性引用赫拉克利特、柏拉图、悲剧诗人甚至伊壁鸠鲁。`,school:`罗马斯多葛主义的实践见证者，而非另建学派的理论家；《沉思录》显示原则如何在最高权力、疾病、战争和家庭压力中被反复调用。`,influenced:`《沉思录》在近代成为最广泛阅读的斯多葛文本之一，影响伦理自省、领导观和现代斯多葛复兴；其政治形象也常被理想化使用。`,parallel:`与孔子传统都把角色修养和公共秩序相连，但自然法、宇宙论、礼与政治制度的理论结构不同；相似不能当作历史影响。`},comparisons:[{target:`爱比克泰德`,relation:`承接前人`,shared:`正确使用印象、把自由置于意志、以角色完成恰当行动。`,difference:`爱比克泰德在课堂中教方法；马可记录方法在皇权和前线决策中的反复应用。`},{target:`塞涅卡`,relation:`同题比较`,shared:`权力必须由自制、死亡练习和共同人性约束。`,difference:`塞涅卡面向他人写劝诫并处于顾问位置；马可主要写私人备忘且拥有最终行政权。`},{target:`伊壁鸠鲁`,relation:`同题比较`,shared:`都削弱死亡、名声和无穷欲望对生活的控制。`,difference:`马可强调天意整体、角色义务和公共服务；伊壁鸠鲁以非天意自然学和朋友共同体保护宁静。`},{target:`康德`,relation:`后世重构`,shared:`道德价值集中于行动原则和善意志，不以成功结果决定。`,difference:`康德以普遍法则和自主理性立论；马可把义务嵌入目的性宇宙、社会本性和具体角色。`}],russellView:`罗素先以瘟疫、地震、战争和叛乱说明其统治压力，再把《沉思录》读成一个疲惫而自律的人劝自己履责。他赞赏其人格，却借皇帝必须保障粮运和边防指出斯多葛悖论：若外物全无价值，公共责任为何仍重要？`,modernCorrection:`《沉思录》不是消极悲观的理论论文，而是重复使用既有教义的私人训练册；重复恰好说明实践尚未完成。罗素提出的公共善难题真实存在，但斯多葛派可借“外物非善却可取”及社会角色回答一部分。评价本人还需把文本理想与帝国政策分开。`,sources:[O(`第一卷第二十八章〈斯多葛主义〉及第二十九章〈罗马帝国与文化的关系〉`),{label:`Stanford Encyclopedia · Marcus Aurelius`,kind:`补充`,url:`https://plato.stanford.edu/entries/marcus-aurelius/`},k]},{id:`plotinus`,order:29,nameZh:`普罗提诺`,nameEn:`Plotinus`,greekName:`Πλωτῖνος`,dates:`公元 204/205—270`,active:`公元 244—270`,places:[`埃及`,`亚历山大里亚`,`美索不达米亚`,`罗马`,`坎帕尼亚`],school:`新柏拉图主义`,figureId:`plotinus`,chapterIds:[`b1-30`],thesis:`多样事物若要成为统一的存在，必须依赖更高层的统一：万物由太一经精神与灵魂层层产生，人的回归不是迁往别处，而是转向自身最深处的理智根源。`,evidenceCaution:`生平主要来自学生波菲利所写《普罗提诺传》，其中混有神迹和学派塑造。他自认是柏拉图的解释者，“新柏拉图主义”是近代史学标签；流溢、三位一体等常用概括也不能与基督教教义直接等同。`,lifeSummary:`普罗提诺生于埃及，在亚历山大里亚跟随阿摩尼阿斯·萨卡斯学习约十一年。公元 243 年加入戈尔迪安三世东方远征，希望接触波斯和印度智慧；皇帝遇刺后转往罗马，244 年起讲学二十余年，并与皇帝加里恩努斯及罗马精英保持联系。约 253 年开始写作，学生波菲利后来把五十四篇论文编为六组九篇的《九章集》。他生活在三世纪帝国危机中，却以超时间的层级宇宙回应现实崩坏，既终结古希腊体系哲学，也为基督教时代提供形而上语言。`,timeline:[{date:`公元 204/205`,place:`埃及`,title:`出生`,detail:`具体出生地不明；波菲利说他不愿谈论身体出身，后世关于吕科波利斯的定位不能完全确定。`,certainty:`推定`},{date:`约公元 232—243`,place:`亚历山大里亚`,title:`随阿摩尼阿斯学习`,detail:`二十八岁开始系统求师，最终跟随阿摩尼阿斯约十一年；教师本人几乎没有可靠著作资料。`,certainty:`较可靠`},{date:`公元 243—244`,place:`美索不达米亚`,title:`参加戈尔迪安三世远征`,detail:`传统说他希望了解波斯和印度哲学；皇帝被杀后逃至安条克，计划中止。`,certainty:`较可靠`},{date:`公元 244—253`,place:`罗马`,title:`建立教学圈`,detail:`公开讲课并吸引政治精英、妇女和青年；曾设想在坎帕尼亚建立按柏拉图法律生活的“柏拉图城”。`,certainty:`较可靠`},{date:`约公元 253—263`,place:`罗马`,title:`开始写作并遇到波菲利`,detail:`先讲授后写作，论文回应课堂中的具体问题；波菲利公元 263 年加入并成为编辑者。`,certainty:`较可靠`},{date:`公元 270`,place:`坎帕尼亚`,title:`去世，作品后来编为《九章集》`,detail:`波菲利在其死后按主题而非写作顺序编排五十四篇论文，塑造了后世所见的体系次序。`,certainty:`较可靠`}],inquiries:[{object:`太一与多样性`,question:`一切存在都有统一性，那么统一本身能否仍是众多属性的组合？`,start:`任何复杂存在都由部分或性质组成，需要某种原则把它维持为一个东西。`,steps:[`从复合物需要统一条件出发`,`把统一条件继续追溯，避免最高原则仍依赖组成`,`排除对最高原则的普通谓词和存在分类`,`以否定和类比接近绝对简单的太一`],conclusion:`太一超越存在和思想，不是所有事物的总和，也不是具有多个属性的人格对象；语言只能说明它不是什么及万物为何依赖它。`},{object:`产生与层级`,question:`绝对简单且不缺少任何东西的太一，为什么会有多样世界？`,start:`完善的活动具有内在自足，也会产生不削弱来源的外向活动，如太阳发光而不减少。`,steps:[`太一的丰盈产生精神`,`精神转向太一并同时思考理念与自身`,`精神的活动产生世界灵魂与个别灵魂`,`灵魂面向精神时秩序自然，面向外部时形成感性世界`],conclusion:`产生不是时间中的创造事件，也不是太一作计划；各层因接近统一程度不同而具有递减的实在与统一。`},{object:`感性世界与恶`,question:`较低世界是否因此是邪恶创造者制造的牢狱？`,start:`感性世界变化、分散且含痛苦，却又表现比例、生命和可识别的美。`,steps:[`把自然理解为灵魂对精神秩序的外在表达`,`承认复制品低于可知原型`,`把恶解释为善、形式和统一的缺乏`,`反对诺斯替派贬低宇宙和天体`],conclusion:`世界不是与善对立的独立恶实体，而是感性条件下尽可能好的形象；向上转向不要求仇恨可见美。`},{object:`灵魂回归与合一`,question:`个别灵魂怎样由分散生活返回其根源？`,start:`灵魂并未完全切断与精神的联系，只是在身体欲望和外部对象中忘记自己的较高活动。`,steps:[`由德性净化冲动与依附`,`从感性美追溯使其成形的可知美`,`在内省中让思想转向精神`,`最终超越主体—对象区分，与太一发生不可言说的接触`],conclusion:`最高体验不是论证的替代，而是论证和生活净化所指向、却无法被命题完全表达的统一；经验后才能回到语言反思。`}],concepts:[{zh:`太一`,en:`the One`,definition:`超越存在、思想和一切复合的最高原则；不是数目一或万物集合，而是任何事物能够成为统一者的终极根据。`},{zh:`精神`,en:`Intellect / Nous`,definition:`由太一产生、同时包含思者与所思理念的可知整体；其内部有差异，却保持透明统一。`},{zh:`灵魂`,en:`Soul / psychē`,definition:`连接可知与感性层级的生命原则；世界灵魂赋予宇宙秩序，个别灵魂既能向上沉思，也能面向身体活动。`},{zh:`本体层级`,en:`hypostases`,definition:`太一、精神、灵魂三种根本实在的现代常用总称；它们不是平等的三位，也不是彼此分离的空间区域。`},{zh:`流溢`,en:`procession / emanation`,definition:`较低层由较高层的充盈活动产生而不耗损来源；不是在某个时刻发生的自愿制造。`},{zh:`回归`,en:`return / epistrophē`,definition:`所产生者转向其来源而获得形式和完善；在人身上表现为由感性分散回到精神与太一。`},{zh:`恶是缺失`,en:`evil as privation`,definition:`恶没有与善对等的独立实体性，而是形式、秩序和善的极端缺乏；这一结构后来深刻影响奥古斯丁。`},{zh:`合一`,en:`union / henōsis`,definition:`灵魂超越主客区分与太一接触的最高经验；不能用普通知识命题完整描述，也不意味着个体被简单物理消灭。`}],lineage:{inherited:`自认解释柏拉图，集中发展理念、灵魂、不成文的最高原则和《蒂迈欧篇》宇宙；也吸收亚里士多德精神论、巴门尼德存在论及中期柏拉图主义。`,school:`后来所谓新柏拉图主义的奠基人物。他并不认为自己开创新学派，而是通过系统解释使柏拉图传统在晚期古代获得新的层级结构。`,influenced:`波菲利编辑并传播《九章集》；经奥古斯丁、伪狄奥尼修斯及阿拉伯—拉丁传统，太一、内在上升和恶之缺失进入基督教、伊斯兰和犹太哲学。`,parallel:`与诺斯替主义同样在帝国危机中寻求超越世界，却对感性宇宙作相反评价：普罗提诺认为它是可知美的必要且尽可能完善的形象。`},comparisons:[{target:`柏拉图`,relation:`承接前人`,shared:`理念、灵魂上升、善超越普通知识及感性美的引导作用。`,difference:`普罗提诺把分散于不同对话的线索组织成太一—精神—灵魂的连续层级，并弱化政治与数学兴趣。`},{target:`亚里士多德`,relation:`后世重构`,shared:`精神的自我思考、现实性和形式秩序。`,difference:`普罗提诺把精神置于太一之下并包含全部理念；亚里士多德第一推动者及灵魂—身体关系的结构不同。`},{target:`诺斯替主义`,relation:`批评关系`,shared:`都区分较高神性层级与受苦的感性处境。`,difference:`诺斯替派常把宇宙归于低劣或恶的创造者；普罗提诺坚持宇宙之美、天体神性与灵魂的秩序性创造。`},{target:`斯多葛主义`,relation:`批评关系`,shared:`宇宙是有秩序的整体，伦理要求改变欲望并与更大秩序协调。`,difference:`斯多葛把神性理性内在于物质宇宙；普罗提诺把自然置于灵魂以下，并以非物质精神与太一为最高真实。`},{target:`奥古斯丁`,relation:`后世重构`,shared:`由外在转向内在、非物质实在和恶作为善的缺失。`,difference:`奥古斯丁把这些结构置入创造、人格神、恩典和基督教救赎史，不能把他视为简单改名的普罗提诺。`}],russellView:`罗素把普罗提诺称为古代最后一位伟大哲学家，先以三世纪战争、瘟疫与财政崩坏解释为何思想转向永恒世界，再赞赏其体系之美、灵魂—身体分析和人格高贵。他同时批评这种哲学鼓励向内而非向外看，削弱科学好奇和改善制度的动力。`,modernCorrection:`罗素的“时代绝望→逃向彼岸”非常有记忆力，却不能穷尽其课堂研究、公共关系和对感性美的肯定。“新柏拉图主义”是后设标签；普罗提诺也并非简单憎恨身体或现实世界。他对基督教影响深远，但主要经翻译、编辑和神学重构发生。`,sources:[O(`第一卷第三十章〈普罗提诺〉`),{label:`Stanford Encyclopedia · Plotinus`,kind:`补充`,url:`https://plato.stanford.edu/entries/plotinus/`},{label:`Internet Encyclopedia of Philosophy · Plotinus`,kind:`补充`,url:`https://iep.utm.edu/plotinus/`}]}],A=e=>({label:`罗素《西方哲学史》${e}`,kind:`原书`,url:`https://www.russell-j.com/cool/HWP_1945.pdf`}),j=(e,t)=>({label:`Stanford Encyclopedia · ${e}`,kind:`补充`,url:`https://plato.stanford.edu/entries/${t}/`}),ue=[{id:`philo-alexandria`,order:30,nameZh:`亚历山大的斐洛`,nameEn:`Philo of Alexandria`,greekName:`Φίλων ὁ Ἀλεξανδρεύς`,dates:`约前 20—约 50`,active:`公元 1 世纪前半叶`,places:[`亚历山大里亚`,`罗马`],school:`希腊化犹太哲学`,figureId:`philo-alexandria`,chapterIds:[`b2-01`],thesis:`用寓意解释把《摩西五经》与柏拉图主义、斯多葛主义相接：超越的上帝通过逻各斯与诸能力同可理解世界发生关系。`,evidenceCaution:`斐洛有大量希腊文著作传世，思想证据相对充足；生平却主要只由其作品与约瑟夫斯重建，年代和私人经历多为推定。`,lifeSummary:`斐洛出身亚历山大里亚富裕犹太家庭，既接受希腊教育，也把犹太经文视为最高权威。约 38—41 年，他参加赴罗马使团，向卡利古拉申诉亚历山大里亚犹太人的处境。他不是后来意义的基督教思想家，却为‘经文怎样与希腊哲学共存’提供了影响深远的解释模型。`,timeline:[{date:`约前 20`,place:`亚历山大里亚`,title:`出生`,detail:`出生年代由其公元 40 年左右自称年长者反推。`,certainty:`推定`},{date:`约 38—41`,place:`罗马`,title:`参加申诉使团`,detail:`代表亚历山大里亚犹太社群面见卡利古拉，后在《致盖乌斯使团》中记述事件。`,certainty:`较可靠`},{date:`1 世纪中叶`,place:`亚历山大里亚`,title:`完成主要释经著作`,detail:`以希腊文写作经文注释、哲学论文和历史记述。`,certainty:`较可靠`}],inquiries:[{object:`经文与哲学`,question:`摩西经文与希腊哲学看似冲突时，如何同时保存启示权威与理性解释？`,start:`经文用人格化叙事谈论上帝，哲学却要求不变、非物质的第一原则。`,steps:[`区分经文字面层与寓意层`,`把人物和事件解释为灵魂能力与德性过程`,`以逻各斯说明超越者与世界之间的中介`,`将希腊哲学视为对摩西智慧的部分发现`],conclusion:`经文的哲学意义可通过寓意解释显现；上帝保持超越，而逻各斯、理念和能力说明创造与认识。`}],concepts:[{zh:`逻各斯`,en:`Logos`,definition:`上帝的理性、话语与创造范型；斐洛的用法并不总是一致，不能简单等同于后来基督教的第二位格。`},{zh:`寓意解释`,en:`allegorical interpretation`,definition:`在不取消字面叙事的前提下，把经文人物与事件读作灵魂、德性和宇宙结构。`},{zh:`神圣能力`,en:`divine powers`,definition:`上帝作用于世界的可理解方式，如创造与治理；用于维护神的超越性。`}],lineage:{inherited:`继承犹太经文传统，也吸收柏拉图的可知范型、斯多葛的逻各斯和希腊寓意释经。`,school:`希腊化犹太哲学的代表，在一神经文与希腊形而上学之间建立系统接口。`,influenced:`其语言和释经方法进入奥利金、教父传统与中世纪负神学，但具体传递路径并非处处可证。`,parallel:`与新约《约翰福音》都使用逻各斯语言，但二者关系与直接影响仍有争论。`},comparisons:[{target:`柏拉图`,relation:`承接前人`,shared:`可理解范型高于感官世界。`,difference:`斐洛把范型置入独一上帝的创造活动，并以摩西经文统摄哲学。`},{target:`奥利金`,relation:`影响后继`,shared:`用希腊哲学和寓意解释阅读经文。`,difference:`奥利金在基督论、三位一体与救赎框架中重新组织这套方法。`},{target:`迈蒙尼德`,relation:`同题比较`,shared:`都调和犹太启示与哲学理性，并警惕把上帝人格化。`,difference:`斐洛以中期柏拉图主义为主；迈蒙尼德主要面对亚里士多德主义与伊斯兰哲学。`}],stars:3,culturalNotes:[{kind:`生活印象`,title:`一位真正参加过政治使团的哲学解释者`,text:`斐洛并非只在书斋里调和传统。他曾作为犹太代表赴罗马申诉，使其关于共同体、律法与帝国的思考带有直接政治经验。`}],russellView:`罗素把斐洛称为希腊思想影响犹太人的最佳例证，着重介绍他对创世、逻各斯和柏拉图理念的调和，并把他置于基督教神学形成的前史。`,modernCorrection:`斐洛不是把两套现成体系机械拼合；现代研究更重视他的犹太身份、释经实践和著作体裁差异。‘逻各斯’在不同文本中承担多种功能，不宜压成单一教义。`,sources:[A(`第二卷第一章〈犹太人的宗教发展〉`),j(`Philo of Alexandria`,`philo`)]},{id:`origen`,order:31,nameZh:`奥利金`,nameEn:`Origen of Alexandria`,greekName:`Ὠριγένης`,dates:`约 185—约 253`,active:`3 世纪前半叶`,places:[`亚历山大里亚`,`凯撒利亚`,`罗马`],school:`亚历山大里亚教父哲学`,figureId:`origen`,chapterIds:[`b2-02`],thesis:`基督教信仰需要系统的理性阐释：经文具有多层意义，受造理性灵魂凭自由转向或远离上帝，整个宇宙史因此成为教育与复归过程。`,evidenceCaution:`著作数量巨大但大量只存拉丁译本，且译者有时为避争议而改写；后世定罪也使‘奥利金本人’与‘奥利金主义’必须区分。`,lifeSummary:`奥利金成长于亚历山大里亚的基督教家庭，父亲在迫害中殉道。他从教学、文本校勘和释经出发，后来迁居凯撒利亚建立教学与藏书中心。《论首要原理》是早期基督教最雄心勃勃的系统神学之一，《驳塞尔苏斯》则正面回应异教哲学批评。`,timeline:[{date:`约 202`,place:`亚历山大里亚`,title:`父亲殉道`,detail:`塞普蒂米乌斯·塞维鲁时期迫害塑造了其禁欲与护教生活。`,certainty:`较可靠`},{date:`约 230 年代`,place:`凯撒利亚`,title:`迁居并任教`,detail:`与亚历山大主教冲突后在凯撒利亚讲学、释经并受任圣职。`,certainty:`较可靠`},{date:`约 249—253`,place:`凯撒利亚／推罗`,title:`受迫害与去世`,detail:`德西乌斯迫害中受刑，数年后去世；具体地点和年份略有分歧。`,certainty:`较可靠`}],inquiries:[{object:`启示的理性结构`,question:`经文中的矛盾、拟人叙事与哲学难题，能否被理解为同一救赎秩序？`,start:`若上帝良善而理性，经文与宇宙就不应只是任意命令和字面冲突。`,steps:[`区分经文的身体、灵魂与精神意义`,`以自由意志解释理性受造物的差异`,`把物质世界理解为教育与医治场域`,`在基督—逻各斯中说明知识与复归`],conclusion:`哲学推理可以服务于信仰，但必须接受经文和教会规则约束；救赎是理性受造物重新面向上帝的过程。`}],concepts:[{zh:`三重经义`,en:`threefold sense of scripture`,definition:`经文具有身体、灵魂、精神层次；困难文本会迫使读者越过字面寻找更深意义。`},{zh:`自由意志`,en:`free choice`,definition:`灵魂差异不是上帝偏私造成，而源于受造理性者的不同选择；这是神义论与教育宇宙论的支点。`},{zh:`复归`,en:`restoration / apokatastasis`,definition:`受造秩序最终复归上帝的强烈希望；是否意味着所有理性存在必然得救，文本与解释传统都有争议。`}],lineage:{inherited:`承接斐洛式寓意释经、柏拉图主义灵魂论与早期教会的信仰规则。`,school:`亚历山大里亚基督教哲学，把释经、形而上学、自由意志和护教组织成体系。`,influenced:`影响卡帕多西亚教父、拉丁教父和中世纪释经，也因后世奥利金主义争论而被选择性接受。`,parallel:`与普罗提诺同处三世纪柏拉图主义环境，却在创造、人格自由、基督与复活上走向不同体系。`},comparisons:[{target:`亚历山大的斐洛`,relation:`承接前人`,shared:`以寓意解释连接经文与希腊哲学。`,difference:`奥利金把方法置于基督教的基督论、教会与救赎史中。`},{target:`普罗提诺`,relation:`同题比较`,shared:`灵魂下降、多层实在与向最高者复归。`,difference:`奥利金坚持创造、自由受造物和基督事件；普罗提诺以流溢和观照解释秩序。`},{target:`奥古斯丁`,relation:`影响后继`,shared:`借柏拉图主义处理基督教的恶、灵魂和解释问题。`,difference:`奥古斯丁对原罪、恩典与历史共同体的强调更强，也不接受奥利金的一些宇宙论推测。`}],stars:4,culturalNotes:[{kind:`轶事`,title:`把一生变成注释工程`,text:`古代传记把奥利金写成几乎不停口授、校勘和讲课的人。《六文本合参》把多种希伯来经文与希腊译本并排列出，是早期文本批判的惊人项目。`,caveat:`关于其极端禁欲行为的著名传说来源较晚，现代学者并不一致采信。`}],russellView:`罗素把奥利金视为早期教会中最重要、最有哲学头脑的人物之一，强调他借希腊哲学形成系统神学，也指出其灵魂先存和普遍复归等观点后来被判为异端。`,modernCorrection:`不能只用后世定罪倒推奥利金。他的许多大胆命题是探索性假设，且传世拉丁译本可能被修订；现代研究也更强调其经文校勘、讲道与教会实践。`,sources:[A(`第二卷第二章〈基督教最初的四个世纪〉`),j(`Origen`,`origen`)]},{id:`ambrose`,order:32,nameZh:`米兰的安布罗斯`,nameEn:`Ambrose of Milan`,greekName:`Aurelius Ambrosius`,dates:`约 339—397`,active:`374—397`,places:[`特里尔`,`米兰`],school:`拉丁教父／教会政治思想`,figureId:`ambrose`,chapterIds:[`b2-03`],thesis:`皇帝属于教会而非凌驾于教会；主教可以用礼仪纪律和道德权威限制基督教皇权。`,evidenceCaution:`书信、讲道和同代记载较丰富，但著名冲突常由安布罗斯一方叙述；其意义主要是教会—国家关系与拉丁神学，不应误写成完整形而上学体系。`,lifeSummary:`安布罗斯原是罗马帝国官员，尚未受洗便在米兰主教选举冲突中被拥立，随即受洗、受任。他与皇后尤斯蒂娜及皇帝狄奥多西的冲突，让主教权威第一次以高度戏剧化方式约束宫廷；他的讲道也促成奥古斯丁重新理解基督教经文。`,timeline:[{date:`374`,place:`米兰`,title:`由总督成为主教`,detail:`介入教派冲突时被群众推举，短期内完成受洗与受任。`,certainty:`较可靠`},{date:`386`,place:`米兰`,title:`抵抗宫廷索取教堂`,detail:`拒绝把教堂交给阿里乌派宫廷使用，以群众礼拜维护主教管辖。`,certainty:`较可靠`},{date:`390`,place:`米兰`,title:`要求狄奥多西悔罪`,detail:`帖撒罗尼迦屠杀后拒绝照常举行圣礼，事件细节仍需结合书信谨慎重建。`,certainty:`较可靠`}],inquiries:[{object:`教会与皇权`,question:`信奉基督教的皇帝犯下公共罪行时，谁能对他作道德审判？`,start:`皇帝掌握法律与军队，但圣礼与教会纪律不应成为宫廷工具。`,steps:[`区分政治统治与圣礼管辖`,`主张皇帝作为信徒也受教会纪律约束`,`用拒绝共融迫使权力回应公共罪责`],conclusion:`皇帝在教会之内，不在教会之上；政治权力不能自动取得宗教与道德上的无责地位。`}],concepts:[{zh:`教会自主`,en:`ecclesial autonomy`,definition:`圣所、教义与圣礼纪律不由皇帝随意处分。`},{zh:`主教劝诫`,en:`episcopal admonition`,definition:`主教以公共教导和圣礼纪律纠正统治者，而非直接取代行政权。`},{zh:`皇帝在教会内`,en:`the emperor within the Church`,definition:`基督教皇帝仍是受规范的信徒；这一公式深刻影响西方政教权力想象。`}],lineage:{inherited:`继承尼西亚正统、罗马公共职位经验和西塞罗式德性语言。`,school:`拉丁教父传统中的教会政治思想家与讲道者。`,influenced:`影响奥古斯丁的皈依与释经，也为中世纪教皇和主教限制世俗权力提供经典先例。`,parallel:`与大格列高利都把主教职位塑造成公共治理角色，但安布罗斯面对仍强大的晚期罗马皇权。`},comparisons:[{target:`奥古斯丁`,relation:`影响后继`,shared:`拉丁基督教、寓意释经与公共教会。`,difference:`安布罗斯主要以讲道和主教行动示范权威；奥古斯丁把意志、恩典与历史写成更完整理论。`},{target:`大格列高利`,relation:`影响后继`,shared:`主教承担教义、礼仪与公共治理责任。`,difference:`格列高利在西罗马帝国崩解后更直接承担行政与救济。`},{target:`帕多瓦的马西略`,relation:`同题比较`,shared:`都处理宗教权威与政治权力的边界。`,difference:`安布罗斯以主教纪律约束皇帝；马西略反对教皇强制权并把政治立法权归于公民共同体。`}],stars:2,culturalNotes:[{kind:`轶事`,title:`让皇帝站到忏悔者的位置`,text:`安布罗斯要求狄奥多西为帖撒罗尼迦屠杀公开悔罪，成为西方历史中宗教权威约束君主最常被讲述的场景之一。`,caveat:`后世艺术常把事件画成主教在教堂门口挡驾，实际过程可能主要通过书信与礼仪协商完成。`}],russellView:`罗素把安布罗斯视为三位教会博士中最具政治重要性者，认为他所确立的教会独立与主教约束皇帝原则具有革命性。`,modernCorrection:`这一关系不是现代意义的政教分离。安布罗斯既需要帝国支持正统，也以教会权威介入公共事务；‘教会胜过国家’不足以概括复杂互动。`,sources:[A(`第二卷第三章〈三位教会博士〉`),{label:`Britannica · Saint Ambrose`,kind:`补充`,url:`https://www.britannica.com/biography/Saint-Ambrose`}]},{id:`jerome`,order:33,nameZh:`哲罗姆`,nameEn:`Jerome`,greekName:`Eusebius Sophronius Hieronymus`,dates:`约 347—420`,active:`4 世纪末至 5 世纪初`,places:[`斯特里顿`,`罗马`,`伯利恒`],school:`拉丁教父／经文翻译`,figureId:`jerome`,chapterIds:[`b2-03`],thesis:`拉丁基督教必须尽可能回到经文语言与文本差异本身；翻译、语言学习和禁欲生活共同构成解释权威。`,evidenceCaution:`书信与著作很多，但其论战文风强烈、对手形象常被夸张。武加大译本也不是一人一次完成的统一文本，后世修订层累复杂。`,lifeSummary:`哲罗姆受过古典修辞教育，先在罗马从事教会工作，后定居伯利恒主持修院和翻译。他学习希伯来语，以希伯来文本重译旧约，并修订拉丁福音书。其工作塑造了西方教会千余年的圣经语言，也制造了‘古典文学是否妨碍基督徒生活’的持续张力。`,timeline:[{date:`约 382—385`,place:`罗马`,title:`为达玛苏教皇工作`,detail:`修订福音书拉丁文本，并参与罗马禁欲社群。`,certainty:`较可靠`},{date:`386`,place:`伯利恒`,title:`定居修院`,detail:`在保拉资助下建立修院、旅舍与学习中心。`,certainty:`较可靠`},{date:`约 390—405`,place:`伯利恒`,title:`由希伯来文翻译旧约`,detail:`逐步形成后来武加大传统的核心部分。`,certainty:`较可靠`}],inquiries:[{object:`翻译与权威`,question:`当希腊、希伯来和旧拉丁文本不一致时，基督徒应以什么校正文义？`,start:`教会通行译本彼此有差异，字面错误会改变解释与争论。`,steps:[`比较多种语言文本`,`把希伯来文本视为旧约的重要校准依据`,`保留教会用语同时重译难句`,`以注释解释译法和历史语境`],conclusion:`翻译不是透明抄写，而是需要语言学、文本批判与共同体判断的解释工作。`}],concepts:[{zh:`希伯来真本`,en:`Hebraica veritas`,definition:`用希伯来文本校准旧约拉丁译文的原则，并不意味着哲罗姆拥有现代文本批判方法。`},{zh:`武加大译本`,en:`Vulgate`,definition:`以哲罗姆翻译和修订为核心、后世逐步定型的拉丁圣经传统。`},{zh:`禁欲学术`,en:`ascetic scholarship`,definition:`把语言学习、抄写、注释和修院纪律视为同一种基督徒实践。`}],lineage:{inherited:`继承古典语文学、奥利金的经文校勘传统与东方修道生活。`,school:`拉丁教父中的翻译家、注释家和禁欲论战者。`,influenced:`武加大成为西欧神学、礼仪和文学的基础文本；其修院学术理想也长期延续。`,parallel:`与罗杰·培根都强调原文语言对知识纠错的重要性，但所处学术制度和目标不同。`},comparisons:[{target:`奥利金`,relation:`承接前人`,shared:`以多语文本比较与注释处理经文。`,difference:`哲罗姆一面依赖奥利金，一面又在奥利金主义争论中与其遗产保持距离。`},{target:`奥古斯丁`,relation:`同题比较`,shared:`都维护拉丁教会的经文解释与禁欲伦理。`,difference:`哲罗姆优先语言和文本；奥古斯丁更强调符号、爱与教会阅读规则，并曾质疑重译造成的礼仪冲突。`},{target:`罗杰·培根`,relation:`影响后继`,shared:`错误翻译会系统性损害知识。`,difference:`培根把语言改革扩展到大学哲学、科学与传教计划。`}],stars:2,culturalNotes:[{kind:`轶事`,title:`书房里的狮子`,text:`西方艺术常把哲罗姆画成在书房工作的老人，脚边伏着一头狮子；狮子拔刺报恩的故事强化了他既严厉又隐居的公共形象。`,caveat:`这个故事原本属于另一位圣人，后来才移植到哲罗姆传说。`}],russellView:`罗素认为哲罗姆的历史重要性主要在武加大译本和修道运动，而不是原创哲学；他也用哲罗姆对古典文学的矛盾态度呈现基督教与古代文化的张力。`,modernCorrection:`‘武加大是哲罗姆独自完成的一本书’是过度简化。不同卷的翻译来源和修订历史不同；他的希伯来文能力很重要，但仍受当时犹太教师和希腊传统帮助。`,sources:[A(`第二卷第三章〈三位教会博士〉`),{label:`Britannica · St. Jerome`,kind:`补充`,url:`https://www.britannica.com/biography/Saint-Jerome`}]},{id:`augustine`,order:34,nameZh:`奥古斯丁`,nameEn:`Augustine of Hippo`,greekName:`Aurelius Augustinus`,dates:`354—430`,active:`386—430`,places:[`塔加斯特`,`迦太基`,`米兰`,`希波`],school:`拉丁教父／基督教柏拉图主义`,figureId:`augustine`,chapterIds:[`b2-03`,`b2-04`],thesis:`确定性从正在怀疑和记忆的内在主体展开；恶不是实体而是善的缺失，人的意志却因错误之爱受缚，必须在恩典和历史共同体中重新定向。`,evidenceCaution:`著作与书信极丰富，但《忏悔录》是神学自传而非中性履历；其思想跨五十年变化明显，不能把晚期恩典论无差别投射到早期作品。`,lifeSummary:`奥古斯丁出生于北非，经历摩尼教、怀疑主义和新柏拉图主义，386 年在米兰皈依，后成为希波主教。他在罗马帝国西部危机中处理个人意志、时间、记忆、恶、恩典、教会与政治秩序，成为拉丁中世纪最强大的共同语言之一。`,timeline:[{date:`354`,place:`塔加斯特`,title:`出生`,detail:`成长于拉丁化北非家庭，母亲莫妮卡是基督徒。`,certainty:`较可靠`},{date:`386—387`,place:`米兰`,title:`皈依并受洗`,detail:`在安布罗斯讲道、新柏拉图著作和个人危机共同作用下改变生活。`,certainty:`较可靠`},{date:`395/396`,place:`希波`,title:`成为主教`,detail:`此后参与多纳徒派、伯拉纠派等长期争论。`,certainty:`较可靠`},{date:`430`,place:`希波`,title:`围城中去世`,detail:`汪达尔人围攻希波期间去世。`,certainty:`较可靠`}],inquiries:[{object:`时间与意识`,question:`过去已不在、未来尚未来，时间怎样仍能被测量？`,start:`日常说长短时间，却无法把过去未来当作现成物体观察。`,steps:[`把过去定位为现在的记忆`,`把未来定位为现在的期待`,`把当下过程定位为注意`,`用心灵的延展解释时间经验`],conclusion:`被测量的是心灵中记忆、注意与期待的延展；时间问题由宇宙对象转入意识结构。`},{object:`恶与意志`,question:`若上帝全善且创造万物，恶从哪里来？`,start:`把恶当作独立实体会限制上帝，把一切归给上帝又似乎取消责任。`,steps:[`把存在本身理解为善`,`将恶解释为秩序和善的缺失`,`追踪意志由较高善转向较低善`,`以恩典说明受缚意志的医治`],conclusion:`恶没有独立本体，却通过意志失序产生真实损害；自由、习惯、原罪和恩典构成张力。`}],concepts:[{zh:`内在确定性`,en:`inner certainty`,definition:`即使受骗或怀疑，正在思考、生活和记忆的主体仍不能同时被取消。`},{zh:`恶是善的缺失`,en:`privation of good`,definition:`恶不是与善对等的实体，而是受造物应有秩序、形式或善的败坏。`},{zh:`爱的秩序`,en:`order of love`,definition:`伦理的核心不是有没有爱，而是爱什么、以何种次序爱；失序之爱形成支配欲。`},{zh:`两个城`,en:`two cities`,definition:`由两种爱组织的历史共同体：爱上帝至忘我，与爱自己至蔑视上帝；不等同于可见教会和国家。`}],lineage:{inherited:`承接保罗、安布罗斯与新柏拉图主义，并把古典修辞和怀疑论问题带入基督教。`,school:`拉丁基督教哲学的核心人物，连接古代内在性、教父神学和中世纪争论。`,influenced:`决定安瑟伦、波那文图拉、宗教改革乃至近代内在性讨论的基本问题表。`,parallel:`与阿奎那都系统处理信仰与理性，但奥古斯丁更从内在照明、意志和历史经验展开。`},comparisons:[{target:`普罗提诺`,relation:`承接前人`,shared:`由内在上升至非物质实在，并把恶理解为缺失。`,difference:`奥古斯丁坚持创造、人格上帝、历史启示和意志责任，拒绝把救赎化约为纯粹观照。`},{target:`坎特伯雷的安瑟伦`,relation:`影响后继`,shared:`信仰寻求理解，理性在信仰内部工作。`,difference:`安瑟伦以更紧缩的必然性论证重写上帝存在与救赎问题。`},{target:`托马斯·阿奎那`,relation:`影响后继`,shared:`基督教创造论、恶的缺失和恩典伦理。`,difference:`阿奎那以亚里士多德的形式—质料、能力—实现和自然目的论重构体系。`}],stars:5,culturalNotes:[{kind:`名言`,title:`“给我贞洁和节制——但不要现在”`,text:`《忏悔录》用这句自嘲概括意志分裂：人可能清楚知道何为更好的生活，却仍希望改变再晚一点发生。`}],russellView:`罗素把奥古斯丁视为柏拉图与十三世纪之间最伟大的基督教哲学家，尤其重视其时间理论、历史哲学与教会政治影响，同时严厉批评其原罪、预定和宗教强制观。`,modernCorrection:`罗素常以自由主义尺度压缩奥古斯丁的牧灵、释经和论战语境。现代研究强调其思想阶段差异，也提醒‘两个城’不是教会与国家的简单二分。`,sources:[A(`第二卷第三至四章〈三位教会博士〉／〈圣奥古斯丁的哲学与神学〉`),j(`Saint Augustine`,`augustine`)]},{id:`boethius`,order:35,nameZh:`波爱修斯`,nameEn:`Boethius`,greekName:`Anicius Manlius Severinus Boethius`,dates:`约 477—524`,active:`6 世纪初`,places:[`罗马`,`拉文纳`,`帕维亚`],school:`晚期古代拉丁哲学`,figureId:`boethius`,chapterIds:[`b2-05`],thesis:`幸福不能依赖命运可夺走的外物；天意在永恒当下中认识一切，而受造者仍按自身方式自由行动。`,evidenceCaution:`著作和公职记录较可靠，但监禁、审判与死亡细节来自立场不同的材料。《哲学的慰藉》刻意少用基督教语言，不足以证明作者放弃信仰。`,lifeSummary:`波爱修斯出身罗马元老贵族，在东哥特王狄奥多里克统治下任高官。他计划把柏拉图、亚里士多德的作品与解释传统译成拉丁文，虽未完成，却把逻辑、音乐与数论术语送入中世纪。因政治指控入狱后，他写成哲学对话体《哲学的慰藉》。`,timeline:[{date:`约 510`,place:`罗马／拉文纳`,title:`出任执政官`,detail:`进入东哥特王国最高行政层，同时持续翻译和注释。`,certainty:`较可靠`},{date:`522`,place:`拉文纳`,title:`两个儿子同任执政官`,detail:`家族政治地位达到高峰。`,certainty:`较可靠`},{date:`523—524`,place:`帕维亚附近`,title:`监禁、写作与处决`,detail:`被控叛国和魔法等罪名；审判是否公正长期有争议。`,certainty:`较可靠`}],inquiries:[{object:`先知与自由`,question:`若上帝无误地知道未来，人还可能不那样行动吗？`,start:`无误知识似乎把未来变成必然事实。`,steps:[`区分事物自身的单纯必然与条件必然`,`区分时间中的预见与永恒中的同时观看`,`让知识方式取决于认识者而非对象被强迫`,`保留行动由理性主体产生的自愿性`],conclusion:`上帝不是提前猜中未来，而在永恒当下认识时间全体；被认识不等于被知识强迫。`}],concepts:[{zh:`命运之轮`,en:`wheel of Fortune`,definition:`外在地位、财富和权力不断翻转；把幸福系于轮缘就必然不稳。`},{zh:`永恒`,en:`eternity`,definition:`对无限生命的完整、同时占有，不只是持续无限长时间。`},{zh:`共相问题`,en:`problem of universals`,definition:`其波菲利导论译注把种属究竟独立存在、存在于事物或只在思想中的问题传给拉丁中世纪。`}],lineage:{inherited:`继承柏拉图主义、亚里士多德逻辑和晚期古代自由技艺教育。`,school:`晚期古代向拉丁中世纪的关键中介，兼具哲学翻译、逻辑和基督教神学。`,influenced:`其逻辑教材和《慰藉》长期成为中世纪学校核心文本，并启动共相与先知自由争论。`,parallel:`与奥古斯丁都从时间与永恒处理神知，但波爱修斯用更技术化的模态区分。`},comparisons:[{target:`亚里士多德`,relation:`承接前人`,shared:`逻辑范畴、命题与论证是哲学教育基础。`,difference:`波爱修斯通过翻译注释把部分亚里士多德转入拉丁基督教世界。`},{target:`彼得·阿伯拉尔`,relation:`影响后继`,shared:`共相、语言与逻辑推理问题。`,difference:`阿伯拉尔在十二世纪扩展语义与辩证法，拥有更丰富的拉丁逻辑材料。`},{target:`奥卡姆的威廉`,relation:`影响后继`,shared:`逻辑语言和共相问题。`,difference:`奥卡姆把唯名论与心灵语言理论推进到远超波爱修斯导论的问题规模。`}],stars:4,culturalNotes:[{kind:`生活印象`,title:`牢房里由“哲学女士”来访`,text:`《哲学的慰藉》开篇让一位威严的哲学女士赶走诗歌缪斯，与被判死刑的作者对话。抽象论证因此具有戏剧和自我治疗的形式。`}],russellView:`罗素把波爱修斯称为从古代世界通向中世纪的桥梁，认为《慰藉》的柏拉图气质和翻译事业使他在之后数百年拥有异常大的影响。`,modernCorrection:`把波爱修斯简单称为‘最后的罗马人’会遮蔽东哥特意大利的文化连续性；《慰藉》不点名基督并不等于其神学著作不真或临终改宗。`,sources:[A(`第二卷第五章〈第五和第六世纪〉`),j(`Anicius Manlius Severinus Boethius`,`boethius`)]},{id:`benedict`,order:36,nameZh:`努西亚的本尼狄克`,nameEn:`Benedict of Nursia`,greekName:`Benedictus Nursiae`,dates:`约 480—约 547`,active:`6 世纪前半叶`,places:[`努西亚`,`苏比亚科`,`卡西诺山`],school:`西方修道制度`,figureId:`benedict`,chapterIds:[`b2-06`],thesis:`稳定共同生活以节制、服从、祈祷、阅读和劳动组织日常，使德性不依赖英雄式瞬间，而由可持续制度养成。`,evidenceCaution:`唯一连续生平主要来自大格列高利约半世纪后写的圣人传，奇迹很多；《圣本尼狄克规程》文本可靠，但作者生平与早期传播仍有争论。`,lifeSummary:`本尼狄克不是以论证著称的哲学家，而是通过一部短规程塑造生活形式。他先在苏比亚科隐修，后在卡西诺山建立团体。《规程》以院长、共同财产、固定作息、诵读、接待与劳动，把晚期古代禁欲理想转为可复制制度。`,timeline:[{date:`约 500`,place:`苏比亚科`,title:`隐修与形成团体`,detail:`具体故事主要见于大格列高利《对话录》，年代为推定。`,certainty:`传统记载`},{date:`约 529`,place:`卡西诺山`,title:`建立修院`,detail:`传统纪年广泛采用，但没有同期文件可精确确认。`,certainty:`传统记载`},{date:`6 世纪中叶`,place:`卡西诺山`,title:`形成《规程》`,detail:`文本吸收更早《师傅规程》等传统，后来逐渐成为西欧修院标准。`,certainty:`较可靠`}],inquiries:[{object:`共同生活`,question:`普通人怎样在长年共同生活中持续训练欲望，而不是依赖少数极端苦行者？`,start:`孤独苦行可能过度，松散团体又容易受财产、权力和情绪破坏。`,steps:[`要求稳定居所和共同规程`,`让院长权威受规程、咨询与责任约束`,`以固定祈祷和阅读划分时间`,`根据年龄、健康和季节调节劳动与饮食`],conclusion:`德性成为日复一日的制度实践；克制并非最大痛苦，而是可持续、共同且有尺度的生活。`}],concepts:[{zh:`稳定`,en:`stabilitas`,definition:`承诺留在具体共同体，不以不断迁徙逃避关系和纪律。`},{zh:`服从`,en:`obedientia`,definition:`通过倾听规程、院长与共同体训练自我意志，同时要求权威对灵魂负责。`},{zh:`有尺度的规程`,en:`discretio`,definition:`规程按体力与处境调节要求，避免把极端苦行当作普遍标准。`}],lineage:{inherited:`继承埃及、叙利亚与高卢修道传统以及《师傅规程》。`,school:`西方共同修道制度的代表，影响主要通过生活规则而非抽象体系。`,influenced:`数世纪后在加洛林改革中成为西欧主导规程，保存阅读、抄写和教育制度。`,parallel:`与斯多葛生活训练都用日常操练重塑欲望，但本尼狄克以礼仪共同体、服从和恩典为中心。`},comparisons:[{target:`哲罗姆`,relation:`承接前人`,shared:`禁欲生活、阅读与共同体纪律。`,difference:`哲罗姆以翻译和论战著称；本尼狄克把修道经验压缩为可复制规程。`},{target:`大格列高利`,relation:`影响后继`,shared:`修道生活与教会治理相互支持。`,difference:`格列高利通过传记、教皇行政和传教把本尼狄克形象推向整个西欧。`},{target:`爱比克泰德`,relation:`同题比较`,shared:`自由需要持续训练欲望、判断和行为。`,difference:`本尼狄克把训练放入共同礼仪与服从；爱比克泰德以个体理性角色和可控判断为核心。`}],stars:2,culturalNotes:[{kind:`生活印象`,title:`“祈祷与工作”背后的规程生活`,text:`人们常用“祈祷并工作”概括本笃会生活。准确地说，这句口号成形较晚，但确实抓住规程把礼仪、阅读、手工劳动和接待客人织成一天的方式。`,caveat:`这句拉丁口号并非《圣本尼狄克规程》原句。`}],russellView:`罗素重视本尼狄克并非因为原创哲学，而因其规程把修道运动变成稳定制度，在战争和行政崩解中保存了纪律、学习与跨地区组织。`,modernCorrection:`‘修道院独自保存文明’过于浪漫化，也忽略拜占庭、伊斯兰世界、城市与家庭网络。规程在本尼狄克死后数百年才取得西欧主导地位。`,sources:[A(`第二卷第六章〈圣本尼狄克与大格列高利〉`),{label:`Britannica · St. Benedict`,kind:`补充`,url:`https://www.britannica.com/biography/Saint-Benedict-of-Nursia`}]},{id:`gregory-great`,order:37,nameZh:`大格列高利`,nameEn:`Gregory the Great`,greekName:`Gregorius Magnus`,dates:`约 540—604`,active:`590—604`,places:[`罗马`,`君士坦丁堡`],school:`拉丁教父／教牧政治`,figureId:`gregory-great`,chapterIds:[`b2-06`],thesis:`治理的正当性表现为照料灵魂与脆弱者的负担；理想领导者必须在默观与行动、谦卑与纠正之间维持张力。`,evidenceCaution:`书信和著作保存丰富，行政行动也可考；但《对话录》奇迹叙事的作者、体裁与史实价值长期有争论。`,lifeSummary:`格列高利出身罗马元老家庭，做过城市长官，后把家宅改为修院。590 年成为教皇时，罗马面临伦巴第战争、饥荒和帝国行政衰弱。他谈判、救济、管理地产、改革教牧并派遣奥古斯丁赴英格兰，其思想主要体现为‘如何承担一个无法退出的公共职位’。`,timeline:[{date:`约 573`,place:`罗马`,title:`任罗马城市长官`,detail:`显示其受过行政与法律训练，具体任期材料有限。`,certainty:`较可靠`},{date:`590`,place:`罗马`,title:`成为教皇`,detail:`在瘟疫、战争和救济压力中接任。`,certainty:`较可靠`},{date:`597`,place:`罗马—肯特`,title:`派遣英格兰传教团`,detail:`坎特伯雷的奥古斯丁率团抵达肯特。`,certainty:`较可靠`}],inquiries:[{object:`治理与灵魂`,question:`公共领导怎样避免变成权力欲，又不以追求纯洁为由逃避责任？`,start:`默观生活有吸引力，危机中的共同体却需要行政、纠正和照料。`,steps:[`把职位理解为重担而非荣耀`,`要求牧者先检查自身动机`,`按不同性格与处境调整劝诫`,`让行动返回默观，让默观承担邻人需要`],conclusion:`真正的治理是‘牧灵照管’：权威越大，对具体人的责任越重，也越需要自我怀疑和谦卑。`}],concepts:[{zh:`牧灵规则`,en:`pastoral rule`,definition:`按人的处境施教、纠正和照顾的治理艺术，也是中世纪主教与君主反复阅读的领导手册。`},{zh:`众仆之仆`,en:`servant of the servants of God`,definition:`教皇自称，表达权威作为服务的规范；现实政治并不因此失去权力竞争。`},{zh:`行动与默观`,en:`active and contemplative lives`,definition:`领导者不能把二者割裂：默观校正行动动机，行动回应邻人需要。`}],lineage:{inherited:`继承奥古斯丁神学、本尼狄克式修道纪律和罗马行政经验。`,school:`晚期拉丁教父与早期中世纪教皇治理传统。`,influenced:`《牧灵规则》影响中世纪教士教育，传教和行政行动重塑西欧教会网络。`,parallel:`与安布罗斯都以主教权威处理公共危机，但格列高利面对帝国治理缺席更为严重的罗马。`},comparisons:[{target:`努西亚的本尼狄克`,relation:`承接前人`,shared:`纪律、谦卑与共同体生活塑造治理者。`,difference:`格列高利把修道训练带入教皇行政，并以传记塑造本尼狄克的后世形象。`},{target:`奥古斯丁`,relation:`承接前人`,shared:`恩典、欲望秩序和基督教历史共同体。`,difference:`格列高利少做系统形而上学，更关心讲道、灵魂分类和危机治理。`},{target:`米兰的安布罗斯`,relation:`同题比较`,shared:`教会领袖必须对公共权力和城市生活负责。`,difference:`安布罗斯主要限制强皇权；格列高利常在弱行政环境中补位。`}],stars:2,culturalNotes:[{kind:`轶事`,title:`“不是盎格鲁人，而是天使”`,text:`传说格列高利在罗马市场见到来自英格兰的浅发奴隶，以 Angli 与 angeli 的双关引出传教愿望。`,caveat:`故事见于较晚的比德，适合当作传教记忆，不是可核实现场记录。`}],russellView:`罗素把大格列高利写成古罗马与中世纪教皇制之间的关键人物：有行政能力、修道热情和迷信气质，其现实成就比抽象哲学更重要。`,modernCorrection:`罗素‘文明衰落／轻信奇迹’的框架容易低估格列高利书信网络、经济治理和适应性政治。奇迹文本也应按牧灵和文学体裁分析，而不只当作理性退步。`,sources:[A(`第二卷第六章〈圣本尼狄克与大格列高利〉`),{label:`Britannica · St. Gregory the Great`,kind:`补充`,url:`https://www.britannica.com/biography/St-Gregory-the-Great`}]},{id:`eriugena`,order:38,nameZh:`约翰·司各脱·爱留根纳`,nameEn:`John Scottus Eriugena`,greekName:`Iohannes Scottus Eriugena`,dates:`约 800—约 877`,active:`9 世纪中叶`,places:[`爱尔兰`,`西法兰克宫廷`],school:`加洛林新柏拉图主义`,figureId:`eriugena`,chapterIds:[`b2-08`],thesis:`自然包括一切存在与非存在，并可按创造与被创造的关系分为四类；万物由上帝显现、通过理性层级展开，并最终复归不可说的源头。`,evidenceCaution:`著作保存良好但生平极少；后来在英格兰被学生杀死等故事不可靠。其‘泛神论’标签也可能混淆神显论与上帝—世界同一。`,lifeSummary:`爱留根纳可能来自爱尔兰，因罕见的希腊文能力进入秃头查理宫廷。他翻译伪狄奥尼修、忏悔者马克西穆斯等希腊神学，写成对话体《论自然的区分》。这使拉丁西欧重新接上东方基督教的新柏拉图传统。`,timeline:[{date:`约 850`,place:`西法兰克宫廷`,title:`参与预定论争`,detail:`《论神圣预定》因强调理性与恶的非存在引发争议。`,certainty:`较可靠`},{date:`约 860 年代`,place:`宫廷学术圈`,title:`翻译希腊教父`,detail:`翻译伪狄奥尼修等作品，为拉丁世界建立术语。`,certainty:`较可靠`},{date:`约 862—866`,place:`西法兰克`,title:`写作《论自然的区分》`,detail:`以师生对话组织创造、认识与复归。`,certainty:`推定`}],inquiries:[{object:`自然与神显`,question:`超越一切范畴的上帝，怎样既不可说又在万物中显现？`,start:`若上帝是一种最高的‘东西’，便仍落入受造范畴；若完全不可知，创造又无法显示神。`,steps:[`把自然定义为存在与非存在的一切`,`区分创造而不受造、受造且创造、受造不创造、不创造也不受造`,`把理念与万物理解为神显`,`让分析过程返回超越一切断言的上帝`],conclusion:`创造是上帝的显现而非对外部材料加工；理性可追踪显现，却必须以否定神学承认源头超越存在。`}],concepts:[{zh:`自然四分`,en:`four divisions of nature`,definition:`按创造／受造关系组织上帝、理念、具体世界与终极复归的辩证结构。`},{zh:`神显`,en:`theophany`,definition:`受造物是不可见上帝以有限方式呈现自身，不意味着每个有限物就是神的全部。`},{zh:`否定神学`,en:`negative theology`,definition:`上帝超越‘善、存在、智慧’等范畴；肯定之后必须以否定和超越修正。`}],lineage:{inherited:`承接奥古斯丁，也通过翻译吸收伪狄奥尼修和希腊教父新柏拉图主义。`,school:`加洛林宫廷哲学中最具系统性的基督教新柏拉图主义。`,influenced:`影响十二世纪自然哲学、神秘主义和德意志思想，著作也因涉嫌泛神论而多次受禁。`,parallel:`与普罗提诺都描述由一到多再复归，但爱留根纳用创造、经文和三位一体重写结构。`},comparisons:[{target:`普罗提诺`,relation:`后世重构`,shared:`实在由最高统一者展开并向源头复归。`,difference:`爱留根纳经由基督教希腊作者接受新柏拉图主义，并坚持创造与基督教启示语言。`},{target:`奥古斯丁`,relation:`承接前人`,shared:`理性从受造秩序和内在心灵上升至上帝。`,difference:`爱留根纳的自然四分与希腊否定神学更大胆地模糊存在和非存在边界。`},{target:`坎特伯雷的安瑟伦`,relation:`影响后继`,shared:`理性并非信仰的敌人，而在信仰内部追求理解。`,difference:`安瑟伦偏向紧缩论证；爱留根纳构造百科式宇宙复归体系。`}],stars:3,culturalNotes:[{kind:`轶事`,title:`“桌子把爱尔兰人与醉汉分开”`,text:`一则宫廷双关故事说，国王问‘醉汉与爱尔兰人相隔什么’，爱留根纳答‘一张桌子’。它塑造了机敏、敢于顶撞宫廷的学者形象。`,caveat:`故事来源较晚，不能当作逐字实录。`}],russellView:`罗素把爱留根纳视为黑暗时代少见的原创哲学家，赞赏其希腊学养和体系勇气，并把《论自然》概括为带有泛神论危险的新柏拉图主义。`,modernCorrection:`‘泛神论者’标签过于粗糙。其神显语言同时坚持上帝超越存在；现代研究也更重视其翻译活动、语义分析和加洛林争论语境。`,sources:[A(`第二卷第八章〈约翰·司各脱〉`),j(`John Scottus Eriugena`,`scottus-eriugena`)]},{id:`anselm`,order:43,nameZh:`坎特伯雷的安瑟伦`,nameEn:`Anselm of Canterbury`,greekName:`Anselmus Cantuariensis`,dates:`1033/34—1109`,active:`11 世纪末至 12 世纪初`,places:[`奥斯塔`,`贝克修道院`,`坎特伯雷`],school:`早期经院哲学／奥古斯丁主义`,figureId:`anselm`,chapterIds:[`b2-11`],thesis:`信仰寻求理解；从‘无法设想有比它更伟大者’这一概念出发，理性试图说明上帝不能只存在于思想中。`,evidenceCaution:`著作、书信和同时代传记丰富；但所谓‘本体论证明’是后世命名，《独白》《宣讲》中的论证与祈祷语境不可割裂。`,lifeSummary:`安瑟伦离开奥斯塔后进入诺曼底贝克修道院，在教育与默想中写成《独白》和《宣讲》。1093 年出任坎特伯雷大主教，因授职权和教会财产与两任英王冲突、两度流亡。他把严密推理、祈祷和教会政治责任结合在一生中。`,timeline:[{date:`1060`,place:`贝克修道院`,title:`入院`,detail:`师从兰弗朗克，后来成为院长。`,certainty:`较可靠`},{date:`1070 年代`,place:`贝克`,title:`写作《独白》《宣讲》`,detail:`探索不单依靠经文权威的理性论证。`,certainty:`较可靠`},{date:`1093—1109`,place:`坎特伯雷／流亡地`,title:`大主教与王权冲突`,detail:`围绕授职、效忠与教会自主多次谈判。`,certainty:`较可靠`}],inquiries:[{object:`上帝存在`,question:`理解‘无法设想有比它更伟大者’是否已经要求它不只存在于思想？`,start:`即使否认者也能理解这个表达，概念因而存在于心中。`,steps:[`设定不可设想更伟大者`,`区分只在理解中与也在现实中存在`,`指出现实存在似乎比仅在思想中更伟大`,`推出该对象若只在思想中便可设想更伟大者，形成矛盾`],conclusion:`上帝不能只作为概念存在；但论证是否偷渡存在谓词、定义能否保证实例，成为持续千年的争论。`}],concepts:[{zh:`信仰寻求理解`,en:`faith seeking understanding`,definition:`理性不是先悬置信仰再中立证明，而是信者希望理解已相信内容的内在必然性。`},{zh:`本体论论证`,en:`ontological argument`,definition:`由上帝概念及其不可超越性推向现实存在的一类先验论证，名称由后世赋予。`},{zh:`合宜与必然`,en:`fittingness and necessity`,definition:`安瑟伦在救赎论中追问道成肉身为何不仅合宜，而且在给定神圣目的下具有理由上的必然。`}],lineage:{inherited:`继承奥古斯丁的内在上升、神圣真理与信仰理解关系，也吸收修院辩证训练。`,school:`早期经院哲学与修院神学之间的枢纽。`,influenced:`本体论论证经笛卡尔、莱布尼茨到现代模态版本不断重构；其救赎论也深刻影响拉丁神学。`,parallel:`与阿奎那都论证上帝存在，但安瑟伦从概念必然性展开，阿奎那坚持从可经验的因果和变化出发。`},comparisons:[{target:`奥古斯丁`,relation:`承接前人`,shared:`由信仰进入理性理解，并从心灵中的真理上升。`,difference:`安瑟伦把论证压缩为更明确的概念反证结构。`},{target:`托马斯·阿奎那`,relation:`影响后继`,shared:`理性能够讨论上帝存在与属性。`,difference:`阿奎那拒绝人能直接掌握上帝本质的定义，改用从效果到原因的五路。`},{target:`罗瑟林`,relation:`批评关系`,shared:`都在逻辑语言与三位一体之间寻找可论证表达。`,difference:`安瑟伦认为罗瑟林的唯名论会把三位一体拆成三个实体，专文反驳。`}],stars:4,culturalNotes:[{kind:`例子`,title:`一座“无法想象更伟大”的岛？`,text:`同代修士高尼罗用完美海岛反驳：仅从概念似乎不能让对象出现。安瑟伦回答，上帝这种必然、不可超越对象不同于任何偶然岛屿。`}],russellView:`罗素高度重视本体论证明的历史生命力：即使他本人不接受，也承认它从安瑟伦经笛卡尔、莱布尼茨和黑格尔反复出现，是哲学史上少见的纯粹论证发明。`,modernCorrection:`把论证只写成四行形式逻辑会失去《宣讲》的祈祷、理解与‘必然存在’语境。高尼罗、阿奎那和康德的反驳也针对不同版本，不能合并成一次终结。`,sources:[A(`第二卷第十一章〈十二世纪〉`),j(`Saint Anselm`,`anselm`)]},{id:`roscelin`,order:44,nameZh:`罗瑟林`,nameEn:`Roscelin of Compiègne`,greekName:`Roscelinus Compendiensis`,dates:`约 1050—约 1125`,active:`11 世纪末`,places:[`贡比涅`,`苏瓦松`,`洛什`],school:`早期唯名论`,figureId:`roscelin`,chapterIds:[`b2-11`],thesis:`共相并非独立事物，而与语词或声音密切相关；这一语义立场进入三位一体时，会立刻产生‘共同名称是否对应共同实体’的神学风险。`,evidenceCaution:`几乎没有可确认的哲学作品传世，其观点主要由安瑟伦、阿伯拉尔等对手转述。‘共相只是气息之声’的著名公式未必是其原话。`,lifeSummary:`罗瑟林是法国教士和逻辑教师，因三位一体解释在 1092 年苏瓦松会议受谴责。他的重要性不在保存完整体系，而在共相问题第一次与语言、个体和神学正统发生高强度碰撞；对手的反驳反而保存了他的历史位置。`,timeline:[{date:`约 1090`,place:`法国`,title:`教授逻辑`,detail:`阿伯拉尔曾短期从学；具体学校与年代不完全确定。`,certainty:`推定`},{date:`1092`,place:`苏瓦松`,title:`三位一体观点受谴责`,detail:`在压力下撤回；会议材料主要由后世来源重建。`,certainty:`较可靠`},{date:`约 1120`,place:`法国`,title:`晚年仍参与论争`,detail:`与阿伯拉尔的敌对书信显示其尚在活动。`,certainty:`较可靠`}],inquiries:[{object:`共相`,question:`‘人’‘动物’等共同名称，除许多个体之外还对应一个共同实在吗？`,start:`感官中只有苏格拉底、柏拉图等个体，语言却能用一个词谈论许多人。`,steps:[`拒绝把种属当作独立实体`,`把普遍性定位到共同语词或发声功能`,`以个体为实际存在的首要单位`,`检验这一立场用于三位一体时的后果`],conclusion:`共同名称不必对应一个额外实体；但罗瑟林究竟持声音论、语词论还是更细的语义理论，证据不足。`}],concepts:[{zh:`唯名论`,en:`nominalism`,definition:`否认共相作为独立普遍实体存在；在罗瑟林处只能依据敌对材料谨慎使用。`},{zh:`气
