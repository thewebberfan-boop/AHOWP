响`,`Locke's Influence`,637,[`自由主义`,`影响`]],[`b3-16`,`modern`,`从文艺复兴到休谟`,`XVI`,`贝克莱`,`Berkeley`,643,[`观念论`,`知觉`]],[`b3-17`,`modern`,`从文艺复兴到休谟`,`XVII`,`休谟`,`Hume`,655,[`怀疑`,`因果`]],[`b3-18`,`modern`,`从卢梭到现代`,`XVIII`,`浪漫主义运动`,`The Romantic Movement`,670,[`浪漫主义`,`个人`]],[`b3-19`,`modern`,`从卢梭到现代`,`XIX`,`卢梭`,`Rousseau`,679,[`自由`,`政治`]],[`b3-20`,`modern`,`从卢梭到现代`,`XX`,`康德`,`Kant`,696,[`知识`,`先验`]],[`b3-21`,`modern`,`从卢梭到现代`,`XXI`,`十九世纪的思想潮流`,`Currents of Thought in the Nineteenth Century`,712,[`历史`,`思想`]],[`b3-22`,`modern`,`从卢梭到现代`,`XXII`,`黑格尔`,`Hegel`,722,[`辩证法`,`国家`]],[`b3-23`,`modern`,`从卢梭到现代`,`XXIII`,`拜伦`,`Byron`,738,[`浪漫主义`,`个人`]],[`b3-24`,`modern`,`从卢梭到现代`,`XXIV`,`叔本华`,`Schopenhauer`,745,[`意志`,`悲观主义`]],[`b3-25`,`modern`,`从卢梭到现代`,`XXV`,`尼采`,`Nietzsche`,751,[`价值`,`权力`]],[`b3-26`,`modern`,`从卢梭到现代`,`XXVI`,`功利主义者`,`The Utilitarians`,764,[`功利`,`伦理`]],[`b3-27`,`modern`,`从卢梭到现代`,`XXVII`,`卡尔·马克思`,`Karl Marx`,773,[`历史`,`阶级`]],[`b3-28`,`modern`,`从卢梭到现代`,`XXVIII`,`柏格森`,`Bergson`,782,[`时间`,`直觉`]],[`b3-29`,`modern`,`从卢梭到现代`,`XXIX`,`威廉·詹姆斯`,`William James`,801,[`实用主义`,`经验`]],[`b3-30`,`modern`,`从卢梭到现代`,`XXX`,`约翰·杜威`,`John Dewey`,809,[`实用主义`,`教育`]],[`b3-31`,`modern`,`从卢梭到现代`,`XXXI`,`逻辑分析哲学`,`The Philosophy of Logical Analysis`,818,[`分析`,`逻辑`]]].map(([e,t,n,r,i,a,o,s])=>({id:e,book:t,part:n,roman:r,title:i,english:a,pdfPage:o,themes:s})),p={"b1-04":{context:`爱奥尼亚自然哲学之后，思想开始把‘变化本身’当作世界的基本事实。`,summary:`赫拉克利特把世界理解为持续生成的秩序。对立并非秩序的失败，而是维持秩序的张力；火与逻各斯分别呈现变化的形象和变化中的尺度。`,keyPoints:[`万物处于流变，稳定更像关系而非静止实体。`,`对立面彼此依存，冲突能够构成和谐。`,`逻各斯意味着变化仍可被理性把握。`],russell:`罗素欣赏其历史影响，但警惕把冲突神秘化。他把赫拉克利特视作后来辩证思维的重要源头。`,questions:[`如果一切都变，知识如何可能？`,`‘对立统一’是解释，还是一种描述方式？`],axis:[`变化`,`恒常`]},"b1-11":{context:`雅典民主、战争与智者运动共同构成苏格拉底活动的公共空间。`,summary:`苏格拉底把哲学的中心从自然转向‘应当怎样生活’。他的问答法并不直接交付结论，而是通过暴露概念矛盾，要求人对自己的信念负责。`,keyPoints:[`德性与知识存在紧密联系。`,`自知首先意味着承认无知。`,`审问概念也是一种公共伦理实践。`],russell:`罗素区分历史上的苏格拉底与柏拉图笔下的形象，并强调资料互相冲突带来的困难。`,questions:[`知道善是否足以使人行善？`,`苏格拉底的守法与独立批判是否矛盾？`],axis:[`个人良知`,`城邦法律`]},"b1-14":{context:`伯罗奔尼撒战争后的政治失序，使柏拉图将正义问题与理想政体连在一起。`,summary:`《理想国》把城邦看成放大的灵魂：理性、意气与欲望各安其位，正义便是整体秩序。哲学王方案把知识资格转化为统治资格。`,keyPoints:[`正义被界定为各部分履行适当功能。`,`教育制度比个别法律更根本。`,`哲学王将真理与政治权威结合。`],russell:`罗素认为这套秩序牺牲了个人自由，并把它视作后来极权式政治理想的一条思想先声。`,questions:[`掌握真理能否自动带来统治正当性？`,`共同体秩序可以在多大程度上塑造个人生活？`],axis:[`社会秩序`,`个人自由`]},"b1-19":{context:`亚里士多德在批评柏拉图理念论的同时，试图保留形式与可理解秩序。`,summary:`具体事物是质料与形式的结合；变化可借潜能到现实的展开来说明。实体、四因与不动的推动者共同构成一套层级化世界图景。`,keyPoints:[`形式不在事物之外，而在具体实体之中。`,`四因同时回答材料、结构、动力与目的。`,`潜能与现实解释变化而不放弃同一性。`],russell:`罗素肯定其概念影响，也批评目的论和传统权威后来阻碍经验科学。`,questions:[`目的因是自然解释的一部分吗？`,`形式与质料能否真正避免柏拉图式二分？`],axis:[`经验事物`,`形式秩序`]},"b1-28":{context:`城邦独立衰落后，哲学的重心从公共政治转向个人如何承受不确定世界。`,summary:`斯多葛主义区分可控制与不可控制之物，把德性视为唯一真正的善。个人通过服从普遍理性获得内在自由，并由此发展出世界公民观。`,keyPoints:[`自由主要是对自身判断与欲望的治理。`,`自然法把所有理性存在者联系起来。`,`情绪困扰源于对事件所作的判断。`],russell:`罗素强调它在帝国时代与基督教形成之间的桥梁作用，也指出其伦理容易滑向消极忍受。`,questions:[`内在自由会不会削弱改变制度的动力？`,`顺应自然与宿命论如何区分？`],axis:[`内在自由`,`外在命运`]},"b1-29":{context:`罗马以军事征服终结希腊城邦的政治自主，又以道路、法律、城市和长期和平把希腊化文化扩散到统一帝国。`,summary:`本章不是一套哲学，而是第一卷末尾的历史接口：罗马自身较少创造抽象体系，却提供了希腊文化向西方、东方宗教向帝国、以及古代知识向基督教和伊斯兰世界传递的制度空间。共和国扩张、内战、奥古斯都秩序和三世纪危机也改变了哲学所回答的问题。`,keyPoints:[`罗马和平扩大了共同文明和世界国家的经验。`,`希腊文化征服罗马精英，东方宗教同时进入西方。`,`稳定帝国利于传播，却也可能使思想与政治生活趋于定型。`,`三世纪军事、财政与城市危机为普罗提诺的超越转向提供历史背景。`],russell:`罗素把罗马视为重要的政治与传输装置，而非原创哲学中心；其判断有助于建立历史架子，但也低估了罗马法律、修辞和制度实践本身的思想创造性。`,questions:[`统一帝国促进文化传播时，是否也降低思想的政治创造力？`,`斯多葛主义的世界公民观是帝国经验的批判，还是其理想化？`],axis:[`文化传播`,`政治定型`]},"b1-30":{context:`三世纪罗马帝国经历战争、瘟疫、财政崩坏和城市衰落；基督教、诺斯替主义与柏拉图传统都在寻找超越不稳定现实的秩序。`,summary:`普罗提诺把真实组织为太一、精神与灵魂的层级：较低层由较高层的丰盈活动产生，又通过沉思返回来源。感性世界不是邪恶造物，而是可知秩序在物质条件下尽可能美的形象。人的最高生活由德性净化、内在转向和不可言说的合一构成。`,keyPoints:[`太一超越存在和普通谓词，是一切统一性的根据。`,`精神包含理念整体，灵魂连接可知世界与感性自然。`,`流溢不是时间中的创造，回归也不是空间迁移。`,`反诺斯替论证保留感性宇宙的秩序和美。`,`该体系既是古希腊哲学的终点，也是中世纪基督教形而上学的重要起点。`],russell:`罗素赞赏体系的美、灵魂论和人格高度，同时批评它把注意力由外部世界转向内在完善，可能削弱科学与制度改革。`,questions:[`绝对简单的太一如何在不改变、不需要的情况下产生多样世界？`,`向内回归能否同时保留对感性世界和公共生活的责任？`],axis:[`超越统一`,`感性多样`]},"b2-04":{context:`古典世界向基督教世界过渡，个人灵魂、救赎与教会权威成为哲学核心。`,summary:`奥古斯丁把柏拉图主义资源纳入基督教：恶不是实体而是善的缺失，时间属于被创造的心灵经验，人的意志又因原罪需要恩典。`,keyPoints:[`确定性可从怀疑者自身的存在切入。`,`时间通过记忆、注意与期待呈现。`,`自由意志与神圣预知形成持续张力。`],russell:`罗素认为奥古斯丁塑造了中世纪思想的心理深度，同时也强化了罪与惩罚的神学框架。`,questions:[`恶若只是缺失，苦难是否被解释充分？`,`恩典优先时，道德责任如何成立？`],axis:[`自由意志`,`神圣恩典`]},"b2-13":{context:`亚里士多德著作经伊斯兰与拉丁学术网络重新进入西欧，信仰与理性的边界需被重画。`,summary:`阿奎那用亚里士多德哲学系统化基督教神学：某些关于世界的真理可由自然理性抵达，启示则补足理性无法独立达到的内容。`,keyPoints:[`信仰与理性来源不同，却不应真正冲突。`,`由运动、因果等经验事实通向第一原因。`,`自然法把伦理规范建立在人性目的上。`],russell:`罗素赞赏体系的严密，却认为结论预先服从教义，削弱了开放探究。`,questions:[`预设信仰结论的论证还能否称为哲学？`,`从因果链能否推出具有宗教属性的上帝？`],axis:[`自然理性`,`神圣启示`]},"b3-08":{context:`宗教战争与国家权力重组，使政治哲学转向秩序如何在冲突个体之间建立。`,summary:`霍布斯从欲望、恐惧与自我保存出发构造自然状态。为摆脱不安全，人们相互订约并授权主权者，政治权威因而来自人为建构而非神授。`,keyPoints:[`自然平等也意味着相互伤害能力的接近。`,`契约发生在个体之间，主权者是被授权者。`,`和平与安全构成服从权威的核心理由。`],russell:`罗素重视其清晰的世俗推理，但拒绝几乎不受限制的主权结论。`,questions:[`安全是否足以压倒自由？`,`主权者破坏保护承诺时，服从义务还存在吗？`],axis:[`社会秩序`,`个人权利`]},"b3-09":{context:`新科学要求摆脱经院权威，为知识寻找可重复、可演绎的确定起点。`,summary:`笛卡尔以方法性怀疑清除可疑信念，在‘我思’中找到不可否认的自我存在，再尝试重建上帝、外部世界以及心物二元论。`,keyPoints:[`怀疑被用作建立确定性的工具。`,`思维实体与广延实体性质不同。`,`清楚分明观念承担真理标准的角色。`],russell:`罗素把主体作为起点视为现代哲学的转折，也认为从我思通向外部世界的重建并不成功。`,questions:[`‘我思’证明的是一个实体自我，还是仅有思维事件？`,`心物二元论如何解释两者互动？`],axis:[`主观确定性`,`外部世界`]},"b3-10":{context:`理性主义继续追求统一体系，但拒绝把自然与上帝看成彼此外在。`,summary:`斯宾诺莎主张只有一个无限实体——上帝即自然；心与物是同一实体的不同属性。自由不是摆脱因果，而是理解必然性并由理性行动。`,keyPoints:[`实体自因且唯一，个别事物是其样态。`,`心物平行避免两种实体的相互作用难题。`,`理解情感的原因能够增加主动性。`],russell:`罗素对斯宾诺莎的伦理人格评价极高，并特别欣赏其从理解必然性中获得平静的理想。`,questions:[`如果一切必然，道德责任意味着什么？`,`‘上帝即自然’保留了多少宗教含义？`],axis:[`必然性`,`自由`]},"b3-13":{context:`英国经验主义与政治自由主义共同反对天赋观念和绝对权威。`,summary:`洛克把心灵比作尚未书写的纸张，观念来自感觉与反省。知识是观念之间关系的把握，但对实体、外部对象和他人心灵的确定性有限。`,keyPoints:[`拒绝作为既成内容的天赋观念。`,`区分第一性质与第二性质。`,`个人同一性更多依赖意识连续，而非同一物质。`],russell:`罗素赞赏洛克的温和与反独断精神，同时指出其认识论仍保留难以证明的实体假设。`,questions:[`经验能否提供普遍必然知识？`,`记忆标准会不会让个人同一性陷入循环？`],axis:[`经验`,`理性结构`]},"b3-17":{context:`经验主义推进到极限后，实体、自我和因果关系都面临证据不足的问题。`,summary:`休谟区分印象与观念，并追问每个观念来自何种经验。因果必然性不是被感知的连接，而是重复经验形成的心理习惯；自我也只是知觉束。`,keyPoints:[`事实推理依赖因果，却无法由纯理性证明。`,`归纳预设未来类似过去，但此预设不能循环证明。`,`怀疑在生活实践中会被自然习惯缓和。`],russell:`罗素认为休谟把经验主义推向逻辑终点，并留下现代哲学必须回应的归纳难题。`,questions:[`没有理性证明，科学归纳凭什么可靠？`,`知觉束能否解释统一的行动主体？`],axis:[`理性证明`,`自然习惯`]},"b3-20":{context:`理性主义与经验主义的冲突，以及休谟的怀疑，促使康德重问经验何以可能。`,summary:`康德认为认识并非被动复制世界：感性以空间和时间组织材料，知性以范畴统一经验。我们认识现象，却不能用同样方式认识物自身。`,keyPoints:[`先天综合判断试图解释数学与自然科学的必然性。`,`主体的认识结构规定了可能经验的形式。`,`理性越出经验会产生无法解决的二律背反。`],russell:`罗素承认康德问题的重要性，但反对把空间、时间及范畴过多地归于主体构造。`,questions:[`物自身若不可知，为何仍需设定？`,`先验条件是普遍结构，还是人类认知的历史事实？`],axis:[`主体形式`,`客观世界`]},"b3-22":{context:`德国观念论试图跨越康德留下的现象与物自身二分，并把历史纳入理性体系。`,summary:`黑格尔把实在理解为整体性的精神发展，矛盾推动概念和历史达到更高综合。个别事物只有在关系网络与整体进程中才获得充分真理。`,keyPoints:[`真理不是孤立命题，而是展开的整体。`,`否定性推动概念超越自身局限。`,`自由通过历史制度获得具体形式。`],russell:`罗素严厉反对从逻辑结构推出政治整体主义，认为黑格尔把国家权威置于个人之上。`,questions:[`矛盾如何成为真实的发展动力？`,`整体视角是否必然削弱个人的独立价值？`],axis:[`历史整体`,`具体个人`]},"b3-25":{context:`十九世纪欧洲的宗教衰退、民族主义与浪漫主义，使价值来源成为尖锐问题。`,summary:`尼采以谱系方式追问价值如何产生，批判把软弱与怨恨包装成普遍道德。他要求在旧价值失效后重新创造价值，并以生命肯定抵抗虚无主义。`,keyPoints:[`道德概念有权力关系与历史来源。`,`主人道德与奴隶道德呈现不同价值姿态。`,`超人象征自我超越，而非生物学类别。`],russell:`罗素欣赏其洞察力和文体，却强烈反对英雄崇拜、残酷审美与反平等倾向。`,questions:[`揭示价值来源是否等于反驳价值？`,`自我创造怎样避免变成强者任性？`],axis:[`价值创造`,`普遍道德`]},"b3-27":{context:`工业资本主义与工人阶级形成，使哲学重新把物质生产和社会冲突置于历史中心。`,summary:`马克思把黑格尔的历史运动转向物质生活：生产关系与阶级冲突塑造制度和观念。哲学的任务不仅是解释世界，也要介入改变世界的实践。`,keyPoints:[`社会存在深刻制约意识形态。`,`阶级斗争推动历史结构变化。`,`异化描述劳动者与产品、活动和自身能力的分离。`],russell:`罗素承认经济结构的解释力，但批评历史必然论以及由此支持的政治专断。`,questions:[`经济因素在多大程度上决定观念？`,`历史趋势能否为具体政治手段提供正当性？`],axis:[`结构条件`,`人的能动性`]},"b3-31":{context:`数学基础危机与语言转向，使哲学从建造宏大体系转向澄清命题结构。`,summary:`逻辑分析通过拆解语法表面形式，揭示命题的逻辑结构。它试图减少虚假问题，并让哲学与科学共享清晰、可检验的论证标准。`,keyPoints:[`语法形式可能掩盖真正的逻辑形式。`,`分析把复杂命题还原为更基本关系。`,`哲学更像澄清活动，而非关于世界的竞争性学说。`],russell:`这是全书最接近作者自身立场的一章：反体系、重分析，同时保留对科学尚不能回答之问题的哲学敏感。`,questions:[`分析能消除哲学问题，还是只改变表达方式？`,`价值与人生问题能否接受同样的逻辑处理？`],axis:[`逻辑清晰`,`形而上体系`]}},m={generatedAt:`2026-08-20T14:35:13.181Z`,policy:`Representative images resolved from encyclopedia records to Wikimedia Commons; every downloaded image retains its source and license metadata.`,count:68,ready:60,needsReview:8,figures:[{id:`thales`,zh:`泰勒斯`,en:`Thales`,wikipediaTitle:`Thales of Miletus`,wikipediaUrl:`https://en.wikipedia.org/wiki/Thales_of_Miletus`,wikidataI 为对统一权威结构的拆解？`,coverage:`book`},{id:`early-modern`,years:`1650—1750`,title:`理性、经验与现代秩序`,subtitle:`从霍布斯到休谟`,transition:`失去共同权威 → 从主体、经验和契约重新奠基`,world:[`宗教战争强化对政治和平的需求`,`新科学成为可靠知识的模型`,`商业社会与英国革命推动自由主义`],carrier:`共和国、王权国家、科学院、沙龙与出版市场`,commonQuestion:`知识如何获得确定性？相互冲突的个人如何建立稳定政治？`,chain:[{label:`共同危机`,text:`权威不再自动可信`,kind:`condition`},{label:`知识路线`,text:`理性主义 ↔ 经验主义`,kind:`oppose`},{label:`政治路线`,text:`绝对主权 ↔ 自由主义`,kind:`oppose`},{label:`终点危机`,text:`休谟把经验主义推向怀疑`,kind:`inherit`}],responses:[{id:`hobbes`,title:`从恐惧和契约建立主权`,figures:`霍布斯`,region:`英格兰`,answer:`自然平等导致不安全，个人为和平授权一个不可分割的公共权力。`,method:`机械论、思想实验与演绎构造`,difference:`以个人为起点，却推出强大的国家。`,chapterIds:[`b3-08`]},{id:`rationalists`,title:`从清楚原则演绎世界`,figures:`笛卡尔、斯宾诺莎、莱布尼茨`,region:`法国、荷兰、德意志`,answer:`理性可以从确定起点建立关于心灵、自然和上帝的系统知识。`,method:`怀疑、定义、公理与演绎`,difference:`共享数学理想，却对实体、自由和心物关系给出不同体系。`,chapterIds:[`b3-09`,`b3-10`,`b3-11`]},{id:`locke`,title:`从经验与权利限制权威`,figures:`洛克`,region:`英格兰`,answer:`观念来自经验，政治权力来自保护自然权利的有限委托。`,method:`心理发生分析与契约论`,difference:`在知识和政治两方面都反对天赋内容与绝对权威。`,chapterIds:[`b3-12`,`b3-13`,`b3-14`,`b3-15`]},{id:`hume`,title:`揭示经验基础的限度`,figures:`贝克莱、休谟`,region:`不列颠与爱尔兰`,answer:`实体、因果和自我都不能按传统方式从经验中得到必然证明。`,method:`观念来源追踪与怀疑分析`,difference:`经验主义成功拆除旧形而上学，也动摇了科学归纳的理性基础。`,chapterIds:[`b3-16`,`b3-17`]}],legacy:[`现代主体`,`社会契约`,`自由主义`,`理性主义—经验主义框架`,`康德问题的起点`],review:`为什么同样受新科学影响，笛卡尔从理性确定性出发，洛克从经验出发，霍布斯却把方法用于国家建构？`,coverage:`book`},{id:`revolution-idealism`,years:`1750—1850`,title:`革命、浪漫主义与历史理性`,subtitle:`卢梭、康德与德国观念论`,transition:`普遍理性与个人权利 → 自由、历史和民族共同体`,world:[`启蒙思想进入美国与法国革命`,`浪漫主义反抗机械理性和商业文明`,`拿破仑战争与民族国家改变欧洲`],carrier:`公共舆论、大学、文学运动、革命国家与民族文化`,commonQuestion:`自由是个人不受干涉，还是个人通过共同体和历史实现自身？`,chain:[{label:`政治爆发`,text:`启蒙原则 → 革命实践`,kind:`condition`},{label:`情感反动`,text:`理性秩序 → 浪漫个性`,kind:`oppose`},{label:`哲学重建`,text:`主体条件 → 历史精神`,kind:`response`},{label:`新危险`,text:`自由可能被整体国家吸收`,kind:`exception`}],responses:[{id:`rousseau`,title:`从自然自由到公意`,figures:`卢梭`,region:`日内瓦 / 法国`,answer:`文明制造依赖与不平等，正当共同体必须使服从法律等于服从共同意志。`,method:`起源叙事、社会批判与契约构造`, 精确的澄清活动。`,chapterIds:[`b3-31`]}],legacy:[`价值谱系`,`社会结构批判`,`实用主义`,`分析哲学`,`现代哲学的多中心格局`],review:`为什么工业社会没有产生一个统一哲学，而同时产生了尼采、马克思、实用主义和逻辑分析？`,coverage:`book`}],re={origins:{events:[{id:`ionian-network`,marker:`前 8—6 世纪`,title:`殖民、贸易与爱奥尼亚知识网络`,detail:`希腊人在地中海和黑海沿岸建立殖民城邦。米利都等商业城市同时接触埃及测量、巴比伦天文和多地宗教观念。知识开始脱离单一祭司传统，在旅行者与城邦精英之间比较、修正。`},{id:`polis-rise`,marker:`前 7—6 世纪`,title:`城邦政治与成文法兴起`,detail:`贵族、僭主和平民围绕土地、债务和公民资格反复冲突。成文法与公共议事让秩序显得并非只能由神授，也能由人说明和改变；论证由此成为公共生活的一种力量。`},{id:`persian-wars`,marker:`前 499—449`,title:`希波战争与希腊世界重组`,detail:`爱奥尼亚起义和希波战争摧毁、迁移了一些早期思想中心，同时提升雅典的军事与文化地位。哲学活动逐渐由小亚细亚向南意大利和雅典转移。`}],problems:[{id:`arche`,marker:`自然`,title:`多样世界是否有共同本原？`,detail:`跨文明观察带来大量不同解释。早期哲学家尝试用水、无限者、气、数或原子等较少的自然原则说明较多现象，使世界成为可以争论的对象。`},{id:`change-being`,marker:`存在`,title:`变化与恒常如何同时成立？`,detail:`经验呈现生成与毁灭，理性却要求同一和不矛盾。赫拉克利特、巴门尼德及后来的多元论者，正是在回应感官变化与理性恒常之间的冲突。`},{id:`reason-sense`,marker:`知识`,title:`感官和推理，何者更可靠？`,detail:`数学证明显示推理可以达到不依赖眼前经验的确定性；但自然研究又从观察起步。这个张力后来成为柏拉图主义、经验研究和科学方法长期分化的起点。`}]},athens:{events:[{id:`athenian-democracy`,marker:`前 508—431`,title:`民主、帝国与公共辩论扩张`,detail:`克利斯提尼改革后，公民大会、法庭和演说成为雅典政治核心。海上同盟又带来财富与帝国权力。能否说服公众、界定正义，成为真实的政治能力。`},{id:`peloponnesian-war`,marker:`前 431—404`,title:`伯罗奔尼撒战争与政体反复`,detail:`长期战争、瘟疫、远征失败以及民主和寡头政变交替，削弱了雅典对自身制度的信心。苏格拉底之死与柏拉图的政治不信任，都处在这一创伤背景中。`},{id:`macedonian-rise`,marker:`前 387—322`,title:`学园建立与马其顿接管希腊`,detail:`柏拉图学院和亚里士多德吕克昂把哲学变成持续教学与研究制度；与此同时，马其顿击败希腊城邦，传统公民政治的自主空间迅速缩小。`}],problems:[{id:`knowledge-opinion`,marker:`知识`,title:`公共意见之外，是否有可靠知识？`,detail:`民主法庭依赖多数判断，智者展示同一案件可以有相反论证。苏格拉底与柏拉图因此追问：若没有稳定定义和真理，政治判断如何避免只剩说服与权势？`},{id:`virtue-education`,marker:`伦理`,title:`德性能够通过教育获得吗？`,detail:`新兴政治生活让修辞教师成为职业，但“会成功”是否等于“是善的”并不清楚。苏格拉底把教育从技能训练转成对灵魂、知识和行动一致性的审问。`},{id:`best-polis`,marker:`政治`,title:`失序之后，怎样组织好城邦？`,detail:`雅典的战争失败使哲学家不得不比较民主、寡头、君主和混合政体。柏拉图从知识资格设计理想国，亚里士多德则从现实宪制与公民生活寻找可行秩序。`}]},hellenistic:{events:[{id:`alexander`,marker:`前 334—323`,title:`亚历山大征服波斯帝国`,detail:`马其顿军队把希腊势力推进到埃及、中亚和印度河流域。征服制造了跨地域的政治与文化空间，也终结了希腊城邦作为最高政治单位的稳定地位。`},{id:`successor-kingdoms`,marker:`前 323—168`,title:`继业者王国与希腊化城市形成`,detail:`帝国分裂为托勒密、塞琉古等君主国。亚历山大里亚等城市汇聚希腊、埃及、波斯和犹太传统，学派与图书馆取代城邦公民共同体，成为知识的重要载体。`},{id:`roman-expansion`,marker:`前 168—30`,title:`罗马接管地中海世界`,detail:`罗马先后控制马其顿、希腊和埃及。政治中心继续远离传统希腊城邦，哲学则被带入罗马精英教育和更广泛的帝国生活。`}],problems:[{id:`inner-freedom`,marker:`生活`,title:`无法控制政治时，个人怎样自由？`,detail:`个人从城邦决策者变为大王国的臣民，外部地位更不稳定。犬儒、伊壁鸠鲁和斯多葛学派都把自由重新安放在需要、欲望或判断的管理上。`},{id:`cosmopolis`,marker:`共同体`,title:`跨地域世界需要怎样的共同身份？`,detail:`人口迁移和文化混合削弱了单一城邦身份。斯多葛主义用共同理性和自然法构造“世界公民”，其他学派则用友谊小共同体或退出公共规范回应。`},{id:`tranquility-certainty`,marker:`知识`,title:`确定知识是否是安宁的必要条件？`,detail:`怀疑派认为减少知识承诺本身能够消除扰动；伊壁鸠鲁派却认为必须理解自然，才能解除神罚和死亡恐惧。两者共享宁静目标，却对知识的作用判断相反。`}]},roman:{events:[{id:`augustan-order`,marker:`前 27—180`,title:`元首制与帝国和平`,detail:`奥古斯都以后，军队、税制、道路和行政把广大地区纳入较稳定的秩序。希腊哲学被罗马精英吸收，但哲学家很少再把参与独立城邦当作生活前提。`},{id:`citizenship-law`,marker:`1—3 世纪`,title:`罗马法与公民身份扩张`,detail:`城市网络、法律程序和二一二年的公民权敕令扩大了共同制度。不同民族在同一帝国中生活，使普遍法、角色义务和人类共同性的观念更有现实基础。`},{id:`third-century-crisis`,marker:`235—284`,title:`三世纪危机与宗教需求上升`,detail:`皇位频繁更替、内战、边境压力、瘟疫和经济混乱削弱帝国安全感。传统公共宗教难以解释个人苦难，神秘宗教和更强的来世救赎需求因而扩张。`}],problems:[{id:`role-duty`,marker:`伦理`,title:`庞大制度中的人应怎样履行角色？`,detail:`帝国把皇帝、奴隶、士兵和官员置于不同位置。罗马斯多葛主义试图说明：外在角色有别，但每个人都能通过理性判断和恰当行动保有德性。`},{id:`fate-freedom`,marker:`自由`,title:`必然命运中还能有什么自由？`,detail:`个人难以影响帝国政治，战争与疾病也不可预测。哲学于是区分事件本身与人的判断，把自由缩小却加固为无法被外力直接夺走的内在能力。`},{id:`higher-reality`,marker:`形而上学`,title:`外部秩序之外，更高真实在哪里？`,detail:`帝国制度能提供法律，却不能提供终极意义。普罗提诺把真实组织成太一、精神与灵魂的层级，并要求灵魂由感性多样返回统一根源。`}]},patristic:{events:[{id:`constantine`,marker:`313—325`,title:`君士坦丁改宗与尼西亚会议`,detail:`基督教获得合法地位后，教义分歧不再只是宗派内部问题。皇帝召集会议处理基督性质等争论，神学语言与帝国统一第一次被制度性地连接。`},{id:`state-religion`,marker:`380—395`,title:`基督教成为帝国主导宗教`,detail:`狄奥多西时期，尼西亚基督教获得国家支持，异教祭祀受到限制。教会吸收行政资源，也必须处理权力、强制与正统边界的问题。`},{id:`western-collapse`,marker:`410—529`,title:`西罗马瓦解与修道制度成长`,detail:`罗马遭劫和西部皇权消失，使城市教育与行政网络衰退。主教和修道院逐渐承担救济、识字教育与典籍保存，教会成为少数跨地域连续组织。`}],problems:[{id:`greek-language`,marker:`神学`,title:`如何用希腊概念表达启示？`,detail:`圣经叙事谈创造与救赎，希腊哲学谈实体、形式和永恒。教父必须借用后者澄清三位一体与基督论，同时避免让基督教被完全改写成柏拉图主义。`},{id:`evil-grace`,marker:`人性`,title:`恶、自由意志与恩典怎样相容？`,detail:`基督教既坚持上帝全善全能，又必须解释罪与苦难。奥古斯丁把恶理解为善的缺失，把犯罪归于意志，却又强调堕落者离不开神圣恩典。`},{id:`sacred-history`,marker:`历史`,title:`帝国崩溃意味着宗教失败吗？`,detail:`罗马被劫后，异教作者把灾难归咎于基督教。奥古斯丁以“上帝之城”和“世俗之城”区分政治命运与救赎史，使历史获得一个超越帝国兴亡的方向。`}]},"early-medieval":{events:[{id:`islamic-expansion`,marker:`7—10 世纪`,title:`伊斯兰扩张与翻译运动`,detail:`阿拉伯帝国连接叙利亚、波斯、埃及与西班牙。巴格达等中心把希腊哲学、印度数学和医学译成阿拉伯语，并在注释、计算与科学实践中继续发展。`},{id:`carolingian`,marker:`800—843`,title:`查理曼帝国与拉丁教育重建`,detail:`查理曼加冕象征西部帝国观念复兴。宫廷和修道院推动文字规范、学校与抄本复制，但统一很快瓦解，教育仍主要依附少数宗教机构。`},{id:`investiture`,marker:`1075—1122`,title:`教会改革与叙任权斗争`,detail:`改革教皇反对世俗君主任命主教，皇帝则坚持传统控制。冲突把精神权威与世俗权力明确区分，也推动教会法和制度论证发展。`}],problems:[{id:`preservation-authority`,marker:`知识`,title:`文明断裂后，谁有权保存和筛选知识？`,detail:`不同地区保存了不同古典资源：西欧修道院偏重拉丁宗教文本，拜占庭保留希腊传统，伊斯兰城市则广泛翻译和扩展。保存从来同时意味着选择。`},{id:`reason-revelation`,marker:`方法`,title:`跨语言知识怎样进入信仰体系？`,detail:`翻译不只是换语言，也会改变概念。约翰·司各脱、阿维森纳和阿威罗伊都必须判断：哲学推理与启示冲突时，是重新解释经文、限制理性，还是区分真理层次。`},{id:`two-powers`,marker:`政治`,title:`教皇与皇帝，谁代表普遍秩序？`,detail:`西欧没有单一帝国，却同时继承罗马皇权和普世教会理想。主教任命、财产和法律管辖的争执，使政治思想长期围绕两种普遍权威的边界展开。`}]},scholastic:{events:[{id:`translations-crusades`,marker:`1095—1250`,title:`十字军、城市贸易与翻译回流`,detail:`军事接触并非知识传播的唯一渠道，但地中海联系扩大，使托莱多、西西里等地的阿拉伯语和希腊语著作进入拉丁世界，完整亚里士多德尤其改变大学课程。`},{id:`universities`,marker:`12—13 世纪`,title:`大学与托钵修会兴起`,detail:`巴黎、牛津等大学形成教师、课程与学位制度；方济各会和多明我会进入城市教育。哲学问题被固定成可反驳、可答辩、可积累的专业论证格式。`},{id:`papal-decline`,marker:`1302—1378`,title:`教皇高峰后的政治裂缝`,detail:`教皇与法国王权冲突、阿维尼翁时期及教会分裂削弱普世权威。民族王权、城市和新法律实践上升，使经院综合失去原有的统一制度基础。`}],problems:[{id:`faith-reason`,marker:`体系`,title:`理性与启示能组成完整世界吗？`,detail:`亚里士多德提供自然、逻辑和伦理的系统解释，却包含与基督教不完全相容的前提。阿奎那试图划分自然理性能及之处，以及必须依赖启示的领域。`},{id:`universal-individual`,marker:`本体论`,title:`普遍概念和个体事物谁更根本？`,detail:`大学辩论需要精确定义“人性”“种类”等共相的地位。实在论、概念论和唯名论的差异，又影响上帝知识、个体责任和经验对象应如何被理解。`},{id:`limits-system`,marker:`方法`,title:`一个体系应当在哪里停止解释？`,detail:`经院方法追求兼容全部权威，但奥卡姆等人强调简约、个体和上帝意志，缩小理性证明范围。体系内部由此产生限制体系自身的工具。`}]},"renaissance-science":{events:[{id:`print-fall`,marker:`1450—1453`,title:`印刷术传播与君士坦丁堡陷落`,detail:`活字印刷显著降低文本复制成本，希腊学者和手稿又更多进入意大利。古典材料不再只由大学经院传统解释，人文主义者开始校勘原文和比较版本。`},{id:`oceanic-expansion`,marker:`1492—1522`,title:`远洋航行扩大已知世界`,detail:`跨大西洋航行和环球航行暴露了古典地理知识的限度，也带来殖民、财富与暴力。经验事实能够公开修正权威文本，欧洲人的人类与自然观被迫扩展。`},{id:`reformation-science`,marker:`1517—1633`,title:`宗教改革与日心说冲突`,detail:`宗教改革打破西欧教会统一；哥白尼、开普勒和伽利略又以数学和观察改变宇宙结构。经文、古代权威与可检验自然知识之间出现多重竞争。`}],problems:[{id:`political-reality`,marker:`政治`,title:`政治能否脱离统一神学伦理研究？`,detail:`意大利城邦的战争与外交显示，统治者常按权力后果而非传统德性行动。马基雅维利由此把政治稳定、能力和时机当作相对独立的研究对象。`},{id:`interpretation-authority`,marker:`权威`,title:`个人、经文与教会，谁解释真理？`,detail:`印刷让经文和论战迅速传播，宗教改革削弱教会作为唯一中介的地位。个人良心上升，却也产生宗派国家、教义冲突和新的强制。`},{id:`new-method`,marker:`科学`,title:`什么方法能让自然知识可信？`,detail:`旧体系依赖经典注释和目的因，新天文学则依赖测量、数学预测与仪器观察。争论的核心不只是地球是否运动，而是什么证据足以推翻权威。`}]},"early-modern":{events:[{id:`religious-wars`,marker:`1618—1648`,title:`三十年战争与威斯特伐利亚和约`,detail:`宗教、王朝和领土冲突造成中欧巨大破坏。和约强化领土国家秩序，也使政治和平越来越难以依赖全欧洲共享的宗教真理。`},{id:`english-revolutions`,marker:`1642—1689`,title:`英国内战与光荣革命`,detail:`王权、议会、宗教和财产权的冲突经历内战、共和国、复辟与权利法案。霍布斯和洛克由同一政治危机出发，却分别强调不可分主权与有限政府。`},{id:`newtonian-science`,marker:`1660—1687`,title:`科学共同体与牛顿综合`,detail:`皇家学会等机构推动公开实验和通信，牛顿以数学定律统一地上与天体运动。科学成为哲学家想要模仿、解释或限制的可靠知识模型。`}],problems:[{id:`certainty-foundation`,marker:`认识论`,title:`失去共同权威后，确定性从哪里开始？`,detail:`笛卡尔从不可怀疑的主体出发，理性主义者追求数学式体系；洛克和休谟则追踪观念的经验来源。现代哲学由此把“认识者”放到知识结构中心。`},{id:`sovereignty-rights`,marker:`政治`,title:`安全、主权与个人权利怎样排序？`,detail:`宗教战争显示分裂权威可能导致暴力，英国内战又显示绝对权力本身也危险。社会契约论用个人同意重建国家，却对权力边界给出不同答案。`},{id:`causation-induction`,marker:`科学`,title:`经验为何能支持普遍科学定律？`,detail:`科学不断成功，但经验只呈现有限事件。休谟指出，我们看见的是连续发生，而非必然联系；归纳依赖习惯，却无法用不循环的经验论证自身。`}]},"revolution-idealism":{events:[{id:`atlantic-revolutions`,marker:`1776—1799`,title:`美国革命与法国革命`,detail:`自然权利、人民主权和公民平等进入制度实践；法国革命同时经历共和、恐怖与政变。自由不再只是理论原则，也暴露出共同意志与政治暴力的紧张。`},{id:`napoleonic`,marker:`1799—1815`,title:`拿破仑战争重绘欧洲`,detail:`法国制度和民族动员席卷欧洲，随后又由王朝复辟收束。战争促进民族意识，也让哲学家把国家、法律和历史变化理解为自由展开的现实场所。`},{id:`industrial-1848`,marker:`1815—1848`,title:`工业化、民族主义与革命浪潮`,detail:`工厂城市、阶级分化和市场关系改变日常生活，民族独立与宪政运动扩张。浪漫主义反对把人缩减为计算与生产单位，一八四八年革命则集中暴露社会矛盾。`}],problems:[{id:`freedom-general-will`,marker:`政治`,title:`个人自由如何进入共同意志？`,detail:`革命需要以人民名义行动，却可能压制具体个人。卢梭的公意、康德的自律和黑格尔的制度自由，都试图说明服从共同规则何时不是失去自由。`},{id:`subject-world`,marker:`认识论`,title:`主体是在发现世界，还是构成经验？`,detail:`休谟的怀疑使理性主义和经验主义都难以保证科学必然性。康德转而研究经验得以可能的主体条件，并由此开启德国观念论。`},{id:`history-freedom`,marker:`历史`,title:`历史变化是否具有理性方向？`,detail:`革命和战争让制度在一代人内剧烈改变。黑格尔把冲突解释为自由意识的发展，浪漫主义者则担心抽象历史整体吞没个性、情感与不可替代的生命。`}]},"industrial-modern":{events:[{id:`industrial-capital`,marker:`1848—1871`,title:`工业资本主义与工人运动成长`,detail:`铁路、工厂和城市化扩大生产，也加深劳动分工、周期危机与阶级冲突。工会、社会主义和大众政治兴起，社会结构本身成为哲学解释与改造对象。`},{id:`darwin-secular`,marker:`1859 以后`,title:`进化论与传统世界观动摇`,detail:`达尔文以自然选择解释物种形成，人类不再天然处于独立创造的位置。历史发展、生命竞争和宗教权威的衰退，共同迫使哲学重估价值来源。`},{id:`mass-war-analysis`,marker:`1879—1918`,title:`专业大学、逻辑革命与世界大战`,detail:`哲学和科学在大学中专业化，现代逻辑改变了分析工具；民族国家和工业技术又在第一次世界大战中显示巨大破坏力。统一进步叙事因此失去可信度。`}],problems:[{id:`value-after-god`,marker:`价值`,title:`传统宗教衰退后，价值从哪里来？`,detail:`科学解释减少了诉诸神意的空间，社会规范又显出历史性。尼采用谱系追问价值由何种生命与权力关系产生，并把虚无主义视为现代核心危机。`},{id:`structure-agency`,marker:`社会`,title:`人的生活由结构决定到什么程度？`,detail:`马克思强调生产关系与阶级，功利主义从行动后果评价制度，实用主义则把观念放回环境中的调整活动。它们都反对孤立主体，却给人的能动性留下不同空间。`},{id:`philosophy-task`,marker:`方法`,title:`哲学应建体系、改社会，还是澄清语言？`,detail:`现代知识专业化后，哲学失去单一中心。谱系、政治经济学、实用实验和逻辑分析并存，分歧已不只是答案不同，而是对哲学任务本身的判断不同。`}]}},ie=[{id:`natural`,title:`自然假说`,rule:`用更少的自然本原解释更多现象`,uses:[`米利都学派`,`原子论`,`新科学`],stages:[`origins`,`renaissance-science`]},{id:`deduction`,title:`演绎与体系`,rule:`从少数被认为可靠的起点推出整体结构`,uses:[`巴门尼德`,`柏拉图`,`笛卡尔`,`斯宾诺莎`],stages:[`origins`,`athens`,`early-modern`]},{id:`dialectic`,title:`问答与辩证`,rule:`通过矛盾、反方和概念区分推进认识`,uses:[`苏格拉底`,`经院哲学`,`黑格尔`],stages:[`athens`,`scholastic`,`revolution-idealism`]},{id:`classification`,title:`分类与功能`,rule:`先区分事物类型，再解释各自原因和适当活动`,uses:[`亚里士多德`,`经院体系`],stages:[`athens`,`scholastic`]},{id:`therapy`,title:`哲学治疗`,rule:`改变欲望与判断，使人能够承受不可控制的世界`,uses:[`犬儒派`,`伊壁鸠鲁派`,`斯多葛派`,`怀疑派`],stages:[`hellenistic`,`roman`]},{id:`interpretation`,title:`解释与综合`,rule:`把既有经典放入新的宗教或概念体系`,uses:[`奥古斯丁`,`阿奎那`,`伊斯兰哲学`],stages:[`patristic`,`early-medieval`,`scholastic`]},{id:`empirical`,title:`经验与实验`,rule:`追踪观念来源，并让主张接受观察或实践检验`,uses:[`培根`,`洛克`,`休谟`,`实用主义`],stages:[`renaissance-science`,`early-modern`,`industrial-modern`]},{id:`critique`,title:`条件分析`,rule:`不直接回答对象是什么，而先问认识它何以可能`,uses:[`康德`,`语言分析`],stages:[`revolution-idealism`,`industrial-modern`]},{id:`genealogy`,title:`历史与谱系`,rule:`通过生成过程解释观念、制度和价值的权力来源`,uses:[`黑格尔`,`马克思`,`尼采`],stages:[`revolution-idealism`,`industrial-modern`]}],ae=[{from:`毕达哥拉斯的数学—宗教秩序`,to:`柏拉图的理念论`,label:`改造`,weight:3},{from:`柏拉图与新柏拉图主义`,to:`奥古斯丁神学`,label:`吸收`,weight:3},{from:`斯多葛自然法与普世人性`,to:`基督教伦理与近代自然权利`,label:`远程传递`,weight:3},{from:`亚里士多德著作`,to:`伊斯兰哲学 → 拉丁经院哲学`,label:`跨文明传播`,weight:3},{from:`古代怀疑主义`,to:`休谟的经验主义怀疑`,label:`问题复活`,weight:2},{from:`苏格拉底的概念追问`,to:`现代逻辑与语言分析`,label:`方法回声`,weight:2},{from:`柏拉图式整体政治`,to:`卢梭、黑格尔与国家哲学`,label:`结构回声`,weight:2},{from:`赫拉克利特的变化与冲突`,to:`黑格尔、马克思与尼采`,label:`高权重例外`,weight:1}],oe=e=>({label:`罗素《西方哲学史》${e}`,kind:`原书`,url:`https://www.russell-j.com/cool/HWP_1945.pdf`}),se={label:`Stanford Encyclopedia · Stoicism`,kind:`补充`,url:`https://plato.stanford.edu/entries/stoicism/`},ce={label:`Internet Encyclopedia of Philosophy · Stoicism`,kind:`补充`,url:`https://iep.utm.edu/stoicism/`},le=[{id:`zeno`,order:21,nameZh:`季蒂昂的芝诺`,nameEn:`Zeno of Citium`,greekName:`Ζήνων ὁ Κιτιεύς`,dates:`约前 334—前 262`,active:`约前 300 年前后`,places:[`季蒂昂`,`雅典`,`彩绘柱廊`],school:`早期斯多葛主义`,figureId:`zeno`,chapterIds:[`b1-28`],thesis:`世界受同一理性秩序贯穿；人不能退出因果整体，却能通过审查印象、控制同意并使意志合乎自然，把自由安放在自身的判断中。`,evidenceCaution:`著作全部失传，只剩后世摘录和转述；早期斯多葛主义又常以学派整体名义保存，因此不能把克律西波斯后来系统化的每项教义都直接归给芝诺。`,lifeSummary:`芝诺来自塞浦路斯的腓尼基文化城市季蒂昂，在亚历山大帝国解体、东方移民进入雅典学术圈的时代来到雅典。他先后接触犬儒派克拉特斯、麦加拉辩证传统和柏拉图学院，约前 300 年开始在雅典广场的彩绘柱廊讲学，学派遂由讲学地点得名。其思想把犬儒派的自足伦理、赫拉克利特式火与逻各斯、苏格拉底的德性追问组织在一起，首次形成逻辑—物理—伦理相互支撑的斯多葛方案。`,timeline:[{date:`约前 334`,place:`季蒂昂（塞浦路斯）`,title:`出生于东地中海商贸城市`,detail:`古代资料称其有腓尼基背景；确切出生年份和家庭情况存在差异。`,certainty:`推定`},{date:`约前 312—前 300`,place:`雅典`,title:`进入多个哲学传统`,detail:`沉船后接触哲学的故事带有传记程式；较可信的是他曾从学克拉特斯、斯提尔波和学院哲学家。`,certainty:`传统记载`},{date:`约前 300`,place:`雅典彩绘柱廊`,title:`形成斯多葛学派`,detail:`在公共柱廊讲学，使哲学从封闭学园延伸到城市公共空间；学生后来被称为“柱廊派”。`,certainty:`较可靠`},{date:`约前 262`,place:`雅典`,title:`去世并由克里安西斯继承`,detail:`雅典人对其德性和公共教导给予荣誉；具体死因来自晚期轶事，不宜确定化。`,certainty:`较可靠`}],inquiries:[{object:`知识与行动`,question:`印象不断进入心灵时，人在哪里对真假和行动负责？`,start:`感官印象并不自动等于判断；同一事件可以被接受、拒绝或暂缓认可。`,steps:[`外物引起印象`,`理性检查印象是否具有可靠来源`,`心灵给予或拒绝同意`,`冲动由已同意的价值判断转成行动`],conclusion:`自由不意味着事件无原因，而在于行动通过主体的同意结构发生；认识训练因此直接构成伦理训练。`},{object:`宇宙秩序与善`,question:`若自然由必然因果支配，个人怎样仍能过好生活？`,start:`宇宙不是无序粒子的偶然集合，而是由物质与贯穿其中的理性火共同构成的有机整体。`,steps:[`把神、自然、命运和普遍理性理解为同一秩序的不同名称`,`承认外部事件不由个人完全支配`,`把善限定为理性意志的德性`,`使个人目的与整体自然相协调`],conclusion:`合乎自然生活不是被动接受一切，而是把价值判断集中于能够成为自己行动原则的部分。`}],concepts:[{zh:`同意`,en:`assent / synkatathesis`,definition:`心灵对印象作出认可的环节。外部刺激可以强迫印象出现，却不等于已经证明它真实或值得追随。`},{zh:`认知印象`,en:`cognitive impression / katalēptikē phantasia`,definition:`被设想为由真实对象以足够清楚方式造成、可以成为知识基础的印象；学院怀疑派后来集中攻击这一标准。`},{zh:`逻各斯`,en:`logos / cosmic reason`,definition:`贯穿物质世界、组织因果与目的的理性原则；在早期斯多葛主义中它不是脱离世界的非物质存在。`},{zh:`合乎自然生活`,en:`living according to nature`,definition:`使人的理性能力与整体自然秩序一致。该公式由早期学派逐步定型，不应只理解成服从本能。`},{zh:`德性是唯一的善`,en:`virtue as the only good`,definition:`健康、财富、地位本身不决定生活好坏；真正的善在于理性选择的品质。后来的斯多葛派用“可取的无差别物”处理现实选择。`}],lineage:{inherited:`由犬儒派继承自足和德性优先，由苏格拉底传统继承灵魂照料，由赫拉克利特获得火、逻各斯和宇宙循环语言，同时吸收麦加拉派与学院的辩证训练。`,school:`创立早期斯多葛主义，但现存‘斯多葛体系’大多经过克里安西斯的保存和克律西波斯的重构；创始与成熟体系必须分开。`,influenced:`克里安西斯直接继承学园，克律西波斯完成系统化；经中期斯多葛主义和罗马作者，德性、自然法与内在自由进入欧洲伦理传统。`,parallel:`与伊壁鸠鲁都回应希腊化世界的不安全，并重视哲学治疗；前者相信理性天意和公共责任，后者以原子偶然性、友谊共同体和降低欲望获得安定。`},comparisons:[{target:`犬儒派`,relation:`承接前人`,shared:`德性、自足和减少外物支配。`,difference:`芝诺把激进生活姿态扩展为包含逻辑和宇宙论的完整体系，并保留较多社会角色与共同体义务。`},{target:`赫拉克利特`,relation:`后世重构`,shared:`火、逻各斯、对立统一与宇宙秩序。`,difference:`斯多葛派把零散格言系统化为实体论、天意论和循环宇宙论，不能视作未经变化的直接复制。`},{target:`克律西波斯`,relation:`影响后继`,shared:`逻辑、物理与伦理互相支撑，德性要求合乎自然。`,difference:`芝诺提出方向；克律西波斯细化命题逻辑、心理过程和决定论，使之成为可辩护的学派体系。`},{target:`伊壁鸠鲁`,relation:`同题比较`,shared:`都把哲学变成解除恐惧和获得稳定生活的方法。`,difference:`芝诺接受天意与公共义务；伊壁鸠鲁拒绝神意治理，并倾向从政治竞争中退出。`}],russellView:`罗素把芝诺描绘成重德性、厌恶形而上精微的唯物论者：神、灵魂和德性都必须在实体世界中得到说明。他强调斯多葛主义把赫拉克利特式宇宙火、严格决定论和有益天意结合起来，又由‘德性是唯一的善’推出外物不能伤害贤者的内在自由。`,modernCorrection:`“可控制／不可控制”是爱比克泰德最鲜明的表达，不宜原样倒置给芝诺。现代研究也比罗素更强调早期体系的逻辑—物理—伦理一体性，并提醒我们：资料多来自敌对作者和数百年后的编纂者，学派共识与创始人本人观点无法处处拆分。`,sources:[oe(`第一卷第二十八章〈斯多葛主义〉`),se,ce]},{id:`cleanthes`,order:22,nameZh:`克里安西斯`,nameEn:`Cleanthes of Assos`,greekName:`Κλεάνθης`,dates:`约前 331—前 232`,active:`前 3 世纪中叶`,places:[`阿索斯`,`雅典`,`彩绘柱廊`],school:`早期斯多葛主义`,figureId:`cleanthes`,chapterIds:[`b1-28`],thesis:`既然命运是贯穿宇宙的理性秩序，人的自由不是改变必然链条，而是由理解转向自愿同行；不愿同行者仍会被因果整体带走。`,evidenceCaution:`作品仅存《宙斯颂》及若干残片，生平多依赖第欧根尼·拉尔修的晚期资料。罗素只突出两项事例，不能据此把他的全部工作缩减为宗教诗和反日心说。`,lifeSummary:`克里安西斯来自小亚细亚阿索斯，传统称他早年以拳击或体力劳动维生，白天听芝诺讲学、夜间汲水。无论细节是否可靠，这一形象说明古人如何把他的耐力与斯多葛德性联系起来。芝诺死后，他成为第二任学园领袖，维持学派约三十年。《宙斯颂》把神、自然法、逻各斯和命运写成可祈祷的宇宙秩序，是早期斯多葛宗教感最完整的残存文本。`,timeline:[{date:`约前 331`,place:`阿索斯`,title:`出生`,detail:`确切年代不明；来自爱琴海东岸，而非雅典本地精英。`,certainty:`推定`},{date:`前 3 世纪初`,place:`雅典`,title:`成为芝诺学生`,detail:`夜间劳动支付学习生活的故事属于传统记载，但其长期从学和贫困形象较稳定。`,certainty:`传统记载`},{date:`约前 262`,place:`雅典彩绘柱廊`,title:`继承学园`,detail:`芝诺去世后主持斯多葛学派，守住早期教义并培养克律西波斯。`,certainty:`较可靠`},{date:`约前 232`,place:`雅典`,title:`去世`,detail:`绝食而死的细节具有哲学家传记的典型色彩；年代本身较常采用。`,certainty:`传统记载`}],inquiries:[{object:`命运与自愿`,question:`同一必然事件，为什么可以被自由地接受，也可以被强迫地承受？`,start:`因果秩序不会因个人愿望暂停，但人的判断可以理解或误认自己在整体中的位置。`,steps:[`确认宇宙由理性法则统摄`,`区分事件发生与主体对事件的意愿`,`训练意愿与自然目标一致`,`把反抗必然造成的附加痛苦归因于错误判断`],conclusion:`著名的车与狗比喻表达兼容结构：车必然前进，狗可以同行或被拖行；自由是意愿与必然的协调。`},{object:`自然、神与虔敬`,question:`自然法为何不仅是物理事实，也能成为伦理规范？`,start:`同一逻各斯既维持宇宙秩序，也使人具有推理和理解共同法则的能力。`,steps:[`把宙斯理解为普遍理性而非任性人格神`,`由共同理性说明自然的整体关联`,`把善理解为自觉参与这一秩序`,`以赞颂和服从把知识转化为生活态度`],conclusion:`《宙斯颂》把物理学、神学和伦理压缩为同一关系：理解宇宙秩序，就是学习怎样自愿生活。`}],concepts:[{zh:`《宙斯颂》`,en:`Hymn to Zeus`,definition:`现存最完整的早期斯多葛文本，以宗教诗形式把宙斯、逻各斯、共同法和命运联系起来。`},{zh:`自愿同行`,en:`willing agreement with fate`,definition:`不能取消必然性，但可以让自己的愿望与必然秩序一致；这比简单的被动忍耐多出理解与意愿层。`},{zh:`宇宙自然`,en:`cosmic nature`,definition:`克里安西斯把“合乎自然”主要解释为合乎整体宇宙秩序；克律西波斯后来更明确加入人的理性本性。`},{zh:`宇宙大火`,en:`cosmic conflagration / ekpyrōsis`,definition:`世界周期性归于神性之火再重新展开的学说；罗素用它凸显斯多葛决定论与永恒重复。`}],lineage:{inherited:`直接继承芝诺，将赫拉克利特式火与逻各斯、苏格拉底式德性和犬儒式坚忍转化为更具宗教情感的宇宙伦理。`,school:`第二任学园领袖，首要贡献是保存、解释和人格化早期教义；不是像克律西波斯那样的大规模系统重建者。`,influenced:`培养克律西波斯并把学园交给下一代；《宙斯颂》的自然神学语言也成为理解斯多葛虔敬和后来宗教接受的重要证据。`,parallel:`与斯宾诺莎都把自由理解为认识必然性后的主动一致，但两者实体论、情感理论和历史语境完全不同，只能作结构比较。`},comparisons:[{target:`季蒂昂的芝诺`,relation:`承接前人`,shared:`神、自然、命运和理性构成同一宇宙秩序。`,difference:`克里安西斯更突出宇宙自然、虔敬和意愿服从，并以诗歌保存教义。`},{target:`克律西波斯`,relation:`影响后继`,shared:`合乎自然生活与决定论宇宙。`,difference:`克里安西斯偏重整体自然和宗教表达；克律西波斯扩展人的本性、逻辑和心理机制。`},{target:`伊壁鸠鲁`,relation:`同题比较`,shared:`都要消除人对命运和死亡的扰动。`,difference:`克里安西斯以信任理性天意获得安定；伊壁鸠鲁否认天意介入，以自然偶然性解除神罚恐惧。`}],russellView:`罗素说克里安西斯主要因两件事值得注意：主张应以不敬神罪起诉日心说的阿里斯塔克斯，以及留下《宙斯颂》和一首服从命运的祈祷。后者被罗素用来呈现斯多葛决定论的宗教情感。`,modernCorrection:`罗素的取材有意尖锐，却容易遮蔽克里安西斯在早期学派连续性、灵魂学说和伦理公式发展中的位置。反日心说的轶事也不应成为评价其全部哲学的捷径；其文本残缺决定了页面应短而明确，而不是补成虚假的完整体系。`,sources:[oe(`第一卷第二十八章〈斯多葛主义〉`),se,ce]},{id:`chrysippus`,order:23,nameZh:`克律西波斯`,nameEn:`Chrysippus of Soli`,greekName:`Χρύσιππος`,dates:`约前 280—前 207`,active:`约前 230—前 207`,places:[`索利`,`雅典`,`彩绘柱廊`],school:`早期斯多葛主义`,figureId:`chrysippus`,chapterIds:[`b1-28`],thesis:`德性不是孤立格言的结果，而是一个系统：命题逻辑训练正确推断，物理学说明理性自然，心理学解释印象与同意，伦理学据此界定能负责的行动。`,evidenceCaution:`据说著书七百余卷，现无完整作品，只能由残片及西塞罗、普鲁塔克、盖伦等常带批评目的的见证重构。许多通称“斯多葛”的成熟学说可能主要来自他，却难逐项确定。`,lifeSummary:`克律西波斯出生于小亚细亚索利，在雅典从学克里安西斯，也接触学院派辩证法。约前 230 年成为第三任学园领袖。学派曾在克里安西斯时期声势减弱，他以庞大写作和精密论证重建逻辑、知识论、物理学、心理学与伦理学，使斯多葛主义获得与柏拉图学院和伊壁鸠鲁学派长期竞争的能力。古代所谓“若无克律西波斯，便无斯多葛”准确概括了他的结构性位置。`,timeline:[{date:`约前 280`,place:`索利（奇里乞亚）`,title:`出生`,detail:`来自希腊化东方城市；家庭财产与早年长跑经历主要见于晚期传记。`,certainty:`推定`},{date:`前 3 世纪中叶`,place:`雅典`,title:`学习并独立讲授辩证法`,detail:`师从克里安西斯，同时吸收学院论辩；后来以回应怀疑派攻击著称。`,certainty:`较可靠`},{date:`约前 230`,place:`雅典彩绘柱廊`,title:`成为第三任学园领袖`,detail:`开始大规模整理并辩护学派各部分，使斯多葛主义成为高度系统化传统。`,certainty:`较可靠`},{date:`前 207`,place:`雅典`,title:`去世`,detail:`具体死因有饮酒或大笑等互相冲突的轶事；只宜保留大致年代。`,certainty:`较可靠`}],inquiries:[{object:`命题逻辑`,question:`推理的有效性是否只能由主词—谓词和范畴三段论说明？`,start:`日常论证常以“如果……那么……”“或者……”“不可能同时……”连接整个命题，而非比较概念的包含关系。`,steps:[`把可真可假的完整命题作为基本单位`,`识别否定、合取、析取和条件关系`,`建立若干不可证明式作为推理骨架`,`用规则把复杂论证还原为有效形式`],conclusion:`形成区别于亚里士多德词项逻辑的命题逻辑传统；它不是现代逻辑的原样前身，却处理了现代人熟悉的联结词推理。`},{object:`决定论与责任`,question:`一切有原因时，人的同意为什么不只是外因推动？`,start:`命运是完整因果网络，但同一外部推动会因对象自身结构不同而产生不同运动。`,steps:[`承认印象和处境有先行原因`,`把主体性格与判断纳入完整原因`,`以圆柱受推后按自身形状滚动说明内在因`,`区分无原因偶然与由主体结构产生的行动`],conclusion:`责任不要求脱离因果，而要求行动通过主体的判断与性格成为自己的行动；这是古代兼容论的重要模型。`},{object:`情绪与价值判断`,question:`恐惧、愤怒等激情为何能接受理性治疗？`,start:`激情不只是身体冲击，也包含“外物极其善恶、现在必须如此反应”的认可。`,steps:[`识别引发情绪的印象`,`分离最初反应与后续同意`,`检验外物是否真正决定善恶`,`用反复练习重塑冲动和稳定性格`],conclusion:`错误价值判断使冲动过度并成为激情；改变判断能够改变情绪轨迹，但并非要求人瞬间消除一切自然反应。`}],concepts:[{zh:`可说之物`,en:`lekton / sayable`,definition:`话语所表达、可以为真或假的意义内容；它既不是声音，也不是外部物体，是斯多葛语义学的重要非物体对象。`},{zh:`不可证明式`,en:`indemonstrables`,definition:`无需由其他形式证明的基本有效推理模式，例如肯定前件和否定后件式；复杂论证可由规则归约到它们。`},{zh:`共命运`,en:`co-fated events`,definition:`结果与实现它的行动条件共同属于因果链；“命定会康复”并不排除必须找医生，借此反驳宿命论式不行动。`},{zh:`气息`,en:`pneuma`,definition:`由火与气构成、贯穿物质并赋予组织和张力的主动原则；在人身上承担灵魂和认知活动。`},{zh:`激情判断论`,en:`passions as judgments`,definition:`激情包含错误或失度的价值判断与冲动；理性治疗针对的是认可结构，不只是压制表情。`},{zh:`贤者`,en:`sage / sophos`,definition:`判断完全一致、只以德性为善的理想人物；它主要是规范标尺，不能假定普通实践者已经达到。`}],lineage:{inherited:`继承芝诺的三分体系和克里安西斯的自然伦理，并吸收麦加拉—辩证传统对条件命题、悖论和论证形式的长期研究。`,school:`第三任学园领袖和最重要的系统化者；早期斯多葛主义的成熟版本在很大程度上就是经他整理、辩护和扩展后的版本。`,influenced:`后续斯多葛派即使修正他的物理或心理学，也在其概念框架中工作；西塞罗、塞涅卡、爱比克泰德和马可·奥勒留保存并改造了其伦理遗产。`,parallel:`与亚里士多德都要给有效推理建立形式规则，但亚里士多德以词项和范畴命题为中心，克律西波斯以完整命题及其联结关系为中心。`},comparisons:[{target:`季蒂昂的芝诺`,relation:`承接前人`,shared:`哲学由逻辑、物理和伦理构成一个系统。`,difference:`芝诺提供纲领；克律西波斯增加技术细节，并回应怀疑派、学院派和宿命论反驳。`},{target:`克里安西斯`,relation:`承接前人`,shared:`宇宙决定论、天意与合乎自然生活。`,difference:`克里安西斯偏重宇宙自然和宗教表达；克律西波斯突出人的理性本性、命题逻辑和心理机制。`},{target:`亚里士多德`,relation:`同题比较`,shared:`都系统研究有效推理、原因、灵魂与德性。`,difference:`两者逻辑基本单位和实体论不同；斯多葛派坚持只有物体能作用或受作用。`},{target:`卡尔内阿德`,relation:`批评关系`,shared:`都围绕知识标准、有效推断和行动依据展开。`,difference:`克律西波斯维护可靠印象和系统知识；卡尔内阿德以不可区分反例和相反论证削弱确定性。`}],russellView:`罗素称他多产而使斯多葛主义变得系统且学院化，特别指出假言与析取推理、语法研究和经验主义知识论。他也用其关于善恶相互蕴含、灵魂存续和神义论的说法，展示决定论、天意与恶之间难以完全消除的张力。`,modernCorrection:`罗素承认其逻辑贡献，却未充分展开斯多葛命题逻辑的技术独立性。现代研究通常也不把斯多葛决定论直接等同于消极宿命论：同意、性格原因与共命运论证正是为保存行动和责任而提出。`,sources:[oe(`第一卷第二十八章〈斯多葛主义〉`),{label:`Internet Encyclopedia of Philosophy · Chrysippus`,kind:`补充`,url:`https://iep.utm.edu/chrysippus/`},se]},{id:`panaetius`,order:24,nameZh:`帕奈提奥斯`,nameEn:`Panaetius of Rhodes`,greekName:`Παναίτιος`,dates:`约前 185—前 109`,active:`前 2 世纪后半叶`,places:[`罗得岛`,`雅典`,`罗马`],school:`中期斯多葛主义`,figureId:`panaetius`,chapterIds:[`b1-28`,`b1-29`],thesis:`伦理不能只描述几乎不存在的完美贤者，还要说明普通人在具体身份、能力和政治关系中怎样选择恰当行动；这使斯多葛主义能够进入罗马公共生活。`,evidenceCaution:`作品失传，主要经西塞罗及其他见证重构。《论义务》前两卷明确借鉴他的同名著作，但西塞罗的罗马改写不能逐句当作帕奈提奥斯原文。`,lifeSummary:`帕奈提奥斯生于罗得岛，先在雅典进入斯多葛传统，后与小西庇阿为核心的罗马精英圈交往并随其出行。约前 129 年主持雅典学园。他处在罗马征服希腊世界、共和国精英需要吸收希腊教育为公共伦理服务的节点：弱化早期学派较难被罗马常识接受的宇宙大火、占卜和灵魂存续学说，转而突出角色、义务和现实判断。`,timeline:[{date:`约前 185`,place:`罗得岛`,title:`出生`,detail:`来自重要海上城邦和希腊教育中心；具体年份为后世推定。`,certainty:`推定`},{date:`前 2 世纪中叶`,place:`雅典`,title:`进入斯多葛学派`,detail:`从学于第欧根尼与安提帕特等学园领袖，并吸收柏拉图和亚里士多德传统。`,certainty:`较可靠`},{date:`约前 145—前 139`,place:`罗马及地中海`,title:`进入小西庇阿交往圈`,detail:`与罗马政治精英的友谊使斯多葛伦理直接面对统治、外交与公共角色。`,certainty:`较可靠`},{date:`约前 129—前 109`,place:`雅典`,title:`主持学园并写作《论义务》`,detail:`著作失传，但经西塞罗《论义务》成为斯多葛伦理进入拉丁世界的关键渠道。`,certainty:`较可靠`}],inquiries:[{object:`角色与恰当行动`,question:`尚未成为贤者的人，怎样在家庭、职业和政治角色中作出可执行的选择？`,start:`“德性是唯一的善”给出最高尺度，却不能直接回答每个普通人此刻应任什么职、承担何种风险。`,steps:[`承认人共有理性和社会本性`,`辨认个人禀赋、处境与所承担角色`,`区分真正德性与仍可合理选择的外物`,`在冲突义务中寻找与整体人格一致的行动`],conclusion:`恰当行动把理想伦理转译为普通人的角色实践；哲学由极端贤者模型进入可持续的公共生活。`},{object:`传统修正`,question:`一个学派怎样在保持核心身份时放弃部分旧教义？`,start:`早期斯多葛主义的宇宙大火、占星和严格物质灵魂论并非伦理实践的每一部分都必需。`,steps:[`保留德性、自然和社会义务的核心`,`吸收柏拉图与亚里士多德的可用分析`,`降低争议物理学对伦理的负担`,`以罗马制度和日常责任检验理论可用性`],conclusion:`学派连续性可以依靠反复使用的问题结构和实践方法，而不是要求历代成员重复全部命题。`}],concepts:[{zh:`恰当行动`,en:`appropriate action / kathēkon`,definition:`在人的自然、关系和具体处境中能够给出合理说明的行动；它不等于只有完美贤者才能完成的完全德性行为。`},{zh:`角色伦理`,en:`role ethics / personae`,definition:`共同人性、个人禀赋、处境和自选生活道路共同限定行动；主要由西塞罗保存，具体归属需谨慎。`},{zh:`义务`,en:`duty / officium`,definition:`西塞罗以 officium 转译希腊伦理中的恰当行动，使其进入罗马公民、家庭和行政语言。`},{zh:`中期斯多葛主义`,en:`Middle Stoicism`,definition:`现代史学常用的阶段标签，指前 2—1 世纪斯多葛派对柏拉图主义、现实伦理与罗马文化的重新接合；其边界仍有争论。`}],lineage:{inherited:`继承早期斯多葛的德性、自然和社会性框架，同时与柏拉图学院和亚里士多德传统更积极对话。`,school:`中期斯多葛主义的转折人物：不是抛弃学派，而是降低部分宇宙论承诺，把伦理重心移向恰当行动和现实角色。`,influenced:`直接教导波塞多尼奥斯；其《论义务》经西塞罗改写，长期影响罗马伦理、基督教道德论和近代公共责任语言。`,parallel:`与亚里士多德实践智慧都强调行动要看角色和情境；但帕奈提奥斯仍保留斯多葛的共同理性、德性唯一善及宇宙共同体背景。`},comparisons:[{target:`克律西波斯`,relation:`承接前人`,shared:`德性、自然理性和人的社会性构成伦理基础。`,difference:`帕奈提奥斯弱化部分物理和占卜教义，更集中于非贤者的恰当行动与公共角色。`},{target:`西塞罗`,relation:`影响后继`,shared:`以义务、角色和共同人性组织公共伦理。`,difference:`西塞罗不是斯多葛派，并把希腊材料转译到罗马共和国政治和拉丁修辞中。`},{target:`波塞多尼奥斯`,relation:`影响后继`,shared:`扩大与柏拉图主义和其他学科的对话。`,difference:`波塞多尼奥斯重新加强宇宙论、灵魂论和科学研究，体系范围远大于现存帕奈提奥斯伦理证据。`}],russellView:`罗素用很短篇幅把帕奈提奥斯标为斯多葛主义的重要修改者：加入柏拉图主义成分、放弃物质主义，并通过与小西庇阿和西塞罗的关系使斯多葛主义为罗马所知。下一章又提到他赞赏罗马政体的混合结构。`,modernCorrection:`“放弃物质主义”可能把复杂变化说得过整齐；现存证据不足以重建完整体系。更可靠的学习定位是传播与重心转移：他使恰当行动、角色和公共义务成为斯多葛主义跨入罗马世界的高连接节点。`,sources:[oe(`第一卷第二十八章〈斯多葛主义〉及第二十九章〈罗马帝国与文化的关系〉`),se,ce]},{id:`posidonius`,order:25,nameZh:`波塞多尼奥斯`,nameEn:`Posidonius of Apamea`,greekName:`Ποσειδώνιος`,dates:`约前 135—前 51`,active:`前 1 世纪前期`,places:[`阿帕米亚`,`雅典`,`罗得岛`,`西地中海`],school:`中期斯多葛主义`,figureId:`posidonius`,chapterIds:[`b1-28`],thesis:`人的情绪、城邦历史、海潮和星辰不是分散题目，而是同一个有机宇宙在不同尺度上的表现；哲学应以跨学科观察恢复部分与整体的联系。`,evidenceCaution:`大量著作仅存残片，且许多说法由盖伦、斯特拉波、西塞罗等各有目的的作者转述。旧研究曾把几乎所有后期斯多葛变化归给他，现代研究对此更谨慎。`,lifeSummary:`波塞多尼奥斯生于叙利亚阿帕米亚，在塞琉古世界衰落的背景下西行，赴雅典从学帕奈提奥斯，后定居罗得岛并主持学园。他旅行至西班牙、加的斯和高卢，观察海潮、气候与不同社会，同时写作天文、地理、历史、灵魂和伦理。西塞罗曾听其讲学，庞培也拜访过他。他是把希腊学派知识转接给罗马精英、又把斯多葛主义重新扩展为宇宙综合体系的关键人物。`,timeline:[{date:`约前 135`,place:`阿帕米亚（叙利亚）`,title:`出生于塞琉古世界晚期`,detail:`罗素以叙利亚政治失序解释其西行愿望，这是有启发性的历史联系，不是可直接证明的个人动机。`,certainty:`推定`},{date:`前 2 世纪末`,place:`雅典`,title:`从学帕奈提奥斯`,detail:`接受斯多葛训练，并发展与柏拉图、亚里士多德和毕达哥拉斯传统的广泛对话。`,certainty:`较可靠`},{date:`约前 100 前后`,place:`西地中海／大西洋沿岸`,title:`旅行与自然观察`,detail:`研究加的斯潮汐、天文距离、气候和民族习俗，把实地材料纳入宇宙与历史解释。`,certainty:`较可靠`},{date:`前 1 世纪前期`,place:`罗得岛`,title:`教学并连接罗马知识界`,detail:`西塞罗约前 78 年听讲，庞培两度来访；其著作成为罗马理解希腊哲学和科学的重要渠道。`,certainty:`较可靠`},{date:`约前 51`,place:`罗得岛`,title:`去世`,detail:`作品随后大量散失，只能由后世引用重构其跨学科体系。`,certainty:`推定`}],inquiries:[{object:`灵魂与激情`,question:`若激情只是错误判断，为什么明知不该仍会被欲望或愤怒牵引？`,start:`经验显示情绪具有速度、身体牵引和非理性动力，不能总被还原为一次冷静的错误推论。`,steps:[`保留理性同意在责任中的作用`,`承认灵魂中存在类似欲望与意气的非理性运动`,`借柏拉图分析内部冲突`,`以习惯、教育和身体条件解释情绪强度`],conclusion:`伦理治疗既要修正判断，也要训练非理性倾向；这不是简单放弃斯多葛主义，而是扩大其心理模型。`},{object:`宇宙关联与科学`,question:`局部观察怎样进入一个统一的自然体系？`,start:`潮汐、月相、气候、地理和社会习俗呈现跨尺度相关性，单一地点经验不足以解释。`,steps:[`通过旅行收集差异材料`,`以测量和数学寻找稳定关系`,`把地球现象嵌入天文周期`,`用宇宙整体的相互作用解释局部变化`],conclusion:`哲学不应只向内训练意志；自然观察、历史和地理同样帮助理解人所处的理性整体。`},{object:`灵魂命运与宇宙层级`,question:`人的灵魂怎样同时属于身体生活与更高宇宙秩序？`,start:`斯多葛的物质灵魂和柏拉图的灵魂升降提供两套不同资源。`,steps:[`保持宇宙由神性气息贯穿`,`吸收灵魂可在死后存续的层级想象`,`以灵魂纯净程度解释上升差异`,`把星辰、占星和宇宙同感连入同一图景`],conclusion:`波塞多尼奥斯形成较折衷的灵魂宇宙论；它连接中期斯多葛主义、新毕达哥拉斯主义和后来宗教思想，但证据高度间接。`}],concepts:[{zh:`宇宙同感`,en:`cosmic sympathy / sympatheia`,definition:`宇宙各部分因共同的神性气息和整体组织而相互关联；可支撑自然研究，也曾被用于占星与占卜。`},{zh:`非理性运动`,en:`non-rational movements`,definition:`灵魂中不能完全化约为理性判断的欲望和意气倾向；对其确切理论应避免仅据盖伦的批评性转述下结论。`},{zh:`跨尺度解释`,en:`cross-scale explanation`,definition:`把天文周期、海潮、气候、地理与人类生活放进一个相互作用的宇宙；是本站对其研究方法的压缩标签。`},{zh:`灵魂升降`,en:`ascent and descent of soul`,definition:`灵魂死后依其纯净程度在宇宙层级中上升或滞留的理论；罗素强调它吸收了柏拉图、俄耳甫斯和新毕达哥拉斯成分。`},{zh:`历史的自然条件`,en:`natural conditions of history`,definition:`用地理、气候、资源和社会性格的关联解释历史差异；不是现代决定论模型，却扩大了古代史学的解释范围。`}],lineage:{inherited:`直接继承帕奈提奥斯，又重新吸收柏拉图的灵魂论、毕达哥拉斯式宇宙关联，并延续斯多葛物理学与自然神学。`,school:`中期斯多葛主义的综合者：把学派从现实义务再扩展到心理学、历史、地理和天文学，形成希腊化知识的末期总汇。`,influenced:`西塞罗直接听讲并大量传播其思想；斯特拉波、塞涅卡等保存其科学材料，其灵魂和宇宙层级也为后来的宗教哲学提供过渡语汇。`,parallel:`与亚里士多德都跨越自然、灵魂、伦理和政治研究，但波塞多尼奥斯更强调宇宙同感，并处在罗马扩张形成的新地理视野中。`},comparisons:[{target:`帕奈提奥斯`,relation:`承接前人`,shared:`与柏拉图传统对话，并把斯多葛主义连接罗马世界。`,difference:`帕奈提奥斯偏重义务和角色；波塞多尼奥斯恢复宏大宇宙论并扩展实地科学研究。`},{target:`克律西波斯`,relation:`批评关系`,shared:`保留宇宙理性、命运和情绪治疗。`,difference:`波塞多尼奥斯更认真承认非理性心理运动，不把激情简单处理成单一错误判断。`},{target:`西塞罗`,relation:`影响后继`,shared:`把希腊哲学、政治伦理和罗马公共语言连接。`,difference:`波塞多尼奥斯仍建构斯多葛宇宙体系；西塞罗以学院派立场选择、翻译并比较诸学派。`},{target:`普罗提诺`,relation:`同题比较`,shared:`都以层级和整体关联处理灵魂与宇宙。`,difference:`波塞多尼奥斯仍重旅行、测量和物质宇宙；普罗提诺把最高真实置于超越感性的太一与精神。`}],russellView:`罗素对他的评价明显高于篇幅：不仅称其折衷哲学家，还详细写到叙利亚背景、西行旅行、潮汐研究、天文学和续写波利比乌斯。他特别强调其柏拉图化灵魂论、占星和死后上升，并认为这些成分可能为诺斯替主义铺路。`,modernCorrection:`罗素依赖早期二十世纪的“中期斯多葛主义”叙事，容易把他塑造成从严格斯多葛主义走向神秘主义的单线桥梁。现代重构更重视资料碎片性：他确有跨学科和折衷倾向，但具体理论不能只由后世影响倒推。`,sources:[oe(`第一卷第二十八章〈斯多葛主义〉`),se,ce]},{id:`seneca`,order:26,nameZh:`塞涅卡`,nameEn:`Lucius Annaeus Seneca`,greekName:`Lucius Annaeus Seneca`,dates:`约前 4—公元 65`,active:`公元 41—65`,places:[`科尔多瓦`,`罗马`,`科西嘉`],school:`罗马斯多葛主义`,figureId:`seneca`,chapterIds:[`b1-28`,`b1-29`],thesis:`哲学不是在无风险处谈德性，而是在财富、愤怒、丧失、时间压力和权力妥协中反复检查判断；正因为实践会失败，日常操练才有必要。`,evidenceCaution:`著作保存较丰富，但政治生平主要来自塔西佗、苏埃托尼乌斯和卡西乌斯·狄奥，评价立场不同。高利贷引发不列颠起义等说法存在争议；不能只据道德轶事裁定其全部行为。`,lifeSummary:`塞涅卡生于西班牙科尔多瓦的罗马骑士家庭，在罗马受教育并进入元老院政治。公元 41 年被克劳狄乌斯流放科西嘉，49 年由小阿格里皮娜召回，成为尼禄教师，54 年后与布鲁斯共同参与帝国治理。随着尼禄统治恶化，他逐步退隐，65 年被命令自杀。其作品跨越书信、安慰文、自然研究、悲剧和政治劝诫，把斯多葛伦理置于最不纯粹的权力环境中。`,timeline:[{date:`约前 4`,place:`科尔多瓦`,title:`出生于罗马行省精英家庭`,detail:`幼年赴罗马，接受修辞与哲学教育；确切出生年在前 4 与公元 1 年等方案间有争议。`,certainty:`推定`},{date:`公元 41—49`,place:`科西嘉`,title:`被流放`,detail:`官方指控涉及通奸，背后也有宫廷政治；流放期写安慰作品，并在求归与哲学自持之间留下明显张力。`,certainty:`较可靠`},{date:`公元 49—54`,place:`罗马`,title:`召回并教育尼禄`,detail:`由小阿格里皮娜安排成为皇子教师，哲学家由私人写作者进入皇权核心。`,certainty:`较可靠`},{date:`公元 54—62`,place:`罗马`,title:`参与帝国治理`,detail:`在尼禄初期担任顾问并积累巨额财富；《论宽仁》尝试把君主自制变成政治原则。`,certainty:`较可靠`},{date:`公元 65`,place:`罗马近郊`,title:`被命令自杀`,detail:`卷入皮索阴谋后按皇命自尽；塔西佗的死亡叙事具有强烈文学塑造，但事件本身可靠。`,certainty:`较可靠`}],inquiries:[{object:`激情与愤怒`,question:`愤怒是维护正义的必要动力，还是失控判断？`,start:`受伤的最初震动可能不可避免，但“我受辱且必须报复”需要心灵继续认可。`,steps:[`区分最初身体反应与完整激情`,`识别夸大伤害和报复价值的判断`,`通过延迟、换位和预演削弱同意`,`以稳定的正义行动取代情绪爆发`],conclusion:`正义不需要愤怒作燃料；激情是加速并拒绝修正的判断，训练目标是恢复可审查的行动间隔。`},{object:`时间与死亡`,question:`人生短暂是自然事实，还是使用方式造成的体验？`,start:`人把时间交给名望、事务和他人期待，同时把真正生活推迟到不确定的未来。`,steps:[`把每日时间视为不可回收的所有物`,`预想死亡和丧失以校准价值`,`减少不能形成自主目的的忙碌`,`用回顾和写作检查一天的判断`],conclusion:`生命并非单纯太短，而是大量时间未被占有；死亡练习让当下行动获得边界，而非鼓励消极等死。`},{object:`权力、财富与一致性`,question:`拥有财富和政治权力的人还能否真诚主张外物无关善恶？`,start:`斯多葛主义允许选择健康、资源和职位，但不允许把它们当作德性的替代品。`,steps:[`区分善与可取的无差别物`,`检验获取和使用财富的方式`,`把政治权力限定为服务与克制`,`承认实践者处于进步而非完美贤者状态`],conclusion:`财富本身不能自动反驳斯多葛伦理，但行为与教诲间的差距仍是实质证据；哲学必须允许公共检验。`}],concepts:[{zh:`道德进步者`,en:`progressor / proficiens`,definition:`尚非贤者、但通过练习减少错误判断的人；它让伦理成为可持续过程，也防止用完美标准掩饰现实责任。`},{zh:`预演逆境`,en:`premeditation of adversity`,definition:`提前想象疾病、贫困、流放或死亡，检查自己是否把外物误判为绝对恶，并准备合宜行动。`},{zh:`每日省察`,en:`daily self-examination`,definition:`在一天结束时回顾愤怒、恐惧和选择；不是自我羞辱，而是把经验变成下一次判断的材料。`},{zh:`宽仁`,en:`clemency / clementia`,definition:`掌权者在有惩罚能力时依据理性节制惩罚；不同于软弱或任性赦免，是面向君主的政治自制。`},{zh:`时间占有`,en:`ownership of time`,definition:`把时间视为最易被他人和事务夺走、又无法补回的资源；哲学首先要求辨认时间流向。`},{zh:`可取的无差别物`,en:`preferred indifferent`,definition:`健康、财富等不是道德善，却通常有合理选择价值；这一层级使斯多葛伦理能够处理现实决策。`}],lineage:{inherited:`继承早期斯多葛的激情判断论、德性唯一善和自然共同体，也常引用伊壁鸠鲁，显示敌对学派之间可以共享有用的生活训练。`,school:`罗马帝国斯多葛主义的拉丁写作者；贡献不在重建全部逻辑物理体系，而在发展书信、安慰、政治劝诫和日常练习的哲学形式。`,influenced:`早期基督教作者曾把他视为近似同道，文艺复兴和新斯多葛主义广泛阅读其作品；现代公众也常由其书信进入斯多葛主义。`,parallel:`与马可·奥勒留都在权力中训练自制，但塞涅卡是顾问和文人，文本面向读者劝说；《沉思录》主要是皇帝写给自己的提醒。`},comparisons:[{target:`伊壁鸠鲁`,relation:`同题比较`,shared:`限制欲望、经营时间、预备死亡并追求心灵稳定。`,difference:`塞涅卡保留天意、德性唯一善和公共角色；伊壁鸠鲁以快乐、友谊和非天意自然学组织生活。`},{target:`爱比克泰德`,relation:`同题比较`,shared:`外物不能决定善恶，哲学必须通过每日练习改变判断。`,difference:`塞涅卡以书信和政治处境讨论渐进修养；爱比克泰德以课堂反诘集中分析意志和印象使用。`},{target:`马可·奥勒留`,relation:`后世重构`,shared:`把权力角色变成自我约束而非价值来源。`,difference:`塞涅卡与尼禄的妥协构成公开一致性问题；马可作为最高统治者面对战争、行政和角色疲劳。`}],russellView:`罗素以明显反讽写他的巨富、高息借贷、尼禄教师身份和临终表演，认为后世更多按优美教诲而非可疑实践评价他；同时承认塞涅卡与后继者传播了普遍人爱、自然法和斯多葛伦理。`,modernCorrection:`不应以圣徒化故事遮蔽政治责任，也不应因人格不一致便跳过其哲学。塞涅卡的独特价值恰在“进步者”视角、文本体裁和制度内妥协：它使理论能被行为证据反向检验。罗素关于不列颠放贷与起义的因果联系也需标为争议说法。`,sources:[oe(`第一卷第二十八章〈斯多葛主义〉`),{label:`Stanford Encyclopedia · Seneca`,kind:`补充`,url:`https://plato.stanford.edu/entries/seneca/`},se]},{id:`epictetus`,order:27,nameZh:`爱比克泰德`,nameEn:`Epictetus`,greekName:`Ἐπίκτητος`,dates:`约公元 50—135`,active:`公元 1 世纪末—2 世纪初`,places:[`希拉波利斯`,`罗马`,`尼科波利斯`],school:`罗马斯多葛主义`,figureId:`epictetus`,chapterIds:[`b1-28`,`b1-29`],thesis:`事件、身体和名誉不完全由我决定，但如何使用印象、给予何种同意和选择怎样行动属于我的意志；自由是把欲望收回到这一能力范围。`,evidenceCaution:`本人没有留下可确认的著作；《论说集》和《手册》由学生阿里安记录、编辑，现存《论说集》仅四卷。奴隶时期因主人虐待致跛的故事无法确定，罗素采用的生卒年也已被现代研究修正。`,lifeSummary:`爱比克泰德出生于小亚细亚希拉波利斯，早年在罗马成为尼禄宫廷获释奴隶埃帕弗罗狄托斯的奴隶，并从斯多葛哲学家穆索尼乌斯·鲁弗斯学习。获释后从事教学；多米提安驱逐哲学家时，他迁往希腊西岸尼科波利斯建立学校。其课堂面向准备进入公共生活的青年，以尖锐问答反复训练欲望、行动和同意。学生阿里安保存的文本，使早期斯多葛的抽象结构变成最清晰的实践课程。`,timeline:[{date:`约公元 50`,place:`希拉波利斯`,title:`出生并在奴隶身份中成长`,detail:`出生年月、家庭与被带往罗马的过程不详；其名字本身意为“被获得者”。`,certainty:`推定`},{date:`公元 60—80 年代`,place:`罗马`,title:`从奴隶到哲学学生与教师`,detail:`隶属埃帕弗罗狄托斯并听穆索尼乌斯讲学；获释时间与腿疾原因均不能确定。`,certainty:`较可靠`},{date:`约公元 89—93`,place:`罗马／尼科波利斯`,title:`在驱逐哲学家的政策下迁居`,detail:`多米提安时期哲学家被逐，他转往伊庇鲁斯并长期办学。确切诏令年份有不同说法。`,certainty:`较可靠`},{date:`公元 2 世纪初`,place:`尼科波利斯`,title:`教学并由阿里安记录`,detail:`《论说集》保留课堂辩难，《手册》把核心训练压缩成便携纲要。`,certainty:`较可靠`},{date:`约公元 135`,place:`尼科波利斯`,title:`去世`,detail:`现代常用年代晚于罗素采用的约公元 100 年；晚年收养孩子等细节来自后世资料。`,certainty:`推定`}],inquiries:[{object:`控制与自由`,question:`奴役、疾病或暴政能夺走什么，又不能夺走什么？`,start:`身体、财产、名声和职位依赖他人及环境；判断、欲望和行动意向则以主体的理性使用为核心。`,steps:[`区分属于自己与不属于自己的事`,`停止要求外物必按愿望发生`,`把欲望集中于正确使用判断`,`在不可控结果中履行可控的行动责任`],conclusion:`自由不是控制世界，而是不把自身的善恶托付给世界；控制区分首先限制欲望，并不免除行动。`},{object:`印象与同意`,question:`遭遇发生到情绪和行动之间，哪里可以插入训练？`,start:`印象会自动出现，但“这是灾难”“我必须报复”是进一步的价值判断。`,steps:[`暂停并称其为一个印象`,`检查它涉及事实还是价值`,`用德性和角色标准审问`,`只对经检验的判断给予同意并行动`],conclusion:`哲学训练创造判断间隔；人不能阻止第一印象，却能逐步改变使用印象的习惯。`},{object:`角色与共同体`,question:`内在自由为什么不等于退出家庭、城邦和他人？`,start:`每个人既是理性主体，也是子女、父母、公民或朋友；角色提供具体行动材料。`,steps:[`由共同理性确认人是社会性存在`,`辨认当下关系所含责任`,`把结果与评价交还外部因果`,`以正义、自制和善意完成自己的部分`],conclusion:`只控制自己的判断并非只关心自己；恰当行动正是在无法控制他人的关系中保持人格一致。`}],concepts:[{zh:`控制二分`,en:`dichotomy of control`,definition:`有些事取决于我们，有些不取决于我们。现代口号容易过度简化；核心是区分意志活动与其外部材料和结果。`},{zh:`选择能力`,en:`volition / prohairesis`,definition:`评价印象、形成欲望并选择行动的理性能力，是人格与责任的中心，不等于脱离原因的任意意志。`},{zh:`印象的使用`,en:`use of impressions`,definition:`印象本身是材料，怎样解释、同意和转化为冲动决定其伦理意义。`},{zh:`三种训练`,en:`disciplines of desire, action, and assent`,definition:`约束欲望以接受发生之事，在关系中采取恰当行动，并检查印象真假；三者共同构成实践课程。`},{zh:`角色`,en:`role / prosōpon`,definition:`人在共同体中的具体位置与关系；扮演角色不等于迎合评价，而是用德性完成分配给自己的行动部分。`},{zh:`哲学操练`,en:`askēsis / practice`,definition:`通过课堂反诘、预演、提醒和实际选择把原则变成稳定习惯；仅能复述理论不算掌握哲学。`}],lineage:{inherited:`直接依赖芝诺、克里安西斯和克律西波斯，也受教师穆索尼乌斯影响；其尖锐问答和人格榜样尤其接近柏拉图笔下的苏格拉底与犬儒传统。`,school:`罗马帝国时期最具方法性的斯多葛教师，把早期逻辑—物理—伦理体系压缩为意志、印象和三种训练，但并未否认宇宙论背景。`,influenced:`学生阿里安保存其课程；马可·奥勒留明确阅读并吸收其教导，后世基督教、军事教育、心理治疗和现代斯多葛复兴均反复使用其控制区分。`,parallel:`现代认知行为治疗同样关注解释与情绪行为的关系，但不存在简单直线继承；临床方法、证据标准和治疗目标远比古代伦理训练具体。`},comparisons:[{target:`季蒂昂的芝诺`,relation:`承接前人`,shared:`外物不是善恶，同意与理性意志构成自由核心。`,difference:`芝诺建立完整学派结构；爱比克泰德以课堂语言把它集中为可重复的生活训练。`},{target:`塞涅卡`,relation:`同题比较`,shared:`以日常练习修正情绪、死亡恐惧和外物依赖。`,difference:`塞涅卡使用书信、文学与宫廷经验；爱比克泰德使用教师反诘和严格的意志范围分析。`},{target:`马可·奥勒留`,relation:`影响后继`,shared:`检查印象、接受自然、履行角色并保持内在统治。`,difference:`爱比克泰德是面向学生的教师；马可把同一结构变成皇帝在战争与行政中的私人提醒。`},{target:`皮浪`,relation:`同题比较`,shared:`都减少判断对心灵的扰动。`,difference:`皮浪传统对事物本性悬置断言；爱比克泰德确信德性、自然理性和正确同意可以成立。`}],russellView:`罗素用奴隶、跛足、被逐和尼科波利斯教学构造他与皇帝马可·奥勒留的社会反差，并大量引述其对暴君、死亡、兄弟关系和顺从神意的教导。罗素既赞赏其人格力量，也批评斯多葛伦理把外部伤害宣布为无关紧要。`,modernCorrection:`罗素给出的约公元 60—100 年已不是常用编年，现代多取约 50—135 年。控制二分也不应被读成“只管心态”：行动、关系与共同体义务属于意志正确使用的材料，只是成功结果不能作为德性的必要条件。`,sources:[oe(`第一卷第二十八章〈斯多葛主义〉`),{label:`Stanford Encyclopedia · Epictetus`,kind:`补充`,url:`https://plato.stanford.edu/entries/epictetus/`},{label:`Internet Encyclopedia of Philosophy · Epictetus`,kind:`补充`,url:`https://iep.utm.edu/epictetu/`}]},{id:`aurelius`,order:28,nameZh:`马可·奥勒留`,nameEn:`Marcus Aurelius`,greekName:`Marcus Aurelius Antoninus`,dates:`公元 121—180`,active:`公元 161—180 在位`,places:[`罗马`,`多瑙河边境`,`安条克`,`文多博纳／西尔米乌姆`],school:`罗马斯多葛主义`,figureId:`aurelius`,chapterIds:[`b1-28`,`b1-29`],thesis:`皇帝不能保证战争、瘟疫和他人服从，却必须管理自己的统治能力：把印象还原为事实、把角色转化为义务，并让每个行动服务于理性共同体。`,evidenceCaution:`《沉思录》是写给自己的练习笔记，不是完整体系或公开自传；写作时间与地点只能大致推定。其统治也必须结合法律、战争和基督徒受迫害等复杂史实，不能仅由私人伦理文字评价。`,lifeSummary:`马可生于罗马元老院家庭，少年受到哈德良关注，公元 138 年被安敦尼·毕尤收养，161 年继位并与卢基乌斯·维鲁斯共同执政。其统治长期面对东方战争、安敦尼瘟疫、多瑙河冲突和将领叛乱。《沉思录》多写于军营和行政压力中，记录他如何借爱比克泰德等斯多葛资源抵抗愤怒、虚荣和角色疲劳。它呈现的不是已经平静的圣人，而是需要不断重做判断的最高统治者。`,timeline:[{date:`公元 121`,place:`罗马`,title:`出生于元老院家庭`,detail:`早年接受拉丁修辞、希腊哲学与法律教育；《沉思录》第一卷以感谢教师和亲友保存其自我理解。`,certainty:`较可靠`},{date:`公元 138`,place:`罗马`,title:`被安敦尼·毕尤收养`,detail:`哈德良的继承安排使他成为未来皇帝，并在长期储君阶段学习行政。`,certainty:`较可靠`},{date:`公元 161`,place:`罗马`,title:`继位并实行共同统治`,detail:`与卢基乌斯·维鲁斯共同执政；随后面对帕提亚战争及军队带回的严重瘟疫。`,certainty:`较可靠`},{date:`约公元 170 年代`,place:`多瑙河边境`,title:`战争中写作《沉思录》`,detail:`部分卷标有“在夸迪人地区”等地点，显示私人练习与前线统治同时进行。`,certainty:`较可靠`},{date:`公元 180`,place:`多瑙河前线`,title:`病逝并由康茂德继位`,detail:`具体死亡地点在文多博纳与西尔米乌姆之间有争议；世袭继承也成为后世评价其政治判断的焦点。`,certainty:`较可靠`}],inquiries:[{object:`表象与事实`,question:`怎样阻止侮辱、痛苦和失败立即占据心灵？`,start:`事件首先以描述进入经验，随后才被附加“不可忍受”“对我有害”等价值判断。`,steps:[`暂停自动评价`,`把印象还原为颜色、声音、运动或身体变化`,`询问它是否损害理性与正义能力`,`选择与角色和共同善一致的回应`],conclusion:`去除附加判断不是否认事实，而是防止事件越权决定人格；真正伤害是让自身的统治能力变坏。`},{object:`角色义务与公共善`,question:`若德性只属于个人意志，为何皇帝还必须管理粮食、战争和法律？`,start:`人是理性且社会性的部分，角色所面对的外物虽非道德善，却是正义行动的材料。`,steps:[`把自己定位为共同体的一部分`,`由皇帝角色识别具体责任`,`尽力改善外部结果但不把结果等同德性`,`用共同善而非赞誉衡量行动意向`],conclusion:`内在自由不取消行政责任；正因为结果不可保证，行动原则和持续履责才成为可评价部分。`},{object:`宇宙视角与死亡`,question:`权力、名声和痛苦为何显得巨大，怎样恢复比例？`,start:`局部当下会遮蔽时间尺度和整体自然，使个人事件被误认为宇宙中心。`,steps:[`从高处想象城市、帝国与众生`,`把当下放入生成毁灭的长时段`,`记住施害者和受害者都将死亡`,`返回此刻可以完成的正义行动`],conclusion:`宇宙视角压缩虚荣和怨恨，但最终必须落回具体义务，否则只会成为疏离现实的心理技巧。`}],concepts:[{zh:`统治能力`,en:`ruling faculty / hēgemonikon`,definition:`组织印象、同意和行动的心灵中心；皇帝对帝国的统治被反转为首先治理自身判断。`},{zh:`去除判断`,en:`stripping impressions`,definition:`把奢侈、痛苦或侮辱还原为不带夸张价值的事实成分，以暴露欲望和厌恶添加的语言。`},{zh:`从高处观看`,en:`view from above`,definition:`在空间和时间大尺度上观看个人、城市和帝国，降低名望与怨恨的虚假重量。`},{zh:`世界城邦`,en:`cosmopolis`,definition:`所有理性存在者共享自然法的共同体；具体政治共同体是其中部分，正义不能只服务本城利益。`},{zh:`社会行动`,en:`social action`,definition:`人的自然功能是与他人合作；障碍可以改变行动路径，却不必破坏服务共同善的目的。`},{zh:`保留条件`,en:`reserve clause`,definition:`采取行动时附带“若无自然或义务阻碍”的条件，使坚定努力与接受不可控结果可以并存。`}],lineage:{inherited:`经教师鲁斯提库斯等人接触爱比克泰德，并阅读早期斯多葛作者；也选择性引用赫拉克利特、柏拉图、悲剧诗人甚至伊壁鸠鲁。`,school:`罗马斯多葛主义的实践见证者，而非另建学派的理论家；《沉思录》显示原则如何在最高权力、疾病、战争和家庭压力中被反复调用。`,influenced:`《沉思录》在近代成为最广泛阅读的斯多葛文本之一，影响伦理自省、领导观和现代斯多葛复兴；其政治形象也常被理想化使用。`,parallel:`与孔子传统都把角色修养和公共秩序相连，但自然法、宇宙论、礼与政治制度的理论结构不同；相似不能当作历史影响。`},comparisons:[{target:`爱比克泰德`,relation:`承接前人`,shared:`正确使用印象、把自由置于意志、以角色完成恰当行动。`,difference:`爱比克泰德在课堂中教方法；马可记录方法在皇权和前线决策中的反复应用。`},{target:`塞涅卡`,relation:`同题比较`,shared:`权力必须由自制、死亡练习和共同人性约束。`,difference:`塞涅卡面向他人写劝诫并处于顾问位置；马可主要写私人备忘且拥有最终行政权。`},{target:`伊壁鸠鲁`,relation:`同题比较`,shared:`都削弱死亡、名声和无穷欲望对生活的控制。`,difference:`马可强调天意整体、角色义务和公共服务；伊壁鸠鲁以非天意自然学和朋友共同体保护宁静。`},{target:`康德`,relation:`后世重构`,shared:`道德价值集中于行动原则和善意志，不以成功结果决定。`,difference:`康德以普遍法则和自主理性立论；马可把义务嵌入目的性宇宙、社会本性和具体角色。`}],russellView:`罗素先以瘟疫、地震、战争和叛乱说明其统治压力，再把《沉思录》读成一个疲惫而自律的人劝自己履责。他赞赏其人格，却借皇帝必须保障粮运和边防指出斯多葛悖论：若外物全无价值，公共责任为何仍重要？`,modernCorrection:`《沉思录》不是消极悲观的理论论文，而是重复使用既有教义的私人训练册；重复恰好说明实践尚未完成。罗素提出的公共善难题真实存在，但斯多葛派可借“外物非善却可取”及社会角色回答一部分。评价本人还需把文本理想与帝国政策分开。`,sources:[oe(`第一卷第二十八章〈斯多葛主义〉及第二十九章〈罗马帝国与文化的关系〉`),{label:`Stanford Encyclopedia · Marcus Aurelius`,kind:`补充`,url:`https://plato.stanford.edu/entries/marcus-aurelius/`},se]},{id:`plotinus`,order:29,nameZh:`普罗提诺`,nameEn:`Plotinus`,greekName:`Πλωτῖνος`,dates:`公元 204/205—270`,active:`公元 244—270`,places:[`埃及`,`亚历山大里亚`,`美索不达米亚`,`罗马`,`坎帕尼亚`],school:`新柏拉图主义`,figureId:`plotinus`,chapterIds:[`b1-30`],thesis:`多样事物若要成为统一的存在，必须依赖更高层的统一：万物由太一经精神与灵魂层层产生，人的回归不是迁往别处，而是转向自身最深处的理智根源。`,evidenceCaution:`生平主要来自学生波菲利所写《普罗提诺传》，其中混有神迹和学派塑造。他自认是柏拉图的解释者，“新柏拉图主义”是近代史学标签；流溢、三位一体等常用概括也不能与基督教教义直接等同。`,lifeSummary:`普罗提诺生于埃及，在亚历山大里亚跟随阿摩尼阿斯·萨卡斯学习约十一年。公元 243 年加入戈尔迪安三世东方远征，希望接触波斯和印度智慧；皇帝遇刺后转往罗马，244 年起讲学二十余年，并与皇帝加里恩努斯及罗马精英保持联系。约 253 年开始写作，学生波菲利后来把五十四篇论文编为六组九篇的《九章集》。他生活在三世纪帝国危机中，却以超时间的层级宇宙回应现实崩坏，既终结古希腊体系哲学，也为基督教时代提供形而上语言。`,timeline:[{date:`公元 204/205`,place:`埃及`,title:`出生`,detail:`具体出生地不明；波菲利说他不愿谈论身体出身，后世关于吕科波利斯的定位不能完全确定。`,certainty:`推定`},{date:`约公元 232—243`,place:`亚历山大里亚`,title:`随阿摩尼阿斯学习`,detail:`二十八岁开始系统求师，最终跟随阿摩尼阿斯约十一年；教师本人几乎没有可靠著作资料。`,certainty:`较可靠`},{date:`公元 243—244`,place:`美索不达米亚`,title:`参加戈尔迪安三世远征`,detail:`传统说他希望了解波斯和印度哲学；皇帝被杀后逃至安条克，计划中止。`,certainty:`较可靠`},{date:`公元 244—253`,place:`罗马`,title:`建立教学圈`,detail:`公开讲课并吸引政治精英、妇女和青年；曾设想在坎帕尼亚建立按柏拉图法律生活的“柏拉图城”。`,certainty:`较可靠`},{date:`约公元 253—263`,place:`罗马`,title:`开始写作并遇到波菲利`,detail:`先讲授后写作，论文回应课堂中的具体问题；波菲利公元 263 年加入并成为编辑者。`,certainty:`较可靠`},{date:`公元 270`,place:`坎帕尼亚`,title:`去世，作品后来编为《九章集》`,detail:`波菲利在其死后按主题而非写作顺序编排五十四篇论文，塑造了后世所见的体系次序。`,certainty:`较可靠`}],inquiries:[{object:`太一与多样性`,question:`一切存在都有统一性，那么统一本身能否仍是众多属性的组合？`,start:`任何复杂存在都由部分或性质组成，需要某种原则把它维持为一个东西。`,steps:[`从复合物需要统一条件出发`,`把统一条件继续追溯，避免最高原则仍依赖组成`,`排除对最高原则的普通谓词和存在分类`,`以否定和类比接近绝对简单的太一`],conclusion:`太一超越存在和思想，不是所有事物的总和，也不是具有多个属性的人格对象；语言只能说明它不是什么及万物为何依赖它。`},{object:`产生与层级`,question:`绝对简单且不缺少任何东西的太一，为什么会有多样世界？`,start:`完善的活动具有内在自足，也会产生不削弱来源的外向活动，如太阳发光而不减少。`,steps:[`太一的丰盈产生精神`,`精神转向太一并同时思考理念与自身`,`精神的活动产生世界灵魂与个别灵魂`,`灵魂面向精神时秩序自然，面向外部时形成感性世界`],conclusion:`产生不是时间中的创造事件，也不是太一作计划；各层因接近统一程度不同而具有递减的实在与统一。`},{object:`感性世界与恶`,question:`较低世界是否因此是邪恶创造者制造的牢狱？`,start:`感性世界变化、分散且含痛苦，却又表现比例、生命和可识别的美。`,steps:[`把自然理解为灵魂对精神秩序的外在表达`,`承认复制品低于可知原型`,`把恶解释为善、形式和统一的缺乏`,`反对诺斯替派贬低宇宙和天体`],conclusion:`世界不是与善对立的独立恶实体，而是感性条件下尽可能好的形象；向上转向不要求仇恨可见美。`},{object:`灵魂回归与合一`,question:`个别灵魂怎样由分散生活返回其根源？`,start:`灵魂并未完全切断与精神的联系，只是在身体欲望和外部对象中忘记自己的较高活动。`,steps:[`由德性净化冲动与依附`,`从感性美追溯使其成形的可知美`,`在内省中让思想转向精神`,`最终超越主体—对象区分，与太一发生不可言说的接触`],conclusion:`最高体验不是论证的替代，而是论证和生活净化所指向、却无法被命题完全表达的统一；经验后才能回到语言反思。`}],concepts:[{zh:`太一`,en:`the One`,definition:`超越存在、思想和一切复合的最高原则；不是数目一或万物集合，而是任何事物能够成为统一者的终极根据。`},{zh:`精神`,en:`Intellect / Nous`,definition:`由太一产生、同时包含思者与所思理念的可知整体；其内部有差异，却保持透明统一。`},{zh:`灵魂`,en:`Soul / psychē`,definition:`连接可知与感性层级的生命原则；世界灵魂赋予宇宙秩序，个别灵魂既能向上沉思，也能面向身体活动。`},{zh:`本体层级`,en:`hypostases`,definition:`太一、精神、灵魂三种根本实在的现代常用总称；它们不是平等的三位，也不是彼此分离的空间区域。`},{zh:`流溢`,en:`procession / emanation`,definition:`较低层由较高层的充盈活动产生而不耗损来源；不是在某个时刻发生的自愿制造。`},{zh:`回归`,en:`return / epistrophē`,definition:`所产生者转向其来源而获得形式和完善；在人身上表现为由感性分散回到精神与太一。`},{zh:`恶是缺失`,en:`evil as privation`,definition:`恶没有与善对等的独立实体性，而是形式、秩序和善的极端缺乏；这一结构后来深刻影响奥古斯丁。`},{zh:`合一`,en:`union / henōsis`,definition:`灵魂超越主客区分与太一接触的最高经验；不能用普通知识命题完整描述，也不意味着个体被简单物理消灭。`}],lineage:{inherited:`自认解释柏拉图，集中发展理念、灵魂、不成文的最高原则和《蒂迈欧篇》宇宙；也吸收亚里士多德精神论、巴门尼德存在论及中期柏拉图主义。`,school:`后来所谓新柏拉图主义的奠基人物。他并不认为自己开创新学派，而是通过系统解释使柏拉图传统在晚期古代获得新的层级结构。`,influenced:`波菲利编辑并传播《九章集》；经奥古斯丁、伪狄奥尼修斯及阿拉伯—拉丁传统，太一、内在上升和恶之缺失进入基督教、伊斯兰和犹太哲学。`,parallel:`与诺斯替主义同样在帝国危机中寻求超越世界，却对感性宇宙作相反评价：普罗提诺认为它是可知美的必要且尽可能完善的形象。`},comparisons:[{target:`柏拉图`,relation:`承接前人`,shared:`理念、灵魂上升、善超越普通知识及感性美的引导作用。`,difference:`普罗提诺把分散于不同对话的线索组织成太一—精神—灵魂的连续层级，并弱化政治与数学兴趣。`},{target:`亚里士多德`,relation:`后世重构`,shared:`精神的自我思考、现实性和形式秩序。`,difference:`普罗提诺把精神置于太一之下并包含全部理念；亚里士多德第一推动者及灵魂—身体关系的结构不同。`},{target:`诺斯替主义`,relation:`批评关系`,shared:`都区分较高神性层级与受苦的感性处境。`,difference:`诺斯替派常把宇宙归于低劣或恶的创造者；普罗提诺坚持宇宙之美、天体神性与灵魂的秩序性创造。`},{target:`斯多葛主义`,relation:`批评关系`,shared:`宇宙是有秩序的整体，伦理要求改变欲望并与更大秩序协调。`,difference:`斯多葛把神性理性内在于物质宇宙；普罗提诺把自然置于灵魂以下，并以非物质精神与太一为最高真实。`},{target:`奥古斯丁`,relation:`后世重构`,shared:`由外在转向内在、非物质实在和恶作为善的缺失。`,difference:`奥古斯丁把这些结构置入创造、人格神、恩典和基督教救赎史，不能把他视为简单改名的普罗提诺。`}],russellView:`罗素把普罗提诺称为古代最后一位伟大哲学家，先以三世纪战争、瘟疫与财政崩坏解释为何思想转向永恒世界，再赞赏其体系之美、灵魂—身体分析和人格高贵。他同时批评这种哲学鼓励向内而非向外看，削弱科学好奇和改善制度的动力。`,modernCorrection:`罗素的“时代绝望→逃向彼岸”非常有记忆力，却不能穷尽其课堂研究、公共关系和对感性美的肯定。“新柏拉图主义”是后设标签；普罗提诺也并非简单憎恨身体或现实世界。他对基督教影响深远，但主要经翻译、编辑和神学重构发生。`,sources:[oe(`第一卷第三十章〈普罗提诺〉`),{label:`Stanford Encyclopedia · Plotinus`,kind:`补充`,url:`https://plato.stanford.edu/entries/plotinus/`},{label:`Internet Encyclopedia of Philosophy · Plotinus`,kind:`补充`,url:`https://iep.utm.edu/plotinus/`}]}],E=e=>({label:`罗素《西方哲学史》${e}`,kind:`原书`,url:`https://www.russell-j.com/cool/HWP_1945.pdf`}),D=[{id:`thales`,order:1,nameZh:`泰勒斯`,nameEn:`Thales of Miletus`,greekName:`Θαλῆς`,dates:`约前 625—前 546`,active:`约前 585 年前后`,places:[`米利都`,`爱奥尼亚`,`埃及（传统记载）`],school:`米利都学派`,figureId:`thales`,chapterIds:[`b1-02`],thesis:`用一种自然本原解释多样世界：重要的不只是“水”这个答案，而是世界可以从世界内部得到说明。`,evidenceCaution:`没有可确认的著作传世。我们主要通过希罗多德、亚里士多德及更晚作者认识他；具体事迹常带有“七贤”式传奇色彩。`,lifeSummary:`泰勒斯生活在小亚细亚西岸的商业城邦米利都。这里连接爱琴海、吕底亚、埃及和巴比伦知识网络，同时经历贵族、商人和僭主之间的政治变动。古代传统把他列为“希腊七贤”之一，并赋予他天文、几何、工程和政治建议等多重身份。罗素把这种跨文化、商业性的城市环境视为米利都自然研究得以出现的重要条件。与后世留下完整著作的哲学家不同，泰勒斯更像一个由少数命题和大量见证拼成的历史起点。`,timeline:[{date:`约前 625`,place:`米利都`,title:`出生与成长`,detail:`年代由后世编年推定；身处海上贸易与多文明知识交汇的爱奥尼亚。`,certainty:`推定`},{date:`前 585`,place:`吕底亚—米底战场`,title:`日食预言传统`,detail:`希罗多德说他预告了发生在战争中的日食；现代研究通常怀疑他是否可能精确预报地点和日期。`,certainty:`传统记载`},{date:`6 世纪前期`,place:`米利都／埃及`,title:`几何与测量活动`,detail:`传说他由埃及引入几何，并用影长测量金字塔、以三角测量估算海上船距；具体归属并不确定。`,certainty:`传统记载`},{date:`前 546 前后`,place:`爱奥尼亚`,title:`生命末期`,detail:`吕底亚被波斯征服，米利都进入新的政治环境；传统编年常把他的去世置于这一时期。`,certainty:`推定`}],inquiries:[{object:`自然本原`,question:`纷繁事物是否能由一种共同东西说明？`,start:`生命、营养、种子和湿润之间似乎存在稳定联系；水又能呈现多种状态。`,steps:[`从多样事物中寻找共同成分`,`把生成理解为自然材料的变化`,`不再用神祇的临时干预填补每个现象`],conclusion:`水被视为万物的本原。即使答案粗糙，这种解释形式已经把宇宙当作一个内在、自行运作的系统。`},{object:`运动与生命`,question:`无生命的东西为什么能够产生运动？`,start:`磁石能在没有可见推动者的情况下吸引铁。`,steps:[`把自发运动与灵魂联系`,`由磁石推测自然物具有内在动力`,`将神性理解为遍布自然，而非只从外部介入`],conclusion:`亚里士多德转述他认为磁石有灵魂、万物充满神。这不是成熟论证，却保存了“自然自身含有运动原则”的直觉。`}],concepts:[{zh:`本原`,en:`archē`,definition:`事物从何而来、由何构成并凭什么持续的第一原则。“本原”这一术语主要是亚里士多德用来整理早期思想的框架。`},{zh:`水`,en:`water as primary stuff`,definition:`既是可观察的物质，又承担统一解释的角色；重点是用较少的自然假设解释较多现象。`},{zh:`有灵的自然`,en:`ensouled nature`,definition:`自然物的运动不必总由外在人格神推动；动力可能属于事物自身。这个解释仍混合着早期神性语言。`}],lineage:{inherited:`继承的是爱奥尼亚的航海测量、巴比伦天文周期与埃及实用几何，而不是一套已经成形的哲学体系。`,school:`后世把泰勒斯、阿那克西曼德和阿那克西美尼归为米利都学派：共享自然本原、宇宙生成和非人格化解释，但未必存在严格的学校组织。`,influenced:`阿那克西曼德延续“单一本原”的问题，却反对以已知元素作最终基础；阿那克西美尼又返回具体元素，并补上变化机制。`,parallel:`与赫西俄德同样解释宇宙起源，却由神族谱系转向自然材料；与后来的唯物论都追问物质基础，但不能因此说近代唯物论直接源于泰勒斯。`},comparisons:[{target:`赫西俄德`,relation:`同题比较`,shared:`都试图给宇宙一个起源秩序。`,difference:`赫西俄德以神的出生和冲突叙述起源；泰勒斯把解释压缩为自然材料及其变化。`},{target:`阿那克西曼德`,relation:`影响后继`,shared:`世界需要一个统一的生成原则。`,difference:`泰勒斯选择可见的水；阿那克西曼德认为任何已知元素都会偏向自身，故改用无规定的“无限者”。`},{target:`毕达哥拉斯`,relation:`同题比较`,shared:`都寻找多样现象背后的统一秩序。`,difference:`泰勒斯从物质与观察出发；毕达哥拉斯传统更重数、比例、灵魂与净化生活。`}],russellView:`罗素说泰勒斯更值得作为科学家而非现代意义的哲学家受到尊重。他把“万物由水构成”当作大胆但并非愚蠢的科学假说，也反复提醒可确知材料太少。对罗素而言，真正的历史价值不在答案正确，而在这种粗糙假说能够刺激观察、争论和后续修正。`,modernCorrection:`现代研究比罗素更谨慎地处理日食预言：前 585 年确有适合的日食，古代也确有预言记载，但泰勒斯掌握何种方法无法确定。“万物是水”同样主要经亚里士多德重构，不能当作泰勒斯留下的完整原文体系。`,sources:[E(`第一卷第二章〈米利都学派〉`),{label:`Stanford Encyclopedia · Presocratic Philosophy`,kind:`补充`,url:`https://plato.stanford.edu/entries/presocratics/`},{label:`Internet Encyclopedia of Philosophy · Thales`,kind:`补充`,url:`https://iep.utm.edu/thales/`}]},{id:`anaximander`,order:2,nameZh:`阿那克西曼德`,nameEn:`Anaximander`,greekName:`Ἀναξίμανδρος`,dates:`约前 610—前 546`,active:`6 世纪中叶`,places:[`米利都`,`黑海殖民网络`,`斯巴达（传统记载）`],school:`米利都学派`,figureId:`anaximander`,chapterIds:[`b1-02`],thesis:`已知元素彼此对立，不能有任何一种无限支配其他元素；万物应从更抽象、无规定的“无限者”生成。`,evidenceCaution:`据说写过散文著作《论自然》，现仅有一小段可能接近原文的残句。其地图、日晷和殖民活动都来自后世见证，细节不可完全确认。`,lifeSummary:`阿那克西曼德是米利都公民，传统上被称为泰勒斯的学生或同伴。他处在吕底亚与波斯势力扩张、爱奥尼亚城邦持续殖民和航海的时期。后世称他率领过前往黑海沿岸阿波罗尼亚的殖民行动，制作过已知世界地图，并把圭表带入希腊；这些记载共同显示他的知识与实际定向、时间测量及城邦空间有关。他可能是最早用散文系统书写自然研究的希腊思想家之一，但著作本身几乎全部失传。`,timeline:[{date:`约前 610`,place:`米利都`,title:`出生`,detail:`后世编年据其前 546 年约六十四岁反推；确切年份未知。`,certainty:`推定`},{date:`6 世纪中叶`,place:`黑海沿岸`,title:`殖民与地理活动`,detail:`传说他领导米利都殖民者建立阿波罗尼亚，并绘制有人居住世界的地图。`,certainty:`传统记载`},{date:`6 世纪中叶`,place:`米利都／斯巴达`,title:`天文测量`,detail:`据说设置圭表，用影子判断时刻与季节；工具来自更早的巴比伦传统，贡献更可能是引入和应用。`,certainty:`传统记载`},{date:`约前 546`,place:`米利都`,title:`《论自然》与生命末期`,detail:`据推定曾以散文讨论宇宙、地理和生命起源；只有经辛普里丘转述的一段残句留存。`,certainty:`推定`}],inquiries:[{object:`第一原则`,question:`如果元素相互对立，哪一种能够成为共同本原？`,start:`水、火、气、土具有互相排斥的性质；若其中一种无限强大，其余早已被消灭。`,steps:[`接受泰勒斯的单一本原问题`,`比较已知元素之间的对立`,`排除任何带有确定性质的元素`,`把本原提升为无边界、无规定且不衰老的来源`],conclusion:`本原是“无限者”：它不是简单的无限空间，而是无法由现成元素限定、又能持续产生世界的根源。`},{object:`宇宙秩序与变化`,question:`对立元素不断争胜，为什么世界没有崩溃？`,start:`冷热、干湿等力量会扩张并侵占彼此，但季节和生成毁灭呈现循环。`,steps:[`无限者内部具有永恒运动`,`冷热等对立力量分离`,`对立物在时间中轮流占优`,`越界者通过反向变化向另一方作出补偿`],conclusion:`变化受时间与比例约束；“正义”不是人格神判决，而是自然系统恢复平衡的秩序。`},{object:`地球与生命`,question:`地球为何不坠落，人类又怎样进入自然史？`,start:`若地球必须由别物支撑，就会产生新的支撑问题；人类幼年期过长，似乎无法以现状独立起源。`,steps:[`地球与各方向等距，因此无理由向一边移动`,`天体环绕地球形成完整路径`,`生命由受太阳作用的湿润环境产生`,`早期人类曾寄生于鱼形动物，成熟后才登上陆地`],conclusion:`宇宙与生命都通过自然生成解释，而不是一次性的创造事件；具体模型虽错误，解释目标却高度统一。`}],concepts:[{zh:`无限者`,en:`apeiron`,definition:`没有边界或确定性质、不会衰老耗尽的本原。它既避免某一元素垄断，又为无数生成过程保留来源。`},{zh:`对立者`,en:`opposites`,definition:`热与冷、干与湿等具有作用力的性质；可见世界由它们的分离、侵占与转化构成。`},{zh:`宇宙正义`,en:`cosmic justice`,definition:`对立力量依时间秩序为越界付出补偿。它把政治—伦理词汇转化为非人格化的自然规律。`},{zh:`无支撑地球`,en:`unsupported earth`,definition:`地球因与各方向等距而保持原位，不再需要海、柱或巨兽支撑；这是用对称性终止解释倒退。`}],lineage:{inherited:`从泰勒斯继承“以一个自然原则解释整个宇宙”的问题，也继承米利都航海、测量与跨文化观察的实践背景。`,school:`属于米利都自然哲学，但把具体物质假说推进到抽象原则，并第一次留下可辨认的宇宙秩序论证。`,influenced:`阿那克西美尼保留单一本原，却认为“无限者”缺少变化机制；赫拉克利特继续使用对立与正义语言，但把冲突本身视为秩序。后来的宇宙模型也继承其无外部支撑的解释方向。`,parallel:`与现代演化论共享“生命有自然生成史”这一问题形式，却没有遗传、选择等机制，不能把他称为现代进化论者。`},comparisons:[{target:`泰勒斯`,relation:`承接前人`,shared:`用单一本原统一解释生成世界。`,difference:`泰勒斯选取水；阿那克西曼德用元素冲突论证，本原必须不等同于任何已知元素。`},{target:`阿那克西美尼`,relation:`影响后继`,shared:`宇宙从一个持续存在的来源演化。`,difference:`阿那克西曼德的来源抽象但机制含混；阿那克西美尼以气的凝聚和稀释提供可观察的变化机制。`},{target:`赫拉克利特`,relation:`同题比较`,shared:`都用对立、时间和正义解释世界秩序。`,difference:`阿那克西曼德把越界后的补偿视为平衡；赫拉克利特则认为张力和争斗本身就是生成秩序。`}],russellView:`罗素明确说阿那克西曼德比泰勒斯“更有趣”。他着重重建了一个排除论证：若水、火等任何已知元素是无限的，它就会征服其他元素，因此本原必须在宇宙冲突中保持中性。罗素也赞赏其无创造论的宇宙演化、动物起源假说、地图和科学好奇心，评价他“原创处都是科学而理性的”。`,modernCorrection:`“无限者”究竟指空间无限、时间不尽、性质未定还是不可经验，仍有争议。现存残句的边界也不确定。地图、圭表和殖民领导等事迹应写作古代传统，而不应像完整履历一样陈述；但这些传统可靠地反映了后人眼中他兼具宇宙论与测量实践的形象。`,sources:[E(`第一卷第二章〈米利都学派〉`),{label:`Stanford Encyclopedia · Presocratic Philosophy`,kind:`补充`,url:`https://plato.stanford.edu/entries/presocratics/`},{label:`Internet Encyclopedia of Philosophy · Anaximander`,kind:`补充`,url:`https://iep.utm.edu/anaximander/`}]},{id:`anaximenes`,order:3,nameZh:`阿那克西美尼`,nameEn:`Anaximenes of Miletus`,greekName:`Ἀναξιμένης`,dates:`约前 586—前 528`,active:`6 世纪中叶`,places:[`米利都`,`爱奥尼亚`],school:`米利都学派`,figureId:`anaximenes`,chapterIds:[`b1-02`],thesis:`以气为统一材料，以稀释和凝聚为变化机制：性质差异可以由连续、定量的过程产生。`,evidenceCaution:`生平几乎空白，年代也来自后世推定。著作没有保存，哲学主要经泰奥弗拉斯托斯传统和晚期摘述重建。`,lifeSummary:`阿那克西美尼是米利都三人组中最晚的一位，通常被说成阿那克西曼德的同伴或学生。他活动时的爱奥尼亚正承受吕底亚覆灭、波斯统治和城邦紧张；罗素只敢断言他晚于阿那克西曼德，并早于前 494 年波斯镇压爱奥尼亚起义时米利都被毁。关于旅行、政治活动和私人交往，没有足够材料可写。其历史位置主要由理论显示：他既不满足于泰勒斯只有“材料答案”，也不满足于阿那克西曼德过于抽象的来源，而要说明同一种材料怎样连续变成可见世界。`,timeline:[{date:`约前 586`,place:`米利都`,title:`出生`,detail:`传统年代差异较大；较稳妥的说法只是他活跃于前六世纪中叶。`,certainty:`推定`},{date:`前 550 前后`,place:`米利都`,title:`与阿那克西曼德的学术关系`,detail:`泰奥弗拉斯托斯传统称他是阿那克西曼德的同伴或学生；严格师承无法证实。`,certainty:`传统记载`},{date:`6 世纪中叶`,place:`米利都`,title:`自然论写作`,detail:`据说用朴素爱奥尼亚散文写作，集中讨论气、物质变化、气象和宇宙形成；文本已失。`,certainty:`传统记载`},{date:`前 528 前后`,place:`米利都`,title:`去世`,detail:`常见年代来自后世编年；可以确认的相对关系是其活动早于前 494 年米利都毁灭。`,certainty:`推定`}],inquiries:[{object:`本原与生命`,question:`哪种本原既无处不在，又能解释生命和宇宙的统一？`,start:`气通常不可见、范围难定，却以呼吸维持生命；它比水更普遍，又比“无限者”更可经验。`,steps:[`选取遍布环境的气作为材料`,`以呼吸—灵魂维持身体作类比`,`把同一关系扩大到气包围并维持整个宇宙`],conclusion:`气既是万物材料，也是世界保持整体的生命性原则；自然与生命仍处于同一解释层。`},{object:`物质变化`,question:`同一种材料怎样产生火、水、土和石等相反性质？`,start:`空气受压、吹拂、蒸发和结露会呈现冷热、疏密变化；毛毡制作也展示压缩产生新性质。`,steps:[`稀释使气变为火`,`逐步凝聚使气成为风、云、水`,`继续凝聚成为土与石`,`用疏密程度把多种物质排入连续序列`],conclusion:`可见的性质差异来自稀释和凝聚的数量差异。这是米利都学派第一次较明确地给出变化机制。`},{object:`宇宙与气象`,question:`天地和常见气象能否使用同一机制解释？`,start:`若气的疏密过程普遍有效，就不应只解释少数物质。`,steps:[`凝聚的气形成扁平大地`,`大地像叶片一样由气托住`,`太阳、月亮和星体由稀薄或燃烧物形成`,`云、雨、雹、雪同样按凝聚程度说明`],conclusion:`一个低成本机制跨越物质、气象和宇宙领域；模型错误，但解释具有可重复性和统一性。`}],concepts:[{zh:`气`,en:`aēr`,definition:`无处不在、通常不可见又能成为呼吸的基本材料；兼有可观察性与近似无限的范围。`},{zh:`稀释`,en:`rarefaction`,definition:`气变得更疏、更热并趋向火的过程；把质的变化解释为密度下降。`},{zh:`凝聚`,en:`condensation`,definition:`气依次成为风、云、水、土、石的连续压缩过程；把多种材料排列在同一尺度上。`},{zh:`呼吸类比`,en:`breath analogy`,definition:`人的灵魂作为气维持身体，宇宙之气也包围并维持世界。它连接个体生命经验与整体宇宙论。`}],lineage:{inherited:`接受泰勒斯的物质一元论和阿那克西曼德的宇宙生成问题；其气同时吸收了“具体元素”与“范围无定”两种要求。`,school:`作为米利都学派第三人，他最突出的贡献不是换了一个本原名称，而是提供稀释—凝聚这一可复用机制。`,influenced:`其连续物质转化影响后来的赫拉克利特、阿那克萨哥拉、阿波罗尼亚的第欧根尼及古代医学气论。罗素还说他影响了毕达哥拉斯，并指出原子论者沿用其圆盘形地球。`,parallel:`与近代以压力、密度解释相变的科学共享“用定量变化说明性质差异”的结构，但他没有实验测量、微观理论或守恒定律。`},comparisons:[{target:`泰勒斯`,relation:`承接前人`,shared:`以一种可经验材料统一自然。`,difference:`泰勒斯主要给出水这一答案；阿那克西美尼进一步说明材料如何沿连续过程发生转化。`},{target:`阿那克西曼德`,relation:`承接前人`,shared:`世界从单一、持续的来源自然演化。`,difference:`阿那克西曼德用无规定来源避免元素偏向；阿那克西美尼用气兼顾中性、可见证据和变化机制。`},{target:`赫拉克利特`,relation:`同题比较`,shared:`都把世界看成一种材料的持续转化。`,difference:`阿那克西美尼以疏密序列解释物质；赫拉克利特以火、交换、对立张力解释更普遍的过程秩序。`}],russellView:`罗素认为阿那克西美尼不如阿那克西曼德有趣，却承认他取得了重要进展：火是稀释的气，气凝聚后依次成为水、土、石，因此物质之间的差异被处理为凝聚程度的数量差异。罗素同时提醒，古代人对他的评价反而高于阿那克西曼德，说明哲学史中的重要性排序本身会变化。`,modernCorrection:`罗素把理论概括为“差异完全是数量的”，便于理解但略显现代化。更稳妥的说法是：阿那克西美尼首次留下了以疏密过程统一解释质变的清晰见证。吹气冷热的观察是否真是他的论证，以及具体宇宙模型的归属，仍需保留证据等级。`,sources:[E(`第一卷第二章〈米利都学派〉`),{label:`Stanford Encyclopedia · Presocratic Philosophy`,kind:`补充`,url:`https://plato.stanford.edu/entries/presocratics/`},{label:`Internet Encyclopedia of Philosophy · Anaximenes`,kind:`补充`,url:`https://iep.utm.edu/anaximenes/`}]},{id:`pythagoras`,order:4,nameZh:`毕达哥拉斯`,nameEn:`Pythagoras`,greekName:`Πυθαγόρας`,dates:`约前 570—前 490`,active:`约前 530—前 500`,places:[`萨摩斯`,`克罗顿`,`梅塔蓬图姆`],school:`毕达哥拉斯传统`,figureId:`pythagoras`,chapterIds:[`b1-03`],thesis:`哲学不只是解释世界，也是一种净化灵魂的共同生活；数与和谐后来成为这条传统理解宇宙秩序的核心语言。`,evidenceCaution:`毕达哥拉斯本人没有留下著作，早期见证稀少，完整传记晚出数百年。灵魂轮回与生活规则较可能属于本人；“万物是数”、定理和完整宇宙论多半属于后来的学派。`,lifeSummary:`毕达哥拉斯出生于爱琴海的萨摩斯岛，约四十岁时迁往南意大利的克罗顿。罗素把迁徙放在僭主波利克拉底统治和萨摩斯—米利都商业竞争中理解；现代研究可以确认迁居克罗顿，却不能确认所有政治动机与埃及旅行。他在那里建立以饮食禁忌、仪式、自律和共同生活为特点的团体，吸引男女追随者，并可能卷入南意大利城邦政治。反毕达哥拉斯运动后来攻击这些团体；传统称他最终逃往梅塔蓬图姆并在那里去世。`,timeline:[{date:`约前 570`,place:`萨摩斯`,title:`出生`,detail:`出生于富裕而航海活跃的岛屿城邦；父亲与早年经历的记载互相冲突。`,certainty:`推定`},{date:`约前 530`,place:`萨摩斯 → 克罗顿`,title:`迁往南意大利`,detail:`约四十岁移居克罗顿并开始主要活动；罗素认为他厌恶波利克拉底的僭政。`,certainty:`较可靠`},{date:`前 530—500`,place:`克罗顿`,title:`建立共同体`,detail:`团体以灵魂命运、宗教仪式、饮食纪律和共同生活闻名，并对当地政治产生影响。`,certainty:`较可靠`},{date:`约前 500—490`,place:`克罗顿／梅塔蓬图姆`,title:`政治反扑与去世`,detail:`南意大利发生反毕达哥拉斯运动；个人逃亡与死亡细节来自较晚传统。`,certainty:`传统记载`}],inquiries:[{object:`灵魂与生活方式`,question:`人的灵魂如何摆脱死亡与反复投生的循环？`,start:`灵魂并不随身体死亡，而会进入其他人或动物；所有有生命者因此具有亲缘关系。`,steps:[`承认灵魂不朽与轮回`,`把日常饮食、仪式和欲望纳入灵魂后果`,`以记忆、自律和群体规则净化生活`,`把哲学变成持续操练而非单次知识`],conclusion:`好生活的目标是改善灵魂命运。哲学首次鲜明地成为一种可加入、可实践、可传承的生活制度。`},{object:`数、音乐与秩序`,question:`为什么感性和谐能够由精确关系表达？`,start:`音乐协和与简单整数比之间存在稳定联系；几何证明又呈现不依赖个别观察的确定性。`,steps:[`从和弦与比例发现可重复关系`,`把数视为结构而非只用于计数`,`由局部比例推想宇宙也有和谐秩序`,`把数学沉思解释为灵魂净化的最高活动`],conclusion:`在毕达哥拉斯传统中，真实秩序更接近数、比例和形式。必须注意：这一完整推导主要属于后世学派，不能全部归给本人。`},{object:`知识与人生等级`,question:`求知是控制世界的工具，还是一种独立的生活价值？`,start:`观看竞技者既不交易也不争胜，只为理解发生了什么。`,steps:[`区分逐利者、竞争者和观看者`,`把无利害的观看提升为沉思`,`把沉思与数学的确定、和谐相连`,`让理论生活获得高于政治行动的地位`],conclusion:`罗素据此解释西方传统中“理论高于实践、理性高于感官”的长久倾向，并同时批评它带来的形而上学偏见。`}],concepts:[{zh:`灵魂轮回`,en:`metempsychosis`,definition:`灵魂在不同生命形态中迁移；生命共同亲缘、饮食禁忌与净化实践由此获得统一理由。`},{zh:`毕达哥拉斯式生活`,en:`Pythagorean way of life`,definition:`由共同体、仪式、饮食、自律和学习构成的生活方案；比任何单条数学命题更可靠地属于早期传统。`},{zh:`和谐`,en:`harmonia`,definition:`不同部分依比例结合形成秩序。音乐中的整数关系使“可听见的美”与“可理解的数”发生连接。`},{zh:`理论／沉思`,en:`theōria`,definition:`以理解而非利益或竞争为目的的观看生活。罗素把它视为数学、哲学和后来神学共同抬高的理想。`},{zh:`数与比例`,en:`number and ratio`,definition:`用离散数及其比例理解音程、形状与宇宙秩序；可靠证据更多属于早期毕达哥拉斯传统，而非都能归给本人。`},{zh:`净化`,en:`katharsis / purification`,definition:`通过节制、音乐、仪式与学习整顿灵魂，使知识活动同时成为生活和宗教实践。`}],lineage:{inherited:`罗素强调俄耳甫斯宗教的净化、轮回和共同体传统；也提到南意大利与爱奥尼亚知识交流。现代研究对具体借用关系更谨慎。`,school:`“毕达哥拉斯主义”跨越多个世纪。早期宗教生活、五世纪菲洛劳斯的宇宙论、阿尔库塔斯的数学不能无差别地写回创始人。`,influenced:`菲洛劳斯与阿尔库塔斯把传统发展为数学宇宙论；柏拉图吸收数、形式、灵魂与沉思理想，经他影响新柏拉图主义和基督教哲学。`,parallel:`与米利都学派同样追求宇宙统一，却把稳定性放在形式关系而非物质本原；与后世宗教修会共享生活纪律，但不存在简单直接的组织继承。`},comparisons:[{target:`米利都学派`,relation:`同题比较`,shared:`都寻找现象背后的统一秩序。`,difference:`米利都从可观察物质与生成机制出发；毕达哥拉斯传统把数、灵魂和净化生活放到中心。`},{target:`赫拉克利特`,relation:`批评关系`,shared:`都认为零散见闻不足以构成智慧。`,difference:`赫拉克利特点名批评毕达哥拉斯“多闻而无理解”；他以逻各斯和对立秩序取代知识收藏与宗教权威。`},{target:`柏拉图`,relation:`影响后继`,shared:`数学训练、灵魂不朽和超越感官的秩序。`,difference:`柏拉图用理念论、辩证法和政治哲学重组这些资源，不能把成熟柏拉图体系倒推给毕达哥拉斯。`}],russellView:`罗素把毕达哥拉斯称为思想史上影响最巨大的人之一：演绎数学、神秘主义与沉思伦理在他身上结合，使数学确定性成为哲学的理想。罗素一方面赞赏纯数学和无利害求知，另一方面认为由此产生了“思想高于感官”的错误形而上学倾向。他的叙述极有结构力量，但把很多后世学派成就集中到个人名下。`,modernCorrection:`现代研究把“毕达哥拉斯问题”放在首位：较早证据能支持灵魂轮回、仪式专家和严格生活方式，却没有证据证明本人提出勾股定理、建立成熟数学证明体系或完整宣称“万物是数”。页面因此保留罗素的影响史判断，同时把个人、早期共同体和后世学派分层。`,sources:[E(`第一卷第三章〈毕达哥拉斯〉`),{label:`Stanford Encyclopedia · Pythagoras`,kind:`补充`,url:`https://plato.stanford.edu/entries/pythagoras/`},{label:`Internet Encyclopedia · Presocratics / Pythagoras`,kind:`补充`,url:`https://iep.utm.edu/presocra/`}]},{id:`heraclitus`,order:5,nameZh:`赫拉克利特`,nameEn:`Heraclitus of Ephesus`,greekName:`Ἡράκλειτος`,dates:`约前 540—前 480`,active:`约前 500 年前后`,places:[`以弗所`,`爱奥尼亚`],school:`爱奥尼亚哲学／独立思想家`,figureId:`heraclitus`,chapterIds:[`b1-04`],thesis:`世界的稳定不是排除变化，而是由受逻各斯约束的转化和对立张力维持；有些事物正因为持续更新才能保持同一。`,evidenceCaution:`生平轶事大多是后人从格言反推的传说。作品只以约百余条残篇保存，语句刻意含混；“万物流变”等著名标签也主要经过柏拉图和后世解释。`,lifeSummary:`赫拉克利特生活在爱奥尼亚城邦以弗所，约于前 500 年前后活跃。该城位于波斯帝国西缘，拥有古老贵族、公共祭祀和商业网络。罗素只较有把握地说他是以弗所的贵族公民；关于他让出世袭职位、隐居山中和特殊死法的故事都很晚。他的残篇提到城邦放逐赫尔摩多罗斯，并表现出对群众政治、诗人和前辈知识权威的强烈蔑视。作品可能曾作为一部散文书流传，但我们只能通过其他作者的引用重建其排列和论证。`,timeline:[{date:`约前 540`,place:`以弗所`,title:`出生于贵族家庭`,detail:`家世与具体年份来自后世传统；贵族背景与其残篇中的政治语气相符，但不可写成完整履历。`,certainty:`推定`},{date:`6 世纪末`,place:`以弗所`,title:`城邦政治冲突`,detail:`残篇谴责公民放逐赫尔摩多罗斯，显示他与民主多数及地方政治发生尖锐冲突。`,certainty:`较可靠`},{date:`约前 500`,place:`以弗所`,title:`著作与思想活动`,detail:`写作涉及宇宙、知识、伦理和政治，以格言、悖论、双关和意象迫使读者主动理解。`,certainty:`较可靠`},{date:`5 世纪初`,place:`以弗所 → 雅典（思想传播）`,title:`克拉底鲁传播其思想`,detail:`克拉底鲁把极端流变解释带到雅典，影响青年柏拉图；这已是接受史而非赫拉克利特本人生平。`,certainty:`传统记载`}],inquiries:[{object:`变化与同一`,question:`如果组成材料不断替换，一个事物为何仍能保持自身？`,start:`河流、火焰和生命都持续更换材料，却能维持可识别的结构。`,steps:[`观察材料的连续流入与流出`,`区分低层材料与高层关系结构`,`把变化理解为维持结构的必要条件`,`以尺度和交换说明过程不会任意失控`],conclusion:`同一与变化并非简单互斥：河流之所以仍是那条河，恰因为新水持续流入。赫拉克利特不必被理解为“一切都乱变”。`},{object:`对立与秩序`,question:`冲突为什么不只破坏秩序，反而能够构成秩序？`,start:`弓与琴依靠反向拉力保持功能；昼夜、醒睡、冷热也通过互换被理解。`,steps:[`对立项互相规定意义`,`它们在不同时间、对象或角度出现`,`张力产生运动、功能与和谐`,`没有对立，世界只剩无差别的静止`],conclusion:`对立者不是逻辑上同时同义，而是在一个转换系统中相互依赖。“争斗”是结构关系，不只是政治暴力的赞美。`},{object:`知识与逻各斯`,question:`人怎样从零散经验进入对整体秩序的理解？`,start:`多数人拥有见闻、诗歌和仪式，却像睡着一样只生活在私人世界。`,steps:[`感官提供材料但不自动给出理解`,`寻找在众多变化中共同有效的说明`,`按每一事物的本性区分并连接`,`让个人判断服从共同的逻各斯`],conclusion:`智慧不是知道很多，而是把经验组织成一个共同、可说明的秩序。其格言写法本身就是让读者完成连接的训练。`}],concepts:[{zh:`逻各斯`,en:`logos`,definition:`兼有言说、说明、比例和共同秩序之意。它不是赫拉克利特私人意见，而是人可能理解却经常忽略的世界结构。`},{zh:`流变`,en:`flux`,definition:`事物材料与状态持续转化。现代解释强调：变化并非摧毁一切稳定，有些稳定正由规律更新维持。`},{zh:`对立统一`,en:`unity of opposites`,definition:`对立状态在时间、关系和功能系统中互相依存，不等于同一事物在同一方面同时具有矛盾性质。`},{zh:`火与交换`,en:`fire and exchange`,definition:`火既是元素意象，也是转化过程的模型；万物按尺度交换，整体数量和秩序在变化中保持。`},{zh:`争斗`,en:`strife`,definition:`差异力量的张力与轮替，是生成多样性和功能秩序的条件。罗素把它连接到黑格尔辩证法的远源。`}],lineage:{inherited:`延续米利都学派对自然内部秩序的追问，也继承阿那克西曼德的对立与宇宙正义语言；但他把讨论扩展到知识、伦理和政治。`,school:`没有证据表明他建立了制度化学派。后来的“赫拉克利特派”主要由接受者构成，克拉底鲁的极端流变也不能自动等同于本人。`,influenced:`克拉底鲁把其思想带给柏拉图；柏拉图用流变解释感性世界，斯多葛派吸收火、逻各斯和宇宙秩序。黑格尔及现代过程哲学又把他重构为变化与对立的先驱。`,parallel:`巴门尼德同样追问变化、存在和可靠知识，却从“不可思者不可存在”走向不变存在；两人常被并列为同一问题的极端答案，直接互相影响并无定论。`},comparisons:[{target:`阿那克西曼德`,relation:`同题比较`,shared:`对立力量和尺度共同形成宇宙秩序。`,difference:`阿那克西曼德把越界视为需补偿的不正义；赫拉克利特更激进地说争斗本身就是正义与生成条件。`},{target:`巴门尼德`,relation:`同题比较`,shared:`都不满足于感官表面，要求理性说明变化与存在。`,difference:`赫拉克利特在转换关系中寻找稳定；巴门尼德以存在的可思性排除真正的生成和消灭。`},{target:`克拉底鲁／柏拉图`,relation:`后世重构`,shared:`感性事物处于变化之中。`,difference:`克拉底鲁把流变推向无法稳定命名；柏拉图再以不变理念补足知识对象，这未必是赫拉克利特本人的结论。`},{target:`黑格尔`,relation:`后世重构`,shared:`对立不是外部事故，而参与构成发展。`,difference:`黑格尔建立概念辩证体系与历史逻辑；赫拉克利特留下的是格言式的宇宙、伦理和认识论联系。`}],russellView:`罗素把赫拉克利特描述为贵族式、骄傲而带有神秘主义色彩的思想家。他依次突出火、流变、对立融合和宇宙正义，并认为其中含有黑格尔哲学的萌芽。罗素尤其关心变化为什么令人寻求永恒，由此把赫拉克利特放进西方哲学“时间世界与永恒世界”的长期张力中。`,modernCorrection:`罗素沿用柏拉图以来“普遍流变”的强解释，也倾向把火当作与泰勒斯之水相似的基本物质。现代研究提出更细的读法：河流通过材料更新保持结构；对立项在不同关系和时间中相连，并非违反不矛盾律；火可能更重要地表示受尺度约束的交换过程。`,sources:[E(`第一卷第四章〈赫拉克利特〉`),{label:`Stanford Encyclopedia · Heraclitus`,kind:`补充`,url:`https://plato.stanford.edu/entries/heraclitus/`},{label:`Internet Encyclopedia of Philosophy · Heraclitus`,kind:`补充`,url:`https://iep.utm.edu/heraclit/`}]},{id:`parmenides`,order:6,nameZh:`巴门尼德`,nameEn:`Parmenides of Elea`,greekName:`Παρμενίδης`,dates:`约前 515—前 450`,active:`前 5 世纪前期`,places:[`埃利亚`,`大希腊`],school:`埃利亚学派`,figureId:`parmenides`,chapterIds:[`b1-05`],thesis:`思想和言说若要有所指，就不能以“非存在”为对象；由此，真正的存在不能生成、消灭、分割或移动。哲学第一次以论证条件强力约束宇宙论。`,evidenceCaution:`一首六步格哲学诗约保存一百六十行，生平则几乎只有后世记载。柏拉图笔下他在雅典与苏格拉底相见的时间线可能是文学设计；“完全否认经验世界”也只是众多解释之一。`,lifeSummary:`巴门尼德出生于南意大利的希腊殖民城埃利亚。该城由躲避波斯扩张的福凯亚人建立，处在爱奥尼亚知识传统与大希腊宗教—政治网络的交汇处。后世说他为城邦制定法律，也把他与色诺芬尼或毕达哥拉斯传统相连，但直接师承难以确认。他写过一首后来通称《论自然》的哲学诗：叙述者乘车抵达女神之门，先学习“真理之路”，再听取凡人的宇宙解释。罗素把他视为形而上学与逻辑论证的重大起点；现代研究则更重视诗中并未被简单抛弃的自然研究。`,timeline:[{date:`约前 515`,place:`埃利亚`,title:`出生`,detail:`年代主要由柏拉图对话中的戏剧日期反推；对话本身并非可靠编年记录。`,certainty:`推定`},{date:`前 5 世纪前期`,place:`埃利亚`,title:`写作哲学诗`,detail:`作品以神圣启示的旅程开场，却在核心部分使用连续推理考察“存在”必须具有什么属性。`,certainty:`较可靠`},{date:`前 5 世纪`,place:`埃利亚`,title:`立法者传统`,detail:`斯彪西波等后世作者称他为埃利亚制定法律；当地每年要求官员遵守“巴门尼德法律”的说法无法独立核验。`,certainty:`传统记载`},{date:`约前 450`,place:`雅典（柏拉图叙事）`,title:`与青年苏格拉底论辩`,detail:`柏拉图让年老的巴门尼德与芝诺访问雅典；这一场景首先服务于理念论批判，不宜直接当作旅行事实。`,certainty:`传统记载`}],inquiries:[{object:`思想、言说与存在`,question:`一条可被认识的探究道路，最低限度必须满足什么条件？`,start:`人可以思考和说出“是”；但若声称研究“不是”，研究对象就在被指认时取消了自身。`,steps:[`区分‘是’与‘不是’两条道路`,`指出非存在不可被认识或说出`,`禁止用非存在说明存在`,`把可思性当作宇宙论必须遵守的逻辑门槛`],conclusion:`可靠探究只能沿着“存在”展开。这里的关键不是先观察世界，再列材料，而是先检查一个解释是否自相矛盾。`},{object:`生成、消灭与运动`,question:`若存在不能来自非存在，它还能真正生成或改变吗？`,start:`生成意味着先前不存在；消灭意味着后来不再存在。二者都要求把非存在写进解释。`,steps:[`排除从无到有与从有到无`,`排除存在内部的空缺和断裂`,`由连续性推出不可分`,`由完整性推出不动、均一和无始无终`],conclusion:`“真正存在者”是不生不灭、完整连续、同质而不动的。经验变化若仍要被说明，就必须重新定义而不能诉诸无中生有。`},{object:`凡人意见与宇宙论`,question:`严格的存在论之后，为什么诗还要详细说明光、夜、天体和生命？`,start:`女神在真理之后转述凡人以光和夜组织世界的解释，并建立相当完整的宇宙生成图景。`,steps:[`承认人类经验以相反性质分类`,`用光与夜的混合排列现象`,`说明天体、性别与生命生成`,`把可接受的经验模型置于更高逻辑约束之下`],conclusion:`“意见”不必等于毫无价值的谬误；它可能是无法达到存在论确定性、却仍有系统性的自然解释。其地位是现代研究的核心争议。`}],concepts:[{zh:`存在者`,en:`what-is / to eon`,definition:`能够被思想和言说的对象；在真理之路上表现为不生不灭、连续、均一、完整而不动。`},{zh:`非存在`,en:`what-is-not`,definition:`不能被认识、陈述或充当生成来源的“不是”。巴门尼德用它检验解释是否偷偷依赖虚无。`},{zh:`真理之路`,en:`Way of Truth`,definition:`从“存在必定是，非存在不是”出发，以必要推论限定真实结构的探究道路。`},{zh:`凡人意见`,en:`Opinions of Mortals / doxa`,definition:`以光与夜等对立原则解释经验宇宙的部分；它与真理的关系可能是错误、次级模型或对现象的最佳说明。`},{zh:`思想与存在`,en:`thinking and being`,definition:`能被思想的对象不能彻底落入非存在；这条约束把认识条件转化为对真实结构的限制，也引出长期解释争论。`},{zh:`生成不可能`,en:`impossibility of coming-to-be`,definition:`若事物从非存在生成，便把不可思的‘无’当作来源；若从存在生成，则它早已存在，因此真正生成被排除。`}],lineage:{inherited:`继承爱奥尼亚自然哲学的宇宙整体问题，也可能接触毕达哥拉斯式宗教语言；但他的决定性变化是让解释先接受可思与可说条件的审查。`,school:`后世把巴门尼德、芝诺和麦里梭归为埃利亚学派。共同点是捍卫存在的统一与不变，并用论证揭露运动、多与分割的困难。`,influenced:`恩培多克勒、阿那克萨哥拉和原子论者都保留“不真正生成或毁灭”的约束，再以混合、分离或重排挽救经验变化；柏拉图和亚里士多德则把存在问题发展为体系性的本体论。`,parallel:`赫拉克利特同样寻找变化背后的可靠秩序；两人常被塑造成流变与静止的对立面，但是否直接互相批评并无定论。`},comparisons:[{target:`赫拉克利特`,relation:`同题比较`,shared:`都认为感官表象不足，世界必须有可理解的统一结构。`,difference:`赫拉克利特在有尺度的转换中保存同一；巴门尼德从可思性出发排除真实存在的生成和运动。`},{target:`芝诺`,relation:`影响后继`,shared:`以推论保护不变、统一的存在。`,difference:`巴门尼德正面说明存在的属性；芝诺多以反证展示承认运动与多会遭遇的悖论。`},{target:`恩培多克勒`,relation:`批评关系`,shared:`不允许存在真正产生或消失。`,difference:`恩培多克勒把不变性分配给四根，再用组合与分离解释可见变化。`},{target:`留基伯／德谟克利特`,relation:`批评关系`,shared:`保存基本存在者的不生不灭。`,difference:`原子论承认多个不可变原子，并把虚空作为运动条件，正面修正巴门尼德对非存在的禁令。`}],russellView:`罗素把巴门尼德与赫拉克利特并置为“万物变化”与“没有变化”两极。他尤其重建语言论证：凡能被思想或说出的东西必定存在，因此生成、消灭、运动和多样都不可能。罗素认为后来“实体”概念的历史任务，正是既向巴门尼德承认某种不变，又给经验变化留下空间。`,modernCorrection:`现代研究不再轻易把整首诗压缩成“现实只是一个静止球体”。作品保存了相当完整的宇宙论，并可能区分必要真理与现象模型，而非简单宣布自然研究无意义。“存在”究竟指唯一实体、必然存在方式，还是任何成功探究的对象，也仍存在严格一元论、模态解释等竞争读法。`,sources:[E(`第一卷第五章〈巴门尼德〉`),{label:`Stanford Encyclopedia · Parmenides`,kind:`补充`,url:`https://plato.stanford.edu/entries/parmenides/`},{label:`Internet Encyclopedia of Philosophy · Parmenides`,kind:`补充`,url:`https://iep.utm.edu/parmenid/`}]},{id:`empedocles`,order:7,nameZh:`恩培多克勒`,nameEn:`Empedocles of Acragas`,greekName:`Ἐμπεδοκλῆς`,dates:`约前 494—前 434`,active:`前 5 世纪中叶`,places:[`阿克拉加斯`,`西西里`,`大希腊`],school:`多元论自然哲学`,figureId:`empedocles`,chapterIds:[`b1-06`],thesis:`没有东西真正生成或消灭；四种永久的“根”在爱与争的作用下混合、分离，生命、感知和宇宙历史都是同一组关系的不同尺度。`,evidenceCaution:`作品以残篇和斯特拉斯堡纸草保存，传统上分为《论自然》与《净化》，但究竟是一部还是两部作品仍有争议。民主政治、治病神迹和跳入埃特纳火山等故事多来自晚期传记。`,lifeSummary:`恩培多克勒来自西西里富裕强盛的希腊城邦阿克拉加斯，生活在僭主政治瓦解、民主制度竞争及希腊人与迦太基势力长期对峙的环境中。古代传统称其家族有政治地位，他反对僭主或寡头、拒绝王位，也以医生、诗人、宗教教师和演说家著称；这些形象彼此交叠，却不能都当作可靠事件。他用诗歌同时讨论宇宙、生命、知觉、轮回和净化。比起把“科学”和“神秘”看成两个人格，更有效的理解是：同一个混合—分离宇宙论，也被用来说明身体和灵魂的命运。`,timeline:[{date:`约前 494`,place:`阿克拉加斯`,title:`出生`,detail:`出生于有影响力的家族是古代传统；具体年份由后世编年推定。`,certainty:`推定`},{date:`前 5 世纪中叶`,place:`阿克拉加斯`,title:`政治活动`,detail:`被描述为民主派、反僭主并曾解散寡头组织；故事可能保存历史记忆，也可能用来塑造哲人形象。`,certainty:`传统记载`},{date:`约前 450—前 430`,place:`西西里／大希腊`,title:`诗歌、医学与教学`,detail:`残篇把四根、爱与争、身体构造、知觉、轮回和净化放入相连的思想工程。`,certainty:`较可靠`},{date:`约前 434`,place:`地点不详`,title:`死亡与火山传奇`,detail:`亚里士多德传统说他约六十岁去世；跳入埃特纳火山以证明神性的故事是著名却不可靠的后世传奇。`,certainty:`推定`}],inquiries:[{object:`变化与基本成分`,question:`接受巴门尼德“不生不灭”的约束后，日常生成与毁灭怎样可能？`,start:`若从无到有不可能，就不能说木头、身体或世界被真正创造；但经验又显示事物不断出现和消失。`,steps:[`把生成改写为成分结合`,`把毁灭改写为成分分离`,`设定火、气、水、土四根永久平等`,`以比例差异解释不同物体与组织`],conclusion:`变化发生在关系与配比层，不发生在基本成分自身。四根像有限字母，能写出多种但并非任意的自然结构。`},{object:`宇宙运动与历史`,question:`不变成分为什么会组合和分开，并形成有方向的宇宙阶段？`,start:`只列四种材料仍不能解释它们为何运动、何时混合、何时分离。`,steps:[`以爱推动相异成分结合`,`以争推动成分分离`,`二力的相对优势周期变化`,`由完全融合的圆球到分离世界，再向相反方向循环`],conclusion:`爱与争是跨尺度的动力关系：它们不是简单的道德善恶，而使宇宙、身体和政治联结成周期性的结构。`},{object:`生命、感知与净化`,question:`同一套物理原则能否解释器官、认识与人的生活规范？`,start:`身体由四根混合，感觉器官与对象必须通过孔隙和流出物发生匹配；生命又被描述为流亡神灵的轮回。`,steps:[`让器官比例决定其功能`,`以流出物进入相合孔隙解释感觉`,`以‘同类认识同类’连接身体与对象`,`把杀生、饮食和轮回放进共同生命的宇宙亲缘`],conclusion:`自然论与净化论都反对绝对断裂：身体、动物、植物和宇宙共享材料与循环；伦理要求因而获得宇宙论背景。`}],concepts:[{zh:`四根`,en:`four roots`,definition:`火、气、水、土四种平等、不生不灭的基本成分。后世称“四元素”，但“根”更能显示其生成多样结构的功能。`},{zh:`爱`,en:`Love / Philotēs`,definition:`使不同成分结合、趋向统一的宇宙力量；不等于日常情感，也不在所有阶段都只产生良好结果。`},{zh:`争`,en:`Strife / Neikos`,definition:`使混合物分解、相同成分聚集的力量；与爱相互消长，不能简单归结为纯粹邪恶。`},{zh:`宇宙循环`,en:`cosmic cycle`,definition:`爱与争轮流占优，使世界在融合、分离及重新结合之间演化；循环究竟包含一个还是两个完整宇宙生成过程仍有争论。`},{zh:`流出物与孔隙`,en:`effluences and pores`,definition:`对象发出的微粒进入器官中相合的孔隙，由此解释感知、吸引与部分身体过程。`}],lineage:{inherited:`接受巴门尼德关于真正存在者不生不灭的限制，也继承毕达哥拉斯—俄耳甫斯传统的轮回与净化问题，并吸收西西里医学和自然观察。`,school:`通常与阿那克萨哥拉并列为前苏格拉底多元论者：不再寻找单一变化材料，而以多个永久成分的重排保存经验世界。`,influenced:`四元素框架经柏拉图、亚里士多德和希波克拉底医学长期延续；爱与争、孔隙感知和生物组合也成为后世自然哲学的反复参照。`,parallel:`阿那克萨哥拉同样把生成改为混合和分离，却拒绝只有四种基本材料；原子论则把成分简化为形状不同但无性质差异的原子。`},comparisons:[{target:`巴门尼德`,relation:`批评关系`,shared:`基本存在者不能从无生成或彻底消灭。`,difference:`巴门尼德将真实存在推向一与不动；恩培多克勒承认四种不变成分及其空间重组。`},{target:`阿那克萨哥拉`,relation:`同题比较`,shared:`以永久成分的混合和分离解释可见生成。`,difference:`恩培多克勒用四根及爱、争；阿那克萨哥拉主张无限多种成分，并以努斯启动旋转。`},{target:`德谟克利特`,relation:`同题比较`,shared:`宏观性质由更基本单位的组合方式产生。`,difference:`四根本身带有火水等性质，且受两种宇宙力支配；原子只以形状、次序和位置区别，在虚空中机械运动。`},{target:`达尔文`,relation:`后世重构`,shared:`不合适的生物组合消失、较能生存的结构留下。`,difference:`恩培多克勒没有遗传、种群与累积选择理论；其怪异肢体组合只是宇宙阶段中的自然生成模型。`}],russellView:`罗素把恩培多克勒写成哲学家、先知、科学家与“江湖术士”的奇特混合，既赞赏水钟实验、空气压力、离心力及植物性别等观察，也详细转述神性宣称和火山传奇。理论上，他突出四元素、爱与争以及循环宇宙，认为恩培多克勒在保存巴门尼德不变性的同时重新允许变化。`,modernCorrection:`“科学家与骗子并存”的肖像过度依赖晚期传记，也把现代学科边界投射到诗人身上。新纸草材料显示物理宇宙论与宗教净化可能比罗素设想得更紧密。四根不是现代化学元素，爱与争也兼具物理、心理和伦理语义；关于一个或两个宇宙生成过程尚无定论。`,sources:[E(`第一卷第六章〈恩培多克勒〉`),{label:`Stanford Encyclopedia · Empedocles`,kind:`补充`,url:`https://plato.stanford.edu/entries/empedocles/`},{label:`Internet Encyclopedia of Philosophy · Empedocles`,kind:`补充`,url:`https://iep.utm.edu/empedocl/`}]},{id:`anaxagoras`,order:8,nameZh:`阿那克萨哥拉`,nameEn:`Anaxagoras of Clazomenae`,greekName:`Ἀναξαγόρας`,dates:`约前 500—前 428`,active:`约前 462—前 432 在雅典`,places:[`克拉佐梅奈`,`雅典`,`兰普萨库斯`],school:`多元论自然哲学`,figureId:`anaxagoras`,chapterIds:[`b1-08`],thesis:`一切可见事物都由无限多种成分混合而成，并以某类成分占优势获得名称；独立而未混合的努斯启动旋转，使原始混合物逐渐分离成有序宇宙。`,evidenceCaution:`生平主要来自数百年后的传记，入雅典、审判与流亡的日期互有冲突。“种子”和“同质部分”常由后世术语反向概括；努斯究竟是目的因还是卓越的运动起点也长期有争议。`,lifeSummary:`阿那克萨哥拉出生于爱奥尼亚城邦克拉佐梅奈，成年后长期居住雅典，通常被视为把爱奥尼亚自然研究带入古典雅典的关键人物。他与伯里克利政治圈关系密切，古代传统还把欧里庇得斯列为学生。其自然解释把太阳说成炽热石块、月亮说成土质天体，并说明日月食；这些观点后来被联系到“不敬神”指控。审判究竟发生于何时、是否具有打击伯里克利的政治动机并不确定。他离开雅典后在小亚细亚的兰普萨库斯教学并去世，当地据说长期纪念他。`,timeline:[{date:`约前 500`,place:`克拉佐梅奈`,title:`出生`,detail:`来自富裕家庭、放弃产业求知的故事带有哲人传记模式；出生地较为确定。`,certainty:`推定`},{date:`约前 462`,place:`雅典`,title:`进入雅典知识与政治圈`,detail:`传统称他在雅典活动约三十年，并与伯里克利交往；准确起止日期有争议。`,certainty:`传统记载`},{date:`前 5 世纪中叶`,place:`雅典`,title:`自然论写作与教学`,detail:`以原始混合、无限可分、努斯旋转及天体自然解释建立一个从宇宙到感觉的系统。`,certainty:`较可靠`},{date:`约前 432—前 428`,place:`雅典 → 兰普萨库斯`,title:`受审、离开雅典并去世`,detail:`因太阳和月亮理论被控不敬神、后获伯里克利营救的叙事广为流传，但时间与细节无法确证。`,certainty:`传统记载`}],inquiries:[{object:`生成、混合与性质`,question:`若没有真正生成，一种食物为什么能长成血、骨、毛发等不同组织？`,start:`从面包和水中不可能凭空产生原先完全不存在的性质，因此成品的成分必须已经以微量存在。`,steps:[`否定绝对生成和消灭`,`设定原始状态中万物混在一起`,`主张任何混合物都含有各种成分`,`用占优势的成分说明事物为何被命名为金、肉或骨`],conclusion:`“一切在一切之中”不是说每物外观相同，而是没有纯粹隔绝的材料；可见性质来自混合比例和优势。`},{object:`努斯与宇宙秩序`,question:`若最初一切混合且静止，分离和秩序从何开始？`,start:`混合物自身没有明显理由打破均衡，也不能解释宇宙旋转为何具有可辨方向和层次。`,steps:[`把努斯规定为最精纯且不与他物混合`,`赋予它对万物的知识和支配力`,`由努斯启动局部旋转`,`旋转扩大并使稀密、冷热、明暗逐步分离`],conclusion:`努斯为秩序提供独立起点，但作品后续主要依靠碰撞、旋转和分离说明细节；它是否始终按目的安排宇宙仍有争议。`},{object:`天体、感觉与不可见结构`,question:`人怎样从有限感官推知巨大天体和微小成分？`,start:`太阳看似神圣圆盘、食物看似单一，感官却只呈现尺度有限的表面。`,steps:[`把太阳解释为炽热石块、月亮解释为土质天体`,`用遮蔽说明日月食`,`以相反性质的刺激解释感觉`,`由可见现象推断其中隐藏的成分和过程`],conclusion:`现象既会限制认识，也能成为通往不可见结构的线索；自然解释因此不必服从传统神话分类。`}],concepts:[{zh:`努斯`,en:`Nous / Mind`,definition:`唯一不与其他成分混合、具有知识与力量并启动宇宙旋转的原则；可译“心灵”或“理智”。`},{zh:`万物混合`,en:`everything in everything`,definition:`每个可分混合物中都含有各种类型的成分，没有绝对纯物；差异来自比例而非某种性质凭空出现。`},{zh:`优势原则`,en:`predominance`,definition:`一个对象按其中占优势的成分被感知和命名，因此少量其他成分可以存在而不改变其日常分类。`},{zh:`无限可分`,en:`infinite divisibility`,definition:`没有最小部分；无论取多小的量仍含有多种成分。这与原子论的不可分单位形成直接对照。`},{zh:`旋转`,en:`cosmic rotation`,definition:`由努斯启动、范围不断扩大的涡旋运动，使冷热、稀密等成分分离并形成天体和世界。`}],lineage:{inherited:`接受巴门尼德关于无中生有不可能的限制，也延续爱奥尼亚气象和天体研究；其长期雅典生活把两地的知识网络连接起来。`,school:`属于多元论者，但不把基本成分限制为四种，也不承认物质最小单位；其系统由无限混合物与独立努斯共同构成。`,influenced:`苏格拉底—柏拉图传统从努斯中期待目的论，却批评他实际多用机械原因；亚里士多德赞赏他把心灵与混合物分开，同时认为其使用不充分。`,parallel:`恩培多克勒用四根和两力解决同一变化难题；原子论同样依靠重排，却用不可分原子和虚空取代无限可分、万物互含的混合物。`},comparisons:[{target:`恩培多克勒`,relation:`同题比较`,shared:`不存在真正生成或毁灭，只有永久成分的混合与分离。`,difference:`恩培多克勒只有四根并由爱、争推动；阿那克萨哥拉承认无限多种成分，由努斯开启旋转。`},{target:`留基伯／德谟克利特`,relation:`同题比较`,shared:`物体性质取决于微观组成和排列过程。`,difference:`阿那克萨哥拉无限可分且一切互含；原子论设不可分原子，并允许真正空无的虚空。`},{target:`苏格拉底／柏拉图`,relation:`批评关系`,shared:`心灵应当与宇宙秩序有关。`,difference:`柏拉图笔下苏格拉底期待努斯说明何者最好，却发现阿那克萨哥拉主要诉诸空气、以太和机械运动。`},{target:`亚里士多德`,relation:`影响后继`,shared:`不能只列物质，还需说明运动和秩序来源。`,difference:`亚里士多德把目的、形式、动力和材料系统区分；阿那克萨哥拉的努斯更多承担最初运动与分离功能。`}],russellView:`罗素认为阿那克萨哥拉的原创性不及毕达哥拉斯、赫拉克利特或巴门尼德，但历史位置重要：他把哲学带到雅典，并首次明确提出心灵是主要原因。罗素同时沿用柏拉图和亚里士多德的批评——努斯启动旋转后很少出场，具体解释仍主要是物质和机械的。`,modernCorrection:`审判与流亡叙事受后期政治传记影响，不宜写成确定事实。“种子”和亚里士多德的“同质部分”也不能无条件当作本人技术词。现代解释更注意其彻底的无限主义：没有最小量，也没有纯物质；努斯虽启动秩序，却未必是按照人类价值选择“最好世界”的人格设计者。`,sources:[E(`第一卷第八章〈阿那克萨哥拉〉`),{label:`Stanford Encyclopedia · Anaxagoras`,kind:`补充`,url:`https://plato.stanford.edu/entries/anaxagoras/`},{label:`Internet Encyclopedia of Philosophy · Anaxagoras`,kind:`补充`,url:`https://iep.utm.edu/anaxag/`}]},{id:`leucippus`,order:9,nameZh:`留基伯`,nameEn:`Leucippus`,greekName:`Λεύκιππος`,dates:`约前 5 世纪`,active:`约前 440 年前后`,places:[`阿布德拉（传统归属）`,`米利都／埃利亚（不同传统）`],school:`古代原子论`,figureId:`leucippus`,chapterIds:[`b1-09`],thesis:`把巴门尼德式的不变存在拆分为无数不可分实体，并承认真正的虚空，从而让运动、分离和重组在不依赖生成毁灭的条件下成为可能。`,evidenceCaution:`留基伯是本批材料最薄弱的人物：出生地、生卒年、师承和著作归属都不确定，伊壁鸠鲁甚至否认其存在。多数古代证言仍把他列为德谟克利特老师及原子论创始者，但两人的学说通常无法逐条拆分。`,lifeSummary:`留基伯大概活动于前五世纪，传统分别把他的故乡说成米利都、埃利亚或阿布德拉。他常被安排在芝诺之后、德谟克利特之前：先理解埃利亚学派对运动与非存在的挑战，再提出原子和虚空作为回应。亚里士多德和泰奥弗拉斯托斯明确把原子论开端归给他，并说德谟克利特是其同伴或学生；但没有独立传记可重建旅行、政治交往或确切年代。题为《大宇宙系统》和《论心灵》的作品曾归于他，现仅存一句著名残言，且著作归属同样可能在原子论共同传统中移动。`,timeline:[{date:`前 5 世纪前半`,place:`米利都／埃利亚／阿布德拉`,title:`出身与活动地`,detail:`三个地点分别见于不同古代传统，无法据此选择一条确定迁移路线。`,certainty:`传统记载`},{date:`约前 440`,place:`阿布德拉`,title:`原子论形成`,detail:`相对年代来自他先于德谟克利特、又回应巴门尼德与芝诺问题的思想位置。`,certainty:`推定`},{date:`前 5 世纪`,place:`阿布德拉（传统归属）`,title:`与德谟克利特合作或师承`,detail:`后世通常称德谟克利特为学生，但两人可能代表一个难以拆分的研究传统。`,certainty:`传统记载`}],inquiries:[{object:`运动与虚空`,question:`若非存在不能存在、存在内部没有空缺，运动如何可能？`,start:`巴门尼德排除非存在，芝诺展示连续分割中的运动困难；经验却迫使解释保留运动与多。`,steps:[`接受基本存在者不生成、不毁灭`,`把存在者改为无数不可分实体`,`承认虚空以提供间隔和移动空间`,`用位置重排代替性质生成`],conclusion:`原子是“有”，虚空在某种意义上是“无”，但无也必须作为空间条件存在。原子论由此对埃利亚禁令作出最直接修正。`},{object:`因果与宇宙形成`,question:`没有设计者，原子运动怎样形成世界？`,start:`若原子和虚空足以解释变化，就不应在每个结果处再加入目的或神意。`,steps:[`设定原子在无限虚空中持续运动`,`不同形状与运动形成涡旋`,`碰撞、缠结与筛分产生复合体`,`让世界形成服从必然性而非预设目的`],conclusion:`现存残言称没有事物无缘无故发生，一切出于理由与必然；但具体机械模型多由留基伯—德谟克利特共同证言保存。`}],concepts:[{zh:`原子`,en:`atomon / indivisible`,definition:`不可切分、内部无空隙且本身不改变的微小实体；古代“不可分”是理论属性，不等于现代物理学原子。`},{zh:`虚空`,en:`void`,definition:`原子之间的空无间隔，使多、运动和重组成为可能；它是原子论对“非存在不能存在”的关键修正。`},{zh:`必然`,en:`necessity / anankē`,definition:`现象由原子先前的运动、碰撞和结构关系产生，而非为某种目的临时安排。`}],lineage:{inherited:`主要思想背景是巴门尼德和芝诺对非存在、分割与运动的限制；出生地传统又可能把他连接到米利都自然哲学。`,school:`古代原子论的创始层。留基伯与德谟克利特的文本、命题和声誉高度重叠，因此页面只把古代证言较一致的“创始角色”谨慎归给他。`,influenced:`德谟克利特把原子论扩展为宇宙、知觉、生命、文化与伦理的广泛系统；伊壁鸠鲁和卢克莱修后来调整原子运动并赋予其伦理目标。`,paral
