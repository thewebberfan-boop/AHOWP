lel:`恩培多克勒和阿那克萨哥拉都以不变成分重排回答巴门尼德，但只有原子论明确设定不可分单位和虚空。`},comparisons:[{target:`巴门尼德／芝诺`,relation:`批评关系`,shared:`基本存在者不生成、不消灭，并认真接受关于运动的逻辑困难。`,difference:`留基伯允许多个存在者和作为间隔的虚空，从而恢复运动；这正是埃利亚学派拒绝的条件。`},{target:`德谟克利特`,relation:`影响后继`,shared:`原子、虚空、机械运动与必然性构成共同理论。`,difference:`古代传统通常把发明归给留基伯、系统发展归给德谟克利特，但具体命题往往无法可靠分配。`},{target:`阿那克萨哥拉`,relation:`同题比较`,shared:`用微观重排而非真实生成解释宏观变化。`,difference:`阿那克萨哥拉坚持无限可分和万物互含；留基伯以不可分原子和空无间隔终止分割。`}],russellView:`罗素在“原子论者”一章把留基伯和德谟克利特合并处理，因为二人的思想很难分开。他把原子论视为前苏格拉底自然研究的高潮：既接受巴门尼德关于基本存在不变的洞见，又通过多个原子和虚空给经验变化以清晰机械解释。`,modernCorrection:`不能把共同原子论系统中的每一条命题都写成留基伯个人发现，也不能由伊壁鸠鲁的否认直接断言他是虚构人物。最稳妥的层级是：历史存在有较强古代见证；创始作用很可能真实；具体生平、书目以及与德谟克利特的分工则高度不确定。页面采用的版画是十八世纪后世想象，不是肖像记录。`,sources:[E(`第一卷第九章〈原子论者〉`),{label:`Stanford Encyclopedia · Ancient Atomism`,kind:`补充`,url:`https://plato.stanford.edu/entries/atomism-ancient/`},{label:`Internet Encyclopedia of Philosophy · Leucippus`,kind:`补充`,url:`https://iep.utm.edu/leucipp/`}]},{id:`democritus`,order:10,nameZh:`德谟克利特`,nameEn:`Democritus of Abdera`,greekName:`Δημόκριτος`,dates:`约前 460—前 370`,active:`前 5 世纪后半`,places:[`阿布德拉`,`雅典（传统记载）`,`埃及与东方（旅行传统）`],school:`古代原子论`,figureId:`democritus`,chapterIds:[`b1-09`],thesis:`真实层只有形状各异的原子与虚空；感官性质、生命和世界由原子的数量、排列与运动关系生成，而伦理上的安宁则来自调节欲望、判断与生活尺度。`,evidenceCaution:`著作目录庞大却几乎全失，现存残篇和后世摘要的真伪、分类常有争议。旅行范围与“笑的哲学家”形象高度传奇化；许多物理命题也只能归给留基伯—德谟克利特共同体系。`,lifeSummary:`德谟克利特出生于色雷斯海岸的希腊城邦阿布德拉，与苏格拉底大致同时，却因理论延续早期自然哲学而被罗素放在苏格拉底之前讨论。传统说他继承财产后广泛旅行至埃及、波斯甚至更远地区，又曾到雅典而无人认识；可靠程度不一，却反映其后来“博学研究者”的名声。他写作范围据说覆盖宇宙、数学、感觉、医学、语言、技术和伦理。雅典哲学传统很少直接保存其作品，亚里士多德却持续认真讨论他的理论。后世称他为“笑的哲学家”，把节制、愉悦与看透人事结合成一种人物图像。`,timeline:[{date:`约前 460`,place:`阿布德拉`,title:`出生`,detail:`古代编年分歧很大；可以较稳妥地把他视为苏格拉底的同时代人。`,certainty:`推定`},{date:`前 5 世纪后半`,place:`地中海东部（旅行传统）`,title:`旅行与学习`,detail:`埃及、巴比伦、波斯乃至印度的行程多由晚期材料扩大，不宜画成确定路线。`,certainty:`传统记载`},{date:`约前 430 后`,place:`阿布德拉`,title:`扩展原子论体系`,detail:`将原子和虚空应用于宇宙、感觉、心灵、生命与文化解释，并形成大量著作传统。`,certainty:`较可靠`},{date:`约前 370`,place:`阿布德拉`,title:`去世与接受史`,detail:`长寿、公众尊崇及“笑的哲学家”故事主要塑造后世形象；确切卒年未知。`,certainty:`推定`}],inquiries:[{object:`原子结构与宏观变化`,question:`只有不变原子和虚空，如何产生不同物体、性质与世界？`,start:`若原子内部没有差异性质，就必须让差异来自它们之间的可重复关系。`,steps:[`让原子只在形状、大小上不同`,`用次序和位置区分结构`,`以碰撞、缠结、排列形成复合体`,`以分散解释复合物消灭，并允许无限虚空中形成无数世界`],conclusion:`宏观生成是结构涌现：基本单位保持不变，关系却能产生密度、质地、天体和生命等多层现象。`},{object:`感觉与知识`,question:`若颜色、甜苦只由原子互动产生，感官还能提供真实吗？`,start:`同一食物对不同身体可能呈现不同味道，说明性质不只属于对象本身；但理性又必须从感觉获得材料。`,steps:[`让对象释放原子薄膜作用于器官`,`用原子形状与器官状态解释感觉差异`,`区分约定性的感官性质与原子、虚空的真实结构`,`承认理性若否定全部感官，也会摧毁自身证据`],conclusion:`知识具有层级而非简单二分：感官给出现象，理性推断其微观原因；两者相互依赖且都可能受身体条件限制。`},{object:`人的生活、文化与安宁`,question:`一个机械自然世界中，怎样形成可实践的好生活？`,start:`幸福若依赖财富、名声或无限欲望，就持续受外界偶然运动支配。`,steps:[`把愉悦与痛苦视为行动信号而非最高放纵`,`用衡量和节制限制欲望`,`让判断、习惯与教育重塑人的原子状态`,`以社会合作、技艺和语言解释人类从匮乏走向文化`],conclusion:`目标是“心灵安宁”或“愉悦的平衡”：不是逃离物质世界，而是在因果世界中通过理解与训练获得较稳定的生活结构。`}],concepts:[{zh:`原子`,en:`atoms`,definition:`实在、坚实、不可切分且不生不灭的单位；彼此主要以形状、大小、次序和位置区分。`},{zh:`虚空`,en:`void`,definition:`原子运动和彼此分离所需的空无空间；与原子共同构成现实的两个基本方面。`},{zh:`约定性质`,en:`qualities by convention`,definition:`颜色、声音、冷热、甜苦不是孤立原子自带的性质，而在原子结构与感知者身体互动时出现。`},{zh:`必然性`,en:`necessity`,definition:`自然事件由原子运动及先行条件产生，无须诉诸为人安排的目的；它不是宿命预言，而是因果连续性。`},{zh:`心灵安宁`,en:`euthymia / cheerfulness`,definition:`通过节制、衡量、知识和稳定判断获得的平衡愉悦；与后来伊壁鸠鲁的宁静相近但不能完全等同。`},{zh:`物象`,en:`eidōla / images`,definition:`物体发出的细微原子结构作用于感官，用以说明视觉、梦与表象如何从外物到达身体。`},{zh:`尺度与节制`,en:`measure and moderation`,definition:`通过比较欲望、能力与后果维持心灵平衡；显示德谟克利特伦理并非由机械原子论简单自动推出。`}],lineage:{inherited:`直接发展留基伯的原子与虚空，并通过这一框架回答巴门尼德和芝诺；同时延续爱奥尼亚传统以自然过程统一解释天体、生命与人。`,school:`古代原子论的第一位大型系统化者。其机械自然论与伦理残篇共同属于德谟克利特传统，但二者是否组成一个严格演绎体系尚不确定。`,influenced:`伊壁鸠鲁继承原子、虚空和感觉论，却修改原子运动并建立以解除恐惧为目的的共同体伦理；卢克莱修将其转化为拉丁哲学诗。近代机械哲学又把德谟克利特视为古代先驱。`,parallel:`阿那克萨哥拉以无限混合和努斯解释同一组变化问题；柏拉图、亚里士多德也讨论感知和物质结构，却反对把形式、目的与价值完全还原为碰撞。`},comparisons:[{target:`留基伯`,relation:`承接前人`,shared:`原子、虚空、涡旋和非目的性的自然解释。`,difference:`传统把基本创意归给留基伯，把广泛系统化归给德谟克利特；具体边界大多无法确定。`},{target:`阿那克萨哥拉`,relation:`同题比较`,shared:`宏观对象由不可见成分及其关系解释。`,difference:`阿那克萨哥拉的成分无限可分、每物含一切，并由努斯启动；德谟克利特的原子不可分，在虚空中按机械必然运动。`},{target:`柏拉图／亚里士多德`,relation:`批评关系`,shared:`自然应当具有可说明的结构，感觉不能直接等同于真实。`,difference:`二人要求形式、目的或善在解释中发挥作用；德谟克利特优先用原子位置、碰撞和身体状态说明现象。`},{target:`伊壁鸠鲁`,relation:`影响后继`,shared:`以原子论消除神意对自然事件的任意干预，并把认识连接到生活安宁。`,difference:`伊壁鸠鲁加入原子偏斜、强调自由和无恐惧，把物理学更明确地服务于治疗性伦理。`}],russellView:`罗素把德谟克利特视为前苏格拉底科学精神的顶峰，也是后来哲学开始退让给伦理与宗教之前的最后一位纯粹自然解释者。他赞赏原子论用坚实不可变的单位、虚空和机械碰撞统一解释变化，也指出其因果决定论、感觉理论和无穷世界设想具有惊人的现代感。`,modernCorrection:`把德谟克利特称为“现代科学家”会掩盖古代论证背景：原子首先回应存在、分割和运动问题，而非实验检测到的粒子；古代原子也不是今天可分的化学原子。其伦理学并非附带格言，而可能通过身体—心灵连续性与自然论相连，但现存文本不足以证明一套从物理必然推出伦理规范的完整体系。现用雕像亦为身份不明的希腊头像，只作视觉识别。`,sources:[E(`第一卷第九章〈原子论者〉`),{label:`Stanford Encyclopedia · Ancient Atomism`,kind:`补充`,url:`https://plato.stanford.edu/entries/atomism-ancient/`},{label:`Internet Encyclopedia of Philosophy · Democritus`,kind:`补充`,url:`https://iep.utm.edu/democrit/`}]},{id:`protagoras`,order:11,nameZh:`普罗泰戈拉`,nameEn:`Protagoras of Abdera`,greekName:`Πρωταγόρας`,dates:`约前 490—前 420`,active:`前 5 世纪中后期`,places:[`阿布德拉`,`雅典`,`图里`],school:`智者运动`,figureId:`protagoras`,chapterIds:[`b1-10`],thesis:`人的具体经验是判断事物如何呈现的尺度；既然公共事务没有超人的直接真理入口，哲学就必须训练比较相反论证、改善判断并形成可共同生活的制度。`,evidenceCaution:`真实残篇不足十条，大部分材料来自柏拉图、亚里士多德等论敌。审判、焚书和海难故事互相冲突；“人是万物的尺度”究竟是感觉相对主义、实践判断论还是更广泛的人文立场，仍有争议。`,lifeSummary:`普罗泰戈拉出生于色雷斯海岸的阿布德拉，是最早公开以“智者”身份巡回收费教学的人之一。他至少两次到雅典，与伯里克利关系密切，并在前 444／443 年受托为南意大利泛希腊殖民城图里拟定政制。民主法庭、议会和城邦竞争使演说、概念区分与预判后果成为可出售的公共能力。后世说他因《论诸神》的不可知论被控不敬神、离城后遇海难；柏拉图却把他描述为享有声望并活到高龄，故这些结局无法确证。其著作几乎全失，题名显示兴趣横跨论辩、语言、政治与教育。`,timeline:[{date:`约前 490`,place:`阿布德拉`,title:`出生`,detail:`柏拉图称他比对话中的成年智者年长一代，由此通常推至前 490 年代；家庭出身传说彼此矛盾。`,certainty:`推定`},{date:`前 5 世纪中叶`,place:`希腊城邦网络`,title:`以智者身份巡回教学`,detail:`教授家庭和城邦事务中的“善于谋划”，并训练语言、诗歌解释和相反论证；收费使教育成为公开职业。`,certainty:`较可靠`},{date:`前 444／443`,place:`图里`,title:`参与制定殖民城政制`,detail:`伯里克利委托他为新城图里拟定法律或政制，显示其政治思想与民主实践并非纯粹修辞游戏。`,certainty:`较可靠`},{date:`约前 420`,place:`雅典／爱琴海`,title:`生命末期`,detail:`受审、焚书、逃亡和海难的故事可能把不可知论塑造成受神罚的传记；确切死因不明。`,certainty:`推定`}],inquiries:[{object:`知识与人的尺度`,question:`同一阵风对一人冷、对另一人不冷时，谁掌握事物的真实样貌？`,start:`人只能在自己的身体、历史经验和处境中接触事物，无法跳到一个无人称的神圣观察点。`,steps:[`从感觉差异扩展到意见和价值判断`,`把‘事物’理解为事物与人的关系`,`拒绝以单一表象取消另一表象`,`区分判断是否更好与是否更真`],conclusion:`每个人是事物向其呈现方式的尺度。命题不必否定外部世界；它限制的是脱离经验而宣称唯一尺度的资格。`},{object:`论辩、教育与改进`,question:`若相反意见各有处境基础，教师还能做什么？`,start:`相对性若只等于‘人人都对’，收费教学将失去理由，公共选择也无法区分优劣。`,steps:[`为每件事辨认相反论证`,`分析词义、语法与听众处境`,`预判意见在个人和城邦中的后果`,`用教育把较差状态转为较好状态`],conclusion:`智者不垄断绝对真理，而改善谋划和表达。较好的判断能带来健康、秩序或共同利益，即使不能被宣布为超历史真理。`},{object:`政治共同体与德性`,question:`民主为何可以让普通公民共同判断正义，而不只交给少数专家？`,start:`造船需要专业知识，但所有公民都被允许参与正义和政治问题；这种差别需要解释。`,steps:[`区分维持生存的专门技艺与共同生活能力`,`以神话说明正义感和羞耻感被普遍分配`,`承认习俗塑造判断`,`用教育、法律和讨论持续改善公民能力`],conclusion:`政治德性不是少数天才的秘密技术，而是人人必须具有、程度又可训练的共同能力；这为民主论辩提供了认识论基础。`}],concepts:[{zh:`人是尺度`,en:`man-measure thesis`,definition:`人是事物如何对其显现和被评价的尺度；“人”可指具体个人，也可能包含共享经验形成的共同体。`},{zh:`相反论证`,en:`antilogiai / opposing arguments`,definition:`同一问题可以形成彼此对立的论证。训练目标不只是获胜，也包括暴露判断对前提和处境的依赖。`},{zh:`善于谋划`,en:`euboulia / good deliberation`,definition:`在家庭和城邦事务中判断行动、语言及其后果的实践能力，是普罗泰戈拉自述的教学目标。`},{zh:`诸神不可知`,en:`agnosticism about the gods`,definition:`由于问题晦暗且人生短暂，无法确定诸神存在、不存在或形貌；这是知识限度声明，不等于证明无神。`},{zh:`政治德性`,en:`political virtue`,definition:`参与共同生活所需的正义感、羞耻感和判断能力；它被广泛分配，却仍须通过法律、教育与讨论训练。`},{zh:`使弱论证变强`,en:`making the weaker argument stronger`,definition:`古代争议性标签，可指训练从不利立场提出更有效论证；它既可能服务审辨，也可能被批评为修辞胜过真理。`}],lineage:{inherited:`继承前苏格拉底关于真理、感觉和世界的争论，却把问题从宇宙结构转到人的经验、语言和政治判断；阿布德拉背景不证明他师从较年轻的德谟克利特。`,school:`智者不是共享教义的严密学派，而是收费巡回教学、公共演说和政治教育的职业网络。普罗泰戈拉是其中最早且最具理论深度的代表。`,influenced:`欧里庇得斯等雅典文化人物受到智者论辩氛围影响；柏拉图以《普罗泰戈拉》《泰阿泰德》系统回应其相对主义，亚里士多德又用不矛盾律批评它。`,parallel:`现代实用主义同样区分抽象真理与判断后果，但不能把普罗泰戈拉直接写成现代实用主义者；民主教育与价值相对主义之间也不是必然等号。`},comparisons:[{target:`巴门尼德`,relation:`批评关系`,shared:`都从‘何者可被说真’重组哲学问题。`,difference:`巴门尼德排除凡人意见以维护唯一可靠道路；普罗泰戈拉把具体人的经验重新确立为不可越过的判断条件。`},{target:`苏格拉底`,relation:`同题比较`,shared:`都在公共对话中检验德性、教育和城邦判断。`,difference:`普罗泰戈拉教授可改善的谋划与表达；苏格拉底更执着于追问跨处境的定义，并拒绝以收费宣称传授德性。`},{target:`柏拉图`,relation:`批评关系`,shared:`都承认教育会改变灵魂和政治判断。`,difference:`柏拉图要求理念与善提供超越意见的标准；普罗泰戈拉从人的经验与共同后果内部比较判断。`},{target:`实用主义`,relation:`后世重构`,shared:`可以说一种判断比另一种带来更好的实践结果。`,difference:`现代实用主义发展了探究共同体、可错论和真理理论；现存材料不足以把这些完整框架归给普罗泰戈拉。`}],russellView:`罗素把智者置于雅典民主法庭、财富和文化冲突中，反对照搬柏拉图的贬低。他把“人是尺度”解释为没有客观真理，却特别注意到柏拉图替普罗泰戈拉提出的修正：意见未必有真假高下，却可能有好坏后果。罗素因此把他连接到实用主义，并认为收费教学本身不比现代教授领薪更可耻。`,modernCorrection:`现代研究比罗素更谨慎：尺度命题不必宣称外部世界不存在，也不必等于所有命题都真；它可能主要说明性质和价值如何在具体经验关系中呈现。普罗泰戈拉对民主的支持不能只由柏拉图对话中的神话直接推定，但图里政制、善于谋划和普遍政治能力共同构成了较强线索。`,sources:[E(`第一卷第十章〈普罗泰戈拉〉`),{label:`Stanford Encyclopedia · Protagoras`,kind:`补充`,url:`https://plato.stanford.edu/entries/protagoras/`},{label:`Internet Encyclopedia of Philosophy · Protagoras`,kind:`补充`,url:`https://iep.utm.edu/protagor/`}]},{id:`socrates`,order:12,nameZh:`苏格拉底`,nameEn:`Socrates`,greekName:`Σωκράτης`,dates:`前 469／468—前 399`,active:`前 5 世纪后半`,places:[`雅典`,`波提狄亚`,`德利翁`],school:`苏格拉底式探问`,figureId:`socrates`,chapterIds:[`b1-11`],thesis:`哲学不是占有一套答案，而是让每个关于善、勇敢和正义的主张经受公开反诘；未经检验的信念不能可靠指导生活，承认无知则是继续探究的起点。`,evidenceCaution:`本人没有著作。阿里斯托芬、色诺芬和柏拉图提供互相冲突的形象，亚里士多德又属后见者；很难把柏拉图对话中的理念论、灵魂不朽论与历史苏格拉底逐项分开，这就是“苏格拉底问题”。`,lifeSummary:`苏格拉底是雅典公民，父亲传统上被称为石匠索弗洛尼斯科斯，母亲为助产妇斐纳瑞特。他生活在雅典帝国扩张、伯罗奔尼撒战争、寡头政变与民主复辟的连续危机中，作为重装步兵参加波提狄亚、德利翁等战役。与巡回智者不同，他长期在市场、体育场和私人场合免费交谈。前 406 年任五百人会议主席团成员时反对违法集体审判将领；前 404 年又拒绝三十僭主逮捕莱昂的命令。前 399 年被控不敬城邦诸神、引入新神灵并败坏青年，判死后拒绝逃亡，饮毒芹而死。`,timeline:[{date:`前 469／468`,place:`雅典`,title:`出生`,detail:`属于有资格服重装步兵役但并不富裕的公民家庭；具体职业与家庭细节多来自较晚传统。`,certainty:`较可靠`},{date:`前 432—前 422`,place:`波提狄亚／德利翁等地`,title:`参加伯罗奔尼撒战争`,detail:`柏拉图和色诺芬都保存其服役、耐苦与救助同伴的记载，细节带有典范化色彩。`,certainty:`较可靠`},{date:`前 406`,place:`雅典`,title:`反对违法集体审判将领`,detail:`抽签任主席团成员期间，坚持应分别审判阿吉纽西海战将领，显示其守法并不等于服从多数压力。`,certainty:`较可靠`},{date:`前 404`,place:`雅典`,title:`拒绝三十僭主命令`,detail:`寡头政府命他参与逮捕萨拉米斯的莱昂，他拒绝执行；政权很快倒台，因而未及惩罚。`,certainty:`较可靠`},{date:`前 399`,place:`雅典`,title:`受审并饮毒芹`,detail:`被判有罪后拒绝以逃亡取消自身的公共实践，在宗教节期延迟执行后于狱中死亡。`,certainty:`较可靠`}],inquiries:[{object:`德性概念与反诘`,question:`一个人自称知道勇敢、虔敬或正义时，他真的能给出不矛盾的说明吗？`,start:`公共生活充满自信判断，但举例、传统和权威并不自动构成对概念本身的认识。`,steps:[`请对话者提出一般定义`,`从其承认的案例和前提追问后果`,`暴露定义遗漏或相互矛盾`,`回到困惑而不以假答案填补`],conclusion:`反诘的直接成果常是“尚不知道”，但它清除了错误自信，并把德性从习俗口号变成必须持续论证的生活问题。`},{object:`知识、行动与灵魂照料`,question:`为什么人明知善却仍作恶；德性是否是一种知识？`,start:`人总在自己看来较好的方向行动；若选择了坏结果，可能是误判真正利益，而非清楚知道善仍纯粹选择恶。`,steps:[`把行动连接到行动者对善的判断`,`把错误行为追溯为无知或衡量失败`,`以论辩重排财富、名誉和灵魂的优先级`,`让自我检验成为持续实践`],conclusion:`照料灵魂首先是改善判断。‘无人自愿作恶’不是否认欲望冲突，而是把伦理失败的根部置于对何者真正有益的误认。`},{object:`个人良知、法律与死亡`,question:`当多数、政府命令和个人判断冲突时，哲学家应服从什么？`,start:`苏格拉底先后面对民主集会、三十僭主和陪审团；任何一方都可能作出不义决定。`,steps:[`不因多数威胁参与违法审判`,`不因寡头命令伤害无辜`,`在合法审判中公开坚持使命`,`拒绝以逃亡回报城邦的不义`],conclusion:`不能主动行不义，也不能以不义报不义；服从法律与批判公民不是简单二选一，而是要让行动能经受理性和公共责任检验。`}],concepts:[{zh:`反诘`,en:`elenchus`,definition:`从对话者自己的主张出发，通过问题检验其一致性；目标首先是揭露错误自信，不必每次给出正面学说。`},{zh:`承认无知`,en:`Socratic ignorance`,definition:`知道自己不具有所声称的智慧。它不是全面怀疑，而是区分可继续探究的问题与未经证明的自信。`},{zh:`灵魂照料`,en:`care of the soul`,definition:`使人的判断、欲望与行动趋向正义和善，优先于财富、名望及身体利益。`},{zh:`助产术`,en:`maieutic method`,definition:`柏拉图以其母亲职业作比喻：教师不把答案灌入学生，而协助其产出、检验并淘汰思想。`},{zh:`神灵征兆`,en:`daimonion`,definition:`苏格拉底自称从童年起出现、通常阻止某些行动的内在神圣信号；它不是一套可供他人服从的新宗教。`},{zh:`德性即知识`,en:`virtue is knowledge`,definition:`把正确行动连接到对善与真正利益的认识；它强调伦理可受理性检验，却可能低估欲望冲突与意志软弱。`},{zh:`无人自愿作恶`,en:`no one errs willingly`,definition:`作恶者是在善与利益上发生误认，而非清楚把坏当坏仍纯粹选择它；其准确范围取决于我们怎样区分苏格拉底与柏拉图。`},{zh:`未经审视的生活`,en:`the unexamined life`,definition:`生活若不持续检查自身理由、价值排序和公共责任，便不能仅凭生存、财富或名声证明其值得。`}],lineage:{inherited:`继承智者把语言、教育和城邦放到哲学中心的转向，也吸收自然哲学知识；但拒绝把论辩缩成可出售的成功工具。`,school:`没有制度化‘苏格拉底学院’。柏拉图、色诺芬、安提斯泰尼、阿里斯提卜等形成不同苏格拉底传统，分别发展理念论、犬儒主义和昔兰尼快乐论。`,influenced:`柏拉图让他成为大多数对话的主角；亚里士多德把归纳论证和一般定义追求归给他。犬儒、斯多葛和学院怀疑主义都从不同侧面认领苏格拉底。`,parallel:`孔子同样通过对话、人格示范和公共伦理影响学生，但两者的城邦制度、文本传统与对礼法的理解不同，只适合方法层比较。`},comparisons:[{target:`普罗泰戈拉`,relation:`同题比较`,shared:`哲学围绕教育、德性和公共言说展开。`,difference:`普罗泰戈拉承诺改善公民谋划；苏格拉底以反诘拒绝在未定义德性前宣称能直接传授它。`},{target:`柏拉图`,relation:`影响后继`,shared:`对话、灵魂照料及知识与善的连接。`,difference:`柏拉图发展理念、灵魂结构和理想政体；这些体系不能无条件写回没有著作的历史苏格拉底。`},{target:`第欧根尼`,relation:`后世重构`,shared:`用个人生活公开检验财富、权力和习俗。`,difference:`苏格拉底仍深度参与雅典公民秩序；犬儒派把自足和反习俗推进为身体化、跨城邦的激进实践。`},{target:`阿尔克西劳`,relation:`后世重构`,shared:`以问答清除自负，不把正面教条当作哲学终点。`,difference:`苏格拉底是否全面悬置判断并不确定；阿尔克西劳则针对斯多葛知识标准系统发展学院怀疑主义。`}],russellView:`罗素把“我们究竟知道历史苏格拉底多少”置于章节中心，比较色诺芬的保守道德家、柏拉图的哲学主角与阿里斯托芬的滑稽自然研究者。他认为相对可信的核心包括反诘、神灵征兆、德性即知识和无人自愿作恶，并赞赏其在审判中的独立，但也质疑把一切道德错误还原为知识错误。`,modernCorrection:`不能用简单的‘早期对话等于历史苏格拉底、晚期等于柏拉图’彻底解决来源问题；对话有文学目的，色诺芬和阿里斯托芬也各有体裁偏向。审判既不能只说成保守民主对自由思想的迫害，也不能只归咎于他与寡头学生的关系：宗教指控、战争创伤、公共形象和法庭策略共同作用。`,sources:[E(`第一卷第十一章〈苏格拉底〉`),{label:`Stanford Encyclopedia · Socrates`,kind:`补充`,url:`https://plato.stanford.edu/entries/socrates/`},{label:`Internet Encyclopedia of Philosophy · Socrates`,kind:`补充`,url:`https://iep.utm.edu/socrates/`}]},{id:`plato`,order:13,nameZh:`柏拉图`,nameEn:`Plato`,greekName:`Πλάτων`,dates:`前 428／427—前 348／347`,active:`前 4 世纪前半`,places:[`雅典`,`叙拉古`,`大希腊`],school:`柏拉图哲学／学院`,figureId:`plato`,chapterIds:[`b1-13`,`b1-14`,`b1-15`,`b1-16`,`b1-17`,`b1-18`],thesis:`可见世界不断变化，意见又受处境摆动；哲学必须寻找使多种事物可被共同理解和评价的稳定形式，并以灵魂教育把对善的认识连接到个人秩序与城邦秩序。`,evidenceCaution:`作品几乎全以对话写成，作者本人很少直接发言；不同对话会修正甚至批评理念、政治和知识方案。第七封信的真伪仍有争议，叙拉古政治经历的细节不能全部据此坐实。`,lifeSummary:`柏拉图出生于雅典显贵家庭，青年经历伯罗奔尼撒战争失败、三十僭主暴政、民主复辟和苏格拉底之死。传统说他原有政治抱负，却因不同政体的实际表现转向哲学。苏格拉底死后，他可能游历南意大利和西西里，接触毕达哥拉斯传统；三次叙拉古之行试图通过狄翁和狄奥尼修斯二世推进哲学教育与政治改革，结果均不理想。约前 387 年，他在雅典创办学院，形成长期研究共同体。留下的对话横跨伦理、语言、数学、知识、政治、灵魂和宇宙论，其戏剧结构本身要求读者比较立场而非只背结论。`,timeline:[{date:`前 428／427`,place:`雅典`,title:`出生于贵族家庭`,detail:`家族与雅典政治精英关系密切；“柏拉图”可能是昵称，但具体来源并不可靠。`,certainty:`较可靠`},{date:`约前 407—前 399`,place:`雅典`,title:`进入苏格拉底交往圈`,detail:`苏格拉底成为其对话写作和哲学生活的核心形象；具体相识年份由晚期传统推定。`,certainty:`推定`},{date:`前 399 后`,place:`雅典 → 大希腊／西西里`,title:`旅行与思想重组`,detail:`苏格拉底死后离开雅典，接触南意大利毕达哥拉斯传统的说法可信度较高，完整路线则难确定。`,certainty:`传统记载`},{date:`约前 387`,place:`雅典`,title:`创办学院`,detail:`学院不是近代大学式校园，而是围绕研究、讨论和长期师生关系形成的共同体，持续约九百年并多次转型。`,certainty:`较可靠`},{date:`前 367／366、前 361`,place:`叙拉古`,title:`参与叙拉古政治教育`,detail:`试图影响年轻统治者狄奥尼修斯二世并支持狄翁改革；行程较可靠，动机和责任主要依赖有争议的书信材料。`,certainty:`传统记载`}],inquiries:[{object:`知识、意见与理念`,question:`许多事物都被称为美或正义时，知识把握的是哪些个例，还是使其成为同类的共同标准？`,start:`感官对象会变化、彼此混杂，同一事物在不同关系中既美又不美；稳定定义不能只复制个例。`,steps:[`从多种个例追问共同的‘是什么’`,`区分可见的生成世界与可理解的形式`,`把理念设为定义、解释和评价的对象`,`再检验个别事物如何参与或模仿理念`],conclusion:`知识指向较稳定、可说明的形式，而意见面对可变现象；但“参与”如何成立以及理念是否无限增生，在《巴门尼德篇》等作品中被主动反思。`},{object:`灵魂、教育与正义`,question:`个人欲望、勇气与理性冲突时，怎样形成不靠偶然强制的正义？`,start:`城邦和个人都由功能不同的部分组成；若任何部分都夺取整体支配权，就产生内战式失序。`,steps:[`把城邦放大为可观察的灵魂结构`,`区分理性、意气和欲望`,`用音乐、体育、数学与辩证法重塑欲望`,`让认识善的部分统摄整体`],conclusion:`正义是各部分完成合适功能并形成秩序。哲学王方案由此把知识资格转成统治资格，也留下谁监督知识者的政治难题。`},{object:`宇宙、形式与原因`,question:`可变物质怎样呈现数学秩序和相对稳定的自然结构？`,start:`完全无序的材料不能解释几何比例、天体周期和生命结构；纯粹理念又不能单独说明生成世界。`,steps:[`以永恒模型作为秩序尺度`,`让工匠神说服必然性并安排混沌`,`用数、比例和几何体组织元素`,`把宇宙理解为具有灵魂的可见整体`],conclusion:`《蒂迈欧篇》以目的和数学形式组织自然，但明确把许多说明称为“可能的故事”；它不是现代意义的字面创世科学。`},{object:`对话、辩证法与未完成知识`,question:`如果哲学不能只靠权威传递，写作怎样让读者真正参与推理？`,start:`直接宣告结论容易产生记忆，却不能保证读者理解前提、反例和适用范围。`,steps:[`把观点分配给具有处境的角色`,`让问答暴露语言与心理阻力`,`用神话和比喻连接难以直接证明的层级`,`以无结论或内部批评把任务交还读者`],conclusion:`柏拉图并非只留下封闭体系；对话体把哲学保存为持续检验理念、生活和政治的活动。`}],concepts:[{zh:`理念`,en:`Forms / Ideas`,definition:`使多个个例可被共同定义和评价的稳定、可理解对象，如美本身、正义本身；不同对话对其地位与范围并不完全一致。`},{zh:`善的理念`,en:`Form of the Good`,definition:`知识、价值和可理解秩序的最高条件；《理想国》以太阳比喻它，却没有给出一套简单定义。`},{zh:`辩证法`,en:`dialectic`,definition:`通过问答、假设上升与概念区分寻找第一原则的活动；不是后世黑格尔式历史辩证法。`},{zh:`灵魂三分`,en:`tripartite soul`,definition:`理性、意气、欲望三种动力的结构模型，用以连接个人冲突、教育和城邦阶层。`},{zh:`哲学王`,en:`philosopher-ruler`,definition:`掌握善与整体秩序、因而被要求统治的哲学家；它把认识论与政治权威相连，也承受罗素最强烈的批评。`},{zh:`分有`,en:`participation / methexis`,definition:`个别事物以某种方式具有或呈现理念，由此成为可定义和评价的对象；这种关系如何成立正是理念论的内部难题。`},{zh:`回忆说`,en:`recollection / anamnēsis`,definition:`学习被描述为灵魂在提问引导下重新把握先前可知结构，用以说明感官经验为何能引出普遍知识。`},{zh:`线喻与洞穴`,en:`divided line and cave`,definition:`把影像、可见物、数学对象与理念排列为认识层级，同时展示教育是灵魂整体转向，而非简单灌输信息。`},{zh:`模仿`,en:`mimēsis / imitation`,definition:`艺术、语言或可见事物对对象和形式的再现关系；柏拉图既警惕其远离真理，也在对话和神话中主动使用它。`}],lineage:{inherited:`从苏格拉底继承概念探问与灵魂照料，从巴门尼德继承稳定可知对象，从赫拉克利特吸收感性流变，从毕达哥拉斯传统吸收数学、轮回和共同体生活。`,school:`学院持续近九百年，却经历早期柏拉图主义、学院怀疑主义和后期综合等变化；“柏拉图主义”不能被缩成一份固定教义清单。`,influenced:`亚里士多德在学院学习约二十年，既继承又批评理念分离；中期柏拉图主义、新柏拉图主义、奥古斯丁和近代数学理性主义都重新组织其资源。`,parallel:`儒家同样把教育、人格秩序和政治关联，但柏拉图依靠理念、灵魂结构和哲学知识资格，不能用“哲学王等于圣王”消除制度差异。`},comparisons:[{target:`苏格拉底`,relation:`承接前人`,shared:`对话、定义探问与灵魂优先。`,difference:`苏格拉底形象多停在反诘和无知；柏拉图发展理念、宇宙论、灵魂不朽与完整政治教育。`},{target:`普罗泰戈拉`,relation:`批评关系`,shared:`知识与教育都必须解释判断怎样被改变。`,difference:`普罗泰戈拉从具体经验和后果内部比较意见；柏拉图要求不随意见变化的理念与善作为尺度。`},{target:`亚里士多德`,relation:`影响后继`,shared:`形式、目的和理性秩序解释自然与善。`,difference:`柏拉图常把形式置于可感个体之外；亚里士多德把形式作为具体实体的结构和活动原则。`},{target:`阿尔克西劳`,relation:`后世重构`,shared:`对话经常以困惑结束，并要求检验自信。`,difference:`学院怀疑主义把这一苏格拉底面向用于全面挑战确定印象；柏拉图也提出大量正面形而上与政治方案。`}],russellView:`罗素认为柏拉图在古今哲学家中影响最大，按毕达哥拉斯、巴门尼德、赫拉克利特和苏格拉底四个来源压缩其结构。他赞赏理念论首次系统处理共相、数学与知识，却猛烈批评《理想国》把善的垄断、严格教育、审查和阶层固定结合为极权式政治。对《蒂迈欧篇》，他强调其对古代和中世纪的巨大影响，也区分严肃结构与想象细节。`,modernCorrection:`罗素把柏拉图压缩成一套稳定体系，并以二十世纪政治概念读取《理想国》，有很强启发性却会遮蔽对话的探索性、反讽和内部修正。现代研究不把所有角色发言等同于作者立场，也不默认理念论在全部作品中形式一致；叙拉古经历则说明政治兴趣真实存在，但不能反过来证明《理想国》是一份可直接执行的政纲。`,sources:[E(`第一卷第十三至十八章〈柏拉图〉`),{label:`Stanford Encyclopedia · Plato`,kind:`补充`,url:`https://plato.stanford.edu/entries/plato/`},{label:`Internet Encyclopedia of Philosophy · Plato`,kind:`补充`,url:`https://iep.utm.edu/plato/`}]},{id:`aristotle`,order:14,nameZh:`亚里士多德`,nameEn:`Aristotle of Stagira`,greekName:`Ἀριστοτέλης`,dates:`前 384—前 322`,active:`前 4 世纪中后期`,places:[`斯塔吉拉`,`雅典`,`阿索斯`,`莱斯沃斯`,`佩拉／马其顿`,`卡尔基斯`],school:`逍遥学派`,figureId:`aristotle`,chapterIds:[`b1-19`,`b1-20`,`b1-21`,`b1-22`,`b1-23`],thesis:`知识应从现象和公认意见出发，区分事物是什么、由何构成、怎样产生及为何如此；形式不必脱离个体存在，解释也不能只剩材料和碰撞。`,evidenceCaution:`现存文本多像讲义、研究记录或后期编订，不是本人准备出版的完整著作；书名、次序和部分归属由后世编辑形成。与亚历山大的教学关系确实存在，但具体内容和政治影响几乎未知。`,lifeSummary:`亚里士多德出生于马其顿边缘城邦斯塔吉拉，父亲尼各马可与马其顿王室医学传统有关。约十七岁到雅典，在柏拉图学院活动近二十年；柏拉图死后前往小亚细亚阿索斯，后与泰奥弗拉斯托在莱斯沃斯从事生物研究。前 343 年应腓力二世邀请教育少年亚历山大，影响程度难以确认。前 335 年返回雅典，在吕克昂建立研究共同体，系统收集政制、动物、诗歌和论证材料。亚历山大死后反马其顿情绪上升，他离开雅典赴卡尔基斯，次年去世。其学科划分和术语统治欧洲、伊斯兰世界与大学教育数世纪。`,timeline:[{date:`前 384`,place:`斯塔吉拉`,title:`出生`,detail:`父亲尼各马可是医生并与马其顿宫廷有关，这一背景可能促进其生物兴趣，但不能据此推出完整医学师承。`,certainty:`较可靠`},{date:`约前 367—前 347`,place:`雅典`,title:`在柏拉图学院学习研究`,detail:`约二十年持续参与学院活动，既吸收形式和目的问题，也逐渐反对把理念与个体完全分离。`,certainty:`较可靠`},{date:`前 347—前 343`,place:`阿索斯／莱斯沃斯`,title:`旅行、婚姻与生物研究`,detail:`在赫尔米阿斯政治网络中生活，迎娶皮提亚斯；与泰奥弗拉斯托研究海洋生物。`,certainty:`较可靠`},{date:`前 343 后`,place:`佩拉／马其顿`,title:`教育亚历山大`,detail:`确有受聘关系，直接授课可能只有两三年；后世关于其塑造帝国政策的说法缺少证据。`,certainty:`较可靠`},{date:`前 335—前 323`,place:`雅典`,title:`建立吕克昂研究共同体`,detail:`组织跨学科搜集、讲授和协作，后世因园中回廊称其传统为逍遥学派。`,certainty:`较可靠`},{date:`前 322`,place:`卡尔基斯`,title:`离开雅典并去世`,detail:`亚历山大死后反马其顿情绪激化，他因宗教指控风险离城，在优卑亚岛自然死亡。`,certainty:`较可靠`}],inquiries:[{object:`实体、质料与形式`,question:`具体事物既会变化又保持种类同一，解释应把何者视为基本存在？`,start:`若理念完全分离，它难以说明这匹马为何是马、怎样生长；若只剩材料，又解释不了结构和功能。`,steps:[`从具体个体而非分离理念开始`,`区分承受变化的质料与使其成为某物的形式`,`把生成理解为潜能实现`,`以实体统一属性、变化和定义`],conclusion:`首要实体是由质料与形式组成的具体个体；形式是其可说明结构和活动原则，而非另一个与个体平行的复制物。`},{object:`解释充分性与四因`,question:`说一座雕像由青铜构成，是否已经解释了它？`,start:`材料回答‘由什么’，却没有回答形状、制作者、形成过程和用途；不同研究问题需要不同原因。`,steps:[`材料因说明构成`,`形式因说明结构与定义`,`动力因说明变化来源`,`目的因说明过程趋向的完成状态`],conclusion:`充分解释要按对象组合四种原因。目的因并不总是有意识设计，而可指器官或生物发展所实现的功能。`},{object:`知识、逻辑与科学`,question:`怎样从观察和公认意见达到可证明的普遍知识？`,start:`经验给出个别事实，辩论给出共享起点；科学却要求说明为何必然如此。`,steps:[`收集现象和可信意见`,`通过分类与辩证法发现困难`,`以三段论检查推论形式`,`由真实、首要的原理演绎属性并解释原因`],conclusion:`逻辑是组织知识的工具，不替代观察；科学证明把事实置入原因结构。第一原理本身不能由无限证明链获得。`},{object:`幸福、德性与城邦`,question:`人的好生活是感受、财富，还是一种持续活动？`,start:`短暂快乐和外部财富会变化；人的独特能力是以理性组织欲望、选择和共同生活。`,steps:[`由人的功能寻找好生活标准`,`把幸福定义为合德性的活动`,`以习惯在过度与不足之间形成中道`,`让法律和城邦教育提供实践条件`],conclusion:`幸福是一生中理性能力的卓越活动，需要德性、友谊和一定外部条件；人作为政治动物，不能脱离共同体独自完成。`}],concepts:[{zh:`质料与形式`,en:`matter and form / hylomorphism`,definition:`具体实体的两个解释面向：质料提供可被组织的材料，形式使其成为这一种事物并具有相应活动能力。`},{zh:`潜能与现实`,en:`potentiality and actuality`,definition:`变化不是无中生有，而是某种能力在合适条件下实现；现实在解释上通常优先于潜能。`},{zh:`四因`,en:`four causes`,definition:`材料、形式、动力和目的四类“为什么”。它们不是互相竞争的四个事件，而是不同层次的解释问题。`},{zh:`实体`,en:`substance / ousia`,definition:`首要存在者和属性承担者。亚里士多德不同著作在具体个体、形式与本质之间调整重心。`},{zh:`中道`,en:`doctrine of the mean`,definition:`实践德性在相对于行动者和情境的过度与不足之间作合理由选择，不是机械平均或永远温和。`},{zh:`三段论`,en:`syllogism`,definition:`若干前提按一定形式推出结论的论证结构；科学三段论还要求前提真实、首要并说明对象的原因。`},{zh:`幸福`,en:`eudaimonia / flourishing`,definition:`一生中依德性实现人的理性能力的活动，不是瞬间感受；友谊、政治共同体与一定外部条件也不可完全缺少。`},{zh:`实践智慧`,en:`phronēsis / practical wisdom`,definition:`在具体处境中看出何者重要、怎样选择合宜手段的判断能力；它连接一般德性与不可重复的行动情境。`},{zh:`政治动物`,en:`political animal`,definition:`人的语言和正义判断在共同体中展开，城邦因此不只是安全契约，也是实践好生活的制度条件。`}],lineage:{inherited:`在柏拉图学院中形成问题框架，同时吸收前苏格拉底材料论、希波克拉底医学观察和城邦政制经验；其哲学常以整理并修正前人开始。`,school:`吕克昂／逍遥学派是协作研究共同体。泰奥弗拉斯托继承自然研究；后世亚里士多德主义经过希腊注释家、伊斯兰哲学家和拉丁经院多次重构。`,influenced:`其逻辑、形而上学、伦理、政治与自然分类构成中世纪大学课程；阿维森纳、阿威罗伊、阿奎那等以不同方式结合或批评其体系。`,parallel:`现代科学继承分类、因果与系统观察，却拒绝许多目的论物理和权威化结论；不能把亚里士多德简单称为现代经验科学家或其反面。`},comparisons:[{target:`柏拉图`,relation:`承接前人`,shared:`形式、目的、德性和知识必须构成整体解释。`,difference:`柏拉图常以分离理念提供尺度；亚里士多德让形式内在于具体实体，并从现象和分类开始。`},{target:`德谟克利特`,relation:`批评关系`,shared:`自然现象应由稳定结构和因果说明。`,difference:`德谟克利特优先用原子、虚空和碰撞；亚里士多德认为材料与动力不足以解释形式、功能和目的。`},{target:`伊壁鸠鲁`,relation:`批评关系`,shared:`伦理围绕幸福、友谊和欲望管理。`,difference:`亚里士多德把幸福理解为德性活动并需要城邦参与；伊壁鸠鲁以无痛、宁静和退出权力竞争压缩需要。`},{target:`近代科学`,relation:`后世重构`,shared:`重视观察、分类、论证和原因。`,difference:`近代科学以数学实验和可修正模型替代其许多定性目的论；阻碍常来自后世权威化，不等于本人反对观察。`}],russellView:`罗素要求从前人与后人两面看亚里士多德：相对前人，他的分类、常识和系统建设功绩巨大；相对两千年权威化的后果，他的错误又成为进步障碍。罗素赞赏其中道伦理的成熟，却批评它偏向舒适的希腊绅士；也批判奴隶制辩护、目的论物理及主谓逻辑对实体观的长期束缚。`,modernCorrection:`把亚里士多德当作一部封闭‘体系大全’会掩盖现存文本的讲义性质、内部发展和合作研究背景。罗素有时把后世经院化责任过多归给本人，也用现代形式逻辑标准低估其逻辑问题的历史广度。另一方面，生物学中的目的说明不等于每个器官由人格设计者预先制造，须与神学设计论区分。`,sources:[E(`第一卷第十九至二十三章〈亚里士多德〉`),{label:`Stanford Encyclopedia · Aristotle`,kind:`补充`,url:`https://plato.stanford.edu/entries/aristotle/`},{label:`Internet Encyclopedia of Philosophy · Aristotle`,kind:`补充`,url:`https://iep.utm.edu/aristotle/`}]},{id:`diogenes`,order:15,nameZh:`第欧根尼`,nameEn:`Diogenes of Sinope`,greekName:`Διογένης ὁ Σινωπεύς`,dates:`约前 412／404—前 323`,active:`前 4 世纪中叶`,places:[`锡诺普`,`雅典`,`科林斯`],school:`犬儒主义`,figureId:`diogenes`,chapterIds:[`b1-26`],thesis:`自由不先来自拥有更多选择，而来自减少被财富、名望、礼俗和统治者控制的需要；哲学必须通过身体训练、公开直言和可见生活证明这一点。`,evidenceCaution:`没有可靠著作传世，材料主要来自数百年后的轶事集。住桶、白日提灯、与亚历山大会面及伪造钱币等故事具有强烈象征结构；它们适合说明犬儒理想，不等于可按日期还原的履历。`,lifeSummary:`第欧根尼来自黑海南岸希腊城锡诺普，因“毁坏／重铸货币”被放逐的传统可能同时象征他重估社会价值。到雅典后据说追随苏格拉底学生安提斯泰尼，但严格师承并不确定。他把街道、市场和公共建筑变成哲学场所，以极少财物、乞食、公开身体行为和尖锐答问挑战财富、体面与城邦身份。后期与科林斯关系密切，又有被海盗卖作奴隶后教育主人子女的故事。传说亚历山大许诺满足愿望时，他只要求对方不要挡住阳光；历史真实性有限，却准确压缩了权力与自足的关系。`,timeline:[{date:`约前 412／404`,place:`锡诺普`,title:`出生`,detail:`两个常见年代均来自后世编年；父亲从事钱币或银行事务的说法与放逐故事紧密相连。`,certainty:`推定`},{date:`前 4 世纪前期`,place:`锡诺普 → 雅典`,title:`因钱币事件流亡`,detail:`‘毁坏货币’可能是真实刑事背景，也可能是犬儒派‘重估习俗价值’的传记化寓言。`,certainty:`传统记载`},{date:`前 4 世纪中叶`,place:`雅典`,title:`把公共生活变成哲学训练`,detail:`以最少用品、直言和反羞耻表演暴露礼俗如何制造依赖；具体轶事多不可独立核验。`,certainty:`传统记载`},{date:`前 323`,place:`科林斯`,title:`去世`,detail:`与亚历山大同日去世是典型的象征性编排；地点和大致时代较可能，死因众说纷纭。`,certainty:`推定`}],inquiries:[{object:`需要、习俗与自由`,question:`如果幸福依赖财富、身份和他人认可，一个人还能真正自主吗？`,start:`社会不断把非必要欲望包装成生活条件，获得越多反而需要更多保护、迎合和服从。`,steps:[`区分自然必需与习俗制造的欲望`,`通过贫困和耐苦训练减少需要`,`公开打破无害却束缚人的羞耻规则`,`以自足换取对权势直言的能力`],conclusion:`犬儒自由是低依赖结构：需要越少，外部权力可用来交换服从的筹码越少。贫困在此是主动训练，不是赞美被迫匮乏。`},{object:`哲学表达与公开生活`,question:`理论若不改变日常动作，是否真的被理解？`,start:`学院论证可能在生活方式中不留下痕迹，甚至为奢侈和权力提供更精致的辩护。`,steps:[`让身体成为最直接的反例`,`以笑话、羞辱和悖论打断习惯`,`在市场而非封闭学校教学`,`把每次与权力相遇变成自足测试`],conclusion:`第欧根尼的‘论证’常是一次可见行动：它不证明完整形而上学，却迫使旁观者比较所宣称的善与实际依赖。`}],concepts:[{zh:`自足`,en:`autarkeia / self-sufficiency`,definition:`通过压缩欲望和训练身体降低对财富、社会地位及统治者的依赖，是犬儒自由的物质基础。`},{zh:`直言`,en:`parrhēsia / frank speech`,definition:`承担风险公开说真话；不是无代价的冒犯，而是只有不依附权势者较能实践的自由。`},{zh:`训练`,en:`askēsis`,definition:`以耐寒、简食、公开羞耻测试等反复练习重塑欲望，使哲学成为身体和习惯的能力。`},{zh:`世界公民`,en:`kosmopolitēs / citizen of the world`,definition:`拒绝把价值和归属完全锁定在出生城邦；它首先是对排他身份的否定，还不是现代国际法意义的公民权。`},{zh:`依自然而活`,en:`living according to nature`,definition:`让身体的有限需要而非习俗制造的名望、奢侈和羞耻决定生活；‘自然’在这里首先是一种批判尺度。`},{zh:`改铸通货`,en:`defacing the currency / paracharattein to nomisma`,definition:`既是流亡传说中的铸币事件，也是重新检验社会通行价值的犬儒比喻；历史事实与哲学象征须分开。`}],lineage:{inherited:`犬儒派自称继承苏格拉底的简朴、公开审问与灵魂优先，经安提斯泰尼传统进一步把德性从理论转成生活训练。`,school:`犬儒主义没有固定校园、课程或统一教义。第欧根尼、克拉特斯等以可复制的生活姿态构成松散传统，‘犬’既是侮辱也被重新占用。`,influenced:`克拉特斯影响斯多葛创始人芝诺；自足、顺应自然、直言和世界公民观念进入斯多葛主义，也在后世修道、政治批判中被反复重构。`,parallel:`庄子式逍遥与犬儒自足都批判社会价值倒置，但犬儒更依赖公共挑衅、身体训练和希腊城邦的直言政治。`},comparisons:[{target:`苏格拉底`,relation:`后世重构`,shared:`以生活和问答揭露财富、名望与自负。`,difference:`苏格拉底仍履行公民与家庭角色；第欧根尼把无家、贫困和反礼俗推进为公开训练。`},{target:`柏拉图`,relation:`批评关系`,shared:`都认为欲望和教育决定灵魂秩序。`,difference:`柏拉图设计长期制度和知识等级；第欧根尼以最低制度依赖和当场行动检验善。`},{target:`伊壁鸠鲁`,relation:`同题比较`,shared:`减少非自然欲望以获得独立和安宁。`,difference:`伊壁鸠鲁经营稳定友谊共同体并避开公共冲突；第欧根尼主动在公共空间制造冲突以揭露习俗。`},{target:`斯多葛主义`,relation:`影响后继`,shared:`自足、顺应自然、德性足以构成自由。`,difference:`斯多葛派建立逻辑、物理和角色义务体系；犬儒派轻视体系并以激进生活作为‘通往德性的捷径’。`}],russellView:`罗素把第欧根尼写成决定像狗一样生活、拒绝习俗并以最少需要获得自由的人。他欣赏犬儒主义在亚历山大时代提供的个人独立，却也区分早期严肃训练与后来‘犬儒’一词所含的消极不信和无所作为。其叙述大量借助住桶、提灯和亚历山大轶事。`,modernCorrection:`这些轶事应作为压缩理念的表演文本，而非可逐项验证的史实。犬儒主义也不等于现代所说“认为人人自私”的犬儒心态；它有明确的德性、自然与训练标准。公开身体行为并非简单反社会，而是在重新划分什么真正可耻：欲望奴役和灵魂失调比违反礼仪更可耻。`,sources:[E(`第一卷第二十六章〈犬儒派与怀疑派〉`),{label:`Internet Encyclopedia of Philosophy · Cynics`,kind:`补充`,url:`https://iep.utm.edu/cynics/`},{label:`Diogenes Laertius · Lives, Book VI`,kind:`补充`,url:`https://en.wikisource.org/wiki/Lives_of_the_Eminent_Philosophers/Book_VI`}]},{id:`pyrrho`,order:16,nameZh:`皮浪`,nameEn:`Pyrrho of Elis`,greekName:`Πύρρων`,dates:`约前 360—前 270`,active:`前 4 世纪末至前 3 世纪初`,places:[`埃利斯`,`亚洲远征路线（传统记载）`],school:`早期皮浪主义`,figureId:`pyrrho`,chapterIds:[`b1-26`],thesis:`事物本性无法由人的判断稳定把握，因此不应匆忙断言‘它本来就是如此’；不在相反判断之间强行选边，心灵便较少被得失和恐惧扰动。`,evidenceCaution:`皮浪本人没有著作，主要经学生蒂蒙和更晚作者认识。随亚历山大到印度、遇见裸身哲人以及车来不避等故事难以核验；后期塞克斯都的皮浪主义也不能完整倒推给早期皮浪。`,lifeSummary:`皮浪来自伯罗奔尼撒西部城邦埃利斯，可能早年从事绘画。传统说他随亚历山大远征东方，接触波斯贤者与印度裸身哲人后形成不执著判断的生活方式；是否实际发生及思想影响程度都有争议。返回埃利斯后，他通过生活示范而非写作教学，学生蒂蒙以诗和散文传播其形象。城邦据说授予他祭司身份并因他免除哲学家税赋，这些荣誉传统反映其并非彻底脱离日常共同体。晚期轶事把他写成连车辆和悬崖也不躲避的人，却与“依表象生活”的怀疑实践相矛盾。`,timeline:[{date:`约前 360`,place:`埃利斯`,title:`出生`,detail:`年代由后世编年推定；早年画家身份只有晚期材料支持。`,certainty:`推定`},{date:`前 334—前 324`,place:`亚历山大远征路线`,title:`东方旅行传统`,detail:`据说随远征接触波斯和印度思想者；旅行可能有历史核心，思想借用的具体内容无法确认。`,certainty:`传统记载`},{date:`前 4 世纪末`,place:`埃利斯`,title:`以生活示范教学`,detail:`本人不写作，蒂蒙等学生用格言和诗歌保存其关于事物、态度和安宁的三问结构。`,certainty:`较可靠`},{date:`约前 270`,place:`埃利斯`,title:`去世与地方荣誉`,detail:`长寿和祭司荣誉来自传记传统；可以较稳妥确认他在故乡形成持续声望。`,certainty:`推定`}],inquiries:[{object:`事物本性与判断`,question:`相反理由势均力敌时，人凭什么断言事物自身必定如此？`,start:`感觉、习俗和哲学论证不断冲突，我们获得的是事物如何显现，而不是不带关系的本性印章。`,steps:[`比较相反表象和理由`,`不把任何一方提升为无条件本性`,`保持判断不定或不加断言`,`仍按眼前表象与生活需要行动`],conclusion:`对超出表象的本性不作确定断言。早期皮浪究竟主张‘事物本性不确定’，还是只说我们无法确定，是重要解释争议。`},{object:`悬置与安宁`,question:`为什么减少断言会减少焦虑，而不是让人无法生活？`,start:`人不只受到疼痛和损失扰动，也因坚持某物绝对善恶而增加追逐、恐惧和失望。`,steps:[`识别价值判断中的过度确信`,`让相反理由形成平衡`,`停止强迫思想作最终裁决`,`依表象、习惯和即时能力处理生活`],conclusion:`悬置判断之后可能意外出现不动心。安宁不是先被证明的宇宙真理，而是放松教条执着后的实践结果。`}],concepts:[{zh:`悬置判断`,en:`epochē / suspension of judgment`,definition:`在理由无法决定时不肯定也不否定事物本性；它不是停止感知、说话或采取日常行动。`},{zh:`不动心`,en:`ataraxia / tranquility`,definition:`不被相反判断和对绝对得失的执着持续扰动；后期皮浪主义把它描述为悬置之后如影随形的结果。`},{zh:`表象`,en:`phainomena / appearances`,definition:`事物当下如何呈现。怀疑者可以承认‘蜂蜜显得甜’，而不进一步断言蜂蜜本性绝对甜。`},{zh:`无定性`,en:`indeterminacy`,definition:`早期证言中事物被说成无差别、不稳定或不可判定；究竟是世界属性还是人的认识处境仍有争议。`},{zh:`等力`,en:`equipollence / isostheneia`,definition:`对立说法在说服力上势均力敌，因而没有充分理由选择其中一方；该术语主要由后期皮浪主义系统化。`},{zh:`依表象生活`,en:`living by appearances`,definition:`不判断事物终极本性，仍可依感觉、习惯、技艺和共同规则行动，从而回应怀疑会使人瘫痪的指控。`}],lineage:{inherited:`可能受德谟克利特关于安宁、智者与苏格拉底对判断限度的讨论影响；东方旅行提供比较背景，但不能凭相似性直接证明佛教来源。`,school:`皮浪没有建立正式学校。蒂蒙保存其形象；后来的埃奈西德穆和塞克斯都在数世纪后系统化论证模式，形成我们更熟悉的皮浪主义。`,influenced:`塞克斯都著作经文艺复兴重见后影响蒙田、笛卡尔、休谟等近代认识论；这种影响更多来自后期皮浪主义而非皮浪本人残篇。`,parallel:`学院怀疑主义同样悬置判断，却主要在柏拉图学院内部批判斯多葛知识标准；早期皮浪更突出生活姿态和安宁。`},comparisons:[{target:`阿尔克西劳`,relation:`同题比较`,shared:`拒绝在缺乏决定性标准时给表象完全同意。`,difference:`皮浪传统以安宁和依表象生活为核心；阿尔克西劳以苏格拉底辩证法专门挑战斯多葛认知印象。`},{target:`卡尔内阿德`,relation:`同题比较`,shared:`悬置确定断言仍须说明行动如何可能。`,difference:`卡尔内阿德发展有层级的可信印象供实践审查；早期皮浪材料更强调不执著及生活结果。`},{target:`伊壁鸠鲁`,relation:`同题比较`,shared:`哲学以解除恐惧、取得宁静为生活目标。`,difference:`伊壁鸠鲁以原子论和感觉标准建立正面教义；皮浪不以另一套自然学填补不确定性。`},{target:`佛教哲学`,relation:`后世重构`,shared:`旅行传统与不执著、安宁之间存在可比较线索。`,difference:`直接传播证据不足，佛教的缘起、无我和解脱体系也不能压缩为希腊式悬置判断。`}],russellView:`罗素沿袭传统叙事，称皮浪随亚历山大到东方并在埃利斯建立怀疑传统。他把核心写成：没有充分理由偏好一种判断，聪明人因此避免信念、依习俗生活，并从无信念中获得安宁。罗素把这种方案视作希腊化不安全时代的‘抗焦虑药’，同时质疑彻底怀疑能否一贯表达。`,modernCorrection:`“朋友必须把他从马车前拖走”与依表象生活明显冲突，更像哲人传奇。现代研究还区分早期皮浪与后期皮浪主义：皮浪可能提出了关于事物无定性的正面看法，未必已经采用塞克斯都式不对任何本性作断言的纯探究立场。东方影响值得比较，但不能由一次旅行故事直接坐实。`,sources:[E(`第一卷第二十六章〈犬儒派与怀疑派〉`),{label:`Stanford Encyclopedia · Ancient Skepticism`,kind:`补充`,url:`https://plato.stanford.edu/entries/skepticism-ancient/`},{label:`Internet Encyclopedia of Philosophy · Pyrrho`,kind:`补充`,url:`https://iep.utm.edu/pyrrho/`}]},{id:`arcesilaus`,order:17,nameZh:`阿尔克西劳`,nameEn:`Arcesilaus`,greekName:`Ἀρκεσίλαος`,dates:`前 316／315—前 241／240`,active:`约前 268—前 241 领导学院`,places:[`皮塔内`,`雅典`],school:`学院怀疑主义`,figureId:`arcesilaus`,chapterIds:[`b1-26`],thesis:`没有任何印象能仅凭自身保证它不可能来自虚假对象；理性因而要求停止把表象批准为确定真理，但行动仍可依据在处境中显得合理的方案进行。`,evidenceCaution:`本人没有著作，观点主要从西塞罗、塞克斯都和普鲁塔克等后世材料重建。许多论证可能是针对斯多葛前提的辩证反驳，而非阿尔克西劳自己肯定的教义。`,lifeSummary:`阿尔克西劳出生于小亚细亚爱奥利斯的皮塔内，青年到雅典，先后接触数学家奥托吕科斯、吕克昂和柏拉图学院传统。约前 268／266 年成为学院主持者，使学院从正面形而上教学转向以苏格拉底式问答检验同时代学派。主要对手是芝诺及早期斯多葛派：他们认为某些“认知印象”以自身清晰结构保证真实，智者可以据此获得知识。阿尔克西劳通过梦、疯狂、相似对象等案例指出真印象可能有不可区分的假对应物。他不写书，使教学保持为现场辩论，也让后世难以区分其真实立场和策略性反驳。`,timeline:[{date:`前 316／315`,place:`皮塔内`,title:`出生`,detail:`来自较富裕家庭的传统较可信；早年学画或诗歌等细节属于后世传记。`,certainty:`较可靠`},{date:`前 3 世纪初`,place:`雅典`,title:`进入学院知识网络`,detail:`先在吕克昂及其他教师处学习，后转入学院，形成以柏拉图对话中的苏格拉底为核心的方法。`,certainty:`传统记载`},{date:`约前 268／266`,place:`雅典`,title:`主持柏拉图学院`,detail:`学院由此进入所谓中期学院或怀疑时期，持续与斯多葛、伊壁鸠鲁认识论辩论。`,certainty:`较可靠`},{date:`前 241／240`,place:`雅典`,title:`去世`,detail:`关于酗酒致死的传闻带有敌对学派诋毁色彩；卒年较确定，死因不明。`,certainty:`较可靠`}],inquiries:[{object:`真理标准与认知印象`,question:`一种印象能否仅凭自身，让人确定它绝不可能由假对象造成？`,start:`斯多葛派要求只同意具有真理保证的认知印象，以此区分知识与意见。`,steps:[`寻找与真印象现象上相同的假印象`,`使用梦、幻觉和相似对象检验标准`,`指出当事人无法从印象内部辨别来源`,`拒绝给予任何印象不可撤回的同意`],conclusion:`若没有无假对应物的印象，斯多葛标准无法完成认证；悬置判断是遵守严格理性标准的结果，而非讨厌知识。`},{object:`无信念行动`,question:`如果不肯定任何印象为真，为什么还能出门、选择和承担责任？`,start:`对手认为行动需要先同意‘这件事应当做’，全面悬置会让人像植物一样不动。`,steps:[`区分出现印象与批准其为真`,`承认多个行动方案会呈现于理性思考`,`依‘合理者’比较处境和后果`,`行动而不把选择升级为不可错知识`],conclusion:`怀疑者可按合理表象行动。可行动性不要求形而上确定性，只要求保留感知、思考和比较能力。`}],concepts:[{zh:`认知印象`,en:`kataleptic impression`,definition:`斯多葛派设想的真理印象：源自真实对象，并具有不可能来自虚假对象的呈现方式；阿尔克西劳攻击其可识别性。`},{zh:`全面悬置`,en:`universal epochē`,definition:`不对任何印象作确定真理的同意；它是否为阿尔克西劳的正面主张，还是辩证结果，仍有争议。`},{zh:`合理者`,en:`eulogon / the reasonable`,definition:`在没有确定知识时指导行动的可辩护表象或方案，不等于已被断言为真实。`},{zh:`辩证反驳`,en:`dialectical argument`,definition:`暂取对手前提，展示其导致矛盾或无法达到目标；论证结论不必是怀疑者自己的教义。`},{zh:`不可区分论证`,en:`indistinguishability argument`,definition:`若真实印象总可能有一个在主观呈现上完全相同的虚假对应，便不存在仅凭呈现即可保证真理的认知标记。`},{zh:`不行动反驳`,en:`reply to the inactivity objection`,definition:`悬置确定同意不等于无法行动；行动仍可跟随当下合理、可辩护的表象，而不宣称它不可错。`}],lineage:{inherited:`重新突出柏拉图对话中的苏格拉底审问者，而非理念体系建构者；也继承学院内部对知识、意见和假设的长期区分。`,school:`他开启学院怀疑主义。其方法被卡尔内阿德发展，后由克利托马科、西塞罗等以不同程度的可错论解释传播。`,influenced:`迫使斯多葛派反复修订认知印象和同意理论；通过西塞罗《学园派论》影响奥古斯丁及近代怀疑论语汇。`,parallel:`皮浪主义同样悬置，却不依附学院—斯多葛争论，并更明确把宁静列为实践结果。`},comparisons:[{target:`苏格拉底`,relation:`后世重构`,shared:`通过问答检验他人自信，拒绝假装拥有智慧。`,difference:`阿尔克西劳把方法用于系统攻击希腊化知识标准，并提出悬置后的行动问题。`},{target:`斯多葛芝诺`,relation:`批评关系`,shared:`同意应受理性控制，未经认证的意见会导致错误。`,difference:`芝诺认为某些印象可自证真实；阿尔克西劳认为真假印象可能不可区分，因而应悬置。`},{target:`皮浪`,relation:`同题比较`,shared:`不把出现于心的表象直接升级为事物本性。`,difference:`皮浪传统以宁静和生活示范为中心；阿尔克西劳以学院辩证法和认识标准之争为中心。`},{target:`卡尔内阿德`,relation:`影响后继`,shared:`反对斯多葛确定印象，并须回应不行动反驳。`,difference:`阿尔克西劳用‘合理者’保持行动；卡尔内阿德细化为可说服、无冲突并经检查的层级标准。`}],russellView:`罗素把阿尔克西劳视为学院转向怀疑主义的关键人物，强调他复活苏格拉底式无知，以相反论证破坏斯多葛关于确定知识的自信。罗素的整体叙述把学院怀疑看作不安全时代中哲学由世界体系退向心理防御的一部分。`,modernCorrection:`不能简单说他‘知道一切不可知’，因为许多否定句可能只是从对手前提推出。现代研究尤其重视行动论：阿尔克西劳并非让人自动响应刺激，而是保留理性比较，只拒绝把选择当成已认证真理。其方法是一种严格探究伦理，而不仅是消极怀疑。`,sources:[E(`第一卷第二十六章〈犬儒派与怀疑派〉`),{label:`Stanford Encyclopedia · Ancient Skepticism`,kind:`补充`,url:`https://plato.stanford.edu/entries/skepticism-ancient/`},{label:`Internet Encyclopedia of Philosophy · Academic Skepticism`,kind:`补充`,url:`https://iep.utm.edu/ancient-greek-skepticism/`}]},{id:`carneades`,order:18,nameZh:`卡尔内阿德`,nameEn:`Carneades of Cyrene`,greekName:`Καρνεάδης`,dates:`前 214／213—前 129／128`,active:`前 2 世纪中叶`,places:[`昔兰尼`,`雅典`,`罗马`],school:`学院怀疑主义`,figureId:`carneades`,chapterIds:[`b1-26`],thesis:`确定无误的认知标记不可获得，但实践不必因此停摆；印象可以按说服力、与其他印象的一致及经受检查的程度分层，重要行动应接受更严格审查。`,evidenceCaution:`本人没有写作，主要通过学生克利托马科、西塞罗和塞克斯都重建。我们不确定“可信印象”只是辩证回应，还是他自己的可错认识论；在罗马连续为正义正反演说的具体内容也经后世塑形。`,lifeSummary:`卡尔内阿德出生于北非希腊城市昔兰尼，后在雅典学习并成为学院主持者。他延续阿尔克西劳对斯多葛知识标准的批评，却更细致地说明无确定知识时怎样合理行动。前 155 年，他与斯多葛派第欧根尼、逍遥派克里托劳斯组成雅典使团前往罗马，处理罚款争议。传统说他第一天赞美正义、第二天用同样力量反驳，震动罗马青年并促使老加图要求使团尽快离开。故事即使经过修饰，也显示希腊辩证训练进入罗马政治文化的历史节点。`,timeline:[{date:`前 214／213`,place:`昔兰尼`,title:`出生`,detail:`北非希腊城市拥有数学、修辞和哲学传统；早年学习路线主要来自晚期传记。`,certainty:`较可靠`},{date:`前 2 世纪中叶`,place:`雅典`,title:`主持学院并发展或然标准`,detail:`持续攻击斯多葛认知印象，使用相似物、疯狂和梦等案例，并把实践依据细分为三个审查层级。`,certainty:`较可靠`},{date:`前 155`,place:`罗马`,title:`参加哲学家使团`,detail:`使团本身可靠；连续为正义正反演说及加图反应的细节可能经道德化叙述。`,certainty:`较可靠`},{date:`前 129／128`,place:`雅典`,title:`去世`,detail:`晚年失明等记载有一定传统支持；思想主要由从未完全确定老师立场的克利托马科保存。`,certainty:`较可靠`}],inquiries:[{object:`相似表象与确定知识`,question:`如果两个鸡蛋、两粒沙甚至真幻觉看起来完全相同，表象能自带真理保证吗？`,start:`斯多葛派要求认知印象具有无法由假对象产生的特征；现实中极近相似物却可能给任何观察者同样呈现。`,steps:[`寻找不可区分的相似对象`,`比较正常、梦境和疯狂状态下的行动`,`切断清晰感与真实来源的必然联系`,`要求知识标准承担无法完成的自我认证`],conclusion:`表象的鲜明或驱动力不足以保证真实。人仍可判断其可信程度，但不应把心理确信等同于不可错知识。`},{object:`可信印象与实践审查`,question:`没有确定知识，重要行动怎样避免任意和瘫痪？`,start:`日常选择不可能等到绝对证明；但风险越高，单一第一印象越不够。`,steps:[`普通事务依有说服力的印象`,`重要事务检查周围印象是否冲突`,`关乎幸福时进行全面反复审查`,`只给予暂时认可，不声称把握本性`],conclusion:`可信度是分层程序而非真理印章。像暗处辨认绳与蛇，应靠光线、触探和关系检查提高可行动的可靠性。`},{object:`正义、政治与相反论证`,question:`一个国家称为正义的规则，是普遍原则还是自身利益的合理化？`,start:`帝国、城邦和个人常在利益变化时改变正义语言，却宣称遵守同一普遍标准。`,steps:[`先重建支持自然正义的最强论证`,`再以国家利益和历史实践提出反例`,`展示权威理论未完成证明`,`将结论保持为对确信的检验而非赞美不义`],conclusion:`正反演说的目的不是自动证明正义不存在，而是迫使政治主张暴露前提、代价和自利结构。`}],concepts:[{zh:`可信印象`,en:`pithanē phantasia / persuasive impression`,definition:`足以在实践中说服人的表象；它提供可行动理由，但不保证对象在本性上确实如此。`},{zh:`无冲突印象`,en:`undiverted impression`,definition:`与周围相关表象没有张力的可信印象，是比单一第一印象更高的审查层级。`},{zh:`充分检查`,en:`thoroughly explored impression`,definition:`在重要问题中逐项核验相关条件、替代解释和反例后仍保持说服力的印象。`},{zh:`暂时认可`,en:`approval`,definition:`按可信印象行动，但不作斯多葛式‘实际为真’的完全同意；是否构成较弱信念，古今均有争议。`},{zh:`正反双论`,en:`arguments on both sides`,definition:`对同一命题分别建立最强支持与反对理由，以暴露自明性不足；罗马的正义演说是最著名但经后世转述的例子。`},{zh:`实践可错论`,en:`practical fallibilism`,definition:`在拒绝确定知识后，仍按分层检查过的可信印象行动；这是本站对其结构的现代学习性概括，不是古代自用标签。`}],lineage:{inherited:`继承阿尔克西劳的学院辩证法和对斯多葛认知印象的攻击，也回到柏拉图对知识与意见、假设与证明的区分。`,school:`属于学院怀疑主义成熟期。克利托马科把他解释为仍全面悬置，斐洛则允许暂时信念，显示其遗产内部已经分裂。`,influenced:`西塞罗用拉丁语把可信性转译为 probabile 与 veri simile，成为古代怀疑主义进入罗马和近代可错论的重要桥梁。`,parallel:`现代概率判断同样按证据更新可信度，但卡尔内阿德没有数学概率模型；他的‘或然’首先是实践审查和反教条工具。`},comparisons:[{target:`阿尔克西劳`,relation:`承接前人`,shared:`反对可自证的认知印象，并以合理实践回答不行动指控。`,difference:`卡尔内阿德把实践标准细分为说服力、一致性和充分检查，较接近可错认识论。`},{target:`皮浪`,relation:`同题比较`,shared:`不把表象直接断言为事物本性。`,difference:`皮浪传统突出悬置后的宁静；卡尔内阿德服务于学院内部认识论与公共论证，安宁不是核心目标。`},{target:`斯多葛主义`,relation:`批评关系`,shared:`行动要区分未经检验的冲动与理性认可。`,difference:`斯多葛派追求保证真实的认知印象；卡尔内阿德只允许经层级检查后仍可错的实践依据。`},{target:`现代可错论`,relation:`后世重构`,shared:`合理相信不要求不可错，重要结论需要更强证据。`,difference:`现代可错论通常仍肯定知识和信念；卡尔内阿德是否允许真正信念，取决于对其学生证言的解释。`}],russellView:`罗素最突出卡尔内阿德前 155 年在罗马的使团和正反两场正义演说，把它视为希腊怀疑论冲击罗马传统道德的戏剧性时刻。他也注意到学院派以或然性指导生活，但更倾向把整个怀疑传统解释为宏大公共信念衰落后的个人安稳方案。`,modernCorrection:`正反演说不能直接证明卡尔内阿德反对正义；更可能是展示柏拉图和亚里士多德式自然正义尚未获得决定性论证。其可信标准不是‘哪边票多就信哪边’，而是随风险增加审查强度。把它叫概率论会过度现代化，把它叫全面无信念又会忽略暂时认可的复杂性。`,sources:[E(`第一卷第二十六章〈犬儒派与怀疑派〉`),{label:`Stanford Encyclopedia · Ancient Skepticism`,kind:`补充`,url:`https://plato.stanford.edu/entries/skepticism-ancient/`},{label:`Internet Encyclopedia of Philosophy · Academic Skepticism`,kind:`补充`,url:`https://iep.utm.edu/ancient-greek-skepticism/`}]},{id:`epicurus`,order:19,nameZh:`伊壁鸠鲁`,nameEn:`Epicurus`,greekName:`Ἐπίκουρος`,dates:`前 341—前 270`,active:`前 4 世纪末至前 3 世纪前期`,places:[`萨摩斯`,`米蒂利尼`,`兰普萨库斯`,`雅典`],school:`伊壁鸠鲁主义`,figureId:`epicurus`,chapterIds:[`b1-27`],thesis:`幸福不是不断增加强烈刺激，而是消除身体疼痛和心灵扰动；原子论、死亡分析、欲望分类、友谊与正义契约共同把恐惧降到最低。`,evidenceCaution:`据说写作三百余卷，大部分失传；主要依靠第欧根尼·拉尔修保存的书信和格言、赫库兰尼姆纸草及卢克莱修。原子偏斜在存世本人文本中未直接出现，其具体功能与归属仍有争议。`,lifeSummary:`伊壁鸠鲁生于萨摩斯岛的雅典移民家庭，十八岁到雅典履行公民兵役。家庭被逐出萨摩斯后，他在小亚细亚多地生活，约前 311 年在米蒂利尼开始教学，后在兰普萨库斯形成稳定朋友圈。前 306 年回雅典购置“花园”，建立接纳妇女和奴隶的共同体，以简朴饮食、友谊、写作和共同学习实践哲学。他并非纵欲享乐者，而把最高快乐定义为身体无痛与心灵宁静。前 270 年因长期结石或泌尿疾病去世，临终书信称身体剧痛仍被回忆哲学交谈的快乐抵消。`,timeline:[{date:`前 341`,place:`萨摩斯`,title:`出生于雅典移民家庭`,detail:`父母是雅典公民，定居萨摩斯；后世关于贫困和母亲巫术活动的说法常带有敌对宣传。`,certainty:`较可靠`},{date:`前 323—前 321`,place:`雅典／小亚细亚`,title:`服役与家庭迁移`,detail:`十八岁赴雅典履行兵役；雅典移民随后被马其顿方面逐出萨摩斯，家庭转居科洛封。`,certainty:`较可靠`},{date:`约前 311—前 307`,place:`米蒂利尼／兰普萨库斯`,title:`教学并形成朋友圈`,detail:`米蒂利尼教学受挫后转往兰普萨库斯，结识赫尔马科斯、梅特罗多罗斯等终身伙伴。`,certainty:`较可靠`},{date:`前 306`,place:`雅典`,title:`建立花园学派`,detail:`购买城内住宅与花园，形成以友谊、共同学习和低欲望生活为核心的长期共同体。`,certainty:`较可靠`},{date:`前 270`,place:`雅典`,title:`在长期病痛中去世`,detail:`临终书信与遗嘱保存较好，安排共同体延续、朋友家属和奴隶解放，体现哲学与制度生活结合。`,certainty:`较可靠`}],inquiries:[{object:`自然、神与恐惧`,question:`雷电、疾病和天象若被解释为神罚，人怎样获得稳定生活？`,start:`未知自然过程被人格化后，每个偶然事件都可能成为神意警告，制造无法证伪的焦虑。`,steps:[`以原子和虚空解释自然`,`允许同一遥远天象有多个不违经验的自然说明`,`肯定神若完满便不忙于惩罚人`,`把自然研究服务于消除迷信恐惧`],conclusion:`神可以存在，但不管理世界；自然事件不含针对个人的惩罚意图。物理学的治疗目标比争夺唯一遥远天象模型更重要。`},{object:`死亡、灵魂与感觉`,question:`死亡为什么不应被当作人生中最大的恶？`,start:`一切善恶经验都以感觉为条件；灵魂同样由细微原子组成，随身体解散。`,steps:[`说明灵魂是身体性的复合物`,`死亡使感觉能力终止`,`活着时死亡尚未来，死亡到来时主体已不在`,`排除死后惩罚与永恒缺失体验`],conclusion:`死亡对我们不是可被感受的恶。应处理的是当下对死亡的想象性恐惧，而非追求不可能的个人永存。`},{object:`快乐、欲望与选择`,question:`若快乐是善，为什么不应追逐每一种强烈快乐？`,start:`某些快乐带来更大后痛，某些暂时痛苦换来长期健康；单次强度不是可靠尺度。`,steps:[`把快乐理解为痛苦和扰动的消除`,`区分自然且必要、自然不必要与空洞欲望`,`比较选择的长期后果`,`让审慎统摄饮食、名望、权力和情欲`],conclusion:`最高快乐是无痛和宁静的稳定状态。面包、水和可靠朋友常比奢侈更有效，因为它们满足需要而不制造新的依赖。`},{object:`友谊、正义与共同生活`,question:`以个人快乐为目标，为什么还要忠诚、正义并为朋友承担痛苦？`,start:`孤立个体持续担心伤害、背叛和权力变化；安全感本身依赖可信关系。`,steps:[`以互不伤害契约界定正义`,`让法律有效性随共同利益条件变化`,`通过长期忠诚把朋友变成安全世界`,`在花园制度中实践照顾、记忆与教育`],conclusion:`审慎、正义和友谊不是牺牲快乐的外在义务，而是稳定快乐的构成条件；贤者甚至可为朋友承受风险。`}],concepts:[{zh:`无痛`,en:`aponia`,definition:`身体没有疼痛的稳定状态，是快乐的极限之一；它不同于持续寻求强烈感官刺激。`},{zh:`心灵宁静`,en:`ataraxia`,definition:`摆脱对神、死亡、未来和无限欲望的扰动；通过自然知识、欲望管理和友谊共同获得。`},{zh:`欲望分类`,en:`classification of desires`,definition:`自然且必要、自然但非必要、空洞欲望三类；分类帮助把有限需要与名望权力等无终点追逐分开。`},{zh:`原子偏斜`,en:`atomic swerve / clinamen`,definition:`原子在无固定时地发生的最小偏移，用于解释碰撞并可能为自主行动留出空间；本人现存文本未直接保存。`},{zh:`互不伤害契约`,en:`compact neither to harm nor be harmed`,definition:`正义不是脱离共同体的永恒实体，而是在具体条件下保障相互安全的协议和制度。`},{zh:`四重药`,en:`tetrapharmakos / four-part cure`,definition:`神不足惧、死不足忧、善易获得、痛可忍受的后世格言式压缩，把自然学和欲望训练合为记忆工具。`},{zh:`死亡与我无关`,en:`death is nothing to us`,definition:`一切善恶经验依赖感觉；死亡发生时感觉主体已不存在，因此不能被想象成死者持续承受的状态。`},{zh:`友谊`,en:`philia / friendship`,definition:`从互助安全开始并发展为自身可贵的共同生活关系，是花园学派把个人安宁变成可持续实践的社会条件。`}],lineage:{inherited:`采用德谟克利特原子论，却让自然研究明确服务于解除恐惧；也在希腊伦理关于快乐、审慎和友谊的争论中形成独立方案。`,school:`花园既是学派也是生活共同体，保存创始人文本和纪念实践，教义稳定性较强。成员包括妇女、奴隶和外来者，虽不能等同现代平等制度，却突破学院常规。`,influenced:`卢克莱修用拉丁诗系统传播其自然和治疗方案；赫库兰尼姆的菲洛德穆发展修辞、音乐与情绪治疗。近代唯物论和世俗伦理多次重读他。`,parallel:`斯多葛主义同样治疗恐惧并重视判断，却以宇宙理性和德性为唯一善；伊壁鸠鲁则以快乐、原子偶然性和低政治参与建立安宁。`},comparisons:[{target:`德谟克利特`,relation:`承接前人`,shared:`原子、虚空、灵魂身体性和非神意自然。`,difference:`伊壁鸠鲁加入偏斜传统，更强调感觉标准，并把物理学系统服务于无恐惧生活。`},{target:`亚里士多德`,relation:`批评关系`,shared:`幸福需要审慎、友谊和长期活动，不等于瞬间快感。`,difference:`亚里士多德以德性活动和城邦参与为核心；伊壁鸠鲁以无痛宁静和退出权力竞争降低风险。`},{target:`皮浪`,relation:`同题比较`,shared:`最终目标包含心灵宁静。`,difference:`皮浪传统通过悬置教条达到宁静；伊壁鸠鲁肯定原子论、感觉标准和欲望分类等明确教义。`},{target:`卢克莱修`,relation:`影响后继`,shared:`原子自然学、灵魂有死、神不干预和消除死亡恐惧。`,difference:`卢克莱修用拉丁史诗、罗马政治危机和强烈意象重新组织学说，诗歌形式本身成为治疗工具。`}],russellView:`罗素纠正了把伊壁鸠鲁误解为纵欲者的常见看法，突出无痛、宁静、简食和友谊。他认为伊壁鸠鲁只因自然解释能消除迷信才关心科学，甚至允许对遥远天象并列多种说明；又认为死亡论虽有逻辑力量，却难完全战胜本能恐惧。整体评价夹杂尊重与对其退避公共世界的保留。`,modernCorrection:`物理学并非随意编造：多重解释仍必须与感觉和基本原理相容。‘退出政治’也不是完全隔绝社会，花园本身具有制度、书信网络、正义契约和照顾实践。把快乐只译成消极无痛会低估记忆、交谈和友谊的积极愉悦；把偏斜直接等同现代自由意志或量子随机同样过度。`,sources:[E(`第一卷第二十七章〈伊壁鸠鲁派〉`),{label:`Stanford Encyclopedia · Epicurus`,kind:`补充`,url:`https://plato.stanford.edu/entries/epicurus/`},{label:`Internet Encyclopedia of Philosophy · Epicurus`,kind:`补充`,url:`https://iep.utm.edu/epicur/`}]},{id:`lucretius`,order:20,nameZh:`卢克莱修`,nameEn:`Titus Lucretius Carus`,greekName:`Titus Lucretius Carus`,dates:`约前 99／94—前 55／54`,active:`前 1 世纪中叶`,places:[`罗马共和国（具体出生地不明）`],school:`罗马伊壁鸠鲁主义`,figureId:`lucretius`,chapterIds:[`b1-27`],thesis:`诗歌以感性图像把不可见的原子世界变成可理解经验：理解身体、灵魂、宇宙和文明的自然原因，能够拆除宗教恐惧、死亡恐惧与无止境欲望。`,evidenceCaution:`生平几乎空白，唯一同期外部材料是西塞罗前 54 年书信对诗作的简评。爱情药致疯、自杀和西塞罗整理遗稿的故事来自数百年后的哲罗姆，可信度很低；《物性论》似未完成最终修订。`,lifeSummary:`卢克莱修生活在罗马共和国晚期内战和政治失序的前一世纪中叶，具体出生地、阶层与社交圈都不确定。他把六卷拉丁长诗《物性论》献给罗马贵族盖乌斯·孟米乌斯，以伊壁鸠鲁自然学治疗宗教与死亡恐惧。西塞罗前 54 年致弟昆图斯的信称该诗兼具才华与技艺，这是唯一接近同时代的外部见证。诗中前后提纲重复、卷次调整痕迹和未兑现承诺显示作者可能未及最后修订。维吉尔、贺拉斯和奥维德很快吸收其语言；中世纪传抄稀少但未完全失传，十五世纪手稿发现使其成为近代原子论的重要古代资源。`,timeline:[{date:`约前 99／94`,place:`罗马共和国`,title:`出生`,detail:`哲罗姆提供的两个年龄方案与卒年互有冲突；姓名显示罗马公民身份，其他家庭信息未知。`,certainty:`推定`},{date:`前 60—前 55 前后`,place:`罗马共和国`,title:`写作《物性论》`,detail:`六卷诗从原子虚空推进到灵魂、感觉、宇宙与文明，写作背景是共和国政治动荡。`,certainty:`较可靠`},{date:`前 54`,place:`罗马`,title:`西塞罗书信提及诗作`,detail:`西塞罗同意弟弟对卢克莱修诗才与技艺的赞赏，证明作品当时已在精英圈阅读。`,certainty:`较可靠`},{date:`约前 55／54`,place:`地点不明`,title:`去世与未完成修订`,detail:`早逝可解释文本修订痕迹，但疯癫、自杀和爱情药故事与早期接受不符。`,certainty:`推定`},{date:`1417`,place:`德意志修道院网络`,title:`手稿重新进入人文主义传播`,detail:`波焦发现一份手稿并非作品从零‘复活’，而是使此前稀少的传本快速进入印刷和近代思想网络。`,certainty:`较可靠`}],inquiries:[{object:`不可见自然与可见证据`,question:`原子和虚空看不见，为什么仍可成为合理解释？`,start:`风和气也不可被眼睛直接看见，却以树木弯折、触感和运动显现效果；不可见不等于无证据。`,steps:[`从无中不能生有、存在不能归无开始`,`由运动需要间隔推出虚空`,`由复合物可毁而自然不耗尽推出不灭原子`,`用宏观规律反推微观结构`],conclusion:`原子理论通过可见后果、解释统一性和对竞争材料论的反驳获得支持；诗的比喻承担从经验到不可见结构的桥梁。`},{object:`灵魂、死亡与治疗`,question:`怎样让‘死亡没有感觉’不只是一句抽象安慰？`,start:`人把自己想象成死后仍在场的旁观者，因而哀悼永远失去未来或担心地下惩罚。`,steps:[`证明灵魂与身体相互依赖且同为原子复合物`,`列举灵魂不能独立存活的论证`,`用出生前的无感与死后对称`,`把地狱刑罚解释为今生欲望和恐惧的投射`],conclusion:`主体随复合体解散，不会经验自身缺席。自然知识借诗歌反复练习，才可能把逻辑结论转化为情绪习惯。`},{object:`原子偏斜、因果与行动`,question:`若原子只平行下落或一切都由先前运动锁定，碰撞和自主行动如何开始？`,start:`完全相同速度的直线下落不能相遇；无穷因果链又似乎不给行动者留下发起运动的空间。`,steps:[`设定无固定时间地点的最小偏斜`,`让原子产生碰撞和复合`,`把动物意愿作为独立行动事实`,`拒绝把偏斜直接当成随机决定每个选择`],conclusion:`偏斜为自然形成与能动性提供非严格决定的余地，但它怎样与成熟心理选择连接，文本没有给出完整机制。`},{object:`文明、宗教与自然史`,question:`语言、法律和宗教是否必须来自神授或一次设计？`,start:`世界并不特别适合人类，新生儿脆弱，农业艰难；这与为人类预制的完美设计不符。`,steps:[`从早期人类适应环境和共同防御开始`,`让语言由反应和使用逐渐形成`,`以互不伤害需要产生法律`,`把天象恐惧与权力经验投射为神罚`],conclusion:`文明是无预定蓝图的累积过程，既带来技艺与合作，也不断制造战争、奢侈和新的恐惧。`}],concepts:[{zh:`《物性论》`,en:`De rerum natura / On the Nature of Things`,definition:`六卷拉丁哲学史诗，以原子自然学完成从宇宙、灵魂到文明和疾病的治疗性课程。`},{zh:`物象薄膜`,en:`simulacra`,definition:`物体不断发出的极薄原子膜，保留外形并作用于眼睛或心灵，用于解释视觉、梦和想象。`},{zh:`原子偏斜`,en:`clinamen / atomic swerve`,definition:`原子运动中的最小无定时偏移，使碰撞可能并为能动性讨论留下空间。`},{zh:`死亡对称论证`,en:`symmetry argument`,definition:`出生前的无感觉并不使我们痛苦，死亡后的无感觉也不应被想象成主体持续承受的损失。`},{zh:`蜜糖与苦艾`,en:`honeyed cup`,definition:`诗歌如杯缘的蜜，使读者愿意服下起初苦涩的自然哲学；形式不是装饰，而是情绪治疗的技术。`},{zh:`灵魂有死`,en:`mortality of the soul`,definition:`灵魂由细微原子构成并依赖身体组织，身体解体后不能继续感受；这一自然学结论直接服务于消除死后惩罚恐惧。`},{zh:`多重自然解释`,en:`multiple explanations`,definition:`当天体现象的具体成因无法由证据唯一决定时，可以保留多个彼此相容的自然原因，只要排除神意干预和逻辑不可能。`},{zh:`文明发生史`,en:`natural history of civilization`,definition:`语言、火、家庭、法律和技术从需要、模仿与试错中逐步形成，无须预设神一次性授予完整制度。`}],lineage:{inherited:`公开把伊壁鸠鲁称为解放人类的导师，并通过其传统继承德谟克利特原子论；拉丁史诗形式又与恩尼乌斯等罗马诗歌传统对话。`,school:`属于罗马伊壁鸠鲁主义，却不是简单翻译。诗的结构、共和国处境、拉丁术语创新和宏大自然意象构成独立哲学表达。`,influenced:`维吉尔、贺拉斯、奥维德及后世拉丁诗吸收其语言；文艺复兴后影响伽桑狄、近代原子论、宗教批判和自然主义文学。`,parallel:`现代科普同样用可视比喻连接不可见模型和公众理解，但卢克莱修的目标还包括灵魂训练与生活解放，不只传播事实。`},comparisons:[{target:`伊壁鸠鲁`,relation:`承接前人`,shared:`原子、虚空、感觉标准、神不干预和死亡不应恐惧。`,difference:`伊壁鸠鲁以书信、格言和共同体教学；卢克莱修以拉丁史诗、强烈意象和罗马历史经验完成传播。`},{target:`德谟克利特`,relation:`后世重构`,shared:`复合物由不灭原子在虚空中形成，感觉性质属于结构互动。`,difference:`卢克莱修继承伊壁鸠鲁的偏斜和治疗伦理，不再以纯粹必然性描述全部运动。`},{target:`柏拉图`,relation:`批评关系`,shared:`哲学必须改变灵魂对死亡和善的理解。`,difference:`柏拉图以灵魂不朽和理念提升生命；卢克莱修以灵魂有死和自然原因消除超自然恐惧。`},{target:`现代自然主义`,relation:`后世重构`,shared:`用非神意因果解释宇宙、心灵和文明。`,difference:`其原子、感觉薄膜和宇宙模型不是现代实验科学，近代接受也常选择性改造而非直接延续。`}],russellView:`罗素主要借卢克莱修让伊壁鸠鲁主义获得最有力的声音，大段引用其赞颂理性突破宗教壁垒、证明灵魂有死和描写原子世界的诗句。他认为卢克莱修的热情、想象和道德严肃超过学派创始人，也把他视作古代少数彻底反迷信的伟大诗人。`,modernCorrection:`爱情药、间歇疯癫和自杀不能当作解释作品强度的心理事实，西塞罗‘编辑遗稿’也未获同期证据。《物性论》并非把科学包上甜美外衣：比喻、重复、恐怖和崇高场景直接参与认知与情绪训练。手稿在 1417 年前并未完全消失，‘一书开启现代性’的流行叙事同样过度简化传播网络。`,sources:[E(`第一卷第二十七章〈伊壁鸠鲁派〉`),{label:`Stanford Encyclopedia · Lucretius`,kind:`补充`,url:`https://plato.stanford.edu/entries/lucretius/`},{label:`Internet Encyclopedia of Philosophy · Lucretius`,kind:`补充`,url:`https://iep.utm.edu/lucretius/`}]},...le];Object.fromEntries(D.map(e=>[e.id,e]));var O=(e,t,n,r,i,a=e)=>({id:e,nameZh:t,nameEn:n,figureId:a,chapterIds:r,relation:i}),ue=[{id:`greek-origins`,title:`希腊哲学的形成`,years:`约前 600—前 450`,russellRange:`第一卷 · 前苏格拉底哲学（第 I—X 章）`,condition:`城邦、殖民贸易、字母书写与跨文化接触，使自然解释逐渐从神话叙事中分化出来。`,commonProblems:[`世界由什么构成？`,`变化如何可能？`,`理性与感官何者更可靠？`],contextChapterIds:[`b1-01`],schools:[{i  value`,response:`质疑理性体系的最高地位，把欲望、意志与价值创造推到中心。`,sharedPattern:`非理性动力、生命评价与文化诊断。`,chapterIds:[],philosophers:[O(`schopenhauer`,`叔本华`,`Arthur Schopenhauer`,[`b3-24`],`以盲目意志解释世界与痛苦。`),O(`nietzsche`,`尼采`,`Friedrich Nietzsche`,[`b3-25`],`以谱系和价值重估批判传统道德。`)]}]},{id:`industrial-modern`,title:`工业社会与现代哲学的分化`,years:`19 世纪—20 世纪上半叶`,russellRange:`第三卷 · 从卢梭到现代（第 XXVI—XXXI 章）`,condition:`工业资本主义、民主教育、社会科学和现代逻辑，使哲学分化为社会批判、行动理论、经验研究与语言分析。`,commonProblems:[`现代制度应以何种标准评价？`,`思想的意义是否取决于实践后果？`,`哲学能否通过逻辑分析澄清问题？`],contextChapterIds:[],schools:[{id:`utilitarianism`,title:`功利主义`,english:`Utilitarianism`,response:`以可比较的幸福后果评价法律、制度与行动。`,sharedPattern:`结果衡量、改革主义与公共政策。`,chapterIds:[`b3-26`],philosophers:[O(`bentham`,`边沁`,`Jeremy Bentham`,[],`以最大幸福原则推动制度改革。`),O(`mill`,`约翰·斯图亚特·密尔`,`John Stuart Mill`,[],`把自由、个性与较高快乐纳入功利主义。`)]},{id:`historical-materialism`,title:`历史唯物主义`,english:`Historical materialism`,response:`从生产关系、阶级冲突和实践解释观念与制度变化。`,sharedPattern:`历史结构、社会关系与批判实践。`,chapterIds:[],philosophers:[O(`marx`,`马克思`,`Karl Marx`,[`b3-27`],`把哲学批判转向资本主义社会结构。`)]},{id:`intuitionism`,title:`生命与直觉哲学`,english:`Philosophy of life and intuition`,response:`反对把流动经验完全还原为空间化、可计算的概念。`,sharedPattern:`绵延、直觉与创造性演化。`,chapterIds:[],philosophers:[O(`bergson`,`柏格森`,`Henri Bergson`,[`b3-28`],`以绵延区分生活时间与物理时间。`,`bergson`)]},{id:`pragmatism`,title:`实用主义`,english:`Pragmatism`,response:`通过观念在经验和行动中的差异检验其意义。`,sharedPattern:`后果、探究过程与可修正信念。`,chapterIds:[],philosophers:[O(`william-james`,`威廉·詹姆斯`,`William James`,[`b3-29`],`把真理理解为在经验中发生作用的关系。`),O(`dewey`,`约翰·杜威`,`John Dewey`,[`b3-30`],`把思想理解为解决问题的公共工具。`)]},{id:`logical-analysis`,title:`逻辑分析哲学`,english:`Logical analysis`,response:`通过现代逻辑和语言分析拆解传统哲学问题。`,sharedPattern:`形式化、命题结构与概念澄清。`,chapterIds:[`b3-31`],philosophers:[O(`frege`,`弗雷格`,`Gottlob Frege`,[],`为现代逻辑和意义分析奠定基础。`),O(`russell`,`罗素`,`Bertrand Russell`,[],`把逻辑分析发展为哲学方法。`)]}]}];ue.flatMap(e=>[...e.contextChapterIds,...e.schools.flatMap(e=>[...e.chapterIds,...e.philosophers.flatMap(e=>e.chapterIds)])]);var de={思想来源:{order:1,direction:`directed`,temporal:`先行资源`,mechanism:`概念输入`,description:`后来的传统把前人的问题、概念或论证当作资源。`},竞争:{order:2,direction:`reciprocal`,temporal:`同代或相近时期`,mechanism:`问题论争`,description:`不同传统围绕相近问题提出互相排斥或持续回应的答案。`},分化:{order:3,direction:`directed`,temporal:`共同传统的支流`,mechanism:`谱系分叉`,description:`共同来源内部形成不同路线；方向表示谱系分支，不等于严格年代顺序。`},吸收改造:{order:4,direction:`directed`,temporal:`选择性继承`,mechanism:`功能改写`,description:`后来的传统选择性继承概念，并将其放入新的体系或目的中。`},后世重构:{order:5,direction:`directed`,temporal:`后世接受`,mechanism:`翻译、注释与制度化`,description:`较晚时代通过翻译、注释、制度或新问题重新解释前一传统。`}},fe=e=>({label:`罗素《西方哲学史》${e}`,kind:`原书`,url:`https://www.russell-j.com/cool/HWP_1945.pdf`}),k=[{id:`presocratic-traditions`,order:1,nameZh:`前苏格拉底自然哲学诸传统`,nameEn:`Presocratic Traditions`,kind:`传统群 · 现代统称`,period:`约前 6 世纪—前 5 世纪`,regions:[`爱奥尼亚`,`大希腊`,`雅典`],thesis:`把世界视为可以从内部原则得到解释的秩序，并在‘变化如何可能’这一共同问题上，依次提出本原、数、逻各斯、存在、多元要素和原子等不同方案。`,classificationNote:`“前苏格拉底”不是当事人自称的学派，也不完全是年代概念：阿那克萨哥拉和德谟克利特与苏格拉底同时。本站把它作为问题谱系，内部差异比统一教义更重要。`,context:{overview:`殖民城邦、海上贸易、测量技术和跨文明接触，使早期希腊思想能够把天象、地理、生命和政治秩序放在同一个可解释世界中。波斯扩张与城邦竞争又把知识从爱奥尼亚带向大希腊和雅典。`,factors:[{title:`爱奥尼亚交流网络`,detail:`米利都等港口连接埃及、巴比伦和小亚细亚；历法、几何与航海经验提供了寻找稳定规律的材料。`},{title:`从神谱到自然秩序`,detail:`解释仍可使用神性语言，但关键因果逐渐位于世界内部，不再依赖人格神每次临时干预。`},{title:`迁徙与思想转运`,detail:`波斯征服、殖民活动和个人迁徙使问题从爱奥尼亚转入南意大利、西西里和雅典，并在新环境中发生分化。`}]},architecture:{commonProblem:`多样事物从何而来？世界持续变化时，什么使它仍是一个可理解的整体？`,sharedPremise:`自然具有自身的原则和秩序；少数能够重复使用的原因，应当解释尽可能多的现象。`,method:`从可观察现象提出统一本原，再用反例迫使理论升级：单一材料难以解释对立，纯粹变化威胁知识，绝对不变又威胁经验，于是出现多元论和原子论。`,answer:`没有统一答案，真正的共同成果是一条可复用的推理链：本原问题 → 变化难题 → 存在约束 → 保存不生不灭要素并重构组合变化。`,tensions:[{title:`变化／恒常`,detail:`赫拉克利特把秩序放在变化关系中；巴门尼德则从‘存在不能不在’推出真实者不生不灭。`},{title:`一／多`,detail:`米利都传统寻求单一本原；恩培多克勒、阿那克萨哥拉与原子论者用多个恒常成分解释可见变化。`},{title:`经验／理性约束`,detail:`感官显示生成与消灭，论证却要求不从无中生有；后继理论必须同时对两者负责。`}]},philosophers:[{id:`thales`,role:`米利都问题起点`,contribution:`以水作为本原，把多样世界压缩为自然材料的变化。`,interaction:`阿那克西曼德保留问题形式，却反对把已知元素当作无条件本原。`},{id:`anaximander`,role:`抽象化本原`,contribution:`以无定者说明对立如何从更中性的根源分化。`,interaction:`阿那克西美尼重新选择可感材料，并补上凝聚—稀释机制。`},{id:`anaximenes`,role:`机制化单一本原`,contribution:`用气及凝聚、稀释连接统一材料与多种形态。`,interaction:`为后来以过程解释性质差异提供清晰模型。`},{id:`pythagoras`,role:`数与生活共同体`,contribution:`把数的比例、灵魂净化和共同生活联系起来。`,interaction:`其数学秩序深刻影响柏拉图，但个人教义与后世学派层累难以分开。`},{id:`heraclitus`,role:`变化中的秩序`,contribution:`用逻各斯和对立张力说明变化并非混乱。`,interaction:`巴门尼德从相反方向把‘存在’的逻辑约束推到极端。`},{id:`parmenides`,role:`存在论约束`,contribution:`以不可从无到有的论证，迫使后继者重新解释变化。`,interaction:`恩培多克勒、阿那克萨哥拉和原子论都保留不生不灭成分，再解释其重组。`},{id:`empedocles`,role:`多元论回应`,contribution:`以四根和爱、争说明组合、分离与宇宙循环。`,interaction:`与阿那克萨哥拉都回应巴门尼德，却给出有限要素与无限种子的不同方案。`},{id:`anaxagoras`,role:`心灵与混合`,contribution:`以万物相含和努斯解释分离运动及秩序。`,interaction:`把自然哲学带入雅典，也成为苏格拉底与柏拉图讨论目的因的重要背景。`},{id:`leucippus`,role:`原子论奠基`,contribution:`以原子和虚空同时保存存在者不生灭与可见运动。`,interaction:`德谟克利特扩展这一方案；两人具体分工因证据残缺而难确定。`},{id:`democritus`,role:`原子论系统化`,contribution:`用形状、次序和位置差异解释性质，不把目的作为自然变化的基本原因。`,interaction:`后来伊壁鸠鲁吸收原子论，再为伦理治疗加入偏斜与欲望理论。`}],development:[{period:`约前 6 世纪`,title:`本原与宇宙生成`,detail:`米利都思想家首次形成连续问题：共同材料是什么，它怎样变成可见世界？`},{period:`前 6—5 世纪`,title:`数、变化与存在`,detail:`毕达哥拉斯传统、赫拉克利特和巴门尼德分别把秩序放在比例、变化关系与存在必然性中。`},{period:`前 5 世纪`,title:`多元论与原子论`,detail:`后继者接受‘基本存在者不生不灭’，把经验变化重写为恒常成分的组合、分离或运动。`},{period:`前 4 世纪以后`,title:`被系统哲学重新编排`,detail:`柏拉图、亚里士多德及后世文献保存并分类这些思想；我们今天看到的谱系因此带有后继者的问题框架。`}],relations:[{target:`柏拉图主义`,relation:`思想来源`,detail:`理念论同时回应赫拉克利特式流变、巴门尼德式存在和毕达哥拉斯式数学秩序。`},{target:`伊壁鸠鲁主义`,relation:`思想来源`,detail:`伊壁鸠鲁继承德谟克利特的原子和虚空，但改变物理学以服务自由与安宁。`},{target:`斯多葛主义`,relation:`思想来源`,detail:`斯多葛派吸收赫拉克利特的火与逻各斯，却把它们系统化为天意、决定论和伦理秩序。`},{target:`亚里士多德主义`,relation:`吸收改造`,detail:`亚里士多德以四因和质料—形式重写早期思想，并由此建立西方哲学最有影响力的前史叙述。`}],influence:[{field:`问题形式`,detail:`本原、变化、存在、一与多成为此后形而上学反复使用的最小问题集。`},{field:`解释标准`,detail:`世界应由一般、内在、可讨论的原则解释，这一转变比任何单个本原答案更持久。`},{field:`证据意识`,detail:`残篇与见证的区分提醒我们：哲学史知识不仅有内容，也有可靠度层级。`}],russellView:`罗素把希腊哲学的诞生与城邦活力、商业交流、科学好奇和宗教气质并置，并用一条从米利都到原子论的论证升级链，展示西方理性思辨如何形成。`,modernCorrection:`罗素的叙事清晰却容易制造线性进步印象。‘从神话到理性’不是神话突然消失，而是解释责任逐渐转向自然内部；‘前苏格拉底’也只是便利标签，不能抹平各传统的宗教、伦理与认识论差异。`,chapterIds:[`b1-01`,`b1-02`,`b1-03`,`b1-04`,`b1-05`,`b1-06`,`b1-08`,`b1-09`,`b1-24`],sources:[fe(`第一卷第一至九章、第二十四章`),{label:`Stanford Encyclopedia · Presocratic Philosophy`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/presocratics/`}]},{id:`sophists-socratic-turn`,order:2,nameZh:`智者与苏格拉底转向`,nameEn:`Sophists and the Socratic Turn`,kind:`问题共同体 · 竞争方案`,period:`约前 5 世纪中后期`,regions:[`雅典`,`希腊城邦世界`],thesis:`民主法庭、公共辩论和战争危机把哲学重心推向语言、德性、知识与城邦生活；智者与苏格拉底面对同一公共世界，却对教育、真理和说服的关系作出竞争性回答。`,classificationNote:`这不是统一学派。‘智者’包含多位收费授课、观点不同的教师；苏格拉底本人没有建立学校或留下著作。把两者并置，是为了保留共同历史问题与关键分歧。`,context:{overview:`前 5 世纪雅典的民主制度需要公民在议会和法庭中说服他人；帝国扩张、伯罗奔尼撒战争、寡头政变与败战又暴露了法律、习俗和德性的脆弱。哲学因而从宇宙本原转向人如何判断和共同生活。`,factors:[{title:`民主公共空间`,detail:`政治参与依赖演说、反驳和法律解释，语言能力成为真实的社会力量。`},{title:`城邦间习俗差异`,detail:`旅行教师观察到各地法律与价值不同，推动自然／约定、普遍／相对问题进入中心。`},{title:`战争与制度危机`,detail:`长期战争和政权更替使‘谁真正知道善、谁有资格教育与统治’不再是抽象问题。`}]},architecture:{commonProblem:`德性是否可教？法律与正义来自自然还是约定？在意见冲突中，人凭什么声称自己知道？`,sharedPremise:`人的判断、语言和教育会改变公共行动；未经检验的传统不足以自动提供正当性。`,method:`智者训练修辞、对立论证和案例判断；苏格拉底以连续问答追索定义、暴露矛盾，并把承认无知转化为继续探究的起点。`,answer:`智者倾向提供参与城邦所需的可教能力；苏格拉底把首要任务改为灵魂照料和信念一致性。共同转向是‘人及其共同生活’，分歧在说服成功是否等于认识改善。`,tensions:[{title:`说服／真理`,detail:`有效言说能赢得判断，却未必证明内容为真；苏格拉底要求将胜负重新置于概念审查之下。`},{title:`自然／约定`,detail:`不同城邦的规范差异可支持相对主义，也可反过来推动寻找超越习俗的正义尺度。`},{title:`可教技术／人格转变`,detail:`政治技能可以训练，但知道德性定义是否足以使人变好，始终没有简单答案。`}]},philosophers:[{id:`protagoras`,role:`智者运动代表`,contribution:`以‘人为万物的尺度’突出判断的处境性，并以反对意见的训练服务公民能力。`,interaction:`柏拉图通过对话录使其与苏格拉底持续竞争：德性教育究竟是公共技术还是知识问题？`},{id:`socrates`,role:`伦理问答的转折点`,contribution:`把承认无知、定义追问和反驳结合成对信念与生活的一体审查。`,interaction:`与智者共享公共辩论形式，却拒绝把胜诉、收费授课或传授现成答案当作哲学成功。`},{id:`plato`,role:`主要记录者与重构者`,contribution:`用对话录保存并塑造苏格拉底形象，同时把智者／哲学家的区分理论化。`,interaction:`我们对这场竞争的认识深受他的立场支配，不能把戏剧角色直接等同于历史人物。`}],development:[{period:`前 5 世纪中叶`,title:`流动教师进入雅典`,detail:`修辞、法律论证和一般教育回应民主城邦的现实需求。`},{period:`约前 430—前 399`,title:`苏格拉底式公开审问`,detail:`苏格拉底不提供固定课程，而在公共交谈中把‘你如何生活’变成持续检验。`},{period:`前 399 以后`,title:`苏格拉底诸传统分化`,detail:`柏拉图学院、犬儒派、昔兰尼派及其他‘小苏格拉底学派’分别放大知识、德性、自足或快乐。`},{period:`后世`,title:`智者形象被重新评价`,detail:`长期以来智者主要经柏拉图的批评被理解；现代研究更重视其语言、法律与政治思想的独立价值。`}],relations:[{target:`古代怀疑主义`,relation:`思想来源`,detail:`承认无知和对立论证后来成为怀疑方法的重要资源，但苏格拉底并不等于后来的悬置判断。`},{target:`柏拉图主义`,relation:`分化`,detail:`柏拉图把苏格拉底式伦理审问扩展为理念、灵魂、知识和政治秩序的系统。`},{target:`犬儒主义`,relation:`分化`,detail:`犬儒派把苏格拉底的自足、坦率与生活一致性推向公开、激进的实践。`},{target:`亚里士多德主义`,relation:`吸收改造`,detail:`亚里士多德把定义、论证和德性教育纳入系统逻辑、伦理与政治研究。`}],influence:[{field:`哲学对象`,detail:`知识、德性、正义、语言和教育成为可以系统追问的中心对象。`},{field:`哲学方法`,detail:`反驳、定义追问和对立论证成为后世学园竞争的共同技术。`},{field:`哲学生活`,detail:`哲学不只生产命题，也要求言说、选择与人格之间保持可说明的一致。`}],russellView:`罗素把普罗泰戈拉放在主观主义与民主文化的背景中，把苏格拉底作为伦理哲学的决定性转折，并特别关注历史苏格拉底与柏拉图笔下人物难以分离的问题。`,modernCorrection:`不能把所有智者都归为‘否认真理的诡辩家’，也不能把苏格拉底方法缩成万能教学步骤。两者都是由有限、带立场的文献重构；页面保留竞争关系，不预设一方只是另一方的反面教材。`,chapterIds:[`b1-07`,`b1-10`,`b1-11`],sources:[fe(`第一卷第七、第十至十一章`),{label:`Stanford Encyclopedia · The Sophists`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/sophists/`},{label:`Stanford Encyclopedia · Socrates`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/socrates/`}]},{id:`platonism`,order:3,nameZh:`柏拉图主义`,nameEn:`Platonism`,kind:`长时段传统 · 学园及多次重构`,period:`前 387 年前后—古代晚期`,regions:[`雅典`,`地中海世界`,`罗马帝国`],thesis:`以可理解秩序说明知识、价值与世界：感性多样只有通过形式、灵魂与统一原则才可被认识和评价；这一核心不断被学院怀疑主义、中期柏拉图主义和普罗提诺重新解释。`,classificationNote:`柏拉图主义不是一套两千年不变的命题。柏拉图本人以对话写作，学园后来经历怀疑转向；‘新柏拉图主义’也是现代标签。页面以持续重现的问题结构连接这些差异。`,context:{overview:`伯罗奔尼撒战争、雅典败亡、寡头政变和苏格拉底之死，使知识与政治秩序的关系成为柏拉图的核心压力。古代晚期的帝国危机、宗教竞争和超越诉求，又推动普罗提诺把柏拉图资源重构为层级宇宙。`,factors:[{title:`城邦政治失序`,detail:`民主与寡头的反复失败，使‘谁知道善、谁有资格统治’进入哲学体系中心。`},{title:`苏格拉底之死`,detail:`哲学审问与城邦权威的冲突，推动柏拉图思考教育、法律和灵魂秩序。`},{title:`数学与学园制度`,detail:`几何展示了不依赖个别感官对象的可证明关系；学院则使问题能够跨代延续并发生内部转向。`},{title:`古代晚期帝国与宗教环境`,detail:`三世纪危机与多种救赎传统并存，使统一、超越和灵魂回归获得新的历史重量。`}]},architecture:{commonProblem:`变化的感性经验如何产生稳定知识？善与正义如何拥有不随意见改变的尺度？多样世界为什么仍具有统一秩序？`,sharedPremise:`可理解性和价值不能完全由当下感官事实或多数意见提供；灵魂必须通过理性转向更稳定的结构。`,method:`以对话和辩证法清除定义矛盾，再借数学、分类、假设上升与整体—部分对应，把认识论、伦理、政治和宇宙论连成层级结构。`,answer:`柏拉图以理念和善提供稳定尺度；学院怀疑派把苏格拉底式反驳用于限制独断；普罗提诺则以太一—精神—灵魂说明统一如何生成多样并使回归可能。`,tensions:[{title:`超越形式／具体事物`,detail:`理念若独立，如何解释参与和因果；若完全内在，又是否仍能提供不变尺度？`},{title:`哲人知识／政治自由`,detail:`知识资格能否转化为统治资格，是《理想国》最强也最危险的推论之一。`},{title:`体系／怀疑`,detail:`学院派怀疑主义并非简单背叛柏拉图，它可被理解为继承对话中的反独断方法。`},{title:`超越／世界价值`,detail:`普罗提诺要求灵魂上升，却反对把感性宇宙判为纯粹邪恶。`}]},philosophers:[{id:`socrates`,role:`伦理与方法来源`,contribution:`提供灵魂照料、定义追问和哲学生活的原型。`,interaction:`柏拉图既保存又重构苏格拉底；成熟对话中的体系不能全部还原为历史苏格拉底。`},{id:`plato`,role:`学院创立者与核心作者`,contribution:`把理念、灵魂、知识、德性、政治与宇宙论组织为互相支持的问题网络。`,interaction:`其对话保留多声部和发展变化，后继者因此能从不同部分建立不同柏拉图主义。`},{id:`arcesilaus`,role:`学院怀疑转向`,contribution:`以反驳斯多葛认识标准恢复不轻率断言的苏格拉底姿态。`,interaction:`把学院从正面体系转向针对论敌的双向论证。`},{id:`carneades`,role:`学院怀疑主义深化`,contribution:`用可信印象说明缺少确定知识时仍可行动。`,interaction:`与斯多葛派围绕认知印象、责任和自然法形成长期竞争。`},{id:`plotinus`,role:`古代晚期系统重构`,contribution:`以太一、精神与灵魂的流溢—回归结构，重写柏拉图的统一、理念和灵魂问题。`,interaction:`吸收亚里士多德和斯多葛资源，同时反对把世界视为恶的诺斯替方案。`}],development:[{period:`前 4 世纪`,title:`柏拉图与早期学院`,detail:`对话写作和共同研究形成学园，但不存在一本由柏拉图亲自写定的教科书式体系。`},{period:`前 3—1 世纪`,title:`学院怀疑主义`,detail:`阿尔克西劳与卡尔内阿德把反驳、悬置和可行动性置于中心。`},{period:`前 1 世纪—公元 2 世纪`,title:`中期柏拉图主义`,detail:`多位作者重新突出正面教义、神学与理念秩序，并与亚里士多德、斯多葛主义发生融合。`},{period:`公元 3 世纪以后`,title:`普罗提诺及后继者`,detail:`统一原则被提升为超越存在的太一，传统进入古代晚期宗教哲学与中世纪思想。`}],relations:[{target:`前苏格拉底自然哲学诸传统`,relation:`思想来源`,detail:`流变、存在、数与努斯分别进入柏拉图的知识、形式和宇宙秩序问题。`},{target:`斯多葛主义`,relation:`竞争`,detail:`双方围绕知识标准、灵魂、宇宙理性和善展开长期争论，也发生概念互借。`},{target:`亚里士多德主义`,relation:`分化`,detail:`亚里士多德保留形式与目的，却反对把形式作为与具体实体分离的独立世界。`},{target:`古代怀疑主义`,relation:`分化`,detail:`学院怀疑主义是柏拉图学园自身的一段历史，同时又与皮浪传统保持差异。`}],influence:[{field:`形而上学`,detail:`形式、参与、统一层级与灵魂结构成为古代晚期及中世纪哲学的核心资源。`},{field:`政治哲学`,detail:`知识与统治、教育与制度塑形的关系持续引发借鉴和批评。`},{field:`宗教哲学`,detail:`新柏拉图主义为基督教、伊斯兰和犹太哲学提供超越、创造与回归的概念语言。`}],russellView:`罗素用六章展开柏拉图：思想来源、理想国、理念、不朽、宇宙生成和知识，并在普罗提诺一章追踪其古代晚期重构。他高度评价问题规模，却严厉批评哲学王政治和把超感世界置于经验之上的倾向。`,modernCorrection:`罗素常把对话中的论证压成单一‘柏拉图体系’，也以现代自由主义直接裁判古代政治方案。页面保留其批评价值，同时区分对话的戏剧结构、柏拉图本人立场、学院历史与后世柏拉图主义。`,chapterIds:[`b1-12`,`b1-13`,`b1-14`,`b1-15`,`b1-16`,`b1-17`,`b1-18`,`b1-30`],sources:[fe(`第一卷第十二至十八章、第三十章`),{label:`Stanford Encyclopedia · Plato`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/plato/`},{label:`Stanford Encyclopedia · Plotinus`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/plotinus/`}]},{id:`aristotelianism`,order:4,nameZh:`亚里士多德主义／逍遥学派`,nameEn:`Aristotelianism / Peripatetic School`,kind:`有组织学园 · 跨时代研究传统`,period:`约前 335 年起`,regions:[`雅典`,`希腊化世界`,`后世欧亚学术网络`],thesis:`从具体事物与各门知识的实际解释出发，以范畴、四因、质料—形式、潜能—现实和目的结构建立可分科又互相连接的研究体系。`,classificationNote:`‘逍遥学派’首先指亚里士多德在吕克昂形成的学园传统；‘亚里士多德主义’则包括后世希腊注释家、伊斯兰哲学和拉丁经院哲学的多次重构，远大于创始人的原始学园。`,context:{overview:`马其顿崛起削弱城邦自主，亚历山大征服又扩大了可收集、分类和比较的世界。亚里士多德在柏拉图学院学习后，于吕克昂组织讲授与共同研究，把逻辑、自然、生命、伦理、政治和诗学纳入相互连接的知识工程。`,factors:[{title:`学院训练与分歧`,detail:`二十年学院经历提供问题资源；对分离理念的批评推动形式回到具体实体。`},{title:`马其顿与扩大的世界`,detail:`跨城邦政治和自然资料的积累，使比较政体、动物分类与知识分科获得现实条件。`},{title:`吕克昂的协作研究`,detail:`学园不仅传授结论，也收集宪制、物种和前人意见，形成研究共同体。`}]},architecture:{commonProblem:`怎样既尊重经验中的具体事物，又说明其稳定结构、变化原因、知识形式和善的目标？`,sharedPremise:`事物是可分类、可说明的；完整理解通常需要回答它是什么、由什么构成、如何发生以及为了什么。`,method:`从各学科公认现象与前人难题出发，区分多重意义，建立范畴和论证形式，再以原因分析把局部解释放入层级秩序。`,answer:`形式存在于具体实体中；变化是潜能实现为现实；知识把握原因；人的善则是灵魂依德性进行符合其功能的活动。`,tensions:[{title:`经验收集／目的解释`,detail:`丰富观察与强目的论并存；后世科学既继承分类，又逐渐拒绝部分自然目的论。`},{title:`个别实体／普遍知识`,detail:`真正存在的是具体个体，但科学知识表达普遍原因，两者如何衔接构成持续难题。`},{title:`德性／外在条件`,detail:`幸福要求德性活动，却也需要朋友、健康和一定资源，因此不同于斯多葛的‘德性唯一善’。`}]},philosophers:[{id:`plato`,role:`主要思想来源与论敌`,contribution:`提供形式、知识、灵魂、德性和政体问题的系统背景。`,interaction:`亚里士多德反对分离理念，却保留形式、目的和知识等级的基本追求。`},{id:`aristotle`,role:`吕克昂创立者`,contribution:`建立逻辑、形而上学、自然学、生命研究、伦理和政治之间的解释接口。`,interaction:`后继者整理讲稿和著作传统，但现有页面暂以创始人的结构为主，避免虚构尚未建立的人物资料。`}],development:[{period:`约前 335—前 322`,title:`吕克昂研究共同体`,detail:`亚里士多德与合作者进行讲授、资料收集和分类研究。`},{period:`希腊化—罗马时期`,title:`学园延续与文本整理`,detail:`泰奥弗拉斯托斯延续自然研究；公元前一世纪前后，著作编订推动系统阅读。`},{period:`古代晚期`,title:`注释传统`,detail:`注释家在柏拉图主义占优势的环境中保存、解释并调和亚里士多德文本。`},{period:`中世纪`,title:`阿拉伯语与拉丁语重构`,detail:`翻译、注释和神学争论使亚里士多德成为跨宗教的大学知识骨架。`}],relations:[{target:`斯多葛主义`,relation:`竞争`,detail:`双方都建构逻辑—自然—伦理体系，但在实体、逻辑单位、情绪和外物价值上不同。`},{target:`柏拉图主义`,relation:`分化`,detail:`共同追求可理解形式与善，却在形式是否分离、经验研究地位和政治方案上分道。`},{target:`近代科学`,relation:`吸收改造`,detail:`分类、论证和因果追问被继承，地心宇宙与若干目的论解释则成为突破对象。`},{target:`中世纪经院哲学`,relation:`后世重构`,detail:`经翻译和注释进入伊斯兰、犹太与拉丁思想，成为信仰—理性关系的主要技术语言。`}],influence:[{field:`知识组织`,detail:`学科划分、定义、范畴与证明方式塑造了长期教育制度。`},{field:`逻辑`,detail:`三段论成为两千多年形式推理教学的中心模型。`},{field:`伦理与政治`,detail:`德性、实践智慧、共同体和政体比较持续影响当代伦理与政治研究。`}],russellView:`罗素分别讨论形而上学、伦理学、政治学、逻辑学和物理学，承认亚里士多德对概念与学科结构的巨大塑造，也认为其权威在中世纪以后妨碍了经验科学。`,modernCorrection:`不能把后世教科书式‘亚里士多德主义’全部归因于亚里士多德本人，也不能用科学史上的错误抹去其观察、解释层级和实践推理。页面区分创始文本、学园延续与后世制度化权威。`,chapterIds:[`b1-19`,`b1-20`,`b1-21`,`b1-22`,`b1-23`,`b1-24`],sources:[fe(`第一卷第十九至二十四章`),{label:`Stanford Encyclopedia · Aristotle`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/aristotle/`}]},{id:`cynicism`,order:5,nameZh:`犬儒主义`,nameEn:`Cynicism`,kind:`生活实践运动 · 松散传承`,period:`约前 4 世纪—罗马帝国时期`,regions:[`雅典`,`科林斯`,`希腊化—罗马城市`],thesis:`把哲学从论证结果压缩为可见生活：通过训练、自足、坦率和对习俗的公开挑战，证明幸福所需极少，而社会制造的欲望与身份依赖才是束缚。`,classificationNote:`犬儒主义没有稳定教义机构，人物故事又高度传奇化。它更像可模仿的生活姿态和师承链，而非拥有统一课程的学校；‘犬儒’的现代贬义也不同于古代 Cynicism。`,context:{overview:`城邦秩序衰落、财富差距、流亡和身份不稳定，使一种无需财产、职位或特定政体即可实践的自由方案具有吸引力。犬儒哲学选择市场、街道和身体行为作为论证场所。`,factors:[{title:`城邦身份松动`,detail:`战争、流亡和马其顿扩张削弱稳定公民身份，自足成为可携带的安全结构。`},{title:`公共空间与表演`,detail:`犬儒派不用封闭学园证明观点，而以衣着、居所、乞讨、直言和羞耻规范制造反例。`},{title:`财富与虚荣批判`,detail:`他们把大量社会努力重新描述为对名声、权力和人工欲望的奴役。`}]},architecture:{commonProblem:`当财富、地位、政治稳定和他人评价都不可靠时，人怎样获得不易被夺走的自由？`,sharedPremise:`德性足以支撑幸福；多数欲望和羞耻规则来自习俗训练，而非不可改变的自然需要。`,method:`以苦练减少依赖，以坦率言说揭露权力，以反习俗行为测试规范，并让哲学家的生活本身成为论证。`,answer:`缩减需要、依自然生活和不把社会评价当作善恶尺度，可以获得自足；世界公民身份则把归属从单一城邦移向所有人。`,tensions:[{title:`自由／社会责任`,detail:`退出常规角色能暴露规范虚假，却也可能削弱共同制度的建设能力。`},{title:`表演／论证`,detail:`戏剧性行动易于记忆，但后世轶事可能遮蔽其反例推理和训练结构。`},{title:`自然／习俗`,detail:`诉诸自然可以批判奢侈，也需要解释何种自然生活值得规范性服从。`}]},philosophers:[{id:`socrates`,role:`伦理生活原型`,contribution:`节制、公开问答和对财富地位的轻视为犬儒传统提供可模仿的苏格拉底形象。`,interaction:`犬儒派放大其实践面，减少柏拉图式形而上体系。`},{id:`diogenes`,role:`标志性实践者`,contribution:`以自足、坦率和反习俗行为把生活变成公共反例。`,interaction:`大量故事形成可传播的哲学人格，但具体言行需要按传记可靠度分层。`},{id:`zeno`,role:`体系化继承者`,contribution:`经克拉特斯吸收犬儒式德性与自足，再加入逻辑、物理和社会义务。`,interaction:`斯多葛主义保留内在自由，却弱化犬儒对常规角色的全面挑衅。`}],development:[{period:`前 4 世纪`,title:`苏格拉底遗产的激进化`,detail:`安提斯泰尼与犬儒传统的确切关系存在争论；第欧根尼成为最强视觉原型。`},{period:`前 4—3 世纪`,title:`师承与斯多葛接口`,detail:`克拉特斯把生活训练传给季蒂昂的芝诺，犬儒伦理进入更完整体系。`},{period:`罗马帝国时期`,title:`公共道德批评复兴`,detail:`犬儒形象在城市中成为直言、贫困实践与权力批判的角色。`},{period:`现代词义迁移`,title:`Cynicism 不等于犬儒式不信任`,detail:`现代‘玩世不恭’主要指怀疑动机；古代传统则积极主张德性、自足和训练。`}],relations:[{target:`智者与苏格拉底转向`,relation:`思想来源`,detail:`继承苏格拉底的德性优先、言行一致和公共审问。`},{target:`伊壁鸠鲁主义`,relation:`竞争`,detail:`双方都缩减欲望；犬儒以公开挑衅实现自由，伊壁鸠鲁以友谊共同体和安静生活降低扰动。`},{target:`斯多葛主义`,relation:`分化`,detail:`斯多葛派把犬儒生活训练扩展为逻辑—物理—伦理体系，并重新接纳家庭和政治角色。`}],influence:[{field:`哲学作为生活`,detail:`思想必须在欲望、身体和公开选择中接受检验。`},{field:`权力批评`,detail:`坦率言说和对身份符号的拒绝，成为哲学批评社会规范的高压缩形式。`},{field:`斯多葛伦理`,detail:`德性优先、自足和世界公民观经斯多葛主义获得更长制度生命。`}],russellView:`罗素以第欧根尼轶事呈现犬儒派对文明、财产和权力的拒绝，并把它视为城邦衰落后个人退回内在德性的典型反应及斯多葛主义的重要来源。`,modernCorrection:`轶事极具记忆效率，却不能自动等于历史事实。犬儒主义也不只是消极逃避：其身体训练、坦率和世界公民语言构成对社会需要如何被制造的主动检验。`,chapterIds:[`b1-25`,`b1-26`,`b1-28`],sources:[fe(`第一卷第二十五至二十六章、第二十八章`),{label:`Internet Encyclopedia of Philosophy · Cynics`,kind:`现代研究`,url:`https://iep.utm.edu/cynics/`}]},{id:`ancient-skepticism`,order:6,nameZh:`古代怀疑主义`,nameEn:`Ancient Skepticism`,kind:`多支思想运动 · 方法传统`,period:`约前 4 世纪末—公元 2 世纪以后`,regions:[`希腊化世界`,`雅典学院`,`罗马帝国`],thesis:`当相互冲突的论证都声称确定性时，先审查知识标准本身；通过对置论证、悬置判断或降低行动承诺，避免未经证明的独断并寻求安宁。`,classificationNote:`皮浪传统与学院怀疑主义不是同一组织：前者把悬置发展为生活方法，后者在柏拉图学院内部主要攻击斯多葛知识标准。合称‘古代怀疑主义’是方法家族，不是统一教义。`,context:{overview:`亚历山大征服后的文化接触、学园间公开竞争和城邦政治失重，使互相冲突却论证精密的世界观并存。怀疑主义不再直接增加一个体系，而是检查任何体系凭什么要求同意。`,factors:[{title:`多文化与多学说并存`,detail:`法律、宗教和哲学判断的差异，使单一传统的自明性下降。`},{title:`学园竞争`,detail:`斯多葛派提出认知印象作为确定标准，学院派以不可区分反例集中攻击。`},{title:`哲学治疗需求`,detail:`对确定性的强迫追求本身会造成扰动；悬置判断因此既是认识方法，也是生活技术。`}]},architecture:{commonProblem:`当感觉、论证和权威彼此冲突时，怎样避免把尚未证明的意见误当知识，同时仍能行动？`,sharedPremise:`提出主张的人承担证明责任；一个印象若有不可区分的错误对应物，就不足以独自保证真理。`,method:`收集等强的相反论证，揭示标准循环、分歧与无穷后退；在证据不足时悬置，或仅按现象与较可信印象行动。`,answer:`皮浪路线以悬置判断意外带来安宁；学院路线削弱确定知识，并用合理或可信印象解释实践。它们共同拒绝从‘必须行动’反推‘已经确定知道’。`,tensions:[{title:`悬置／行动`,detail:`若不承诺事物本性，是否仍能选择？回答诉诸现象、习惯、技能或可信程度。`},{title:`反独断／自我反驳`,detail:`若断言‘没有知识’，自身也像独断；成熟怀疑主义往往连这一断言也不固定化。`},{title:`方法／结论`,detail:`怀疑不是‘一切都错’的结论，而是持续控制同意强度的方法。`}]},philosophers:[{id:`pyrrho`,role:`皮浪式生活原型`,contribution:`把不确定、悬置与不受扰动的生活联系起来。`,interaction:`本人没有著作；后世皮浪主义主要经蒂孟和塞克斯都·恩披里柯重构，不能全部倒置给他。`},{id:`arcesilaus`,role:`学院怀疑转向`,contribution:`用对置论证攻击斯多葛认知印象，并恢复学院的非独断姿态。`,interaction:`把怀疑方法带入柏拉图学院的制度核心。`},{id:`carneades`,role:`学院方法深化`,contribution:`以不可区分反例削弱确定性，以可信印象为行动建立分级依据。`,interaction:`对斯多葛自然法、正义和责任进行正反两面论证。`}],development:[{period:`前 4—3 世纪`,title:`皮浪与生活原型`,detail:`早期材料稀少；核心形象是面对事物不可判定而不轻率承诺。`},{period:`前 3—2 世纪`,title:`学院怀疑主义`,detail:`阿尔克西劳和卡尔内阿德在学院中以斯多葛知识论为主要论敌。`},{period:`前 1 世纪`,title:`学院转向与分流`,detail:`学院出现较温和、折衷的知识立场；皮浪传统由埃奈西德穆重新激活。`},{period:`公元 2—3 世纪`,title:`塞克斯都的系统保存`,detail:`《皮浪主义纲要》等作品保存模式、反驳和按现象生活的成熟版本。`}],relations:[{target:`斯多葛主义`,relation:`竞争`,detail:`围绕认知印象、同意和行动标准形成古代最精密的认识论争论之一。`},{target:`伊壁鸠鲁主义`,relation:`竞争`,detail:`伊壁鸠鲁派把感觉当作不可反驳的起点；怀疑派追问从感觉到对象本性的推断是否过强。`},{target:`柏拉图主义`,relation:`分化`,detail:`学院怀疑主义属于学院史，却对是否存在正面柏拉图教义保持克制。`},{target:`近代怀疑与经验主义`,relation:`后世重构`,detail:`古代论证经文艺复兴重新传播，进入蒙田、笛卡尔和休谟的问题背景，但用途各不相同。`}],influence:[{field:`认识论`,detail:`把标准、证明责任和同意强度变成独立研究对象。`},{field:`论证训练`,detail:`系统生成相反理由，迫使理论说明自身标准而非只重复结论。`},{field:`行动理性`,detail:`区分确定知识与足够行动依据，为不确定条件下的判断提供模型。`}],russellView:`罗素把怀疑派放在希腊化世界的疲惫与私人安宁追求中，强调皮浪的不动心，并以卡尔内阿德展示学院派对自然法和确定知识的攻击。`,modernCorrection:`若只把怀疑主义理解为文明衰退后的消极症状，会忽略其对知识标准、论证责任和实践合理性的技术贡献。皮浪、学院与后期塞克斯都传统也必须分层，不能互相代换。`,chapterIds:[`b1-25`,`b1-26`],sources:[fe(`第一卷第二十五至二十六章`),{label:`Stanford Encyclopedia · Ancient Skepticism`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/skepticism-ancient/`}]},{id:`epicureanism`,order:7,nameZh:`伊壁鸠鲁主义`,nameEn:`Epicureanism`,kind:`有组织学园 · 生活治疗体系`,period:`前 307/306 年起—罗马帝国时期`,regions:[`雅典花园`,`希腊化世界`,`罗马`],thesis:`以原子论清除神罚与死后恐惧，以欲望分类降低生活成本，再以友谊、审慎和稳定快乐建立可持续的安宁。物理学的最终用途是伦理治疗。`,classificationNote:`伊壁鸠鲁花园拥有明确创始人、共同生活和高度稳定的教义传承，是八页中最接近严格组织学派的类型之一；但不能把德谟克利特直接列为成员，他只是关键思想来源。`,context:{overview:`亚历山大死后，继业者战争和庞大王国取代公民可直接掌控的城邦政治。个人需要一种不以权力、财富和公共成功为条件的幸福技术；花园以小型友谊共同体回应这种不确定。`,factors:[{title:`希腊化政治失距`,detail:`王国规模扩大而个人政治控制感下降，哲学重心转向可在日常生活中实施的稳定。`},{title:`宗教恐惧`,detail:`神意、天象和死后惩罚把不可控制事件解释为针对个人的威胁。`},{title:`花园共同体`,detail:`朋友、书信和共同学习替代权力竞争，女性与奴隶的参与也使其社会形态较为特殊。`}]},architecture:{commonProblem:`人为什么在基本需要并不多时仍持续焦虑？怎样解除对神、死亡、痛苦和欲望无穷扩张的恐惧？`,sharedPremise:`善恶必须与有感觉的生命相关；自然由原子和虚空构成，神若存在也不以惩罚干预世界。`,method:`用自然解释替代神罚解释，用死亡论证拆除想象对象，用欲望分类区分自然必要与空洞欲望，再以审慎计算长期痛苦和快乐。`,answer:`快乐不是不断增强刺激，而是身体无痛与心灵不受扰动；最可靠的条件是节制、友谊、理解自然和降低对外部地位的依赖。`,tensions:[{title:`快乐／节制`,detail:`把伊壁鸠鲁主义等同纵欲会颠倒结构：强烈欲望常增加依赖，稳定快乐反而要求限制。`},{title:`退出政治／共同体`,detail:`远离权力竞争不是孤立个人主义；花园以友谊和互助建立另一种共同生活。`},{title:`原子必然／行动自由`,detail:`偏斜试图打破严格决定链，但它怎样产生负责行动仍是解释难点。`}]},philosophers:[{id:`democritus`,role:`原子论思想来源`,contribution:`提供原子、虚空和非目的性自然解释。`,interaction:`伊壁鸠鲁保留基本物理骨架，却改变认识论、运动理论和伦理目的。`},{id:`epicurus`,role:`花园创立者`,contribution:`把准则学、物理学和伦理学压缩成消除恐惧与管理欲望的完整治疗系统。`,interaction:`以书信、格言和共同体维持稳定传承。`},{id:`lucretius`,role:`拉丁世界的诗性传播者`,contribution:`以《物性论》把原子物理、死亡论证和伦理治疗转化为连续诗性体验。`,interaction:`既保存希腊学说，也使其进入罗马文学和后世欧洲思想。`}],development:[{period:`前 307/306`,title:`雅典花园建立`,detail:`共同生活、教学和书信网络使哲学成为可重复实践。`},{period:`希腊化时期`,title:`教义稳定传播`,detail:`学派重视忠于创始人，以简明纲要帮助记忆物理与伦理之间的关系。`},{period:`前 1 世纪`,title:`进入罗马世界`,detail:`卢克莱修以拉丁诗保存和传播体系；坎帕尼亚等地也形成社群。`},{period:`近代早期`,title:`原子论与世俗伦理复兴`,detail:`文本重新流通后影响自然哲学、宗教批评与功利讨论，但常被改造成不同理论。`}],relations:[{target:`前苏格拉底自然哲学诸传统`,relation:`思想来源`,detail:`从德谟克利特继承原子与虚空，将自然解释直接服务于解除恐惧。`},{target:`斯多葛主义`,relation:`竞争`,detail:`两者都追求安定；伊壁鸠鲁拒绝天意并缩小公共欲望，斯多葛接受宇宙天意与角色责任。`},{target:`犬儒主义`,relation:`竞争`,detail:`两者都降低物质需要，花园选择私密友谊与审慎，犬儒选择公开挑战和激进自足。`},{target:`近代原子论与功利主义`,relation:`后世重构`,detail:`后世吸收自然主义或快乐概念，但未必保留花园的欲望分类和安宁目标。`}],influence:[{field:`哲学治疗`,detail:`四重药等压缩方式把复杂体系转化为可反复调用的恐惧处理工具。`},{field:`自然主义`,detail:`以自然因果解释心灵、死亡与天象，减少超自然惩罚在伦理中的作用。`},{field:`欲望管理`,detail:`区分自然必要、自然非必要与空洞欲望，提供高信息效率的生活决策框架。`}],russellView:`罗素同情伊壁鸠鲁的温和人格、友谊伦理和对宗教恐惧的反抗，同时认为其快乐理想带有动荡时代的退缩和消极性。`,modernCorrection:`‘快乐主义’不等于感官放纵，‘远离政治’也不等于没有社会关系。页面把物理—死亡—欲望—友谊的完整推导放回中心，并区分伊壁鸠鲁本人、罗马传播与近代改造。`,chapterIds:[`b1-25`,`b1-27`],sources:[fe(`第一卷第二十五、二十七章`),{label:`Stanford Encyclopedia · Epicurus`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/epicurus/`}]},{id:`stoicism`,order:8,nameZh:`斯多葛主义`,nameEn:`Stoicism`,kind:`有组织学园 · 跨地域实践传统`,period:`约前 300 年—公元 2 世纪以后`,regions:[`雅典彩绘柱廊`,`罗得岛`,`罗马帝国`],thesis:`逻辑训练同意，物理学说明人处于理性因果整体，伦理学据此把善定位于判断与行动品质：外部命运不能保证幸福，德性却能把人变成整体秩序的主动参与者。`,classificationNote:`斯多葛主义有明确学园传承，但早期著作几乎失传，现存完整文本主要来自罗马时期。‘早期—中期—罗马’是有用压缩，不意味着每阶段内部完全一致。`,context:{overview:`亚历山大帝国解体后，跨地域王国和罗马帝国扩大了共同世界，也削弱个人对政治命运的控制。斯多葛主义由塞浦路斯移民在雅典公共柱廊创立，后经罗得岛与罗马精英网络，转化为世界公民、自然法和角色伦理。`,factors:[{title:`城邦到世界国家`,detail:`政治尺度扩大，使共同理性和世界公民观既像现实经验的抽象，也像对帝国等级的规范批评。`},{title:`学园公开竞争`,detail:`与学院怀疑派、伊壁鸠鲁派的争论迫使知识标准、决定论和善恶理论高度系统化。`},{title:`罗马角色社会`,detail:`元老、皇帝、被释放奴隶和流亡者都借同一伦理处理不同责任，使学说从体系转向角色实践。`}]},architecture:{commonProblem:`在外部事件受命运和他人支配时，什么仍属于人的行动？决定论世界中如何保存责任、自由和公共义务？`,sharedPremise:`宇宙是由物质与主动理性原则构成的因果整体；真正的善只在理性选择的德性，外物虽可选择却不能决定幸福。`,method:`逻辑检验印象，心理学区分印象—同意—冲动—行动，物理学把个人放入自然整体，日常练习再通过预想、复盘和角色提醒改变判断习惯。`,answer:`自由不是逃出因果，而是让行动通过自己的理性同意发生；合乎自然生活把个人理性、共同人性和宇宙秩序连接起来。`,tensions:[{title:`命运／责任`,detail:`一切有原因时，主体仍须作为行动的内在原因；克律西波斯以同意、性格和共命运回应。`},{title:`德性唯一善／现实选择`,detail:`健康财富不是善，却仍有‘可取’差别；理论必须避免把行动选择变成无意义。`},{title:`内在自由／制度改变`,detail:`调整判断能抵抗压迫，也可能被误读成只要求个人忍受不公。`},{title:`统一体系／历史变体`,detail:`中期和罗马作者弱化部分物理学，强化角色、良知和日常训练。`}]},philosophers:[{id:`zeno`,role:`创立者`,contribution:`整合犬儒德性、赫拉克利特宇宙论与辩证训练，提出逻辑—物理—伦理纲领。`,interaction:`克里安西斯继承学园，克律西波斯完成系统化。`},{id:`cleanthes`,role:`保存者与宗教表达者`,contribution:`以《宙斯颂》和宇宙自然强化命运、理性与自愿一致。`,interaction:`把学园交给克律西波斯，其版本更突出整体自然和虔敬。`},{id:`chrysippus`,role:`系统化者`,contribution:`发展命题逻辑、同意心理学与兼容论，使学派具备长期论辩能力。`,interaction:`集中回应学院怀疑主义，并成为后世共同框架。`},{id:`panaetius`,role:`中期转译者`,contribution:`弱化部分争议宇宙论，把伦理转向角色和普通人的恰当行动。`,interaction:`经罗马精英圈及西塞罗，使学派进入公共义务语言。`},{id:`posidonius`,role:`跨学科扩展者`,contribution:`连接自然、情绪、历史与地理，重新重视非理性心理动力。`,interaction:`影响罗马知识网络，但具体教义常由后世间接保存。`},{id:`seneca`,role:`罗马道德写作者`,contribution:`以书信和短论处理财富、愤怒、死亡、权力与每日自省。`,interaction:`把系统教义转化为不完美实践者可重复的训练。`},{id:`epictetus`,role:`同意与控制训练者`,contribution:`把‘取决于我们／不取决于我们’压缩成行动纪律，突出角色与选择能力。`,interaction:`其学生阿里安保存讲课；马可·奥勒留把相关练习用于帝国职责。`},{id:`marcus-aurelius`,role:`帝国角色实践者`,contribution:`以私人笔记反复练习整体视角、死亡意识和对共同体的责任。`,interaction:`不是理论创新者，而是检验斯多葛伦理在最高权力与持续压力下如何运作。`}],development:[{period:`约前 300—前 207`,title:`创立与系统化`,detail:`芝诺提出纲领，克里安西斯保存，克律西波斯建立成熟逻辑、物理和伦理接口。`},{period:`前 2—1 世纪`,title:`中期斯多葛主义`,detail:`帕奈提奥斯和波塞多尼奥斯与柏拉图、亚里士多德传统及罗马公共生活重新接合。`},{period:`公元 1—2 世纪`,title:`罗马实践转向`,detail:`塞涅卡、爱比克泰德和马可·奥勒留留下更完整的伦理训练文本。`},{period:`后世`,title:`自然法、基督教与现代复兴`,detail:`共同理性、良知和内在训练被多次吸收，但常脱离原有物理学与逻辑。`}],relations:[{target:`犬儒主义`,relation:`思想来源`,detail:`继承德性、自足和训练，同时重建逻辑、自然和社会角色。`},{target:`前苏格拉底自然哲学诸传统`,relation:`思想来源`,detail:`把赫拉克利特的火与逻各斯系统化为物质世界中的理性天意。`},{target:`古代怀疑主义`,relation:`竞争`,detail:`认知印象、同意和行动标准在长期争论中共同被精炼。`},{target:`伊壁鸠鲁主义`,relation:`竞争`,detail:`同样治疗恐惧，却以天意和公共角色对抗原子偶然与退隐策略。`},{target:`基督教与近代自然法`,relation:`后世重构`,detail:`普遍理性、世界公民和内在良知被吸收，但人格神、恩典和灵魂观改变了原体系。`}],influence:[{field:`逻辑与语言`,detail:`命题逻辑、条件式和可说之物形成区别于亚里士多德词项逻辑的传统。`},{field:`伦理心理学`,detail:`印象—同意—冲动链把情绪训练和责任放在可分析的判断节点。`},{field:`政治与法律`,detail:`共同理性、自然法和世界公民观为跨城邦规范提供语言。`},{field:`现代实践`,detail:`认知行为取向和现代斯多葛复兴常借其训练方法，但不能直接等同古代完整体系。`}],russellView:`罗素把斯多葛主义视为希腊化—罗马世界最有历史影响的伦理之一，突出决定论、德性唯一善、内在自由、自然法及其通向基督教的桥梁，同时担忧顺从命运会削弱改变现实的动力。`,modernCorrection:`不能用‘控制二分’概括全部时期，也不能把天意决定论直接等同消极宿命。学派的逻辑、物理和伦理原本互相支撑；罗马文本最完整，却不应反向覆盖早期三位领袖的差异。`,chapterIds:[`b1-25`,`b1-28`,`b1-29`],sources:[fe(`第一卷第二十五、二十八至二十九章`),{label:`Stanford Encyclopedia · Stoicism`,kind:`现代研究`,url:`https://plato.stanford.edu/entries/stoicism/`},{label:`Internet Encyclopedia of Philosophy · Stoicism`,kind:`现代研究`,url:`https://iep.utm.edu/stoicism/`}]}],A=e=>k.find(t=>t.nameZh===e||e.startsWith(t.nameZh)||t.nameZh.startsWith(e)),j=e=>A(e)?.order??2**53-1;functio 者，以相反论证和或然性回应知识与实践问题。`},{id:`epicurus`,zh:`伊壁鸠鲁`,en:`Epicurus`,category:`人物`,note:`用原子论、欲望分类和友谊实践解除对神与死亡的恐惧。`},{id:`lucretius`,zh:`卢克莱修`,en:`Lucretius`,category:`人物`,note:`罗马诗人，以《物性论》传播伊壁鸠鲁主义自然观。`},{id:`zeno`,zh:`芝诺`,en:`Zeno of Citium`,category:`人物`,note:`斯多葛学派创始人；不要与提出运动悖论的埃利亚芝诺混淆。`},{id:`cleanthes`,zh:`克里安西斯`,en:`Cleanthes`,category:`人物`,note:`早期斯多葛学派第二任领袖，以《宙斯颂》和自愿顺应命运的思想著称。`},{id:`chrysippus`,zh:`克律西波斯`,en:`Chrysippus`,category:`人物`,note:`早期斯多葛主义的系统化者，发展命题逻辑、决定论与情绪判断理论。`},{id:`panaetius`,zh:`帕奈提奥斯`,en:`Panaetius`,category:`人物`,note:`中期斯多葛主义者，以恰当行动和角色伦理连接希腊学派与罗马公共生活。`},{id:`posidonius`,zh:`波塞多尼奥斯`,en:`Posidonius`,category:`人物`,note:`中期斯多葛主义综合者，把灵魂论、历史、地理和天文学放进宇宙关联体系。`},{id:`seneca`,zh:`塞涅卡`,en:`Seneca`,category:`人物`,note:`罗马斯多葛主义者，把哲学写成面对权力、死亡和情绪的日常操练。`},{id:`epictetus`,zh:`爱比克泰德`,en:`Epictetus`,category:`人物`,note:`强调区分可控制与不可控制之物，把自由安放在判断和意志。`},{id:`aurelius`,zh:`马可·奥勒留`,en:`Marcus Aurelius`,category:`人物`,note:`罗马皇帝和斯多葛作者，以自省记录角色义务与内在自由。`},{id:`plotinus`,zh:`普罗提诺`,en:`Plotinus`,category:`人物`,note:`新柏拉图主义核心人物，以太一、精神和灵魂构造流溢层级。`},{id:`paul`,zh:`保罗`,en:`Paul the Apostle`,category:`人物`,note:`早期基督教宣教者和书信作者，把救赎信息扩展到非犹太人世界。`},{id:`john-evangelist`,zh:`约翰`,en:`John the Evangelist`,category:`人物`,note:`本网站以此名称指《约翰福音》传统所代表的早期基督教神学形象。`},{id:`augustine`,zh:`奥古斯丁`,en:`Saint Augustine`,category:`人物`,note:`把柏拉图主义、内省、意志和基督教救赎史结合起来。`},{id:`benedict`,zh:`本尼狄克`,en:`Saint Benedict`,category:`人物`,note:`其修道规则成为西欧修道共同生活和知识保存的重要制度基础。`},{id:`gregory`,zh:`大格列高利`,en:`Gregory the Great`,category:`人物`,note:`教皇、行政者和传教组织者，体现罗马制度向中世纪教会的转移。`},{id:`eriugena`,zh:`约翰·司各脱`,en:`John Scotus Eriugena`,category:`人物`,alternatives:[`爱留根纳`],note:`九世纪哲学家与译者，强调真正理性与真正启示不会冲突。`},{id:`avicenna`,zh:`阿维森纳`,en:`Avicenna (Ibn Sina)`,category:`人物`,alternatives:[`伊本·西那`],note:`伊斯兰哲学家和医学家，以存在、必然者和灵魂论重释亚里士多德。`},{id:`averroes`,zh:`阿威罗伊`,en:`Averroes (Ibn Rushd)`,category:`人物`,alternatives:[`伊本·鲁世德`],note:`安达卢西亚哲学家，其亚里士多德注释深刻影响拉丁经院哲学。`},{id:`maimonides`,zh:`迈蒙尼德`,en:`Maimonides`,category:`人物`,note:`犹太哲学家，以哲学解释协调摩西传统与亚里士多德思想。`},{id:`aquinas`,zh:`托马斯·阿奎那`,en:`Thomas Aquinas`,category:`人物`,note:`经院哲学综合者，系统划分自然理性与启示神学的范围。`},{id:`roger-bacon`,zh:`罗吉尔·培根`,en:`Roger Bacon`,category:`人物`,note:`方济各会学者，强调语言、数学、观察与实验的重要性。`},{id:`duns-scotus`,zh:`邓斯·司各脱`,en:`Duns Scotus`,category:`人物`,note:`强调个体性、意志和存在概念，是晚期经院哲学的重要转折。`},{id:`ockham`,zh:`奥卡姆`,en:`William of Ockham`,category:`人物`,note:`以唯名论和简约原则限制经院体系的实体与证明负担。`},{id:`machiavelli`,zh:`马基雅维利`,en:`Machiavelli`,category:`人物`,note:`把政治权力、稳定与行动后果从完整神学伦理中相对分离。`},{id:`luther`,zh:`路德`,en:`Martin Luther`,category:`人物`,note:`宗教改革核心人物，强调信仰、经文和个人良心。`},{id:`copernicus`,zh:`哥白尼`,en:`Copernicus`,category:`人物`,note:`以日心模型重组天文学，动摇传统宇宙秩序。`},{id:`kepler`,zh:`开普勒`,en:`Kepler`,category:`人物`,note:`以行星椭圆轨道和数学定律推进新天文学。`},{id:`galileo`,zh:`伽利略`,en:`Galileo`,category:`人物`,note:`结合数学、实验和望远镜观察，改变自然研究的证据标准。`},{id:`francis-bacon`,zh:`弗朗西斯·培根`,en:`Francis Bacon`,category:`人物`,note:`倡导系统观察、归纳和协作研究；不要与罗吉尔·培根混淆。`},{id:`hobbes`,zh:`霍布斯`,en:`Thomas Hobbes`,category:`人物`,note:`从恐惧、契约和机械论出发论证不可分割的主权。`},{id:`descartes`,zh:`笛卡尔`,en:`René Descartes`,category:`人物`,note:`以方法性怀疑和“我思”重建现代知识的主体起点。`},{id:`spinoza`,zh:`斯宾诺莎`,en:`Baruch Spinoza`,category:`人物`,note:`以单一实体和必然性体系重新理解自然、上帝与自由。`},{id:`leibniz`,zh:`莱布尼茨`,en:`Gottfried Wilhelm Leibniz`,category:`人物`,note:`以单子、充足理由和预定和谐构造理性主义体系。`},{id:`locke`,zh:`洛克`,en:`John Locke`,category:`人物`,note:`经验主义和自由主义的重要奠基者，反对天赋观念与绝对权力。`},{id:`berkeley`,zh:`贝克莱`,en:`George Berkeley`,category:`人物`,note:`以“存在就是被感知”批评物质实体观念。`},{id:`hume`,zh:`休谟`,en:`David Hume`,category:`人物`,note:`把经验主义推向怀疑结论，重构因果、自我和归纳问题。`},{id:`rousseau`,zh:`卢梭`,en:`Jean-Jacques Rousseau`,category:`人物`,note:`以文明批判、社会契约和公意重塑现代自由问题。`},{id:`kant`,zh:`康德`,en:`Immanuel Kant`,category:`人物`,note:`研究经验何以可能，并区分现象知识与实践自由。`},{id:`hegel`,zh:`黑格尔`,en:`G. W. F. Hegel`,category:`人物`,note:`以辩证法和历史整体解释理性与自由的制度展开。`},{id:`schopenhauer`,zh:`叔本华`,en:`Arthur Schopenhauer`,category:`人物`,note:`把世界理解为表象与盲目意志，形成悲观主义体系。`},{id:`byron`,zh:`拜伦`,en:`Lord Byron`,category:`人物`,note:`浪漫主义诗人；罗素用他呈现反习俗、英雄化个人主义的文化类型。`},{id:`nietzsche`,zh:`尼采`,en:`Friedrich Nietzsche`,category:`人物`,note:`以谱系和心理分析追问价值来源，并诊断现代虚无主义。`},{id:`bentham`,zh:`边沁`,en:`Jeremy Bentham`,category:`人物`,note:`以最大幸福原则系统化功利主义，并推动法律与制度改革。`},{id:`mill`,zh:`约翰·斯图亚特·密尔`,en:`John Stuart Mill`,category:`人物`,alternatives:[`穆勒`],note:`发展功利主义、自由论与代议政治，同时强调个性和思想实验。`},{id:`marx`,zh:`马克思`,en:`Karl Marx`,category:`人物`,note:`从生产关系、阶级与实践解释历史结构及其改变。`},{id:`william-james`,zh:`威廉·詹姆斯`,en:`William James`,category:`人物`,note:`实用主义代表，以经验与实践后果讨论真理和信念。`},{id:`dewey`,zh:`约翰·杜威`,en:`John Dewey`,category:`人物`,note:`把认识理解为环境中的探究与调整，并应用于民主教育。`},{id:`frege`,zh:`弗雷格`,en:`Gottlob Frege`,category:`人物`,note:`现代逻辑奠基者之一，对语言、数学基础和分析哲学影响深远。`},{id:`russell`,zh:`罗素`,en:`Bertrand Russell`,category:`人物`,note:`本书作者，也是现代逻辑分析哲学的重要代表。`},{id:`miletus`,zh:`米利都`,en:`Miletus`,category:`地名`,note:`小亚细亚爱奥尼亚商业城邦，米利都学派的思想中心。`},{id:`ionia`,zh:`爱奥尼亚`,en:`Ionia`,category:`地名`,note:`小亚细亚西岸希腊地区，连接爱琴海与近东知识网络。`},{id:`athens-place`,zh:`雅典`,en:`Athens`,category:`地名`,note:`古典时期民主、修辞、戏剧和哲学学园的主要中心。`},{id:`alexandria`,zh:`亚历山大里亚`,en:`Alexandria`,category:`地名`,alternatives:[`亚历山大城`],note:`希腊化与罗马时期重要的图书、科学和多宗教思想中心。`},{id:`rome`,zh:`罗马`,en:`Rome`,category:`地名`,note:`既指城市，也常指共和国或帝国制度；语境需分别判断。`},{id:`milesian`,zh:`米利都学派`,en:`Milesian School`,category:`学派`,note:`用自然本原而非神话谱系解释世界的早期哲学传统。`},{id:`cynicism`,zh:`犬儒派`,en:`Cynics / Cynicism`,category:`学派`,note:`以减少需要和反习俗生活追求不受外物支配的自由。`},{id:`scepticism`,zh:`怀疑派`,en:`Sceptics / Scepticism`,category:`学派`,alternatives:[`怀疑主义`],note:`通过为相反判断提供理由并悬置断言，降低精神扰动。`},{id:`epicureanism`,zh:`伊壁鸠鲁派`,en:`Epicureans / Epicureanism`,category:`学派`,alternatives:[`伊壁鸠鲁主义`],note:`把快乐理解为无痛与宁静，以自然知识解除恐惧。`},{id:`stoicism`,zh:`斯多葛主义`,en:`Stoicism`,category:`学派`,alternatives:[`斯多葛派`],note:`强调德性、自然秩序、判断训练和内在自由。`},{id:`neoplatonism`,zh:`新柏拉图主义`,en:`Neoplatonism`,category:`学派`,note:`以太一、精神和灵魂的层级重新解释柏拉图传统。`},{id:`scholasticism`,zh:`经院哲学`,en:`Scholasticism`,category:`学派`,note:`中世纪大学中以问题、反对、回答和反驳组织知识的专业传统。`},{id:`rationalism`,zh:`理性主义`,en:`Rationalism`,category:`学派`,note:`以理性原则和演绎体系作为知识的重要基础。`},{id:`empiricism`,zh:`经验主义`,en:`Empiricism`,category:`学派`,note:`要求观念和知识最终说明其经验来源与证据。`},{id:`romanticism`,zh:`浪漫主义`,en:`Romanticism`,category:`学派`,note:`强调个性、情感、创造和自然，反抗机械理性与抽象秩序。`},{id:`utilitarianism`,zh:`功利主义`,en:`Utilitarianism`,category:`学派`,note:`按行动或制度对总体幸福的后果进行伦理评价。`},{id:`pragmatism`,zh:`实用主义`,en:`Pragmatism`,category:`学派`,note:`通过观念在经验、行动和共同探究中的作用理解意义与真理。`},{id:`analytic`,zh:`分析哲学`,en:`Analytic Philosophy`,category:`学派`,note:`重视逻辑、语言和概念澄清，反对含混的宏大体系。`},{id:`arche`,zh:`本原`,en:`archē / first principle`,category:`概念`,alternatives:[`始基`],note:`早期希腊哲学中万物由之生成或得到统一解释的根本原则。`},{id:`logos`,zh:`逻各斯`,en:`logos`,category:`概念`,alternatives:[`理则`,`道`],note:`可指言说、理由或秩序；在赫拉克利特和基督教语境中含义不同。`},{id:`non-being`,zh:`非存在`,en:`what-is-not / non-being`,category:`概念`,note:`巴门尼德认为它不能被认识或充当生成来源；原子论则以虚空重新处理“无”的地位。`},{id:`four-roots`,zh:`四根`,en:`four roots`,category:`概念`,note:`恩培多克勒所说火、气、水、土四种不生不灭的基本成分；后世常称四元素。`},{id:`nous`,zh:`努斯`,en:`Nous / Mind`,category:`概念`,note:`阿那克萨哥拉体系中不与其他成分混合、具有知识并启动宇宙旋转的原则。`},{id:`atom`,zh:`原子`,en:`atomon / atom`,category:`概念`,note:`古代原子论中不可切分、不生不灭的基本实体；不能与现代物理学原子直接等同。`},{id:`void`,zh:`虚空`,en:`void`,category:`概念`,note:`原子之间允许分离和运动的空无间隔，是原子论对埃利亚存在论的关键修正。`},{id:`euthymia`,zh:`心灵安宁`,en:`euthymia / cheerfulness`,category:`概念`,note:`德谟克利特所重视的稳定愉悦状态，通过衡量、节制与判断训练获得。`},{id:`virtue`,zh:`德性`,en:`virtue / aretē`,category:`概念`,alternatives:[`美德`],note:`不仅是道德善，也可指一种事物或人的卓越能力。`},{id:`man-measure`,zh:`人是尺度`,en:`man-measure thesis`,category:`概念`,note:`普罗泰戈拉命题的简写；既可讨论感知相对性，也可能扩展到价值判断和公共论辩。`},{id:`elenchus`,zh:`反诘`,en:`elenchus / refutation`,category:`概念`,note:`苏格拉底式问答中通过追问一个人的承诺，显露其信念之间矛盾的方法。`},{id:`maieutic`,zh:`助产术`,en:`maieutic method`,category:`概念`,note:`柏拉图作品用助产比喻描述苏格拉底帮助对话者检验并产生思想；不等于直接传授结论。`},{id:`ideas-forms`,zh:`理念`,en:`Ideas / Forms`,category:`概念`,alternatives:[`形式`,`理型`],note:`柏拉图语境中可知、稳定且作为具体事物标准的存在；英译常用 Forms。`},{id:`philosopher-ruler`,zh:`哲学王`,en:`philosopher-ruler`,category:`概念`,note:`《理想国》中把关于善的知识与统治责任结合的政治角色，并非现代意义上由学者直接执政。`},{id:`matter-form`,zh:`质料与形式`,en:`matter and form / hylomorphism`,category:`概念`,note:`亚里士多德用以分析具体实体的成分与组织原则；两者通常不能作为独立物简单拼接。`},{id:`potential-actual`,zh:`潜能与现实`,en:`potentiality and actuality`,category:`概念`,note:`说明一个能力或可能结构如何在适当条件下实现，也是亚里士多德解释变化的核心区分。`},{id:`four-causes`,zh:`四因`,en:`four causes`,category:`概念`,note:`质料、形式、动力和目的四种‘为何如此’的回答维度，不只是四个相互竞争的事件原因。`},{id:`doctrine-mean`,zh:`中道`,en:`doctrine of the mean`,category:`概念`,note:`亚里士多德把许多德性理解为相对于行动者和处境、经实践理性确定的适度，而非算术平均。`},{id:`autarkeia`,zh:`自足`,en:`autarkeia / self-sufficiency`,category:`概念`,note:`减少对财富、名望和外在条件的依赖；犬儒派把它推进为可见的生活实践。`},{id:`parrhesia`,zh:`直言`,en:`parrhēsia / frank speech`,category:`概念`,note:`冒着社会代价公开说真话的实践，在犬儒派那里与反习俗生活相互支持。`},{id:`epoche`,zh:`悬置判断`,en:`epochē / suspension of judgment`,category:`概念`,note:`在理由势均力敌或标准不足时不作断言；古代不同怀疑主义传统对其范围与理由并不完全相同。`},{id:`ataraxia`,zh:`不动心`,en:`ataraxia / tranquility`,category:`概念`,alternatives:[`心灵宁静`],note:`免于精神扰动的稳定状态；怀疑派与伊壁鸠鲁派都重视它，但达到路径不同。`},{id:`kataleptic-impression`,zh:`认知印象`,en:`kataleptic impression`,category:`概念`,note:`斯多葛派设想能以自身特征保证真确来源的印象；阿尔克西劳以不可区分的误印象攻击这一标准。`},{id:`persuasive-impression`,zh:`可信印象`,en:`persuasive impression / pithanē phantasia`,category:`概念`,note:`卡尔内阿德为行动提出的可接受表象，可进一步检查是否稳定且与相关表象协调，但不升级为确定知识。`},{id:`aponia`,zh:`无痛`,en:`aponia / absence of bodily pain`,category:`概念`,note:`伊壁鸠鲁所谓身体快乐的稳定界限，与心灵的不动心共同构成不受扰动的生活。`},{id:`atomic-swerve`,zh:`原子偏斜`,en:`clinamen / atomic swerve`,category:`概念`,note:`伊壁鸠鲁传统中原子运动的微小无定时偏离，用来解释碰撞及行动不被严格机械必然性穷尽。`},{id:`substance`,zh:`实体`,en:`substance`,category:`概念`,note:`能独立存在或作为属性承担者的东西；亚里士多德、笛卡尔和斯宾诺莎定义不同。`},{id:`soul`,zh:`灵魂`,en:`soul / psychē`,category:`概念`,note:`古希腊可指生命原则，基督教和近代语境则更强调人格与不朽。`},{id:`the-one`,zh:`太一`,en:`the One`,category:`概念`,alternatives:[`一者`],note:`普罗提诺体系中超越存在与思想、万物由之流出的最高原则。`},{id:`natural-law`,zh:`自然法`,en:`natural law`,category:`概念`,note:`依据共同理性或人性而成立、并非只由地方成文法创造的规范。`},{id:`free-will`,zh:`自由意志`,en:`free will`,category:`概念`,note:`人是否能成为行动来源；在奥古斯丁那里与罪、预知和恩典相连。`},{id:`grace`,zh:`恩典`,en:`grace`,category:`概念`,alternatives:[`恩宠`],no
